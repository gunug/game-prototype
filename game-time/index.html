<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시간 · 틱 전투 프로토타입</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFD400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  .container{max-width:1120px;}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);
    margin-bottom:var(--s5);flex-wrap:wrap;}
  .top h1{font-size:30px;margin:0;}
  .top p{color:var(--muted);font-size:14px;margin:6px 0 0;}
  .back{font-size:13px;color:var(--muted);text-decoration:none;}
  .back:hover{color:var(--brand-yellow);}

  .tabs{display:flex;gap:var(--s2);margin-bottom:var(--s4);flex-wrap:wrap;
    align-items:center;}
  .tab{font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;
    padding:8px 16px;border-radius:var(--r-pill);border:1px solid var(--hairline);
    background:var(--surface);color:var(--muted);transition:.12s;}
  .tab:hover{border-color:var(--brand-yellow-deep);color:var(--ink);}
  .tab.on{background:var(--brand-yellow);border-color:var(--brand-yellow);
    color:var(--on-brand);}
  .tabs .why{font-size:12px;color:var(--muted);margin-left:var(--s2);}

  .layout{display:grid;grid-template-columns:1fr 280px;gap:var(--s4);align-items:start;}
  @media(max-width:920px){.layout{grid-template-columns:1fr;}}

  .panel{background:var(--surface);border:1px solid var(--hairline);
    border-radius:var(--r-lg);padding:var(--s4);}
  .panel + .panel{margin-top:var(--s4);}
  .panel h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:0 0 var(--s3);font-weight:600;}

  /* ---- 무대 ---- */
  .stage{position:relative;}
  #arena{display:block;width:100%;height:460px;border-radius:var(--r-md);
    background:#0D0D0B;border:1px solid var(--hairline);}
  @media(max-width:620px){#arena{height:340px;}}

  .hud{position:absolute;top:10px;left:12px;right:12px;display:flex;
    justify-content:space-between;pointer-events:none;font-size:12px;
    font-variant-numeric:tabular-nums;}
  .hud b{color:var(--ink);font-weight:700;}
  .hud .l,.hud .r{background:rgba(13,13,11,.72);border:1px solid var(--hairline);
    border-radius:var(--r-pill);padding:4px 12px;color:var(--muted);}

  .fcast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    display:flex;gap:10px;align-items:center;white-space:nowrap;
    background:rgba(13,13,11,.9);border:1px solid var(--hairline);
    border-radius:var(--r-pill);padding:7px 16px;font-size:12px;
    font-variant-numeric:tabular-nums;pointer-events:none;box-shadow:var(--sh-md);}
  .fcast[hidden]{display:none;}
  .fcast .nm{font-weight:700;color:var(--ink);}
  .fcast .good{color:#86DFAE;font-weight:600;}
  .fcast .bad{color:#FF9E8E;font-weight:700;}
  .fcast .warn{color:#D8B45E;font-weight:700;}
  .fcast .dim{color:var(--muted);}

  .over{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:var(--s3);
    background:rgba(13,13,11,.82);border-radius:var(--r-md);}
  .over[hidden]{display:none;}
  .over h3{margin:0;font-size:30px;color:var(--brand-yellow);}
  .over p{margin:0;font-size:13px;color:var(--muted);}

  .legend{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s3);
    font-size:11px;color:var(--muted);align-items:center;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend .sw{width:14px;height:2px;border-radius:2px;display:inline-block;}
  .sw-step{background:#7FD4EC;} .sw-back{background:#86DFAE;}
  .sw-side{background:#B9A8F0;} .sw-attack{background:#FF9E8E;}
  .sw-whirl{background:#FFC489;} .sw-new{background:#FFD400;}
  .legend .tip{margin-left:auto;opacity:.75;}

  /* ---- 손패 · 카드 ---- */
  .handrow{display:flex;gap:var(--s3);align-items:center;}
  .hand{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s2);}
  @media(max-width:560px){.hand{grid-template-columns:repeat(3,1fr);}
    .handrow{flex-wrap:wrap;}}

  .pc{aspect-ratio:5/7;background:var(--surface-soft);
    border:1px solid var(--hairline);border-top:3px solid var(--hairline);
    border-radius:var(--r-md);padding:8px 9px;cursor:pointer;text-align:left;
    display:flex;flex-direction:column;overflow:hidden;
    transition:transform .12s,border-color .12s,box-shadow .12s;
    font-family:var(--font);color:var(--body);box-shadow:var(--sh-sm);
    touch-action:none;user-select:none;-webkit-user-select:none;}
  .pc:hover:not(:disabled){border-color:var(--brand-yellow);
    transform:translateY(-8px);box-shadow:var(--sh-md);}
  .pc:not(:disabled){cursor:grab;}
  .pc:not(:disabled):active{cursor:grabbing;}
  .pc:disabled{opacity:.35;cursor:not-allowed;}
  .pc .nm{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;
    font-size:14px;font-weight:700;color:var(--ink);line-height:1.2;}
  .pc .tk{flex:none;font-size:10px;font-weight:800;padding:2px 6px;
    border-radius:var(--r-pill);background:var(--brand-yellow);color:var(--on-brand);}
  .pc .tx{margin-top:auto;font-size:10px;line-height:1.35;color:var(--muted);}
  .pc.k-step{border-top-color:#2E5A69;}
  .pc.k-back{border-top-color:#2F5C42;}
  .pc.k-side{border-top-color:#453A6B;}
  .pc.k-attack{border-top-color:#7A3A34;}
  .pc.k-whirl{border-top-color:#7A542C;}
  .pc.k-wait{border-top-color:#3A3A31;}
  .pc.slot{opacity:.12;cursor:default;box-shadow:none;
    background:none;border-style:dashed;border-top-color:var(--hairline);}

  .pile{flex:none;width:60px;aspect-ratio:5/7;border-radius:var(--r-md);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border:1px solid var(--hairline);position:relative;}
  .pile .pn{font-size:10px;color:var(--muted);letter-spacing:.05em;}
  .pile b{font-size:18px;font-weight:800;color:var(--ink);}
  .pile.deck{background:repeating-linear-gradient(45deg,#1F1F1A 0 5px,#26261F 5px 10px);
    box-shadow:3px 3px 0 var(--surface), 4px 4px 0 var(--hairline);}
  .pile.grave{background:#17170F;border-style:dashed;
    transition:transform .12s,border-color .12s,box-shadow .12s,background .12s;}
  .pile.grave.hot{border-color:var(--brand-yellow);border-style:solid;
    background:#2A2318;transform:scale(1.12);
    box-shadow:0 0 0 3px rgba(255,212,0,.18), var(--sh-md);}
  .pile.grave.hot .pn,.pile.grave.hot b{color:var(--brand-yellow);}
  .pile.grave.hot::after{content:'버리기 1틱';position:absolute;
    left:50%;transform:translateX(-50%);bottom:-20px;white-space:nowrap;
    font-size:10px;font-weight:700;color:var(--brand-yellow);}

  #ghosts{position:fixed;inset:0;pointer-events:none;z-index:60;}
  .ghost{position:absolute;left:0;top:0;transform-origin:0 0;
    aspect-ratio:auto;will-change:transform,opacity;
    transition-property:transform,opacity;
    transition-timing-function:cubic-bezier(.25,.9,.3,1);
    box-shadow:var(--sh-lg);}
  .ghost.held{transition:opacity .12s;border-color:var(--brand-yellow);
    box-shadow:0 18px 40px rgba(0,0,0,.6);}

  .ctrl{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3);align-items:center;}
  .ctrl .spacer{flex:1;}
  .hint{font-size:12px;color:var(--muted);}

  /* ---- 우측 ---- */
  .stat{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;
    border-bottom:1px solid var(--hairline);}
  .stat:last-child{border-bottom:none;}
  .stat b{color:var(--ink);font-weight:600;}
  .hpbar{height:8px;border-radius:var(--r-pill);background:#2A2A22;overflow:hidden;margin:6px 0 var(--s3);}
  .hpbar i{display:block;height:100%;background:var(--brand-yellow);transition:width .25s;}

  .log{font-size:12px;line-height:1.6;max-height:230px;overflow-y:auto;
    color:var(--body);font-variant-numeric:tabular-nums;}
  .log div{padding:2px 0;border-bottom:1px solid #1F1F1A;}
  .log .t{color:var(--muted);display:inline-block;width:42px;}
  .log .hit{color:#FF9E8E;}
  .log .mv{color:#7FD4EC;}
  .log .bad{color:#D8B45E;}
  .log .kill{color:#86DFAE;font-weight:600;}
  .log .sys{color:var(--muted);}
</style>
</head>
<body>
<main class="container">
  <div class="top">
    <div>
      <a class="back" href="../index.html">← 프로토타입 목록</a>
      <h1>⏱️ 시간</h1>
      <p>카드를 무대로 끌어다 놓으면 그 틱만큼 시간이 흐른다. 무덤에 놓으면 버리고 한 틱. — 섬멸</p>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="layout">
    <div>
      <div class="panel">
        <div class="stage">
          <canvas id="arena"></canvas>
          <div class="hud">
            <span class="l">남은 몹 <b id="hMobs">0</b></span>
            <span class="r">경과 <b id="hTick">0</b>틱</span>
          </div>
          <div class="fcast" id="fcast" hidden></div>
          <div class="over" id="over" hidden>
            <h3 id="overT">섬멸</h3>
            <p id="overP"></p>
            <button class="btn btn-primary btn-sm" id="again">다시</button>
          </div>
        </div>
        <div class="legend">
          <span><i class="sw sw-step"></i>앞걸음</span>
          <span><i class="sw sw-back"></i>뒷걸음</span>
          <span><i class="sw sw-side"></i>옆걸음</span>
          <span><i class="sw sw-attack"></i>공격 · 사격</span>
          <span><i class="sw sw-whirl"></i>선풍 (주위)</span>
          <span><i class="sw sw-new"></i>새로 걸림</span>
          <span class="tip">카드를 들면 흐린 것은 안 맞음 · 굵은 것은 맞음 · 노란 것은 새로 걸림</span>
        </div>
      </div>

      <div class="panel">
        <h2>손패 <span id="handInfo" style="text-transform:none;letter-spacing:0"></span></h2>
        <div class="handrow">
          <div class="pile deck" id="deckPile"><span class="pn">덱</span><b id="sDeck">0</b></div>
          <div class="hand" id="hand"></div>
          <div class="pile grave" id="gravePile"><span class="pn">무덤</span><b id="sDisc">0</b></div>
        </div>
        <div class="ctrl">
          <button class="btn btn-secondary btn-sm" id="reset">초기화</button>
          <span class="spacer"></span>
          <span class="hint" id="hint"></span>
        </div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2>플레이어</h2>
        <div class="hpbar"><i id="php" style="width:100%"></i></div>
        <div class="stat"><span>체력</span><b id="sHp">20 / 20</b></div>
        <div class="stat"><span>공격력</span><b>3</b></div>
        <div class="stat"><span>사거리</span><b>4걸음</b></div>
        <div class="stat"><span>조준각</span><b>정면 ±1눈금 (30°)</b></div>
        <div class="stat"><span>이동거리</span><b>3걸음</b></div>
        <div class="stat"><span>회피거리</span><b>4걸음</b></div>
        <div class="stat"><span>선회</span><b>옆으로 2걸음</b></div>
        <div class="stat"><span>가까운 적까지</span><b id="sDist">–</b></div>
      </div>

      <div class="panel">
        <h2>기록</h2>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <div id="ghosts"></div>
</main>

<script>
(() => {
'use strict';

/* ============================================================
   상수
   ============================================================ */
const D2R = Math.PI / 180;
const HAND_SIZE = 5;          // 손패. 한 장 던지면 한 장 즉시 보충
const TICK_MS = 190;          // 한 틱 재생 시간

/* 시간의 단위가 틱이듯, 거리의 단위는 걸음이다. 자가 하나뿐이다 — 각도는 안 쓴다.
   공격은 모양이 아니라 직사각형 세 수로 적는다.
     앞 fwd · 뒤 bwd · 옆 side   (전부 걸음, 중심에서 가장자리까지)
   그래서 걸음 카드와 공격 크기를 그냥 견줄 수 있다.
     옆걸음 2 vs 옆 1  → 한 번에 벗어남
     옆걸음 2 vs 옆 2  → 아슬아슬
     옆걸음 2 vs 옆 3  → 두 번이면 벗어남
   정수 단위라고 격자가 되는 것은 아니다 — 정해지는 것은 양이지 자리가 아니다. */
const CONTACT = 2;            // 이보다 가까이 못 붙는다 (몸통 지름)

// 카드 = 이름 + 틱 수 하나. 공격 계열은 마지막 틱에 발동한다.
/* 기술 — 모양과 틱만 정한다. 나와 몹이 같은 기술을 쓴다.
   피해는 기술이 아니라 그 액터의 공격력에서 온다.
   전방위든 빔이든 전방이든 같은 규칙이다. 숫자만 다르다. */
const SKILLS = {
  slash: { skill:'slash', name:'베기',   ticks:3, fwd:4, bwd:0, side:2 },
  shot:  { skill:'shot',  name:'발사',   ticks:2, fwd:8, bwd:0, side:1 },
  sweep: { skill:'sweep', name:'휩쓸기', ticks:4, fwd:3, bwd:3, side:2 },
};

/* 형용사 — 누구를 몇이나 치는지.
     무차별        아군도 맞는다 (없으면 상대편만)
     범위 · 단일 · N명   범위 안 몇을 치나 (targets 0 · 1 · N)
   이름에는 안 붙인다. 이름은 기술 그대로 두고 설명에 적는다.
   `adj` 로 꺼내 쓴다. */
function skillOf(id, opt){
  opt = opt || {};
  const base = SKILLS[id];
  const t = opt.targets == null ? 0 : opt.targets;
  const adj = (opt.hitsAll ? '무차별 · ' : '') +
              (t === 0 ? '범위' : t === 1 ? '단일' : t + '명');
  return Object.assign({}, base, {
    kind:'attack', adj:adj, targets:t,
    hitsAll:!!opt.hitsAll, allyDmg:opt.allyDmg,
  });
}

const CARDS = {
  step:   { id:'step',   name:'앞걸음', ticks:2, kind:'step', needsTarget:true,
            brief:'대상에게로<br>3걸음<br>그쪽을 본다',
            text:'2틱에 걸쳐 대상을 향해 3걸음. 그쪽을 본다' },
  back:   { id:'back',   name:'뒷걸음', ticks:1, kind:'back', needsTarget:true,
            brief:'대상 반대로<br>4걸음<br>마주 본 채',
            text:'대상의 반대로 곧게 4걸음. 계속 마주 본다' },
  side:   { id:'side',   name:'옆걸음', ticks:1, kind:'side', needsTarget:true,
            brief:'대상과 수직으로<br>2걸음<br>거리 거의 유지',
            text:'대상 방향에 수직으로 곧게 2걸음. 거리는 거의 그대로다' },
};

// 공격 카드 셋. 기술에 형용사를 얹어 만든다.
CARDS.attack = Object.assign(skillOf('slash', { targets:0 }),
  { id:'attack', needsTarget:true,
    brief:'앞 4 · 옆 2<br>범위<br>대상 쪽으로 돌아',
    text:'베기 — 범위. 3틱 뒤, 대상 쪽으로 돌아서 벤다. 앞 4걸음 · 옆 2걸음 · 안에 든 모두' });
CARDS.shoot = Object.assign(skillOf('shot', { targets:1 }),
  { id:'shoot', needsTarget:true,
    brief:'앞 8 · 옆 1<br>단일<br>대상 쪽으로 돌아',
    text:'발사 — 단일. 2틱 뒤, 대상 쪽으로 돌아 곧게 쏜다. 앞 8걸음 · 옆 1걸음 · 가장 가까운 하나' });
CARDS.whirl = Object.assign(skillOf('sweep', { targets:0 }),
  { id:'whirl', needsTarget:true,
    brief:'앞뒤 3 · 옆 2<br>범위<br>대상 쪽으로 돌아',
    text:'휩쓸기 — 범위. 4틱 뒤, 앞뒤 3걸음 · 옆 2걸음 안 모두를 휩쓴다' });

// 버리기 — 카드가 아니라 행동이다. 아무 카드나 무덤에 떨구면 이것이 된다.
// 옛 대기 카드를 대신한다. 같은 1틱인데 죽은 패까지 치운다.
const TOSS = { id:'toss', name:'버리기', ticks:1, kind:'wait', needsTarget:false,
               brief:'한 틱 흘림<br>패를 하나 치움',
               text:'카드를 무덤에 버리고 한 틱 흘린다' };

const MOVE_KINDS   = { step:1, back:1, side:1 };
const ATTACK_KINDS = { attack:1 };

const PLAYER_BASE = {
  hp:20, maxHp:20, atk:3, aims:true,   // aims = 공격 예고를 시작할 때 조준하는가
  fwdStep:3, backStep:4, sideStep:2,
};

/* 몹 종류. 행동도 카드와 같은 그릇을 쓴다.
   atkAct 를 갈아 끼우는 것만으로 성격이 바뀐다 — 체력과 피해를 키우지 않는다. */
const KINDS = {
  // 졸개 — 다가와서 친다. 그게 전부다.
  grunt: {
    id:'grunt', name:'졸개', hp:6, maxHp:6, atk:2, aims:true, recover:1,
    fwdStep:2, backStep:0, sideStep:0,
    size:1, skin:'#7A6B52', skin2:'#9C8A6A',
    atkAct:skillOf('slash', { targets:0 }),
    moveAct:{ kind:'step', name:'다가옴', ticks:2 },
  },
  // 무식한 놈 — 곧게 쓸어버린다. 제 아군도 같이 맞는다.
  brute: {
    id:'brute', name:'무식한 놈', hp:16, maxHp:16, atk:5, aims:true, recover:3,
    fwdStep:2, backStep:0, sideStep:0,
    size:1.55, skin:'#6B4652', skin2:'#A06A78',
    atkAct:skillOf('shot', { targets:0, hitsAll:true, allyDmg:0.5 }),
    moveAct:{ kind:'step', name:'다가옴', ticks:3 },
  },
};
const GRUNT = KINDS.grunt;                 // 옛 이름
const GRUNT_ATTACK = KINDS.grunt.atkAct;
const GRUNT_MOVE   = KINDS.grunt.moveAct;

/* 전장. 탭으로 고른다. */
const STAGES = [
  { id:'grunts', name:'졸개 셋',
    hint:'다가와 치는 졸개 셋. 예고를 읽고 흘려라.',
    spots:[['grunt',0.10,10], ['grunt',0.45,9], ['grunt',0.78,11]] },
  { id:'brute', name:'무식한 놈',
    hint:'쓸어내기는 제 아군도 벤다. 줄을 맞춰 유도해라.',
    // 거리를 벌려 파도처럼 들어오게 한다. 한꺼번에 붙으면 손쓸 새가 없다.
    spots:[['brute',0.00,13],
           ['grunt',0.06,8],  ['grunt',0.28,11],
           ['grunt',0.55,15], ['grunt',0.80,18]] },
];
let stageIdx = 0;

/* ============================================================
   상태
   ============================================================ */
let player, mobs, deck, hand, discard, log;
let clock, phase;                 // phase: 'idle' | 'run' | 'over'
let anim = null, pendingDraw = [], hoverCard = null;

// 타격 연출 — 액터 열쇠('p' 또는 몹 번호)마다 시작 시각을 적는다
const FX_HIT = 260, FX_DMG = 340;
let fx = { hit:{}, dmg:{} }, fxLoop = false;
function fxActive(){
  const now = performance.now();
  const live = m => Object.keys(m).some(k => now - m[k] < 400);
  return live(fx.hit) || live(fx.dmg);
}
function fxPump(){
  if (fxLoop) return;
  fxLoop = true;
  const run = () => {
    paint();
    if (phase !== 'run' && fxActive()) requestAnimationFrame(run);
    else fxLoop = false;
  };
  requestAnimationFrame(run);
}

// 드래그 — 카드를 집어 무대에 떨군다
let drag = null;

const $ = id => document.getElementById(id);
const cv = $('arena'), ctx = cv.getContext('2d');

function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

function livingMobs(){ return mobs.filter(m => m.hp > 0); }
function foesOf(a){ return a === player ? livingMobs() : [player]; }
function nearestFoe(a){
  let best = null, bd = Infinity;
  for (const f of foesOf(a)){
    if (f.hp <= 0) continue;
    const d = dist(a, f);
    if (d < bd){ bd = d; best = f; }
  }
  return best;
}

/* ============================================================
   덱
   ============================================================ */
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function drawUp(){
  const before = hand.length;
  while (hand.length < HAND_SIZE){
    if (!deck.length){
      if (!discard.length) break;
      deck = shuffle(discard); discard = [];
      addLog('sys', clock, '덱이 비어 무덤을 섞음');
    }
    hand.push(deck.pop());
  }
  for (let i = before; i < hand.length; i++) pendingDraw.push(i);
}

/* ============================================================
   행동 — 나와 몹이 같은 그릇을 쓴다
   act = { kind, name, ticks, left, mv }
     left = 끝날 때까지 남은 틱. 몹 머리 위 숫자가 이것이다.
   ============================================================ */
// target 을 안 주면 가장 가까운 적을 쓴다 (몹은 늘 이쪽이다)
function startAct(a, card, target){
  const foe = (target && target.hp > 0) ? target : nearestFoe(a);
  const act = { kind:card.kind, name:card.name, ticks:card.ticks,
                left:card.ticks, mv:null, target:foe,
                fwd:card.fwd, bwd:card.bwd, side:card.side, skill:card.skill,
                adj:card.adj,
                dmg:card.dmg, targets:card.targets || 0,
                hitsAll:!!card.hitsAll, allyDmg:card.allyDmg };
  a.act = act;
  if (MOVE_KINDS[act.kind]){
    planMove(a, act);
  } else if (ATTACK_KINDS[act.kind]){
    // 예고를 시작할 때 대상 쪽으로 조준한다. 그 뒤 발동까지 방향은 굳는다.
    // 선풍은 전방위라 조준을 안 쓰므로 방향을 건드리지 않는다.
    if (a.aims && foe) a.f = Math.atan2(foe.y - a.y, foe.x - a.x);
  }
  return act;
}

// 행동이 붙잡은 대상. 도중에 죽었으면 가장 가까운 적으로 물러선다.
function actTarget(a){
  const t = a.act && a.act.target;
  return (t && t.hp > 0) ? t : nearestFoe(a);
}

// 이동 계열의 방향은 행동이 시작하는 순간 고정된다. 매 틱 재조준하지 않는다.
function planMove(a, act){
  const foe = (act.target && act.target.hp > 0) ? act.target : nearestFoe(a);
  if (!foe) return;                                    // 대상이 없으면 제자리
  act.target = foe;
  const d = dist(a, foe);

  const ux = d < 1e-6 ? 1 : (foe.x - a.x) / d;         // 대상 쪽 단위벡터
  const uy = d < 1e-6 ? 0 : (foe.y - a.y) / d;

  if (act.kind === 'side'){
    // 옆걸음 — 대상 방향에 **수직으로 곧게** 간다. 호가 아니다.
    // 곧게 가야 걸음이 그대로 쌓인다. 두 번 쓰면 두 배 벗어난다.
    // 호로 돌면 sin 때문에 안 쌓이고, 가까이서는 되레 제자리로 돌아온다.
    const total = a.sideStep;
    const px = -uy, py = ux;                            // 수직 단위벡터
    // 위협 축에서 더 멀어지는 쪽을 고른다
    const off = sgn => {
      const nx = a.x + px * total * sgn, ny = a.y + py * total * sgn;
      const ex = nx - foe.x, ey = ny - foe.y;
      return Math.abs(ey * Math.cos(foe.f) - ex * Math.sin(foe.f));
    };
    const sgn = off(1) >= off(-1) ? 1 : -1;
    act.mv = { dx:px * (total / act.ticks) * sgn, dy:py * (total / act.ticks) * sgn };
  } else if (act.kind === 'back'){
    a.f = Math.atan2(foe.y - a.y, foe.x - a.x);         // 마주 본 채 물러난다
    const total = a.backStep;
    act.mv = { dx:-ux * (total / act.ticks), dy:-uy * (total / act.ticks) };
  } else {
    // 앞걸음 — 접촉거리보다 가까이는 못 붙는다 (뚫고 지나가지도 않는다)
    const room = Math.max(0, d - CONTACT);
    const total = Math.min(a.fwdStep, room);
    a.f = Math.atan2(foe.y - a.y, foe.x - a.x);         // 다가가며 그쪽을 본다
    act.mv = { dx:ux * (total / act.ticks), dy:uy * (total / act.ticks) };
  }
}

function applyMove(a){
  const mv = a.act && a.act.mv;
  if (!mv) return;
  a.x += mv.dx; a.y += mv.dy;
}

/* 이 행동이 (x,y) 를 덮나 — 모양이 하나뿐이라 판정도 한 곳이다.
   액터가 보는 쪽을 앞으로 놓고 직사각형에 드는지만 본다.
     앞 fwd · 뒤 bwd · 옆 side   (전부 걸음, 중심에서 가장자리까지) */
function covers(a, act, x, y){
  const dx = x - a.x, dy = y - a.y;
  const ux = Math.cos(a.f), uy = Math.sin(a.f);
  const along = dx * ux + dy * uy;             // 앞이 +, 뒤가 -
  const side = Math.abs(dy * ux - dx * uy);
  // 가장자리에 정확히 걸치면 벗어난 것으로 본다. 그 자리가 `한 뼘`이다.
  return along < (act.fwd || 0) - 1e-9
      && along > -(act.bwd || 0) - 1e-9
      && side < (act.side || 0) - 1e-9;
}

/* ============================================================
   공격 발동 — 행동의 마지막 틱에 터진다
   ============================================================ */
function fire(a, events){
  const act = a.act;
  const dmg = act.dmg != null ? act.dmg : a.atk;
  const near = actTarget(a);

  // 여기서 다시 조준하지 않는다. 방향은 예고를 시작할 때 이미 굳었다.
  // 나와 몹이 똑같이 이 규칙을 따른다 — 준비하는 동안 상대가 빠지면 빗나간다.

  // 무차별이면 자기 자신만 빼고 전부가 후보다. 아군도 맞는다.
  const pool = act.hitsAll
    ? [player].concat(livingMobs()).filter(x => x !== a)
    : foesOf(a);
  let struck = pool.filter(f => f.hp > 0 && covers(a, act, f.x, f.y));
  // 대상 수 제한 — 가까운 순서로 자른다. 0 이면 모두.
  if (act.targets > 0 && struck.length > act.targets)
    struck = struck.slice().sort((p, q) => dist(a, p) - dist(a, q))
                   .slice(0, act.targets);

  const label = a === player ? '나' : a.name;
  const key = x => x === player ? 'p' : String(mobs.indexOf(x));
  if (!struck.length){
    events.push({ type:'miss', who:label, si:key(a), name:act.name,
                  why:missReason(a, act, near),
                  d:near ? dist(a, near) : 0 });
    return;
  }
  for (const f of struck){
    // 같은 편이면 피해가 절반이다. 유도가 이득이되 그것만으로 판이 끝나지는 않게.
    const ally = (f !== player) === (a !== player);
    const hurt = ally
      ? Math.max(1, Math.round(dmg * (act.allyDmg != null ? act.allyDmg : .5)))
      : dmg;
    f.hp = Math.max(0, f.hp - hurt);
    events.push({ type:'hit', who:label, si:key(a), ti:key(f), name:act.name,
                  tgt:f === player ? '나' : f.name, dmg:hurt, ally:ally,
                  dead:f.hp <= 0 });
  }
}

// 왜 안 맞았나 — 앞이 모자란지 옆으로 샜는지
function missReason(a, act, near){
  if (!near) return '대상이 없음';
  const dx = near.x - a.x, dy = near.y - a.y;
  const ux = Math.cos(a.f), uy = Math.sin(a.f);
  const along = dx * ux + dy * uy, side = Math.abs(dy * ux - dx * uy);
  if (along > (act.fwd || 0) + 1e-9 || along < -(act.bwd || 0) - 1e-9) return '앞 밖';
  if (side > (act.side || 0) + 1e-9) return '옆으로 샘';
  return '빗나감';
}

/* ============================================================
   졸개 AI — 분기 하나
   ============================================================ */
function chooseAct(m){
  // 한 뼘 규칙 때문에 가장자리는 안 맞는다. 안쪽까지 들어와야 친다.
  // covers 와 부등호를 맞추지 않으면 못 맞히는 자리에서 계속 치는 교착이 생긴다.
  startAct(m, dist(m, player) < m.atkAct.fwd - 1e-9 ? m.atkAct : m.moveAct);
}

/* ============================================================
   틱 한 번
   ============================================================ */
function stepTick(){
  const events = [];
  const actors = [player].concat(livingMobs());

  // 1) 이동 계열 먼저 — 같은 틱에 빠져나가 피하는 것이 성립하도록
  for (const a of actors) if (a.act && MOVE_KINDS[a.act.kind]) applyMove(a);

  // 1-2) 겹침 밀어내기 — 둘이 동시에 다가오면 접촉거리보다 가까워진다.
  //      계획할 때 한 번 자르는 것만으로는 못 막는다.
  for (const m of livingMobs()){
    const d = dist(player, m);
    if (d > 1e-9 && d < CONTACT){
      const push = (CONTACT - d) / d;
      m.x += (m.x - player.x) * push;
      m.y += (m.y - player.y) * push;
    }
  }

  // 2) 마지막 틱인 공격이 터진다
  for (const a of actors)
    if (a.act && ATTACK_KINDS[a.act.kind] && a.act.left === 1) fire(a, events);

  // 3) 남은 틱을 깎는다
  for (const a of actors) if (a.act) a.act.left--;

  // 4) 죽은 몹의 행동을 지운다
  for (const m of mobs) if (m.hp <= 0) m.act = null;

  // 5) 행동을 마친 몹은 다음을 고른다.
  //    기술 틱은 나와 몹이 같으므로, 몹의 공격 주기는 `숨고르기`로 정한다.
  //    같은 발사라도 숨을 오래 고르는 놈은 느리게 쏜다.
  for (const m of livingMobs()){
    if (m.act && m.act.left > 0) continue;
    const done = m.act;
    if (done && ATTACK_KINDS[done.kind] && m.recover > 0)
      startAct(m, { kind:'wait', name:'숨고르기', ticks:m.recover });
    else chooseAct(m);
  }

  clock++;
  return events;
}

// 세계의 겉모습을 한 장 찍는다 (재생용)
// 머리 위 숫자와 표식까지 같이 담아야 재생 중에 예고가 살아 움직인다.
function snap(){
  return {
    p:{ x:player.x, y:player.y, f:player.f, hp:player.hp },
    m: mobs.map(m => ({ x:m.x, y:m.y, f:m.f, hp:m.hp, max:m.maxHp, size:m.size,
                        skin:m.skin, skin2:m.skin2,
                        left:m.act ? m.act.left : 0,
                        kind:m.act ? m.act.kind : null })),
    marks: livingMobs().filter(m => m.act).map(m => markOf(m, m.act)),
  };
}

/* ============================================================
   카드 던지기 — 그 카드의 틱만큼만 시간이 흐른다
   ============================================================ */
// asAct 를 주면 카드 대신 그 행동을 한다 (무덤에 떨궜을 때의 버리기)
function throwCard(i, fromRect, target, asAct){
  if (phase !== 'idle') return;
  const card = hand[i];
  if (!card) return;
  const act = asAct || card;

  hand.splice(i, 1);
  discard.push(card);
  hoverCard = null; worldVer++;
  if (asAct) addLog('sys', clock, card.name + ' 버림 (한 틱)');
  startAct(player, act, target);

  // 틱을 미리 다 돌려 두고 재생만 한다
  const frames = [Object.assign(snap(), { events:[] })];
  for (let t = 0; t < act.ticks; t++){
    const ev = stepTick();
    frames.push(Object.assign(snap(), { events:ev }));
  }
  player.act = null;

  phase = 'run';
  renderHand();
  renderStats();
  if (fromRect){
    if (asAct) flyToGrave(card, fromRect);
    else flyToStage(card, fromRect);
  }

  playback(frames, () => {
    drawUp();
    worldVer++;
    if (!checkOver()) phase = 'idle';
    render();
    if (fxActive()) fxPump();
  });
}

function checkOver(){
  if (!livingMobs().length){
    phase = 'over';
    $('overT').textContent = '섬멸';
    $('overP').textContent = STAGES[stageIdx].name + ' — ' + clock + '틱 만에 섬멸.';
    $('over').hidden = false;
    addLog('kill', clock, '=== 섬멸 완료 ===');
    return true;
  }
  if (player.hp <= 0){
    phase = 'over';
    $('overT').textContent = '쓰러짐';
    $('overP').textContent = '남은 몹 ' + livingMobs().length + '마리.';
    $('over').hidden = false;
    addLog('bad', clock, '=== 쓰러졌다 ===');
    return true;
  }
  return false;
}

/* ============================================================
   재생
   ============================================================ */
function playback(frames, done){
  let i = 1;
  const step = () => {
    if (i >= frames.length){ done(); return; }
    const from = frames[i - 1], to = frames[i];
    const t0 = performance.now();
    const frame = now => {
      const k = Math.min(1, (now - t0) / TICK_MS);
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const lerp = (a, b) => a + (b - a) * e;
      drawScene({
        p:{ x:lerp(from.p.x, to.p.x), y:lerp(from.p.y, to.p.y), f:to.p.f, hp:to.p.hp },
        m: to.m.map((m, n) => ({ x:lerp(from.m[n].x, m.x), y:lerp(from.m[n].y, m.y),
                                 f:m.f, hp:m.hp, left:m.left, kind:m.kind })),
      }, to.marks);
      if (k < 1){ anim = requestAnimationFrame(frame); return; }
      for (const ev of to.events || []){
        // 때린 쪽은 세로로 늘어나고, 맞은 쪽은 빨개진다
        const t = performance.now();
        if (ev.si != null) fx.hit[ev.si] = t;
        if (ev.type === 'hit' && ev.ti != null) fx.dmg[ev.ti] = t;
      }
      for (const ev of to.events || []){
        if (ev.type === 'hit') addLog(ev.dead ? 'kill' : (ev.ally ? 'mv' : 'hit'), clock,
          ev.who + ' ' + ev.name + ' → ' + ev.tgt + ' ' + ev.dmg + ' 피해' +
          (ev.ally ? ' (아군 오사)' : '') + (ev.dead ? ' · 처치' : ''));
        else addLog('bad', clock,
          ev.who + ' ' + ev.name + ' ✕ ' + ev.why +
          (ev.d ? ' (거리 ' + ev.d.toFixed(1) + '걸음)' : ''));
      }
      renderStats();
      i++;
      anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(frame);
  };
  anim = requestAnimationFrame(step);
}

/* ============================================================
   표식 — 나와 몹이 같은 어휘를 쓴다
   ============================================================ */
let hitFc = null;      // 지금 들고 있는 카드의 예측 (몸통 표시에 쓴다)
function currentMarks(){
  const out = [];
  const tgt = drag ? drag.target : null;
  const fc = (phase === 'idle' && hoverCard) ? forecast(hoverCard, tgt) : null;
  hitFc = fc;
  mobs.forEach((m, i) => {
    if (m.hp <= 0 || !m.act) return;
    const k = markOf(m, m.act);
    if (fc){
      // 예측 상자를 그림으로 옮긴다.
      //   이 카드를 쓰면 맞나  vs  가만있었으면 맞았나
      const will = fc.hitMe.indexOf(i) >= 0;
      const would = fc.idle.indexOf(i) >= 0;
      k.state = will ? (would ? 'stuck' : 'newrisk') : 'safe';
      if (fc.firing.indexOf(i) >= 0) k.fires = true;
    }
    out.push(k);
  });
  if (fc){
    const k = previewMark(hoverCard, tgt);
    if (k) out.push(k);
  }
  return out;
}

function markOf(a, act){
  const k = { kind:act.kind, name:act.name, skill:act.skill, futile:null,
              from:{ x:a.x, y:a.y }, at:{ x:a.x, y:a.y, f:a.f }, left:act.left };
  if (MOVE_KINDS[act.kind]){
    // 남은 틱만큼 더 간 자리를 끝점으로 삼는다
    const p = { x:a.x, y:a.y }, mv = act.mv;
    if (mv){ p.x = a.x + mv.dx * act.left; p.y = a.y + mv.dy * act.left; }
    k.to = p;
  } else if (ATTACK_KINDS[act.kind]){
    k.fwd = act.fwd || 0; k.bwd = act.bwd || 0; k.side = act.side || 0;
    // 굳은 방향 그대로 그린다. 예고가 곧 약속이다.
    const foe = actTarget(a);
    if (foe) k.tgt = { x:foe.x, y:foe.y };
  } else {
    k.to = { x:a.x, y:a.y };
  }
  return k;
}

/* ============================================================
   미리보기 — 이 카드를 지금 던지면 어떻게 되나
   세계를 통째로 복사해 돌려 보고 되돌린다.
   ============================================================ */
function saveWorld(){
  return {
    p:{ x:player.x, y:player.y, f:player.f, hp:player.hp, act:player.act },
    m: mobs.map(m => ({ x:m.x, y:m.y, f:m.f, hp:m.hp,
                        act:m.act ? Object.assign({}, m.act,
                              { mv:m.act.mv ? Object.assign({}, m.act.mv) : null })
                                  : null })),
    c: clock,
  };
}
function loadWorld(st){
  player.x = st.p.x; player.y = st.p.y; player.f = st.p.f;
  player.hp = st.p.hp; player.act = st.p.act;
  mobs.forEach((m, i) => {
    const s = st.m[i];
    m.x = s.x; m.y = s.y; m.f = s.f; m.hp = s.hp; m.act = s.act;
  });
  clock = st.c;
}

function dryRun(card, target){
  const st = saveWorld();
  const act = startAct(player, card, target);
  const mv = act.mv ? Object.assign({}, act.mv) : null;
  const nearBefore = nearestFoe(player);
  const distBefore = nearBefore ? dist(player, nearBefore) : null;
  const aimF = player.f;                 // 던졌다면 굳었을 방향
  let hits = 0, dealt = 0, kills = 0, taken = 0, incoming = 0;
  let friendly = 0, friendlyKills = 0;
  const firing = [], struck = [], hitMe = [], killed = [], byAlly = [];
  // 카드가 끝나도 지금 떠 있는 예고가 다 터질 때까지 본다.
  // 그래야 1틱 카드로 2틱 예고를 피한 것이 보인다.
  const horizon = horizonOf(card.ticks);
  for (let t = 0; t < horizon; t++){
    if (t === card.ticks) player.act = null;      // 카드가 끝나면 가만히 있는다
    // 이번 틱에 터질 몹을 미리 적어 둔다 (무대에서 굵게 그린다)
    mobs.forEach((m, idx) => {
      if (m.hp > 0 && m.act && ATTACK_KINDS[m.act.kind] && m.act.left === 1
          && firing.indexOf(idx) < 0) firing.push(idx);
    });
    const fired = {};
    for (const ev of stepTick()){
      const mine = ev.who === '나';
      // 적이 터뜨린 횟수. 하나가 여럿을 맞혀도 한 번으로 센다.
      if (!mine && !fired[ev.si]){ fired[ev.si] = 1; incoming++; }
      if (ev.type !== 'hit') continue;
      const ti = parseInt(ev.ti, 10), si = parseInt(ev.si, 10);
      if (mine){ hits++; dealt += ev.dmg; if (ev.dead) kills++; }
      if (ev.ti === 'p'){
        taken += ev.dmg;
        if (!isNaN(si) && hitMe.indexOf(si) < 0) hitMe.push(si);   // 나를 때린 몹
      }
      if (ev.dead && !isNaN(ti) && killed.indexOf(ti) < 0) killed.push(ti);
      if (!mine && ev.ally && !isNaN(ti) && byAlly.indexOf(ti) < 0) byAlly.push(ti);
      // 몹이 몹을 때린 것 = 유도로 번 피해
      if (!mine && ev.ally){ friendly += ev.dmg; if (ev.dead) friendlyKills++; }
      // 맞는 놈은 누가 때렸든 모은다. 겨눈 놈과 다를 수 있다.
      const n = parseInt(ev.ti, 10);
      if (!isNaN(n) && struck.indexOf(n) < 0) struck.push(n);
    }
  }
  player.act = null;
  const nearAfter = nearestFoe(player);
  const distAfter = nearAfter ? dist(player, nearAfter) : null;
  const endX = player.x, endY = player.y;
  loadWorld(st);

  let why = null;
  if (ATTACK_KINDS[card.kind] && !hits){
    const foe = (target && target.hp > 0) ? target : nearestFoe(player);
    why = !foe ? '대상이 없음' : missReason(player, card, foe);
  }
  return { why:why, mv:mv, hits:hits, aimF:aimF, struck:struck,
           dealt:dealt, kills:kills, taken:taken, incoming:incoming, firing:firing,
           friendly:friendly, friendlyKills:friendlyKills,
           distBefore:distBefore, distAfter:distAfter, endX:endX, endY:endY,
           hitMe:hitMe, killed:killed, byAlly:byAlly,
           horizon:horizon, idle:idleHitters(horizon) };
}

/* 기준선 — 이 카드를 안 쓰고 같은 틱만큼 서 있었다면 누가 나를 때리나.
   같은 틱 수로 재야 카드끼리 견줄 수 있다. */
/* 지금 떠 있는 예고가 다 터질 때까지 몇 틱인가.
   카드 틱에만 묶으면 1틱 카드로 2틱 예고를 피해도 그 결과를 못 본다. */
function horizonOf(cardTicks){
  let h = cardTicks;
  for (const m of livingMobs())
    if (m.act && ATTACK_KINDS[m.act.kind]) h = Math.max(h, m.act.left);
  return h;
}

function idleHitters(ticks){
  const st = saveWorld();
  player.act = null;
  const out = [];
  for (let t = 0; t < ticks; t++)
    for (const ev of stepTick())
      if (ev.type === 'hit' && ev.ti === 'p'){
        const n = parseInt(ev.si, 10);
        if (!isNaN(n) && out.indexOf(n) < 0) out.push(n);
      }
  loadWorld(st);
  return out;
}

/* 예측은 그리기마다 다시 돌 필요가 없다. 카드·대상·판이 그대로면 다시 쓴다.
   열쇠에 판 상태를 통째로 넣는다. 판이 바뀌었는데 캐시가 남아 거짓말하는 일을
   구조적으로 없앤다 — 언제 무효로 할지 손으로 챙기지 않아도 된다. */
let worldVer = 0, fcKey = null, fcVal = null;
function worldSig(){
  let s = player.x.toFixed(4) + ',' + player.y.toFixed(4) + ',' +
          player.f.toFixed(4) + ',' + player.hp + '|';
  for (const m of mobs)
    s += m.hp + ',' + m.x.toFixed(4) + ',' + m.y.toFixed(4) + ',' + m.f.toFixed(4) +
         ',' + (m.act ? m.act.kind + m.act.left : '-') + ';';
  return s;
}
function forecast(card, target){
  const key = card.id + '|' + (target ? mobs.indexOf(target) : -1) + '|' + worldSig();
  if (fcKey === key && fcVal) return fcVal;
  const r = dryRun(card, target);
  fcKey = key; fcVal = r;
  return r;
}

function previewMark(card, target){
  const r = forecast(card, target);
  // 카드를 통째로 옮긴다. 모양·크기를 손으로 꼽으면 하나 빠뜨렸을 때
  // 표식이 조용히 엉뚱한 모양으로 나온다 (선풍이 부채꼴로 그려졌던 버그).
  const k = markOf(player, Object.assign({}, card, {
    left:card.ticks, mv:r.mv, target:target }));
  if (ATTACK_KINDS[card.kind]) k.at.f = r.aimF;
  k.preview = true;
  return k;
}

/* ============================================================
   렌더 — 쿼터뷰
   ============================================================ */
const ISO_W = 30, ISO_H = 15;    // 걸음 하나가 화면에서 차지하는 크기
const MARK_COLOR = { step:'#7FD4EC', back:'#86DFAE', side:'#B9A8F0',
                     slash:'#FF9E8E', shot:'#FF7BA8', sweep:'#FFC489' };
const FUTILE_COLOR = '#D8B45E';

function fitCanvas(){
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function iso(x, y){ return { sx:(x - y) * ISO_W / 2, sy:(x + y) * ISO_H / 2 }; }

function drawMarks(S, marks){
  const arrowHead = (b, from) => {
    const ux = b[0] - from[0], uy = b[1] - from[1], L = Math.hypot(ux, uy) || 1;
    const nx = ux / L, ny = uy / L, px = -ny * 5.5, py = nx * 5.5;
    const hx = b[0] - nx * 9, hy = b[1] - ny * 9;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(b[0], b[1]);
    ctx.lineTo(hx + px, hy + py);
    ctx.lineTo(hx - px, hy - py);
    ctx.closePath(); ctx.fill();
  };

  for (const k of marks || []){
    if (k.kind === 'wait') continue;
    let color = MARK_COLOR[k.skill || k.kind] || '#8E8C82';
    let alpha = k.preview ? .95 : .7, wide = k.fires ? 3.5 : 2;
    // 예측 상자를 그림으로 옮긴 것 — 이 카드를 쓰면 이 위협이 나를 맞히나
    if (k.state === 'safe'){ alpha = .2; wide = 1.5; }
    else if (k.state === 'stuck'){ alpha = .95; wide = 3.5; }
    else if (k.state === 'newrisk'){ alpha = 1; wide = 4; color = '#FFD400'; }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = wide;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (k.preview) ctx.setLineDash([7, 4]);

    if (ATTACK_KINDS[k.kind]){
      // 공격은 전부 직사각형이다. 아이소에서는 평행사변형으로 보인다.
      const ux = Math.cos(k.at.f), uy = Math.sin(k.at.f);
      const px = -uy * k.side, py = ux * k.side;
      const bx = k.at.x - ux * k.bwd, by = k.at.y - uy * k.bwd;
      const fx = k.at.x + ux * k.fwd, fy = k.at.y + uy * k.fwd;
      const c = [ S(bx + px, by + py), S(fx + px, fy + py),
                  S(fx - px, fy - py), S(bx - px, by - py) ];
      ctx.beginPath();
      ctx.moveTo(c[0][0], c[0][1]);
      for (let i = 1; i < 4; i++) ctx.lineTo(c[i][0], c[i][1]);
      ctx.closePath();
      ctx.stroke();
      ctx.globalAlpha = alpha * (k.state === 'newrisk' ? .35
                               : k.state === 'stuck' ? .3 : .12);
      ctx.fill();
      ctx.globalAlpha = alpha;
      if (k.tgt){
        const b = S(k.tgt.x, k.tgt.y);
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.ellipse(b[0], b[1], 9, 4.5, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else {
      const a = S(k.from.x, k.from.y), b = S(k.to.x, k.to.y);
      if (Math.hypot(b[0] - a[0], b[1] - a[1]) < 2){
        ctx.beginPath(); ctx.moveTo(a[0] - 8, a[1]); ctx.lineTo(a[0] + 8, a[1]); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        arrowHead(b, a);
      }
    }
    ctx.restore();
  }
}

function drawScene(pos, marks){
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);

  const pi = iso(pos.p.x, pos.p.y);
  const camX = w / 2 - pi.sx, camY = h / 2 - pi.sy + 20;
  const S = (x, y) => { const q = iso(x, y); return [q.sx + camX, q.sy + camY]; };

  // 지면 격자 — 시각 기준선일 뿐, 규칙상 격자가 아니다
  // 한 칸이 한 걸음이다. 사거리(4걸음)마다 굵게 그어 눈으로 셀 수 있게 한다.
  const cx = Math.round(pos.p.x), cy = Math.round(pos.p.y), R = 20;
  ctx.lineWidth = 1;
  for (let i = -R; i <= R; i++){
    let a, b;
    ctx.strokeStyle = (cx + i) % 4 === 0 ? '#282821' : '#171714';
    a = S(cx + i, cy - R); b = S(cx + i, cy + R);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    ctx.strokeStyle = (cy + i) % 4 === 0 ? '#282821' : '#171714';
    a = S(cx - R, cy + i); b = S(cx + R, cy + i);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }

  // 사거리 고리는 상시로 안 띄운다. 예고(표식)에만 나온다.
  drawMarks(S, marks);

  if (drag){
    // 겨눈 놈 — 노란 점선 고리
    if (drag.target && drag.target.hp > 0){
      const t = pos.m[mobs.indexOf(drag.target)];
      if (t && t.hp > 0){
        const c = S(t.x, t.y);
        ctx.save();
        ctx.setLineDash([5, 4]);
        ctx.strokeStyle = '#FFD400'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(c[0], c[1], 19, 9.5, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = .12; ctx.fillStyle = '#FFD400'; ctx.fill();
        ctx.restore();
      }
    }
    // 맞을 놈 — 예측 상자의 줄 피해·유도·처치를 그림으로 옮긴다.
    //   내가 때림 = 빨강 · 유도로 맞음 = 초록 · 죽음 = 두 겹 + 글자
    const fc = hitFc;
    if (fc) for (const i of fc.struck){
      const t = pos.m[i];
      if (!t || t.hp <= 0) continue;
      const c = S(t.x, t.y);
      const ally = fc.byAlly.indexOf(i) >= 0;
      const dead = fc.killed.indexOf(i) >= 0;
      const col = ally ? '#86DFAE' : '#FF9E8E';
      ctx.save();
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(c[0], c[1], 13, 6.5, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = .2; ctx.fill(); ctx.globalAlpha = 1;
      if (dead){
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(c[0], c[1], 19, 9.5, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.font = '800 11px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('처치', c[0], c[1] - 70);
      } else {
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(c[0] - 7, c[1] - 55); ctx.lineTo(c[0] + 7, c[1] - 55);
        ctx.moveTo(c[0], c[1] - 62); ctx.lineTo(c[0], c[1] - 48);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  const now = performance.now();
  // 0 → 1 → 0 으로 한 번 부풀었다 돌아온다
  const fxAmt = (map, key, dur) => {
    const t0 = map[key];
    if (!t0) return 0;
    const e = (now - t0) / dur;
    return (e >= 0 && e < 1) ? Math.sin(Math.PI * e) : 0;
  };

  const pawn = (x, y, f, key, mob, look) => {
    const p = S(x, y), sx = p[0], sy = p[1];
    const st = fxAmt(fx.hit, key, FX_HIT);     // 때릴 때 세로로 늘어난다
    const fl = fxAmt(fx.dmg, key, FX_DMG);     // 맞을 때 빨개진다
    const ky = 1 + st * .42, kx = 1 - st * .16;
    const red = 'rgba(255,86,64,' + (fl * .85) + ')';

    const z = look && look.size ? look.size : 1;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.ellipse(sx, sy, 15 * kx * z, 7.5 * z, 0, 0, Math.PI * 2); ctx.fill();

    if (f != null){
      const tip = S(x + Math.cos(f) * 2.1, y + Math.sin(f) * 2.1);
      const ux = tip[0] - sx, uy = tip[1] - sy, L = Math.hypot(ux, uy) || 1;
      const nx = ux / L, ny = uy / L;
      ctx.save();
      ctx.strokeStyle = 'rgba(245,244,236,.45)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx + nx * 9, sy + ny * 9); ctx.lineTo(tip[0], tip[1]);
      ctx.stroke();
      ctx.fillStyle = 'rgba(245,244,236,.45)';
      ctx.beginPath();
      ctx.moveTo(tip[0], tip[1]);
      ctx.lineTo(tip[0] - nx * 7 - ny * 4, tip[1] - ny * 7 + nx * 4);
      ctx.lineTo(tip[0] - nx * 7 + ny * 4, tip[1] - ny * 7 - nx * 4);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // 몸통 — 같은 길을 두 번 칠해 빨간 기운을 얹는다
    const top = (mob ? 40 : 46) * ky * z, mid = (mob ? 22 : 26) * ky * z;
    const wOut = (mob ? 10 : 11) * kx * z, wIn = (mob ? 6 : 7) * kx * z;
    ctx.beginPath();
    ctx.moveTo(sx, sy - top); ctx.lineTo(sx + wOut, sy - mid);
    ctx.lineTo(sx + wIn, sy - 2); ctx.lineTo(sx - wIn, sy - 2);
    ctx.lineTo(sx - wOut, sy - mid); ctx.closePath();
    ctx.fillStyle = mob ? (look.skin || '#7A6B52') : '#FFD400'; ctx.fill();
    if (fl > 0){ ctx.fillStyle = red; ctx.fill(); }

    ctx.beginPath();
    if (mob) ctx.arc(sx, sy - 46 * ky * z, 7.5 * kx * z, 0, Math.PI * 2);
    else ctx.arc(sx, sy - 34 * ky, 4 * kx, 0, Math.PI * 2);
    ctx.fillStyle = mob ? (look.skin2 || '#9C8A6A') : '#1A1A17'; ctx.fill();
    if (fl > 0 && mob){ ctx.fillStyle = red; ctx.fill(); }
    return [sx, sy, z];
  };

  // 몹 — 뒤에 있는 것부터 그려야 앞뒤가 맞는다
  const order = pos.m.map((m, i) => ({ m:m, i:i }))
                     .filter(o => o.m.hp > 0)
                     .sort((a, b) => (a.m.x + a.m.y) - (b.m.x + b.m.y));
  for (const o of order){
    const m = o.m;
    const sp = pawn(m.x, m.y, m.f, String(o.i), true, m);
    mobHud(sp[0], sp[1], m);
  }

  pawn(pos.p.x, pos.p.y, pos.p.f, 'p', false, null);
}

// 몹 머리 위 — 숫자 하나가 예고의 전부다
function mobHud(sx, sy, m){
  const z = m.size || 1;
  const top = sy - 62 * z;
  const w = 26 * z, hpw = w * Math.max(0, m.hp) / (m.max || 6);
  ctx.fillStyle = '#2A2A22'; ctx.fillRect(sx - w / 2, top + 2, w, 4);
  ctx.fillStyle = '#C4705E'; ctx.fillRect(sx - w / 2, top + 2, hpw, 4);

  if (!m.kind) return;
  const act = { kind:m.kind, left:m.left };
  const attack = !!ATTACK_KINDS[act.kind];
  const color = attack ? '#FF9E8E' : '#7FD4EC';
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.font = '700 9px Inter, sans-serif';
  ctx.fillText(attack ? '공격' : '이동', sx, top - 28);
  if (z > 1.2){
    ctx.font = '800 10px Inter, sans-serif';
    ctx.fillText(String(Math.max(0, m.hp)) + '/' + m.max, sx, top + 15);
  }
  ctx.fillStyle = '#0D0D0B';
  ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(sx, top - 11, 11, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = '800 13px Inter, sans-serif';
  ctx.fillText(String(act.left), sx, top - 10);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

/* ============================================================
   카드 모션
   ============================================================ */
function rectOf(el){
  const r = el.getBoundingClientRect();
  return { x:r.left, y:r.top, w:r.width, h:r.height };
}
function cardFace(card){
  return '<div class="nm"><span>' + card.name + '</span>' +
         '<span class="tk">' + card.ticks + '틱</span></div>' +
         '<div class="tx">' + card.brief + '</div>';
}

function fly(card, from, to, opt){
  opt = opt || {};
  const dur = opt.dur || 320, delay = opt.delay || 0;
  const g = document.createElement('div');
  g.className = 'ghost pc k-' + card.kind;
  g.innerHTML = cardFace(card);
  g.style.width = from.w + 'px';
  g.style.height = from.h + 'px';
  g.style.transitionDuration = dur + 'ms';
  g.style.transitionDelay = delay + 'ms';
  const at = (r, rot, sx, sy) => 'translate(' + r.x + 'px,' + r.y + 'px) rotate(' +
    rot + 'deg) scale(' + sx + ',' + sy + ')';
  g.style.transform = at(from, opt.rot0 || 0, 1, 1);
  g.style.opacity = '1';
  $('ghosts').appendChild(g);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    g.style.transform = at(to, opt.rot1 || 0, to.w / from.w, to.h / from.h);
    if (opt.fade) g.style.opacity = '0';
  }));
  setTimeout(() => {
    g.remove();
    if (opt.reveal) opt.reveal.style.visibility = '';
  }, delay + dur + 40);
}

// 버린 카드는 무덤 무더기로 날아간다
function flyToGrave(card, from){
  fly(card, from, rectOf($('gravePile')), { dur:300, rot1:14, fade:true });
}

// 던진 카드는 무대 한가운데로 날아가 터지고 사라진다
function flyToStage(card, from){
  const r = cv.getBoundingClientRect();
  fly(card, from,
      { x:r.left + r.width / 2 - 26, y:r.top + r.height / 2 - 36, w:52, h:72 },
      { dur:260, rot1:-8, fade:true });
}

function runDrawFlights(){
  if (!pendingDraw.length) return;
  const idxs = pendingDraw.slice();
  pendingDraw = [];
  const deckR = rectOf($('deckPile'));
  const kids = $('hand').children;
  idxs.forEach((idx, n) => {
    const el = kids[idx];
    if (!el || !hand[idx]) return;
    fly(hand[idx], deckR, rectOf(el),
        { delay:n * 45, dur:330, rot0:-10, rot1:0, reveal:el });
  });
}

/* ============================================================
   드래그 — 집어서 무대에 떨군다
   ============================================================ */
function inRect(e, el, pad){
  const r = el.getBoundingClientRect();
  pad = pad || 0;
  return e.clientX >= r.left - pad && e.clientX <= r.right + pad &&
         e.clientY >= r.top - pad && e.clientY <= r.bottom + pad;
}

// 떨굴 수 있는 자리는 둘이다 — 무대에 쓰거나, 무덤에 버리거나
function dropZone(e){
  if (inRect(e, cv)) return 'stage';
  if (inRect(e, $('gravePile'), 14)) return 'grave';
  return null;
}

// 화면 좌표를 걸음 좌표로 되돌린다. drawScene 이 쓰는 카메라와 같은 식이다.
//   sx = (x-y) * ISO_W/2 ,  sy = (x+y) * ISO_H/2
function screenToWorld(cx, cy){
  const r = cv.getBoundingClientRect();
  const pi = iso(player.x, player.y);
  const camX = cv.clientWidth / 2 - pi.sx;
  const camY = cv.clientHeight / 2 - pi.sy + 20;
  const a = (cx - r.left - camX) / (ISO_W / 2);   // a = x - y
  const b = (cy - r.top - camY) / (ISO_H / 2);    // b = x + y
  return { x:(a + b) / 2, y:(b - a) / 2 };
}

// 떨군 자리에서 가장 가까운 몹이 대상이다. 빈 땅이어도 실패하지 않는다.
function pickTarget(cx, cy){
  const w = screenToWorld(cx, cy);
  let best = null, bd = Infinity;
  for (const m of livingMobs()){
    const d = Math.hypot(m.x - w.x, m.y - w.y);
    if (d < bd){ bd = d; best = m; }
  }
  return best;
}

function startDrag(e, el, card, i){
  if (phase !== 'idle' || drag) return;
  e.preventDefault();
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
  const r = rectOf(el);
  const g = document.createElement('div');
  g.className = 'ghost pc k-' + card.kind + ' held';
  g.innerHTML = cardFace(card, null);
  g.style.width = r.w + 'px';
  g.style.height = r.h + 'px';
  g.style.transitionDuration = '0ms';
  $('ghosts').appendChild(g);
  el.style.visibility = 'hidden';
  drag = { card:card, i:i, el:el, ghost:g, w:r.w, h:r.h,
           ox:e.clientX - r.x, oy:e.clientY - r.y, zone:null, target:null };
  hoverCard = card;
  moveDrag(e);
}

function moveDrag(e){
  if (!drag) return;
  const x = e.clientX - drag.ox, y = e.clientY - drag.oy;
  drag.ghost.style.transform = 'translate(' + x + 'px,' + y + 'px)';

  const zone = dropZone(e);
  if (zone !== drag.zone){
    drag.zone = zone;
    drag.ghost.style.opacity = zone ? '.55' : '1';
    $('gravePile').classList.toggle('hot', zone === 'grave');
  }

  if (zone === 'grave'){
    // 무덤에 떨구면 카드가 아니라 버리기(1틱)를 하는 것이다
    drag.target = null;
    hoverCard = TOSS;
    showForecast(TOSS);
  } else {
    hoverCard = drag.card;
    // 대상이 필요한 카드만 떨군 자리로 대상을 고른다
    drag.target = (zone === 'stage' && drag.card.needsTarget)
                ? pickTarget(e.clientX, e.clientY) : null;
    showForecast(zone === 'stage' ? drag.card : null);
  }
  paint();
}

function endDrag(e){
  if (!drag) return;
  const d = drag;
  drag = null;
  d.ghost.remove();
  d.el.style.visibility = '';
  hoverCard = null;
  showForecast(null);
  $('gravePile').classList.remove('hot');
  const zone = dropZone(e);
  const from = { x:e.clientX - d.ox, y:e.clientY - d.oy, w:d.w, h:d.h };
  if (zone === 'stage') throwCard(d.i, from, d.target);
  else if (zone === 'grave') throwCard(d.i, from, null, TOSS);
  else render();
}

function cancelDrag(){
  if (!drag) return;
  drag.ghost.remove();
  drag.el.style.visibility = '';
  drag = null;
  hoverCard = null;
  showForecast(null);
  $('gravePile').classList.remove('hot');
  render();
}

// 이 카드를 지금 떨구면 무슨 일이 벌어지나 — 무대 위에 적어 준다
function showForecast(card){
  const box = $('fcast');
  if (!card){ box.hidden = true; return; }
  const f = forecast(card, drag ? drag.target : null);
  const bit = (cls, txt) => '<span class="' + cls + '">' + txt + '</span>';
  const out = [bit('nm', card.name + ' · ' + card.ticks + '틱')];
  if (card === TOSS && drag) out.push(bit('dim', drag.card.name + ' 을 치움'));
  // 겨눈 놈이 안 맞으면 말해 준다. 공격 카드일 때만, 그리고 이유를 갈라서.
  if (ATTACK_KINDS[card.kind] && drag && drag.target && drag.target.hp > 0){
    const ti = mobs.indexOf(drag.target);
    if (f.struck.indexOf(ti) < 0){
      // 공격은 나를 안 움직이므로 지금 자리에 겨눈 방향을 얹으면 그대로다
      const box = { fwd:card.fwd, bwd:card.bwd, side:card.side };
      const me = { x:player.x, y:player.y, f:f.aimF };
      const inBox = covers(me, box, drag.target.x, drag.target.y);
      // 범위 안에 들었는데 안 맞았다면 대상 수에 밀린 것 = 앞이 막은 것
      out.push(bit('warn', inBox ? '앞이 막아 다른 놈이 맞음'
                                 : '겨눈 놈은 범위 밖'));
    }
  }
  if (f.dealt) out.push(bit('good', '줄 피해 ' + f.dealt +
    (f.kills ? ' · 처치 ' + f.kills : '')));
  if (f.distBefore != null && f.distAfter != null &&
      Math.abs(f.distAfter - f.distBefore) > 0.05)
    out.push(bit('dim', '거리 ' + f.distBefore.toFixed(1) + ' → ' +
                        f.distAfter.toFixed(1)));
  if (f.friendly) out.push(bit('good', '유도 ' + f.friendly +
    (f.friendlyKills ? ' · 처치 ' + f.friendlyKills : '')));
  out.push(f.taken ? bit('bad', '받을 피해 ' + f.taken)
                   : bit('good', '무피해'));
  if (f.incoming) out.push(bit('dim', '적 공격 ' + f.incoming + '회'));
  box.innerHTML = out.join('');
  box.hidden = false;
}

/* ============================================================
   UI
   ============================================================ */
function renderHand(){
  const el = $('hand');
  el.innerHTML = '';
  const drawing = pendingDraw.length ? pendingDraw : null;
  hand.forEach((card, i) => {
    const b = document.createElement('button');
    b.className = 'pc k-' + card.kind;
    b.disabled = phase !== 'idle';
    b.title = card.text;
    b.innerHTML = cardFace(card);
    if (drawing && drawing.indexOf(i) >= 0) b.style.visibility = 'hidden';
    b.onpointerdown = e => startDrag(e, b, card, i);
    b.onpointermove = e => moveDrag(e);
    b.onpointerup = e => endDrag(e);
    b.onpointercancel = () => cancelDrag();
    el.appendChild(b);
  });
  for (let i = hand.length; i < HAND_SIZE; i++){
    const d = document.createElement('div');
    d.className = 'pc slot';
    el.appendChild(d);
  }
  $('handInfo').textContent = '(' + hand.length + '/' + HAND_SIZE + ')';
}

function renderStats(){
  $('php').style.width = (Math.max(0, player.hp) / player.maxHp * 100) + '%';
  $('sHp').textContent = Math.max(0, player.hp) + ' / ' + player.maxHp;
  const n = nearestFoe(player);
  $('sDist').textContent = n ? dist(player, n).toFixed(1) + '걸음' : '–';
  $('sDeck').textContent = deck.length;
  $('sDisc').textContent = discard.length;
  $('hMobs').textContent = livingMobs().length;
  $('hTick').textContent = clock;
}

function paint(){ drawScene(snap(), currentMarks()); }

function render(){
  paint();
  renderHand();
  renderStats();
  $('hint').textContent = phase === 'run' ? '흐르는 중…'
    : phase === 'over' ? ''
    : '무대에 떨구면 쓰고, 무덤에 떨구면 버리고 한 틱 흐른다';
  runDrawFlights();
}

function addLog(cls, t, msg){
  log.unshift({ cls:cls, t:t, msg:msg });
  $('log').innerHTML = log.slice(0, 80).map(l =>
    '<div><span class="t">' + (l.t == null ? '' : l.t + '틱') + '</span>' +
    '<span class="' + l.cls + '">' + l.msg + '</span></div>').join('');
}

/* ============================================================
   시작
   ============================================================ */
function reset(){
  if (anim) cancelAnimationFrame(anim);
  $('ghosts').innerHTML = '';
  $('over').hidden = true;
  $('fcast').hidden = true;
  $('gravePile').classList.remove('hot');
  pendingDraw = []; hoverCard = null; drag = null;
  fx = { hit:{}, dmg:{} };
  worldVer++; fcKey = null; fcVal = null;
  clock = 0; log = [];

  player = Object.assign({}, PLAYER_BASE, { x:0, y:0, f:0, act:null });

  // 전장에 적힌 대로 세운다. [종류, 각(회전수), 거리(걸음)]
  const st = STAGES[stageIdx];
  mobs = st.spots.map(sp => {
    const a = sp[1] * Math.PI * 2, d = sp[2];
    return Object.assign({}, KINDS[sp[0]], {
      x:Math.cos(a) * d, y:Math.sin(a) * d, f:0, act:null, hp:KINDS[sp[0]].hp,
    });
  });
  player.f = Math.atan2(mobs[0].y, mobs[0].x);
  for (const m of mobs){
    m.f = Math.atan2(player.y - m.y, player.x - m.x);
    chooseAct(m);
  }

  // 덱 20장 = 공격 5 · 이동 4 · 회피 3 · 선회 3 · 사격 3 · 선풍 2
  // 덱 20장
  const mix = [[CARDS.attack, 5], [CARDS.step, 4], [CARDS.back, 3],
               [CARDS.side, 3], [CARDS.shoot, 3], [CARDS.whirl, 2]];
  const cards = [];
  for (const pair of mix) for (let i = 0; i < pair[1]; i++) cards.push(pair[0]);
  deck = shuffle(cards);
  hand = []; discard = [];
  phase = 'idle';
  drawUp();
  addLog('sys', 0, st.name + ' — ' + st.hint);
  renderTabs();
  render();
}

function renderTabs(){
  const el = $('tabs');
  el.innerHTML = '';
  STAGES.forEach((st, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === stageIdx ? ' on' : '');
    b.textContent = st.name;
    b.onclick = () => { if (i !== stageIdx){ stageIdx = i; reset(); } };
    el.appendChild(b);
  });
  const why = document.createElement('span');
  why.className = 'why';
  why.textContent = STAGES[stageIdx].hint;
  el.appendChild(why);
}

$('reset').onclick = reset;
$('again').onclick = reset;
window.addEventListener('resize', () => { fitCanvas(); paint(); });
fitCanvas();
reset();
})();
</script>
