<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시간 · 틱 전투 프로토타입</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFD400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  .container{max-width:1120px;}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);
    margin-bottom:var(--s5);flex-wrap:wrap;}
  .top h1{font-size:30px;margin:0;}
  .top p{color:var(--muted);font-size:14px;margin:6px 0 0;}
  .back{font-size:13px;color:var(--muted);text-decoration:none;}
  .back:hover{color:var(--brand-yellow);}

  .layout{display:grid;grid-template-columns:1fr 300px;gap:var(--s4);align-items:start;}
  @media(max-width:920px){.layout{grid-template-columns:1fr;}}

  .panel{background:var(--surface);border:1px solid var(--hairline);
    border-radius:var(--r-lg);padding:var(--s4);}
  .panel + .panel{margin-top:var(--s4);}
  .panel h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:0 0 var(--s3);font-weight:600;}

  /* ---- 무대 ---- */
  #arena{display:block;width:100%;height:340px;border-radius:var(--r-md);
    background:#0D0D0B;border:1px solid var(--hairline);}

  .legend{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s3);
    font-size:11px;color:var(--muted);align-items:center;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend .sw{width:14px;height:2px;border-radius:2px;display:inline-block;}
  .sw-move{background:#7FD4EC;} .sw-dodge{background:#86DFAE;}
  .sw-turn{background:#B9A8F0;} .sw-attack{background:#FF9E8E;}
  .sw-whirl{background:#FFC489;} .sw-futile{background:#D8B45E;}
  .legend .tip{margin-left:auto;opacity:.75;}

  /* ---- 타임라인 ---- */
  .tl{display:grid;grid-template-columns:64px 1fr;gap:6px var(--s2);align-items:center;}
  .tl-label{font-size:12px;color:var(--muted);text-align:right;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tl-label.me{color:var(--brand-yellow);font-weight:600;}
  .tl-cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;}
  .cell{height:32px;border-radius:var(--r-sm);background:#161613;
    border:1px solid var(--hairline);position:relative;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;color:var(--muted);overflow:hidden;
    transition:transform .1s,box-shadow .1s;}
  .cell.ruler{height:18px;border:none;background:none;font-size:10px;}
  .cell.move{background:#1F3A44;border-color:#2E5A69;color:#7FD4EC;}
  .cell.dodge{background:#1E3A2A;border-color:#2F5C42;color:#86DFAE;}
  .cell.turn{background:#2A2340;border-color:#453A6B;color:#B9A8F0;}
  .cell.attack{background:#4A2320;border-color:#7A3A34;color:#FF9E8E;}
  .cell.whirl{background:#432C15;border-color:#7A542C;color:#FFC489;}
  .cell.wait{background:#232320;border-color:#3A3A31;color:#6E6C63;}
  .cell.mid{border-left-color:transparent;border-top-left-radius:0;border-bottom-left-radius:0;}
  .cell.notend{border-right-color:transparent;border-top-right-radius:0;border-bottom-right-radius:0;}
  .cell.now{box-shadow:0 0 0 2px var(--brand-yellow);transform:translateY(-2px);z-index:2;}
  .cell.past{opacity:.4;}
  /* 소용없음 — 색을 빼고 빗금을 얹는다 */
  .cell.futile{background:#221E19;border-color:#4A3D28;color:#9A8358;}
  .cell.futile::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(45deg,
      transparent 0 4px, rgba(255,190,80,.14) 4px 8px);}

  /* ---- 손패 · 카드 ---- */
  .handrow{display:flex;gap:var(--s3);align-items:center;}
  .hand{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s2);}
  @media(max-width:760px){.hand{grid-template-columns:repeat(4,1fr);}}
  @media(max-width:460px){.hand{grid-template-columns:repeat(3,1fr);}
    .handrow{flex-wrap:wrap;}}

  /* 카드 — 세로로 긴 카드 비율 (5:7) */
  .pc{aspect-ratio:5/7;background:var(--surface-soft);
    border:1px solid var(--hairline);border-top:3px solid var(--hairline);
    border-radius:var(--r-md);padding:7px 8px;cursor:pointer;text-align:left;
    display:flex;flex-direction:column;overflow:hidden;
    transition:transform .12s,border-color .12s,box-shadow .12s;
    font-family:var(--font);color:var(--body);box-shadow:var(--sh-sm);}
  .pc:hover:not(:disabled){border-color:var(--brand-yellow);
    transform:translateY(-6px);box-shadow:var(--sh-md);}
  .pc:disabled{opacity:.3;cursor:not-allowed;}
  .pc .nm{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;
    font-size:13px;font-weight:700;color:var(--ink);line-height:1.2;}
  .pc .tk{flex:none;font-size:9px;font-weight:800;padding:2px 5px;
    border-radius:var(--r-pill);background:var(--brand-yellow);color:var(--on-brand);}
  .pc .tx{margin-top:auto;font-size:10px;line-height:1.35;color:var(--muted);}
  .pc.k-move{border-top-color:#2E5A69;}
  .pc.k-dodge{border-top-color:#2F5C42;}
  .pc.k-turn{border-top-color:#453A6B;}
  .pc.k-attack{border-top-color:#7A3A34;}
  .pc.k-whirl{border-top-color:#7A542C;}
  .pc.k-wait{border-top-color:#3A3A31;}
  .pc.slot{opacity:.12;cursor:default;box-shadow:none;
    background:none;border-style:dashed;border-top-color:var(--hairline);}
  .pc.futile{border-top-color:#4A3D28;background:#1F1C17;}
  .pc.futile .nm span:first-child{color:#9A8358;text-decoration:line-through;}
  .pc.futile .tk{background:#4A3D28;color:#D8B45E;}
  .pc .warn{margin-top:5px;font-size:9px;font-weight:700;color:#D8B45E;
    background:#2A2318;border-radius:var(--r-sm);padding:3px 5px;line-height:1.25;}

  /* 덱 · 무덤 무더기 */
  .pile{flex:none;width:64px;aspect-ratio:5/7;border-radius:var(--r-md);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border:1px solid var(--hairline);position:relative;}
  .pile .pn{font-size:10px;color:var(--muted);letter-spacing:.05em;}
  .pile b{font-size:18px;font-weight:800;color:var(--ink);}
  .pile.deck{background:
    repeating-linear-gradient(45deg,#1F1F1A 0 5px,#26261F 5px 10px);
    box-shadow:2px 2px 0 #16161300, 3px 3px 0 var(--surface), 4px 4px 0 var(--hairline);}
  .pile.grave{background:#17170F;border-style:dashed;}

  /* 날아다니는 카드 */
  #ghosts{position:fixed;inset:0;pointer-events:none;z-index:60;}
  .ghost{position:absolute;left:0;top:0;transform-origin:0 0;
    aspect-ratio:auto;will-change:transform,opacity;
    transition-property:transform,opacity;
    transition-timing-function:cubic-bezier(.25,.9,.3,1);
    box-shadow:var(--sh-lg);}

  .ctrl{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3);align-items:center;}
  .ctrl .spacer{flex:1;}
  .hint{font-size:12px;color:var(--muted);}
  .hint.bad{color:#D8B45E;font-weight:600;}

  /* ---- 우측 정보 ---- */
  .stat{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;
    border-bottom:1px solid var(--hairline);}
  .stat:last-child{border-bottom:none;}
  .stat b{color:var(--ink);font-weight:600;}
  .hpbar{height:7px;border-radius:var(--r-pill);background:#2A2A22;overflow:hidden;margin:6px 0 var(--s3);}
  .hpbar i{display:block;height:100%;background:var(--brand-yellow);transition:width .25s;}

  .log{font-size:12px;line-height:1.6;max-height:170px;overflow-y:auto;
    color:var(--body);font-variant-numeric:tabular-nums;}
  .log div{padding:2px 0;border-bottom:1px solid #1F1F1A;}
  .log .t{color:var(--muted);display:inline-block;width:34px;}
  .log .hit{color:#FF9E8E;}
  .log .mv{color:#7FD4EC;}
  .log .bad{color:#D8B45E;}
  .log .sys{color:var(--muted);}

  .phase{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;padding:4px 10px;border-radius:var(--r-pill);
    background:#161613;color:var(--brand-yellow);}
</style>
</head>
<body>
<main class="container">
  <div class="top">
    <div>
      <a class="back" href="../index.html">← 프로토타입 목록</a>
      <h1>⏱️ 시간</h1>
      <p>10틱 타임라인. 예고를 읽고 카드를 순서대로 놓는다. — 샌드박스</p>
    </div>
    <span class="phase" id="phase">예고 · 계획</span>
  </div>

  <div class="layout">
    <div>
      <div class="panel">
        <canvas id="arena"></canvas>
        <div class="legend">
          <span><i class="sw sw-move"></i>이동</span>
          <span><i class="sw sw-dodge"></i>회피</span>
          <span><i class="sw sw-turn"></i>선회</span>
          <span><i class="sw sw-attack"></i>공격 (부채꼴)</span>
          <span><i class="sw sw-whirl"></i>선풍 (온고리)</span>
          <span><i class="sw sw-futile"></i>소용없음</span>
          <span class="tip">동그라미 = 시작 틱 · 흰 화살 = 바라보는 쪽</span>
        </div>
      </div>

      <div class="panel">
        <h2>타임라인 · 10틱</h2>
        <div class="tl" id="tl"></div>
      </div>

      <div class="panel">
        <h2>손패 <span id="handInfo" style="text-transform:none;letter-spacing:0"></span></h2>
        <div class="handrow">
          <div class="pile deck" id="deckPile"><span class="pn">덱</span><b id="sDeck">0</b></div>
          <div class="hand" id="hand"></div>
          <div class="pile grave" id="gravePile"><span class="pn">무덤</span><b id="sDisc">0</b></div>
        </div>
        <div class="ctrl">
          <button class="btn btn-secondary btn-sm" id="undo">되돌리기</button>
          <button class="btn btn-secondary btn-sm" id="reset">초기화</button>
          <span class="spacer"></span>
          <span class="hint" id="hint"></span>
          <button class="btn btn-primary btn-sm" id="run">행동턴 ▶</button>
        </div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2>플레이어</h2>
        <div class="hpbar"><i id="php" style="width:100%"></i></div>
        <div class="stat"><span>체력</span><b id="sHp">20 / 20</b></div>
        <div class="stat"><span>공격력</span><b>3</b></div>
        <div class="stat"><span>사거리</span><b>2.0</b></div>
        <div class="stat"><span>조준각</span><b>±30°</b></div>
        <div class="stat"><span>선회각</span><b>45°</b></div>
        <div class="stat"><span>선풍 사거리</span><b>1.6</b></div>
        <div class="stat"><span>이동거리</span><b>1.5</b></div>
        <div class="stat"><span>회피거리</span><b>2.0</b></div>
        <div class="stat"><span>접촉거리</span><b>0.6</b></div>
        <div class="stat"><span>가까운 적까지</span><b id="sDist">–</b></div>
      </div>

      <div class="panel">
        <h2>기록</h2>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>
  <div id="ghosts"></div>
</main>

<script>
(() => {
'use strict';

/* ============================================================
   상수
   ============================================================ */
const TICKS = 10;
const HAND_SIZE = 10;         // 손패 장수
const TICK_MS = 210;          // 행동턴 한 틱 재생 시간
const NEAR = 2.5;             // 몹 패턴 분기 기준 거리
const CONTACT = 0.6;          // 이 거리보다 가까이는 못 붙는다 (몸통 반지름 합)

const D2R = Math.PI / 180;

// brief 는 좁은 카드 면에 적는 줄, text 는 마우스를 올렸을 때 나오는 원문
const CARDS = {
  attack: { id:'attack', name:'공격', ticks:3, kind:'attack',
            brief:'정면 30°<br>사거리 2.0<br>피해 3',
            text:'정면 30도 · 사거리 2.0 안의 적에게 3 피해' },
  whirl:  { id:'whirl',  name:'선풍', ticks:4, kind:'whirl',
            brief:'전방위<br>사거리 1.6<br>피해 3',
            text:'전방위 · 사거리 1.6 안 모두에게 3 피해' },
  move:   { id:'move',   name:'이동', ticks:2, kind:'move',
            brief:'적에게로 1.5<br>그쪽을 본다',
            text:'가까운 적을 향해 1.5 활주. 그쪽을 본다' },
  dodge:  { id:'dodge',  name:'회피', ticks:1, kind:'dodge',
            brief:'적 반대로 2.0<br>마주 본 채',
            text:'가까운 적의 반대로 2.0 물러남. 계속 마주 본다' },
  turn:   { id:'turn',   name:'선회', ticks:1, kind:'turn',
            brief:'적 축으로 45°<br>방향 안 바뀜',
            text:'가까운 적을 축으로 45도 돎. 거리 유지, 방향 안 바뀜' },
  wait:   { id:'wait',   name:'대기', ticks:1, kind:'wait',
            brief:'한 틱 흘림',
            text:'아무것도 하지 않고 한 틱 흘림' },
};

// 이동 계열 — 한 틱 안에서 공격보다 먼저 해소된다
const MOVE_KINDS = { move:1, dodge:1, turn:1 };
// 공격 계열 — 전방위인지 아닌지만 다르다
const ATTACK_KINDS = { attack:1, whirl:1 };

const PLAYER_BASE = { hp:20, maxHp:20, atk:3,
                      range:2.0, whirlRange:1.6, aimArc:30 * D2R,
                      moveDist:1.5, dodgeDist:2.0, turnArc:45 * D2R };

// 허수아비: 안 움직임 · 안 죽음 · 예고만 띄움
const SCARECROW = {
  name:'허수아비', immortal:true, atk:2, range:2.2, whirlRange:1.6,
  aimArc:30 * D2R, moveDist:0, dodgeDist:0, turnArc:0,
  patterns: {
    near: [ {kind:'wait',ticks:2}, {kind:'attack',ticks:3}, {kind:'wait',ticks:5} ],
    far:  [ {kind:'wait',ticks:10} ],
  },
};

/* ============================================================
   상태
   ============================================================ */
let player, mobs, deck, hand, discard, plan, phase, log;
let frames = null, playTick = -1, anim = null, runVerdicts = [], runMarks = [];

const $ = id => document.getElementById(id);
const cv = $('arena'), ctx = cv.getContext('2d');

function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

// 각을 -π..π 로 접는다. 조준각 비교는 전부 이걸 거친다.
function wrapAngle(r){
  r = r % (Math.PI * 2);
  if (r > Math.PI) r -= Math.PI * 2;
  if (r < -Math.PI) r += Math.PI * 2;
  return r;
}

// 이동은 평행이동, 선회는 축을 중심으로 한 회전
function applyMove(a){
  if (a.mv.rot){
    const rx = a.x - a.mv.px, ry = a.y - a.mv.py;
    const c = Math.cos(a.mv.dphi), s = Math.sin(a.mv.dphi);
    a.x = a.mv.px + rx * c - ry * s;
    a.y = a.mv.py + rx * s + ry * c;
  } else {
    a.x += a.mv.dx; a.y += a.mv.dy;
  }
}
function nearestMob(from){
  let best = null, bd = Infinity;
  for (const m of mobs){ const d = dist(from, m); if (d < bd){ bd = d; best = m; } }
  return best;
}

/* ============================================================
   덱
   ============================================================ */
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function drawUp(){
  const before = hand.length;
  while (hand.length < HAND_SIZE){
    if (!deck.length){
      if (!discard.length) break;
      deck = shuffle(discard); discard = [];
      addLog('sys', null, '덱이 비어 버림더미를 섞음');
    }
    hand.push(deck.pop());
  }
  for (let i = before; i < hand.length; i++) pendingDraw.push(i);
}

/* ============================================================
   타임라인 만들기
   ============================================================ */
// 블럭 목록 → 10칸 슬롯. 슬롯 하나 = {kind, name, offset, len, first, idx}
function slotsFromBlocks(blocks){
  const slots = new Array(TICKS).fill(null);
  let t = 0;
  for (let i = 0; i < blocks.length; i++){
    const b = blocks[i];
    for (let o = 0; o < b.ticks && t < TICKS; o++, t++){
      slots[t] = { kind:b.kind, name:b.name, offset:o, len:b.ticks, first:o === 0, idx:i };
    }
  }
  return slots;
}

function planBlocks(){
  return plan.map(c => ({ kind:c.kind, name:c.name, ticks:c.ticks }));
}
function usedTicks(){ return plan.reduce((s, c) => s + c.ticks, 0); }

// 몹 예고: 플레이어와의 거리로 패턴 분기
function telegraph(){
  for (const m of mobs){
    const key = dist(m, player) <= NEAR ? 'near' : 'far';
    m.branch = key;
    m.slots = slotsFromBlocks(
      SCARECROW.patterns[key].map(p => ({
        kind: p.kind, ticks: p.ticks,
        name: p.kind === 'attack' ? '공격' : '대기',
      }))
    );
  }
}

/* ============================================================
   시뮬레이션 — 10틱을 미리 다 계산해 두고 재생만 한다
   ============================================================ */
// blocks 를 넣으면 그 계획으로 10틱을 돌린다.
// 돌려주는 값: { frames, verdicts }
//   verdicts[i] = 내 i번째 카드의 소용없음 사유. 쓸모 있으면 null.
function simulate(blocks){
  const verdicts = blocks.map(() => null);
  const marks = [];              // 쿼터뷰에 그릴 예고 표식 (나·몹 공통)
  const P = { x:player.x, y:player.y, hp:player.hp, f:player.f,
              mv:null, immortal:false,
              range:player.range, whirlRange:player.whirlRange, aimArc:player.aimArc,
              moveDist:player.moveDist, dodgeDist:player.dodgeDist,
              turnArc:player.turnArc, atk:player.atk,
              side:'p', mi:0,
              label:'나', slots: slotsFromBlocks(blocks) };
  const M = mobs.map((m, i) => ({
    x:m.x, y:m.y, hp:m.hp, f:m.f, mv:null, immortal:SCARECROW.immortal,
    range:SCARECROW.range, whirlRange:SCARECROW.whirlRange, aimArc:SCARECROW.aimArc,
    moveDist:SCARECROW.moveDist, dodgeDist:SCARECROW.dodgeDist,
    turnArc:SCARECROW.turnArc, atk:SCARECROW.atk,
    side:'m', mi:i,
    label:m.name, slots:m.slots,
  }));

  const snap = () => ({
    p:{ x:P.x, y:P.y, hp:P.hp, f:P.f },
    m: M.map(m => ({ x:m.x, y:m.y, hp:m.hp, f:m.f })),
  });

  const out = [Object.assign(snap(), { events:[] })];

  const foesOf = a => (a === P ? M : [P]);
  const nearestOf = a => {
    let best = null, bd = Infinity;
    for (const f of foesOf(a)){
      const d = Math.hypot(f.x - a.x, f.y - a.y);
      if (d < bd){ bd = d; best = f; }
    }
    return { foe:best, d:bd };
  };

  for (let t = 0; t < TICKS; t++){
    const events = [];
    const actors = [P].concat(M);

    // 이 틱 이후로 저쪽에서 들어올 공격들
    const threats = (a, from) => {
      const list = [];
      for (const f of foesOf(a))
        for (let ft = from; ft < TICKS; ft++){
          const fs = f.slots[ft];
          if (fs && ATTACK_KINDS[fs.kind] && fs.first) list.push({ foe:f, kind:fs.kind });
        }
      return list;
    };
    // 그 위협이 (x,y) 에 닿나 — 사거리와 조준각을 함께 본다
    const lands = (th, x, y) => {
      const f = th.foe, whirl = th.kind === 'whirl';
      const d = Math.hypot(x - f.x, y - f.y);
      if (d > (whirl ? f.whirlRange : f.range) + 1e-9) return false;
      if (whirl) return true;
      return Math.abs(wrapAngle(Math.atan2(y - f.y, x - f.x) - f.f)) <= f.aimArc + 1e-9;
    };
    const anyLands = (ths, x, y) => ths.some(th => lands(th, x, y));

    // 1) 이동 계열 먼저 — 같은 틱에 빠져나가 회피·선회가 성립하도록
    for (const a of actors){
      const s = a.slots[t];
      if (!s || !MOVE_KINDS[s.kind]){ a.mv = null; continue; }
      if (s.first){
        // 방향은 카드 시작 틱에 고정 (매 틱 재조준 안 함)
        const near = nearestOf(a);
        const foe = near.foe;
        let futile = null;
        a.mv = null;

        if (!foe){
          futile = '대상이 없음';
        } else if (s.kind === 'turn' || s.kind === 'dodge'){
          // 회피·선회는 같은 위협을 서로 다른 축으로 흘린다.
          // 판정 뼈대는 하나로 두고 "어디로 가느냐" 만 다르다.
          const isTurn = s.kind === 'turn';
          let nx, ny;

          if (isTurn){
            // 대상을 축으로 돈다. 거리는 그대로, 방향은 안 바뀐다.
            // 도는 쪽은 상대 조준각에서 더 빨리 빠지는 쪽으로 고른다.
            const bearing = Math.atan2(a.y - foe.y, a.x - foe.x);   // 적이 나를 보는 각
            const total = a.turnArc * (wrapAngle(bearing - foe.f) >= 0 ? 1 : -1);
            const r = near.d;
            nx = foe.x + Math.cos(bearing + total) * r;
            ny = foe.y + Math.sin(bearing + total) * r;
            a.mv = { rot:true, px:foe.x, py:foe.y, dphi:total / s.len };
          } else {
            const total = a.dodgeDist;
            a.f = Math.atan2(foe.y - a.y, foe.x - a.x);   // 마주 본 채 물러난다
            const ux = near.d < 1e-6 ? -1 : (foe.x - a.x) / near.d;
            const uy = near.d < 1e-6 ? 0 : (foe.y - a.y) / near.d;
            nx = a.x - ux * total; ny = a.y - uy * total;
            const step = total / s.len;
            a.mv = { dx:-ux * step, dy:-uy * step };
          }

          const ths = threats(a, t);
          if (!ths.length) futile = '적 공격 없음';
          else if (!anyLands(ths, a.x, a.y)) futile = '이미 위협 밖';
          else if (anyLands(ths, nx, ny))
            futile = isTurn ? '적 조준을 못 벗어남' : '적 사거리를 못 벗어남';
        } else {
          // 이동 — 접촉거리보다 가까이는 못 붙는다 (뚫고 지나가지도 않음)
          const room = Math.max(0, near.d - CONTACT);
          const total = Math.min(a.moveDist, room);
          if (room <= 1e-9) futile = '이미 끝까지 붙음';
          a.f = Math.atan2(foe.y - a.y, foe.x - a.x);   // 다가가며 그쪽을 본다
          const step = total / s.len;
          a.mv = near.d < 1e-6 ? { dx:0, dy:0 }
               : { dx:(foe.x - a.x) / near.d * step, dy:(foe.y - a.y) / near.d * step };
        }

        if (a === P) verdicts[s.idx] = futile;
        marks.push({ side:a.side, mi:a.mi, kind:s.kind, name:s.name,
                     t:t, len:s.len, futile:futile,
                     pivot:(s.kind === 'turn' && foe) ? { x:foe.x, y:foe.y } : null });
        events.push({ type:'mv', who:a.label, name:s.name, futile:futile });
      }
      if (a.mv) applyMove(a);
    }

    // 2) 그다음 공격 판정 — 점유 첫 틱에만
    for (const a of actors){
      const s = a.slots[t];
      if (!s || !ATTACK_KINDS[s.kind] || !s.first) continue;
      const whirl = s.kind === 'whirl';
      const reach = whirl ? a.whirlRange : a.range;

      // 사거리 안이면서 (전방위가 아니면) 조준각 안에 든 적을 모두 고른다
      const inReach = foesOf(a).map(f => ({
        foe:f, d:Math.hypot(f.x - a.x, f.y - a.y),
        off:Math.abs(wrapAngle(Math.atan2(f.y - a.y, f.x - a.x) - a.f)),
      })).filter(o => o.d <= reach + 1e-9);
      const struck = whirl ? inReach : inReach.filter(o => o.off <= a.aimArc + 1e-9);

      const near = nearestOf(a);
      // 판정은 나·몹 모두에게 계산한다. 표식 어휘를 공통으로 쓰기 위해서다.
      const futile = !near.foe ? '대상이 없음'
                   : struck.length ? null
                   : (near.d > reach + 1e-9 ? '사거리 밖' : '조준 밖');
      if (a === P) verdicts[s.idx] = futile;
      marks.push({ side:a.side, mi:a.mi, kind:s.kind, name:s.name,
                   t:t, len:s.len, futile:futile, range:reach,
                   arc:whirl ? Math.PI : a.aimArc,
                   tgtSide:near.foe ? near.foe.side : null,
                   tgtMi:near.foe ? near.foe.mi : 0 });

      if (!near.foe){ events.push({ type:'miss', who:a.label, tgt:'없음', d:0 }); continue; }
      if (struck.length){
        for (const o of struck){
          if (!o.foe.immortal) o.foe.hp = Math.max(0, o.foe.hp - a.atk);
          events.push({ type:'hit', who:a.label, name:s.name, tgt:o.foe.label,
                        dmg:a.atk, d:o.d, blocked:o.foe.immortal });
        }
      } else {
        events.push({ type:'miss', who:a.label, name:s.name, tgt:near.foe.label,
                      d:near.d, why:futile });
      }
    }

    out.push(Object.assign(snap(), { events:events }));
  }

  // 표식에 좌표를 채운다. 위치는 이미 찍어 둔 틱별 스냅숏에서 가져온다.
  const posAt = (side, mi, t) => (side === 'p' ? out[t].p : out[t].m[mi]);
  for (const k of marks){
    k.from = posAt(k.side, k.mi, k.t);
    k.to   = posAt(k.side, k.mi, Math.min(TICKS, k.t + k.len));
    k.at   = posAt(k.side, k.mi, k.t + 1);          // 효과가 나는 순간 (이동 뒤)
    if (k.tgtSide) k.tgt = posAt(k.tgtSide, k.tgtMi, k.t + 1);
  }

  return { frames:out, verdicts:verdicts, marks:marks };
}

/* ============================================================
   렌더 — 쿼터뷰(아이소메트릭)
   ============================================================ */
const ISO_W = 58, ISO_H = 29;

function fitCanvas(){
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function iso(x, y){ return { sx:(x - y) * ISO_W / 2, sy:(x + y) * ISO_H / 2 }; }

// 표식 색 — 타임라인 칸 색과 같게 맞춘다
const MARK_COLOR = { move:'#7FD4EC', dodge:'#86DFAE', turn:'#B9A8F0',
                     attack:'#FF9E8E', whirl:'#FFC489' };
const FUTILE_COLOR = '#D8B45E';

// 세계의 부채꼴을 아이소 화면에 그린다. 호를 잘게 찍어 잇는다.
// (세계의 원은 축정렬 타원이 되지만, 부채꼴은 시작·끝 각이 뒤틀리므로 표본이 안전하다)
function sectorPath(S, cx, cy, r, mid, half){
  const N = 40;
  const c = S(cx, cy);
  const full = half >= Math.PI - 1e-6;
  ctx.beginPath();
  if (!full) ctx.moveTo(c[0], c[1]);
  for (let i = 0; i <= N; i++){
    const ang = mid - half + (half * 2) * i / N;
    const p = S(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
    if (full && i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath();
}

/* 예고 표식 — 나와 몹에 똑같은 어휘를 쓴다.
   이동/회피 = 지면 화살표, 공격 = 사거리 고리 + 대상 선.
   소용없는 것은 호박색 점선으로 낮춘다. 각 표식에 시작 틱 번호를 붙인다. */
function drawMarks(S, marks, nowTick){
  if (!marks) return;
  for (const k of marks){
    const done = nowTick != null && k.t < nowTick;
    const color = k.futile ? FUTILE_COLOR : (MARK_COLOR[k.kind] || '#8E8C82');
    const alpha = done ? .22 : (k.futile ? .55 : .95);
    const dash = k.futile ? [4, 4] : null;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash);

    let chip = null;
    if (k.kind === 'attack' || k.kind === 'whirl'){
      const a = S(k.at.x, k.at.y);
      // 조준 부채꼴. 선풍은 half=π 라 온전한 고리가 된다.
      sectorPath(S, k.at.x, k.at.y, k.range, k.at.f, k.arc);
      ctx.stroke();
      if (!k.futile){
        ctx.globalAlpha = alpha * .13;
        ctx.fill();
        ctx.globalAlpha = alpha;
      }
      if (k.tgt){
        const b = S(k.tgt.x, k.tgt.y);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        // 닿으면 대상 발밑에 표적, 안 닿으면 ✕
        ctx.setLineDash([]);
        ctx.beginPath();
        if (k.futile){
          ctx.moveTo(b[0] - 6, b[1] - 6); ctx.lineTo(b[0] + 6, b[1] + 6);
          ctx.moveTo(b[0] + 6, b[1] - 6); ctx.lineTo(b[0] - 6, b[1] + 6);
          ctx.stroke();
        } else {
          ctx.ellipse(b[0], b[1], 9, 4.5, 0, 0, Math.PI * 2); ctx.stroke();
        }
      }
      chip = a;
    } else if (k.kind === 'turn'){
      // 선회 — 축을 중심으로 한 호 화살표
      const a = S(k.from.x, k.from.y);
      const piv = k.pivot || k.from;
      const r = Math.hypot(k.from.x - piv.x, k.from.y - piv.y);
      const a0 = Math.atan2(k.from.y - piv.y, k.from.x - piv.x);
      const a1 = Math.atan2(k.to.y - piv.y, k.to.x - piv.x);
      const sweep = wrapAngle(a1 - a0);
      const N = 24;
      let prev = a;
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      for (let i = 1; i <= N; i++){
        const ang = a0 + sweep * i / N;
        const p = S(piv.x + Math.cos(ang) * r, piv.y + Math.sin(ang) * r);
        ctx.lineTo(p[0], p[1]);
        if (i === N - 1) prev = p;
      }
      ctx.stroke();
      // 축까지 가는 옅은 실 — 무엇을 중심으로 도는지 보여 준다
      ctx.save();
      ctx.globalAlpha = alpha * .35; ctx.setLineDash([2, 5]); ctx.lineWidth = 1;
      const pc = S(piv.x, piv.y);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(pc[0], pc[1]); ctx.stroke();
      ctx.restore();
      // 호 끝 화살촉
      const b = S(k.to.x, k.to.y);
      const ux = b[0] - prev[0], uy = b[1] - prev[1], L2 = Math.hypot(ux, uy) || 1;
      const nx = ux / L2, ny = uy / L2, px = -ny * 5.5, py = nx * 5.5;
      const hx = b[0] - nx * 9, hy = b[1] - ny * 9;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(b[0], b[1]);
      ctx.lineTo(hx + px, hy + py);
      ctx.lineTo(hx - px, hy - py);
      ctx.closePath(); ctx.fill();
      chip = a;
    } else {
      // 이동 · 회피 — 지면 위 화살표
      const a = S(k.from.x, k.from.y), b = S(k.to.x, k.to.y);
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
      if (L < 2){
        // 제자리 — 못 감을 뜻하는 짧은 가로줄
        ctx.beginPath(); ctx.moveTo(a[0] - 8, a[1]); ctx.lineTo(a[0] + 8, a[1]); ctx.stroke();
      } else {
        const ux = dx / L, uy = dy / L;
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        ctx.setLineDash([]);
        const hx = b[0] - ux * 9, hy = b[1] - uy * 9, px = -uy * 5.5, py = ux * 5.5;
        ctx.beginPath();
        ctx.moveTo(b[0], b[1]);
        ctx.lineTo(hx + px, hy + py);
        ctx.lineTo(hx - px, hy - py);
        ctx.closePath(); ctx.fill();
      }
      chip = a;
    }

    // 시작 틱 번호 — 타임라인 칸과 눈으로 잇는 고리
    ctx.setLineDash([]);
    ctx.globalAlpha = done ? .25 : 1;
    ctx.fillStyle = '#0D0D0B';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(chip[0], chip[1] - 2, 8, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = '700 10px Inter, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(k.t + 1), chip[0], chip[1] - 1);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }
}

function drawScene(pos, marks, nowTick){
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);

  // 카메라는 플레이어를 따라감 (지면 무한 · 벽 없음)
  const pi = iso(pos.p.x, pos.p.y);
  const camX = w / 2 - pi.sx;
  const camY = h / 2 - pi.sy + 20;
  const S = (x, y) => { const q = iso(x, y); return [q.sx + camX, q.sy + camY]; };

  // 지면 격자 — 시각 기준선일 뿐, 규칙상 격자 아님
  const cx = Math.round(pos.p.x), cy = Math.round(pos.p.y), R = 9;
  ctx.lineWidth = 1;
  for (let i = -R; i <= R; i++){
    let a, b;
    ctx.strokeStyle = (cx + i) % 5 === 0 ? '#26261F' : '#191915';
    a = S(cx + i, cy - R); b = S(cx + i, cy + R);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    ctx.strokeStyle = (cy + i) % 5 === 0 ? '#26261F' : '#191915';
    a = S(cx - R, cy + i); b = S(cx + R, cy + i);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }

  // 지금 내 사거리 — 늘 보이는 기준선
  ctx.save();
  ctx.setLineDash([3, 5]);
  ctx.strokeStyle = 'rgba(255,212,0,.22)'; ctx.lineWidth = 1;
  const pr = S(pos.p.x, pos.p.y);
  ctx.beginPath();
  ctx.ellipse(pr[0], pr[1], player.range * Math.SQRT2 * ISO_W / 2,
              player.range * Math.SQRT2 * ISO_H / 2, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // 예고 표식 — 몸통보다 아래 층에 깐다
  drawMarks(S, marks, nowTick);

  // 그림자 + 방향 눈금 + 몸통 + 이름
  const body = (x, y, f, label, draw) => {
    const p = S(x, y), sx = p[0], sy = p[1];
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.ellipse(sx, sy, 15, 7.5, 0, 0, Math.PI * 2); ctx.fill();
    // 바라보는 쪽 — 조준각이 어디를 덮는지 읽으려면 이게 있어야 한다
    if (f != null){
      const tip = S(x + Math.cos(f) * 1.05, y + Math.sin(f) * 1.05);
      const ux = tip[0] - sx, uy = tip[1] - sy, L = Math.hypot(ux, uy) || 1;
      const nx = ux / L, ny = uy / L;
      ctx.save();
      ctx.strokeStyle = 'rgba(245,244,236,.5)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx + nx * 9, sy + ny * 9); ctx.lineTo(tip[0], tip[1]);
      ctx.stroke();
      ctx.fillStyle = 'rgba(245,244,236,.5)';
      ctx.beginPath();
      ctx.moveTo(tip[0], tip[1]);
      ctx.lineTo(tip[0] - nx * 7 - ny * 4, tip[1] - ny * 7 + nx * 4);
      ctx.lineTo(tip[0] - nx * 7 + ny * 4, tip[1] - ny * 7 - nx * 4);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    draw(sx, sy);
    ctx.fillStyle = '#8E8C82';
    ctx.font = '600 11px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, sx, sy + 18);
  };

  // 몹 먼저, 플레이어 나중 (겹칠 때 플레이어가 위)
  pos.m.forEach((m, i) => body(m.x, m.y, m.f, mobs[i].name, (sx, sy) => {
    ctx.strokeStyle = '#6B6558'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx, sy - 2); ctx.lineTo(sx, sy - 40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx - 13, sy - 28); ctx.lineTo(sx + 13, sy - 28); ctx.stroke();
    ctx.fillStyle = '#8A8272';
    ctx.beginPath(); ctx.arc(sx, sy - 44, 8, 0, Math.PI * 2); ctx.fill();
  }));

  body(pos.p.x, pos.p.y, pos.p.f, '나', (sx, sy) => {
    ctx.fillStyle = '#FFD400';
    ctx.beginPath();
    ctx.moveTo(sx, sy - 46); ctx.lineTo(sx + 11, sy - 26);
    ctx.lineTo(sx + 7, sy - 2); ctx.lineTo(sx - 7, sy - 2);
    ctx.lineTo(sx - 11, sy - 26); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1A1A17';
    ctx.beginPath(); ctx.arc(sx, sy - 34, 4, 0, Math.PI * 2); ctx.fill();
  });
}

/* ============================================================
   UI
   ============================================================ */
function renderTimeline(nowTick, verdicts){
  const rows = [{ label:'', slots:null, ruler:true }];
  mobs.forEach(m => rows.push({ label:m.name, slots:m.slots, me:false }));
  rows.push({ label:'나', slots:slotsFromBlocks(planBlocks()), me:true,
              verdicts:verdicts || [] });

  const el = $('tl');
  el.innerHTML = '';
  for (const r of rows){
    const lab = document.createElement('div');
    lab.className = 'tl-label' + (r.me ? ' me' : '');
    lab.textContent = r.label;
    el.appendChild(lab);

    const cells = document.createElement('div');
    cells.className = 'tl-cells';
    for (let t = 0; t < TICKS; t++){
      const c = document.createElement('div');
      if (r.ruler){
        c.className = 'cell ruler';
        c.textContent = t + 1;
      } else {
        const s = r.slots ? r.slots[t] : null;
        const cls = ['cell'];
        if (s){
          cls.push(s.kind);
          if (!s.first) cls.push('mid');
          if (s.offset < s.len - 1 && t < TICKS - 1) cls.push('notend');
          const why = r.me ? r.verdicts[s.idx] : null;
          if (why){ cls.push('futile'); c.title = '소용없음 — ' + why; }
          if (s.first){
            c.textContent = (why ? '✕ ' : '') + s.name;
            if (r.me) c.dataset.idx = s.idx;
          }
        }
        if (nowTick != null){
          if (t === nowTick) cls.push('now');
          else if (t < nowTick) cls.push('past');
        }
        c.className = cls.join(' ');
      }
      cells.appendChild(c);
    }
    el.appendChild(cells);
  }
}

/* ============================================================
   카드 모션 — 덱에서 뽑고, 쓰고, 무덤으로 보낸다
   ============================================================ */
let pendingDraw = [];          // 이번 그리기에서 날아 들어와야 할 손패 자리

function rectOf(el){
  const r = el.getBoundingClientRect();
  return { x:r.left, y:r.top, w:r.width, h:r.height };
}

function cardFace(card, why){
  return '<div class="nm"><span>' + card.name + '</span>' +
         '<span class="tk">' + card.ticks + '틱</span></div>' +
         '<div class="tx">' + card.brief + '</div>' +
         (why ? '<div class="warn">✕ ' + why + '</div>' : '');
}

// from → to 로 날아가는 카드 한 장. 끝나면 스스로 사라진다.
function fly(card, from, to, opt){
  opt = opt || {};
  const dur = opt.dur || 320, delay = opt.delay || 0;
  const g = document.createElement('div');
  g.className = 'ghost pc k-' + card.kind;
  g.innerHTML = cardFace(card, null);
  g.style.width = from.w + 'px';
  g.style.height = from.h + 'px';
  g.style.transitionDuration = dur + 'ms';
  g.style.transitionDelay = delay + 'ms';
  const at = (r, rot, sx, sy) => 'translate(' + r.x + 'px,' + r.y + 'px) rotate(' +
    rot + 'deg) scale(' + sx + ',' + sy + ')';
  g.style.transform = at(from, opt.rot0 || 0, 1, 1);
  g.style.opacity = '1';
  $('ghosts').appendChild(g);
  // 두 프레임 뒤에 목표로 넘긴다 (첫 프레임은 시작값을 굳히는 데 쓴다)
  requestAnimationFrame(() => requestAnimationFrame(() => {
    g.style.transform = at(to, opt.rot1 || 0, to.w / from.w, to.h / from.h);
    if (opt.fade) g.style.opacity = '0';
  }));
  setTimeout(() => {
    g.remove();
    if (opt.reveal) opt.reveal.style.visibility = '';
  }, delay + dur + 40);
}

// 덱에서 손패로 — 새로 들어온 자리만 날린다
function runDrawFlights(){
  if (!pendingDraw.length) return;
  const idxs = pendingDraw.slice();
  pendingDraw = [];
  const deckR = rectOf($('deckPile'));
  const kids = $('hand').children;
  idxs.forEach((idx, n) => {
    const el = kids[idx];
    if (!el || !hand[idx]) return;
    fly(hand[idx], deckR, rectOf(el),
        { delay:n * 45, dur:330, rot0:-10, rot1:0, reveal:el });
  });
}

function renderHand(preview){
  const el = $('hand');
  el.innerHTML = '';
  const left = TICKS - usedTicks();
  const drawing = pendingDraw.length ? pendingDraw : null;
  hand.forEach((card, i) => {
    const b = document.createElement('button');
    const why = preview ? preview[i] : null;
    b.className = 'pc k-' + card.kind + (why ? ' futile' : '');
    b.disabled = phase !== 'plan' || card.ticks > left;
    b.title = card.text + (why ? ' ✕ 소용없음 — ' + why : '');
    b.innerHTML = cardFace(card, why);
    if (drawing && drawing.indexOf(i) >= 0) b.style.visibility = 'hidden';
    b.onclick = () => {
      const from = rectOf(b);
      const idx = plan.length;
      plan.push(card); hand.splice(i, 1);
      refresh();
      // 쓴 카드는 타임라인의 제 칸으로 날아가 들어간다
      const cell = $('tl').querySelector('[data-idx="' + idx + '"]');
      if (cell) fly(card, from, rectOf(cell), { dur:260, rot1:0, fade:true });
    };
    el.appendChild(b);
  });
  for (let i = hand.length; i < HAND_SIZE; i++){
    const d = document.createElement('div');
    d.className = 'pc slot';
    el.appendChild(d);
  }
  $('handInfo').textContent = '(남은 틱 ' + left + ')';
}

function renderStats(pos){
  const p = pos ? pos.p : player;
  $('php').style.width = (p.hp / player.maxHp * 100) + '%';
  $('sHp').textContent = p.hp + ' / ' + player.maxHp;
  const n = nearestMob(p);
  $('sDist').textContent = n ? dist(p, n).toFixed(2) : '–';
  $('sDeck').textContent = deck.length;
  $('sDisc').textContent = discard.length;
}

function addLog(cls, t, msg){
  log.unshift({ cls:cls, t:t, msg:msg });
  $('log').innerHTML = log.slice(0, 60).map(l =>
    '<div><span class="t">' + (l.t == null ? '' : (l.t + 1) + '틱') + '</span>' +
    '<span class="' + l.cls + '">' + l.msg + '</span></div>').join('');
}

// 계획을 드라이런해서 카드마다 소용없음을 미리 판정한다.
// 손패 미리보기는 "지금 이 카드를 끝에 붙이면?" 을 한 장씩 돌려 본다.
function judge(){
  const blocks = planBlocks();
  const base = simulate(blocks);
  const left = TICKS - usedTicks();
  const preview = hand.map(card => {
    if (card.ticks > left) return null;                 // 못 내는 카드는 판정 안 함
    const trial = blocks.concat([{ kind:card.kind, name:card.name, ticks:card.ticks }]);
    return simulate(trial).verdicts[blocks.length];
  });
  return { verdicts:base.verdicts, marks:base.marks, preview:preview };
}

function refresh(pos, nowTick){
  const p = pos || { p:{ x:player.x, y:player.y, hp:player.hp, f:player.f },
                     m: mobs.map(m => ({ x:m.x, y:m.y, hp:m.hp, f:m.f })) };
  const j = judge();
  drawScene(p, j.marks, nowTick);
  renderTimeline(nowTick, j.verdicts);
  renderHand(j.preview);
  renderStats(p);

  const running = phase === 'run';
  const bad = j.verdicts.filter(Boolean).length;
  $('undo').disabled = running || !plan.length;
  $('run').disabled = running;
  $('reset').disabled = running;
  $('phase').textContent = running ? '행동턴 · 재생 중' : '예고 · 계획';
  $('hint').textContent = running ? ''
    : bad ? '✕ 소용없는 카드 ' + bad + '장 (' + usedTicks() + '/10틱)'
    : plan.length ? usedTicks() + '/10틱 사용' : '카드를 눌러 타임라인을 채워라';
  $('hint').className = 'hint' + (!running && bad ? ' bad' : '');
  runDrawFlights();
}

/* ============================================================
   행동턴 재생
   ============================================================ */
function play(){
  if (phase === 'run') return;
  phase = 'run';
  const r = simulate(planBlocks());
  frames = r.frames;
  runVerdicts = r.verdicts;
  runMarks = r.marks;
  playTick = 0;
  addLog('sys', null, '─── 행동턴 시작 ───');
  refresh(frames[0], 0);
  step();
}

function step(){
  if (playTick >= TICKS){ finishRound(); return; }
  const from = frames[playTick], to = frames[playTick + 1];
  const tick = playTick;
  const t0 = performance.now();

  const frame = now => {
    const k = Math.min(1, (now - t0) / TICK_MS);
    const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   // easeInOutQuad
    const lerp = (a, b) => a + (b - a) * e;
    drawScene({
      p:{ x:lerp(from.p.x, to.p.x), y:lerp(from.p.y, to.p.y), hp:to.p.hp, f:to.p.f },
      m: to.m.map((m, i) => ({ x:lerp(from.m[i].x, m.x), y:lerp(from.m[i].y, m.y),
                               hp:m.hp, f:m.f })),
    }, runMarks, tick);
    if (k < 1){ anim = requestAnimationFrame(frame); return; }

    for (const ev of to.events){
      if (ev.type === 'mv') addLog(ev.futile ? 'bad' : 'mv', tick,
        ev.who + ' ' + ev.name + (ev.futile ? ' ✕ ' + ev.futile : ' 시작'));
      else if (ev.type === 'hit') addLog('hit', tick,
        ev.who + ' ' + ev.name + ' → ' + ev.tgt + ' 명중 ' + ev.dmg + ' 피해' +
        (ev.blocked ? ' (허수아비는 안 죽음)' : ''));
      else addLog('bad', tick,
        ev.who + ' ' + (ev.name || '') + ' → ' + ev.tgt + ' ✕ ' +
        (ev.why || '빗나감') + ' (거리 ' + ev.d.toFixed(2) + ')');
    }
    renderTimeline(tick, runVerdicts);
    renderStats(to);
    playTick++;
    anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(frame);
}

function finishRound(){
  const last = frames[TICKS];
  player.x = last.p.x; player.y = last.p.y; player.hp = last.p.hp; player.f = last.p.f;
  mobs.forEach((m, i) => {
    m.x = last.m[i].x; m.y = last.m[i].y; m.hp = last.m[i].hp; m.f = last.m[i].f;
  });

  // 무덤으로 날리기 전에 타임라인에서 카드 칸 위치를 먼저 잰다
  const played = plan.slice();
  const froms = played.map((c, i) => {
    const cell = $('tl').querySelector('[data-idx="' + i + '"]');
    return cell ? rectOf(cell) : null;
  });

  discard.push.apply(discard, plan);
  plan = [];
  phase = 'plan';
  drawUp();
  telegraph();                                   // 다음 회 예고
  addLog('sys', null, '─── 행동턴 끝 · 다음 예고 (' +
    (mobs[0].branch === 'near' ? '가까움' : '멂') + ') ───');
  refresh();

  const graveR = rectOf($('gravePile'));
  played.forEach((c, i) => {
    if (froms[i]) fly(c, froms[i], graveR,
                      { delay:i * 55, dur:380, rot1:12, fade:true });
  });
}

/* ============================================================
   시작
   ============================================================ */
function reset(){
  if (anim) cancelAnimationFrame(anim);
  $('ghosts').innerHTML = '';
  pendingDraw = [];
  player = Object.assign({}, PLAYER_BASE, { x:0, y:0, f:0 });
  mobs = [{ name:SCARECROW.name, x:3.4, y:1.6, hp:99, f:0, slots:null, branch:'far' }];
  // 처음에는 서로 마주 본다
  player.f = Math.atan2(mobs[0].y - player.y, mobs[0].x - player.x);
  mobs[0].f = Math.atan2(player.y - mobs[0].y, player.x - mobs[0].x);
  // 덱 20장 = 공격 5 · 이동 4 · 회피 3 · 선회 3 · 대기 3 · 선풍 2
  const mix = [[CARDS.attack, 5], [CARDS.move, 4], [CARDS.dodge, 3],
               [CARDS.turn, 3], [CARDS.wait, 3], [CARDS.whirl, 2]];
  const cards = [];
  for (const pair of mix) for (let i = 0; i < pair[1]; i++) cards.push(pair[0]);
  deck = shuffle(cards);
  hand = []; discard = []; plan = []; log = [];
  phase = 'plan';
  drawUp();
  telegraph();
  addLog('sys', null, '샌드박스 시작. 예고를 읽어라.');
  refresh();
}

$('run').onclick = play;
$('reset').onclick = reset;
$('undo').onclick = () => {
  if (phase !== 'plan' || !plan.length) return;
  hand.push(plan.pop());
  refresh();
};

window.addEventListener('resize', () => { fitCanvas(); refresh(); });
fitCanvas();
reset();
})();
</script>
