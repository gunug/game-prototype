<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>슬라이드 — Game Prototype</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFD400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  /* 위험 표시가 보일 때의 불투명도. 칸 색과 딱지가 같은 값을 쓴다 */
  :root{--danger-alpha:.6;}
  body{
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    /* 3초 누르기가 브라우저 기본 길게 누르기(iOS 의 사진 저장 말풍선)에 먹히면
       우리 타이머가 차기 전에 pointercancel 이 날아온다 */
    -webkit-touch-callout:none;
  }
  /* 그림을 끌어다 놓는 기본 동작도 같은 이유로 막는다. 끌기가 시작되면
     그 순간 pointercancel 이다 */
  img{-webkit-user-drag:none;user-drag:none;}

  .play{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--canvas);}

  .topbar{
    display:flex;align-items:center;gap:var(--s3);
    padding:var(--s3) var(--s4);
    padding-top:calc(env(safe-area-inset-top,0px) + var(--s3));
    border-bottom:1px solid var(--hairline);
  }
  .topbar .name{color:var(--ink);font-weight:700;font-size:15px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .stat{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;
    white-space:nowrap;}
  .topbar .stat b{color:var(--ink);}
  .topbar .spacer{flex:1;}
  /* 단추 글자가 두 줄로 접히면 상단 바가 통째로 두 배가 된다 */
  .topbar .btn{white-space:nowrap;flex:none;}
  /* .btn 의 display:inline-flex 가 [hidden]{display:none} 을 이긴다 */
  .topbar .btn[hidden]{display:none;}
  /* 좁아지면 덜 급한 것부터 뺀다. 다 넣으려 들면 `다시` 가 화면 밖으로 나간다.
     순서: 몬스터 수 → 이름 → 턴. 체력·레벨·코인과 단추는 끝까지 남긴다 */
  @media (max-width:560px){
    .topbar{gap:var(--s2);padding-left:var(--s3);padding-right:var(--s3);}
    .topbar .stat.opt-mon{display:none;}
  }
  @media (max-width:470px){
    .topbar .name{display:none;}
    .topbar .stat.opt-turn{display:none;}
  }

  /* 상단 바 아래는 통째로 두 영역이다: 게임(1:1)과 정보(7:9 / 9:7).
     둘을 붙이면 16:9(가로) 또는 9:16(세로) 가 된다. 그 상자를 화면 안에
     최대로 넣고 가운데 둔다. 크기는 layout() 이 px 로 넣어 준다 */
  .split{
    flex:1;min-height:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  /* DOM 은 게임 → 정보 순이다. 가로면 그대로 왼쪽·오른쪽,
     세로면 뒤집어 정보가 위, 게임이 아래 */
  .split.wide{flex-direction:row;}
  .split:not(.wide){flex-direction:column-reverse;}

  /* 판이 들어갈 자리. 1:1 정사각. 판은 그 안에서 여백을 두고 가운데 선다 */
  .stage{flex:none;display:flex;align-items:center;justify-content:center;padding:var(--s3);}

  /* 조작영역. 블럭 일곱 개가 들어가는 한 줄. 두께는 블럭 하나다.
     가로면 게임 왼쪽에 세로줄, 세로면 게임 아래에 가로줄.
     DOM 은 게임 → 정보 → 조작 순인데, `order:-1` 로 늘 맨 앞(왼쪽/아래)에 세운다 */
  .control{
    flex:none;order:-1;
    display:grid;place-items:center;
    gap:var(--gap,8px);padding:var(--gap,8px);
  }
  .split.wide .control{grid-template-columns:1fr;grid-template-rows:repeat(7,1fr);}
  .split:not(.wide) .control{grid-template-columns:repeat(7,1fr);grid-template-rows:1fr;}
  /* 아직 무엇을 놓을지 안 정한 자리. 판의 빈 칸처럼 테두리만 그린다 */
  .slot{
    width:var(--sw,36px);height:var(--sw,36px);
    box-sizing:border-box;border-radius:var(--r-sm);
    box-shadow:inset 0 0 0 1px var(--hairline);
    opacity:.55;
  }
  /* 무엇이 놓인 자리. 판의 블럭처럼 노란 테를 두른다 */
  .slot.cmd{
    opacity:1;
    display:flex;align-items:center;justify-content:center;
    padding:0;margin:0;border:0;font:inherit;cursor:pointer;
    background:radial-gradient(ellipse at 50% 78%,
      rgba(255,212,0,.22), rgba(255,212,0,.06) 60%, transparent 76%);
    box-shadow:inset 0 0 0 1px rgba(255,212,0,.55);
    color:var(--ink);
  }
  .slot.cmd b{
    font-size:calc(var(--sw,36px) * .26);
    font-weight:800;line-height:1;letter-spacing:.02em;
  }
  .slot.cmd:active{background:rgba(255,212,0,.28);}
  /* 눌러서 고를 때도 쳐서 고를 때와 같이 한 번 움츠러든다 */
  .slot.cmd.hit{animation:cardhit .26s ease-out;}
  /* 지역 고르는 화면에서는 누를 것이 없다 */
  .control.idle .slot.cmd{opacity:.3;cursor:default;}

  /* 정보영역. 남는 자리를 다 쓴다. 조작영역이 생기면서 좁아졌다.
     카드는 칸을 그대로 채운다 */
  .info{
    flex:none;display:grid;place-items:center;
    gap:var(--gap,8px);padding:var(--gap,8px);
  }
  .split.wide .info{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);}
  .split:not(.wide) .info{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);}
  .card{
    width:var(--cw,120px);height:var(--ch,100px);
    box-sizing:border-box;
    background:var(--surface-soft);border-radius:var(--r-sm);
    box-shadow:inset 0 0 0 1px var(--hairline);
    padding:calc(var(--gap,8px) * .9);
    overflow:hidden;
    /* 카드 안 글자는 다 이 크기의 배수다. 카드가 작아지면 같이 줄어든다 */
    font-size:clamp(8px, calc(var(--u,60px) * .17), 13px);
  }
  /* 인스펙터. 탭한 블럭의 속을 판보다 크게 적는다.
     판 위 블럭은 칸 크기에 매여 있어 이름을 넣을 자리가 없다 */
  .inspect{display:flex;flex-direction:column;}
  .ins-head{display:flex;align-items:center;gap:.55em;flex:none;margin-bottom:.5em;}
  .ins-face{
    width:2.8em;height:2.8em;flex:none;
    object-fit:contain;image-rendering:pixelated;
    border-radius:var(--r-sm);
  }
  .ins-title{min-width:0;}
  /* 명칭은 카드에서 제일 큰 글씨다. 무엇을 보고 있는지가 먼저 읽혀야 한다 */
  .ins-name{
    display:block;color:var(--ink);font-weight:800;font-size:1.35em;line-height:1.15;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ins-kind{display:block;color:var(--muted);font-size:.85em;margin-top:.15em;}
  /* 스텟과 업그레이드를 한 통에 담아 같이 넘긴다. 따로 굴리면 카드가 좁을 때
     둘 다 반쪽만 보인다 */
  .ins-body{flex:1;min-height:0;overflow:auto;scrollbar-width:none;}
  .ins-body::-webkit-scrollbar{display:none;}
  /* 스텟은 자리가 되면 두 줄씩 나란히 세운다. 여섯 줄을 한 줄씩 쌓으면
     업그레이드가 카드 밖으로 밀려 스크롤해야만 보인다.
     auto-fit 이라 카드가 좁아지면 저절로 한 줄씩으로 돌아온다 */
  .ins-rows{
    list-style:none;margin:0;padding:0;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5em,1fr));
    gap:.3em .9em;
  }
  .ins-sub{
    color:var(--muted);font-size:.8em;font-weight:700;letter-spacing:.06em;
    margin:.7em 0 .35em;
  }
  .ins-ups{list-style:none;margin:0;padding:0;display:grid;gap:.4em;}
  .ins-ups li{display:flex;align-items:center;gap:.45em;min-width:0;}
  .ins-ups i{
    width:1.9em;height:1.9em;flex:none;border-radius:.2em;
    background-position:center;background-size:contain;background-repeat:no-repeat;
    image-rendering:pixelated;
  }
  .ins-ups span{min-width:0;}
  .ins-ups b{
    display:block;color:var(--ink);font-size:.95em;font-weight:700;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ins-ups small{
    display:block;color:var(--muted);font-size:.8em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ins-ups .up-none{color:var(--muted);font-size:.9em;}
  .ins-note{margin:0;color:var(--muted);font-size:.9em;line-height:1.4;}
  .ins-rows li{
    display:flex;align-items:baseline;justify-content:space-between;gap:.6em;
    color:var(--muted);font-size:.95em;
  }
  .ins-rows li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ins-rows b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;}
  /* 누르고 있는 동안 테가 차오른다. 3초를 채우면 대기로 턴이 넘어간다 */
  .token.holding{animation:holdring 3s linear forwards;}
  @keyframes holdring{
    from{box-shadow:inset 0 0 0 1px rgba(255,212,0,.55), 0 0 0 0 rgba(255,212,0,0);}
    to{box-shadow:inset 0 0 0 1px rgba(255,212,0,.55), 0 0 0 .22em rgba(255,212,0,.85);}
  }

  /* 지금 보고 있는 블럭. 안쪽 그림자는 이미 쓰고 있어서 바깥 선으로 알린다 */
  .token.picked{outline:2px solid var(--brand-yellow);outline-offset:1px;}

  /* 아직 무엇을 담을지 안 정한 자리 */
  .card.empty{background:none;box-shadow:inset 0 0 0 1px var(--hairline);opacity:.45;}

  /* 칸을 반올림하다 보면 몇 px 넘칠 때가 있다. 줄어들게 두면 가로만 깎여
     판이 정사각이 아니게 된다. 넘치면 넘치는 대로 둔다 */
  .board{
    position:relative;flex:none;
    /* 지역 바닥 그림. 11*11 판 전체에 한 장 깐다. 원본이 448*448 정사각이고
       판도 정사각이라 그대로 늘리면 맞는다 */
    background-position:center;background-size:100% 100%;background-repeat:no-repeat;
    border-radius:4px;
    /* 칸 색은 변수로 뺀다. 바닥 그림이 깔리면 반투명한 쪽으로 갈아 끼운다 */
    --cell-inner:var(--surface-soft);
    --cell-outer:#161613;
  }
  /* 바닥 그림이 있으면 칸을 비쳐 보이게 낮춘다. 안 그러면 그림이 통째로 덮인다.
     안쪽은 많이 비치고(38%), 바깥 띠는 덜 비친다(62%) — 거기는 볼 것이 아니라
     적이 어디서 나오는지만 알면 되는 자리다 */
  .board.has-bg{
    --cell-inner:rgba(38,38,31,.38);
    --cell-outer:rgba(22,22,19,.62);
  }

  /* 칸은 배경으로만 깔린다. 움직이는 것(플레이어/몬스터)은 그 위에 얹는다 */
  .cell{position:absolute;border-radius:3px;}
  .cell.outer{background:var(--cell-outer);box-shadow:inset 0 0 0 1px var(--hairline);}
  .cell.inner{
    background:var(--cell-inner);box-shadow:inset 0 0 0 1px var(--hairline);
    /* 아래 DANGER_FADE 와 같은 시간. 둘이 어긋나면 다 사라지기 전에 움직인다 */
    transition:background .09s, box-shadow .09s;
    display:flex;align-items:center;justify-content:center;
    /* 글자 크기는 칸을 따라가야 해서 layout() 이 px 로 넣어 준다 */
  }
  /* 다음 턴에 맞을 수 있는 빈 칸. 지금 몬스터가 바로 옆에 붙어 있는 칸이다.
     보일 때도 60% 로만 올린다. 위험은 알려 주되 판을 덮지는 않게.
     칸에 opacity 를 걸면 안 된다. 바탕(surface-soft)까지 같이 흐려져 이웃 칸보다
     어두워진다. 붉은 색만 겹쳐 깔고 그 색을 반투명으로 둔다 */
  .cell.inner.danger{
    background:
      linear-gradient(rgba(56,32,29,var(--danger-alpha)), rgba(56,32,29,var(--danger-alpha))),
      var(--cell-inner);
    box-shadow:inset 0 0 0 1px rgba(107,50,43,var(--danger-alpha));
  }

  /* 움직이는 동안에는 위험 표시를 지운다. 옮기기 전 상태를 그대로 두면
     이미 틀린 그림을 보고 있게 되고, 칸마다 따로 바뀌면 어지럽다.
     페이즈 시작에 흐려 두고, 끝에 새로 계산해서 다시 띄운다 */
  .board.hide-danger .cell.inner.danger{
    background:var(--cell-inner);box-shadow:inset 0 0 0 1px var(--hairline);
  }
  .board.hide-danger .hit-mark{opacity:0;}

  /* 그 칸으로 갔을 때 받을 피해. 타격 이펙트 그림 위에 숫자를 얹는다.
     예전에는 별 두 겹을 clip-path 로 잘라 만들었는데, 그림 한 장이면 끝난다 */
  .hit-mark{
    display:none;
    width:2.2em;height:2.2em;
    align-items:center;justify-content:center;
    background:url(images/icon/hit.png) center/contain no-repeat;
    opacity:var(--danger-alpha);
    transition:opacity .09s;
    pointer-events:none;
  }
  .hit-mark i{
    font-style:normal;font-weight:800;line-height:1;
    color:#fff;
    /* 붉은 이펙트 위에 흰 글씨라 검은 테를 둘러야 읽힌다 */
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
      0 1px 2px rgba(0,0,0,.9);
  }
  .cell.danger .hit-mark{display:flex;}
  /* 플레이어 것은 토큰 한가운데에 얹는다. 그대로 서 있으면 얼마나 맞는지를 알린다 */
  .player .hit-mark{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    font-size:var(--mark, 14px);
    z-index:2;
  }
  .player.threatened .hit-mark{display:flex;}

  /* 내부 6*6 의 테두리. 플레이어가 갈 수 있는 범위가 보이게 */
  .fence{
    position:absolute;pointer-events:none;border-radius:var(--r-sm);
    border:2px solid var(--brand-yellow-deep);opacity:.55;
  }

  .token{
    position:absolute;left:0;top:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--r-sm);
    font-weight:800;line-height:1;
    will-change:transform;
  }
  /* transform 은 자리를 잡는 데 쓰고 있다. 등장 효과는 안쪽 스프라이트에만 건다 */
  /* 스프라이트가 주인공이라 바닥판은 옅게 깔고 테두리로만 누가 있는지 알린다 */
  .player{
    background:radial-gradient(ellipse at 50% 78%,
      rgba(255,212,0,.42), rgba(255,212,0,.10) 55%, transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,212,0,.55);
    transition:transform .13s cubic-bezier(.2,.7,.3,1),
               width .13s, height .13s, left .13s, top .13s, font-size .13s;
  }
  .monster{
    background:radial-gradient(ellipse at 50% 78%,
      rgba(255,138,115,.28), rgba(255,138,115,.07) 55%, transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,138,115,.35);
    transition:transform .13s cubic-bezier(.2,.7,.3,1),
               width .13s, height .13s, left .13s, top .13s, font-size .13s;
  }
  .monster .glyph{animation:pop .18s ease-out;}
  /* 돌진자세. 다음 턴에 저 길로 내달린다. 위험 표시가 어디까지인지 같이 알려 준다 */
  .monster.aim{
    box-shadow:inset 0 0 0 2px rgba(255,86,60,.95), 0 0 .6em rgba(255,86,60,.55);
  }
  .monster.aim .glyph{animation:aimpulse .58s ease-in-out infinite;}
  @keyframes aimpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.14);}}
  /* 돌진하는 동안은 칸을 하나씩 밟는다. 한 칸의 시간은 `--dash` 로 그때 정한다.
     가속·감속 없이 고르게(linear) 지나가야 내달리는 것으로 보인다 */
  .monster.dash{
    transition:transform var(--dash, .13s) linear,
               width .13s, height .13s, left .13s, top .13s, font-size .13s;
  }

  /* 기물. 체력바가 없으니 아래를 비워 둘 까닭도 없다. 칸을 거의 다 쓴다 */
  .prop .glyph{height:100%;object-position:center;}
  .prop.blocker{
    background:radial-gradient(ellipse at 50% 70%,
      rgba(190,190,190,.18), rgba(190,190,190,.05) 60%, transparent 75%);
    box-shadow:inset 0 0 0 1px rgba(200,200,200,.22);
  }
  /* 지역은 고를 것이라 눈에 띄어야 한다 */
  .prop.stage{
    background:radial-gradient(ellipse at 50% 70%,
      rgba(255,212,0,.20), rgba(255,212,0,.06) 60%, transparent 78%);
    box-shadow:inset 0 0 0 1px rgba(255,212,0,.38);
  }
  /* 지역 이름. 블럭 위쪽에 얹는다. 그림만으로는 무엇인지 모른다.
     글자 크기는 em 이라 칸이 커지면 같이 커진다 (토큰의 font-size 가 칸을 따라간다) */
  .prop .st-name{
    position:absolute;left:0;right:0;top:12%;
    padding:.06em .1em;
    font-size:.2em;line-height:1.25;font-weight:800;
    text-align:center;color:#fff;
    background:linear-gradient(rgba(8,8,6,.78), rgba(8,8,6,0));
    text-shadow:0 1px 2px rgba(0,0,0,.95);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    pointer-events:none;
  }
  /* 최고 기록과 완료도. 오른쪽 아래 1/4 칸을 통째로 쓴다.
     둘은 같은 자리 같은 크기다 — 지역마다 다른 것을 보여 주되 눈은 한 곳만 본다 */
  .prop .st-best,
  .prop .st-quest{
    position:absolute;right:0;bottom:0;width:50%;height:50%;
    display:flex;align-items:center;justify-content:flex-end;
    padding-right:.35em;
    /* 오른쪽에 붙이고 왼쪽으로 자란다. 가운데 맞추면 네 자리(1274턴)에서
       오른쪽으로 삐져나가 옆 칸을 넘본다. 왼쪽은 제 블럭 안이라 괜찮다 */
    font-size:.34em;line-height:1;font-weight:800;white-space:nowrap;
    font-variant-numeric:tabular-nums;
    color:var(--brand-yellow);
    gap:.06em;
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
      0 2px 4px rgba(0,0,0,.95);
    pointer-events:none;
  }
  .prop .st-best i,
  .prop .st-quest i{font-style:normal;font-size:.55em;font-weight:700;}
  /* 다 깬 지역. 숫자 대신 한마디로 바뀐다 — 다시 셀 것이 없다 */
  .prop .st-quest.done{color:#7de08a;}
  /* 작은 외부 토큰에서는 글자가 안 읽힌다. 지역 블럭은 안쪽에만 서지만 안전하게 */
  .token.tiny .st-name, .token.tiny .st-best, .token.tiny .st-quest{display:none;}

  /* 잠긴 지역. 색을 빼고 낮춘다. 있다는 것은 보이되 고를 것으로는 안 읽히게 */
  .prop.stage.locked{
    filter:grayscale(1) brightness(.6);
    box-shadow:inset 0 0 0 1px var(--hairline);
  }
  @keyframes pop{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}

  /* 원본이 64px 이고 그려지는 크기가 40~70px 이라 1:1 언저리다. 픽셀 아트는
     이 배율에서 pixelated 가 또렷하다 (예전 384px 원본일 때는 10배 축소라
     픽셀을 왕창 버려서 실루엣이 깨졌고, 그때는 부드럽게 줄이는 쪽이 나았다).
     블럭을 꽉 채운다. 체력·경험치 바는 그림 위에 반투명으로 얹는다 */
  .token .glyph{
    position:absolute;left:0;top:0;width:100%;height:100%;
    object-fit:contain;object-position:center;
    image-rendering:pixelated;
    pointer-events:none;
  }
  /* 체력바 안에 숫자를 얹는다. 따로 줄을 만들면 칸이 좁아 둘 다 못 읽는다.
     스프라이트가 블럭을 꽉 채우므로 바는 그 위에 얹힌다. 바탕과 채움만
     60% 로 낮춰 그림이 비쳐 보이게 한다. 숫자는 안 낮춘다 — 읽을 것이라서다.
     그래서 `.hp` 에 opacity 를 걸면 안 된다. 숫자까지 같이 흐려진다 */
  .token .hp{
    position:absolute;left:6%;right:6%;bottom:14%;height:.38em;
    background:rgba(0,0,0,.6);border-radius:.1em;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .token .hp i{position:absolute;left:0;top:0;height:100%;width:100%;
    opacity:.6;
    transition:width .32s cubic-bezier(.2,.7,.3,1);}
  .token .hp b{
    position:relative;font-size:.3em;line-height:1;font-weight:700;
    color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.95);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .player .hp i{background:#1E5E20;}
  .monster .hp i{background:#A8352A;}
  /* 좌상단에 공격력. 칼 아이콘 위에 숫자를 얹는다 */
  .token .stat-mark{
    position:absolute;left:4%;top:2%;
    display:flex;
    font-size:.26em;line-height:1;font-weight:800;
    font-variant-numeric:tabular-nums;
    pointer-events:none;
  }
  .token .stat-mark i{
    font-style:normal;
    width:2.6em;height:2.6em;
    /* 은색 아이콘을 19px 로 줄여 쓴다. 뒤에 오는 스프라이트가 어두울 때도
       밝을 때도 있어서, 조금 올려 주고 검은 그림자로 윤곽을 잡는다 */
    filter:brightness(1.35) drop-shadow(0 0 1px rgba(0,0,0,.95));
    display:flex;align-items:center;justify-content:center;
    background-repeat:no-repeat;background-position:center;background-size:contain;
    /* 64px 아이콘을 16px 남짓으로 줄여 쓴다. 4배 축소라 부드럽게 줄이는 편이 낫다
       (캐릭터 스프라이트는 1:1 언저리라 pixelated 를 쓴다. 배율이 달라 선택도 다르다) */
    color:#fff;
    /* 은색 아이콘 위에 흰 글씨라 검은 테를 둘러야 읽힌다 */
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
      0 1px 2px rgba(0,0,0,.9);
  }
  /* 어떤 그림이 뜨는지는 상태가 정한다. 한 번(칼 하나) / 두 번(칼 둘) */
  .token .stat-mark .a.atk-single{background-image:url(images/icon/attack1.png);}
  .token .stat-mark .a.atk-double{background-image:url(images/icon/attack2.png);}

  /* 외부 띠의 토큰은 17px 쯤이라 숫자가 안 읽힌다. 바만 남긴다 */
  /* 경험치. 체력 바로 밑에 얇은 하늘색 띠. 수치는 안 적는다 */
  .player .exp{
    position:absolute;left:6%;right:6%;bottom:4%;height:.15em;
    background:rgba(0,0,0,.6);border-radius:.08em;overflow:hidden;
  }
  .player .exp i{
    display:block;height:100%;width:0;
    background:#6FC6F5;opacity:.6;
    transition:width .25s cubic-bezier(.2,.7,.3,1);
  }
  .token.tiny .exp{display:none;}

  /* 가진 카드의 그림. 체력바 바로 위에 한 줄.
     판 위 블럭과 모달 안 블럭이 같은 규칙을 탄다. 크기는 em 이라 블럭이
     작아지면 같이 작아진다 */
  .player .skill-row{
    --sk:.23em;                    /* 그림 한 칸. 숫자도 이걸 따라간다 */
    /* 체력바 위. 띄우는 높이는 체력바 높이(.38em)를 넘겨야 한다.
       그림 크기(--sk)로 띄우면 그림을 줄일 때 체력바 위로 내려앉는다 */
    position:absolute;left:4%;right:4%;bottom:calc(14% + .44em);
    height:var(--sk);
    display:flex;justify-content:flex-start;align-items:flex-end;gap:.07em;
    pointer-events:none;
  }
  .player .skill-row i{
    position:relative;width:var(--sk);height:var(--sk);flex:none;
    background:center/contain no-repeat;
    image-rendering:pixelated;
  }
  /* 누적 횟수는 그림 위 오른아래 귀퉁이에. 옆에 세우면 이웃 그림과 겹친다.
     검은 딱지를 깔면 그림만 한 크기가 되어 그림을 다 덮으므로, 맨 글씨에
     검은 윤곽만 둘러 그림이 사이로 비쳐 보이게 한다 */
  .player .skill-row i b{
    position:absolute;right:-.1em;bottom:-.12em;
    font-size:calc(var(--sk) * .62);line-height:1;font-weight:800;
    color:var(--brand-yellow);
    -webkit-text-stroke:.06em rgba(8,8,6,.95);
    paint-order:stroke fill;
    text-shadow:0 0 .12em #000;
  }
  /* 외부 띠의 작은 토큰에서는 감춘다. 딱지·숫자와 같은 이유다 */
  .token.tiny .skill-row{display:none;}

  .token.tiny .hp{left:12%;right:12%;bottom:6%;height:.22em;}
  /* 경험치 바는 플레이어만 있다. 몬스터는 체력 바를 바닥에 그대로 둔다 */
  .monster .hp{bottom:5%;}
  /* 그림 크기는 `.token .glyph` 한 줄로 끝난다. 여기서 다시 낮추던 두 줄
     (`.monster` 72%, `.tiny` 86%) 은 없앴다. 살아 있으면 뒤에 있는 이쪽이
     이겨서, 공통 규칙만 고치면 몬스터는 안 커진다 */
  .token.tiny .hp b{display:none;}
  .token.tiny .stat-mark{display:none;}
  /* 토큰의 transform 은 자리를 잡는 데 쓰고 있다. 그래서 연출은 전부
     안쪽 .glyph 를 움직이거나, 토큰에는 transform 아닌 속성만 쓴다 */
  /* 피격은 붉게 번쩍인다. 흰빛으로 밝히면 무엇에 맞았는지가 아니라
     그냥 밝아진 것으로 보인다. 붉은 겹을 한 장 덮어 색으로 알린다 */
  .token.hit{animation:hit .25s ease-out;}
  @keyframes hit{0%,100%{filter:none;}25%{filter:brightness(1.5) saturate(1.4);}}
  .token.hit::after,
  .d-cell.hit::after{
    content:'';position:absolute;inset:0;border-radius:inherit;
    background:rgba(255,52,32,.55);
    /* 기본을 0 으로 둬야 한다. 애니메이션이 끝나면 이 값으로 돌아오는데,
       안 적어 두면 기본값 1 이라 붉은 겹이 그대로 남는다 */
    opacity:0;
    animation:hitred .25s ease-out;
    pointer-events:none;
  }
  @keyframes hitred{0%,100%{opacity:0;}25%{opacity:1;}}

  /* 피격: 빠르게 조금 작아졌다 본래 크기로 */
  .token.hit .glyph{animation:struck .25s ease-out;}
  @keyframes struck{0%,100%{transform:scale(1);}40%{transform:scale(.72);}}

  /* 입은 피해를 머리 위에 띄운다. 토큰 안이 아니라 판에 직접 붙인다.
     토큰은 will-change:transform 으로 쌓임 맥락을 만들기 때문에, 그 안에 두면
     z-index 를 아무리 올려도 옆 토큰 위로 못 올라온다 */
  .dmg{
    position:absolute;z-index:50;
    font-weight:800;line-height:1;white-space:nowrap;pointer-events:none;
    /* 스프라이트 위든 남의 체력바 위든 읽혀야 해서 검은 테를 둘러 준다 */
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
      0 2px 4px rgba(0,0,0,.95);
    animation:dmgfloat .9s ease-out forwards;
  }
  .dmg.on-player{color:#FF6B57;}

  /* 등장 대사. 데미지 숫자와 같은 이유로 판에 직접 붙인다 — 토큰 안에 두면
     그 토큰의 쌓임 맥락에 갇혀 옆 칸으로 못 나온다.
     칸 위끝에 꼬리를 두고 위로 뜬다 */
  .say{
    position:absolute;z-index:60;
    transform:translate(-50%, -108%);
    padding:.3em .5em;border-radius:.5em;
    background:rgba(8,8,6,.92);border:1px solid var(--hairline);
    color:var(--ink);font-weight:700;line-height:1;white-space:nowrap;
    pointer-events:none;
    animation:sayin .16s ease-out, sayout .32s ease-in 1.15s forwards;
  }
  @keyframes sayin{
    from{opacity:0;transform:translate(-50%,-88%) scale(.86);}
    to{opacity:1;transform:translate(-50%,-108%) scale(1);}
  }
  @keyframes sayout{to{opacity:0;transform:translate(-50%,-124%);}}

  /* 경험치 구슬. 데미지 숫자와 같은 이유로 판에 직접 붙인다.
     토큰 안에 두면 그 토큰의 쌓임 맥락에 갇혀 옆 칸으로 못 나온다 */
  .orb{
    position:absolute;z-index:45;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #DFFBFF, #45D7F2 55%, #0E86A8);
    box-shadow:0 0 .35em rgba(69,215,242,.9);
    pointer-events:none;
    transition:transform var(--orb) cubic-bezier(.3,.6,.4,1);
  }
  /* 열 개를 뭉친 큰 구슬. 커지기만 하는 것이 아니라 더 밝게 빛난다 */
  .orb.big{
    background:radial-gradient(circle at 35% 30%, #FFFFFF, #7BE7FF 50%, #1AA6CE);
    box-shadow:0 0 .5em rgba(123,231,255,1);
  }
  /* 코인. 경험치 구슬과 같은 길로 날아오지만 그림이 다르다.
     둥근 테와 푸른 빛을 걷어 내야 그림이 그림으로 읽힌다 */
  .orb.coin{
    background:url(images/icon/coin.png) center/contain no-repeat;
    border-radius:0;
    box-shadow:none;
    filter:drop-shadow(0 0 .2em rgba(255,196,0,.85));
  }
  .orb.coin.big{filter:drop-shadow(0 0 .35em rgba(255,214,0,1));}
  .dmg.on-monster{color:#FFD400;}
  /* 띄우는 거리는 em 으로 잡는다. % 는 글자 상자(16px 남짓) 기준이라
     아무리 키워도 몇 px 밖에 안 올라간다.
     제일 잘 보이는 구간이 제 칸 안(머리 근처)에 오도록 잡았다. 칸 밖으로 나가는
     것은 흐려진 뒤라, 위 칸 토큰의 체력바와 겹쳐 읽히는 일이 없다 */
  @keyframes dmgfloat{
    0%  {opacity:0;transform:translate(-50%, .3em)  scale(.8);}
    12% {opacity:1;transform:translate(-50%,-.2em)  scale(1.15);}
    55% {opacity:1;transform:translate(-50%,-1.1em) scale(1);}
    100%{opacity:0;transform:translate(-50%,-2.4em) scale(1);}
  }

  /* 공격: 치는 방향으로 조금 나갔다 제자리로 */
  .token.atk-up    .glyph{animation:lunge-up .2s ease-out;}
  .token.atk-down  .glyph{animation:lunge-down .2s ease-out;}
  .token.atk-left  .glyph{animation:lunge-left .2s ease-out;}
  .token.atk-right .glyph{animation:lunge-right .2s ease-out;}
  @keyframes lunge-up   {0%,100%{transform:translateY(0);}45%{transform:translateY(-28%);}}
  @keyframes lunge-down {0%,100%{transform:translateY(0);}45%{transform:translateY(28%);}}
  @keyframes lunge-left {0%,100%{transform:translateX(0);}45%{transform:translateX(-28%);}}
  @keyframes lunge-right{0%,100%{transform:translateX(0);}45%{transform:translateX(28%);}}
  .play.over .board{filter:grayscale(.6) brightness(.7);}

  /* 퀘스트는 정보영역의 카드 한 장이다 */
  .quest{display:flex;flex-direction:column;}
  .q-head{display:flex;align-items:center;gap:.5em;margin-bottom:.6em;flex:none;}
  .q-step{
    color:var(--brand-yellow);background:#161613;border-radius:var(--r-pill);
    font-size:.85em;font-weight:700;letter-spacing:.06em;padding:.25em .7em;flex:none;
  }
  .q-note{color:var(--muted);font-size:.85em;margin:0;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .q-list{list-style:none;margin:0;padding:0;display:grid;gap:.4em;
    align-content:start;flex:1;min-height:0;overflow:auto;
    scrollbar-width:none;}
  .q-list::-webkit-scrollbar{display:none;}
  .q-item{
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;
    column-gap:.6em;row-gap:.3em;
  }
  .q-check{
    width:1.15em;height:1.15em;border-radius:.3em;flex:none;
    box-shadow:inset 0 0 0 1px var(--hairline);background:var(--surface);
    position:relative;
  }
  /* 체크 표시는 가상 요소로. 다 깬 줄만 보인다 */
  .q-check::after{
    content:'✓';position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:.85em;font-weight:800;color:var(--on-brand);opacity:0;
  }
  .q-name{color:var(--body);font-size:1em;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .q-num{color:var(--muted);font-size:.92em;font-variant-numeric:tabular-nums;flex:none;}
  /* 한 번에 끝나는 항목은 막대가 체크와 같은 말을 반복한다. 여러 번 걸리는 것만 둔다 */
  .q-item.binary .q-track{display:none;}
  .q-item.binary{row-gap:0;}
  .q-track{
    grid-column:2 / -1;height:.3em;border-radius:2px;
    background:var(--surface);box-shadow:inset 0 0 0 1px var(--hairline);overflow:hidden;
  }
  .q-track i{display:block;height:100%;width:0;border-radius:2px;
    background:var(--brand-yellow);transition:width .35s cubic-bezier(.2,.7,.3,1);}

  .q-item.done .q-check{background:#4CD07A;box-shadow:none;}
  .q-item.done .q-check::after{opacity:1;}
  .q-item.done .q-name{color:var(--ink);}
  .q-item.done .q-track i{background:#4CD07A;}

  /* 묶음을 다 깬 순간 잠깐 알린다. 다음으로 넘어가기 전에 눈이 따라올 시간을 준다 */
  .quest.done{animation:qdone .5s ease-out;}
  @keyframes qdone{0%,100%{transform:none;}30%{transform:scale(1.035);}}
  .quest.all-done .q-step{background:var(--brand-yellow);color:var(--on-brand);}

  /* 드래프트: 게임판과 같은 격자에 같은 블럭.
     칸은 정사각, 간격과 모서리도 판과 같은 비율로 맞춰 조작이 같게 느껴지도록 */
  .draft{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    background:rgba(8,8,6,.86);
    padding:var(--s4);
  }
  /* 브라우저 기본 [hidden]{display:none} 은 .draft{display:flex} 에 진다 */
  .draft[hidden]{display:none;}
  .draft-inner{width:100%;max-width:360px;}
  .d-head{
    color:var(--brand-yellow);font-weight:800;font-size:15px;
    text-align:center;margin:0 0 var(--s4);letter-spacing:.02em;
  }

  .draft-grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    /* 판의 간격/칸 = 2/52 = 0.0385 를 그대로. grid 의 % 간격은 격자 전체 너비
       기준이라, 칸 기준 비율로 환산하면 0.0385/3.077 = 1.25% 다 */
    gap:1.25%;
    width:100%;margin:0 auto;position:relative;
  }
  .d-up{grid-area:1/2;} .d-left{grid-area:2/1;}
  .d-mid{grid-area:2/2;} .d-right{grid-area:2/3;} .d-down{grid-area:3/2;}

  .d-cell{
    aspect-ratio:1;                /* 판의 칸과 같은 정사각 */
    border-radius:6%;              /* 판은 3px/52px ≈ 6% */
    background:var(--surface-soft);
    box-shadow:inset 0 0 0 1px var(--hairline);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2%;padding:6%;
    text-align:center;position:relative;
  }
  /* 고를 수 있는 칸은 판의 플레이어 칸처럼 노란 테를 두른다 */
  .d-card{box-shadow:inset 0 0 0 1px rgba(255,212,0,.55);}
  .d-card b{color:var(--ink);font-size:14px;font-weight:800;line-height:1.15;}
  .d-card span{color:var(--muted);font-size:10px;line-height:1.25;}
  /* 기술 카드의 그림. 스프라이트와 같이 픽셀을 살려 키운다.
     그림·이름·설명 셋이 한 칸에 들어가야 해서 그림은 3분의 1로 묶어 둔다 */
  .d-card .d-img{
    width:34%;aspect-ratio:1;flex:none;
    background:center/contain no-repeat;
    image-rendering:pixelated;
  }
  .d-card i{
    font-style:normal;color:var(--brand-yellow);font-size:10px;font-weight:700;
    letter-spacing:.1em;
  }
  /* 리롤 칸은 판의 바깥 칸처럼 어둡게. 잠겨 있다 */
  .d-down{
    background:#161613;box-shadow:inset 0 0 0 1px var(--hairline);opacity:.45;
  }
  .d-down b{color:var(--body);font-size:13px;font-weight:700;}
  .d-down span{color:var(--muted);font-size:10px;}

  /* 가운데는 판에 서 있는 그 블럭 그대로 */
  .d-mid{padding:0;background:var(--surface-soft);}
  .draft-token{
    position:static;width:100%;height:100%;
    background:radial-gradient(ellipse at 50% 78%,
      rgba(255,212,0,.42), rgba(255,212,0,.10) 55%, transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,212,0,.55);
    border-radius:6%;
  }

  /* 고른 카드에서 공격력 쪽으로 날아가는 수치 */
  .d-fly{
    position:absolute;z-index:2;
    font-weight:800;line-height:1;white-space:nowrap;
    color:#FFC8BC;
    text-shadow:-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    pointer-events:none;
    transition:transform var(--fly) cubic-bezier(.4,.05,.3,1), opacity var(--fly);
  }
  /* 그림이 날아갈 때는 글씨가 아니라 그림이다 */
  .d-fly.img{
    background:center/contain no-repeat;
    image-rendering:pixelated;
  }
  /* 도착해서 사라진 뒤, 실제로 붙는 순간 */
  .stat-mark i.bump,
  .draft-token.bump,
  .player .skill-row.bump{animation:statbump .26s ease-out;}
  @keyframes statbump{
    0%{transform:scale(1);}
    35%{transform:scale(1.55);filter:brightness(1.8);}
    100%{transform:scale(1);}
  }

  /* 고른 카드는 맞은 것처럼 움츠러들며 붉게 번쩍인다 (토큰의 피격과 같은 결) */
  .d-cell.hit{animation:cardhit .26s ease-out;}

  /* 강조: 고르라고 세 번 깜빡인다. 테가 굵어지며 빛난다.
     세 번이면 눈에 걸리되 성가시지 않다. 끝나면 원래 테로 돌아간다 */
  .cmd.blink{animation:cmdblink .42s ease-in-out 3;}
  /* 붙잡는 강조: 누를 때까지 안 멈춘다. 새 조작을 가르치는 자리에서 쓴다 */
  .cmd.blink.hold{animation:cmdblink .42s ease-in-out infinite;}
  /* 그동안 그 단추만 밝다. 나머지는 한 겹 어둡게 눌러 둔다.
     너무 어두우면 퀘스트 글이 안 읽힌다 — 조금만 낮춘다 */
  .play.spotlight .topbar,
  .play.spotlight .stage,
  .play.spotlight .info,
  .play.spotlight .control > :not(.blink){filter:brightness(.6);}
  .play.spotlight .topbar,
  .play.spotlight .stage,
  .play.spotlight .info,
  .play.spotlight .control > *{transition:filter .25s ease;}
  /* 판도 다른 명령 블럭도 안 먹는다. 상단 바만 살려 둔다 (판을 나갈 길은 있어야 한다) */
  .play.spotlight .stage,
  .play.spotlight .info,
  .play.spotlight .control > :not(.blink){pointer-events:none;}
  @keyframes cmdblink{
    0%,100%{box-shadow:inset 0 0 0 1px rgba(255,212,0,.55);}
    50%{box-shadow:inset 0 0 0 2px rgba(255,212,0,1), 0 0 .55em rgba(255,212,0,.5);}
  }
  @keyframes cardhit{0%,100%{transform:scale(1);}40%{transform:scale(.9);}}

  /* 레벨업 알림. 모달보다 먼저 뜬다 */
  .levelup{
    position:fixed;inset:0;z-index:110;
    display:flex;align-items:center;justify-content:center;
    background:rgba(8,8,6,.72);
    pointer-events:none;
  }
  .levelup[hidden]{display:none;}
  .levelup b{
    color:var(--brand-yellow);font-weight:800;letter-spacing:.14em;
    font-size:34px;line-height:1;
    text-shadow:0 2px 0 #7a5f00, 0 0 24px rgba(255,212,0,.55);
    animation:levelpop .9s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes levelpop{
    0%  {opacity:0;transform:scale(.6);}
    18% {opacity:1;transform:scale(1.12);}
    32% {transform:scale(1);}
    78% {opacity:1;transform:scale(1);}
    100%{opacity:0;transform:scale(1.06);}
  }

  .d-hint{color:var(--muted);font-size:11px;text-align:center;margin:var(--s4) 0 0;}

  /* 끝난 판을 알리는 팝업. 드래프트와 같은 덮개를 쓴다 */
  .endpop{
    position:fixed;inset:0;z-index:110;
    display:flex;align-items:center;justify-content:center;
    background:rgba(8,8,6,.86);
    padding:var(--s4);
  }
  /* .draft 와 같은 함정. display:flex 가 [hidden] 을 이긴다 */
  .endpop[hidden]{display:none;}
  .endpop-inner{
    width:100%;max-width:320px;
    background:var(--surface);border-radius:var(--r-md,12px);
    box-shadow:inset 0 0 0 1px var(--hairline);
    padding:var(--s5,24px) var(--s4);
    text-align:center;
    animation:endpop .32s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes endpop{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:none;}}
  .end-title{
    margin:0 0 var(--s2);font-size:22px;font-weight:800;letter-spacing:.02em;
    color:var(--ink);
  }
  .endpop.clear .end-title{color:var(--brand-yellow);}
  .end-note{margin:0 0 var(--s4);color:var(--muted);font-size:13px;}
  .end-rows{
    list-style:none;margin:0 0 var(--s4);padding:0;
    display:grid;gap:6px;text-align:left;
  }
  .end-rows li{
    display:flex;justify-content:space-between;gap:var(--s3);
    color:var(--muted);font-size:13px;
  }
  .end-rows b{color:var(--ink);font-variant-numeric:tabular-nums;}
  /* 끝난 판에서 고르는 줄. 드래프트와 같은 격자·같은 칸을 쓴다.
     한 줄이라 위·아래 칸이 없다. 자리만 다시 잡아 준다 */
  .end-pick{margin-top:var(--s2);}
  .end-pick .d-left{grid-area:1/1;}
  .end-pick .d-mid{grid-area:1/2;}
  .end-pick .d-right{grid-area:1/3;}

  .hint{
    color:var(--muted);font-size:.92em;line-height:1.45;text-align:center;margin:0;
  }
  .card.hint-card{display:flex;align-items:center;justify-content:center;}

  /* 판 버전. 어느 화면에서든 보여야 하므로 화면에 붙이고 모든 겹 위에 둔다
     (드래프트 100, 끝난 판 팝업 110). 눌리지는 않는다 — 읽기만 하는 것이다 */
  .ver{
    position:fixed;z-index:200;
    right:calc(env(safe-area-inset-right,0px) + 6px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 5px);
    color:var(--muted);opacity:.72;
    font-size:11px;line-height:1;font-weight:700;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
    text-shadow:0 1px 2px rgba(0,0,0,.9);
    pointer-events:none;user-select:none;
  }
</style>
</head>
<body>
  <main class="play">
    <div class="topbar">
      <a class="btn btn-secondary btn-sm" href="../index.html">← 목록</a>
      <span class="name">슬라이드</span>
      <span class="spacer"></span>
      <span class="stat">Lv <b id="level">1</b></span>
      <span class="stat">코인 <b id="coin">0</b></span>
      <span class="stat">체력 <b id="hp">10/10</b></span>
      <span class="stat opt-turn">턴 <b id="moves">0</b></span>
      <span class="stat opt-mon">몬스터 <b id="mcount">0</b></span>
      <button class="btn btn-secondary btn-sm" id="sound" type="button"
              aria-label="소리 끄기" aria-pressed="true">🔊</button>
      <button class="btn btn-secondary btn-sm" id="leave" type="button" hidden>지역</button>
      <button class="btn btn-secondary btn-sm" id="reset" type="button">다시</button>
    </div>

    <div class="split" id="split">
      <div class="stage" id="stage">
        <div class="board" id="board"></div>
      </div>

      <!-- 조작영역. 블럭 일곱 개 자리. 가로면 게임 왼쪽에 한 줄, 세로면 아래에 한 줄 -->
      <div class="control" id="control">
        <button class="slot cmd" id="act-wait" type="button"><b>대기</b></button>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div>
        <button class="slot cmd" id="act-quit" type="button"><b>종료</b></button>
      </div>

      <!-- 정보영역. 카드 여섯 장. 가로면 2x3, 세로면 3x2 -->
      <div class="info" id="info">
        <section class="card quest" id="quest">
          <div class="q-head">
            <span class="q-step" id="qstep">퀘스트 1/3</span>
            <p class="q-note" id="qnote"></p>
          </div>
          <ul class="q-list" id="qlist"></ul>
        </section>
        <section class="card inspect" id="inspect"></section>
        <div class="card hint-card">
          <p class="hint" id="hint">스와이프 · 방향키 / WASD — 빈 칸이면 이동, 몬스터면 공격</p>
        </div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
      </div>
    </div>

    <div class="levelup" id="levelup" hidden><b>LEVEL UP</b></div>

    <div class="endpop" id="endpop" hidden>
      <div class="endpop-inner">
        <p class="end-title" id="endtitle">게임 오버</p>
        <p class="end-note" id="endnote"></p>
        <ul class="end-rows" id="endrows"></ul>
        <!-- 지역 고르기와 같은 방식. 기사를 움직여서 고른다 -->
        <div class="draft-grid end-pick" id="endpick">
          <div class="d-cell d-card cmd d-left"><b>지역</b><span>지역 고르기로</span></div>
          <div class="d-cell d-mid" id="endmid"></div>
          <div class="d-cell d-card cmd d-right"><b>다시</b><span>이 지역 다시</span></div>
        </div>
        <p class="d-hint">왼쪽 · 오른쪽 으로 고른다 (스와이프 / WASD / 방향키)</p>
      </div>
    </div>

    <div class="draft" id="draft" hidden>
      <div class="draft-inner">
        <p class="d-head" id="dhead">레벨 2 — 하나 고르기</p>
        <!-- 게임판과 같은 격자·같은 블럭. 조작도 같은 방향 입력이다 -->
        <div class="draft-grid" id="dgrid">
          <div class="d-cell d-card cmd d-up" data-slot="0"></div>
          <div class="d-cell d-card cmd d-left" data-slot="1"></div>
          <div class="d-cell d-mid" id="dmid"></div>
          <div class="d-cell d-card cmd d-right" data-slot="2"></div>
          <div class="d-cell d-down"><b>리롤</b><span>잠김</span></div>
        </div>
        <p class="d-hint">위 · 왼쪽 · 오른쪽 으로 고른다 (스와이프 / WASD / 방향키)</p>
      </div>
    </div>

  </main>

  <span class="ver" id="ver"></span>

<script>
(() => {
  'use strict';

  // 판 버전. `큰 변경·새 시스템` . `새 스테이지·새 몬스터` . `잔 수정·기능 변경`
  // 고칠 때마다 여기 하나만 고친다. 화면 오른쪽 아래에 늘 떠 있다
  const VERSION = '0.1.2';

  // ── 규칙 상수 ───────────────────────────────────────────────
  const N = 11;                 // 필드 11*11
  const BORDER = 3;             // 상하좌우 각 3줄이 외부 (0,1,2 와 8,9,10)
  const MIN = BORDER;           // 내부 최소 좌표 = 3
  const MAX = N - 1 - BORDER;   // 내부 최대 좌표 = 7  → 내부 5*5
  const START = { x: 5, y: 5 }; // 내부 5*5 (3~7) 의 가운데
  // 체력·피해량은 규칙에 숫자가 없어서 정한 값이다
  // ── 살아 있는 것들 ─────────────────────────────────────────
  // 플레이어든 몬스터든 공·방·체를 갖는다. 종류마다 다른 것은 전부 이 표에만 있다.
  // 새 종류를 넣을 때 손댈 곳이 한 군데다
  const BEINGS = {
    player: {
      name: '플레이어', img: 'player.png',
      atk: 10, maxHp: 100, agi: 10,
    },
    goblin: {
      name: '고블린', img: 'goblin.png',
      atk: 2, maxHp: 12, agi: 8, exp: 10, coin: 5,
      step: stepToward,
      // 안으로 들어설 때 하나를 고른다. 뒤의 숫자가 클수록 자주 나온다
      lines: [['먹잇감이다', 9], ['잡는다.혼내준다', 9], ['대장이 우릴보고있다', 1]],
    },
    rider: {
      name: '고블린 라이더', img: 'goblin_rider.png',
      atk: 5, maxHp: 24, agi: 9, exp: 15, coin: 10,  // 말을 탔으니 걸어오는 고블린보다 빠르다
      step: stepKnight,
      lines: [['달린다', 9], ['뒤를친다', 9], ['대장이 우릴보고있다', 1]],
    },
    chief: {
      name: '고블린 대장', img: 'moster/goblin_chef.png',
      atk: 10, maxHp: 120, agi: 7, exp: 10, coin: 5,  // 덩치가 크다. 제일 늦게 움직인다
      step: stepToward,       // 이동은 폰. 상하좌우 한 칸
      charge: true,           // 줄이 맞으면 자세를 잡고 다음 턴에 내달린다
      lines: [['우어어', 9], ['크어', 9], ['고블린숲을 침범하지마', 1]],
    },
  };

  // 최종 공격력 = 공격자의 공격력. 1 보다 작아지면 1 로 친다
  // (지금은 깎을 것이 없지만, 공격력 감쇠 같은 것이 붙으면 여기서 처리한다)
  const damageTo = attacker => Math.max(1, attacker.atk);

  // 레벨업 소리. 짧은 음 셋을 위로 쌓아 올린다
  function playLevelUp() {
    if (!soundOn) return;
    const ctx = ensureAudio();
    if (!ctx) return;

    // 도-미-솔-도. 한 음씩 조금씩 늦게 시작해 올라가는 느낌을 낸다
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((hz, i) => {
      const at = ctx.currentTime + i * 0.085;
      const dur = i === notes.length - 1 ? 0.42 : 0.16;

      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(hz, at);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(0.22, at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0008, at + dur);

      osc.connect(gain).connect(ctx.destination);
      osc.start(at);
      osc.stop(at + dur + 0.02);
    });
  }

  // ── 드래프트 카드 ──────────────────────────────────────────
  // 구현된 것만 여기 둔다. 규칙의 나머지 카드는 아직 효과가 안 정해졌다.
  //   누적형 : 다시 나오고, 고를 때마다 수치가 쌓인다
  //   기능형 : `once`. 한 번 배우면 다시 안 나온다.
  //            `need` 가 있으면 그 기술을 배운 뒤에야 나온다 (연계)
  // `bump` 는 닿았을 때 무엇이 튀느냐다. 날아가는 것은 늘 그림이고 닿는 곳도 늘
  // 블럭의 아이콘 줄이라, 수치 카드만 그 수치 딱지를 따로 튀게 한다
  const DRAFT_CARDS = [
    {
      id: 'atk5', title: '공격력+5', note: '공격력 +5',
      img: 'icon/skill_attack_up.png', bump: 'atk',
      fly: '+5',
      apply: p => { p.atk += 5; },
    },
    {
      id: 'exp10', title: '경험치+10%', note: '얻는 경험치 +10%',
      img: 'icon/skill_exp_up.png',
      fly: '+10%',
      apply: p => { p.expBonus += 10; },     // 더해서 쌓인다. 두 번이면 +20%
    },
    {
      id: 'push', title: '밀치기', note: '공격 방향의 적을 민다',
      img: 'icon/skill_push.png', once: true,
      fly: '밀치기',
      // 기능형은 가졌다는 사실만으로 동작한다. 따로 올릴 수치가 없다
      apply: () => {},
    },
    {
      id: 'pushMove', title: '밀고가기', note: '밀고 그 칸으로 간다',
      img: 'icon/skill_push_move.png', once: true, need: 'push',
      fly: '밀고가기',
      apply: () => {},
    },
  ];

  // 누적 횟수는 로마자로 적는다. 드래프트가 무한이라 큰 수도 나올 수 있다
  const ROMAN = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'],
                 [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'],
                 [5, 'V'], [4, 'IV'], [1, 'I']];
  function roman(n) {
    let out = '';
    for (const [v, sign] of ROMAN) while (n >= v) { out += sign; n -= v; }
    return out;
  }
  const DRAFT_SLOTS = 3;
  const LEVELUP_MS = 900;       // 레벨업 알림. CSS 의 levelpop .9s 와 같아야 한다
  const LUNGE_MS = 200;         // 치는 모션. CSS 의 lunge-* .2s 와 같아야 한다
  const FLY_MS = 480;           // 수치가 공격력 쪽으로 날아가는 시간
  const BUMP_MS = 260;          // 닿은 뒤 실제로 오르는 순간
  const ORB_MS = 300;           // 경험치 구슬. 흩어지는 데 0.3초, 빨려 드는 데 0.3초
  const EXP_MS = 250;           // 경험치 바가 끝까지 차는 시간. CSS 의 .25s 와 같아야 한다
  const ORB_BIG = 10;           // 이만큼 모이면 큰 구슬 하나로 바꾼다

  // 공격·방어의 모드. 지금은 아이콘만 갈아 끼운다.

  const ATK_MODES = ['single', 'double'];

    if (!audioCtx) audioCtx = new AC();
    // 소리는 사용자가 건드린 뒤에만 난다. 공격은 늘 입력 뒤라 여기서 풀어도 된다

  // 휘두르는 소리. 감쇠하는 잡음을 대역 필터로 위에서 아래로 훑는다
  function playSwing(pitch) {
    if (!soundOn) return;
    const ctx = ensureAudio();
    if (!ctx) return;

    const dur = 0.17;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const fade = 1 - i / data.length;
      data[i] = (Math.random() * 2 - 1) * fade * fade;
    }

    const src = ctx.createBufferSource();
    src.buffer = buf;

    const band = ctx.createBiquadFilter();
    band.type = 'bandpass';
    band.Q.value = 1.1;
    band.frequency.setValueAtTime(1600 * pitch, ctx.currentTime);
    band.frequency.exponentialRampToValueAtTime(360 * pitch, ctx.currentTime + dur);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0008, ctx.currentTime + dur);

    src.connect(band).connect(gain).connect(ctx.destination);
    src.start();
    src.stop(ctx.currentTime + dur);
  }
