<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>슬라이드 — Game Prototype</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFD400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }

  .play{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--canvas);}

  .topbar{
    display:flex;align-items:center;gap:var(--s3);
    padding:var(--s3) var(--s4);
    padding-top:calc(env(safe-area-inset-top,0px) + var(--s3));
    border-bottom:1px solid var(--hairline);
  }
  .topbar .name{color:var(--ink);font-weight:700;font-size:15px;}
  .topbar .stat{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;}
  .topbar .stat b{color:var(--ink);}
  .topbar .spacer{flex:1;}

  /* 판이 들어갈 자리. 남는 공간 전부 */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--s3);min-height:0;}

  .board{position:relative;}

  /* 칸은 배경으로만 깔린다. 움직이는 것(플레이어/몬스터)은 그 위에 얹는다 */
  .cell{position:absolute;border-radius:3px;}
  .cell.outer{background:#161613;box-shadow:inset 0 0 0 1px var(--hairline);}
  .cell.inner{background:var(--surface-soft);box-shadow:inset 0 0 0 1px var(--hairline);}

  /* 내부 6*6 의 테두리. 플레이어가 갈 수 있는 범위가 보이게 */
  .fence{
    position:absolute;pointer-events:none;border-radius:var(--r-sm);
    border:2px solid var(--brand-yellow-deep);opacity:.55;
  }

  .token{
    position:absolute;left:0;top:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--r-sm);
    font-weight:800;line-height:1;
    will-change:transform;
  }
  /* transform 은 자리를 잡는 데 쓰고 있다. 등장 효과는 안쪽 스프라이트에만 건다 */
  /* 스프라이트가 주인공이라 바닥판은 옅게 깔고 테두리로만 누가 있는지 알린다 */
  .player{
    background:radial-gradient(ellipse at 50% 78%,
      rgba(255,212,0,.42), rgba(255,212,0,.10) 55%, transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,212,0,.55);
    transition:transform .13s cubic-bezier(.2,.7,.3,1);
  }
  .monster{
    background:radial-gradient(ellipse at 50% 78%,
      rgba(255,138,115,.28), rgba(255,138,115,.07) 55%, transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,138,115,.35);
    transition:transform .13s cubic-bezier(.2,.7,.3,1);
  }
  .monster .glyph{animation:pop .18s ease-out;}
  @keyframes pop{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}

  /* 384px 원본을 칸 크기(보통 30~60px)로 줄여 쓴다. 축소라서 image-rendering 은
     기본값(부드럽게)이 낫다. pixelated 는 픽셀을 10칸에 하나씩 버려 실루엣이 깨진다.
     체력바 자리를 남기려고 높이는 86% */
  .token .glyph{
    position:absolute;left:0;top:0;width:100%;height:86%;
    object-fit:contain;object-position:center bottom;
    pointer-events:none;
  }
  .token .hp{
    position:absolute;left:12%;right:12%;bottom:6%;height:.22em;
    background:rgba(0,0,0,.5);border-radius:.11em;overflow:hidden;
  }
  .token .hp i{display:block;height:100%;width:100%;transition:width .18s;}
  .player .hp i{background:#1E5E20;}
  .monster .hp i{background:#FF8A73;}
  /* 가득 찬 체력바는 알려 주는 것이 없다. 다친 놈만 눈에 띄게 */
  .token.full .hp{display:none;}
  /* transform 은 자리 잡는 데 쓰고 있으므로 피격 표시는 filter 로 낸다 */
  .token.hit{animation:hit .25s ease-out;}
  @keyframes hit{0%,100%{filter:none;}25%{filter:brightness(2.4);}}
  .play.over .board{filter:grayscale(.6) brightness(.7);}

  .hint{
    color:var(--muted);font-size:12px;text-align:center;margin:0;
    padding:0 var(--s4) calc(env(safe-area-inset-bottom,0px) + var(--s4));
  }
</style>
</head>
<body>
  <main class="play">
    <div class="topbar">
      <a class="btn btn-secondary btn-sm" href="../index.html">← 목록</a>
      <span class="name">슬라이드</span>
      <span class="spacer"></span>
      <span class="stat">체력 <b id="hp">10/10</b></span>
      <span class="stat">이동 <b id="moves">0</b></span>
      <span class="stat">몬스터 <b id="mcount">0</b></span>
      <button class="btn btn-secondary btn-sm" id="reset" type="button">다시</button>
    </div>

    <div class="stage" id="stage">
      <div class="board" id="board"></div>
    </div>

    <p class="hint" id="hint">화면 어디든 스와이프 · 방향키 / WASD</p>
  </main>

<script>
(() => {
  'use strict';

  // ── 규칙 상수 ───────────────────────────────────────────────
  const N = 10;                 // 필드 10*10
  const BORDER = 2;             // 상하좌우 각 2줄이 외부
  const MIN = BORDER;           // 내부 최소 좌표 = 2
  const MAX = N - 1 - BORDER;   // 내부 최대 좌표 = 7  → 내부 6*6
  const START_MONSTERS = 3;
  const START = { x: 4, y: 4 }; // 내부 6*6 (2~7) 의 가운데
  // 체력·피해량은 규칙에 숫자가 없어서 정한 값이다
  const PLAYER_MAX_HP = 10;
  const GOBLIN_MAX_HP = 3;
  const GOBLIN_ATK = 1;

  const boardEl = document.getElementById('board');
  const stageEl = document.getElementById('stage');
  const movesEl = document.getElementById('moves');
  const countEl = document.getElementById('mcount');
  const hpEl = document.getElementById('hp');
  const hintEl = document.querySelector('.hint');
  const playEl = document.querySelector('.play');
  const fenceEl = document.createElement('div');

  let cellPx = 32, gapPx = 2;
  const player = { x: START.x, y: START.y, hp: PLAYER_MAX_HP, maxHp: PLAYER_MAX_HP, el: null };
  const monsters = [];          // {kind,x,y,hp,maxHp,atk,el}
  let moves = 0;
  let over = false;             // 플레이어가 쓰러졌다

  const isInner = (x, y) => x >= MIN && x <= MAX && y >= MIN && y <= MAX;

  // ── 판 그리기 ───────────────────────────────────────────────
  function buildBoard() {
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const c = document.createElement('div');
        c.className = 'cell ' + (isInner(x, y) ? 'inner' : 'outer');
        c.dataset.x = x;
        c.dataset.y = y;
        boardEl.appendChild(c);
      }
    }
    fenceEl.className = 'fence';
    boardEl.appendChild(fenceEl);

    player.el = document.createElement('div');
    player.el.className = 'token player';
    player.el.innerHTML = tokenInner('player.png', '플레이어');
    boardEl.appendChild(player.el);
  }

  const tokenInner = (src, alt) =>
    '<img class="glyph" src="images/' + src + '" alt="' + alt + '">' +
    '<span class="hp"><i></i></span>';

  // 체력바 폭과 `full` 표시를 현재 체력에 맞춘다
  function renderHp(ent) {
    ent.el.querySelector('.hp i').style.width =
      (100 * Math.max(0, ent.hp) / ent.maxHp) + '%';
    ent.el.classList.toggle('full', ent.hp >= ent.maxHp);
  }

  // 칸 크기는 남은 공간에 맞춰 정수 px 로 내림. 소수 px 이면 격자가 흔들린다
  function layout() {
    const w = stageEl.clientWidth - 24;
    const h = stageEl.clientHeight - 24;
    const side = Math.max(140, Math.min(w, h));
    gapPx = side < 340 ? 1 : 2;
    cellPx = Math.max(10, Math.floor((side - gapPx * (N - 1)) / N));

    const total = cellPx * N + gapPx * (N - 1);
    boardEl.style.width = total + 'px';
    boardEl.style.height = total + 'px';

    const step = cellPx + gapPx;
    for (const c of boardEl.querySelectorAll('.cell')) {
      c.style.width = cellPx + 'px';
      c.style.height = cellPx + 'px';
      c.style.left = (+c.dataset.x) * step + 'px';
      c.style.top = (+c.dataset.y) * step + 'px';
    }

    fenceEl.style.left = (MIN * step - gapPx / 2 - 2) + 'px';
    fenceEl.style.top = (MIN * step - gapPx / 2 - 2) + 'px';
    fenceEl.style.width = ((MAX - MIN + 1) * step - gapPx + 4) + 'px';
    fenceEl.style.height = ((MAX - MIN + 1) * step - gapPx + 4) + 'px';

    const fs = Math.max(9, Math.floor(cellPx * 0.55)) + 'px';
    for (const t of boardEl.querySelectorAll('.token')) {
      t.style.width = cellPx + 'px';
      t.style.height = cellPx + 'px';
      t.style.fontSize = fs;
    }

    place(player.el, player.x, player.y);
    for (const m of monsters) place(m.el, m.x, m.y);
  }

  function place(el, x, y) {
    const step = cellPx + gapPx;
    el.style.transform = 'translate(' + (x * step) + 'px,' + (y * step) + 'px)';
  }

  // ── 칸 차지 ────────────────────────────────────────────────
  const onBoard = (x, y) => x >= 0 && x < N && y >= 0 && y < N;
  const monsterAt = (x, y) => monsters.find(m => m.x === x && m.y === y) || null;
  // 플레이어와 몬스터가 물체다. 둘 다 남의 칸으로는 못 들어간다
  const occupied = (x, y) => (player.x === x && player.y === y) || !!monsterAt(x, y);

  // ── 몬스터 ─────────────────────────────────────────────────
  function outerCells() {
    const out = [];
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (!isInner(x, y)) out.push({ x, y });
      }
    }
    return out;
  }

  function addMonster(x, y) {
    const el = document.createElement('div');
    el.className = 'token monster';
    el.innerHTML = tokenInner('goblin.png', '고블린');
    el.style.width = cellPx + 'px';
    el.style.height = cellPx + 'px';
    el.style.fontSize = Math.max(9, Math.floor(cellPx * 0.55)) + 'px';
    boardEl.appendChild(el);
    place(el, x, y);

    const m = { kind: 'goblin', x, y, hp: GOBLIN_MAX_HP, maxHp: GOBLIN_MAX_HP, atk: GOBLIN_ATK, el };
    monsters.push(m);
    renderHp(m);
    countEl.textContent = monsters.length;
    return m;
  }

  function spawnMonster() {
    const free = outerCells().filter(c => !occupied(c.x, c.y));
    if (!free.length) return false;               // 외부에 빈 칸이 없다
    const spot = free[Math.floor(Math.random() * free.length)];
    addMonster(spot.x, spot.y);
    return true;
  }

  // 고블린: 매 턴 플레이어를 향해 상하좌우 한 칸.
  // 차이가 큰 축을 먼저 시도하고, 막혔으면 다른 축으로. 둘 다 막혔으면 그 자리에 선다.
  // 가로세로 차이가 같으면 가로를 먼저 본다 (규칙에 없어서 정한 것)
  function goblinStep(m) {
    const dx = player.x - m.x, dy = player.y - m.y;
    const h = dx ? [Math.sign(dx), 0] : null;
    const v = dy ? [0, Math.sign(dy)] : null;
    const tries = Math.abs(dx) >= Math.abs(dy) ? [h, v] : [v, h];

    for (const t of tries) {
      if (!t) continue;
      const nx = m.x + t[0], ny = m.y + t[1];
      // 판 밖, 다른 몬스터, 플레이어가 있는 칸으로는 못 간다
      if (!onBoard(nx, ny) || occupied(nx, ny)) continue;
      m.x = nx; m.y = ny;
      place(m.el, nx, ny);
      return;
    }
  }

  // 한 마리씩 차례로 옮긴다. 앞 마리가 비운 칸은 뒷 마리가 쓸 수 있다
  function monstersTurn() {
    for (const m of monsters) goblinStep(m);
  }

  // ── 전투 ───────────────────────────────────────────────────
  const adjacent4 = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1;

  function damage(target, amount) {
    target.hp = Math.max(0, target.hp - amount);
    renderHp(target);
    // transform 은 자리 잡는 데 쓰고 있어서 흔들 수가 없다. class 를 다시 붙여 재생한다
    target.el.classList.remove('hit');
    void target.el.offsetWidth;
    target.el.classList.add('hit');
  }

  // 공격 페이즈. 플레이어에 4방향으로 붙은 고블린이 때린다.
  // 플레이어 쪽 공격은 규칙(발동 조건·피해량·조작)이 아직 없어서 비워 뒀다
  function attackPhase() {
    for (const m of monsters) {
      if (adjacent4(m, player)) damage(player, m.atk);
    }
  }

  // ── 턴 ─────────────────────────────────────────────────────
  // 한 턴은 이동 페이즈 -> 공격 페이즈. 각 페이즈에 저마다 한 가지 행동
  function move(dx, dy) {
    if (over) return;
    const x = player.x + dx, y = player.y + dy;
    if (!isInner(x, y)) return;
    if (occupied(x, y)) return;

    // 이동 페이즈
    player.x = x; player.y = y;
    place(player.el, x, y);
    movesEl.textContent = ++moves;
    monstersTurn();

    // 공격 페이즈
    attackPhase();

    if (player.hp <= 0) over = true;
    else spawnMonster();
    updateStatus();
  }

  // 쓰러지거나 갇히면 어떤 입력도 안 먹는다. 승패 규칙이 아직 없어서
  // 멈춘 것인지 고장인지 화면상 구분이 안 되므로 상태를 적어 준다
  function updateStatus() {
    hpEl.textContent = Math.max(0, player.hp) + '/' + player.maxHp;
    playEl.classList.toggle('over', over);
    if (over) {
      hintEl.textContent = '쓰러졌다. 다시 를 눌러라';
      return;
    }
    const canMove = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
      const x = player.x + dx, y = player.y + dy;
      return isInner(x, y) && !occupied(x, y);
    });
    hintEl.textContent = canMove
      ? '화면 어디든 스와이프 · 방향키 / WASD'
      : '갇혔다. 다시 를 눌러라';
  }

  // ── 입력 ───────────────────────────────────────────────────
  const DIRS = {
    arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
  };
  window.addEventListener('keydown', e => {
    const dir = DIRS[e.key.toLowerCase()];
    if (!dir) return;
    e.preventDefault();
    move(dir[0], dir[1]);
  });

  // 스와이프는 판이 아니라 화면 전체에서 받는다
  const THRESHOLD = 24;
  let start = null;
  window.addEventListener('pointerdown', e => {
    // 상단 바 조작은 그대로 둔다. target 이 Element 가 아닐 수도 있어 closest 유무를 먼저 본다
    if (e.target && e.target.closest && e.target.closest('a,button')) return;
    start = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointerup', e => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < THRESHOLD) return;
    if (Math.abs(dx) > Math.abs(dy)) move(Math.sign(dx), 0);
    else move(0, Math.sign(dy));
  });
  window.addEventListener('pointercancel', () => { start = null; });

  // ── 시작 / 다시 ────────────────────────────────────────────
  function reset() {
    for (const m of monsters) m.el.remove();
    monsters.length = 0;
    player.x = START.x; player.y = START.y;
    player.hp = player.maxHp;
    renderHp(player);
    over = false;
    moves = 0;
    movesEl.textContent = '0';
    countEl.textContent = '0';
    place(player.el, player.x, player.y);
    for (let i = 0; i < START_MONSTERS; i++) spawnMonster();
    updateStatus();
  }

  document.getElementById('reset').addEventListener('click', reset);
  window.addEventListener('resize', layout);

  buildBoard();
  layout();
  reset();

  // 판을 원하는 상태로 놓고 확인하기 위한 손잡이. 스폰이 랜덤이라
  // 이것이 없으면 "고블린이 다가오는가" 를 재현성 있게 볼 수가 없다
  window.__t = {
    monsters, player, place, addMonster, updateStatus, renderHp,
    isOver: () => over,
    limits: { PLAYER_MAX_HP, GOBLIN_MAX_HP, GOBLIN_ATK },
  };
})();
</script>
</body>
</html>
