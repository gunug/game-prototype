<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>슬라이드 — Game Prototype</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFD400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }

  .play{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--canvas);}

  .topbar{
    display:flex;align-items:center;gap:var(--s3);
    padding:var(--s3) var(--s4);
    padding-top:calc(env(safe-area-inset-top,0px) + var(--s3));
    border-bottom:1px solid var(--hairline);
  }
  .topbar .name{color:var(--ink);font-weight:700;font-size:15px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .stat{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;
    white-space:nowrap;}
  .topbar .stat b{color:var(--ink);}
  .topbar .spacer{flex:1;}
  /* 단추 글자가 두 줄로 접히면 상단 바가 통째로 두 배가 된다 */
  .topbar .btn{white-space:nowrap;flex:none;}
  /* 좁아지면 이름부터 뺀다. 제목보다 체력·턴·단추가 먼저다 */
  @media (max-width:470px){
    .topbar{gap:var(--s2);padding-left:var(--s3);padding-right:var(--s3);}
    .topbar .name{display:none;}
  }

  /* 판이 들어갈 자리. 남는 공간 전부 */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--s3);min-height:0;}

  .board{position:relative;}

  /* 칸은 배경으로만 깔린다. 움직이는 것(플레이어/몬스터)은 그 위에 얹는다 */
  .cell{position:absolute;border-radius:3px;}
  .cell.outer{background:#161613;box-shadow:inset 0 0 0 1px var(--hairline);}
  .cell.inner{
    background:var(--surface-soft);box-shadow:inset 0 0 0 1px var(--hairline);
    transition:background .18s, box-shadow .18s;
    display:flex;align-items:center;justify-content:center;
    /* 글자 크기는 칸을 따라가야 해서 layout() 이 px 로 넣어 준다 */
  }
  /* 다음 턴에 맞을 수 있는 빈 칸. 지금 몬스터가 바로 옆에 붙어 있는 칸이다 */
  .cell.inner.danger{background:#38201D;box-shadow:inset 0 0 0 1px #6B322B;}

  /* 그 칸으로 갔을 때 받을 피해. 뾰족뾰족한 타격 딱지.
     별 두 겹으로 만든다. 바깥이 테두리 색, 안쪽이 채움. 바깥의 padding 이 테두리 두께다.
     filter: drop-shadow 로 테두리를 내면 안 된다. clip-path 가 filter 뒤에 걸려
     그림자까지 같은 모양으로 잘라 먹어서 아무것도 안 남는다 */
  .hit-mark{
    display:none;padding:1.5px;
    background:#FF8A73;
    /* 두 겹이라 색을 각각 반투명하게 하면 바깥 색이 안쪽에 배어 지저분해진다.
       딱지 전체에 한 번만 건다 */
    opacity:.85;
    clip-path:polygon(
      50% 0%, 59.8% 13.3%, 75% 6.7%, 76.9% 23.1%, 93.3% 25%, 86.7% 40.2%,
      100% 50%, 86.7% 59.8%, 93.3% 75%, 76.9% 76.9%, 75% 93.3%, 59.8% 86.7%,
      50% 100%, 40.2% 86.7%, 25% 93.3%, 23.1% 76.9%, 6.7% 75%, 13.3% 59.8%,
      0% 50%, 13.3% 40.2%, 6.7% 25%, 23.1% 23.1%, 25% 6.7%, 40.2% 13.3%);
    pointer-events:none;
  }
  .hit-mark i{
    display:block;
    min-width:1.62em;padding:.32em .2em;
    background:#3A1F1B;
    color:#FFC8BC;
    font-style:normal;font-weight:800;line-height:1;text-align:center;
    font-variant-numeric:tabular-nums;
    clip-path:polygon(
      50% 0%, 59.8% 13.3%, 75% 6.7%, 76.9% 23.1%, 93.3% 25%, 86.7% 40.2%,
      100% 50%, 86.7% 59.8%, 93.3% 75%, 76.9% 76.9%, 75% 93.3%, 59.8% 86.7%,
      50% 100%, 40.2% 86.7%, 25% 93.3%, 23.1% 76.9%, 6.7% 75%, 13.3% 59.8%,
      0% 50%, 13.3% 40.2%, 6.7% 25%, 23.1% 23.1%, 25% 6.7%, 40.2% 13.3%);
  }
  .cell.danger .hit-mark{display:block;}
  /* 플레이어 것은 토큰 한가운데에 얹는다. 그대로 서 있으면 얼마나 맞는지를 알린다 */
  .player .hit-mark{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    font-size:var(--mark, 14px);
    z-index:2;
  }
  .player.threatened .hit-mark{display:block;}

  /* 내부 6*6 의 테두리. 플레이어가 갈 수 있는 범위가 보이게 */
  .fence{
    position:absolute;pointer-events:none;border-radius:var(--r-sm);
    border:2px solid var(--brand-yellow-deep);opacity:.55;
  }

  .token{
    position:absolute;left:0;top:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--r-sm);
    font-weight:800;line-height:1;
    will-change:transform;
  }
  /* transform 은 자리를 잡는 데 쓰고 있다. 등장 효과는 안쪽 스프라이트에만 건다 */
  /* 스프라이트가 주인공이라 바닥판은 옅게 깔고 테두리로만 누가 있는지 알린다 */
  .player{
    background:radial-gradient(ellipse at 50% 78%,
      rgba(255,212,0,.42), rgba(255,212,0,.10) 55%, transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,212,0,.55);
    transition:transform .13s cubic-bezier(.2,.7,.3,1),
               width .13s, height .13s, left .13s, top .13s, font-size .13s;
  }
  .monster{
    background:radial-gradient(ellipse at 50% 78%,
      rgba(255,138,115,.28), rgba(255,138,115,.07) 55%, transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,138,115,.35);
    transition:transform .13s cubic-bezier(.2,.7,.3,1),
               width .13s, height .13s, left .13s, top .13s, font-size .13s;
  }
  .monster .glyph{animation:pop .18s ease-out;}
  @keyframes pop{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}

  /* 원본이 64px 이고 그려지는 크기가 40~70px 이라 1:1 언저리다. 픽셀 아트는
     이 배율에서 pixelated 가 또렷하다 (예전 384px 원본일 때는 10배 축소라
     픽셀을 왕창 버려서 실루엣이 깨졌고, 그때는 부드럽게 줄이는 쪽이 나았다).
     아래쪽은 체력 표시 자리로 비워 둔다 */
  .token .glyph{
    position:absolute;left:0;top:0;width:100%;height:72%;
    object-fit:contain;object-position:center bottom;
    image-rendering:pixelated;
    pointer-events:none;
  }
  /* 체력바 안에 숫자를 얹는다. 따로 줄을 만들면 칸이 좁아 둘 다 못 읽는다 */
  .token .hp{
    position:absolute;left:6%;right:6%;bottom:5%;height:.42em;
    background:rgba(0,0,0,.62);border-radius:.1em;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .token .hp i{position:absolute;left:0;top:0;height:100%;width:100%;
    transition:width .32s cubic-bezier(.2,.7,.3,1);}
  .token .hp b{
    position:relative;font-size:.3em;line-height:1;font-weight:700;
    color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.95);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .player .hp i{background:#1E5E20;}
  .monster .hp i{background:#A8352A;}
  /* 외부 띠의 토큰은 17px 쯤이라 숫자가 안 읽힌다. 바만 남긴다 */
  .token.tiny .glyph{height:86%;}
  .token.tiny .hp{left:12%;right:12%;bottom:6%;height:.22em;}
  .token.tiny .hp b{display:none;}
  /* 토큰의 transform 은 자리를 잡는 데 쓰고 있다. 그래서 연출은 전부
     안쪽 .glyph 를 움직이거나, 토큰에는 transform 아닌 속성만 쓴다 */
  .token.hit{animation:hit .25s ease-out;}
  @keyframes hit{0%,100%{filter:none;}25%{filter:brightness(2.4);}}

  /* 피격: 빠르게 조금 작아졌다 본래 크기로 */
  .token.hit .glyph{animation:struck .25s ease-out;}
  @keyframes struck{0%,100%{transform:scale(1);}40%{transform:scale(.72);}}

  /* 입은 피해를 머리 위에 띄운다. 토큰 안이 아니라 판에 직접 붙인다.
     토큰은 will-change:transform 으로 쌓임 맥락을 만들기 때문에, 그 안에 두면
     z-index 를 아무리 올려도 옆 토큰 위로 못 올라온다 */
  .dmg{
    position:absolute;z-index:50;
    font-weight:800;line-height:1;white-space:nowrap;pointer-events:none;
    /* 스프라이트 위든 남의 체력바 위든 읽혀야 해서 검은 테를 둘러 준다 */
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
      0 2px 4px rgba(0,0,0,.95);
    animation:dmgfloat .9s ease-out forwards;
  }
  .dmg.on-player{color:#FF6B57;}
  .dmg.on-monster{color:#FFD400;}
  /* 띄우는 거리는 em 으로 잡는다. % 는 글자 상자(16px 남짓) 기준이라
     아무리 키워도 몇 px 밖에 안 올라간다.
     제일 잘 보이는 구간이 제 칸 안(머리 근처)에 오도록 잡았다. 칸 밖으로 나가는
     것은 흐려진 뒤라, 위 칸 토큰의 체력바와 겹쳐 읽히는 일이 없다 */
  @keyframes dmgfloat{
    0%  {opacity:0;transform:translate(-50%, .3em)  scale(.8);}
    12% {opacity:1;transform:translate(-50%,-.2em)  scale(1.15);}
    55% {opacity:1;transform:translate(-50%,-1.1em) scale(1);}
    100%{opacity:0;transform:translate(-50%,-2.4em) scale(1);}
  }

  /* 공격: 치는 방향으로 조금 나갔다 제자리로 */
  .token.atk-up    .glyph{animation:lunge-up .2s ease-out;}
  .token.atk-down  .glyph{animation:lunge-down .2s ease-out;}
  .token.atk-left  .glyph{animation:lunge-left .2s ease-out;}
  .token.atk-right .glyph{animation:lunge-right .2s ease-out;}
  @keyframes lunge-up   {0%,100%{transform:translateY(0);}45%{transform:translateY(-28%);}}
  @keyframes lunge-down {0%,100%{transform:translateY(0);}45%{transform:translateY(28%);}}
  @keyframes lunge-left {0%,100%{transform:translateX(0);}45%{transform:translateX(-28%);}}
  @keyframes lunge-right{0%,100%{transform:translateX(0);}45%{transform:translateX(28%);}}
  .play.over .board{filter:grayscale(.6) brightness(.7);}

  /* 판은 1:1 정사각. 남는 빈 자리에 퀘스트를 놓는다 */
  .quest{
    flex:none;margin:0 auto;padding:var(--s3) var(--s4) 0;
    width:100%;max-width:520px;
  }
  .q-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:8px;}
  .q-step{
    color:var(--brand-yellow);background:#161613;border-radius:var(--r-pill);
    font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;flex:none;
  }
  .q-note{color:var(--muted);font-size:11px;margin:0;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .q-list{list-style:none;margin:0;padding:0;display:grid;gap:5px;}
  .q-item{
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;
    column-gap:8px;row-gap:4px;
  }
  .q-check{
    width:15px;height:15px;border-radius:4px;flex:none;
    box-shadow:inset 0 0 0 1px var(--hairline);background:var(--surface);
    position:relative;
  }
  /* 체크 표시는 가상 요소로. 다 깬 줄만 보인다 */
  .q-check::after{
    content:'✓';position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:var(--on-brand);opacity:0;
  }
  .q-name{color:var(--body);font-size:13px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .q-num{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none;}
  /* 한 번에 끝나는 항목은 막대가 체크와 같은 말을 반복한다. 여러 번 걸리는 것만 둔다 */
  .q-item.binary .q-track{display:none;}
  .q-item.binary{row-gap:0;}
  .q-track{
    grid-column:2 / -1;height:4px;border-radius:2px;
    background:var(--surface);box-shadow:inset 0 0 0 1px var(--hairline);overflow:hidden;
  }
  .q-track i{display:block;height:100%;width:0;border-radius:2px;
    background:var(--brand-yellow);transition:width .35s cubic-bezier(.2,.7,.3,1);}

  .q-item.done .q-check{background:#4CD07A;box-shadow:none;}
  .q-item.done .q-check::after{opacity:1;}
  .q-item.done .q-name{color:var(--ink);}
  .q-item.done .q-track i{background:#4CD07A;}

  /* 묶음을 다 깬 순간 잠깐 알린다. 다음으로 넘어가기 전에 눈이 따라올 시간을 준다 */
  .quest.done{animation:qdone .5s ease-out;}
  @keyframes qdone{0%,100%{transform:none;}30%{transform:scale(1.035);}}
  .quest.all-done .q-step{background:var(--brand-yellow);color:var(--on-brand);}

  .hint{
    color:var(--muted);font-size:12px;text-align:center;margin:0;
    padding:var(--s3) var(--s4) calc(env(safe-area-inset-bottom,0px) + var(--s4));
  }
</style>
</head>
<body>
  <main class="play">
    <div class="topbar">
      <a class="btn btn-secondary btn-sm" href="../index.html">← 목록</a>
      <span class="name">슬라이드</span>
      <span class="spacer"></span>
      <span class="stat">체력 <b id="hp">10/10</b></span>
      <span class="stat">턴 <b id="moves">0</b></span>
      <span class="stat">몬스터 <b id="mcount">0</b></span>
      <button class="btn btn-secondary btn-sm" id="sound" type="button"
              aria-label="소리 끄기" aria-pressed="true">🔊</button>
      <button class="btn btn-secondary btn-sm" id="reset" type="button">다시</button>
    </div>

    <div class="stage" id="stage">
      <div class="board" id="board"></div>
    </div>

    <section class="quest" id="quest">
      <div class="q-head">
        <span class="q-step" id="qstep">퀘스트 1/3</span>
        <p class="q-note" id="qnote"></p>
      </div>
      <ul class="q-list" id="qlist"></ul>
    </section>

    <p class="hint" id="hint">스와이프 · 방향키 / WASD — 빈 칸이면 이동, 몬스터면 공격</p>
  </main>

<script>
(() => {
  'use strict';

  // ── 규칙 상수 ───────────────────────────────────────────────
  const N = 10;                 // 필드 10*10
  const BORDER = 2;             // 상하좌우 각 2줄이 외부
  const MIN = BORDER;           // 내부 최소 좌표 = 2
  const MAX = N - 1 - BORDER;   // 내부 최대 좌표 = 7  → 내부 6*6
  const START = { x: 4, y: 4 }; // 내부 6*6 (2~7) 의 가운데
  // 체력·피해량은 규칙에 숫자가 없어서 정한 값이다
  // ── 살아 있는 것들 ─────────────────────────────────────────
  // 플레이어든 몬스터든 공·방·체를 갖는다. 종류마다 다른 것은 전부 이 표에만 있다.
  // 새 종류를 넣을 때 손댈 곳이 한 군데다
  const BEINGS = {
    player: {
      name: '플레이어', img: 'player.png',
      atk: 10, def: 5, maxHp: 100, agi: 10,
    },
    goblin: {
      name: '고블린', img: 'goblin.png',
      atk: 2, def: 5, maxHp: 12, agi: 8,
      step: stepToward,
    },
    rider: {
      name: '고블린 라이더', img: 'goblin_rider.png',
      atk: 5, def: 5, maxHp: 24, agi: 9,   // 말을 탔으니 걸어오는 고블린보다 빠르다
      step: stepKnight,
    },
  };

  // 최종 공격력 = 공격자의 공격력 - 방어자의 방어력. 1 보다 작아지면 1 로 친다
  const damageTo = (attacker, target) => Math.max(1, attacker.atk - target.def);

  // 살아 있는 것 하나를 만든다. 자리와 그림 말고는 표에서 그대로 베낀다
  let nextSeq = 0;              // 생성 순서. 민첩이 같으면 이것으로 가른다
  function makeBeing(kind, x, y) {
    const s = BEINGS[kind];
    return {
      kind, x, y, el: null,
      atk: s.atk, def: s.def, maxHp: s.maxHp, hp: s.maxHp,
      agi: s.agi, seq: nextSeq++,
    };
  }

  const SWIPE_MOVE = 24;        // 이만큼은 움직여야 입력으로 친다
  const TINY_TOKEN = 30;        // 토큰이 이보다 작으면 체력 숫자를 감춘다
  const HIT_MARK_SCALE = 0.30;  // 피해 딱지 글자 크기 = 칸 크기 * 이 값

  // 공격은 한꺼번에 터지면 무슨 일이 일어났는지 못 읽는다. 한 대씩 끊어 보여 준다
  const HIT_DELAY = 120;        // 돌진이 뻗은 뒤 피해가 들어가기까지
  const ATTACK_GAP = 260;       // 한 대와 다음 한 대 사이
  const tuning = { hit: HIT_DELAY, gap: ATTACK_GAP };   // 검사할 때 0 으로 낮춘다

  // ── 소리 ───────────────────────────────────────────────────
  // 음원 파일 없이 그때그때 만든다. 받아 올 것이 없어 한 파일로 그대로 돌아간다
  let audioCtx = null;
  let soundOn = true;

  function ensureAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;                       // 오래된 브라우저·검사 환경
    if (!audioCtx) audioCtx = new AC();
    // 소리는 사용자가 건드린 뒤에만 난다. 공격은 늘 입력 뒤라 여기서 풀어도 된다
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // 휘두르는 소리. 감쇠하는 잡음을 대역 필터로 위에서 아래로 훑는다
  function playSwing(pitch) {
    if (!soundOn) return;
    const ctx = ensureAudio();
    if (!ctx) return;

    const dur = 0.17;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const fade = 1 - i / data.length;
      data[i] = (Math.random() * 2 - 1) * fade * fade;
    }

    const src = ctx.createBufferSource();
    src.buffer = buf;

    const band = ctx.createBiquadFilter();
    band.type = 'bandpass';
    band.Q.value = 1.1;
    band.frequency.setValueAtTime(1600 * pitch, ctx.currentTime);
    band.frequency.exponentialRampToValueAtTime(360 * pitch, ctx.currentTime + dur);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0008, ctx.currentTime + dur);

    src.connect(band).connect(gain).connect(ctx.destination);
    src.start();
    src.stop(ctx.currentTime + dur);
  }


  // 안내 문구는 HTML 과 updateStatus() 두 군데서 쓴다. 한 곳에 둔다
  const HINT_DEFAULT = '스와이프 · 방향키 / WASD — 빈 칸이면 이동, 몬스터면 공격';

  // ── 퀘스트 ─────────────────────────────────────────────────
  // 한 묶음이 한꺼번에 뜨고, 안의 항목을 각각 따로 깬다. 다 깨면 다음 묶음으로.
  // 몬스터가 언제 몇 마리 나오는지도 묶음이 정한다 (묶음 하나에 출현 규칙 하나라야
  // 고블린 묶음과 라이더 묶음이 섞여 나오는 일이 없다)
  const QUEST_GROUPS = [
    {
      note: '스와이프나 WASD 로. 몬스터는 나오지 않는다',
      spawn: null,
      items: [
        { title: '위로 움직이기', type: 'dir', dir: '0,-1' },
        { title: '왼쪽으로 움직이기', type: 'dir', dir: '-1,0' },
        { title: '오른쪽으로 움직이기', type: 'dir', dir: '1,0' },
        { title: '아래로 움직이기', type: 'dir', dir: '0,1' },
      ],
    },
    {
      note: '3턴에 한 마리씩, 모두 10마리가 나온다',
      spawn: { kind: 'goblin', every: 3, max: 10 },
      items: [{ title: '고블린 5마리 잡기', type: 'kill', kind: 'goblin', goal: 5 }],
    },
    {
      note: '3턴에 한 마리씩, 모두 10마리가 나온다',
      spawn: { kind: 'rider', every: 3, max: 10 },
      items: [{ title: '고블린 라이더 5마리 잡기', type: 'kill', kind: 'rider', goal: 5 }],
    },
  ];
  const itemGoal = it => (it.type === 'dir' ? 1 : it.goal);

  const QUEST_CLEAR_MS = 900;   // 깬 것을 보여 주고 다음으로 넘어가기까지

  const boardEl = document.getElementById('board');
  const stageEl = document.getElementById('stage');
  const movesEl = document.getElementById('moves');
  const countEl = document.getElementById('mcount');
  const hpEl = document.getElementById('hp');
  const questEl = document.getElementById('quest');
  const qStepEl = document.getElementById('qstep');
  const qNoteEl = document.getElementById('qnote');
  const qListEl = document.getElementById('qlist');
  const hintEl = document.querySelector('.hint');
  const playEl = document.querySelector('.play');
  const fenceEl = document.createElement('div');

  // 외부는 적이 어디서 나오는지만 보여 주면 되므로 내부 칸의 1/3 크기로 그린다.
  // 규칙(좌표·이동·스폰)은 그대로다. 화면에서 차지하는 자리만 줄인다
  const OUTER_SCALE = 1 / 3;
  let gapPx = 2;
  let axis = { size: [], pos: [], total: 0 };
  const player = makeBeing('player', START.x, START.y);
  const monsters = [];          // {kind,x,y,hp,maxHp,atk,el}
  let moves = 0;
  let over = false;             // 플레이어가 쓰러졌다
  let busy = false;             // 페이즈 연출이 도는 중. 입력을 막는다
  let phaseId = 0;              // 페이즈 세대. `다시` 로 갈아엎으면 옛 페이즈는 손을 뗀다
  let innerCell = 32;           // 내부 칸 크기. 데미지 숫자 크기에 쓴다

  let groupIndex = 0;
  let groupTurns = 0;           // 이 묶음에서 지난 턴
  let groupSpawned = 0;         // 이 묶음에서 내보낸 마릿수
  const groupKills = {};        // 이 묶음에서 잡은 마릿수, 종류별
  const groupDirs = new Set();  // 이 묶음에서 움직여 본 방향
  let allDone = false;

  // 퀘스트 줄은 묶음 크기에 맞춰 그때그때 만든다
  const qRows = [];
  const cellAt = [];            // y*N+x → 칸 요소

  const isInner = (x, y) => x >= MIN && x <= MAX && y >= MIN && y <= MAX;

  // ── 판 그리기 ───────────────────────────────────────────────
  function buildBoard() {
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const c = document.createElement('div');
        c.className = 'cell ' + (isInner(x, y) ? 'inner' : 'outer');
        c.dataset.x = x;
        c.dataset.y = y;
        if (isInner(x, y)) c.innerHTML = '<span class="hit-mark"><i></i></span>';
        cellAt[y * N + x] = c;      // 위험 표시를 매 페이즈 고쳐야 해서 들고 있는다
        boardEl.appendChild(c);
      }
    }
    fenceEl.className = 'fence';
    boardEl.appendChild(fenceEl);

    player.el = document.createElement('div');
    player.el.className = 'token player';
    player.el.innerHTML = tokenInner('player.png', '플레이어')
      + '<span class="hit-mark"><i></i></span>';
    boardEl.appendChild(player.el);
  }

  const tokenInner = (src, alt) =>
    '<img class="glyph" src="images/' + src + '" alt="' + alt + '">' +
    '<span class="hp"><i></i><b></b></span>';

  // 체력바 폭과 숫자를 현재 체력에 맞춘다.
  // 상단 바 숫자도 여기서 같이 고친다. 페이즈 끝에만 고치면 한 대씩 끊어 때리는
  // 동안 상단 바만 옛 값에 머물러, 정작 체력이 언제 깎였는지가 안 보인다
  function renderHp(ent) {
    const hp = Math.max(0, ent.hp);
    ent.el.querySelector('.hp i').style.width = (100 * hp / ent.maxHp) + '%';
    ent.el.querySelector('.hp b').textContent = hp + '/' + ent.maxHp;
    ent.el.classList.toggle('full', ent.hp >= ent.maxHp);
    if (ent === player) hpEl.textContent = hp + '/' + ent.maxHp;
  }

  // 한 축의 칸 크기와 시작 위치를 미리 구한다. 내부 칸은 C, 외부 칸은 C/3 이라
  // 칸마다 크기가 달라 더는 곱셈 한 번으로 자리를 낼 수 없다.
  //   전체 = 내부수*C + 외부수*(C/3) + 간격*(N-1)
  function computeAxis(side, gap) {
    const innerCount = MAX - MIN + 1;
    const outerCount = N - innerCount;
    const C = Math.max(12,
      Math.floor((side - gap * (N - 1)) / (innerCount + outerCount * OUTER_SCALE)));
    const O = Math.max(3, Math.round(C * OUTER_SCALE));

    const size = [], pos = [];
    let p = 0;
    for (let i = 0; i < N; i++) {
      size.push(i >= MIN && i <= MAX ? C : O);
      pos.push(p);
      p += size[i] + gap;
    }
    return { size, pos, total: p - gap };
  }

  // 칸 크기는 남은 공간에 맞춰 정수 px 로 내림. 소수 px 이면 격자가 흔들린다
  function layout() {
    const w = stageEl.clientWidth - 24;
    const h = stageEl.clientHeight - 24;
    const side = Math.max(140, Math.min(w, h));
    gapPx = side < 340 ? 1 : 2;
    axis = computeAxis(side, gapPx);
    innerCell = axis.size[MIN];

    boardEl.style.width = axis.total + 'px';
    boardEl.style.height = axis.total + 'px';

    // 세로줄과 가로줄을 따로 본다. 왼쪽 띠의 안쪽 행은 좁고 길쭉한 칸이 된다
    for (const c of boardEl.querySelectorAll('.cell')) {
      const x = +c.dataset.x, y = +c.dataset.y;
      c.style.width = axis.size[x] + 'px';
      c.style.height = axis.size[y] + 'px';
      c.style.left = axis.pos[x] + 'px';
      c.style.top = axis.pos[y] + 'px';
      if (c.classList.contains('inner')) {
        c.style.fontSize = Math.round(axis.size[x] * HIT_MARK_SCALE) + 'px';
      }
    }

    const span = axis.pos[MAX] + axis.size[MAX] - axis.pos[MIN];
    fenceEl.style.left = (axis.pos[MIN] - gapPx / 2 - 2) + 'px';
    fenceEl.style.top = (axis.pos[MIN] - gapPx / 2 - 2) + 'px';
    fenceEl.style.width = (span + 4) + 'px';
    fenceEl.style.height = (span + 4) + 'px';

    place(player.el, player.x, player.y);
    for (const m of monsters) place(m.el, m.x, m.y);
    renderDanger();   // 딱지 글자 크기가 칸을 따라가야 해서 여기서도 부른다
  }

  // 자리와 크기를 같이 잡는다. 띠를 넘나들면 칸 크기가 바뀌므로 둘을 떼면 안 된다.
  // 토큰은 늘 정사각형이다. 옆 띠의 칸은 좁고 길쭉해서, 칸을 꽉 채우면
  // 고블린이 길쭉한 알약 바닥에 처박힌 꼴이 된다. 짧은 변에 맞춰 칸 가운데 둔다.
  // 가운데로 미는 것은 left/top 으로 한다. transform 은 칸의 원점을 그대로 가리켜야
  // 자리 계산이 한 군데로 모인다
  function place(el, x, y) {
    const w = axis.size[x], h = axis.size[y];
    const s = Math.min(w, h);
    el.style.width = s + 'px';
    el.style.height = s + 'px';
    el.style.left = ((w - s) / 2) + 'px';
    el.style.top = ((h - s) / 2) + 'px';
    el.style.fontSize = Math.max(7, Math.floor(s * 0.55)) + 'px';
    el.classList.toggle('tiny', s < TINY_TOKEN);   // 외부 띠에서는 숫자가 안 읽힌다
    el.style.transform = 'translate(' + axis.pos[x] + 'px,' + axis.pos[y] + 'px)';
  }

  // ── 칸 차지 ────────────────────────────────────────────────
  const onBoard = (x, y) => x >= 0 && x < N && y >= 0 && y < N;
  const monsterAt = (x, y) => monsters.find(m => m.x === x && m.y === y) || null;
  // 플레이어와 몬스터가 물체다. 둘 다 남의 칸으로는 못 들어간다
  const occupied = (x, y) => (player.x === x && player.y === y) || !!monsterAt(x, y);

  // ── 전투 ───────────────────────────────────────────────────
  const adjacent4 = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1;

  // 때리는 쪽이 뻗고 → 잠깐 뒤에 맞는 쪽이 반응한다. 둘이 동시에 일어나면
  // 누가 누구를 쳤는지 안 읽힌다
  async function strike(attacker, target, dx, dy) {
    const mine = phaseId;
    lunge(attacker.el, dx, dy);
    await sleep(tuning.hit);
    // 기다리는 사이에 `다시` 를 눌렀으면 새 판을 때리게 된다
    if (phaseId !== mine || over) return;
    damage(target, damageTo(attacker, target));
  }

  function damage(target, amount) {
    target.hp = Math.max(0, target.hp - amount);
    renderHp(target);
    floatDamage(target, amount);
    // transform 은 자리 잡는 데 쓰고 있어서 흔들 수가 없다. class 를 다시 붙여 재생한다
    target.el.classList.remove('hit');
    void target.el.offsetWidth;
    target.el.classList.add('hit');
  }

  // 입은 피해를 머리 위에 띄운다. 칸 크기를 따라가되 너무 작아지지는 않게 한다.
  // 토큰이 아니라 판에 붙여야 다른 토큰 위로 올라온다
  function floatDamage(ent, amount) {
    const el = document.createElement('span');
    el.className = 'dmg ' + (ent === player ? 'on-player' : 'on-monster');
    el.textContent = '-' + amount;
    el.style.fontSize = Math.max(11, Math.round(innerCell * 0.34)) + 'px';
    el.style.left = (axis.pos[ent.x] + axis.size[ent.x] / 2) + 'px';
    // 칸 위끝이 아니라 조금 아래에서 시작한다. 그래야 제일 진할 때가
    // 제 칸 안(머리 언저리)에 오고, 위 칸 체력바 위에서 읽히지 않는다
    el.style.top = (axis.pos[ent.y] + axis.size[ent.y] * 0.3) + 'px';
    boardEl.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // ── 몬스터 ─────────────────────────────────────────────────
  function outerCells() {
    const out = [];
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (!isInner(x, y)) out.push({ x, y });
      }
    }
    return out;
  }

  function addMonster(x, y, kind = 'goblin') {
    const spec = BEINGS[kind];
    const el = document.createElement('div');
    el.className = 'token monster ' + kind;
    el.innerHTML = tokenInner(spec.img, spec.name);
    boardEl.appendChild(el);
    place(el, x, y);

    const m = makeBeing(kind, x, y);
    m.el = el;
    monsters.push(m);
    renderHp(m);
    countEl.textContent = monsters.length;
    return m;
  }

  function spawnMonster(kind) {
    const free = outerCells().filter(c => !occupied(c.x, c.y));
    if (!free.length) return false;               // 외부에 빈 칸이 없다
    const spot = free[Math.floor(Math.random() * free.length)];
    addMonster(spot.x, spot.y, kind);
    return true;
  }

  // 퀘스트가 정한 대로만 내보낸다. 퀘스트에 spawn 이 없으면 아무것도 안 나온다
  function questSpawn() {
    const g = group();
    if (!g || !g.spawn) return;
    if (groupSpawned >= g.spawn.max) return;
    if (groupTurns % g.spawn.every !== 0) return;
    if (spawnMonster(g.spawn.kind)) groupSpawned++;
  }

  const dist = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
  const canEnter = (x, y) => onBoard(x, y) && !occupied(x, y);

  // 고블린: 매 턴 플레이어를 향해 상하좌우 한 칸.
  // 차이가 큰 축을 먼저 시도하고, 막혔으면 다른 축으로. 둘 다 막혔으면 그 자리에 선다.
  // 가로세로 차이가 같으면 가로를 먼저 본다 (규칙에 없어서 정한 것)
  function stepToward(m) {
    const dx = player.x - m.x, dy = player.y - m.y;
    const h = dx ? [Math.sign(dx), 0] : null;
    const v = dy ? [0, Math.sign(dy)] : null;
    const tries = Math.abs(dx) >= Math.abs(dy) ? [h, v] : [v, h];

    for (const t of tries) {
      if (!t) continue;
      const nx = m.x + t[0], ny = m.y + t[1];
      // 판 밖, 다른 몬스터, 플레이어가 있는 칸으로는 못 간다
      if (!onBoard(nx, ny) || occupied(nx, ny)) continue;
      m.x = nx; m.y = ny;
      place(m.el, nx, ny);
      return;
    }
  }

  // 고블린 라이더: 체스의 나이트처럼 움직인다. 사이에 무엇이 있든 뛰어넘는다.
  // 갈 수 있는 여덟 칸 중에서 "플레이어에 인접" 에 가장 가까운 칸을 고른다.
  // 인접이 목표라 거리 1 이 최고점이다. 거리 0 은 플레이어가 서 있어 갈 수 없다.
  // 점수가 같으면 아래 차례에서 먼저 나온 칸을 쓴다 (규칙에 없어서 정한 것)
  const KNIGHT = [
    [1, -2], [2, -1], [2, 1], [1, 2],
    [-1, 2], [-2, 1], [-2, -1], [-1, -2],
  ];

  function stepKnight(m) {
    let best = null, bestScore = Infinity;
    for (const [dx, dy] of KNIGHT) {
      const nx = m.x + dx, ny = m.y + dy;
      if (!canEnter(nx, ny)) continue;
      const score = Math.abs(dist({ x: nx, y: ny }, player) - 1);
      if (score < bestScore) { bestScore = score; best = [nx, ny]; }
    }
    if (!best) return;                    // 여덟 칸이 다 막혔으면 그 자리에 선다
    m.x = best[0]; m.y = best[1];
    place(m.el, m.x, m.y);
  }

  // 몬스터의 한 턴. 이동과 공격은 따로 도는 페이즈가 아니라 둘 중 하나만 고른다.
  // 붙어 있으면 때리고, 아니면 다가간다. 다가가서 붙은 턴에는 때리지 않는다
  // 때렸으면 true. 부른 쪽은 그만큼 뜸을 들인다
  async function monsterAct(m) {
    if (adjacent4(m, player)) {
      await strike(m, player, Math.sign(player.x - m.x), Math.sign(player.y - m.y));
      return true;
    }
    BEINGS[m.kind].step(m);
    return false;
  }

  function killMonster(m) {
    const i = monsters.indexOf(m);
    if (i < 0) return;
    monsters.splice(i, 1);
    m.el.remove();
    countEl.textContent = monsters.length;
  }

  // ── 퀘스트 진행 ────────────────────────────────────────────
  const group = () => (allDone ? null : QUEST_GROUPS[groupIndex]);

  function itemProgress(it) {
    if (it.type === 'dir') return groupDirs.has(it.dir) ? 1 : 0;
    return Math.min(groupKills[it.kind] || 0, it.goal);
  }
  const itemDone = it => itemProgress(it) >= itemGoal(it);
  const groupDone = () => {
    const g = group();
    return !!g && g.items.every(itemDone);
  };

  // 묶음마다 항목 수가 다르다. 줄을 새로 만들고 나서 값만 갈아 끼운다
  function buildQuestRows() {
    qListEl.textContent = '';
    qRows.length = 0;
    const g = group();
    if (!g) return;
    for (const it of g.items) {
      const li = document.createElement('li');
      li.className = 'q-item';
      li.innerHTML =
        '<span class="q-check"></span>' +
        '<span class="q-name"></span>' +
        '<span class="q-num"></span>' +
        '<span class="q-track"><i></i></span>';
      li.querySelector('.q-name').textContent = it.title;
      if (itemGoal(it) === 1) li.classList.add('binary');
      qListEl.appendChild(li);
      qRows.push({ it, li, num: li.querySelector('.q-num'), fill: li.querySelector('.q-track i') });
    }
  }

  function renderQuest() {
    if (allDone) {
      questEl.classList.add('all-done');
      questEl.classList.remove('done');
      qStepEl.textContent = '완료';
      qNoteEl.textContent = '모든 퀘스트를 깼다. 더 나올 몬스터는 없다';
      return;
    }
    const g = group();
    qStepEl.textContent = '퀘스트 ' + (groupIndex + 1) + '/' + QUEST_GROUPS.length;
    qNoteEl.textContent = g.spawn
      ? g.note + ' · 남은 출현 ' + Math.max(0, g.spawn.max - groupSpawned) + '마리'
      : g.note;
    for (const row of qRows) {
      const now = itemProgress(row.it), goal = itemGoal(row.it);
      row.num.textContent = now + '/' + goal;
      row.fill.style.width = (100 * now / goal) + '%';
      row.li.classList.toggle('done', now >= goal);
    }
  }

  function startGroup(i) {
    groupIndex = i;
    groupTurns = 0;
    groupSpawned = 0;
    for (const k of Object.keys(groupKills)) delete groupKills[k];
    groupDirs.clear();
    allDone = i >= QUEST_GROUPS.length;
    questEl.classList.remove('done', 'all-done');
    buildQuestRows();
    renderQuest();
  }

  // 깬 순간을 잠깐 보여 주고 다음으로 넘긴다. 페이즈 안에서 기다리므로
  // 그동안 입력은 막혀 있다
  async function advanceQuest() {
    const mine = phaseId;
    questEl.classList.add('done');
    renderQuest();
    await sleep(QUEST_CLEAR_MS);
    if (phaseId !== mine) return;
    startGroup(groupIndex + 1);
  }

  // ── 위험 표시 ──────────────────────────────────────────────
  // 몬스터는 플레이어가 움직인 뒤에 행동하고, 그때 붙어 있으면 때리고 아니면 옮긴다.
  // 즉 "다음 턴에 맞는 칸" = 지금 몬스터가 바로 옆에 있는 칸이다.
  // 두 칸 떨어진 놈은 다가오는 데 행동을 다 쓰므로 그 턴에는 못 때린다
  // 그 칸으로 가면 얼마나 맞는지. 붙어 있는 놈들의 공격력을 다 더한다
  const threatDamage = (x, y) => monsters.reduce(
    (sum, m) => sum + (Math.abs(m.x - x) + Math.abs(m.y - y) === 1 ? damageTo(m, player) : 0), 0);
  const threatened = (x, y) => threatDamage(x, y) > 0;

  // 빈 칸에만 칠한다. 누가 서 있는 칸은 그림이 이미 자리를 차지하고 있다
  function renderDanger() {
    for (let y = MIN; y <= MAX; y++) {
      for (let x = MIN; x <= MAX; x++) {
        const dmg = occupied(x, y) ? 0 : threatDamage(x, y);
        const cell = cellAt[y * N + x];
        cell.classList.toggle('danger', dmg > 0);
        cell.querySelector('.hit-mark i').textContent = dmg > 0 ? dmg : '';
      }
    }
    // 플레이어가 선 칸은 비어 있지 않아 칠하지 않는다. 대신 토큰 위에 딱지를 얹어
    // "그대로 있으면 얼마나 맞는지" 를 알린다
    const here = threatDamage(player.x, player.y);
    player.el.classList.toggle('threatened', here > 0);
    player.el.querySelector('.hit-mark i').textContent = here > 0 ? here : '';
    player.el.style.setProperty('--mark', Math.round(innerCell * HIT_MARK_SCALE) + 'px');
  }

  // ── 페이즈 ─────────────────────────────────────────────────
  // 민첩이 높은 쪽부터 행동한다. 같으면 생성된 순서대로.
  // 플레이어의 민첩이 제일 높으면 지금까지처럼 플레이어가 먼저다
  function actOrder() {
    return [player, ...monsters].sort((a, b) => b.agi - a.agi || a.seq - b.seq);
  }

  // 플레이어의 행동은 입력할 때 정해지지만, 실제로 나가는 것은 제 차례가 왔을 때다.
  // 그 사이에 더 빠른 몬스터가 칸을 채우거나 비울 수 있어서 다시 확인한다.
  //
  // 공격이 하나 끝날 때마다 ATTACK_GAP 만큼 쉰다. 이동은 안 쉰다 - 여러 마리가
  // 같이 걸어오는 것은 읽는 데 지장이 없고, 마리 수만큼 기다리면 한 판이 너무 길다.
  // 페이즈가 도는 동안 입력은 막는다. 안 막으면 연출 중에 다음 페이즈가 겹쳐 든다
  async function runPhase(playerAction) {
    busy = true;
    const mine = ++phaseId;
    try {
      for (const actor of actOrder()) {
        if (over || phaseId !== mine) return;
        let struck;
        if (actor === player) {
          struck = await playerAction();
        } else if (actor.hp > 0 && monsters.includes(actor)) {
          struck = await monsterAct(actor);
        }
        if (phaseId !== mine) return;
        if (struck) {
          await sleep(tuning.gap);
          if (phaseId !== mine) return;
        }
      }
      movesEl.textContent = ++moves;
      if (player.hp <= 0) over = true;

      if (!over) {
        groupTurns++;
        questSpawn();
        renderQuest();
        if (groupDone()) await advanceQuest();
      }
      updateStatus();
    } finally {
      if (phaseId === mine) busy = false;
    }
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const canStep = (dx, dy) => {
    const x = player.x + dx, y = player.y + dy;
    return isInner(x, y) && !occupied(x, y);
  };

  // 플레이어의 행동 1: 이동. 벽이거나 다른 물체가 있으면 페이즈가 시작도 안 한다
  function move(dx, dy) {
    if (busy || over || !canStep(dx, dy)) return;
    return runPhase(() => {
      // 더 빠른 몬스터가 먼저 그 칸에 들어왔으면 이동은 불발이다.
      // 페이즈는 이미 시작했으므로 행동만 날아간다
      if (!canStep(dx, dy)) return false;
      player.x += dx; player.y += dy;
      place(player.el, player.x, player.y);
      groupDirs.add(dx + ',' + dy);   // 방향 퀘스트는 이걸로 센다
      return false;               // 이동은 뜸 들일 것이 없다
    });
  }

  // 플레이어의 행동 2: 공격. 바로 옆 한 칸을 친다.
  // 빈 칸을 쳐도 행동을 쓴 것이므로 페이즈는 넘어간다. 규칙에 없어서 정했다.
  // '이동 못하면 공격' 으로 묶지 않고 입력을 따로 둔 것은, 나중에 궁수·마법사처럼
  // 떨어져서 치는 직업이 들어오면 이동 가능 여부와 공격이 무관해지기 때문이다
  function attack(dx, dy) {
    if (busy || over) return;
    return runPhase(async () => {
      const target = monsterAt(player.x + dx, player.y + dy);
      if (!target) {
        lunge(player.el, dx, dy);   // 헛치는 것도 보여 준다
        return false;
      }
      await strike(player, target, dx, dy);
      if (target.hp <= 0) {
        groupKills[target.kind] = (groupKills[target.kind] || 0) + 1;
        killMonster(target);
      }
      return true;
    });
  }

  const DIR_NAME = { '1,0': 'right', '-1,0': 'left', '0,1': 'down', '0,-1': 'up' };
  function lunge(el, dx, dy) {
    for (const n of ['up', 'down', 'left', 'right']) el.classList.remove('atk-' + n);
    void el.offsetWidth;
    el.classList.add('atk-' + DIR_NAME[dx + ',' + dy]);
    // 헛치는 것도 lunge 를 거치므로 소리는 여기 한 곳에만 두면 된다
    playSwing(el.classList.contains('player') ? 1 : 0.72);
  }

  // 쓰러지면 어떤 입력도 안 먹는다. 승패 규칙이 아직 없어서 멈춘 것인지
  // 고장인지 화면상 구분이 안 되므로 상태를 적어 준다.
  //
  // 갇힘 표시는 없앴다. 몬스터가 있는 칸은 이제 공격이 되므로, 내부 6*6 안에서는
  // 어느 칸에 서 있어도 이웃이 최소 둘이고 그 둘은 빈 칸(이동)이거나
  // 몬스터(공격)다. 즉 할 수 있는 것이 없는 상태가 생기지 않는다
  function updateStatus() {
    renderHp(player);
    renderDanger();
    playEl.classList.toggle('over', over);
    hintEl.textContent = over ? '쓰러졌다. 다시 를 눌러라' : HINT_DEFAULT;
  }

  // ── 입력 ───────────────────────────────────────────────────
  // 방향 하나만 받는다. 무엇을 할지는 그 칸에 무엇이 있느냐가 정한다.
  //   몬스터가 있으면 공격, 빈 칸이면 이동, 벽이면 아무 일도 없음
  const DIRS = {
    arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
  };

  function act(dx, dy) {
    const x = player.x + dx, y = player.y + dy;
    // 벽 너머라도 몬스터가 있으면 친다. 플레이어가 못 가는 것이지 못 치는 것이 아니다
    if (monsterAt(x, y)) return attack(dx, dy);
    if (isInner(x, y)) return move(dx, dy);
  }

  window.addEventListener('keydown', e => {
    const dir = DIRS[e.key.toLowerCase()];
    if (!dir) return;
    e.preventDefault();
    // 자동 반복은 무시한다. 한 번 누르면 한 번만 움직인다
    if (e.repeat || busy) return;
    act(dir[0], dir[1]);
  });

  // 스와이프는 판이 아니라 화면 전체에서 받는다
  let start = null;
  window.addEventListener('pointerdown', e => {
    // 상단 바 조작은 그대로 둔다. target 이 Element 가 아닐 수도 있어 closest 유무를 먼저 본다
    if (e.target && e.target.closest && e.target.closest('a,button')) return;
    if (busy) return;                     // 연출이 도는 중에는 안 받는다
    start = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointerup', e => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;

    const horizontal = Math.abs(dx) > Math.abs(dy);
    const reach = horizontal ? Math.abs(dx) : Math.abs(dy);
    if (reach < SWIPE_MOVE) return;

    if (horizontal) act(Math.sign(dx), 0);
    else act(0, Math.sign(dy));
  });
  window.addEventListener('pointercancel', () => { start = null; });

  // ── 시작 / 다시 ────────────────────────────────────────────
  function reset() {
    phaseId++;                  // 돌고 있던 페이즈는 여기서 손을 뗀다
    busy = false;
    for (const m of monsters) m.el.remove();
    for (const d of boardEl.querySelectorAll('.dmg')) d.remove();
    monsters.length = 0;
    nextSeq = 1;                // 0 은 플레이어 몫이다
    player.x = START.x; player.y = START.y;
    player.hp = player.maxHp;
    renderHp(player);
    over = false;
    moves = 0;
    movesEl.textContent = '0';
    countEl.textContent = '0';
    place(player.el, player.x, player.y);
    startGroup(allDone ? QUEST_GROUPS.length : groupIndex);   // 지금 묶음을 처음부터
    updateStatus();
  }

  const soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.setAttribute('aria-label', soundOn ? '소리 끄기' : '소리 켜기');
    if (soundOn) playSwing(1);          // 켠 것이 들리게 한 번 낸다
  });

  document.getElementById('reset').addEventListener('click', reset);
  window.addEventListener('resize', layout);

  buildBoard();
  layout();
  reset();

  // 판을 원하는 상태로 놓고 확인하기 위한 손잡이. 스폰이 랜덤이라
  // 이것이 없으면 "고블린이 다가오는가" 를 재현성 있게 볼 수가 없다
  window.__t = {
    monsters, player, place, addMonster, updateStatus, renderHp,
    isOver: () => over,
    attack, act, killMonster, actOrder, BEINGS, KNIGHT, damageTo, makeBeing,
    QUEST_GROUPS, startGroup, spawnMonster,
    quest: () => ({
      index: groupIndex, turns: groupTurns, spawned: groupSpawned,
      kills: { ...groupKills }, dirs: groupDirs.size, allDone,
      items: allDone ? [] : QUEST_GROUPS[groupIndex].items.map(it => ({
        title: it.title, progress: itemProgress(it), goal: itemGoal(it), done: itemDone(it),
      })),
      done: groupDone(),
    }),
    isBusy: () => busy,
    renderDanger, threatened, threatDamage,
    limitsExtra: { HIT_MARK_SCALE },
    isSoundOn: () => soundOn,
    // 연출을 기다리지 않고 검사하려면 간격을 0 으로 둔다
    setTiming: t => { if ('gap' in t) tuning.gap = t.gap; if ('hit' in t) tuning.hit = t.hit; },
    limits: {
      SWIPE_MOVE, TINY_TOKEN, HIT_DELAY, ATTACK_GAP, QUEST_CLEAR_MS,
      // 예전 이름들. 표에서 그대로 끌어 쓴다
      PLAYER_MAX_HP: BEINGS.player.maxHp, GOBLIN_MAX_HP: BEINGS.goblin.maxHp,
      PLAYER_ATK: BEINGS.player.atk, GOBLIN_ATK: BEINGS.goblin.atk,
      PLAYER_AGI: BEINGS.player.agi, GOBLIN_AGI: BEINGS.goblin.agi,
      RIDER_AGI: BEINGS.rider.agi,
    },
  };
})();
</script>
</body>
</html>
