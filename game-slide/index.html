  }

  // 한 축의 칸 크기와 시작 위치를 미리 구한다. 칸마다 크기가 달라
  // 더는 곱셈 한 번으로 자리를 낼 수 없다.
  //   전체 = (배율 합)*C + 간격*(N-1)
  //   배율 합 = 내부 5 + 외부 양쪽 1+1 = 7
  // 칸 크기는 남은 공간에 맞춰 정수 px 로 내림. 소수 px 이면 격자가 흔들린다
  function computeAxis(side, gap) {
    let units = 0;
    for (let i = 0; i < N; i++) units += cellScale(i);
    const C = Math.max(12, Math.floor((side - gap * (N - 1)) / units));

    const size = [], pos = [];
    let p = 0;
    for (let i = 0; i < N; i++) {
      // 제일 바깥 칸은 C 의 0.2 배라 작은 판에서는 1px 밑으로 내려간다. 3px 로 받친다
      size.push(Math.max(3, Math.round(C * cellScale(i))));
      pos.push(p);
      p += size[i] + gap;
    }
    return { size, pos, total: p - gap };
  }

  // 게임(1:1) 과 정보(7:9 / 9:7) 를 붙이면 16:9 다. 세로면 9:16 이고 위아래가 된다.
  //   가로: 게임 9u x 9u + 정보 7u x 9u = 16u x 9u
  //   세로: 정보 9u x 7u 위, 게임 9u x 9u 아래 = 9u x 16u
  // 그 상자를 화면 안에 최대로 넣는 u 를 구하고, 나머지는 다 그 배수다
  const SPLIT_MIN = 120;        // 이보다 작아지면 아무것도 안 읽힌다
  const CONTROL_SLOTS = 7;      // 조작영역에 들어가는 블럭 수
  function layoutSplit() {
    const W = splitEl.clientWidth, H = splitEl.clientHeight;
    if (!W || !H) return;
    // 가로/세로는 화면비로 가른다. 정사각이면 가로로 친다
    const wide = W >= H;
    splitEl.classList.toggle('wide', wide);

    // 긴 쪽을 16, 짧은 쪽을 9 로 맞춘다. 둘 중 먼저 막히는 쪽이 크기를 정한다
    const side = Math.max(SPLIT_MIN, Math.floor(
      wide ? Math.min(H, W * 9 / 16) : Math.min(W, H * 9 / 16)));
    const unit = side / 9;

    stageEl.style.width = side + 'px';
    stageEl.style.height = side + 'px';

    // 조작영역은 블럭 일곱 개 길이에 블럭 하나 두께다. 블럭 = 게임영역의 1/7
    const ct = side / CONTROL_SLOTS;
    // 정보영역은 남는 자리를 다 쓴다. 16/9 에서 게임(1)과 조작(1/7)을 뺀 만큼
    const ir = 16 / 9 - 1 - 1 / CONTROL_SLOTS;

    const iw = wide ? side * ir : side;
    const ih = wide ? side : side * ir;
    infoEl.style.width = Math.round(iw) + 'px';
    infoEl.style.height = Math.round(ih) + 'px';
    ctrlEl.style.width = Math.round(wide ? ct : side) + 'px';
    ctrlEl.style.height = Math.round(wide ? side : ct) + 'px';

    const g = Math.max(3, Math.round(unit * 0.16));
    // 카드는 칸을 그대로 채운다. 정해진 비율을 지키던 것은 그만뒀다 —
    // 조작영역이 자리를 가져가면서 정보영역이 7:9 가 아니게 됐고,
    // 옛 비율(3.5:3)을 그대로 두면 카드가 칸 안에서 겉돌기만 한다
    const cols = wide ? 2 : 3, rows = wide ? 3 : 2;
    const cellW = (iw - g * 2 - g * (cols - 1)) / cols;
    const cellH = (ih - g * 2 - g * (rows - 1)) / rows;

    infoEl.style.setProperty('--gap', g + 'px');
    infoEl.style.setProperty('--cw', Math.max(20, Math.floor(cellW)) + 'px');
    infoEl.style.setProperty('--ch', Math.max(20, Math.floor(cellH)) + 'px');
    infoEl.style.setProperty('--u', unit + 'px');

    // 자리는 정사각이다. 두께에서 여백을 뺀 것이 한 변이 된다
    ctrlEl.style.setProperty('--gap', g + 'px');
    ctrlEl.style.setProperty('--sw', Math.max(10, Math.floor(ct - g * 2)) + 'px');
  }

  function layout() {
    layoutSplit();
    const w = stageEl.clientWidth - 24;
    const h = stageEl.clientHeight - 24;
    const side = Math.max(140, Math.min(w, h));
    gapPx = side < 340 ? 1 : 2;
    axis = computeAxis(side, gapPx);
    innerCell = axis.size[MIN];

    boardEl.style.width = axis.total + 'px';
    boardEl.style.height = axis.total + 'px';

    // 세로줄과 가로줄을 따로 본다. 왼쪽 띠의 안쪽 행은 좁고 길쭉한 칸이 된다
    for (const c of boardEl.querySelectorAll('.cell')) {
      const x = +c.dataset.x, y = +c.dataset.y;
      c.style.width = axis.size[x] + 'px';
      c.style.height = axis.size[y] + 'px';
      c.style.left = axis.pos[x] + 'px';
      c.style.top = axis.pos[y] + 'px';
      if (c.classList.contains('inner')) {
        c.style.fontSize = Math.round(axis.size[x] * HIT_MARK_SCALE) + 'px';
      }
    }

    const span = axis.pos[MAX] + axis.size[MAX] - axis.pos[MIN];
    fenceEl.style.left = (axis.pos[MIN] - gapPx / 2 - 2) + 'px';
    fenceEl.style.top = (axis.pos[MIN] - gapPx / 2 - 2) + 'px';
    fenceEl.style.width = (span + 4) + 'px';
    fenceEl.style.height = (span + 4) + 'px';

    place(player.el, player.x, player.y);
    for (const m of monsters) place(m.el, m.x, m.y);
    for (const p of props) place(p.el, p.x, p.y);
    renderDanger();   // 딱지 글자 크기가 칸을 따라가야 해서 여기서도 부른다
  }

  // 자리와 크기를 같이 잡는다. 띠를 넘나들면 칸 크기가 바뀌므로 둘을 떼면 안 된다.
  // 토큰은 늘 정사각형이다. 옆 띠의 칸은 좁고 길쭉해서, 칸을 꽉 채우면
  // 고블린이 길쭉한 알약 바닥에 처박힌 꼴이 된다. 짧은 변에 맞춰 칸 가운데 둔다.
  // 가운데로 미는 것은 left/top 으로 한다. transform 은 칸의 원점을 그대로 가리켜야
  // 자리 계산이 한 군데로 모인다
  function place(el, x, y) {
    const w = axis.size[x], h = axis.size[y];
    const s = Math.min(w, h);
    el.style.width = s + 'px';
    el.style.height = s + 'px';
    el.style.left = ((w - s) / 2) + 'px';
    el.style.top = ((h - s) / 2) + 'px';
    el.style.fontSize = Math.max(7, Math.floor(s * 0.55)) + 'px';
    el.classList.toggle('tiny', s < TINY_TOKEN);   // 외부 띠에서는 숫자가 안 읽힌다
    el.style.transform = 'translate(' + axis.pos[x] + 'px,' + axis.pos[y] + 'px)';
  }

  // ── 칸 차지 ────────────────────────────────────────────────
  const onBoard = (x, y) => x >= 0 && x < N && y >= 0 && y < N;
  const monsterAt = (x, y) => monsters.find(m => m.x === x && m.y === y) || null;
  const propAt = (x, y) => props.find(p => p.x === x && p.y === y) || null;
  // 플레이어·몬스터·기물이 물체다. 셋 다 남의 칸으로는 못 들어간다.
  // 이동을 막는 자리는 여기 하나뿐이라, 기물을 여기 넣으면 플레이어도 고블린도
  // 라이더도 한꺼번에 막힌다
  const occupied = (x, y) =>
    (player.x === x && player.y === y) || !!monsterAt(x, y) || !!propAt(x, y);

  // ── 전투 ───────────────────────────────────────────────────
  const adjacent4 = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1;

  // 때리는 쪽이 뻗고 → 잠깐 뒤에 맞는 쪽이 반응한다. 둘이 동시에 일어나면
  // 누가 누구를 쳤는지 안 읽힌다
  async function strike(attacker, target, dx, dy) {
    const mine = phaseId;
    lunge(attacker.el, dx, dy);
    await sleep(tuning.hit);
    // 기다리는 사이에 `다시` 를 눌렀으면 새 판을 때리게 된다
    if (phaseId !== mine || over) return;
    damage(target, damageTo(attacker));
  }

  function damage(target, amount) {
    target.hp = Math.max(0, target.hp - amount);
    renderHp(target);
    floatDamage(target, amount);
    // transform 은 자리 잡는 데 쓰고 있어서 흔들 수가 없다. class 를 다시 붙여 재생한다
    target.el.classList.remove('hit');
    void target.el.offsetWidth;
    target.el.classList.add('hit');
  }

  // 입은 피해를 머리 위에 띄운다. 칸 크기를 따라가되 너무 작아지지는 않게 한다.
  // 토큰이 아니라 판에 붙여야 다른 토큰 위로 올라온다
  function floatDamage(ent, amount) {
    const el = document.createElement('span');
    el.className = 'dmg ' + (ent === player ? 'on-player' : 'on-monster');
    el.textContent = '-' + amount;
    el.style.fontSize = Math.max(11, Math.round(innerCell * 0.34)) + 'px';
    el.style.left = (axis.pos[ent.x] + axis.size[ent.x] / 2) + 'px';
    // 칸 위끝이 아니라 조금 아래에서 시작한다. 그래야 제일 진할 때가
    // 제 칸 안(머리 언저리)에 오고, 위 칸 체력바 위에서 읽히지 않는다
    el.style.top = (axis.pos[ent.y] + axis.size[ent.y] * 0.3) + 'px';
    boardEl.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // ── 등장 대사 ──────────────────────────────────────────────
  // 뒤의 숫자가 가중치다. 3 이면 1 짜리보다 세 배 자주 나온다
  function pickLine(lines) {
    let total = 0;
    for (const l of lines) total += l[1] || 1;
    let r = Math.random() * total;
    for (const l of lines) {
      r -= l[1] || 1;
      if (r < 0) return l[0];
    }
    return lines[lines.length - 1][0];
  }

  function sayLine(m) {
    const lines = BEINGS[m.kind].lines;
    if (!lines || !lines.length) return;      // 대사가 없는 몬스터는 아무 말도 안 한다
    const el = document.createElement('span');
    el.className = 'say';
    el.textContent = pickLine(lines);
    el.style.fontSize = Math.max(10, Math.round(innerCell * 0.24)) + 'px';
    el.style.left = (axis.pos[m.x] + axis.size[m.x] / 2) + 'px';
    el.style.top = axis.pos[m.y] + 'px';
    boardEl.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }

  // 몬스터를 옮기는 길은 여기 하나다. 바깥에서 안으로 처음 들어서는 순간 한마디 한다.
  // 한 놈이 한 번뿐이다 — 밀려 나갔다 다시 들어와도 또 하지 않는다
  function moveMonster(m, x, y) {
    const wasOut = !isInner(m.x, m.y);
    m.x = x; m.y = y;
    place(m.el, x, y);
    if (wasOut && isInner(x, y) && !m.said) {
      m.said = true;
      sayLine(m);
    }
  }

  // ── 몬스터 ─────────────────────────────────────────────────
  function outerCells() {
    const out = [];
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (!isInner(x, y)) out.push({ x, y });
      }
    }
    return out;
  }

  // 가장 바깥 한 줄(테두리 40칸). 보통 몬스터는 다 여기서 나온다 —
  // 판 밖에서 걸어 들어온 것으로 보여야지, 안쪽 코앞에서 솟으면 안 된다
  const isRim = (x, y) => x === 0 || y === 0 || x === N - 1 || y === N - 1;

  function rimCells() {
    const out = [];
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (isRim(x, y)) out.push({ x, y });
      }
    }
    return out;
  }

  function addMonster(x, y, kind = 'goblin') {
    const spec = BEINGS[kind];
    const el = document.createElement('div');
    el.className = 'token monster ' + kind;
    el.innerHTML = tokenInner(spec.img, spec.name);
    boardEl.appendChild(el);
    place(el, x, y);

    const m = makeBeing(kind, x, y, monsterMul());
    m.el = el;
    monsters.push(m);
    renderHp(m);
    countEl.textContent = monsters.length;
    return m;
  }

  function spawnMonster(kind) {
    const spec = BEINGS[kind];
    // 특수한 몬스터만 외부 아무 칸에서나 나온다 (`spawnAnywhere`).
    // 나머지는 다 가장 바깥 줄이다. 아직 그런 몬스터는 없고 자리만 열어 뒀다
    const cells = spec && spec.spawnAnywhere ? outerCells() : rimCells();
    const free = cells.filter(c => !occupied(c.x, c.y));
    if (!free.length) return false;               // 나올 자리가 없다. 안 나온다
    const spot = free[Math.floor(Math.random() * free.length)];
    addMonster(spot.x, spot.y, kind);
    return true;
  }

  // 퀘스트가 정한 대로만 내보낸다. 퀘스트에 spawn 이 없으면 아무것도 안 나온다
  const stage = () => (stageIndex < 0 ? null : STAGES[stageIndex]);
  const questGroups = () => {
    const st = stage();
    return st && st.quests ? st.quests : [];
  };

  // 무한의 아레나의 단계. 10턴마다 하나씩 오른다
  function endlessStep() {
    const st = stage();
    if (!st || !st.endless) return 0;
    return Math.floor(stageTurns / st.endless.step);
  }

  // 새로 나오는 몬스터의 스텟 배수. 판에 이미 있는 놈은 안 건드린다.
  // 곱으로 쌓는다: 10턴 1.1배, 20턴 1.21배, 30턴 1.331배
  function monsterMul() {
    const st = stage();
    if (!st || !st.endless) return 1;
    return Math.pow(1 + st.endless.scale, endlessStep());
  }

  // 지금 단계의 생성 주기. 단계마다 0.9 를 곱하고 반올림한다. 하한은 1턴
  function spawnEvery(rule) {
    const st = stage();
    return Math.max(1, Math.round(rule.every * Math.pow(st.endless.rate, endlessStep())));
  }

  // 버티기 스테이지의 출현. 총 마릿수 제한이 없다
  function endlessSpawn() {
    const st = stage();
    if (!st || !st.endless) return;
    for (const rule of st.endless.spawns) {
      if (stageTurns < rule.from) continue;
      if ((stageTurns - rule.from) % spawnEvery(rule) !== 0) continue;
      spawnMonster(rule.kind);
    }
  }

  function questSpawn() {
    const g = group();
    if (!g || !g.spawn || !g.spawn.every) return;   // 한꺼번에(`burst`) 는 묶음이 뜰 때 이미 냈다
    if (groupSpawned >= g.spawn.max) return;
    if (groupTurns % g.spawn.every !== 0) return;
    if (spawnMonster(g.spawn.kind)) groupSpawned++;
  }

  // 고블린: 매 턴 플레이어를 향해 상하좌우 한 칸.
  // 차이가 큰 축을 먼저 시도하고, 막혔으면 다른 축으로. 둘 다 막혔으면 그 자리에 선다.
  // 가로세로 차이가 같으면 가로를 먼저 본다 (규칙에 없어서 정한 것)
  // 실제로 한 칸 옮겼으면 true. 막혀서 제자리면 false.
  // 부르는 쪽이 "걸음이 났는지" 를 알아야 그만큼 뜸을 들일 수 있다
  // ── 길찾기 ─────────────────────────────────────────────────
  // 벽(기물)과 다른 몬스터를 돌아 플레이어 옆까지 가는 길을 찾는다.
  // 예전에는 "차이가 큰 축부터 한 칸" 이라 블로커 뒤에서 영영 제자리걸음이었다.
  // 판이 11*11(121칸)이라 매 턴 다시 풀어도 싸다
  const ORTHO = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const nodeId = (x, y) => y * N + x;

  // 설 수 있는 칸인가. 자기 자리는 늘 설 수 있다(거기 서 있으니까)
  function walkable(m, x, y) {
    if (!onBoard(x, y)) return false;
    if (x === m.x && y === m.y) return true;
    if (propAt(x, y)) return false;
    if (player.x === x && player.y === y) return false;   // 플레이어 칸은 못 밟는다
    return !monsterAt(x, y);
  }

  // 목표는 "플레이어와 붙은 칸" 이다. 거기 서면 다음 턴에 때린다
  const isBeside = (x, y) => Math.abs(x - player.x) + Math.abs(y - player.y) === 1;

  // A*. `steps` 는 그 자리에서 갈 수 있는 방향들, `h` 는 남은 거리 어림값이다.
  // 어림값은 실제보다 크면 안 된다(그래야 최단이 나온다).
  //   상하좌우: 맨해튼 거리 그대로
  //   나이트  : 한 수에 맨해튼이 최대 3 이라 거리/3
  // 첫 한 칸만 돌려준다. 다음 턴에는 판이 달라져 있으므로 길 전체는 쓸모없다
  function findStep(m, steps, h) {
    const start = nodeId(m.x, m.y);
    const gScore = new Map([[start, 0]]);
    const fScore = new Map([[start, h(m.x, m.y)]]);
    const came = new Map();
    const open = new Set([start]);

    // 플레이어에 못 닿을 때를 대비해, 닿을 수 있는 칸 중 제일 가까운 곳을 적어 둔다.
    // 가까움은 실제 거리(맨해튼)로 잰다. 같으면 덜 걸어도 되는 쪽
    let near = -1, nearDist = Infinity, nearSteps = Infinity;
    const consider = (x, y, id, g) => {
      const d = manhattan(x, y);
      if (d < nearDist || (d === nearDist && g < nearSteps)) {
        near = id; nearDist = d; nearSteps = g;
      }
    };

    // 목표 칸에서 첫 한 칸까지 거슬러 올라간다
    const firstStep = goal => {
      let node = goal;
      while (came.get(node) !== start) {
        node = came.get(node);
        if (node === undefined) return null;   // 시작 자리가 이미 목표였다
      }
      const nx = node % N, ny = (node - nx) / N;
      return { x: nx, y: ny };
    };

    while (open.size) {
      // 판이 작아서 그냥 훑는다. 힙을 쓸 만큼 크지 않다.
      // 값이 같으면 먼저 넣은 것을 고른다 — 그래야 같은 판에서 늘 같은 길이 나온다
      let cur = -1, best = Infinity;
      for (const n of open) {
        const v = fScore.get(n);
        if (v < best) { best = v; cur = n; }
      }
      const cx = cur % N, cy = (cur - cx) / N;

      if (isBeside(cx, cy)) return firstStep(cur);

      open.delete(cur);
      for (const [dx, dy] of steps) {
        const nx = cx + dx, ny = cy + dy;
        if (!walkable(m, nx, ny)) continue;
        const id = nodeId(nx, ny);
        const ng = gScore.get(cur) + 1;
        if (ng >= (gScore.has(id) ? gScore.get(id) : Infinity)) continue;
        came.set(id, cur);
        gScore.set(id, ng);
        fScore.set(id, ng + h(nx, ny));
        open.add(id);
        consider(nx, ny, id, ng);
      }
    }

    // 플레이어가 고립되어 못 닿는다. 갈 수 있는 칸 중 제일 가까운 곳으로 간다.
    // 가만히 서 있는 것보다 낫다 — 길이 열리는 순간 바로 붙는다
    if (near < 0) return null;                 // 갈 수 있는 칸이 하나도 없다
    if (nearDist >= manhattan(m.x, m.y)) return null;   // 지금 자리보다 나은 곳이 없다
    return firstStep(near);
  }

  const manhattan = (x, y) => Math.abs(x - player.x) + Math.abs(y - player.y);

  // 길을 찾아 한 칸 간다. 못 찾으면 부르는 쪽의 옛 방식으로 넘긴다
  function stepPath(m, steps, h) {
    const next = findStep(m, steps, h);
    if (!next) return false;
    moveMonster(m, next.x, next.y);
    return true;
  }

  // 최단이 여럿일 때 어느 것을 고를지. 훑는 순서가 곧 그 답이다
  // (`findStep` 은 값이 같으면 먼저 넣은 것을 쓴다).
  //   ① 남은 간격이 큰 축부터 — 붙으려면 어차피 그 축을 더 많이 걸어야 한다
  //   ② 간격이 같으면 플레이어가 방금 안 쓴 축부터
  // ②가 없으면 플레이어가 좌우로 왔다갔다 할 때 몬스터도 같이 왔다갔다 한다.
  // 그 축은 두 턴마다 제자리로 돌아오므로 두 턴이 통째로 버려지고,
  // 아무도 안 건드리는 세로 간격은 영영 안 줄어든다
  function stepOrder(m) {
    const dx = player.x - m.x, dy = player.y - m.y;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const horizFirst = adx !== ady ? adx > ady : lastAxis !== 'h';
    // 같은 축 안에서는 플레이어 쪽을 먼저 본다
    const h = dx >= 0 ? [[1, 0], [-1, 0]] : [[-1, 0], [1, 0]];
    const v = dy >= 0 ? [[0, 1], [0, -1]] : [[0, -1], [0, 1]];
    return horizFirst ? h.concat(v) : v.concat(h);
  }

  // 갈 수 있으면 가고, 못 가면 그 자리에 선다.
  // 예전의 "차이가 큰 축부터 한 칸" 방식은 없앴다. 길찾기가 못 닿을 때의
  // 자리까지 정해 주므로 할 일이 없고, 두면 제자리에서 왔다갔다 하게 만든다
  function stepToward(m) {
    return stepPath(m, stepOrder(m), manhattan);
  }

  const KNIGHT = [
    [1, -2], [2, -1], [2, 1], [1, 2],
    [-1, 2], [-2, 1], [-2, -1], [-1, -2],
  ];

  function stepKnight(m) {
    return stepPath(m, KNIGHT, (x, y) => Math.ceil(manhattan(x, y) / 3));
  }

  // ── 돌진 ───────────────────────────────────────────────────
  // 자세를 잡은 놈이 다음 턴에 지나갈 길. 막히는 곳 앞에서 멈춘다.
  // **플레이어는 막는 것으로 안 친다** — 거기 서 있으면 그 자리가 맞는 자리다.
  // 그래서 이 길이 곧 위험 표시가 될 칸들이다
  function chargePath(m) {
    const out = [];
    if (!m.aim) return out;
    const [dx, dy] = m.aim;
    let x = m.x + dx, y = m.y + dy;
    // 안쪽 필드 끝까지다. 한 번 안으로 들어왔으면 다시 바깥 띠로는 안 나간다.
    // 바깥에서 시작한 놈이 안으로 들어오는 길은 열어 둬야 하므로 "들어온 뒤" 로 잰다
    let inside = isInner(m.x, m.y);
    while (onBoard(x, y) && !propAt(x, y) && !monsterAt(x, y)) {
      const here = isInner(x, y);
      if (inside && !here) break;
      inside = inside || here;
      out.push({ x, y });
      x += dx; y += dy;
    }
    return out;
  }

  const onPath = (m, x, y) => chargePath(m).some(c => c.x === x && c.y === y);

  // 자세를 잡을 방향. 가로나 세로로 줄이 맞고, 붙어 있지 않고,
  // 사이에 막는 것이 없어야 한다. 못 닿을 길에 자세를 잡으면 한 턴을 버린다
  // (규칙에는 "떨어진 지점에 있다면" 까지만 있다. 막힌 길은 빼기로 정했다)
  function aimDir(m) {
    if (m.x !== player.x && m.y !== player.y) return null;
    const dx = Math.sign(player.x - m.x), dy = Math.sign(player.y - m.y);
    if (Math.abs(player.x - m.x) + Math.abs(player.y - m.y) < 2) return null;
    const probe = { x: m.x, y: m.y, aim: [dx, dy] };
    return onPath(probe, player.x, player.y) ? [dx, dy] : null;
  }

  function setAim(m, dir) {
    m.aim = dir;
    m.el.classList.add('aim');
  }

  function clearAim(m) {
    m.aim = null;
    m.el.classList.remove('aim');
  }

  // 자세를 잡았으면 다음 턴은 무조건 내달린다. 고를 것이 없다.
  // 가다가 플레이어를 만나면 거기서 멈추고 공격력만큼 준다
  async function chargeRun(m) {
    const mine = phaseId;
    const dir = m.aim;
    const lane = chargePath(m);
    clearAim(m);

    const stop = lane.findIndex(c => c.x === player.x && c.y === player.y);
    const run = stop < 0 ? lane : lane.slice(0, stop);
    if (run.length) {
      // 한 칸씩 밟아 지나간다. 끝 칸으로 한 번에 옮기면 순간이동으로 보인다
      const per = tuning.move
        ? Math.max(DASH_STEP_MIN, Math.round(tuning.move / run.length)) : 0;
      m.el.classList.add('dash');
      m.el.style.setProperty('--dash', per + 'ms');
      for (const c of run) {
        moveMonster(m, c.x, c.y);
        if (per) await sleep(per);
        if (phaseId !== mine) return null;
      }
      m.el.classList.remove('dash');
      m.el.style.removeProperty('--dash');
    }
    if (stop < 0) return run.length ? 'move' : null;
    await strike(m, player, dir[0], dir[1]);
    return 'attack';
  }

  // 몬스터의 한 턴. 이동과 공격은 따로 도는 페이즈가 아니라 둘 중 하나만 고른다.
  // 붙어 있으면 때리고, 아니면 다가간다. 다가가서 붙은 턴에는 때리지 않는다
  // 무엇을 했는지 돌려준다: 'attack' | 'move' | null.
  // 부른 쪽이 그에 맞는 만큼 뜸을 들인다. 아무것도 못 했으면 기다릴 것도 없다
  async function monsterAct(m) {
    const spec = BEINGS[m.kind];
    if (m.aim) return chargeRun(m);           // 자세를 잡았으면 다른 것은 못 한다
    if (adjacent4(m, player)) {
      await strike(m, player, Math.sign(player.x - m.x), Math.sign(player.y - m.y));
      return 'attack';
    }
    if (spec.charge) {
      const dir = aimDir(m);
      if (dir) { setAim(m, dir); return 'aim'; }
    }
    return spec.step(m) ? 'move' : null;
  }

  // 잡았을 때 딸려 오는 것들. 때려서든 밀어내서든 같다
  // 1 당 구슬 하나. 열 개가 모이면 큰 구슬 하나로 바꾼다.
  // 큰 것을 앞에 두어 먼저 날아가게 한다
  function orbSplit(n) {
    const out = [];
    for (let i = 0; i < Math.floor(n / ORB_BIG); i++) out.push(ORB_BIG);
    for (let i = 0; i < n % ORB_BIG; i++) out.push(1);
    return out;
  }

  const cellCenter = (x, y) => ({
    cx: axis.pos[x] + axis.size[x] / 2,
    cy: axis.pos[y] + axis.size[y] / 2,
  });

  // 이번 페이즈에 돌고 있는 전리품 연출. 행동이 끝나면 여기 것들을 다 기다린다
  let dropShow = [];
  const drainDrops = () => Promise.all(dropShow.splice(0));

  // 떨어지는 것들. 나는 길은 같고 그림과 받는 곳만 다르다.
  // 새 전리품이 생기면 여기 한 줄이다
  const DROPS = {
    exp:  { cls: '',      take: n => addXp(n) },
    coin: { cls: ' coin', take: n => addCoin(n) },
  };

  // 죽은 자리에서 사방으로 튀고, 잠시 뒤 플레이어에게 빨려 든다.
  // 하나가 닿을 때마다 그만큼 오른다. 그래서 바가 끊어서 차오른다
  async function spawnDrop(x, y, amount, kind) {
    const drop = DROPS[kind];
    if (!tuning.orb || amount <= 0) { await drop.take(amount); return; }

    const mine = phaseId;
    const spin = Math.random() * Math.PI * 2;
    const vals = orbSplit(amount);
    const from = cellCenter(x, y);
    const unit = Math.max(5, Math.round(innerCell * 0.17));

    const orbs = vals.map((v, i) => {
      const el = document.createElement('i');
      const size = v > 1 ? Math.round(unit * 1.8) : unit;
      el.className = 'orb' + (v > 1 ? ' big' : '') + drop.cls;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.left = (from.cx - size / 2) + 'px';
      el.style.top = (from.cy - size / 2) + 'px';
      el.style.setProperty('--orb', tuning.orb + 'ms');
      boardEl.appendChild(el);
      // 사방으로. 고르게 벌린 뒤 조금만 흔든다. 다 같은 각이면 줄 세운 것처럼 보인다.
      // 시작 각을 무리마다 굴린다. 경험치와 코인이 한 자리에서 같이 튀는데
      // 둘 다 0 에서 시작하면 두 줄이 포개져 하나처럼 보인다
      const a = spin + (i / vals.length) * Math.PI * 2 + Math.random() * 0.7;
      const r = innerCell * (0.45 + Math.random() * 0.35);
      return { el, v, dx: Math.cos(a) * r, dy: Math.sin(a) * r };
    });

    // 한 프레임 뒤에 밀어야 전환이 걸린다. 같은 프레임에 넣으면 순간이동한다.
    // `requestAnimationFrame` 은 안 쓴다 — 탭이 뒤에 있으면 안 돌아서
    // 페이즈가 통째로 멈춘 채 영영 안 끝난다 (경험치 바에서도 같은 이유로 뺐다)
    await nextFrame();
    if (phaseId !== mine) { orbs.forEach(o => o.el.remove()); return; }
    for (const o of orbs) o.el.style.transform = 'translate(' + o.dx + 'px,' + o.dy + 'px)';
    await sleep(tuning.orb);
    if (phaseId !== mine) { orbs.forEach(o => o.el.remove()); return; }

    // 빨려 드는 곳은 지금의 플레이어 자리다. 흩어지는 사이에 밀고 갔을 수도 있다
    const to = cellCenter(player.x, player.y);
    // 조금씩 늦게 출발시켜 하나씩 닿게 한다. 다 같이 닿으면 바가 한 번에 튄다
    const step = Math.min(30, 150 / orbs.length);
    orbs.forEach((o, i) => {
      o.el.style.transitionDelay = Math.round(i * step) + 'ms';
      o.el.style.transform =
        'translate(' + (to.cx - from.cx) + 'px,' + (to.cy - from.cy) + 'px) scale(.45)';
    });
    for (let i = 0; i < orbs.length; i++) {
      await sleep(i === 0 ? tuning.orb : step);
      if (phaseId !== mine) { orbs.slice(i).forEach(o => o.el.remove()); return; }
      orbs[i].el.remove();
      await drop.take(orbs[i].v);   // 닿는 그 순간에 오른다. 레벨업 연출도 여기서 끝난다
    }
  }

  function defeat(m) {
    groupKills[m.kind] = (groupKills[m.kind] || 0) + 1;
    killMonster(m);
    // 전리품은 닿을 때 들어온다. 연출이 없으면 그 자리에서 들어온다.
    // 증가율은 경험치에만 먹인다. 코인을 올려 주는 카드는 아직 없다
    const ps = [
      spawnDrop(m.x, m.y, expGain(m.exp), 'exp'),
      spawnDrop(m.x, m.y, m.coin, 'coin'),
    ];
    dropShow.push(...ps);
    return Promise.all(ps);
  }

  // 공격 방향으로 붙어 있는 적을 한 칸씩 밀어낸다. 판 밖으로 나가면 죽는다.
  // 사이가 뜨면 거기서 끊긴다. 미는 힘이 앞 놈을 타고 전해지는 것이라,
  // 빈 칸을 건너뛰고 저 뒤의 놈까지 밀 수는 없다.
  // 기능형이라 쌓이지 않는다. 두 번 가질 일도 없다
  function pushLine(dx, dy) {
    if (!player.cards.has('push')) return false;
    const dist = 1;

    const line = [];
    for (let x = player.x + dx, y = player.y + dy; onBoard(x, y); x += dx, y += dy) {
      const m = monsterAt(x, y);
      if (!m) break;              // 빈 칸에서 끊긴다. 그 너머는 안 밀린다
      line.push(m);
    }
    if (!line.length) return false;
    // 줄 끝이 기물에 막혀 있으면 아무도 안 밀린다. 밀 자리가 없다.
    // 판 밖은 다르다. 밖으로 나가는 것은 죽는 것이라 막힌 것이 아니다
    const last = line[line.length - 1];
    if (propAt(last.x + dx, last.y + dy)) return false;

    // 먼 놈부터 옮긴다. 다 같은 방향으로 같은 칸만큼 가므로 서로 밟을 일은 없지만,
    // 먼 쪽을 먼저 비워 두는 편이 읽기 쉽다
    for (const m of line.reverse()) {
      const nx = m.x + dx * dist, ny = m.y + dy * dist;
      if (!onBoard(nx, ny)) { defeat(m); continue; }
      moveMonster(m, nx, ny);     // 옮기는 길은 하나다 (밀려 들어와도 한마디 한다)
    }
    return true;
  }

  function killMonster(m) {
    const i = monsters.indexOf(m);
    if (i < 0) return;
    monsters.splice(i, 1);
    m.el.remove();
    countEl.textContent = monsters.length;
    if (picked === m) renderInspect();   // 보던 놈이 죽었다. 플레이어로 돌아온다
  }

  // ── 퀘스트 진행 ────────────────────────────────────────────
  const group = () => (allDone ? null : questGroups()[groupIndex]);

  function itemProgress(it) {
    if (it.type === 'dir') return groupDirs.has(it.dir) ? 1 : 0;
    if (it.type === 'wait') return groupWaited ? 1 : 0;
    return Math.min(groupKills[it.kind] || 0, it.goal);
  }
  const itemDone = it => itemProgress(it) >= itemGoal(it);
  const groupDone = () => {
    const g = group();
    // `hold` 묶음은 깰 것이 없다. 저절로 넘어가면 안 되니 늘 안 깬 것으로 친다
    return !!g && !g.hold && g.items.every(itemDone);
  };

  // 묶음마다 항목 수가 다르다. 줄을 새로 만들고 나서 값만 갈아 끼운다
  function buildQuestRows() {
    qListEl.textContent = '';
    qRows.length = 0;
    const g = group();
    if (!g) return;
    for (const it of g.items) {
      const li = document.createElement('li');
      li.className = 'q-item';
      li.innerHTML =
        '<span class="q-check"></span>' +
        '<span class="q-name"></span>' +
        '<span class="q-num"></span>' +
        '<span class="q-track"><i></i></span>';
      li.querySelector('.q-name').textContent = it.title;
      if (itemGoal(it) === 1) li.classList.add('binary');
      qListEl.appendChild(li);
      qRows.push({ it, li, num: li.querySelector('.q-num'), fill: li.querySelector('.q-track i') });
    }
  }

  function renderQuest() {
    if (mode === 'select') {
      questEl.classList.remove('done', 'all-done');
      qStepEl.textContent = '지역';
      qNoteEl.textContent = STAGES
        .map(st => st.name + (st.locked ? '(잠김)' : ''))
        .join(' · ');
      return;
    }
    const st = stage();
    if (st && st.endless) {
      // 깰 것이 없는 스테이지다. 대신 얼마나 버텼고 지금 얼마나 센지를 적는다
      questEl.classList.remove('done', 'all-done');
      qStepEl.textContent = st.name;
      const mul = monsterMul();
      qNoteEl.textContent =
        '버틴 턴 ' + stageTurns
        + ' · 공체 x' + (Math.round(mul * 100) / 100)
        + ' · ' + st.endless.spawns
          .map(r => BEINGS[r.kind].name + ' ' + (stageTurns < r.from ? r.from + '턴부터' : spawnEvery(r) + '턴'))
          .join(' · ');
      return;
    }
    if (allDone) {
      questEl.classList.add('all-done');
      questEl.classList.remove('done');
      qStepEl.textContent = '완료';
      qNoteEl.textContent = '모든 퀘스트를 깼다. 더 나올 몬스터는 없다';
      return;
    }
    const g = group();
    qStepEl.textContent = g.hold ? '완료' : '퀘스트 ' + (groupIndex + 1) + '/' + questGroups().length;
    questEl.classList.toggle('all-done', !!g.hold);
    // 남은 마릿수는 턴마다 나오는 묶음에서만 뜻이 있다. 한꺼번에 낸 묶음은 남은 것이 없다
    qNoteEl.textContent = g.spawn && g.spawn.every
      ? g.note + ' · 남은 출현 ' + Math.max(0, g.spawn.max - groupSpawned) + '마리'
      : g.note;
    for (const row of qRows) {
      const now = itemProgress(row.it), goal = itemGoal(row.it);
      row.num.textContent = now + '/' + goal;
      row.fill.style.width = (100 * now / goal) + '%';
      row.li.classList.toggle('done', now >= goal);
    }
  }

  function startGroup(i) {
    groupIndex = i;
    groupTurns = 0;
    groupSpawned = 0;
    for (const k of Object.keys(groupKills)) delete groupKills[k];
    groupDirs.clear();
    groupWaited = false;
    allDone = i >= questGroups().length;
    questEl.classList.remove('done', 'all-done');
    const g = group();
    // 한꺼번에 나오는 묶음은 뜨는 그 자리에서 다 낸다. 턴을 기다리지 않는다
    if (g && g.spawn && g.spawn.burst) {
      for (let k = 0; k < g.spawn.burst; k++) if (spawnMonster(g.spawn.kind)) groupSpawned++;
    }
    buildQuestRows();
    renderQuest();
    // 새로 눌러야 할 단추가 있으면 누를 때까지 붙잡는다
    endFocus();
    if (g && g.blink) startFocus(document.getElementById(g.blink));
  }

  // 깬 순간을 잠깐 보여 주고 다음으로 넘긴다. 페이즈 안에서 기다리므로
  // 그동안 입력은 막혀 있다
  async function advanceQuest() {
    const mine = phaseId;
    questEl.classList.add('done');
    renderQuest();
    await sleep(QUEST_CLEAR_MS);
    if (phaseId !== mine) return;
    startGroup(groupIndex + 1);
    if (allDone) showEnd('clear');
  }

  // ── 경험치 ─────────────────────────────────────────────────
  // 남는 경험치는 다음 레벨로 넘긴다. 한 번에 여러 레벨이 오를 수도 있다
  // 증가율을 먹인 실제 경험치. 반올림이다. 15 * 1.1 = 16.5 → 17
  const expGain = amount => Math.round(amount * (1 + player.expBonus / 100));

  // 구슬 하나가 닿을 때마다 이만큼씩 오른다. 증가율은 이미 먹은 뒤다
  // 경험치 바는 뒤로 안 간다. 레벨이 오르면
  //   ① 끝까지 차오르고 → ② 알림이 뜨고 → ③ 연출 없이 0 으로 되감고 → ④ 다시 찬다.
  // 그냥 새 값을 넣으면 90% 에서 12% 로 거꾸로 줄어드는 것이 보인다.
  // 여러 레벨이 한꺼번에 오르면 그 횟수만큼 되풀이한다
  async function addXp(n) {
    const mine = phaseId;
    player.xp += n;

    while (player.xp >= expNeeded(player.level)) {
      player.xp -= expNeeded(player.level);

      // ① 끝까지 (남은 만큼만 더 차면 되므로 짧다)
      expFillEl.style.width = '100%';
      if (tuning.exp) await sleep(tuning.exp);
      if (phaseId !== mine) return;

      player.level++;
      levelEl.textContent = player.level;

      // ② 가득 찬 채로 알린다
      await announceLevelUp();
      if (phaseId !== mine) return;

      // ③ 되감기는 눈에 안 보이게. 전환을 껐다가 자리를 잡고 다시 켠다.
      //    `offsetWidth` 를 한 번 읽어야 브라우저가 0 을 실제로 그린다.
      //    안 읽으면 100% → 남은 값 한 번으로 뭉개져 거꾸로 줄어든 것처럼 보인다
      expFillEl.style.transition = 'none';
      expFillEl.style.width = '0%';
      void expFillEl.offsetWidth;
      expFillEl.style.transition = '';
      // 0 인 채로 한 프레임쯤 둔다. 안 두면 브라우저가 100% → 남은 값을
      // 한 번에 묶어 버려 다시 거꾸로 줄어드는 것처럼 보일 수 있다
      if (tuning.exp) await nextFrame();
      if (phaseId !== mine) return;

      // ④ 남은 만큼 다시 차는 것을 보여 주고 나서
      renderExp();
      if (tuning.exp) await sleep(tuning.exp);
      if (phaseId !== mine) return;

      // ⑤ 바로 고른다. 오른 그 자리에서 고르는 것이 "레벨업" 으로 읽힌다.
      //   예전에는 페이즈 끝(몬스터가 다 움직인 뒤)에 몰아서 열었다
      if (!over && !ended) await openDraft();
      if (phaseId !== mine) return;
    }
    // ④ 남은 만큼 다시 찬다
    renderExp();
  }

  // 증가율은 여기 한 곳에서 먹인다. 경험치가 어디서 들어오든 같이 적용된다
  const gainExp = amount => addXp(expGain(amount));   // 연출이 끝날 때까지의 약속을 그대로 넘긴다

  // 코인 하나가 닿을 때마다 이만큼씩 는다. 쓸 곳은 아직 없다
  function addCoin(n) {
    saved.coin += n;
    writeSave();                // 코인은 영구다. 늘어난 그 자리에서 남긴다
    renderCoin();
  }

  function renderCoin() {
    coinEl.textContent = saved.coin;
    if (inspectTarget() === player) renderInspect();
  }

  // ── 인스펙터 ───────────────────────────────────────────────
  // 탭한 블럭의 속을 정보영역 카드 한 장에 적는다.
  // 판 위 블럭은 칸 크기에 매여 있어 이름을 넣을 자리가 없다. 이름은 여기서 준다
  let picked = null;            // 고른 몬스터. null 이면 플레이어를 본다

  // 보던 몬스터가 죽으면 저절로 플레이어로 돌아온다.
  // 죽은 놈을 계속 들고 있으면 없는 체력을 적게 된다
  function inspectTarget() {
    if (picked && !monsters.includes(picked) && !props.includes(picked)) picked = null;
    return picked || player;
  }

  function inspect(being) {
    picked = being === player ? null : being;
    renderInspect();
  }

  // 이름은 줄어들고 값은 안 줄어든다. 좁은 카드에서 값이 먼저 잘리면 소용이 없다
  const insRow = (label, value) =>
    '<li><span>' + label + '</span><b>' + value + '</b></li>';

  // 기물은 체력도 공격도 없다. 이름과 설명, 스테이지라면 잠김 여부가 전부다
  function renderInspectProp(it) {
    const kindName = it.kind === 'stage' ? '지역' : '기물';
    const rows = it.kind === 'stage'
      ? insRow('상태', it.spec.locked ? '잠김' : '들어갈 수 있다')
        + (it.spec.blockers ? insRow('블로커', it.spec.blockers.n + '개') : '')
        + insRow('퀘스트', it.spec.endless ? '없다 (버티기)'
            : (it.spec.quests ? it.spec.quests.length : 0) + '묶음')
        // 블럭에 적은 진행도를 여기서도 한 번 더 적는다. 블럭 글씨는 작다
        + (isQuestStage(it.spec) && !it.spec.locked
          ? insRow('진행', questClearedOf(it.spec) ? '클리어'
            : questDoneOf(it.spec.id) + '/' + questTotalOf(it.spec) + ' 묶음')
          : '')
      : insRow('체력', '없다') + insRow('공격', '없다');

    inspectEl.innerHTML =
      '<div class="ins-head">'
      + '<img class="ins-face" src="images/' + it.spec.img + '" alt="">'
      + '<span class="ins-title">'
      +   '<b class="ins-name">' + it.spec.name + '</b>'
      +   '<span class="ins-kind">' + kindName + '</span>'
      + '</span>'
      + '</div>'
      + '<div class="ins-body">'
      +   '<ul class="ins-rows">' + rows + '</ul>'
      +   '<p class="ins-sub">설명</p>'
      +   '<p class="ins-note">' + it.spec.note + '</p>'
      + '</div>';

    for (const el of boardEl.querySelectorAll('.token.picked')) el.classList.remove('picked');
    it.el.classList.add('picked');
  }

  // 드래프트로 가진 것들. 아이콘·이름·설명을 그대로 옮긴다.
  // 표(`DRAFT_CARDS`) 차례로 훑으므로 고른 순서가 아니라 늘 같은 차례로 선다
  function upgradeList() {
    const got = DRAFT_CARDS.filter(c => player.cards.has(c.id));
    if (!got.length) return '<ul class="ins-ups"><li class="up-none">아직 없다</li></ul>';
    return '<ul class="ins-ups">' + got.map(c => {
      const n = player.cards.get(c.id);
      // 누적형만 몇 번 쌓였는지 적는다. 기능형은 늘 한 번이라 안 적는다.
      // 판 위 블럭의 기술 줄과 같은 규칙이다
      const times = c.once ? '' : ' ' + roman(n);
      return '<li>'
        + '<i style="background-image:url(images/' + c.img + ')"></i>'
        + '<span><b>' + c.title + times + '</b><small>' + c.note + '</small></span>'
        + '</li>';
    }).join('') + '</ul>';
  }

  function renderInspect() {
    const it = inspectTarget();
    if (it.prop) { renderInspectProp(it); return; }
    const spec = BEINGS[it.kind];
    const mine = it === player;
    const rows =
      insRow('체력', Math.max(0, it.hp) + '/' + it.maxHp)
      + insRow('공격', it.atk)
      + insRow('민첩', it.agi)
      + (mine
        ? insRow('레벨', it.level)
          + insRow('경험치', it.xp + '/' + expNeeded(it.level))
          + insRow('코인', saved.coin)
        : insRow('드랍 코인', it.coin) + insRow('드랍 경험치', it.exp));

    inspectEl.innerHTML =
      '<div class="ins-head">'
      + '<img class="ins-face" src="images/' + spec.img + '" alt="">'
      + '<span class="ins-title">'
      +   '<b class="ins-name">' + spec.name + '</b>'
      +   '<span class="ins-kind">' + (mine ? '플레이어' : '몬스터') + '</span>'
      + '</span>'
      + '</div>'
      + '<div class="ins-body">'
      +   '<ul class="ins-rows">' + rows + '</ul>'
      // 업그레이드는 플레이어만 갖는다. 몬스터에는 줄 자체를 안 낸다
      +   (mine ? '<p class="ins-sub">업그레이드</p>' + upgradeList() : '')
      + '</div>';

    // 지금 보고 있는 블럭에 테를 두른다. 카드와 판이 서로를 가리켜야 한다
    for (const el of boardEl.querySelectorAll('.token.picked')) el.classList.remove('picked');
    if (it.el) it.el.classList.add('picked');
  }

  function renderExp() {
    expFillEl.style.width = (100 * player.xp / expNeeded(player.level)) + '%';
    levelEl.textContent = player.level;
    if (inspectTarget() === player) renderInspect();
  }

  // ── 드래프트 ───────────────────────────────────────────────
  // 지금 나올 수 있는 카드. 기능형은 배우고 나면 빠지고, 앞 기술을 배워야
  // 열리는 것은 그때까지 안 나온다. 누적형(`once` 없음)은 늘 남아 있다
  function availableCards() {
    return DRAFT_CARDS.filter(c =>
      (!c.once || !player.cards.has(c.id))
      && (!c.need || player.cards.has(c.need)));
  }

  // 카드가 모자라면 같은 카드가 여러 칸에 온다.
  // 카드가 늘면 손 안 대고 저절로 서로 다른 카드가 차오른다
  function pickCards(n) {
    const out = [];
    const pool = availableCards();
    if (!pool.length) return out;   // 더 가질 것이 없다. 누적형이 있어 실제로는 안 온다
    let bag = [];
    while (out.length < n) {
      if (!bag.length) bag = [...pool];
      out.push(bag.splice(Math.floor(Math.random() * bag.length), 1)[0]);
    }
    return out;
  }

  // 카드 한 장을 실제로 갖는다. 세는 곳이 여기 하나뿐이라 아이콘 줄의 로마자와
  // "가졌나" 판정이 어긋날 수가 없다
  function takeCard(card) {
    player.cards.set(card.id, (player.cards.get(card.id) || 0) + 1);
    card.apply(player);
    // 인스펙터의 업그레이드 줄과 공격력이 같이 바뀐다
    if (inspectTarget() === player) renderInspect();
  }

  const DRAFT_DIRS = { '0,-1': 0, '-1,0': 1, '1,0': 2 };   // 위·왼쪽·오른쪽
  // 눌러서 고를 때 쓰는 되돌림표. 같은 표에서 만들어야 둘이 어긋나지 않는다
  const SLOT_DIRS = Object.keys(DRAFT_DIRS).reduce((out, key) => {
    out[DRAFT_DIRS[key]] = key.split(',').map(Number);
    return out;
  }, []);

  // 가운데 칸에는 판에 서 있는 그 블럭을 그대로 세운다.
  // 같은 class 를 쓰므로 스프라이트·공방 딱지·체력·경험치가 저절로 같은 모양이 된다
  // 가진 카드의 그림을 체력바 바로 위에 한 줄로 깐다. 표 순서라 자리가 안 흔들린다.
  // 누적형은 몇 번 쌓였는지 로마자로 적고, 기능형은 늘 한 번이라 안 적는다
  function renderSkillRow(tok) {
    const row = tok.querySelector('.skill-row');
    row.innerHTML = '';
    for (const card of DRAFT_CARDS) {
      const n = player.cards.get(card.id) || 0;
      if (!n || !card.img) continue;
      const i = document.createElement('i');
      i.style.backgroundImage = 'url(images/' + card.img + ')';
      // 누적형만 몇 번 쌓였는지 적는다. 기능형은 늘 한 번이라 안 적는다
      if (!card.once) i.innerHTML = '<b>' + roman(n) + '</b>';
      row.appendChild(i);
    }
  }

  // 판 위 블럭과 모달 안 블럭이 같은 것을 보여 준다. 모달이 안 떠 있으면
  // 판 위 것 하나뿐이라 저절로 하나만 그린다
  function renderSkills() {
    for (const row of document.querySelectorAll('.player .skill-row')) {
      renderSkillRow(row.parentElement);
    }
  }

  const renderDraftPlayer = () => renderPlayerCell(dMidEl);

  // 드래프트와 끝난 판 팝업이 같이 쓴다. 판에 서 있는 그 블럭을 그대로 세운다
  function renderPlayerCell(dMidEl) {
    dMidEl.innerHTML =
      // 공방 딱지는 tokenInner 안에 이미 들어 있다. 여기서 하나 더 붙이면
      // 빈 딱지가 진짜 딱지 위에 겹쳐 덮는다 (칼 그림이 가려진다)
      '<div class="token player draft-token">'
      + tokenInner(BEINGS.player.img, BEINGS.player.name)
      + '<span class="skill-row"></span>'
      + '<span class="exp"><i></i></span>'
      + '</div>';
    const tok = dMidEl.firstElementChild;
    // 토큰 안의 크기는 em 이라 font-size 하나로 판과 같은 비율이 된다
    tok.style.fontSize = Math.max(9, Math.round(dMidEl.clientWidth * 0.55)) + 'px';
    const hp = Math.max(0, player.hp);
    tok.querySelector('.hp i').style.width = (100 * hp / player.maxHp) + '%';
    tok.querySelector('.hp b').textContent = hp + '/' + player.maxHp;
    tok.classList.toggle('full', player.hp >= player.maxHp);
    tok.querySelector('.exp i').style.width =
      (100 * player.xp / expNeeded(player.level)) + '%';
    const a = tok.querySelector('.stat-mark .a');
    a.textContent = player.atk;
    a.classList.add('atk-' + player.atkMode);
    renderSkillRow(tok);
    return tok;
  }

  function renderDraft() {
    dHeadEl.textContent = '레벨 ' + player.level + ' — 하나 고르기';
    drafting.cards.forEach((card, i) => {
      const el = dGridEl.querySelector('.d-cell[data-slot="' + i + '"]');
      el.classList.remove('hit');   // 지난번에 고른 카드의 붉은 자국을 지운다
      el.innerHTML = (card.img ? '<i class="d-img"></i>' : '') + '<b></b><span></span>';
      if (card.img) el.querySelector('.d-img').style.backgroundImage =
        'url(images/' + card.img + ')';
      el.querySelector('b').textContent = card.title;
      // 설명이 제목과 같은 말이면 두 번 적지 않는다 (`공격력+5` / `공격력 +5`)
      const same = card.note.replace(/\s/g, '') === card.title.replace(/\s/g, '');
      el.querySelector('span').textContent = same ? '' : card.note;
    });
    drafting.token = renderDraftPlayer();
  }

  // 고를 때까지 기다린다. 페이즈 안에서 await 하므로 그동안 판은 멈춰 있다
  function openDraft() {
    return new Promise(resolve => {
      const cards = pickCards(DRAFT_SLOTS);
      if (!cards.length) { resolve(); return; }   // 깔 것이 없으면 그냥 넘어간다
      endFocus();               // 고르는 것이 먼저다. 붙잡고 있던 것은 놓는다
      drafting = { cards, resolve, busy: false };
      draftEl.hidden = false;
      renderDraft();
    });
  }

  // 모달보다 먼저 레벨업을 알린다
  async function announceLevelUp() {
    playLevelUp();
    if (!tuning.draft) return;
    levelupEl.hidden = false;
    await sleep(LEVELUP_MS);
    levelupEl.hidden = true;
  }

  // 고른 카드가 블럭의 아이콘 줄로 날아가고, 닿아 사라진 뒤에 실제로 붙는다.
  // 그림이 있으면 그림이, 없으면 글씨가 난다
  async function flyToStat(fromEl, toEl, card) {
    const grid = dGridEl.getBoundingClientRect();
    const from = fromEl.getBoundingClientRect();
    const to = toEl.getBoundingClientRect();

    const fly = document.createElement('span');
    fly.className = 'd-fly' + (card.img ? ' img' : '');
    if (card.img) {
      const w = Math.max(18, Math.round(grid.width * 0.11));
      fly.style.backgroundImage = 'url(images/' + card.img + ')';
      fly.style.width = w + 'px';
      fly.style.height = w + 'px';
    } else {
      fly.textContent = card.fly;
    }
    fly.style.fontSize = Math.max(12, Math.round(grid.width * 0.075)) + 'px';
    fly.style.setProperty('--fly', tuning.draft + 'ms');
    dGridEl.appendChild(fly);

    // 시작 자리에 놓고 한 프레임 뒤에 목적지로 민다. 안 그러면 전환이 안 걸린다
    const size = fly.getBoundingClientRect();
    fly.style.left = (from.left - grid.left + from.width / 2 - size.width / 2) + 'px';
    fly.style.top = (from.top - grid.top + from.height / 2 - size.height / 2) + 'px';
    const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    const dy = (to.top + to.height / 2) - (from.top + from.height / 2);

    if (tuning.draft) {
      await nextFrame();
      fly.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.6)';
      fly.style.opacity = '0';
      await sleep(tuning.draft);
    }
    fly.remove();
  }

  async function chooseDraft(dx, dy) {
    if (!drafting || drafting.busy) return;
    const slot = DRAFT_DIRS[dx + ',' + dy];
    if (slot === undefined) return;      // 아래는 리롤 자리, 아직 잠겨 있다
    drafting.busy = true;                // 날아가는 동안 두 번 고르지 못하게

    const card = drafting.cards[slot];
    const mine = phaseId;
    const cell = dGridEl.querySelector('.d-cell[data-slot="' + slot + '"]');
    // 날아가 닿는 곳은 늘 아이콘 줄이다. 거기 그대로 쌓인다
    const rowEl = drafting.token.querySelector('.skill-row');
    // 닿은 뒤 튀는 것은 카드가 정한다. 수치 카드는 그 수치 딱지가 튄다
    const bumpEl = card.bump === 'atk'
      ? drafting.token.querySelector('.stat-mark .a')
      : rowEl;

    await strikePick(drafting.token, cell, dx, dy);
    if (!drafting || phaseId !== mine) return;

    await flyToStat(cell, rowEl, card);
    if (!drafting || phaseId !== mine) return;

    // 그림이 사라진 뒤에 실제로 붙는다
    takeCard(card);
    renderHp(player);                              // 판 위의 블럭
    renderSkills();                                // 두 블럭에 그대로 쌓인다
    if (card.bump === 'atk') {
      drafting.token.querySelector('.stat-mark .a').textContent = player.atk;
    }
    bumpEl.classList.remove('bump');
    void bumpEl.offsetWidth;
    bumpEl.classList.add('bump');
    if (tuning.draft) await sleep(BUMP_MS);
    if (!drafting || phaseId !== mine) return;
    closeDraft();
  }

  function closeDraft() {
    if (!drafting) return;
    const done = drafting.resolve;
    drafting = null;
    draftEl.hidden = true;
    done();
  }

  // ── 위험 표시 ──────────────────────────────────────────────
  // 몬스터는 플레이어가 움직인 뒤에 행동하고, 그때 붙어 있으면 때리고 아니면 옮긴다.
  // 즉 "다음 턴에 맞는 칸" = 지금 몬스터가 바로 옆에 있는 칸이다.
  // 두 칸 떨어진 놈은 다가오는 데 행동을 다 쓰므로 그 턴에는 못 때린다
  // 그 칸으로 가면 얼마나 맞는지. 붙어 있는 놈들의 공격력을 다 더한다
  // 한 놈은 한 턴에 하나만 한다. 그래서 **둘 중 하나로만** 센다.
  // 자세를 잡았으면 다음 턴은 무조건 돌진이므로 제 길만 보고 근접은 안 본다
  // (둘을 더하면 대장 앞칸이 10 이 아니라 20 으로 뜬다)
  const threatDamage = (x, y) => monsters.reduce((sum, m) => {
    const hits = m.aim ? onPath(m, x, y) : Math.abs(m.x - x) + Math.abs(m.y - y) === 1;
    return sum + (hits ? damageTo(m) : 0);
  }, 0);
  const threatened = (x, y) => threatDamage(x, y) > 0;

  // 빈 칸에만 칠한다. 누가 서 있는 칸은 그림이 이미 자리를 차지하고 있다
  function renderDanger() {
    for (let y = MIN; y <= MAX; y++) {
      for (let x = MIN; x <= MAX; x++) {
        const dmg = occupied(x, y) ? 0 : threatDamage(x, y);
        const cell = cellAt[y * N + x];
        cell.classList.toggle('danger', dmg > 0);
        cell.querySelector('.hit-mark i').textContent = dmg > 0 ? dmg : '';
      }
    }
    // 플레이어가 선 칸은 비어 있지 않아 칠하지 않는다. 대신 토큰 위에 딱지를 얹어
    // "그대로 있으면 얼마나 맞는지" 를 알린다
    const here = threatDamage(player.x, player.y);
    player.el.classList.toggle('threatened', here > 0);
    player.el.querySelector('.hit-mark i').textContent = here > 0 ? here : '';
    player.el.style.setProperty('--mark', Math.round(innerCell * HIT_MARK_SCALE) + 'px');
  }

  // ── 페이즈 ─────────────────────────────────────────────────
  // 민첩이 높은 쪽부터 행동한다. 같으면 생성된 순서대로.
  // 플레이어의 민첩이 제일 높으면 지금까지처럼 플레이어가 먼저다
  function actOrder() {
    return [player, ...monsters].sort((a, b) => b.agi - a.agi || a.seq - b.seq);
  }

  // 플레이어의 행동은 입력할 때 정해지지만, 실제로 나가는 것은 제 차례가 왔을 때다.
  // 그 사이에 더 빠른 몬스터가 칸을 채우거나 비울 수 있어서 다시 확인한다.
  //
  // 공격이 하나 끝날 때마다 ATTACK_GAP 만큼 쉰다. 이동은 안 쉰다 - 여러 마리가
  // 같이 걸어오는 것은 읽는 데 지장이 없고, 마리 수만큼 기다리면 한 판이 너무 길다.
  // 페이즈가 도는 동안 입력은 막는다. 안 막으면 연출 중에 다음 페이즈가 겹쳐 든다
  async function runPhase(playerAction) {
    busy = true;
    const mine = ++phaseId;
    try {
      // 움직이기 전에 먼저 지운다. 다 사라지고 나서 첫 걸음이 나가도록 기다린다
      boardEl.classList.add('hide-danger');
      if (tuning.fade) {
        await sleep(tuning.fade);
        if (phaseId !== mine) return;
      }

      for (const actor of actOrder()) {
        if (over || phaseId !== mine) return;
        let did = null;
        if (actor === player) {
          did = await playerAction();
        } else if (actor.hp > 0 && monsters.includes(actor)) {
          did = await monsterAct(actor);
        }
        if (phaseId !== mine) return;
        // 한 놈이 끝나야 다음 놈이 움직인다. 걸음은 짧게, 공격은 길게 쉰다.
        // 아무것도 못 한 놈(막힌 놈)은 보여 줄 것이 없으니 안 쉰다
        if (did) {
          await sleep(did === 'attack' || did === 'aim' ? tuning.gap : moveGap());
          if (phaseId !== mine) return;
        }
      }
      movesEl.textContent = ++moves;
      if (player.hp <= 0) { over = true; showEnd('over'); }

      if (!over) {
        stageTurns++;
        groupTurns++;
        // 버티기 스테이지는 퀘스트가 없다. 출현 규칙을 스테이지가 직접 갖는다
        if (stage() && stage().endless) endlessSpawn();
        else questSpawn();
        renderQuest();
        if (groupDone()) await advanceQuest();
      }
      updateStatus();               // 여기서 새 위험 표시를 계산한다

      // 드래프트는 레벨이 오르는 그 자리(`addXp`)에서 이미 열고 닫았다
    } finally {
      if (phaseId === mine) {
        // 다 끝난 뒤에 되살린다. 옮기는 도중의 어정쩡한 상태는 안 보여 준다
        boardEl.classList.remove('hide-danger');
        busy = false;
      }
    }
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  // 전환을 걸기 전에 한 프레임 비운다. 프레임 대신 짧은 잠을 쓴다.
  // rAF 는 탭이 뒤에 있으면 안 돌아서, 기다리던 페이즈가 영영 안 끝난다
  const nextFrame = () => sleep(20);

  // 몰릴수록 걸음 간격을 좁힌다. 10마리가 130ms 씩 걸으면 한 페이즈가 1.5초라
  // 늘어진다. 순서는 그대로 보이면서 전체 길이만 900ms 언저리로 묶는다
  function moveGap() {
    if (!tuning.move) return 0;                 // 검사에서는 0
    const movers = monsters.length + 1;         // 플레이어까지
    return Math.min(tuning.move, Math.max(MOVE_GAP_MIN, Math.round(MOVE_BUDGET / movers)));
  }

  const canStep = (dx, dy) => {
    const x = player.x + dx, y = player.y + dy;
    return isInner(x, y) && !occupied(x, y);
  };

  // 플레이어의 행동 1: 이동. 벽이거나 다른 물체가 있으면 페이즈가 시작도 안 한다
  function move(dx, dy) {
    if (busy || over || !canStep(dx, dy)) return;
    return runPhase(() => {
      // 더 빠른 몬스터가 먼저 그 칸에 들어왔으면 이동은 불발이다.
      // 페이즈는 이미 시작했으므로 행동만 날아간다
      if (!canStep(dx, dy)) return null;
      player.x += dx; player.y += dy;
      place(player.el, player.x, player.y);
      groupDirs.add(dx + ',' + dy);   // 방향 퀘스트는 이걸로 센다
      lastAxis = dx ? 'h' : 'v';      // 몬스터가 이 축을 피해서 다가온다
      return 'move';
    });
  }

  // 플레이어의 행동 2: 공격. 바로 옆 한 칸을 친다.
  // 빈 칸을 쳐도 행동을 쓴 것이므로 페이즈는 넘어간다. 규칙에 없어서 정했다.
  // '이동 못하면 공격' 으로 묶지 않고 입력을 따로 둔 것은, 나중에 궁수·마법사처럼
  // 떨어져서 치는 직업이 들어오면 이동 가능 여부와 공격이 무관해지기 때문이다
  function attack(dx, dy) {
    if (busy || over) return;
    return runPhase(async () => {
      const target = monsterAt(player.x + dx, player.y + dy);
      if (!target) {
        lunge(player.el, dx, dy);   // 헛치는 것도 보여 준다
        return 'attack';
      }
      await strike(player, target, dx, dy);
      if (target.hp <= 0) defeat(target);
      // 때린 다음에 민다. 맞고 죽은 놈은 이미 빠졌으므로 밀 것도 없다
      if (pushLine(dx, dy) && tuning.move) await sleep(tuning.move);
      // 밀고가기: 앞칸이 비었으면 그 칸으로 간다. 밀어서 비웠든 때려 죽여서
      // 비웠든 같다. 헛친 빈 칸은 위에서 이미 돌아갔으므로 여기까지 안 온다.
      // canStep 을 그대로 쓰므로 이동과 같은 규칙(내부 필드, 빈 칸)을 탄다
      if (player.cards.has('pushMove') && canStep(dx, dy)) {
        player.x += dx; player.y += dy;
        place(player.el, player.x, player.y);
        if (tuning.move) await sleep(tuning.move);
      }
      // 구슬이 다 들어오고 나서 다음 놈이 움직인다. 안 기다리면 레벨업이
      // 페이즈 끝을 놓쳐 다음 턴에야 뜬다
      await drainDrops();
      return 'attack';
    });
  }

  // 칸을 "쳐서" 고르는 연출. 고르는 곳이 셋(드래프트·끝난 판·지역)인데
  // 셋 다 같은 손맛이어야 한다. 치는 쪽은 뻗고, 맞는 쪽은 움츠러들며 붉게 번쩍인다.
  // 소리는 `lunge` 안에 있어서 여기서 한 번에 따라온다
  async function strikePick(token, target, dx, dy) {
    lunge(token, dx, dy);
    if (target) {
      target.classList.remove('hit');
      void target.offsetWidth;      // 같은 칸을 두 번 골라도 다시 재생되게
      target.classList.add('hit');
    }
    if (tuning.draft) await sleep(LUNGE_MS);
  }

  const DIR_NAME = { '1,0': 'right', '-1,0': 'left', '0,1': 'down', '0,-1': 'up' };
  function lunge(el, dx, dy) {
    for (const n of ['up', 'down', 'left', 'right']) el.classList.remove('atk-' + n);
    void el.offsetWidth;
    el.classList.add('atk-' + DIR_NAME[dx + ',' + dy]);
    // 헛치는 것도 lunge 를 거치므로 소리는 여기 한 곳에만 두면 된다
    playSwing(el.classList.contains('player') ? 1 : 0.72);
  }

  // 쓰러지면 어떤 입력도 안 먹는다. 승패 규칙이 아직 없어서 멈춘 것인지
  // 고장인지 화면상 구분이 안 되므로 상태를 적어 준다.
  //
  // 갇힘 표시는 없앴다. 몬스터가 있는 칸은 이제 공격이 되므로, 내부 6*6 안에서는
  // 어느 칸에 서 있어도 이웃이 최소 둘이고 그 둘은 빈 칸(이동)이거나
  // 몬스터(공격)다. 즉 할 수 있는 것이 없는 상태가 생기지 않는다
  function updateStatus() {
    renderHp(player);
    renderDanger();
    playEl.classList.toggle('over', over);
    hintEl.textContent = holdFocus ? '깜빡이는 ' + holdFocus.textContent + ' 를 눌러라'
      : over ? '쓰러졌다. 다시 나 지역 선택 을 눌러라'
      : mode === 'select' ? HINT_SELECT : HINT_DEFAULT;
    leaveBtn.hidden = mode === 'select';
    ctrlEl.classList.toggle('idle', mode === 'select');
  }

  // ── 입력 ───────────────────────────────────────────────────
  // 방향 하나만 받는다. 무엇을 할지는 그 칸에 무엇이 있느냐가 정한다.
  //   몬스터가 있으면 공격, 빈 칸이면 이동, 벽이면 아무 일도 없음
  const DIRS = {
    arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
  };

  function act(dx, dy) {
    if (ended) return;          // 팝업이 떠 있다. 판은 이미 끝났다
    const x = player.x + dx, y = player.y + dy;
    if (mode === 'select') {
      const p = propAt(x, y);
      if (p && p.kind === 'stage') return chooseStage(p, dx, dy);
      if (isInner(x, y)) return move(dx, dy);
      return;
    }
    // 벽 너머라도 몬스터가 있으면 친다. 플레이어가 못 가는 것이지 못 치는 것이 아니다
    if (monsterAt(x, y)) return attack(dx, dy);
    if (isInner(x, y)) return move(dx, dy);
  }

  // 플레이어의 행동 3: 대기. 제자리에서 턴만 넘긴다.
  // 이동도 공격도 아니지만 한 페이즈를 쓴다 — 몬스터는 그동안 다 움직인다
  function waitTurn() {
    if (busy || over || ended || mode !== 'play') return;
    return runPhase(() => {
      groupWaited = true;         // 대기 퀘스트는 이걸로 센다
      return 'wait';
    });
  }

  // 스테이지 블럭을 친다. 치는 모션이 끝나야 들어간다.
  // 드래프트·끝난 판 팝업과 같은 연출을 쓴다 (`strikePick`)
  async function chooseStage(p, dx, dy) {
    if (busy) return;
    busy = true;
    await strikePick(player.el, p.el, dx, dy);
    busy = false;
    if (p.spec.locked) {
      hintEl.textContent = p.spec.name + ' 은 아직 잠겨 있다';
      return;
    }
    enterStage(p.spec);
  }

  window.addEventListener('keydown', e => {
    // 붙잡는 강조 중에는 그 단추가 하는 것만 받는다.
    // `대기` 는 스페이스가 같은 것이라 그것만 열어 둔다 (안내 글이 둘 다 가르친다)
    if (holdFocus) {
      const space = e.key === ' ' || e.code === 'Space';
      if (!space && !DIRS[e.key.toLowerCase()]) return;   // 게임 키가 아니면 손대지 않는다
      e.preventDefault();
      if (space && !e.repeat && !busy && holdFocus.id === 'act-wait') {
        endFocus();
        waitTurn();
      }
      return;
    }
    // 스페이스는 제자리에서 턴 넘기기. 드래프트 중에는 안 받는다
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (!e.repeat && !drafting && !busy) waitTurn();
      return;
    }
    const dir = DIRS[e.key.toLowerCase()];
    if (!dir) return;
    e.preventDefault();
    // 자동 반복은 무시한다. 한 번 누르면 한 번만 움직인다
    if (e.repeat) return;
    if (drafting) { chooseDraft(dir[0], dir[1]); return; }
    if (ended) { chooseEnd(dir[0], dir[1]); return; }
    if (busy) return;
    act(dir[0], dir[1]);
  });

  // 스와이프는 판이 아니라 화면 전체에서 받는다
  let start = null;
  // 화면 어디든 오래 누르고 있으면 제자리에서 턴이 넘어간다.
  // 스와이프와 같은 자리에서 받는다 — 화면 어디서 시작하든 조작이 같아야 한다.
  // 겹치지 않게, 손가락이 움직이면 그 자리에서 취소한다
  const HOLD_WAIT = 3000;
  let holdTimer = null, holdFired = false;

  function cancelHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    player.el.classList.remove('holding');
  }

  window.addEventListener('pointerdown', e => {
    // 상단 바 조작은 그대로 둔다. target 이 Element 가 아닐 수도 있어 closest 유무를 먼저 본다
    if (e.target && e.target.closest && e.target.closest('a,button')) return;
    if (holdFocus) return;                // 강조 중에는 스와이프도 3초 누르기도 없다
    if (busy && !drafting) return;        // 연출이 도는 중에는 안 받는다
    start = { x: e.clientX, y: e.clientY };

    holdFired = false;
    if (mode === 'play' && !over && !ended && !drafting) {
      // 테는 기사에 두른다. 어디를 눌렀든 기다리는 것은 기사다
      player.el.classList.add('holding');
      holdTimer = setTimeout(() => {
        holdTimer = null;
        holdFired = true;                   // 손을 뗄 때 탭으로 또 세지 않게
        player.el.classList.remove('holding');
        waitTurn();
      }, HOLD_WAIT);
    }
  });

  // 조금이라도 끌면 스와이프다. 누르고 있던 것은 없던 일로
  window.addEventListener('pointermove', e => {
    if (!holdTimer || !start) return;
    if (Math.abs(e.clientX - start.x) > SWIPE_MOVE / 2
      || Math.abs(e.clientY - start.y) > SWIPE_MOVE / 2) cancelHold();
  });
  window.addEventListener('pointerup', e => {
    cancelHold();
    if (holdFocus) { start = null; return; }
    if (holdFired) { holdFired = false; start = null; return; }   // 이미 대기로 썼다
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;

    const horizontal = Math.abs(dx) > Math.abs(dy);
    const reach = horizontal ? Math.abs(dx) : Math.abs(dy);
    // 스와이프에 못 미치는 짧은 누름은 탭이다. 판 위 블럭을 눌렀으면 그것을 본다
    if (reach < SWIPE_MOVE) { tapInspect(e); return; }

    const dir = horizontal ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
    if (drafting) chooseDraft(dir[0], dir[1]);
    else if (ended) chooseEnd(dir[0], dir[1]);
    else act(dir[0], dir[1]);
  });
  window.addEventListener('pointercancel', () => { start = null; cancelHold(); });

  // 길게 누르면 브라우저가 먼저 제 일을 한다: 오른쪽 단추 메뉴, 길게 눌러 나오는
  // 메뉴, 그림 끌기. 셋 다 그 순간 pointercancel 을 날려 3초 세기를 끊는다.
  // 링크·단추 위에서는 그대로 둔다 — 거기서는 브라우저 기본이 더 쓸모 있다
  const nativeOk = e =>
    e.target && e.target.closest && e.target.closest('a,button,input,textarea,select');
  window.addEventListener('contextmenu', e => { if (!nativeOk(e)) e.preventDefault(); });
  window.addEventListener('dragstart', e => { if (!nativeOk(e)) e.preventDefault(); });
  window.addEventListener('selectstart', e => { if (!nativeOk(e)) e.preventDefault(); });

  // 판 위 블럭만 받는다. 드래프트 모달 안에도 같은 클래스의 블럭이 있어서
  // `.token` 만 보면 모달을 누른 것까지 딸려 온다
  function tapInspect(e) {
    const el = e.target && e.target.closest && e.target.closest('.token');
    if (!el || !boardEl.contains(el)) return;
    const it = el === player.el ? player
      : monsters.find(m => m.el === el) || props.find(p => p.el === el);
    if (it) inspect(it);
  }

  // ── 시작 / 다시 ────────────────────────────────────────────
  // 판 위의 것을 다 걷어 낸다. 플레이어는 남기고 자리만 처음으로 돌린다
  // 지역 바닥 그림. 스테이지 밖(고르는 화면)에서는 안 깐다
  function renderFloor() {
    const st = stage();
    const bg = mode === 'play' && st && st.bg ? st.bg : null;
    // 그림이 너무 또렷하면 그 위의 블럭·위험 표시가 안 읽힌다.
    // 30% 검은 겹을 한 장 덮어 눌러 둔다
    boardEl.style.backgroundImage = bg
      ? 'linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.3)), url(images/' + bg + ')'
      : '';
    boardEl.classList.toggle('has-bg', !!bg);
  }

  function clearBoard() {
    endFocus();                 // 붙잡고 있던 강조도 여기서 놓는다
    recordBest();               // 나가든 다시 하든, 여기까지가 이번 판이다
    recordQuest();
    phaseId++;                  // 돌고 있던 페이즈는 여기서 손을 뗀다
    hideEnd();
    busy = false;
    boardEl.classList.remove('hide-danger');
    for (const m of monsters) m.el.remove();
    for (const p of props) p.el.remove();
    for (const d of boardEl.querySelectorAll('.dmg')) d.remove();
    for (const o of boardEl.querySelectorAll('.orb')) o.remove();
    dropShow.length = 0;
    monsters.length = 0;
    props.length = 0;
    nextSeq = 1;                // 0 은 플레이어 몫이다
    closeDraft();               // 고르는 중이었으면 접는다
    picked = null;
    over = false;
    moves = 0;
    stageTurns = 0;
    lastAxis = null;
    movesEl.textContent = '0';
    countEl.textContent = '0';
    player.x = START.x; player.y = START.y;
    place(player.el, player.x, player.y);
  }

  // 스텟도 업그레이드도 표에서 다시 베낀다
  function resetPlayer() {
    const base = BEINGS.player;
    player.atk = base.atk; player.maxHp = base.maxHp;
    player.atkMode = 'single';
    player.cards.clear();
    player.expBonus = 0;
    renderSkills();             // 판 위 블럭에 남아 있던 그림도 지운다
    player.hp = player.maxHp;
    player.level = 1; player.xp = 0;
    renderHp(player);
    renderExp();
    renderCoin();
  }

  function addProp(x, y, kind, spec) {
    const el = document.createElement('div');
    el.className = 'token prop ' + kind + (spec.locked ? ' locked' : '');
    // 지역 블럭은 이름을 위에 얹고, 버티기 스테이지는 최고 기록을 오른쪽 아래에 크게
    // 블럭에 크게 적는 것은 최고 버틴 턴이다. 층은 팝업에서 보여 준다
    const best = kind === 'stage' && spec.endless
      ? '<span class="st-best">' + bestTurnOf(spec.id) + '<i>턴</i></span>' : '';
    // 퀘스트형 지역은 이름 아래에 진행도. 다 깼으면 숫자 대신 `클리어`
    const quest = kind === 'stage' && isQuestStage(spec) && !spec.locked
      ? (questClearedOf(spec)
        ? '<span class="st-quest done">클리어</span>'
        : '<span class="st-quest">' + questDoneOf(spec.id)
          + '<i>/' + questTotalOf(spec) + '</i></span>')
      : '';
    const label = kind === 'stage'
      ? '<span class="st-name">' + spec.name + '</span>' : '';
    el.innerHTML = '<img class="glyph" src="images/' + spec.img + '" alt="' + spec.name + '">'
      + label + quest + best;
    boardEl.appendChild(el);
    const p = { prop: true, kind, spec, x, y, el };
    props.push(p);
    place(el, x, y);
    return p;
  }

  // 여기에 하나 더 놓으면 판이 갈라지는가.
  // 빈 칸 한 곳에서 물을 부어 모든 빈 칸에 닿는지 본다. 못 닿는 칸이 있으면
  // 그쪽은 고립지역이다 (몬스터도 플레이어도 서로에게 못 간다)
  function wouldIsolate(bx, by) {
    const blocked = (x, y) => (x === bx && y === by) || !!propAt(x, y);

    let first = null, total = 0;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (blocked(x, y)) continue;
        total++;
        if (!first) first = { x, y };
      }
    }
    if (!first) return true;                  // 다 막혔으면 그것도 갈라진 것으로 친다

    const seen = new Set([nodeId(first.x, first.y)]);
    const stack = [first];
    while (stack.length) {
      const c = stack.pop();
      for (const [dx, dy] of ORTHO) {
        const nx = c.x + dx, ny = c.y + dy;
        if (!onBoard(nx, ny) || blocked(nx, ny)) continue;
        const id = nodeId(nx, ny);
        if (seen.has(id)) continue;
        seen.add(id);
        stack.push({ x: nx, y: ny });
      }
    }
    return seen.size !== total;
  }

  // 시작 자리와 그 옆 네 칸은 비워 둔다. 처음부터 갇히면 아무것도 못 한다.
  // 무엇으로 막는지는 스테이지가 정한다 (숲은 나무, 아레나는 돌)
  function placeBlockers(spec) {
    if (!spec) return;
    const n = spec.n || 0;
    const kind = PROPS[spec.kind] || PROPS.stone;
    const free = [];
    for (let y = MIN; y <= MAX; y++) {
      for (let x = MIN; x <= MAX; x++) {
        if (Math.abs(x - player.x) + Math.abs(y - player.y) <= 1) continue;
        free.push({ x, y });
      }
    }
    // 고립지역을 만드는 자리는 버리고 다른 자리를 본다. 후보가 다 떨어지면
    // 그만큼만 놓는다 — 억지로 채우느니 몇 개 적은 편이 낫다
    let placed = 0;
    while (placed < n && free.length) {
      const c = free.splice(Math.floor(Math.random() * free.length), 1)[0];
      if (wouldIsolate(c.x, c.y)) continue;
      addProp(c.x, c.y, 'blocker', kind);
      placed++;
    }
  }

  // ── 저장 ───────────────────────────────────────────────────
  // 변수는 두 갈래다. 어느 쪽인지가 헷갈리면 이 표를 본다.
  //
  //   영구  — 지역을 벗어나도, 새로고침해도 남는다. `saved` 안에만 둔다.
  //           코인, 무한의 아레나에서 버틴 턴
  //   일시  — 그 지역 안에서만 산다. 지역을 드나들면 표에서 다시 베낀다.
  //           체력, 레벨, 경험치, 업그레이드(드래프트 카드), 공·체 같은 스텟
  //
  // 새 값을 넣을 때 둘 중 어디에 둘지부터 정한다. `saved` 에 넣으면 영구,
  // `player` 에 넣고 `resetPlayer()` 에서 지우면 일시다
  const SAVE_KEY = 'slide.save.v1';
  const saved = {
    coin: 0,          // 모은 코인. 지역을 옮겨도 이어진다
    bestTurn: {},     // 스테이지별 최고 버틴 턴
    questDone: {},    // 스테이지별로 깬 퀘스트 묶음 수 (가장 많이 깬 때)
  };

  // localStorage 는 막혀 있을 수 있다(사생활 보호 창 등).
  // 그때는 이 판에서만 기억한다. 못 남겨도 게임은 돈다
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const got = JSON.parse(raw);
      if (typeof got.coin === 'number') saved.coin = got.coin;
      if (got.bestTurn) Object.assign(saved.bestTurn, got.bestTurn);
      if (got.questDone) Object.assign(saved.questDone, got.questDone);
      // 옛 저장에 남아 있는 `bestFloor` 는 읽지 않는다. 층 개념을 없앴다.
      // 눈에 띄면 그 자리에서 지운 채로 다시 적는다
      if (got.bestFloor) writeSave();
    } catch (e) { /* 못 읽으면 처음부터 하는 셈 친다 */ }
  }

  function writeSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(saved)); } catch (e) { /* 무시 */ }
  }

  const bestTurnOf = id => saved.bestTurn[id] || 0;

  // 퀘스트형 지역인가. 버티기(`endless`)에는 깰 것이 없다
  const isQuestStage = st => !!(st && st.quests && st.quests.length);
  // 셈에 넣는 묶음은 "깰 수 있는" 것뿐이다. `hold` 묶음은 깰 항목이 없다
  const questTotalOf = st => (isQuestStage(st) ? st.quests.filter(g => !g.hold).length : 0);
  const questDoneOf = id => saved.questDone[id] || 0;
  const questClearedOf = st => isQuestStage(st) && questDoneOf(st.id) >= questTotalOf(st);

  // 지금 판에서 깬 묶음 수. `hold` 묶음까지 왔으면 깰 것은 이미 다 깬 것이다
  const questDoneNow = () => Math.min(groupIndex, questTotalOf(stage()));

  // 기록과 같은 자리에서 남긴다. 가장 많이 깬 때를 남기고 뒤로는 안 간다
  function recordQuest() {
    const st = stage();
    if (!isQuestStage(st)) return;
    const now = questDoneNow();
    if (now <= questDoneOf(st.id)) return;
    saved.questDone[st.id] = now;
    writeSave();
  }

  // 기록을 남길 자리는 "그 판이 끝나는 곳" 하나다. 죽어서 끝나든 나가서 끝나든 같다
  function recordBest() {
    const st = stage();
    if (!st || !st.endless) return;
    if (stageTurns <= bestTurnOf(st.id)) return;
    saved.bestTurn[st.id] = stageTurns;
    writeSave();
  }

  // ── 끝난 판 알리기 ─────────────────────────────────────────
  // 쓰러지면 게임 오버, 퀘스트를 다 깨면 게임 클리어.
  // 무한의 아레나는 깰 것이 없으니 늘 게임 오버다. 성공도 실패도 아니고 기록만 남는다
  function showEnd(kind) {
    endFocus();                 // 팝업이 뜨면 붙잡을 것이 없다
    ended = true;
    endKind = kind;
    recordBest();
    recordQuest();
    const st = stage();
    const tower = !!(st && st.endless);
    endEl.classList.toggle('clear', kind === 'clear');
    endTitleEl.textContent = kind === 'clear' ? '게임 클리어' : '게임 오버';
    endNoteEl.textContent = kind === 'quit'
      ? '여기서 그만둘까 — ' + st.name
      : tower
        ? st.name + ' — 여기까지 버텼다'
        : kind === 'clear'
          ? st.name + ' 퀘스트를 다 깼다'
          : st.name + ' 에서 쓰러졌다';

    // 그만두려는 것은 아직 끝난 것이 아니다. 오른쪽은 판으로 돌아가는 자리다
    const right = endPickEl.querySelector('.d-right');
    right.querySelector('b').textContent = kind === 'quit' ? '취소' : '다시';
    right.querySelector('span').textContent = kind === 'quit' ? '이어서 한다' : '이 지역 다시';

    const rows = [['버틴 턴', stageTurns]];
    if (tower) rows.push(['최고 기록', bestTurnOf(st.id) + '턴']);
    if (!tower) {
      const total = questGroups().length;
      const now = kind === 'clear' ? total : groupIndex;
      rows.push(['깬 퀘스트', now + '/' + total]);
    }
    rows.push(['레벨', player.level], ['코인', saved.coin]);
    endRowsEl.innerHTML = rows
      .map(r => '<li><span>' + r[0] + '</span><b>' + r[1] + '</b></li>').join('');

    endEl.hidden = false;
    endToken = renderPlayerCell(endMidEl);   // 자리를 잡은 뒤라야 칸 너비가 나온다
  }

  // 끝난 판에서 고르기. 왼쪽은 지역, 오른쪽은 다시. 위아래는 아무 일도 없다
  async function chooseEnd(dx, dy) {
    if (!ended || picking) return;
    const cell = dx === -1 ? endPickEl.querySelector('.d-left')
      : dx === 1 ? endPickEl.querySelector('.d-right') : null;
    if (!cell) return;
    picking = true;
    await strikePick(endToken, cell, dx, dy);
    picking = false;
    if (dx === -1) gotoSelect();
    else if (endKind === 'quit') hideEnd();   // 그만두지 않는다. 판으로 돌아간다
    else reset();
  }

  function hideEnd() {
    ended = false;
    endEl.hidden = true;
    endEl.classList.remove('clear');
  }

  // ── 지역 고르기 / 들어가기 ─────────────────────────────────
  function gotoSelect() {
    // 걷어 내는 것이 먼저다. `clearBoard` 안에서 기록을 남기는데,
    // stageIndex 를 먼저 지우면 어느 스테이지의 기록인지 알 수가 없다
    clearBoard();
    mode = 'select';
    stageIndex = -1;
    resetPlayer();              // 새로 시작하는 것이라 업그레이드도 다 지운다
    for (const st of STAGES) addProp(st.at.x, st.at.y, 'stage', st);
    renderFloor();
    startGroup(0);
    renderInspect();
    updateStatus();
  }

  function enterStage(st) {
    if (st.locked) return false;
    mode = 'play';
    stageIndex = STAGES.indexOf(st);
    startStage(0);
    return true;
  }

  // `from` 번째 퀘스트 묶음부터. `다시` 는 지금 묶음을 그대로 다시 준다
  function startStage(from) {
    clearBoard();
    resetPlayer();
    placeBlockers(stage().blockers);
    renderFloor();
    startGroup(from);
    endlessSpawn();             // 0턴에도 나온다. 버티기가 아니면 아무 일도 없다
    renderInspect();
    updateStatus();
  }

  function reset() {
    if (mode === 'select') { gotoSelect(); return; }
    // 규칙: `다시` 는 지금 퀘스트를 처음부터. 스테이지를 통째로 되돌리지 않는다.
    // 다만 다 깬 뒤(`hold` 묶음까지 온 것 포함)라면 되돌릴 묶음이 없다.
    // 그때는 그 지역을 처음부터 준다
    startStage(allDone || (group() && group().hold) ? 0 : groupIndex);
  }

  const soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.setAttribute('aria-label', soundOn ? '소리 끄기' : '소리 켜기');
    if (soundOn) playSwing(1);          // 켠 것이 들리게 한 번 낸다
  });

  document.getElementById('reset').addEventListener('click', reset);
  // ── 명령 블럭 ──────────────────────────────────────────────
  // 강조: 고르라고 세 번 깜빡인다.
  // 저절로는 아무 데서도 안 부른다. 필요한 자리에서 손으로 부른다 —
  // 늘 깜빡이면 그냥 배경이 되어 아무도 안 본다
  const BLINK_TIMES = 3;        // CSS 의 `cmdblink ... 3` 과 같아야 한다

  function blink(el) {
    if (!el) return;
    el.classList.remove('blink');
    void el.offsetWidth;        // 같은 것을 다시 강조해도 처음부터 돌게
    el.classList.add('blink');
  }

  const blinkCmds = root => {
    for (const el of root.querySelectorAll('.cmd')) blink(el);
  };

  // 붙잡는 강조. 세 번 깜빡이고 마는 것과 달리, 누를 때까지 깜빡이면서
  // 나머지를 어둡게 눌러 두고 다른 조작을 다 막는다.
  // 새 조작을 처음 가르치는 자리(튜토리얼)에서만 쓴다 — 늘 쓰면 갇힌 느낌만 남는다
  function startFocus(el) {
    endFocus();
    if (!el) return;
    holdFocus = el;
    el.classList.remove('blink', 'hold');
    void el.offsetWidth;              // 다시 걸어도 처음부터 돌게
    el.classList.add('blink', 'hold');
    playEl.classList.add('spotlight');
    updateStatus();                   // 안내 글도 그 단추를 가리킨다
  }

  function endFocus() {
    if (!holdFocus) return;
    holdFocus.classList.remove('blink', 'hold');
    holdFocus = null;
    playEl.classList.remove('spotlight');
  }

  // `지역`·`다시`·`취소`·`대기`·`종료` 는 다 같은 것이다: 쳐서도 고르고 눌러서도 고른다.
  // 누르는 쪽에도 같은 튕김을 준다 — 두 길이 같은 것으로 보여야 한다
  function tapCmd(el) {
    el.classList.remove('hit');
    void el.offsetWidth;
    el.classList.add('hit');
  }

  document.getElementById('act-wait').addEventListener('click', e => {
    if (mode !== 'play') return;
    if (holdFocus && holdFocus !== e.currentTarget) return;
    endFocus();                 // 눌렀으니 놓아 준다
    tapCmd(e.currentTarget);
    waitTurn();
  });
  document.getElementById('act-quit').addEventListener('click', e => {
    if (mode !== 'play' || ended || busy) return;
    if (holdFocus && holdFocus !== e.currentTarget) return;
    tapCmd(e.currentTarget);
    // 다 깨고 `종료` 를 기다리던 묶음이면 그만두는 것이 아니라 클리어다
    const g = group();
    endFocus();
    showEnd(g && g.hold ? 'clear' : 'quit');
  });

  // 드래프트 카드도 명령 블럭이다. 눌러도 그 방향으로 친 것과 같다
  dGridEl.addEventListener('click', e => {
    const cell = e.target && e.target.closest && e.target.closest('.d-card');
    if (!cell || !cell.dataset.slot) return;
    const dir = SLOT_DIRS[+cell.dataset.slot];
    if (dir) chooseDraft(dir[0], dir[1]);
  });

  // 팝업의 명령 블럭. 스와이프·키와 같은 자리로 보낸다
  endPickEl.addEventListener('click', e => {
    const cell = e.target && e.target.closest && e.target.closest('.d-card');
    if (!cell) return;
    chooseEnd(cell.classList.contains('d-left') ? -1 : 1, 0);
  });
  leaveBtn.addEventListener('click', gotoSelect);
  window.addEventListener('resize', layout);

  loadSave();                   // 영구 변수를 먼저 되살린다
  document.getElementById('ver').textContent = 'v' + VERSION;
  buildBoard();
  layout();
  reset();

  // 판을 원하는 상태로 놓고 확인하기 위한 손잡이. 스폰이 랜덤이라
  // 이것이 없으면 "고블린이 다가오는가" 를 재현성 있게 볼 수가 없다
  window.__t = {
    monsters, player, place, addMonster, updateStatus, renderHp,
    isOver: () => over,
    attack, act, killMonster, defeat, pushLine, actOrder, BEINGS, KNIGHT,
    damageTo, makeBeing,
    expNeeded, gainExp, addXp, expGain, orbSplit, renderExp, ATK_MODES,
    addCoin, renderCoin, spawnDrop, DROPS,
    DRAFT_CARDS, DRAFT_SLOTS, openDraft, chooseDraft, availableCards,
    takeCard, renderSkillRow, renderSkills, roman,
    isDrafting: () => !!drafting,
    announceLevelUp,
    draftCards: () => (drafting ? drafting.cards.map(c => c.id) : []),
    QUEST_GROUPS: FOREST_QUESTS, TUTORIAL_QUESTS, startGroup, spawnMonster, reset,
    STAGES, PROPS, props, propAt, enterStage, gotoSelect, addProp, placeBlockers,
    monsterMul, spawnEvery, endlessSpawn, endlessStep, wouldIsolate,
    chargePath, aimDir, setAim, clearAim, chargeRun,
    pickLine, sayLine, moveMonster,
    outerCells, rimCells, isRim,
    mode: () => mode, stageNow: () => stage(), stageTurns: () => stageTurns,
    quest: () => ({
      index: groupIndex, turns: groupTurns, spawned: groupSpawned,
      kills: { ...groupKills }, dirs: groupDirs.size, allDone,
      items: allDone ? [] : questGroups()[groupIndex].items.map(it => ({
        title: it.title, progress: itemProgress(it), goal: itemGoal(it), done: itemDone(it),
      })),
      done: groupDone(),
    }),
    isBusy: () => busy,
    renderDanger, threatened, threatDamage, moveGap, renderFloor,
    showEnd, hideEnd, isEnded: () => ended, recordBest, chooseEnd,
    endKind: () => endKind,
    saved, loadSave, writeSave, bestTurnOf,
    recordQuest, questDoneOf, questTotalOf, questClearedOf, questDoneNow,
    endPop: () => ({
      shown: !endEl.hidden,
      clear: endEl.classList.contains('clear'),
      title: endTitleEl.textContent,
      note: endNoteEl.textContent,
      rows: Array.from(endRowsEl.children).map(li => li.textContent),
    }),
    inspect, renderInspect, inspectTarget, tapInspect, strikePick,
    VERSION,
    blink, blinkCmds, BLINK_TIMES, startFocus, endFocus,
    focusNow: () => (holdFocus ? holdFocus.id : null),
    waitTurn, findStep, stepPath, ORTHO, walkable, stepOrder,
    lastAxis: () => lastAxis,
    waited: () => groupWaited,
    layout, layoutSplit,
    split: () => ({
      wide: splitEl.classList.contains('wide'),
      game: { w: stageEl.clientWidth, h: stageEl.clientHeight },
      info: { w: infoEl.clientWidth, h: infoEl.clientHeight },
      ctrl: { w: ctrlEl.clientWidth, h: ctrlEl.clientHeight },
      slots: ctrlEl.querySelectorAll('.slot').length,
      card: {
        w: parseFloat(infoEl.style.getPropertyValue('--cw')),
        h: parseFloat(infoEl.style.getPropertyValue('--ch')),
      },
      cards: infoEl.querySelectorAll('.card').length,
    }),
    limitsExtra: { HIT_MARK_SCALE },
    isSoundOn: () => soundOn,
    // 연출을 기다리지 않고 검사하려면 간격을 0 으로 둔다
    setTiming: t => {
      if ('gap' in t) tuning.gap = t.gap;
      if ('hit' in t) tuning.hit = t.hit;
      if ('move' in t) tuning.move = t.move;
      if ('fade' in t) tuning.fade = t.fade;
      if ('draft' in t) tuning.draft = t.draft;
      if ('orb' in t) tuning.orb = t.orb;
      if ('exp' in t) tuning.exp = t.exp;
    },
    limits: {
      SWIPE_MOVE, TINY_TOKEN, HIT_DELAY, ATTACK_GAP,
      MOVE_GAP, MOVE_GAP_MIN, MOVE_BUDGET, DANGER_FADE, QUEST_CLEAR_MS, DASH_STEP_MIN,
      N, MIN, MAX,
              LEVELUP_MS, LUNGE_MS, FLY_MS, BUMP_MS, ORB_MS, ORB_BIG, EXP_MS,
      // 예전 이름들. 표에서 그대로 끌어 쓴다
      PLAYER_MAX_HP: BEINGS.player.maxHp, GOBLIN_MAX_HP: BEINGS.goblin.maxHp,
      PLAYER_ATK: BEINGS.player.atk, GOBLIN_ATK: BEINGS.goblin.atk,
      PLAYER_AGI: BEINGS.player.agi, GOBLIN_AGI: BEINGS.goblin.agi,
      RIDER_AGI: BEINGS.rider.agi,
    },
  };
})();
</script>
</body>
</html>
