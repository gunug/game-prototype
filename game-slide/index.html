<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>슬라이드 — Game Prototype</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFD400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }

  .play{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--canvas);}

  .topbar{
    display:flex;align-items:center;gap:var(--s3);
    padding:var(--s3) var(--s4);
    padding-top:calc(env(safe-area-inset-top,0px) + var(--s3));
    border-bottom:1px solid var(--hairline);
  }
  .topbar .name{color:var(--ink);font-weight:700;font-size:15px;}
  .topbar .stat{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;}
  .topbar .stat b{color:var(--ink);}
  .topbar .spacer{flex:1;}

  /* 판이 들어갈 자리. 남는 공간 전부 */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--s3);min-height:0;}

  .board{position:relative;}

  /* 칸은 배경으로만 깔린다. 움직이는 것(플레이어/몬스터)은 그 위에 얹는다 */
  .cell{position:absolute;border-radius:3px;}
  .cell.outer{background:#161613;box-shadow:inset 0 0 0 1px var(--hairline);}
  .cell.inner{background:var(--surface-soft);box-shadow:inset 0 0 0 1px var(--hairline);}

  /* 내부 6*6 의 테두리. 플레이어가 갈 수 있는 범위가 보이게 */
  .fence{
    position:absolute;pointer-events:none;border-radius:var(--r-sm);
    border:2px solid var(--brand-yellow-deep);opacity:.55;
  }

  .token{
    position:absolute;left:0;top:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--r-sm);
    font-weight:800;line-height:1;
    will-change:transform;
  }
  /* transform 은 자리를 잡는 데 쓰고 있다. 등장 효과는 안쪽 스프라이트에만 건다 */
  /* 스프라이트가 주인공이라 바닥판은 옅게 깔고 테두리로만 누가 있는지 알린다 */
  .player{
    background:radial-gradient(ellipse at 50% 78%,
      rgba(255,212,0,.42), rgba(255,212,0,.10) 55%, transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,212,0,.55);
    transition:transform .13s cubic-bezier(.2,.7,.3,1),
               width .13s, height .13s, left .13s, top .13s, font-size .13s;
  }
  .monster{
    background:radial-gradient(ellipse at 50% 78%,
      rgba(255,138,115,.28), rgba(255,138,115,.07) 55%, transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,138,115,.35);
    transition:transform .13s cubic-bezier(.2,.7,.3,1),
               width .13s, height .13s, left .13s, top .13s, font-size .13s;
  }
  .monster .glyph{animation:pop .18s ease-out;}
  @keyframes pop{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}

  /* 384px 원본을 칸 크기(보통 30~60px)로 줄여 쓴다. 축소라서 image-rendering 은
     기본값(부드럽게)이 낫다. pixelated 는 픽셀을 10칸에 하나씩 버려 실루엣이 깨진다.
     아래쪽은 체력 표시 자리로 비워 둔다 */
  .token .glyph{
    position:absolute;left:0;top:0;width:100%;height:72%;
    object-fit:contain;object-position:center bottom;
    pointer-events:none;
  }
  /* 체력바 안에 숫자를 얹는다. 따로 줄을 만들면 칸이 좁아 둘 다 못 읽는다 */
  .token .hp{
    position:absolute;left:6%;right:6%;bottom:5%;height:.42em;
    background:rgba(0,0,0,.62);border-radius:.1em;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .token .hp i{position:absolute;left:0;top:0;height:100%;width:100%;
    transition:width .32s cubic-bezier(.2,.7,.3,1);}
  .token .hp b{
    position:relative;font-size:.3em;line-height:1;font-weight:700;
    color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.95);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .player .hp i{background:#1E5E20;}
  .monster .hp i{background:#A8352A;}
  /* 외부 띠의 토큰은 17px 쯤이라 숫자가 안 읽힌다. 바만 남긴다 */
  .token.tiny .glyph{height:86%;}
  .token.tiny .hp{left:12%;right:12%;bottom:6%;height:.22em;}
  .token.tiny .hp b{display:none;}
  /* 토큰의 transform 은 자리를 잡는 데 쓰고 있다. 그래서 연출은 전부
     안쪽 .glyph 를 움직이거나, 토큰에는 transform 아닌 속성만 쓴다 */
  .token.hit{animation:hit .25s ease-out;}
  @keyframes hit{0%,100%{filter:none;}25%{filter:brightness(2.4);}}

  /* 피격: 빠르게 조금 작아졌다 본래 크기로 */
  .token.hit .glyph{animation:struck .25s ease-out;}
  @keyframes struck{0%,100%{transform:scale(1);}40%{transform:scale(.72);}}

  /* 입은 피해를 머리 위에 띄운다. 토큰 밖으로 나가야 해서 overflow 를 막지 않는다 */
  .token .dmg{
    position:absolute;left:50%;top:0;
    font-weight:800;line-height:1;white-space:nowrap;pointer-events:none;
    text-shadow:0 1px 2px #000, 0 0 6px rgba(0,0,0,.9);
    animation:dmgfloat .9s ease-out forwards;
  }
  .player .dmg{color:#FF6B57;}
  .monster .dmg{color:#FFD400;}
  @keyframes dmgfloat{
    0%  {opacity:0;transform:translate(-50%, 10%) scale(.8);}
    18% {opacity:1;transform:translate(-50%,-35%) scale(1.15);}
    100%{opacity:0;transform:translate(-50%,-135%) scale(1);}
  }

  /* 공격: 치는 방향으로 조금 나갔다 제자리로 */
  .token.atk-up    .glyph{animation:lunge-up .2s ease-out;}
  .token.atk-down  .glyph{animation:lunge-down .2s ease-out;}
  .token.atk-left  .glyph{animation:lunge-left .2s ease-out;}
  .token.atk-right .glyph{animation:lunge-right .2s ease-out;}
  @keyframes lunge-up   {0%,100%{transform:translateY(0);}45%{transform:translateY(-28%);}}
  @keyframes lunge-down {0%,100%{transform:translateY(0);}45%{transform:translateY(28%);}}
  @keyframes lunge-left {0%,100%{transform:translateX(0);}45%{transform:translateX(-28%);}}
  @keyframes lunge-right{0%,100%{transform:translateX(0);}45%{transform:translateX(28%);}}
  .play.over .board{filter:grayscale(.6) brightness(.7);}

  .hint{
    color:var(--muted);font-size:12px;text-align:center;margin:0;
    padding:0 var(--s4) calc(env(safe-area-inset-bottom,0px) + var(--s4));
  }
</style>
</head>
<body>
  <main class="play">
    <div class="topbar">
      <a class="btn btn-secondary btn-sm" href="../index.html">← 목록</a>
      <span class="name">슬라이드</span>
      <span class="spacer"></span>
      <span class="stat">체력 <b id="hp">10/10</b></span>
      <span class="stat">턴 <b id="moves">0</b></span>
      <span class="stat">몬스터 <b id="mcount">0</b></span>
      <button class="btn btn-secondary btn-sm" id="reset" type="button">다시</button>
    </div>

    <div class="stage" id="stage">
      <div class="board" id="board"></div>
    </div>

    <p class="hint" id="hint">스와이프 · 방향키 / WASD 로 이동 · 길게 하면 공격</p>
  </main>

<script>
(() => {
  'use strict';

  // ── 규칙 상수 ───────────────────────────────────────────────
  const N = 10;                 // 필드 10*10
  const BORDER = 2;             // 상하좌우 각 2줄이 외부
  const MIN = BORDER;           // 내부 최소 좌표 = 2
  const MAX = N - 1 - BORDER;   // 내부 최대 좌표 = 7  → 내부 6*6
  const START_MONSTERS = 3;
  const START = { x: 4, y: 4 }; // 내부 6*6 (2~7) 의 가운데
  // 체력·피해량은 규칙에 숫자가 없어서 정한 값이다
  const PLAYER_MAX_HP = 10;
  const GOBLIN_MAX_HP = 3;
  const GOBLIN_ATK = 1;
  const PLAYER_ATK = 1;         // 규칙에 숫자가 없어서 정했다. 고블린 체력 3 이라 세 번 쳐야 죽는다

  // 이동과 공격을 같은 방향 입력 하나로 가른다. 짧으면 이동, 길면 공격
  const SWIPE_MOVE = 24;        // 이만큼은 움직여야 입력으로 친다
  const SWIPE_ATTACK = 90;      // 이 이상 끌면 공격
  const HOLD_MS = 300;          // 이만큼 누르고 있으면 공격
  const TINY_TOKEN = 30;        // 토큰이 이보다 작으면 체력 숫자를 감춘다

  // 공격은 한꺼번에 터지면 무슨 일이 일어났는지 못 읽는다. 한 대씩 끊어 보여 준다
  const HIT_DELAY = 120;        // 돌진이 뻗은 뒤 피해가 들어가기까지
  const ATTACK_GAP = 260;       // 한 대와 다음 한 대 사이
  const tuning = { hit: HIT_DELAY, gap: ATTACK_GAP };   // 검사할 때 0 으로 낮춘다

  // 민첩: 높을수록 먼저 행동한다. 규칙에 숫자가 없어서 정했다
  const PLAYER_AGI = 10;
  const GOBLIN_AGI = 8;

  // 안내 문구는 HTML 과 updateStatus() 두 군데서 쓴다. 한 곳에 둔다
  const HINT_DEFAULT = '스와이프 · 방향키 / WASD 로 이동 · 길게 하면 공격';

  const boardEl = document.getElementById('board');
  const stageEl = document.getElementById('stage');
  const movesEl = document.getElementById('moves');
  const countEl = document.getElementById('mcount');
  const hpEl = document.getElementById('hp');
  const hintEl = document.querySelector('.hint');
  const playEl = document.querySelector('.play');
  const fenceEl = document.createElement('div');

  // 외부는 적이 어디서 나오는지만 보여 주면 되므로 내부 칸의 1/3 크기로 그린다.
  // 규칙(좌표·이동·스폰)은 그대로다. 화면에서 차지하는 자리만 줄인다
  const OUTER_SCALE = 1 / 3;
  let gapPx = 2;
  let axis = { size: [], pos: [], total: 0 };
  let nextSeq = 0;              // 생성 순서. 민첩이 같으면 이것으로 가른다
  const player = {
    x: START.x, y: START.y, hp: PLAYER_MAX_HP, maxHp: PLAYER_MAX_HP,
    agi: PLAYER_AGI, seq: nextSeq++, el: null,
  };
  const monsters = [];          // {kind,x,y,hp,maxHp,atk,el}
  let moves = 0;
  let over = false;             // 플레이어가 쓰러졌다
  let busy = false;             // 페이즈 연출이 도는 중. 입력을 막는다
  let phaseId = 0;              // 페이즈 세대. `다시` 로 갈아엎으면 옛 페이즈는 손을 뗀다
  let innerCell = 32;           // 내부 칸 크기. 데미지 숫자 크기에 쓴다

  const isInner = (x, y) => x >= MIN && x <= MAX && y >= MIN && y <= MAX;

  // ── 판 그리기 ───────────────────────────────────────────────
  function buildBoard() {
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const c = document.createElement('div');
        c.className = 'cell ' + (isInner(x, y) ? 'inner' : 'outer');
        c.dataset.x = x;
        c.dataset.y = y;
        boardEl.appendChild(c);
      }
    }
    fenceEl.className = 'fence';
    boardEl.appendChild(fenceEl);

    player.el = document.createElement('div');
    player.el.className = 'token player';
    player.el.innerHTML = tokenInner('player.png', '플레이어');
    boardEl.appendChild(player.el);
  }

  const tokenInner = (src, alt) =>
    '<img class="glyph" src="images/' + src + '" alt="' + alt + '">' +
    '<span class="hp"><i></i><b></b></span>';

  // 체력바 폭과 숫자를 현재 체력에 맞춘다.
  // 상단 바 숫자도 여기서 같이 고친다. 페이즈 끝에만 고치면 한 대씩 끊어 때리는
  // 동안 상단 바만 옛 값에 머물러, 정작 체력이 언제 깎였는지가 안 보인다
  function renderHp(ent) {
    const hp = Math.max(0, ent.hp);
    ent.el.querySelector('.hp i').style.width = (100 * hp / ent.maxHp) + '%';
    ent.el.querySelector('.hp b').textContent = hp + '/' + ent.maxHp;
    ent.el.classList.toggle('full', ent.hp >= ent.maxHp);
    if (ent === player) hpEl.textContent = hp + '/' + ent.maxHp;
  }

  // 한 축의 칸 크기와 시작 위치를 미리 구한다. 내부 칸은 C, 외부 칸은 C/3 이라
  // 칸마다 크기가 달라 더는 곱셈 한 번으로 자리를 낼 수 없다.
  //   전체 = 내부수*C + 외부수*(C/3) + 간격*(N-1)
  function computeAxis(side, gap) {
    const innerCount = MAX - MIN + 1;
    const outerCount = N - innerCount;
    const C = Math.max(12,
      Math.floor((side - gap * (N - 1)) / (innerCount + outerCount * OUTER_SCALE)));
    const O = Math.max(3, Math.round(C * OUTER_SCALE));

    const size = [], pos = [];
    let p = 0;
    for (let i = 0; i < N; i++) {
      size.push(i >= MIN && i <= MAX ? C : O);
      pos.push(p);
      p += size[i] + gap;
    }
    return { size, pos, total: p - gap };
  }

  // 칸 크기는 남은 공간에 맞춰 정수 px 로 내림. 소수 px 이면 격자가 흔들린다
  function layout() {
    const w = stageEl.clientWidth - 24;
    const h = stageEl.clientHeight - 24;
    const side = Math.max(140, Math.min(w, h));
    gapPx = side < 340 ? 1 : 2;
    axis = computeAxis(side, gapPx);
    innerCell = axis.size[MIN];

    boardEl.style.width = axis.total + 'px';
    boardEl.style.height = axis.total + 'px';

    // 세로줄과 가로줄을 따로 본다. 왼쪽 띠의 안쪽 행은 좁고 길쭉한 칸이 된다
    for (const c of boardEl.querySelectorAll('.cell')) {
      const x = +c.dataset.x, y = +c.dataset.y;
      c.style.width = axis.size[x] + 'px';
      c.style.height = axis.size[y] + 'px';
      c.style.left = axis.pos[x] + 'px';
      c.style.top = axis.pos[y] + 'px';
    }

    const span = axis.pos[MAX] + axis.size[MAX] - axis.pos[MIN];
    fenceEl.style.left = (axis.pos[MIN] - gapPx / 2 - 2) + 'px';
    fenceEl.style.top = (axis.pos[MIN] - gapPx / 2 - 2) + 'px';
    fenceEl.style.width = (span + 4) + 'px';
    fenceEl.style.height = (span + 4) + 'px';

    place(player.el, player.x, player.y);
    for (const m of monsters) place(m.el, m.x, m.y);
  }

  // 자리와 크기를 같이 잡는다. 띠를 넘나들면 칸 크기가 바뀌므로 둘을 떼면 안 된다.
  // 토큰은 늘 정사각형이다. 옆 띠의 칸은 좁고 길쭉해서, 칸을 꽉 채우면
  // 고블린이 길쭉한 알약 바닥에 처박힌 꼴이 된다. 짧은 변에 맞춰 칸 가운데 둔다.
  // 가운데로 미는 것은 left/top 으로 한다. transform 은 칸의 원점을 그대로 가리켜야
  // 자리 계산이 한 군데로 모인다
  function place(el, x, y) {
    const w = axis.size[x], h = axis.size[y];
    const s = Math.min(w, h);
    el.style.width = s + 'px';
    el.style.height = s + 'px';
    el.style.left = ((w - s) / 2) + 'px';
    el.style.top = ((h - s) / 2) + 'px';
    el.style.fontSize = Math.max(7, Math.floor(s * 0.55)) + 'px';
    el.classList.toggle('tiny', s < TINY_TOKEN);   // 외부 띠에서는 숫자가 안 읽힌다
    el.style.transform = 'translate(' + axis.pos[x] + 'px,' + axis.pos[y] + 'px)';
  }

  // ── 칸 차지 ────────────────────────────────────────────────
  const onBoard = (x, y) => x >= 0 && x < N && y >= 0 && y < N;
  const monsterAt = (x, y) => monsters.find(m => m.x === x && m.y === y) || null;
  // 플레이어와 몬스터가 물체다. 둘 다 남의 칸으로는 못 들어간다
  const occupied = (x, y) => (player.x === x && player.y === y) || !!monsterAt(x, y);

  // ── 전투 ───────────────────────────────────────────────────
  const adjacent4 = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1;

  // 때리는 쪽이 뻗고 → 잠깐 뒤에 맞는 쪽이 반응한다. 둘이 동시에 일어나면
  // 누가 누구를 쳤는지 안 읽힌다
  async function strike(attacker, target, dx, dy, amount) {
    const mine = phaseId;
    lunge(attacker.el, dx, dy);
    await sleep(tuning.hit);
    // 기다리는 사이에 `다시` 를 눌렀으면 새 판을 때리게 된다
    if (phaseId !== mine || over) return;
    damage(target, amount);
  }

  function damage(target, amount) {
    target.hp = Math.max(0, target.hp - amount);
    renderHp(target);
    floatDamage(target, amount);
    // transform 은 자리 잡는 데 쓰고 있어서 흔들 수가 없다. class 를 다시 붙여 재생한다
    target.el.classList.remove('hit');
    void target.el.offsetWidth;
    target.el.classList.add('hit');
  }

  // 입은 피해를 머리 위에 띄운다. 칸 크기를 따라가되 너무 작아지지는 않게 한다
  function floatDamage(ent, amount) {
    const el = document.createElement('span');
    el.className = 'dmg';
    el.textContent = '-' + amount;
    el.style.fontSize = Math.max(11, Math.round(innerCell * 0.3)) + 'px';
    ent.el.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // ── 몬스터 ─────────────────────────────────────────────────
  function outerCells() {
    const out = [];
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (!isInner(x, y)) out.push({ x, y });
      }
    }
    return out;
  }

  function addMonster(x, y) {
    const el = document.createElement('div');
    el.className = 'token monster';
    el.innerHTML = tokenInner('goblin.png', '고블린');
    boardEl.appendChild(el);
    place(el, x, y);

    const m = {
      kind: 'goblin', x, y,
      hp: GOBLIN_MAX_HP, maxHp: GOBLIN_MAX_HP, atk: GOBLIN_ATK,
      agi: GOBLIN_AGI, seq: nextSeq++, el,
    };
    monsters.push(m);
    renderHp(m);
    countEl.textContent = monsters.length;
    return m;
  }

  function spawnMonster() {
    const free = outerCells().filter(c => !occupied(c.x, c.y));
    if (!free.length) return false;               // 외부에 빈 칸이 없다
    const spot = free[Math.floor(Math.random() * free.length)];
    addMonster(spot.x, spot.y);
    return true;
  }

  // 고블린: 매 턴 플레이어를 향해 상하좌우 한 칸.
  // 차이가 큰 축을 먼저 시도하고, 막혔으면 다른 축으로. 둘 다 막혔으면 그 자리에 선다.
  // 가로세로 차이가 같으면 가로를 먼저 본다 (규칙에 없어서 정한 것)
  function goblinStep(m) {
    const dx = player.x - m.x, dy = player.y - m.y;
    const h = dx ? [Math.sign(dx), 0] : null;
    const v = dy ? [0, Math.sign(dy)] : null;
    const tries = Math.abs(dx) >= Math.abs(dy) ? [h, v] : [v, h];

    for (const t of tries) {
      if (!t) continue;
      const nx = m.x + t[0], ny = m.y + t[1];
      // 판 밖, 다른 몬스터, 플레이어가 있는 칸으로는 못 간다
      if (!onBoard(nx, ny) || occupied(nx, ny)) continue;
      m.x = nx; m.y = ny;
      place(m.el, nx, ny);
      return;
    }
  }

  // 고블린의 한 턴. 이동과 공격은 따로 도는 페이즈가 아니라 둘 중 하나만 고른다.
  // 붙어 있으면 때리고, 아니면 다가간다. 다가가서 붙은 턴에는 때리지 않는다
  // 때렸으면 true. 부른 쪽은 그만큼 뜸을 들인다
  async function goblinAct(m) {
    if (adjacent4(m, player)) {
      await strike(m, player, Math.sign(player.x - m.x), Math.sign(player.y - m.y), m.atk);
      return true;
    }
    goblinStep(m);
    return false;
  }

  function killMonster(m) {
    const i = monsters.indexOf(m);
    if (i < 0) return;
    monsters.splice(i, 1);
    m.el.remove();
    countEl.textContent = monsters.length;
  }

  // ── 페이즈 ─────────────────────────────────────────────────
  // 민첩이 높은 쪽부터 행동한다. 같으면 생성된 순서대로.
  // 플레이어의 민첩이 제일 높으면 지금까지처럼 플레이어가 먼저다
  function actOrder() {
    return [player, ...monsters].sort((a, b) => b.agi - a.agi || a.seq - b.seq);
  }

  // 플레이어의 행동은 입력할 때 정해지지만, 실제로 나가는 것은 제 차례가 왔을 때다.
  // 그 사이에 더 빠른 몬스터가 칸을 채우거나 비울 수 있어서 다시 확인한다.
  //
  // 공격이 하나 끝날 때마다 ATTACK_GAP 만큼 쉰다. 이동은 안 쉰다 - 여러 마리가
  // 같이 걸어오는 것은 읽는 데 지장이 없고, 마리 수만큼 기다리면 한 판이 너무 길다.
  // 페이즈가 도는 동안 입력은 막는다. 안 막으면 연출 중에 다음 페이즈가 겹쳐 든다
  async function runPhase(playerAction) {
    busy = true;
    const mine = ++phaseId;
    try {
      for (const actor of actOrder()) {
        if (over || phaseId !== mine) return;
        let struck;
        if (actor === player) {
          struck = await playerAction();
        } else if (actor.hp > 0 && monsters.includes(actor)) {
          struck = await goblinAct(actor);
        }
        if (phaseId !== mine) return;
        if (struck) {
          await sleep(tuning.gap);
          if (phaseId !== mine) return;
        }
      }
      movesEl.textContent = ++moves;
      if (player.hp <= 0) over = true;
      else spawnMonster();
      updateStatus();
    } finally {
      if (phaseId === mine) busy = false;
    }
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const canStep = (dx, dy) => {
    const x = player.x + dx, y = player.y + dy;
    return isInner(x, y) && !occupied(x, y);
  };

  // 플레이어의 행동 1: 이동. 벽이거나 다른 물체가 있으면 페이즈가 시작도 안 한다
  function move(dx, dy) {
    if (busy || over || !canStep(dx, dy)) return;
    return runPhase(() => {
      // 더 빠른 몬스터가 먼저 그 칸에 들어왔으면 이동은 불발이다.
      // 페이즈는 이미 시작했으므로 행동만 날아간다
      if (!canStep(dx, dy)) return false;
      player.x += dx; player.y += dy;
      place(player.el, player.x, player.y);
      return false;               // 이동은 뜸 들일 것이 없다
    });
  }

  // 플레이어의 행동 2: 공격. 바로 옆 한 칸을 친다.
  // 빈 칸을 쳐도 행동을 쓴 것이므로 페이즈는 넘어간다. 규칙에 없어서 정했다.
  // '이동 못하면 공격' 으로 묶지 않고 입력을 따로 둔 것은, 나중에 궁수·마법사처럼
  // 떨어져서 치는 직업이 들어오면 이동 가능 여부와 공격이 무관해지기 때문이다
  function attack(dx, dy) {
    if (busy || over) return;
    return runPhase(async () => {
      const target = monsterAt(player.x + dx, player.y + dy);
      if (!target) {
        lunge(player.el, dx, dy);   // 헛치는 것도 보여 준다
        return false;
      }
      await strike(player, target, dx, dy, PLAYER_ATK);
      if (target.hp <= 0) killMonster(target);
      return true;
    });
  }

  const DIR_NAME = { '1,0': 'right', '-1,0': 'left', '0,1': 'down', '0,-1': 'up' };
  function lunge(el, dx, dy) {
    for (const n of ['up', 'down', 'left', 'right']) el.classList.remove('atk-' + n);
    void el.offsetWidth;
    el.classList.add('atk-' + DIR_NAME[dx + ',' + dy]);
  }

  // 쓰러지거나 갇히면 어떤 입력도 안 먹는다. 승패 규칙이 아직 없어서
  // 멈춘 것인지 고장인지 화면상 구분이 안 되므로 상태를 적어 준다
  function updateStatus() {
    renderHp(player);
    playEl.classList.toggle('over', over);
    if (over) {
      hintEl.textContent = '쓰러졌다. 다시 를 눌러라';
      return;
    }
    const canMove = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
      const x = player.x + dx, y = player.y + dy;
      return isInner(x, y) && !occupied(x, y);
    });
    hintEl.textContent = canMove
      ? HINT_DEFAULT
      : '갇혔다. 다시 를 눌러라';
  }

  // ── 입력 ───────────────────────────────────────────────────
  // 방향은 하나, 길이로 이동과 공격을 가른다.
  //   스와이프: 짧으면 이동, 길면 공격
  //   키:       짧게 누르면 이동, 길게 누르고 있으면 공격
  const DIRS = {
    arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
  };

  // 짧게 눌렀는지 길게 눌렀는지는 뗄 때까지 알 수 없다. 그래서 이동은 keyup 에,
  // 공격은 HOLD_MS 가 지나는 순간에 낸다. 한 번 누르면 둘 중 하나만 나간다
  let holdKey = null;

  window.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    const dir = DIRS[key];
    if (!dir) return;
    e.preventDefault();
    if (e.repeat || holdKey || busy) return;   // 자동 반복·동시 입력·연출 중에는 안 받는다
    holdKey = { key, dir, fired: false };
    holdKey.timer = setTimeout(() => {
      holdKey.fired = true;
      attack(dir[0], dir[1]);
    }, HOLD_MS);
  });

  window.addEventListener('keyup', e => {
    const key = e.key.toLowerCase();
    if (!holdKey || holdKey.key !== key) return;
    clearTimeout(holdKey.timer);
    if (!holdKey.fired) move(holdKey.dir[0], holdKey.dir[1]);
    holdKey = null;
  });

  // 창을 벗어나면 누르고 있던 키의 keyup 을 못 받는다. 잡힌 채로 두면 입력이 죽는다
  window.addEventListener('blur', () => {
    if (!holdKey) return;
    clearTimeout(holdKey.timer);
    holdKey = null;
  });

  // 스와이프는 판이 아니라 화면 전체에서 받는다
  let start = null;
  window.addEventListener('pointerdown', e => {
    // 상단 바 조작은 그대로 둔다. target 이 Element 가 아닐 수도 있어 closest 유무를 먼저 본다
    if (e.target && e.target.closest && e.target.closest('a,button')) return;
    if (busy) return;                     // 연출이 도는 중에는 안 받는다
    start = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointerup', e => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;

    const horizontal = Math.abs(dx) > Math.abs(dy);
    const reach = horizontal ? Math.abs(dx) : Math.abs(dy);
    if (reach < SWIPE_MOVE) return;

    const dir = horizontal ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
    if (reach >= SWIPE_ATTACK) attack(dir[0], dir[1]);
    else move(dir[0], dir[1]);
  });
  window.addEventListener('pointercancel', () => { start = null; });

  // ── 시작 / 다시 ────────────────────────────────────────────
  function reset() {
    phaseId++;                  // 돌고 있던 페이즈는 여기서 손을 뗀다
    busy = false;
    for (const m of monsters) m.el.remove();
    for (const d of boardEl.querySelectorAll('.dmg')) d.remove();
    monsters.length = 0;
    nextSeq = 1;                // 0 은 플레이어 몫이다
    player.x = START.x; player.y = START.y;
    player.hp = player.maxHp;
    renderHp(player);
    over = false;
    moves = 0;
    movesEl.textContent = '0';
    countEl.textContent = '0';
    place(player.el, player.x, player.y);
    for (let i = 0; i < START_MONSTERS; i++) spawnMonster();
    updateStatus();
  }

  document.getElementById('reset').addEventListener('click', reset);
  window.addEventListener('resize', layout);

  buildBoard();
  layout();
  reset();

  // 판을 원하는 상태로 놓고 확인하기 위한 손잡이. 스폰이 랜덤이라
  // 이것이 없으면 "고블린이 다가오는가" 를 재현성 있게 볼 수가 없다
  window.__t = {
    monsters, player, place, addMonster, updateStatus, renderHp,
    isOver: () => over,
    attack, killMonster, actOrder,
    isBusy: () => busy,
    // 연출을 기다리지 않고 검사하려면 간격을 0 으로 둔다
    setTiming: t => { if ('gap' in t) tuning.gap = t.gap; if ('hit' in t) tuning.hit = t.hit; },
    limits: { PLAYER_MAX_HP, GOBLIN_MAX_HP, GOBLIN_ATK, PLAYER_ATK,
              SWIPE_MOVE, SWIPE_ATTACK, HOLD_MS, PLAYER_AGI, GOBLIN_AGI, TINY_TOKEN,
              HIT_DELAY, ATTACK_GAP },
  };
})();
</script>
</body>
</html>
