<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>슬라이드 — Game Prototype</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFD400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  /* 위험 표시가 보일 때의 불투명도. 칸 색과 딱지가 같은 값을 쓴다 */
  :root{--danger-alpha:.6;}
  body{
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }

  .play{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--canvas);}

  .topbar{
    display:flex;align-items:center;gap:var(--s3);
    padding:var(--s3) var(--s4);
    padding-top:calc(env(safe-area-inset-top,0px) + var(--s3));
    border-bottom:1px solid var(--hairline);
  }
  .topbar .name{color:var(--ink);font-weight:700;font-size:15px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .stat{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;
    white-space:nowrap;}
  .topbar .stat b{color:var(--ink);}
  .topbar .spacer{flex:1;}
  /* 단추 글자가 두 줄로 접히면 상단 바가 통째로 두 배가 된다 */
  .topbar .btn{white-space:nowrap;flex:none;}
  /* 좁아지면 덜 급한 것부터 뺀다. 다 넣으려 들면 `다시` 가 화면 밖으로 나간다.
     순서: 몬스터 수 → 이름 → 턴. 체력·레벨·코인과 단추는 끝까지 남긴다 */
  @media (max-width:560px){
    .topbar{gap:var(--s2);padding-left:var(--s3);padding-right:var(--s3);}
    .topbar .stat.opt-mon{display:none;}
  }
  @media (max-width:470px){
    .topbar .name{display:none;}
    .topbar .stat.opt-turn{display:none;}
  }

  /* 상단 바 아래는 통째로 두 영역이다: 게임(1:1)과 정보(7:9 / 9:7).
     둘을 붙이면 16:9(가로) 또는 9:16(세로) 가 된다. 그 상자를 화면 안에
     최대로 넣고 가운데 둔다. 크기는 layout() 이 px 로 넣어 준다 */
  .split{
    flex:1;min-height:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  /* DOM 은 게임 → 정보 순이다. 가로면 그대로 왼쪽·오른쪽,
     세로면 뒤집어 정보가 위, 게임이 아래 */
  .split.wide{flex-direction:row;}
  .split:not(.wide){flex-direction:column-reverse;}

  /* 판이 들어갈 자리. 1:1 정사각. 판은 그 안에서 여백을 두고 가운데 선다 */
  .stage{flex:none;display:flex;align-items:center;justify-content:center;padding:var(--s3);}

  /* 정보영역. 가로면 7:9 에 카드 2x3, 세로면 9:7 에 카드 3x2.
     카드 비율(3.5:3 / 3:3.5)을 지키느라 칸보다 조금 작게 잡고 가운데 둔다 */
  .info{
    flex:none;display:grid;place-items:center;
    gap:var(--gap,8px);padding:var(--gap,8px);
  }
  .split.wide .info{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);}
  .split:not(.wide) .info{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);}
  .card{
    width:var(--cw,120px);height:var(--ch,100px);
    box-sizing:border-box;
    background:var(--surface-soft);border-radius:var(--r-sm);
    box-shadow:inset 0 0 0 1px var(--hairline);
    padding:calc(var(--gap,8px) * .9);
    overflow:hidden;
    /* 카드 안 글자는 다 이 크기의 배수다. 카드가 작아지면 같이 줄어든다 */
    font-size:clamp(8px, calc(var(--u,60px) * .17), 13px);
  }
  /* 인스펙터. 탭한 블럭의 속을 판보다 크게 적는다.
     판 위 블럭은 칸 크기에 매여 있어 이름을 넣을 자리가 없다 */
  .inspect{display:flex;flex-direction:column;}
  .ins-head{display:flex;align-items:center;gap:.55em;flex:none;margin-bottom:.5em;}
  .ins-face{
    width:2.8em;height:2.8em;flex:none;
    object-fit:contain;image-rendering:pixelated;
    border-radius:var(--r-sm);
  }
  .ins-title{min-width:0;}
  /* 명칭은 카드에서 제일 큰 글씨다. 무엇을 보고 있는지가 먼저 읽혀야 한다 */
  .ins-name{
    display:block;color:var(--ink);font-weight:800;font-size:1.35em;line-height:1.15;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ins-kind{display:block;color:var(--muted);font-size:.85em;margin-top:.15em;}
  /* 스텟과 업그레이드를 한 통에 담아 같이 넘긴다. 따로 굴리면 카드가 좁을 때
     둘 다 반쪽만 보인다 */
  .ins-body{flex:1;min-height:0;overflow:auto;scrollbar-width:none;}
  .ins-body::-webkit-scrollbar{display:none;}
  /* 스텟은 자리가 되면 두 줄씩 나란히 세운다. 여섯 줄을 한 줄씩 쌓으면
     업그레이드가 카드 밖으로 밀려 스크롤해야만 보인다.
     auto-fit 이라 카드가 좁아지면 저절로 한 줄씩으로 돌아온다 */
  .ins-rows{
    list-style:none;margin:0;padding:0;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5em,1fr));
    gap:.3em .9em;
  }
  .ins-sub{
    color:var(--muted);font-size:.8em;font-weight:700;letter-spacing:.06em;
    margin:.7em 0 .35em;
  }
  .ins-ups{list-style:none;margin:0;padding:0;display:grid;gap:.4em;}
  .ins-ups li{display:flex;align-items:center;gap:.45em;min-width:0;}
  .ins-ups i{
    width:1.9em;height:1.9em;flex:none;border-radius:.2em;
    background-position:center;background-size:contain;background-repeat:no-repeat;
    image-rendering:pixelated;
  }
  .ins-ups span{min-width:0;}
  .ins-ups b{
    display:block;color:var(--ink);font-size:.95em;font-weight:700;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ins-ups small{
    display:block;color:var(--muted);font-size:.8em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ins-ups .up-none{color:var(--muted);font-size:.9em;}
  .ins-rows li{
    display:flex;align-items:baseline;justify-content:space-between;gap:.6em;
    color:var(--muted);font-size:.95em;
  }
  .ins-rows li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ins-rows b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;}
  /* 지금 보고 있는 블럭. 안쪽 그림자는 이미 쓰고 있어서 바깥 선으로 알린다 */
  .token.picked{outline:2px solid var(--brand-yellow);outline-offset:1px;}

  /* 아직 무엇을 담을지 안 정한 자리 */
  .card.empty{background:none;box-shadow:inset 0 0 0 1px var(--hairline);opacity:.45;}

  /* 칸을 반올림하다 보면 몇 px 넘칠 때가 있다. 줄어들게 두면 가로만 깎여
     판이 정사각이 아니게 된다. 넘치면 넘치는 대로 둔다 */
  .board{position:relative;flex:none;}

  /* 칸은 배경으로만 깔린다. 움직이는 것(플레이어/몬스터)은 그 위에 얹는다 */
  .cell{position:absolute;border-radius:3px;}
  .cell.outer{background:#161613;box-shadow:inset 0 0 0 1px var(--hairline);}
  .cell.inner{
    background:var(--surface-soft);box-shadow:inset 0 0 0 1px var(--hairline);
    /* 아래 DANGER_FADE 와 같은 시간. 둘이 어긋나면 다 사라지기 전에 움직인다 */
    transition:background .09s, box-shadow .09s;
    display:flex;align-items:center;justify-content:center;
    /* 글자 크기는 칸을 따라가야 해서 layout() 이 px 로 넣어 준다 */
  }
  /* 다음 턴에 맞을 수 있는 빈 칸. 지금 몬스터가 바로 옆에 붙어 있는 칸이다.
     보일 때도 60% 로만 올린다. 위험은 알려 주되 판을 덮지는 않게.
     칸에 opacity 를 걸면 안 된다. 바탕(surface-soft)까지 같이 흐려져 이웃 칸보다
     어두워진다. 붉은 색만 겹쳐 깔고 그 색을 반투명으로 둔다 */
  .cell.inner.danger{
    background:
      linear-gradient(rgba(56,32,29,var(--danger-alpha)), rgba(56,32,29,var(--danger-alpha))),
      var(--surface-soft);
    box-shadow:inset 0 0 0 1px rgba(107,50,43,var(--danger-alpha));
  }

  /* 움직이는 동안에는 위험 표시를 지운다. 옮기기 전 상태를 그대로 두면
     이미 틀린 그림을 보고 있게 되고, 칸마다 따로 바뀌면 어지럽다.
     페이즈 시작에 흐려 두고, 끝에 새로 계산해서 다시 띄운다 */
  .board.hide-danger .cell.inner.danger{
    background:var(--surface-soft);box-shadow:inset 0 0 0 1px var(--hairline);
  }
  .board.hide-danger .hit-mark{opacity:0;}

  /* 그 칸으로 갔을 때 받을 피해. 타격 이펙트 그림 위에 숫자를 얹는다.
     예전에는 별 두 겹을 clip-path 로 잘라 만들었는데, 그림 한 장이면 끝난다 */
  .hit-mark{
    display:none;
    width:2.2em;height:2.2em;
    align-items:center;justify-content:center;
    background:url(images/icon/hit.png) center/contain no-repeat;
    opacity:var(--danger-alpha);
    transition:opacity .09s;
    pointer-events:none;
  }
  .hit-mark i{
    font-style:normal;font-weight:800;line-height:1;
    color:#fff;
    /* 붉은 이펙트 위에 흰 글씨라 검은 테를 둘러야 읽힌다 */
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
      0 1px 2px rgba(0,0,0,.9);
  }
  .cell.danger .hit-mark{display:flex;}
  /* 플레이어 것은 토큰 한가운데에 얹는다. 그대로 서 있으면 얼마나 맞는지를 알린다 */
  .player .hit-mark{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    font-size:var(--mark, 14px);
    z-index:2;
  }
  .player.threatened .hit-mark{display:flex;}

  /* 내부 6*6 의 테두리. 플레이어가 갈 수 있는 범위가 보이게 */
  .fence{
    position:absolute;pointer-events:none;border-radius:var(--r-sm);
    border:2px solid var(--brand-yellow-deep);opacity:.55;
  }

  .token{
    position:absolute;left:0;top:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--r-sm);
    font-weight:800;line-height:1;
    will-change:transform;
  }
  /* transform 은 자리를 잡는 데 쓰고 있다. 등장 효과는 안쪽 스프라이트에만 건다 */
  /* 스프라이트가 주인공이라 바닥판은 옅게 깔고 테두리로만 누가 있는지 알린다 */
  .player{
    background:radial-gradient(ellipse at 50% 78%,
      rgba(255,212,0,.42), rgba(255,212,0,.10) 55%, transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,212,0,.55);
    transition:transform .13s cubic-bezier(.2,.7,.3,1),
               width .13s, height .13s, left .13s, top .13s, font-size .13s;
  }
  .monster{
    background:radial-gradient(ellipse at 50% 78%,
      rgba(255,138,115,.28), rgba(255,138,115,.07) 55%, transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,138,115,.35);
    transition:transform .13s cubic-bezier(.2,.7,.3,1),
               width .13s, height .13s, left .13s, top .13s, font-size .13s;
  }
  .monster .glyph{animation:pop .18s ease-out;}
  @keyframes pop{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}

  /* 원본이 64px 이고 그려지는 크기가 40~70px 이라 1:1 언저리다. 픽셀 아트는
     이 배율에서 pixelated 가 또렷하다 (예전 384px 원본일 때는 10배 축소라
     픽셀을 왕창 버려서 실루엣이 깨졌고, 그때는 부드럽게 줄이는 쪽이 나았다).
     아래쪽은 체력 표시 자리로 비워 둔다 */
  .token .glyph{
    position:absolute;left:0;top:0;width:100%;height:65%;
    object-fit:contain;object-position:center bottom;
    image-rendering:pixelated;
    pointer-events:none;
  }
  /* 체력바 안에 숫자를 얹는다. 따로 줄을 만들면 칸이 좁아 둘 다 못 읽는다 */
  .token .hp{
    position:absolute;left:6%;right:6%;bottom:14%;height:.38em;
    background:rgba(0,0,0,.62);border-radius:.1em;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .token .hp i{position:absolute;left:0;top:0;height:100%;width:100%;
    transition:width .32s cubic-bezier(.2,.7,.3,1);}
  .token .hp b{
    position:relative;font-size:.3em;line-height:1;font-weight:700;
    color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.95);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .player .hp i{background:#1E5E20;}
  .monster .hp i{background:#A8352A;}
  /* 좌상단에 공격력. 칼 아이콘 위에 숫자를 얹는다 */
  .token .stat-mark{
    position:absolute;left:4%;top:2%;
    display:flex;
    font-size:.26em;line-height:1;font-weight:800;
    font-variant-numeric:tabular-nums;
    pointer-events:none;
  }
  .token .stat-mark i{
    font-style:normal;
    width:2.6em;height:2.6em;
    /* 은색 아이콘을 19px 로 줄여 쓴다. 뒤에 오는 스프라이트가 어두울 때도
       밝을 때도 있어서, 조금 올려 주고 검은 그림자로 윤곽을 잡는다 */
    filter:brightness(1.35) drop-shadow(0 0 1px rgba(0,0,0,.95));
    display:flex;align-items:center;justify-content:center;
    background-repeat:no-repeat;background-position:center;background-size:contain;
    /* 64px 아이콘을 16px 남짓으로 줄여 쓴다. 4배 축소라 부드럽게 줄이는 편이 낫다
       (캐릭터 스프라이트는 1:1 언저리라 pixelated 를 쓴다. 배율이 달라 선택도 다르다) */
    color:#fff;
    /* 은색 아이콘 위에 흰 글씨라 검은 테를 둘러야 읽힌다 */
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
      0 1px 2px rgba(0,0,0,.9);
  }
  /* 어떤 그림이 뜨는지는 상태가 정한다. 한 번(칼 하나) / 두 번(칼 둘) */
  .token .stat-mark .a.atk-single{background-image:url(images/icon/attack1.png);}
  .token .stat-mark .a.atk-double{background-image:url(images/icon/attack2.png);}

  /* 외부 띠의 토큰은 17px 쯤이라 숫자가 안 읽힌다. 바만 남긴다 */
  /* 경험치. 체력 바로 밑에 얇은 하늘색 띠. 수치는 안 적는다 */
  .player .exp{
    position:absolute;left:6%;right:6%;bottom:4%;height:.15em;
    background:rgba(0,0,0,.55);border-radius:.08em;overflow:hidden;
  }
  .player .exp i{
    display:block;height:100%;width:0;
    background:#6FC6F5;
    transition:width .25s cubic-bezier(.2,.7,.3,1);
  }
  .token.tiny .exp{display:none;}

  /* 가진 카드의 그림. 체력바 바로 위에 한 줄.
     판 위 블럭과 모달 안 블럭이 같은 규칙을 탄다. 크기는 em 이라 블럭이
     작아지면 같이 작아진다 */
  .player .skill-row{
    --sk:.23em;                    /* 그림 한 칸. 숫자도 이걸 따라간다 */
    /* 체력바 위. 띄우는 높이는 체력바 높이(.38em)를 넘겨야 한다.
       그림 크기(--sk)로 띄우면 그림을 줄일 때 체력바 위로 내려앉는다 */
    position:absolute;left:4%;right:4%;bottom:calc(14% + .44em);
    height:var(--sk);
    display:flex;justify-content:flex-start;align-items:flex-end;gap:.07em;
    pointer-events:none;
  }
  .player .skill-row i{
    position:relative;width:var(--sk);height:var(--sk);flex:none;
    background:center/contain no-repeat;
    image-rendering:pixelated;
  }
  /* 누적 횟수는 그림 위 오른아래 귀퉁이에. 옆에 세우면 이웃 그림과 겹친다.
     검은 딱지를 깔면 그림만 한 크기가 되어 그림을 다 덮으므로, 맨 글씨에
     검은 윤곽만 둘러 그림이 사이로 비쳐 보이게 한다 */
  .player .skill-row i b{
    position:absolute;right:-.1em;bottom:-.12em;
    font-size:calc(var(--sk) * .62);line-height:1;font-weight:800;
    color:var(--brand-yellow);
    -webkit-text-stroke:.06em rgba(8,8,6,.95);
    paint-order:stroke fill;
    text-shadow:0 0 .12em #000;
  }
  /* 외부 띠의 작은 토큰에서는 감춘다. 딱지·숫자와 같은 이유다 */
  .token.tiny .skill-row{display:none;}

  .token.tiny .glyph{height:86%;}
  .token.tiny .hp{left:12%;right:12%;bottom:6%;height:.22em;}
  /* 경험치 바는 플레이어만 있다. 몬스터는 체력 바를 바닥에 그대로 둔다 */
  .monster .hp{bottom:5%;}
  .monster .glyph{height:72%;}
  .token.tiny .hp b{display:none;}
  .token.tiny .stat-mark{display:none;}
  /* 토큰의 transform 은 자리를 잡는 데 쓰고 있다. 그래서 연출은 전부
     안쪽 .glyph 를 움직이거나, 토큰에는 transform 아닌 속성만 쓴다 */
  /* 피격은 붉게 번쩍인다. 흰빛으로 밝히면 무엇에 맞았는지가 아니라
     그냥 밝아진 것으로 보인다. 붉은 겹을 한 장 덮어 색으로 알린다 */
  .token.hit{animation:hit .25s ease-out;}
  @keyframes hit{0%,100%{filter:none;}25%{filter:brightness(1.5) saturate(1.4);}}
  .token.hit::after,
  .d-cell.hit::after{
    content:'';position:absolute;inset:0;border-radius:inherit;
    background:rgba(255,52,32,.55);
    /* 기본을 0 으로 둬야 한다. 애니메이션이 끝나면 이 값으로 돌아오는데,
       안 적어 두면 기본값 1 이라 붉은 겹이 그대로 남는다 */
    opacity:0;
    animation:hitred .25s ease-out;
    pointer-events:none;
  }
  @keyframes hitred{0%,100%{opacity:0;}25%{opacity:1;}}

  /* 피격: 빠르게 조금 작아졌다 본래 크기로 */
  .token.hit .glyph{animation:struck .25s ease-out;}
  @keyframes struck{0%,100%{transform:scale(1);}40%{transform:scale(.72);}}

  /* 입은 피해를 머리 위에 띄운다. 토큰 안이 아니라 판에 직접 붙인다.
     토큰은 will-change:transform 으로 쌓임 맥락을 만들기 때문에, 그 안에 두면
     z-index 를 아무리 올려도 옆 토큰 위로 못 올라온다 */
  .dmg{
    position:absolute;z-index:50;
    font-weight:800;line-height:1;white-space:nowrap;pointer-events:none;
    /* 스프라이트 위든 남의 체력바 위든 읽혀야 해서 검은 테를 둘러 준다 */
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
      0 2px 4px rgba(0,0,0,.95);
    animation:dmgfloat .9s ease-out forwards;
  }
  .dmg.on-player{color:#FF6B57;}

  /* 경험치 구슬. 데미지 숫자와 같은 이유로 판에 직접 붙인다.
     토큰 안에 두면 그 토큰의 쌓임 맥락에 갇혀 옆 칸으로 못 나온다 */
  .orb{
    position:absolute;z-index:45;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #DFFBFF, #45D7F2 55%, #0E86A8);
    box-shadow:0 0 .35em rgba(69,215,242,.9);
    pointer-events:none;
    transition:transform var(--orb) cubic-bezier(.3,.6,.4,1);
  }
  /* 열 개를 뭉친 큰 구슬. 커지기만 하는 것이 아니라 더 밝게 빛난다 */
  .orb.big{
    background:radial-gradient(circle at 35% 30%, #FFFFFF, #7BE7FF 50%, #1AA6CE);
    box-shadow:0 0 .5em rgba(123,231,255,1);
  }
  /* 코인. 경험치 구슬과 같은 길로 날아오지만 그림이 다르다.
     둥근 테와 푸른 빛을 걷어 내야 그림이 그림으로 읽힌다 */
  .orb.coin{
    background:url(images/icon/coin.png) center/contain no-repeat;
    border-radius:0;
    box-shadow:none;
    filter:drop-shadow(0 0 .2em rgba(255,196,0,.85));
  }
  .orb.coin.big{filter:drop-shadow(0 0 .35em rgba(255,214,0,1));}
  .dmg.on-monster{color:#FFD400;}
  /* 띄우는 거리는 em 으로 잡는다. % 는 글자 상자(16px 남짓) 기준이라
     아무리 키워도 몇 px 밖에 안 올라간다.
     제일 잘 보이는 구간이 제 칸 안(머리 근처)에 오도록 잡았다. 칸 밖으로 나가는
     것은 흐려진 뒤라, 위 칸 토큰의 체력바와 겹쳐 읽히는 일이 없다 */
  @keyframes dmgfloat{
    0%  {opacity:0;transform:translate(-50%, .3em)  scale(.8);}
    12% {opacity:1;transform:translate(-50%,-.2em)  scale(1.15);}
    55% {opacity:1;transform:translate(-50%,-1.1em) scale(1);}
    100%{opacity:0;transform:translate(-50%,-2.4em) scale(1);}
  }

  /* 공격: 치는 방향으로 조금 나갔다 제자리로 */
  .token.atk-up    .glyph{animation:lunge-up .2s ease-out;}
  .token.atk-down  .glyph{animation:lunge-down .2s ease-out;}
  .token.atk-left  .glyph{animation:lunge-left .2s ease-out;}
  .token.atk-right .glyph{animation:lunge-right .2s ease-out;}
  @keyframes lunge-up   {0%,100%{transform:translateY(0);}45%{transform:translateY(-28%);}}
  @keyframes lunge-down {0%,100%{transform:translateY(0);}45%{transform:translateY(28%);}}
  @keyframes lunge-left {0%,100%{transform:translateX(0);}45%{transform:translateX(-28%);}}
  @keyframes lunge-right{0%,100%{transform:translateX(0);}45%{transform:translateX(28%);}}
  .play.over .board{filter:grayscale(.6) brightness(.7);}

  /* 퀘스트는 정보영역의 카드 한 장이다 */
  .quest{display:flex;flex-direction:column;}
  .q-head{display:flex;align-items:center;gap:.5em;margin-bottom:.6em;flex:none;}
  .q-step{
    color:var(--brand-yellow);background:#161613;border-radius:var(--r-pill);
    font-size:.85em;font-weight:700;letter-spacing:.06em;padding:.25em .7em;flex:none;
  }
  .q-note{color:var(--muted);font-size:.85em;margin:0;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .q-list{list-style:none;margin:0;padding:0;display:grid;gap:.4em;
    align-content:start;flex:1;min-height:0;overflow:auto;
    scrollbar-width:none;}
  .q-list::-webkit-scrollbar{display:none;}
  .q-item{
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;
    column-gap:.6em;row-gap:.3em;
  }
  .q-check{
    width:1.15em;height:1.15em;border-radius:.3em;flex:none;
    box-shadow:inset 0 0 0 1px var(--hairline);background:var(--surface);
    position:relative;
  }
  /* 체크 표시는 가상 요소로. 다 깬 줄만 보인다 */
  .q-check::after{
    content:'✓';position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:.85em;font-weight:800;color:var(--on-brand);opacity:0;
  }
  .q-name{color:var(--body);font-size:1em;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .q-num{color:var(--muted);font-size:.92em;font-variant-numeric:tabular-nums;flex:none;}
  /* 한 번에 끝나는 항목은 막대가 체크와 같은 말을 반복한다. 여러 번 걸리는 것만 둔다 */
  .q-item.binary .q-track{display:none;}
  .q-item.binary{row-gap:0;}
  .q-track{
    grid-column:2 / -1;height:.3em;border-radius:2px;
    background:var(--surface);box-shadow:inset 0 0 0 1px var(--hairline);overflow:hidden;
  }
  .q-track i{display:block;height:100%;width:0;border-radius:2px;
    background:var(--brand-yellow);transition:width .35s cubic-bezier(.2,.7,.3,1);}

  .q-item.done .q-check{background:#4CD07A;box-shadow:none;}
  .q-item.done .q-check::after{opacity:1;}
  .q-item.done .q-name{color:var(--ink);}
  .q-item.done .q-track i{background:#4CD07A;}

  /* 묶음을 다 깬 순간 잠깐 알린다. 다음으로 넘어가기 전에 눈이 따라올 시간을 준다 */
  .quest.done{animation:qdone .5s ease-out;}
  @keyframes qdone{0%,100%{transform:none;}30%{transform:scale(1.035);}}
  .quest.all-done .q-step{background:var(--brand-yellow);color:var(--on-brand);}

  /* 드래프트: 게임판과 같은 격자에 같은 블럭.
     칸은 정사각, 간격과 모서리도 판과 같은 비율로 맞춰 조작이 같게 느껴지도록 */
  .draft{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    background:rgba(8,8,6,.86);
    padding:var(--s4);
  }
  /* 브라우저 기본 [hidden]{display:none} 은 .draft{display:flex} 에 진다 */
  .draft[hidden]{display:none;}
  .draft-inner{width:100%;max-width:360px;}
  .d-head{
    color:var(--brand-yellow);font-weight:800;font-size:15px;
    text-align:center;margin:0 0 var(--s4);letter-spacing:.02em;
  }

  .draft-grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    /* 판의 간격/칸 = 2/52 = 0.0385 를 그대로. grid 의 % 간격은 격자 전체 너비
       기준이라, 칸 기준 비율로 환산하면 0.0385/3.077 = 1.25% 다 */
    gap:1.25%;
    width:100%;margin:0 auto;position:relative;
  }
  .d-up{grid-area:1/2;} .d-left{grid-area:2/1;}
  .d-mid{grid-area:2/2;} .d-right{grid-area:2/3;} .d-down{grid-area:3/2;}

  .d-cell{
    aspect-ratio:1;                /* 판의 칸과 같은 정사각 */
    border-radius:6%;              /* 판은 3px/52px ≈ 6% */
    background:var(--surface-soft);
    box-shadow:inset 0 0 0 1px var(--hairline);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2%;padding:6%;
    text-align:center;position:relative;
  }
  /* 고를 수 있는 칸은 판의 플레이어 칸처럼 노란 테를 두른다 */
  .d-card{box-shadow:inset 0 0 0 1px rgba(255,212,0,.55);}
  .d-card b{color:var(--ink);font-size:14px;font-weight:800;line-height:1.15;}
  .d-card span{color:var(--muted);font-size:10px;line-height:1.25;}
  /* 기술 카드의 그림. 스프라이트와 같이 픽셀을 살려 키운다.
     그림·이름·설명 셋이 한 칸에 들어가야 해서 그림은 3분의 1로 묶어 둔다 */
  .d-card .d-img{
    width:34%;aspect-ratio:1;flex:none;
    background:center/contain no-repeat;
    image-rendering:pixelated;
  }
  .d-card i{
    font-style:normal;color:var(--brand-yellow);font-size:10px;font-weight:700;
    letter-spacing:.1em;
  }
  /* 리롤 칸은 판의 바깥 칸처럼 어둡게. 잠겨 있다 */
  .d-down{
    background:#161613;box-shadow:inset 0 0 0 1px var(--hairline);opacity:.45;
  }
  .d-down b{color:var(--body);font-size:13px;font-weight:700;}
  .d-down span{color:var(--muted);font-size:10px;}

  /* 가운데는 판에 서 있는 그 블럭 그대로 */
  .d-mid{padding:0;background:var(--surface-soft);}
  .draft-token{
    position:static;width:100%;height:100%;
    background:radial-gradient(ellipse at 50% 78%,
      rgba(255,212,0,.42), rgba(255,212,0,.10) 55%, transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,212,0,.55);
    border-radius:6%;
  }

  /* 고른 카드에서 공격력 쪽으로 날아가는 수치 */
  .d-fly{
    position:absolute;z-index:2;
    font-weight:800;line-height:1;white-space:nowrap;
    color:#FFC8BC;
    text-shadow:-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    pointer-events:none;
    transition:transform var(--fly) cubic-bezier(.4,.05,.3,1), opacity var(--fly);
  }
  /* 그림이 날아갈 때는 글씨가 아니라 그림이다 */
  .d-fly.img{
    background:center/contain no-repeat;
    image-rendering:pixelated;
  }
  /* 도착해서 사라진 뒤, 실제로 붙는 순간 */
  .stat-mark i.bump,
  .draft-token.bump,
  .player .skill-row.bump{animation:statbump .26s ease-out;}
  @keyframes statbump{
    0%{transform:scale(1);}
    35%{transform:scale(1.55);filter:brightness(1.8);}
    100%{transform:scale(1);}
  }

  /* 고른 카드는 맞은 것처럼 움츠러들며 붉게 번쩍인다 (토큰의 피격과 같은 결) */
  .d-cell.hit{animation:cardhit .26s ease-out;}
  @keyframes cardhit{0%,100%{transform:scale(1);}40%{transform:scale(.9);}}

  /* 레벨업 알림. 모달보다 먼저 뜬다 */
  .levelup{
    position:fixed;inset:0;z-index:110;
    display:flex;align-items:center;justify-content:center;
    background:rgba(8,8,6,.72);
    pointer-events:none;
  }
  .levelup[hidden]{display:none;}
  .levelup b{
    color:var(--brand-yellow);font-weight:800;letter-spacing:.14em;
    font-size:34px;line-height:1;
    text-shadow:0 2px 0 #7a5f00, 0 0 24px rgba(255,212,0,.55);
    animation:levelpop .9s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes levelpop{
    0%  {opacity:0;transform:scale(.6);}
    18% {opacity:1;transform:scale(1.12);}
    32% {transform:scale(1);}
    78% {opacity:1;transform:scale(1);}
    100%{opacity:0;transform:scale(1.06);}
  }

  .d-hint{color:var(--muted);font-size:11px;text-align:center;margin:var(--s4) 0 0;}

  .hint{
    color:var(--muted);font-size:.92em;line-height:1.45;text-align:center;margin:0;
  }
  .card.hint-card{display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
  <main class="play">
    <div class="topbar">
      <a class="btn btn-secondary btn-sm" href="../index.html">← 목록</a>
      <span class="name">슬라이드</span>
      <span class="spacer"></span>
      <span class="stat">Lv <b id="level">1</b></span>
      <span class="stat">코인 <b id="coin">0</b></span>
      <span class="stat">체력 <b id="hp">10/10</b></span>
      <span class="stat opt-turn">턴 <b id="moves">0</b></span>
      <span class="stat opt-mon">몬스터 <b id="mcount">0</b></span>
      <button class="btn btn-secondary btn-sm" id="sound" type="button"
              aria-label="소리 끄기" aria-pressed="true">🔊</button>
      <button class="btn btn-secondary btn-sm" id="reset" type="button">다시</button>
    </div>

    <div class="split" id="split">
      <div class="stage" id="stage">
        <div class="board" id="board"></div>
      </div>

      <!-- 정보영역. 카드 여섯 장. 가로면 2x3, 세로면 3x2 -->
      <div class="info" id="info">
        <section class="card quest" id="quest">
          <div class="q-head">
            <span class="q-step" id="qstep">퀘스트 1/3</span>
            <p class="q-note" id="qnote"></p>
          </div>
          <ul class="q-list" id="qlist"></ul>
        </section>
        <section class="card inspect" id="inspect"></section>
        <div class="card hint-card">
          <p class="hint" id="hint">스와이프 · 방향키 / WASD — 빈 칸이면 이동, 몬스터면 공격</p>
        </div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
      </div>
    </div>

    <div class="levelup" id="levelup" hidden><b>LEVEL UP</b></div>

    <div class="draft" id="draft" hidden>
      <div class="draft-inner">
        <p class="d-head" id="dhead">레벨 2 — 하나 고르기</p>
        <!-- 게임판과 같은 격자·같은 블럭. 조작도 같은 방향 입력이다 -->
        <div class="draft-grid" id="dgrid">
          <div class="d-cell d-card d-up" data-slot="0"></div>
          <div class="d-cell d-card d-left" data-slot="1"></div>
          <div class="d-cell d-mid" id="dmid"></div>
          <div class="d-cell d-card d-right" data-slot="2"></div>
          <div class="d-cell d-down"><b>리롤</b><span>잠김</span></div>
        </div>
        <p class="d-hint">위 · 왼쪽 · 오른쪽 으로 고른다 (스와이프 / WASD / 방향키)</p>
      </div>
    </div>

  </main>

<script>
(() => {
  'use strict';

  // ── 규칙 상수 ───────────────────────────────────────────────
  const N = 11;                 // 필드 11*11
  const BORDER = 3;             // 상하좌우 각 3줄이 외부 (0,1,2 와 8,9,10)
  const MIN = BORDER;           // 내부 최소 좌표 = 3
  const MAX = N - 1 - BORDER;   // 내부 최대 좌표 = 7  → 내부 5*5
  const START = { x: 5, y: 5 }; // 내부 5*5 (3~7) 의 가운데
  // 체력·피해량은 규칙에 숫자가 없어서 정한 값이다
  // ── 살아 있는 것들 ─────────────────────────────────────────
  // 플레이어든 몬스터든 공·방·체를 갖는다. 종류마다 다른 것은 전부 이 표에만 있다.
  // 새 종류를 넣을 때 손댈 곳이 한 군데다
  const BEINGS = {
    player: {
      name: '플레이어', img: 'player.png',
      atk: 10, maxHp: 100, agi: 10,
    },
    goblin: {
      name: '고블린', img: 'goblin.png',
      atk: 2, maxHp: 12, agi: 8, exp: 10, coin: 5,
      step: stepToward,
    },
    rider: {
      name: '고블린 라이더', img: 'goblin_rider.png',
      atk: 5, maxHp: 24, agi: 9, exp: 15, coin: 10,  // 말을 탔으니 걸어오는 고블린보다 빠르다
      step: stepKnight,
    },
  };

  // 최종 공격력 = 공격자의 공격력. 1 보다 작아지면 1 로 친다
  // (지금은 깎을 것이 없지만, 공격력 감쇠 같은 것이 붙으면 여기서 처리한다)
  const damageTo = attacker => Math.max(1, attacker.atk);

  // 레벨업 소리. 짧은 음 셋을 위로 쌓아 올린다
  function playLevelUp() {
    if (!soundOn) return;
    const ctx = ensureAudio();
    if (!ctx) return;

    // 도-미-솔-도. 한 음씩 조금씩 늦게 시작해 올라가는 느낌을 낸다
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((hz, i) => {
      const at = ctx.currentTime + i * 0.085;
      const dur = i === notes.length - 1 ? 0.42 : 0.16;

      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(hz, at);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(0.22, at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0008, at + dur);

      osc.connect(gain).connect(ctx.destination);
      osc.start(at);
      osc.stop(at + dur + 0.02);
    });
  }

  // ── 드래프트 카드 ──────────────────────────────────────────
  // 구현된 것만 여기 둔다. 규칙의 나머지 카드는 아직 효과가 안 정해졌다.
  //   누적형 : 다시 나오고, 고를 때마다 수치가 쌓인다
  //   기능형 : `once`. 한 번 배우면 다시 안 나온다.
  //            `need` 가 있으면 그 기술을 배운 뒤에야 나온다 (연계)
  // `bump` 는 닿았을 때 무엇이 튀느냐다. 날아가는 것은 늘 그림이고 닿는 곳도 늘

  function ensureAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;                       // 오래된 브라우저·검사 환경
    if (!audioCtx) audioCtx = new AC();
    // 소리는 사용자가 건드린 뒤에만 난다. 공격은 늘 입력 뒤라 여기서 풀어도 된다
    if (audioCtx.state === 'suspended') audioCtx.resume();

  // 휘두르는 소리. 감쇠하는 잡음을 대역 필터로 위에서 아래로 훑는다
  function playSwing(pitch) {
    if (!soundOn) return;
    const ctx = ensureAudio();
    if (!ctx) return;

    const dur = 0.17;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const fade = 1 - i / data.length;
      data[i] = (Math.random() * 2 - 1) * fade * fade;
    }

    const src = ctx.createBufferSource();
    src.buffer = buf;

    const band = ctx.createBiquadFilter();
    band.type = 'bandpass';
    band.Q.value = 1.1;
    band.frequency.setValueAtTime(1600 * pitch, ctx.currentTime);
    band.frequency.exponentialRampToValueAtTime(360 * pitch, ctx.currentTime + dur);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0008, ctx.currentTime + dur);

    src.connect(band).connect(gain).connect(ctx.destination);
    src.start();
    src.stop(ctx.currentTime + dur);
  }

  // 칸 크기는 남은 공간에 맞춰 정수 px 로 내림. 소수 px 이면 격자가 흔들린다
  function computeAxis(side, gap) {
    let units = 0;
    for (let i = 0; i < N; i++) units += cellScale(i);
    const C = Math.max(12, Math.floor((side - gap * (N - 1)) / units));

    const size = [], pos = [];
    let p = 0;
    for (let i = 0; i < N; i++) {
      // 제일 바깥 칸은 C 의 0.2 배라 작은 판에서는 1px 밑으로 내려간다. 3px 로 받친다
      size.push(Math.max(3, Math.round(C * cellScale(i))));
      pos.push(p);
      p += size[i] + gap;
    }
    return { size, pos, total: p - gap };
  }

  // 게임(1:1) 과 정보(7:9 / 9:7) 를 붙이면 16:9 다. 세로면 9:16 이고 위아래가 된다.
  //   가로: 게임 9u x 9u + 정보 7u x 9u = 16u x 9u
  //   세로: 정보 9u x 7u 위, 게임 9u x 9u 아래 = 9u x 16u
  // 그 상자를 화면 안에 최대로 넣는 u 를 구하고, 나머지는 다 그 배수다
  const SPLIT_MIN = 120;        // 이보다 작아지면 아무것도 안 읽힌다
  function layoutSplit() {
    const W = splitEl.clientWidth, H = splitEl.clientHeight;
    if (!W || !H) return;
    // 가로/세로는 화면비로 가른다. 정사각이면 가로로 친다
    const wide = W >= H;
    splitEl.classList.toggle('wide', wide);

    // 긴 쪽을 16, 짧은 쪽을 9 로 맞춘다. 둘 중 먼저 막히는 쪽이 크기를 정한다
    const side = Math.max(SPLIT_MIN, Math.floor(
      wide ? Math.min(H, W * 9 / 16) : Math.min(W, H * 9 / 16)));
    const unit = side / 9;

    stageEl.style.width = side + 'px';
    stageEl.style.height = side + 'px';

    const iw = wide ? side * 7 / 9 : side;
    const ih = wide ? side : side * 7 / 9;
    infoEl.style.width = Math.round(iw) + 'px';
    infoEl.style.height = Math.round(ih) + 'px';

    // 카드는 칸을 꽉 채우지 않는다. 간격과 테두리 여백을 뺀 칸 안에
    // 정해진 비율(가로 3.5:3, 세로 3:3.5) 로 넣고 가운데 둔다.
    // 칸을 꽉 채우면 간격만큼 비율이 틀어진다
    const g = Math.max(3, Math.round(unit * 0.16));
    const cols = wide ? 2 : 3, rows = wide ? 3 : 2;
    const cellW = (iw - g * 2 - g * (cols - 1)) / cols;
    const cellH = (ih - g * 2 - g * (rows - 1)) / rows;
    const ar = wide ? 3.5 / 3 : 3 / 3.5;
    const cw = Math.max(20, Math.min(cellW, cellH * ar));

    infoEl.style.setProperty('--gap', g + 'px');
    infoEl.style.setProperty('--cw', Math.floor(cw) + 'px');
    infoEl.style.setProperty('--ch', Math.floor(cw / ar) + 'px');
    infoEl.style.setProperty('--u', unit + 'px');
  }

      c.style.top = axis.pos[y] + 'px';
      if (c.classList.contains('inner')) {
        c.style.fontSize = Math.round(axis.size[x] * HIT_MARK_SCALE) + 'px';
      }
    }

    const span = axis.pos[MAX] + axis.size[MAX] - axis.pos[MIN];
    fenceEl.style.left = (axis.pos[MIN] - gapPx / 2 - 2) + 'px';
    fenceEl.style.top = (axis.pos[MIN] - gapPx / 2 - 2) + 'px';
    fenceEl.style.width = (span + 4) + 'px';
    fenceEl.style.height = (span + 4) + 'px';

    place(player.el, player.x, player.y);
    for (const m of monsters) place(m.el, m.x, m.y);
    renderDanger();   // 딱지 글자 크기가 칸을 따라가야 해서 여기서도 부른다
  }

  // 자리와 크기를 같이 잡는다. 띠를 넘나들면 칸 크기가 바뀌므로 둘을 떼면 안 된다.
  // 토큰은 늘 정사각형이다. 옆 띠의 칸은 좁고 길쭉해서, 칸을 꽉 채우면
  // 고블린이 길쭉한 알약 바닥에 처박힌 꼴이 된다. 짧은 변에 맞춰 칸 가운데 둔다.
  // 가운데로 미는 것은 left/top 으로 한다. transform 은 칸의 원점을 그대로 가리켜야
  // 자리 계산이 한 군데로 모인다
  function place(el, x, y) {
    const w = axis.size[x], h = axis.size[y];
    const s = Math.min(w, h);
    el.style.width = s + 'px';
    el.style.height = s + 'px';
    el.style.left = ((w - s) / 2) + 'px';
    el.style.top = ((h - s) / 2) + 'px';
    el.style.fontSize = Math.max(7, Math.floor(s * 0.55)) + 'px';
    el.classList.toggle('tiny', s < TINY_TOKEN);   // 외부 띠에서는 숫자가 안 읽힌다
    el.style.transform = 'translate(' + axis.pos[x] + 'px,' + axis.pos[y] + 'px)';
  }

  // ── 칸 차지 ────────────────────────────────────────────────
  const onBoard = (x, y) => x >= 0 && x < N && y >= 0 && y < N;
  const monsterAt = (x, y) => monsters.find(m => m.x === x && m.y === y) || null;
  // 플레이어와 몬스터가 물체다. 둘 다 남의 칸으로는 못 들어간다
  const occupied = (x, y) => (player.x === x && player.y === y) || !!monsterAt(x, y);

  // ── 전투 ───────────────────────────────────────────────────
  const adjacent4 = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1;

  // 때리는 쪽이 뻗고 → 잠깐 뒤에 맞는 쪽이 반응한다. 둘이 동시에 일어나면
  // 누가 누구를 쳤는지 안 읽힌다
  async function strike(attacker, target, dx, dy) {
    const mine = phaseId;
    lunge(attacker.el, dx, dy);
    await sleep(tuning.hit);
    // 기다리는 사이에 `다시` 를 눌렀으면 새 판을 때리게 된다
    if (phaseId !== mine || over) return;
    damage(target, damageTo(attacker));
  }

  function damage(target, amount) {
    target.hp = Math.max(0, target.hp - amount);
    renderHp(target);
    floatDamage(target, amount);
    // transform 은 자리 잡는 데 쓰고 있어서 흔들 수가 없다. class 를 다시 붙여 재생한다
    target.el.classList.remove('hit');
    void target.el.offsetWidth;
    target.el.classList.add('hit');
  }

  // 입은 피해를 머리 위에 띄운다. 칸 크기를 따라가되 너무 작아지지는 않게 한다.
  // 토큰이 아니라 판에 붙여야 다른 토큰 위로 올라온다
  function floatDamage(ent, amount) {
    const el = document.createElement('span');
    el.className = 'dmg ' + (ent === player ? 'on-player' : 'on-monster');
    el.textContent = '-' + amount;
    el.style.fontSize = Math.max(11, Math.round(innerCell * 0.34)) + 'px';
    el.style.left = (axis.pos[ent.x] + axis.size[ent.x] / 2) + 'px';
    // 칸 위끝이 아니라 조금 아래에서 시작한다. 그래야 제일 진할 때가
    // 제 칸 안(머리 언저리)에 오고, 위 칸 체력바 위에서 읽히지 않는다
    el.style.top = (axis.pos[ent.y] + axis.size[ent.y] * 0.3) + 'px';
    boardEl.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // ── 몬스터 ─────────────────────────────────────────────────
  function outerCells() {
    const out = [];
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (!isInner(x, y)) out.push({ x, y });
      }
    }
    return out;
  }

  function addMonster(x, y, kind = 'goblin') {
    const spec = BEINGS[kind];
    const el = document.createElement('div');
    el.className = 'token monster ' + kind;
    el.innerHTML = tokenInner(spec.img, spec.name);
    boardEl.appendChild(el);
    place(el, x, y);

    const m = makeBeing(kind, x, y);
    m.el = el;
    monsters.push(m);
    renderHp(m);
    countEl.textContent = monsters.length;
    return m;
  }

  function spawnMonster(kind) {
    const free = outerCells().filter(c => !occupied(c.x, c.y));
    if (!free.length) return false;               // 외부에 빈 칸이 없다
    const spot = free[Math.floor(Math.random() * free.length)];
    addMonster(spot.x, spot.y, kind);
    return true;
  }

  // 퀘스트가 정한 대로만 내보낸다. 퀘스트에 spawn 이 없으면 아무것도 안 나온다
  function questSpawn() {
    const g = group();
    if (!g || !g.spawn) return;
    if (groupSpawned >= g.spawn.max) return;
    if (groupTurns % g.spawn.every !== 0) return;
    if (spawnMonster(g.spawn.kind)) groupSpawned++;
  }

  const dist = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
  const canEnter = (x, y) => onBoard(x, y) && !occupied(x, y);

  // 고블린: 매 턴 플레이어를 향해 상하좌우 한 칸.
  // 차이가 큰 축을 먼저 시도하고, 막혔으면 다른 축으로. 둘 다 막혔으면 그 자리에 선다.
  // 가로세로 차이가 같으면 가로를 먼저 본다 (규칙에 없어서 정한 것)
  // 실제로 한 칸 옮겼으면 true. 막혀서 제자리면 false.
  // 부르는 쪽이 "걸음이 났는지" 를 알아야 그만큼 뜸을 들일 수 있다
  function stepToward(m) {
    const dx = player.x - m.x, dy = player.y - m.y;
    const h = dx ? [Math.sign(dx), 0] : null;
    const v = dy ? [0, Math.sign(dy)] : null;
    const tries = Math.abs(dx) >= Math.abs(dy) ? [h, v] : [v, h];

    for (const t of tries) {
      if (!t) continue;
      const nx = m.x + t[0], ny = m.y + t[1];
      // 판 밖, 다른 몬스터, 플레이어가 있는 칸으로는 못 간다
      if (!onBoard(nx, ny) || occupied(nx, ny)) continue;
      m.x = nx; m.y = ny;
      place(m.el, nx, ny);
      return true;
    }
    return false;
  }

  // 고블린 라이더: 체스의 나이트처럼 움직인다. 사이에 무엇이 있든 뛰어넘는다.
  // 갈 수 있는 여덟 칸 중에서 "플레이어에 인접" 에 가장 가까운 칸을 고른다.
  // 인접이 목표라 거리 1 이 최고점이다. 거리 0 은 플레이어가 서 있어 갈 수 없다.
  // 점수가 같으면 아래 차례에서 먼저 나온 칸을 쓴다 (규칙에 없어서 정한 것)
  const KNIGHT = [
    [1, -2], [2, -1], [2, 1], [1, 2],
    [-1, 2], [-2, 1], [-2, -1], [-1, -2],
  ];

  function stepKnight(m) {
    let best = null, bestScore = Infinity;
    for (const [dx, dy] of KNIGHT) {
      const nx = m.x + dx, ny = m.y + dy;
      if (!canEnter(nx, ny)) continue;
      const score = Math.abs(dist({ x: nx, y: ny }, player) - 1);
      if (score < bestScore) { bestScore = score; best = [nx, ny]; }
    }
    if (!best) return false;              // 여덟 칸이 다 막혔으면 그 자리에 선다
    m.x = best[0]; m.y = best[1];
    place(m.el, m.x, m.y);
    return true;
  }

  // 몬스터의 한 턴. 이동과 공격은 따로 도는 페이즈가 아니라 둘 중 하나만 고른다.
  // 붙어 있으면 때리고, 아니면 다가간다. 다가가서 붙은 턴에는 때리지 않는다
  // 무엇을 했는지 돌려준다: 'attack' | 'move' | null.
  // 부른 쪽이 그에 맞는 만큼 뜸을 들인다. 아무것도 못 했으면 기다릴 것도 없다
  async function monsterAct(m) {
    if (adjacent4(m, player)) {
      await strike(m, player, Math.sign(player.x - m.x), Math.sign(player.y - m.y));
      return 'attack';
    }
    return BEINGS[m.kind].step(m) ? 'move' : null;
  }

  // 잡았을 때 딸려 오는 것들. 때려서든 밀어내서든 같다
  // 1 당 구슬 하나. 열 개가 모이면 큰 구슬 하나로 바꾼다.
  // 큰 것을 앞에 두어 먼저 날아가게 한다
  function orbSplit(n) {
    const out = [];
    for (let i = 0; i < Math.floor(n / ORB_BIG); i++) out.push(ORB_BIG);
    for (let i = 0; i < n % ORB_BIG; i++) out.push(1);
    return out;
  }

  const cellCenter = (x, y) => ({
    cx: axis.pos[x] + axis.size[x] / 2,
    cy: axis.pos[y] + axis.size[y] / 2,
  });

  // 이번 페이즈에 돌고 있는 전리품 연출. 행동이 끝나면 여기 것들을 다 기다린다
  let dropShow = [];
  const drainDrops = () => Promise.all(dropShow.splice(0));

  // 떨어지는 것들. 나는 길은 같고 그림과 받는 곳만 다르다.
  // 새 전리품이 생기면 여기 한 줄이다
  const DROPS = {
    exp:  { cls: '',      take: n => addXp(n) },
    coin: { cls: ' coin', take: n => addCoin(n) },
  };

  // 죽은 자리에서 사방으로 튀고, 잠시 뒤 플레이어에게 빨려 든다.
  // 하나가 닿을 때마다 그만큼 오른다. 그래서 바가 끊어서 차오른다
  async function spawnDrop(x, y, amount, kind) {
    const drop = DROPS[kind];
    if (!tuning.orb || amount <= 0) { drop.take(amount); return; }

    const mine = phaseId;
    const spin = Math.random() * Math.PI * 2;
    const vals = orbSplit(amount);
    const from = cellCenter(x, y);
    const unit = Math.max(5, Math.round(innerCell * 0.17));

    const orbs = vals.map((v, i) => {
      const el = document.createElement('i');
      const size = v > 1 ? Math.round(unit * 1.8) : unit;
      el.className = 'orb' + (v > 1 ? ' big' : '') + drop.cls;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.left = (from.cx - size / 2) + 'px';
      el.style.top = (from.cy - size / 2) + 'px';
      el.style.setProperty('--orb', tuning.orb + 'ms');
      boardEl.appendChild(el);
      // 사방으로. 고르게 벌린 뒤 조금만 흔든다. 다 같은 각이면 줄 세운 것처럼 보인다.
      // 시작 각을 무리마다 굴린다. 경험치와 코인이 한 자리에서 같이 튀는데
      // 둘 다 0 에서 시작하면 두 줄이 포개져 하나처럼 보인다
      const a = spin + (i / vals.length) * Math.PI * 2 + Math.random() * 0.7;
      const r = innerCell * (0.45 + Math.random() * 0.35);
      return { el, v, dx: Math.cos(a) * r, dy: Math.sin(a) * r };
    });

    // 한 프레임 뒤에 밀어야 전환이 걸린다. 같은 프레임에 넣으면 순간이동한다
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    if (phaseId !== mine) { orbs.forEach(o => o.el.remove()); return; }
    for (const o of orbs) o.el.style.transform = 'translate(' + o.dx + 'px,' + o.dy + 'px)';
    await sleep(tuning.orb);
    if (phaseId !== mine) { orbs.forEach(o => o.el.remove()); return; }

    // 빨려 드는 곳은 지금의 플레이어 자리다. 흩어지는 사이에 밀고 갔을 수도 있다
    const to = cellCenter(player.x, player.y);
    // 조금씩 늦게 출발시켜 하나씩 닿게 한다. 다 같이 닿으면 바가 한 번에 튄다
    const step = Math.min(30, 150 / orbs.length);
    orbs.forEach((o, i) => {
      o.el.style.transitionDelay = Math.round(i * step) + 'ms';
      o.el.style.transform =
        'translate(' + (to.cx - from.cx) + 'px,' + (to.cy - from.cy) + 'px) scale(.45)';
    });
    for (let i = 0; i < orbs.length; i++) {
      await sleep(i === 0 ? tuning.orb : step);
      if (phaseId !== mine) { orbs.slice(i).forEach(o => o.el.remove()); return; }
      orbs[i].el.remove();
      drop.take(orbs[i].v);      // 닿는 그 순간에 오른다
    }
  }

  function defeat(m) {
    groupKills[m.kind] = (groupKills[m.kind] || 0) + 1;
    killMonster(m);
    // 전리품은 닿을 때 들어온다. 연출이 없으면 그 자리에서 들어온다.
    // 증가율은 경험치에만 먹인다. 코인을 올려 주는 카드는 아직 없다
    const ps = [
      spawnDrop(m.x, m.y, expGain(m.exp), 'exp'),
      spawnDrop(m.x, m.y, m.coin, 'coin'),
    ];
    dropShow.push(...ps);
    return Promise.all(ps);
  }

  // 공격 방향으로 붙어 있는 적을 한 칸씩 밀어낸다. 판 밖으로 나가면 죽는다.
  // 사이가 뜨면 거기서 끊긴다. 미는 힘이 앞 놈을 타고 전해지는 것이라,
  // 빈 칸을 건너뛰고 저 뒤의 놈까지 밀 수는 없다.
  // 기능형이라 쌓이지 않는다. 두 번 가질 일도 없다
  function pushLine(dx, dy) {
    if (!player.cards.has('push')) return false;
    const dist = 1;

    const line = [];
    for (let x = player.x + dx, y = player.y + dy; onBoard(x, y); x += dx, y += dy) {
      const m = monsterAt(x, y);
      if (!m) break;              // 빈 칸에서 끊긴다. 그 너머는 안 밀린다
      line.push(m);
    }
    if (!line.length) return false;

    // 먼 놈부터 옮긴다. 다 같은 방향으로 같은 칸만큼 가므로 서로 밟을 일은 없지만,
    // 먼 쪽을 먼저 비워 두는 편이 읽기 쉽다
    for (const m of line.reverse()) {
      const nx = m.x + dx * dist, ny = m.y + dy * dist;
      if (!onBoard(nx, ny)) { defeat(m); continue; }
      m.x = nx; m.y = ny;
      place(m.el, nx, ny);
    }
    return true;
  }

  function killMonster(m) {
    const i = monsters.indexOf(m);
    if (i < 0) return;
    monsters.splice(i, 1);
    m.el.remove();
    countEl.textContent = monsters.length;
    if (picked === m) renderInspect();   // 보던 놈이 죽었다. 플레이어로 돌아온다
  }

  // ── 퀘스트 진행 ────────────────────────────────────────────
  const group = () => (allDone ? null : QUEST_GROUPS[groupIndex]);

  function itemProgress(it) {
    if (it.type === 'dir') return groupDirs.has(it.dir) ? 1 : 0;
    return Math.min(groupKills[it.kind] || 0, it.goal);
  }
  const itemDone = it => itemProgress(it) >= itemGoal(it);
  const groupDone = () => {
    const g = group();
    return !!g && g.items.every(itemDone);
  };

  // 묶음마다 항목 수가 다르다. 줄을 새로 만들고 나서 값만 갈아 끼운다
  function buildQuestRows() {
    qListEl.textContent = '';
    qRows.length = 0;
    const g = group();
    if (!g) return;
    for (const it of g.items) {
      const li = document.createElement('li');
      li.className = 'q-item';
      li.innerHTML =
        '<span class="q-check"></span>' +
        '<span class="q-name"></span>' +
        '<span class="q-num"></span>' +
        '<span class="q-track"><i></i></span>';
      li.querySelector('.q-name').textContent = it.title;
      if (itemGoal(it) === 1) li.classList.add('binary');
      qListEl.appendChild(li);
      qRows.push({ it, li, num: li.querySelector('.q-num'), fill: li.querySelector('.q-track i') });
    }
  }

  function renderQuest() {
    if (allDone) {
      questEl.classList.add('all-done');
      questEl.classList.remove('done');
      qStepEl.textContent = '완료';
      qNoteEl.textContent = '모든 퀘스트를 깼다. 더 나올 몬스터는 없다';
      return;
    }
    const g = group();
    qStepEl.textContent = '퀘스트 ' + (groupIndex + 1) + '/' + QUEST_GROUPS.length;
    qNoteEl.textContent = g.spawn
      ? g.note + ' · 남은 출현 ' + Math.max(0, g.spawn.max - groupSpawned) + '마리'
      : g.note;
    for (const row of qRows) {
      const now = itemProgress(row.it), goal = itemGoal(row.it);
      row.num.textContent = now + '/' + goal;
      row.fill.style.width = (100 * now / goal) + '%';
      row.li.classList.toggle('done', now >= goal);
    }
  }

  function startGroup(i) {
    groupIndex = i;
    groupTurns = 0;
    groupSpawned = 0;
    for (const k of Object.keys(groupKills)) delete groupKills[k];
    groupDirs.clear();
    allDone = i >= QUEST_GROUPS.length;
    questEl.classList.remove('done', 'all-done');
    buildQuestRows();
    renderQuest();
  }

  // 깬 순간을 잠깐 보여 주고 다음으로 넘긴다. 페이즈 안에서 기다리므로
  // 그동안 입력은 막혀 있다
  async function advanceQuest() {
    const mine = phaseId;
    questEl.classList.add('done');
    renderQuest();
    await sleep(QUEST_CLEAR_MS);
    if (phaseId !== mine) return;
    startGroup(groupIndex + 1);
  }

  // ── 경험치 ─────────────────────────────────────────────────
  // 남는 경험치는 다음 레벨로 넘긴다. 한 번에 여러 레벨이 오를 수도 있다
  // 증가율을 먹인 실제 경험치. 반올림이다. 15 * 1.1 = 16.5 → 17
  const expGain = amount => Math.round(amount * (1 + player.expBonus / 100));

  // 구슬 하나가 닿을 때마다 이만큼씩 오른다. 증가율은 이미 먹은 뒤다
  function addXp(n) {
    player.xp += n;
    while (player.xp >= expNeeded(player.level)) {
      player.xp -= expNeeded(player.level);
      player.level++;
      pendingDrafts++;          // 레벨당 한 번씩. 두 레벨 오르면 두 번 고른다
    }
    renderExp();
  }

  // 증가율은 여기 한 곳에서 먹인다. 경험치가 어디서 들어오든 같이 적용된다
  function gainExp(amount) { addXp(expGain(amount)); }

  // 코인 하나가 닿을 때마다 이만큼씩 는다. 쓸 곳은 아직 없다
  function addCoin(n) {
    player.purse += n;
    renderCoin();
  }

  function renderCoin() {
    coinEl.textContent = player.purse;
    if (inspectTarget() === player) renderInspect();
  }

  // ── 인스펙터 ───────────────────────────────────────────────
  // 탭한 블럭의 속을 정보영역 카드 한 장에 적는다.
  // 판 위 블럭은 칸 크기에 매여 있어 이름을 넣을 자리가 없다. 이름은 여기서 준다
  let picked = null;            // 고른 몬스터. null 이면 플레이어를 본다

  // 보던 몬스터가 죽으면 저절로 플레이어로 돌아온다.
  // 죽은 놈을 계속 들고 있으면 없는 체력을 적게 된다
  function inspectTarget() {
    if (picked && !monsters.includes(picked)) picked = null;
    return picked || player;
  }

  function inspect(being) {
    picked = being === player ? null : being;
    renderInspect();
  }

  // 이름은 줄어들고 값은 안 줄어든다. 좁은 카드에서 값이 먼저 잘리면 소용이 없다
  const insRow = (label, value) =>
    '<li><span>' + label + '</span><b>' + value + '</b></li>';

  // 드래프트로 가진 것들. 아이콘·이름·설명을 그대로 옮긴다.
  // 표(`DRAFT_CARDS`) 차례로 훑으므로 고른 순서가 아니라 늘 같은 차례로 선다
  function upgradeList() {
    const got = DRAFT_CARDS.filter(c => player.cards.has(c.id));
    if (!got.length) return '<ul class="ins-ups"><li class="up-none">아직 없다</li></ul>';
    return '<ul class="ins-ups">' + got.map(c => {
      const n = player.cards.get(c.id);
      // 누적형만 몇 번 쌓였는지 적는다. 기능형은 늘 한 번이라 안 적는다.
      // 판 위 블럭의 기술 줄과 같은 규칙이다
      const times = c.once ? '' : ' ' + roman(n);
      return '<li>'
        + '<i style="background-image:url(images/' + c.img + ')"></i>'
        + '<span><b>' + c.title + times + '</b><small>' + c.note + '</small></span>'
        + '</li>';
    }).join('') + '</ul>';
  }

  function renderInspect() {
    const it = inspectTarget();
    const spec = BEINGS[it.kind];
    const mine = it === player;
    const rows =
      insRow('체력', Math.max(0, it.hp) + '/' + it.maxHp)
      + insRow('공격', it.atk)
      + insRow('민첩', it.agi)
      + (mine
        ? insRow('레벨', it.level)
          + insRow('경험치', it.xp + '/' + expNeeded(it.level))
          + insRow('코인', it.purse)
        : insRow('드랍 코인', it.coin) + insRow('드랍 경험치', it.exp));

    inspectEl.innerHTML =
      '<div class="ins-head">'
      + '<img class="ins-face" src="images/' + spec.img + '" alt="">'
      + '<span class="ins-title">'
      +   '<b class="ins-name">' + spec.name + '</b>'
      +   '<span class="ins-kind">' + (mine ? '플레이어' : '몬스터') + '</span>'
      + '</span>'
      + '</div>'
      + '<div class="ins-body">'
      +   '<ul class="ins-rows">' + rows + '</ul>'
      // 업그레이드는 플레이어만 갖는다. 몬스터에는 줄 자체를 안 낸다
      +   (mine ? '<p class="ins-sub">업그레이드</p>' + upgradeList() : '')
      + '</div>';

    // 지금 보고 있는 블럭에 테를 두른다. 카드와 판이 서로를 가리켜야 한다
    for (const el of boardEl.querySelectorAll('.token.picked')) el.classList.remove('picked');
    if (it.el) it.el.classList.add('picked');
  }

  function renderExp() {
    expFillEl.style.width = (100 * player.xp / expNeeded(player.level)) + '%';
    levelEl.textContent = player.level;
    if (inspectTarget() === player) renderInspect();
  }

  // ── 드래프트 ───────────────────────────────────────────────
  // 지금 나올 수 있는 카드. 기능형은 배우고 나면 빠지고, 앞 기술을 배워야
  // 열리는 것은 그때까지 안 나온다. 누적형(`once` 없음)은 늘 남아 있다
  function availableCards() {
    return DRAFT_CARDS.filter(c =>
      (!c.once || !player.cards.has(c.id))
      && (!c.need || player.cards.has(c.need)));
  }

  // 카드가 모자라면 같은 카드가 여러 칸에 온다.
  // 카드가 늘면 손 안 대고 저절로 서로 다른 카드가 차오른다
  function pickCards(n) {
    const out = [];
    const pool = availableCards();
    if (!pool.length) return out;   // 더 가질 것이 없다. 누적형이 있어 실제로는 안 온다
    let bag = [];
    while (out.length < n) {
      if (!bag.length) bag = [...pool];
      out.push(bag.splice(Math.floor(Math.random() * bag.length), 1)[0]);
    }
    return out;
  }

  // 카드 한 장을 실제로 갖는다. 세는 곳이 여기 하나뿐이라 아이콘 줄의 로마자와
  // "가졌나" 판정이 어긋날 수가 없다
  function takeCard(card) {
    player.cards.set(card.id, (player.cards.get(card.id) || 0) + 1);
    card.apply(player);
    // 인스펙터의 업그레이드 줄과 공격력이 같이 바뀐다
    if (inspectTarget() === player) renderInspect();
  }

  const DRAFT_DIRS = { '0,-1': 0, '-1,0': 1, '1,0': 2 };   // 위·왼쪽·오른쪽

  // 가운데 칸에는 판에 서 있는 그 블럭을 그대로 세운다.
  // 같은 class 를 쓰므로 스프라이트·공방 딱지·체력·경험치가 저절로 같은 모양이 된다
  // 가진 카드의 그림을 체력바 바로 위에 한 줄로 깐다. 표 순서라 자리가 안 흔들린다.
  // 누적형은 몇 번 쌓였는지 로마자로 적고, 기능형은 늘 한 번이라 안 적는다
  function renderSkillRow(tok) {
    const row = tok.querySelector('.skill-row');
    row.innerHTML = '';
    for (const card of DRAFT_CARDS) {
      const n = player.cards.get(card.id) || 0;
      if (!n || !card.img) continue;
      const i = document.createElement('i');
      i.style.backgroundImage = 'url(images/' + card.img + ')';
      // 누적형만 몇 번 쌓였는지 적는다. 기능형은 늘 한 번이라 안 적는다
      if (!card.once) i.innerHTML = '<b>' + roman(n) + '</b>';
      row.appendChild(i);
    }
  }

  // 판 위 블럭과 모달 안 블럭이 같은 것을 보여 준다. 모달이 안 떠 있으면
  // 판 위 것 하나뿐이라 저절로 하나만 그린다
  function renderSkills() {
    for (const row of document.querySelectorAll('.player .skill-row')) {
      renderSkillRow(row.parentElement);
    }
  }

  function renderDraftPlayer() {
    dMidEl.innerHTML =
      // 공방 딱지는 tokenInner 안에 이미 들어 있다. 여기서 하나 더 붙이면
      // 빈 딱지가 진짜 딱지 위에 겹쳐 덮는다 (칼 그림이 가려진다)
      '<div class="token player draft-token">'
      + tokenInner(BEINGS.player.img, BEINGS.player.name)
      + '<span class="skill-row"></span>'
      + '<span class="exp"><i></i></span>'
      + '</div>';
    const tok = dMidEl.firstElementChild;
    // 토큰 안의 크기는 em 이라 font-size 하나로 판과 같은 비율이 된다
    tok.style.fontSize = Math.max(9, Math.round(dMidEl.clientWidth * 0.55)) + 'px';
    const hp = Math.max(0, player.hp);
    tok.querySelector('.hp i').style.width = (100 * hp / player.maxHp) + '%';
    tok.querySelector('.hp b').textContent = hp + '/' + player.maxHp;
    tok.classList.toggle('full', player.hp >= player.maxHp);
    tok.querySelector('.exp i').style.width =
      (100 * player.xp / expNeeded(player.level)) + '%';
    const a = tok.querySelector('.stat-mark .a');
    a.textContent = player.atk;
    a.classList.add('atk-' + player.atkMode);
    renderSkillRow(tok);
    return tok;
  }

  function renderDraft() {
    dHeadEl.textContent = '레벨 ' + player.level + ' — 하나 고르기';
    drafting.cards.forEach((card, i) => {
      const el = dGridEl.querySelector('.d-cell[data-slot="' + i + '"]');
      el.classList.remove('hit');   // 지난번에 고른 카드의 붉은 자국을 지운다
      el.innerHTML = (card.img ? '<i class="d-img"></i>' : '') + '<b></b><span></span>';
      if (card.img) el.querySelector('.d-img').style.backgroundImage =
        'url(images/' + card.img + ')';
      el.querySelector('b').textContent = card.title;
      // 설명이 제목과 같은 말이면 두 번 적지 않는다 (`공격력+5` / `공격력 +5`)
      const same = card.note.replace(/\s/g, '') === card.title.replace(/\s/g, '');
      el.querySelector('span').textContent = same ? '' : card.note;
    });
    drafting.token = renderDraftPlayer();
  }

  // 고를 때까지 기다린다. 페이즈 안에서 await 하므로 그동안 판은 멈춰 있다
  function openDraft() {
    return new Promise(resolve => {
      const cards = pickCards(DRAFT_SLOTS);
      if (!cards.length) { resolve(); return; }   // 깔 것이 없으면 그냥 넘어간다
      drafting = { cards, resolve, busy: false };
      draftEl.hidden = false;
      renderDraft();
    });
  }

  // 모달보다 먼저 레벨업을 알린다
  async function announceLevelUp() {
    playLevelUp();
    if (!tuning.draft) return;
    levelupEl.hidden = false;
    await sleep(LEVELUP_MS);
    levelupEl.hidden = true;
  }

  // 고른 카드가 블럭의 아이콘 줄로 날아가고, 닿아 사라진 뒤에 실제로 붙는다.
  // 그림이 있으면 그림이, 없으면 글씨가 난다
  async function flyToStat(fromEl, toEl, card) {
    const grid = dGridEl.getBoundingClientRect();
    const from = fromEl.getBoundingClientRect();
    const to = toEl.getBoundingClientRect();

    const fly = document.createElement('span');
    fly.className = 'd-fly' + (card.img ? ' img' : '');
    if (card.img) {
      const w = Math.max(18, Math.round(grid.width * 0.11));
      fly.style.backgroundImage = 'url(images/' + card.img + ')';
      fly.style.width = w + 'px';
      fly.style.height = w + 'px';
    } else {
      fly.textContent = card.fly;
    }
    fly.style.fontSize = Math.max(12, Math.round(grid.width * 0.075)) + 'px';
    fly.style.setProperty('--fly', tuning.draft + 'ms');
    dGridEl.appendChild(fly);

    // 시작 자리에 놓고 한 프레임 뒤에 목적지로 민다. 안 그러면 전환이 안 걸린다
    const size = fly.getBoundingClientRect();
    fly.style.left = (from.left - grid.left + from.width / 2 - size.width / 2) + 'px';
    fly.style.top = (from.top - grid.top + from.height / 2 - size.height / 2) + 'px';
    const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    const dy = (to.top + to.height / 2) - (from.top + from.height / 2);

    if (tuning.draft) {
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      fly.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.6)';
      fly.style.opacity = '0';
      await sleep(tuning.draft);
    }
    fly.remove();
  }

  async function chooseDraft(dx, dy) {
    if (!drafting || drafting.busy) return;
    const slot = DRAFT_DIRS[dx + ',' + dy];
    if (slot === undefined) return;      // 아래는 리롤 자리, 아직 잠겨 있다
    drafting.busy = true;                // 날아가는 동안 두 번 고르지 못하게

    const card = drafting.cards[slot];
    const mine = phaseId;
    const cell = dGridEl.querySelector('.d-cell[data-slot="' + slot + '"]');
    // 날아가 닿는 곳은 늘 아이콘 줄이다. 거기 그대로 쌓인다
    const rowEl = drafting.token.querySelector('.skill-row');
    // 닿은 뒤 튀는 것은 카드가 정한다. 수치 카드는 그 수치 딱지가 튄다
    const bumpEl = card.bump === 'atk'
      ? drafting.token.querySelector('.stat-mark .a')
      : rowEl;

    // 판에서 때릴 때와 똑같이 그 방향으로 친다. lunge 안에서 소리도 같이 난다.
    // 고른다는 것이 곧 그 카드를 치는 것으로 보이게
    lunge(drafting.token, dx, dy);
    // 맞는 쪽은 카드다. 판에서 몬스터가 맞을 때와 같은 결로 움츠러들며 붉게 번쩍인다
    cell.classList.remove('hit');
    void cell.offsetWidth;
    cell.classList.add('hit');
    if (tuning.draft) await sleep(LUNGE_MS);
    if (!drafting || phaseId !== mine) return;

    await flyToStat(cell, rowEl, card);
    if (!drafting || phaseId !== mine) return;

    // 그림이 사라진 뒤에 실제로 붙는다
    takeCard(card);
    renderHp(player);                              // 판 위의 블럭
    renderSkills();                                // 두 블럭에 그대로 쌓인다
    if (card.bump === 'atk') {
      drafting.token.querySelector('.stat-mark .a').textContent = player.atk;
    }
    bumpEl.classList.remove('bump');
    void bumpEl.offsetWidth;
    bumpEl.classList.add('bump');
    if (tuning.draft) await sleep(BUMP_MS);
    if (!drafting || phaseId !== mine) return;
    closeDraft();
  }

  function closeDraft() {
    if (!drafting) return;
    const done = drafting.resolve;
    drafting = null;
    draftEl.hidden = true;
    done();
  }

  // ── 위험 표시 ──────────────────────────────────────────────
  // 몬스터는 플레이어가 움직인 뒤에 행동하고, 그때 붙어 있으면 때리고 아니면 옮긴다.
  // 즉 "다음 턴에 맞는 칸" = 지금 몬스터가 바로 옆에 있는 칸이다.
  // 두 칸 떨어진 놈은 다가오는 데 행동을 다 쓰므로 그 턴에는 못 때린다
  // 그 칸으로 가면 얼마나 맞는지. 붙어 있는 놈들의 공격력을 다 더한다
  const threatDamage = (x, y) => monsters.reduce(
    (sum, m) => sum + (Math.abs(m.x - x) + Math.abs(m.y - y) === 1 ? damageTo(m) : 0), 0);
  const threatened = (x, y) => threatDamage(x, y) > 0;

  // 빈 칸에만 칠한다. 누가 서 있는 칸은 그림이 이미 자리를 차지하고 있다
  function renderDanger() {
    for (let y = MIN; y <= MAX; y++) {
      for (let x = MIN; x <= MAX; x++) {
        const dmg = occupied(x, y) ? 0 : threatDamage(x, y);
        const cell = cellAt[y * N + x];
        cell.classList.toggle('danger', dmg > 0);
        cell.querySelector('.hit-mark i').textContent = dmg > 0 ? dmg : '';
      }
    }
    // 플레이어가 선 칸은 비어 있지 않아 칠하지 않는다. 대신 토큰 위에 딱지를 얹어
    // "그대로 있으면 얼마나 맞는지" 를 알린다
    const here = threatDamage(player.x, player.y);
    player.el.classList.toggle('threatened', here > 0);
    player.el.querySelector('.hit-mark i').textContent = here > 0 ? here : '';
    player.el.style.setProperty('--mark', Math.round(innerCell * HIT_MARK_SCALE) + 'px');
  }

  // ── 페이즈 ─────────────────────────────────────────────────
  // 민첩이 높은 쪽부터 행동한다. 같으면 생성된 순서대로.
  // 플레이어의 민첩이 제일 높으면 지금까지처럼 플레이어가 먼저다
  function actOrder() {
    return [player, ...monsters].sort((a, b) => b.agi - a.agi || a.seq - b.seq);
  }

  // 플레이어의 행동은 입력할 때 정해지지만, 실제로 나가는 것은 제 차례가 왔을 때다.
  // 그 사이에 더 빠른 몬스터가 칸을 채우거나 비울 수 있어서 다시 확인한다.
  //
  // 공격이 하나 끝날 때마다 ATTACK_GAP 만큼 쉰다. 이동은 안 쉰다 - 여러 마리가
  // 같이 걸어오는 것은 읽는 데 지장이 없고, 마리 수만큼 기다리면 한 판이 너무 길다.
  // 페이즈가 도는 동안 입력은 막는다. 안 막으면 연출 중에 다음 페이즈가 겹쳐 든다
  async function runPhase(playerAction) {
    busy = true;
    const mine = ++phaseId;
    try {
      // 움직이기 전에 먼저 지운다. 다 사라지고 나서 첫 걸음이 나가도록 기다린다
      boardEl.classList.add('hide-danger');
      if (tuning.fade) {
        await sleep(tuning.fade);
        if (phaseId !== mine) return;
      }

      for (const actor of actOrder()) {
        if (over || phaseId !== mine) return;
        let did = null;
        if (actor === player) {
          did = await playerAction();
        } else if (actor.hp > 0 && monsters.includes(actor)) {
          did = await monsterAct(actor);
        }
        if (phaseId !== mine) return;
        // 한 놈이 끝나야 다음 놈이 움직인다. 걸음은 짧게, 공격은 길게 쉰다.
        // 아무것도 못 한 놈(막힌 놈)은 보여 줄 것이 없으니 안 쉰다
        if (did) {
          await sleep(did === 'attack' ? tuning.gap : moveGap());
          if (phaseId !== mine) return;
        }
      }
      movesEl.textContent = ++moves;
      if (player.hp <= 0) over = true;

      if (!over) {
        groupTurns++;
        questSpawn();
        renderQuest();
        if (groupDone()) await advanceQuest();
      }
      updateStatus();               // 여기서 새 위험 표시를 계산한다

      // 이 페이즈에서 오른 레벨만큼 고른다. 몬스터가 다 움직이고 난 뒤라
      // 판이 어떤 꼴인지 보고 고르게 된다
      while (!over && pendingDrafts > 0 && phaseId === mine) {
        pendingDrafts--;
        await announceLevelUp();
        if (phaseId !== mine) return;
        await openDraft();
      }
    } finally {
      if (phaseId === mine) {
        // 다 끝난 뒤에 되살린다. 옮기는 도중의 어정쩡한 상태는 안 보여 준다
        boardEl.classList.remove('hide-danger');
        busy = false;
      }
    }
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // 몰릴수록 걸음 간격을 좁힌다. 10마리가 130ms 씩 걸으면 한 페이즈가 1.5초라
  // 늘어진다. 순서는 그대로 보이면서 전체 길이만 900ms 언저리로 묶는다
  function moveGap() {
    if (!tuning.move) return 0;                 // 검사에서는 0
    const movers = monsters.length + 1;         // 플레이어까지
    return Math.min(tuning.move, Math.max(MOVE_GAP_MIN, Math.round(MOVE_BUDGET / movers)));
  }

  const canStep = (dx, dy) => {
    const x = player.x + dx, y = player.y + dy;
    return isInner(x, y) && !occupied(x, y);
  };

  // 플레이어의 행동 1: 이동. 벽이거나 다른 물체가 있으면 페이즈가 시작도 안 한다
  function move(dx, dy) {
    if (busy || over || !canStep(dx, dy)) return;
    return runPhase(() => {
      // 더 빠른 몬스터가 먼저 그 칸에 들어왔으면 이동은 불발이다.
      // 페이즈는 이미 시작했으므로 행동만 날아간다
      if (!canStep(dx, dy)) return null;
      player.x += dx; player.y += dy;
      place(player.el, player.x, player.y);
      groupDirs.add(dx + ',' + dy);   // 방향 퀘스트는 이걸로 센다
      return 'move';
    });
  }

  // 플레이어의 행동 2: 공격. 바로 옆 한 칸을 친다.
  // 빈 칸을 쳐도 행동을 쓴 것이므로 페이즈는 넘어간다. 규칙에 없어서 정했다.
  // '이동 못하면 공격' 으로 묶지 않고 입력을 따로 둔 것은, 나중에 궁수·마법사처럼
  // 떨어져서 치는 직업이 들어오면 이동 가능 여부와 공격이 무관해지기 때문이다
  function attack(dx, dy) {
    if (busy || over) return;
    return runPhase(async () => {
      const target = monsterAt(player.x + dx, player.y + dy);
      if (!target) {
        lunge(player.el, dx, dy);   // 헛치는 것도 보여 준다
        return 'attack';
      }
      await strike(player, target, dx, dy);
      if (target.hp <= 0) defeat(target);
      // 때린 다음에 민다. 맞고 죽은 놈은 이미 빠졌으므로 밀 것도 없다
      if (pushLine(dx, dy) && tuning.move) await sleep(tuning.move);
      // 밀고가기: 앞칸이 비었으면 그 칸으로 간다. 밀어서 비웠든 때려 죽여서
      // 비웠든 같다. 헛친 빈 칸은 위에서 이미 돌아갔으므로 여기까지 안 온다.
      // canStep 을 그대로 쓰므로 이동과 같은 규칙(내부 필드, 빈 칸)을 탄다
      if (player.cards.has('pushMove') && canStep(dx, dy)) {
        player.x += dx; player.y += dy;
        place(player.el, player.x, player.y);
        if (tuning.move) await sleep(tuning.move);
      }
      // 구슬이 다 들어오고 나서 다음 놈이 움직인다. 안 기다리면 레벨업이
      // 페이즈 끝을 놓쳐 다음 턴에야 뜬다
      await drainDrops();
      return 'attack';
    });
  }

  const DIR_NAME = { '1,0': 'right', '-1,0': 'left', '0,1': 'down', '0,-1': 'up' };
  function lunge(el, dx, dy) {
    for (const n of ['up', 'down', 'left', 'right']) el.classList.remove('atk-' + n);
    void el.offsetWidth;
    el.classList.add('atk-' + DIR_NAME[dx + ',' + dy]);
    // 헛치는 것도 lunge 를 거치므로 소리는 여기 한 곳에만 두면 된다
    playSwing(el.classList.contains('player') ? 1 : 0.72);
  }

  // 쓰러지면 어떤 입력도 안 먹는다. 승패 규칙이 아직 없어서 멈춘 것인지
  // 고장인지 화면상 구분이 안 되므로 상태를 적어 준다.
  //
  // 갇힘 표시는 없앴다. 몬스터가 있는 칸은 이제 공격이 되므로, 내부 6*6 안에서는
  // 어느 칸에 서 있어도 이웃이 최소 둘이고 그 둘은 빈 칸(이동)이거나
  // 몬스터(공격)다. 즉 할 수 있는 것이 없는 상태가 생기지 않는다
  function updateStatus() {
    renderHp(player);
    renderDanger();
    playEl.classList.toggle('over', over);
    hintEl.textContent = over ? '쓰러졌다. 다시 를 눌러라' : HINT_DEFAULT;
  }

  // ── 입력 ───────────────────────────────────────────────────
  // 방향 하나만 받는다. 무엇을 할지는 그 칸에 무엇이 있느냐가 정한다.
  //   몬스터가 있으면 공격, 빈 칸이면 이동, 벽이면 아무 일도 없음
  const DIRS = {
    arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
  };

  function act(dx, dy) {
    const x = player.x + dx, y = player.y + dy;
    // 벽 너머라도 몬스터가 있으면 친다. 플레이어가 못 가는 것이지 못 치는 것이 아니다
    if (monsterAt(x, y)) return attack(dx, dy);
    if (isInner(x, y)) return move(dx, dy);
  }

  window.addEventListener('keydown', e => {
    const dir = DIRS[e.key.toLowerCase()];
    if (!dir) return;
    e.preventDefault();
    // 자동 반복은 무시한다. 한 번 누르면 한 번만 움직인다
    if (e.repeat) return;
    if (drafting) { chooseDraft(dir[0], dir[1]); return; }
    if (busy) return;
    act(dir[0], dir[1]);
  });

  // 스와이프는 판이 아니라 화면 전체에서 받는다
  let start = null;
  window.addEventListener('pointerdown', e => {
    // 상단 바 조작은 그대로 둔다. target 이 Element 가 아닐 수도 있어 closest 유무를 먼저 본다
    if (e.target && e.target.closest && e.target.closest('a,button')) return;
    if (busy && !drafting) return;        // 연출이 도는 중에는 안 받는다
    start = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointerup', e => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;

    const horizontal = Math.abs(dx) > Math.abs(dy);
    const reach = horizontal ? Math.abs(dx) : Math.abs(dy);
    // 스와이프에 못 미치는 짧은 누름은 탭이다. 판 위 블럭을 눌렀으면 그것을 본다
    if (reach < SWIPE_MOVE) { tapInspect(e); return; }

    const dir = horizontal ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
    if (drafting) chooseDraft(dir[0], dir[1]);
    else act(dir[0], dir[1]);
  });
  window.addEventListener('pointercancel', () => { start = null; });

  // 판 위 블럭만 받는다. 드래프트 모달 안에도 같은 클래스의 블럭이 있어서
  // `.token` 만 보면 모달을 누른 것까지 딸려 온다
  function tapInspect(e) {
    const el = e.target && e.target.closest && e.target.closest('.token');
    if (!el || !boardEl.contains(el)) return;
    const being = el === player.el ? player : monsters.find(m => m.el === el);
    if (being) inspect(being);
  }

  // ── 시작 / 다시 ────────────────────────────────────────────
  function reset() {
    phaseId++;                  // 돌고 있던 페이즈는 여기서 손을 뗀다
    busy = false;
    boardEl.classList.remove('hide-danger');
    for (const m of monsters) m.el.remove();
    for (const d of boardEl.querySelectorAll('.dmg')) d.remove();
    for (const o of boardEl.querySelectorAll('.orb')) o.remove();
    dropShow.length = 0;
    monsters.length = 0;
    nextSeq = 1;                // 0 은 플레이어 몫이다
    player.x = START.x; player.y = START.y;
    closeDraft();               // 고르는 중이었으면 접는다
    pendingDrafts = 0;
    // 드래프트로 올려 둔 스텟도 표에서 다시 베낀다
    const base = BEINGS.player;
    player.atk = base.atk; player.maxHp = base.maxHp;
    player.atkMode = 'single';
    player.cards.clear();
    player.expBonus = 0;
    renderSkills();             // 판 위 블럭에 남아 있던 그림도 지운다
    player.hp = player.maxHp;
    player.level = 1; player.xp = 0;
    player.purse = 0;
    picked = null;
    renderHp(player);
    renderExp();
    renderCoin();
    renderInspect();
    over = false;
    moves = 0;
    movesEl.textContent = '0';
    countEl.textContent = '0';
    place(player.el, player.x, player.y);
    startGroup(allDone ? QUEST_GROUPS.length : groupIndex);   // 지금 묶음을 처음부터
    updateStatus();
  }

  const soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.setAttribute('aria-label', soundOn ? '소리 끄기' : '소리 켜기');
    if (soundOn) playSwing(1);          // 켠 것이 들리게 한 번 낸다
  });

  document.getElementById('reset').addEventListener('click', reset);
  window.addEventListener('resize', layout);

  buildBoard();
  layout();
  reset();

  // 판을 원하는 상태로 놓고 확인하기 위한 손잡이. 스폰이 랜덤이라
  // 이것이 없으면 "고블린이 다가오는가" 를 재현성 있게 볼 수가 없다
  window.__t = {
    monsters, player, place, addMonster, updateStatus, renderHp,
    isOver: () => over,
    attack, act, killMonster, defeat, pushLine, actOrder, BEINGS, KNIGHT,
    damageTo, makeBeing,
    expNeeded, gainExp, addXp, expGain, orbSplit, renderExp, ATK_MODES,
    addCoin, renderCoin, spawnDrop, DROPS,
    DRAFT_CARDS, DRAFT_SLOTS, openDraft, chooseDraft, availableCards,
    takeCard, renderSkillRow, renderSkills, roman,
    isDrafting: () => !!drafting,
    announceLevelUp,
    draftCards: () => (drafting ? drafting.cards.map(c => c.id) : []),
    pending: () => pendingDrafts,
    QUEST_GROUPS, startGroup, spawnMonster, reset,
    quest: () => ({
      index: groupIndex, turns: groupTurns, spawned: groupSpawned,
      kills: { ...groupKills }, dirs: groupDirs.size, allDone,
      items: allDone ? [] : QUEST_GROUPS[groupIndex].items.map(it => ({
        title: it.title, progress: itemProgress(it), goal: itemGoal(it), done: itemDone(it),
      })),
      done: groupDone(),
    }),
    isBusy: () => busy,
    renderDanger, threatened, threatDamage, moveGap,
    inspect, renderInspect, inspectTarget, tapInspect,
    layout, layoutSplit,
    split: () => ({
      wide: splitEl.classList.contains('wide'),
      game: { w: stageEl.clientWidth, h: stageEl.clientHeight },
      info: { w: infoEl.clientWidth, h: infoEl.clientHeight },
      card: {
        w: parseFloat(infoEl.style.getPropertyValue('--cw')),
        h: parseFloat(infoEl.style.getPropertyValue('--ch')),
      },
      cards: infoEl.querySelectorAll('.card').length,
    }),
    limitsExtra: { HIT_MARK_SCALE },
    isSoundOn: () => soundOn,
    // 연출을 기다리지 않고 검사하려면 간격을 0 으로 둔다
    setTiming: t => {
      if ('gap' in t) tuning.gap = t.gap;
      if ('hit' in t) tuning.hit = t.hit;
      if ('move' in t) tuning.move = t.move;
      if ('fade' in t) tuning.fade = t.fade;
      if ('draft' in t) tuning.draft = t.draft;
      if ('orb' in t) tuning.orb = t.orb;
    },
    limits: {
      SWIPE_MOVE, TINY_TOKEN, HIT_DELAY, ATTACK_GAP,
      MOVE_GAP, MOVE_GAP_MIN, MOVE_BUDGET, DANGER_FADE, QUEST_CLEAR_MS,
      N, MIN, MAX,
              LEVELUP_MS, LUNGE_MS, FLY_MS, BUMP_MS, ORB_MS, ORB_BIG,
      // 예전 이름들. 표에서 그대로 끌어 쓴다
      PLAYER_MAX_HP: BEINGS.player.maxHp, GOBLIN_MAX_HP: BEINGS.goblin.maxHp,
      PLAYER_ATK: BEINGS.player.atk, GOBLIN_ATK: BEINGS.goblin.atk,
      PLAYER_AGI: BEINGS.player.agi, GOBLIN_AGI: BEINGS.goblin.agi,
      RIDER_AGI: BEINGS.rider.agi,
    },
  };
})();
</script>
</body>
</html>
