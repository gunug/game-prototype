<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Prototype</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFD400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets-ds.css">
<style>
  .hero{margin-bottom:var(--s7);}
  .hero h1{font-size:44px;line-height:1.05;margin:0;}
  .hero p{color:var(--muted);font-size:18px;margin-top:var(--s3);}
  .link-list{list-style:none;padding:0;margin:0;display:grid;
    grid-template-columns:repeat(3,1fr);gap:var(--s4);}
  .link-list .card{display:flex;flex-direction:column;gap:6px;height:100%;
    cursor:pointer;transition:.15s;text-decoration:none;}
  .link-list .card:hover{border-color:var(--brand-yellow);
    box-shadow:var(--sh-md);transform:translateY(-2px);}
  .link-list h3{margin:0;}
  .link-list .desc{color:var(--muted);font-size:13px;margin-top:2px;}
  @media(max-width:900px){.link-list{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.link-list{grid-template-columns:1fr;}
    .hero h1{font-size:32px;}}
</style>
</head>
<body>
  <main class="container">
    <header class="hero">
      <span class="eyebrow">Game Prototype</span>
      <h1>게임 프로토타입</h1>
      <p>실험 중인 게임 프로토타입 모음.</p>
    </header>

    <ul class="link-list">
      <li>
        <a class="card" href="game-card/index.html">
          <h3>🧱 게임 블럭</h3>
          <p class="desc">1:1 블럭 드래그 프로토타입</p>
        </a>
      </li>
      <li>
        <a class="card" href="game-exact-cover/index.html">
          <h3>🟨 정확한 커버</h3>
          <p class="desc">격자 드래그 색칠 프로토타입</p>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
