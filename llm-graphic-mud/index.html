<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM 그래픽 머드</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  .conn{display:grid;gap:var(--s1);max-width:560px;margin-top:24px;}
  .conn label{display:grid;gap:4px;font-size:13px;color:var(--muted);}
  .conn input{font:inherit;color:var(--ink);background:var(--surface);
    border:1px solid var(--hairline);border-radius:var(--r-sm);padding:8px 10px;}
  .conn > label[for]{font-size:13px;color:var(--muted);margin-bottom:-4px;}
  .keyrow{display:flex;gap:8px;}
  .keyrow input{flex:1;min-width:0;}
  .unsaved{font-size:12px;color:#c62828;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .out{white-space:pre-wrap;word-break:break-all;font-size:13px;min-height:3em;
    background:var(--surface-soft);border-radius:var(--r-sm);padding:10px;margin-top:8px;}
  .ok{color:#1a7f37;} .err{color:#c62828;}
  [hidden]{display:none !important;}
  .loading{display:grid;gap:6px;}
  .bar{height:6px;border-radius:3px;background:var(--surface-soft);overflow:hidden;}
  .bar span{display:block;height:100%;width:35%;border-radius:3px;background:var(--brand-yellow);
    animation:slide 1.2s ease-in-out infinite;}
  @keyframes slide{from{transform:translateX(-100%);}to{transform:translateX(290%);}}
  .stage{font-size:13px;color:var(--muted);}
  .charout{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:16px;align-items:start;}
  .charout img{width:100%;border-radius:var(--r-sm);display:block;background:var(--surface-soft);}
  .prompt{font-size:12px;color:var(--muted);white-space:pre-wrap;margin:6px 0 0;}
  @media(max-width:560px){.charout{grid-template-columns:1fr;}}

  .chat{margin-top:24px;display:grid;gap:10px;}
  .chat input,.chat textarea{font:inherit;color:var(--ink);background:var(--surface);
    border:1px solid var(--hairline);border-radius:var(--r-sm);padding:8px 10px;min-width:0;}
  .chat textarea{resize:vertical;font-size:13px;}
  .chatbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .chatbar input{width:160px;}
  .status{font-size:13px;color:var(--muted);}
  .status.on{color:#1a7f37;}
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .pane{display:grid;gap:8px;grid-template-rows:auto auto 1fr auto;min-width:0;}
  .pane:first-child{grid-template-rows:auto 1fr auto;}
  .panehead{font-weight:600;font-size:14px;}
  .who{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px;}
  .log{height:320px;overflow-y:auto;background:var(--surface-soft);border-radius:var(--r-sm);
    padding:10px;font-size:14px;display:flex;flex-direction:column;gap:4px;}
  .log .m{white-space:pre-wrap;word-break:break-word;}
  .log .m b{margin-right:6px;}
  .log .n{font-size:12px;color:var(--muted);}
  .log .e{font-size:12px;color:#c62828;}
  .log .me b{color:var(--brand-yellow-deep);}
  .log .ai{background:var(--surface);border-radius:var(--r-sm);padding:6px 8px;}
  .send{display:flex;gap:8px;margin:0;}
  .send input{flex:1;}
  @media(max-width:720px){.panes{grid-template-columns:1fr;}}
</style>
</head>
<body>
  <main class="container">
    <h1>LLM 그래픽 머드</h1>

    <section class="card conn">
      <h3 style="margin:0">연결 테스트</h3>
      <label>프록시 주소
        <input id="base" type="url" autocomplete="off">
      </label>
      <label for="key">키 (server/proxy.key 내용 · 이 브라우저에만 저장)</label>
      <div class="keyrow">
        <input id="key" type="password" autocomplete="off">
        <button class="btn btn-secondary btn-sm" id="btnSave">저장</button>
        <button class="btn btn-secondary btn-sm" id="btnCopy">복사</button>
      </div>
      <span class="unsaved" id="unsaved" hidden>저장되지 않음</span>
      <div class="row">
        <button class="btn btn-primary btn-sm" id="btnOllama">Ollama 테스트</button>
        <button class="btn btn-secondary btn-sm" id="btnComfy">ComfyUI 테스트</button>
      </div>
      <div class="out" id="out">대기 중</div>
    </section>

    <section class="card conn">
      <h3 style="margin:0">캐릭터</h3>
      <div class="row" style="margin-top:0">
        <button class="btn btn-primary btn-sm" id="btnChar">캐릭터 생성</button>
      </div>
      <div class="loading" id="charLoading" hidden>
        <div class="bar"><span></span></div>
        <div class="stage" id="charStage"></div>
      </div>
      <div class="charout" id="charOut" hidden>
        <img id="charImg" alt="">
        <div>
          <h3 id="charName" style="margin:0"></h3>
          <p id="charDesc" style="margin:4px 0 0"></p>
          <details style="margin-top:8px">
            <summary>이미지 프롬프트</summary>
            <p id="charPrompt" class="prompt"></p>
          </details>
        </div>
      </div>
      <div class="out err" id="charErr" hidden></div>
    </section>

    <section class="card chat">
      <h3 style="margin:0">채팅</h3>
      <div class="chatbar">
        <input id="nick" placeholder="닉네임" maxlength="16" autocomplete="off">
        <button class="btn btn-primary btn-sm" id="btnConn">연결</button>
        <span class="status" id="wsStatus">끊김</span>
      </div>
      <div class="panes">
        <div class="pane">
          <div class="panehead">온라인 채팅 <span class="who" id="who"></span></div>
          <div class="log" id="chatLog"></div>
          <form class="send" id="chatForm">
            <input id="chatIn" placeholder="메시지" maxlength="500" autocomplete="off">
            <button class="btn btn-secondary btn-sm">보내기</button>
          </form>
        </div>
        <div class="pane">
          <div class="panehead">Ollama <span class="who">나만 보임 · /system 글 · /reset</span></div>
          <textarea id="sysIn" rows="2" placeholder="시스템 프롬프트 (비우면 없음)"></textarea>
          <div class="log" id="llmLog"></div>
          <form class="send" id="llmForm">
            <input id="llmIn" placeholder="Ollama 에게" autocomplete="off">
            <button class="btn btn-secondary btn-sm">보내기</button>
          </form>
        </div>
      </div>
    </section>
  </main>

<script>
const DEFAULT_BASE = 'https://subregular-zandra-nonwashable.ngrok-free.dev';
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} },
};

$('base').value = store.get('mud.base') || DEFAULT_BASE;
$('key').value = store.get('mud.key') || '';
$('base').addEventListener('change', e => store.set('mud.base', e.target.value.trim()));

// 키는 저장 버튼으로만 저장한다. 저장 안 된 변경이 있으면 표시하고, 나갈 때 경고.
const keyDirty = () => $('key').value.trim() !== (store.get('mud.key') || '');
const markKey = () => { $('unsaved').hidden = !keyDirty(); };
$('key').addEventListener('input', markKey);
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnSave').click(); });
$('btnSave').onclick = () => {
  store.set('mud.key', $('key').value.trim());
  markKey();
  show(keyDirty() ? '키 저장 실패 (브라우저 저장소를 쓸 수 없음)' : '키 저장됨', keyDirty() ? 'err' : 'ok');
};
$('btnCopy').onclick = async () => {
  const k = $('key').value.trim();
  if (!k) return show('복사할 키가 없음', 'err');
  try {
    await navigator.clipboard.writeText(k);
    return show('키 복사됨', 'ok');
  } catch {}
  // 클립보드 API 가 막히면 (창 포커스 없음 등) 예전 방식으로
  const ta = document.createElement('textarea');
  ta.value = k;
  ta.style.cssText = 'position:fixed;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  const ok = document.execCommand('copy');
  ta.remove();
  show(ok ? '키 복사됨' : '복사 실패 (브라우저가 클립보드를 막음)', ok ? 'ok' : 'err');
};
window.addEventListener('beforeunload', e => {
  if (!keyDirty()) return;
  e.preventDefault();
  e.returnValue = '저장되지 않음';   // 요즘 브라우저는 이 글 대신 자체 문구를 띄운다
});

// 프록시 호출. ngrok 경고 페이지를 건너뛰는 헤더를 늘 붙인다.
async function apiRaw(path, body, signal){
  const base = $('base').value.trim().replace(/\/+$/, '');
  const res = await fetch(base + path, {
    method: body ? 'POST' : 'GET',
    signal,
    headers: {
      'X-Proxy-Key': $('key').value.trim(),
      'ngrok-skip-browser-warning': '1',
      ...(body ? { 'Content-Type': 'application/json' } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(`${res.status} ${data.error || JSON.stringify(data).slice(0, 200)}`);
  }
  return res;
}
const api = async (path, body) => (await apiRaw(path, body)).json();

function show(text, cls){ const o = $('out'); o.textContent = text; o.className = 'out ' + (cls || ''); }

async function run(label, fn){
  show(label + ' …');
  const t0 = performance.now();
  try {
    const msg = await fn();
    show(`${label} 성공 (${Math.round(performance.now() - t0)}ms)\n${msg}`, 'ok');
  } catch (e) {
    show(`${label} 실패: ${e.message}`, 'err');
  }
}

$('btnOllama').onclick = () => run('Ollama', async () => {
  const d = await api('/ollama/api/chat', {
    model: 'qwen3:8b', stream: false, think: false,
    messages: [{ role: 'user', content: '판타지 머드 진행자로서 한 문장으로 인사해.' }],
  });
  return d.message.content;
});

$('btnComfy').onclick = () => run('ComfyUI', async () => {
  const d = await api('/comfy/queue');
  return `실행 중 ${d.queue_running.length} · 대기 ${d.queue_pending.length}`;
});

// ---- 캐릭터 생성: Ollama 로 프롬프트 → ComfyUI Krea2 turbo 로 그림 ----

const CHAR_SCHEMA = {
  type: 'object',
  properties: {
    name: { type: 'string' },
    desc: { type: 'string' },
    image_prompt: { type: 'string' },
  },
  required: ['name', 'desc', 'image_prompt'],
};

const CHAR_SYSTEM = `너는 판타지 머드 게임의 캐릭터 디자이너다. 매번 새롭고 서로 다른 캐릭터를 만든다.
JSON 으로만 답한다. name · desc 는 한글로만 쓴다 — 한자 · 중국어 · 영어 금지.
- name: 한국어 이름 (2~6자)
- desc: 한국어 한 줄 소개 (직업 · 성격 · 특징)
- image_prompt: 영어 이미지 프롬프트. 캐릭터 한 명만 묘사 — 종족 · 체격 · 옷과 갑옷 · 무기 · 표정 · 자세 · 색을 구체적으로. 화풍 · 배경 · 조명은 쓰지 않는다 (따로 붙인다). 옷을 다 갖춰 입은 건전한 그림. 50단어 안팎.`;

// 화풍 — 코드가 프롬프트 뒤에 붙인다 (Ollama 는 캐릭터 묘사만)
const CHAR_STYLE = 'Blizzard Entertainment style fantasy character illustration, like World of Warcraft and Diablo '
  + 'official character art, hand-painted digital painting with bold painterly brush strokes, stylized heroic '
  + 'proportions, chunky oversized armor and weapons, strong readable silhouette, rich saturated colors, '
  + 'dramatic rim lighting, full body, plain dark gradient background. '
  + 'Not photorealistic, not a photo, no text, no watermark.';

// image_krea2_turbo_t2i.json (ComfyUI 템플릿) 의 기본 경로 — API 형식.
// 워크플로 안의 프롬프트 확장(TextGenerate) · LoRA 는 끈 경로만 옮겼다.
function krea2Workflow(prompt, seed){
  return {
    '10': { class_type: 'UNETLoader', inputs: { unet_name: 'krea2_turbo_fp8_scaled.safetensors', weight_dtype: 'default' } },
    '11': { class_type: 'CLIPLoader', inputs: { clip_name: 'qwen3vl_4b_fp8_scaled.safetensors', type: 'krea2', device: 'default' } },
    '6':  { class_type: 'CLIPTextEncode', inputs: { clip: ['11', 0], text: prompt } },
    '13': { class_type: 'ConditioningZeroOut', inputs: { conditioning: ['6', 0] } },
    '5':  { class_type: 'EmptyLatentImage', inputs: { width: 768, height: 1344, batch_size: 1 } },
    '3':  { class_type: 'KSampler', inputs: {
      model: ['10', 0], positive: ['6', 0], negative: ['13', 0], latent_image: ['5', 0],
      seed, steps: 8, cfg: 1, sampler_name: 'euler', scheduler: 'simple', denoise: 1 } },
    '12': { class_type: 'VAELoader', inputs: { vae_name: 'qwen_image_vae.safetensors' } },
    '8':  { class_type: 'VAEDecode', inputs: { samples: ['3', 0], vae: ['12', 0] } },
    '9':  { class_type: 'SaveImage', inputs: { images: ['8', 0], filename_prefix: 'llm-mud/char' } },
  };
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function waitComfy(promptId, timeoutMs = 180000){
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs) {
    const h = (await api('/comfy/history/' + promptId))[promptId];
    if (h?.status?.status_str === 'error') throw new Error('ComfyUI 실행 오류');
    const img = h && Object.values(h.outputs || {}).flatMap(o => o.images || [])[0];
    if (img) return img;
    await sleep(1000);
  }
  throw new Error('그림 기다리다 시간 초과');
}

let charUrl = null;

$('btnChar').onclick = async () => {
  const btn = $('btnChar');
  const stage = t => { $('charStage').textContent = t; };
  btn.disabled = true;
  $('charErr').hidden = true;
  $('charLoading').hidden = false;
  const t0 = performance.now();
  try {
    stage('1/2 캐릭터 구상 중 (Ollama)…');
    const d = await api('/ollama/api/chat', {
      model: 'qwen3:8b', stream: false, think: false, format: CHAR_SCHEMA,
      options: { temperature: 1.0, seed: Math.floor(Math.random() * 1e9) },
      messages: [
        { role: 'system', content: CHAR_SYSTEM },
        { role: 'user', content: '새 캐릭터 하나.' },
      ],
    });
    const c = JSON.parse(d.message.content);

    stage(`2/2 「${c.name}」 그리는 중 (ComfyUI Krea2)…`);
    const q = await api('/comfy/prompt', { prompt: krea2Workflow(c.image_prompt + '. ' + CHAR_STYLE, Math.floor(Math.random() * 2 ** 48)) });
    if (!q.prompt_id) throw new Error('ComfyUI 가 작업을 받지 않음: ' + JSON.stringify(q).slice(0, 200));
    const img = await waitComfy(q.prompt_id);

    const qs = new URLSearchParams({ filename: img.filename, subfolder: img.subfolder || '', type: img.type || 'output' });
    const blob = await (await apiRaw('/comfy/view?' + qs)).blob();
    if (charUrl) URL.revokeObjectURL(charUrl);
    charUrl = URL.createObjectURL(blob);

    $('charImg').src = charUrl;
    $('charImg').alt = c.name;
    $('charName').textContent = c.name;
    $('charDesc').textContent = `${c.desc}  (${((performance.now() - t0) / 1000).toFixed(1)}초)`;
    $('charPrompt').textContent = c.image_prompt;
    $('charOut').hidden = false;
  } catch (e) {
    $('charErr').textContent = '캐릭터 생성 실패: ' + e.message;
    $('charErr').hidden = false;
  } finally {
    $('charLoading').hidden = true;
    btn.disabled = false;
  }
};

// ---- 채팅 ----
// 왼쪽 = 접속자 모두의 채팅 (프록시 /chat/stream · /chat/send)
// 오른쪽 = 나만의 Ollama 대화 (/ollama/api/chat, 스트리밍)
// WebSocket 이 아니라 HTTP 스트리밍: ngrok 무료판 경고 페이지가 WebSocket 을 가로채고,
// 브라우저 WebSocket 은 우회 헤더를 못 붙이기 때문.

let chatAbort = null, chatSid = null, chatNick = '';
let llmMsgs = [], llmBusy = false;

$('nick').value = store.get('mud.nick') || '';

function logLine(box, cls, nick, text){
  const div = document.createElement('div');
  div.className = cls;
  if (nick) { const b = document.createElement('b'); b.textContent = nick; div.append(b); }
  div.append(document.createTextNode(text));
  const el = $(box);
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.append(div);
  if (atBottom) el.scrollTop = el.scrollHeight;
  return div;
}

function setConn(on, text){
  $('wsStatus').textContent = text;
  $('wsStatus').className = 'status' + (on ? ' on' : '');
  $('btnConn').textContent = on || chatAbort ? '끊기' : '연결';
}

// 한 줄에 JSON 하나씩 오는 응답을 읽는다
async function readNdjson(res, onObj){
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (line) onObj(JSON.parse(line));
    }
  }
}

function onChat(m){
  if (m.type === 'hello') {
    chatSid = m.sid;
    setConn(true, `연결됨 · ${m.nick}`);
    $('chatLog').textContent = '';
    m.history.forEach(h => logLine('chatLog', 'm', h.nick, h.text));
  } else if (m.type === 'chat') {
    logLine('chatLog', 'm' + (m.nick === chatNick ? ' me' : ''), m.nick, m.text);
  } else if (m.type === 'notice') {
    logLine('chatLog', 'n', '', m.text);
  } else if (m.type === 'presence') {
    $('who').textContent = `${m.nicks.length}명 · ${m.nicks.join(', ')}`;
  }
}

$('btnConn').onclick = async () => {
  if (chatAbort) { chatAbort.abort(); return; }
  chatNick = $('nick').value.trim() || '손님';
  store.set('mud.nick', chatNick);
  chatAbort = new AbortController();
  setConn(false, '연결 중…');
  let why = '끊김';
  try {
    const res = await apiRaw('/chat/stream?nick=' + encodeURIComponent(chatNick), undefined, chatAbort.signal);
    await readNdjson(res, onChat);
  } catch (e) {
    if (e.name !== 'AbortError') why = '끊김 (' + e.message + ')';
  }
  chatAbort = null; chatSid = null;
  $('who').textContent = '';
  setConn(false, why);
};

$('chatForm').onsubmit = async e => {
  e.preventDefault();
  const text = $('chatIn').value.trim();
  if (!text || !chatSid) return;
  $('chatIn').value = '';
  try {
    await api('/chat/send', { sid: chatSid, text });
  } catch (err) {
    logLine('chatLog', 'e', '', '보내기 실패: ' + err.message);
  }
};

$('llmForm').onsubmit = async e => {
  e.preventDefault();
  const text = $('llmIn').value.trim();
  if (!text) return;
  $('llmIn').value = '';
  if (text === '/reset') {
    llmMsgs = []; $('llmLog').textContent = '';
    return logLine('llmLog', 'n', '', '대화를 지웠다');
  }
  if (text.startsWith('/system')) {
    $('sysIn').value = text.slice(7).trim();
    return logLine('llmLog', 'n', '', '시스템 프롬프트: ' + ($('sysIn').value || '(없음)'));
  }
  if (llmBusy) return logLine('llmLog', 'e', '', '아직 답하는 중');

  llmMsgs.push({ role: 'user', content: text });
  llmMsgs = llmMsgs.slice(-40);
  logLine('llmLog', 'm me', '나', text);
  const sys = $('sysIn').value.trim();
  const bubble = logLine('llmLog', 'm ai', '', '');
  llmBusy = true;
  try {
    const res = await apiRaw('/ollama/api/chat', {
      model: 'qwen3:8b', stream: true, think: false,
      messages: [...(sys ? [{ role: 'system', content: sys }] : []), ...llmMsgs],
    });
    await readNdjson(res, d => {
      if (d.error) throw new Error(d.error);
      if (d.message?.content) {
        bubble.textContent += d.message.content;
        $('llmLog').scrollTop = $('llmLog').scrollHeight;
      }
    });
    llmMsgs.push({ role: 'assistant', content: bubble.textContent });
  } catch (err) {
    llmMsgs.pop();
    bubble.remove();
    logLine('llmLog', 'e', '', '오류: ' + err.message);
  } finally {
    llmBusy = false;
  }
};
</script>
