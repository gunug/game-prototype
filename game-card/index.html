<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>게임 블럭 — Game Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}

  /* 뷰포트 전체가 게임 화면 */
  .board{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:var(--canvas);
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* 화면 위에 떠 있는 최소한의 UI */
  .hud{
    position:fixed;
    z-index:2147483000;
    top:calc(env(safe-area-inset-top, 0px) + 12px);
    left:calc(env(safe-area-inset-left, 0px) + 12px);
    display:flex;
    gap:var(--s2);
    align-items:center;
  }
  .hud .btn{
    background:rgba(28,28,23,.82);
    border-color:var(--hairline);
    color:var(--ink);
    backdrop-filter:blur(6px);
  }
  .hud .btn:hover{background:var(--surface-soft);}

  /* 붙어 있는 블럭 뭉치 — 통째로 움직인다 */
  .group{position:absolute;left:0;top:0;width:0;height:0;}
  .group.is-dragging{z-index:2100000000;}

  /* 1 : 1 비율 블럭 */
  .block{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    background:linear-gradient(160deg,var(--surface-soft),#191914);
    border:1px solid var(--hairline);
    border-radius:var(--r-md);
    box-shadow:var(--sh-md);
    cursor:grab;
    user-select:none;
    touch-action:none;
    transition:border-color .15s,box-shadow .15s;
  }
  .block::before{
    content:'';position:absolute;inset:0;border-radius:inherit;
    background:var(--tone);opacity:.12;pointer-events:none;
  }
  .block:hover{border-color:var(--tone);}
  .group.is-dragging .block{cursor:grabbing;border-color:var(--tone);box-shadow:var(--sh-lg);}
  .block .icon{font-size:26px;line-height:1;}
  .block .name{
    color:var(--tone);font-size:11px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;
  }

  /* 칩 — 블럭 1/3 크기의 동그란 프레임 */
  .chip{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:2px solid var(--brand-yellow);
    background:rgba(255,212,0,.16);
    box-shadow:0 0 12px rgba(255,212,0,.3);
    color:var(--ink);
    font-weight:700;
    line-height:1;
    cursor:grab;
    user-select:none;
    touch-action:none;
  }
  .chip.is-dragging{cursor:grabbing;box-shadow:0 0 0 3px var(--brand-yellow),var(--sh-lg);}
  /* 칩 유형을 등록해 둔 collector */
  .block.is-armed{border-color:var(--tone);}
  /* collector에 등록된 칩 */
  .chip.is-linked{box-shadow:0 0 0 2px var(--link,var(--brand-yellow)),0 0 14px rgba(255,212,0,.25);}

  /* collector가 저장한 수량 */
  .block .store{
    position:absolute;
    top:4px;
    right:5px;
    padding:1px 6px;
    border-radius:var(--r-pill);
    background:var(--brand-yellow);
    color:var(--on-brand);
    font-size:11px;
    font-weight:800;
    line-height:1.5;
  }

  /* mover가 혼자 움직이도록 예약된 상태 */
  .block.is-solo{border-style:dashed;border-color:var(--tone);}

  /* 반응 — 한 번 깜빡인다 */
  .block.is-reacting{animation:react .32s ease-out;}
  @keyframes react{
    0%  {border-color:var(--tone);box-shadow:var(--sh-md);}
    25% {border-color:var(--tone);box-shadow:0 0 0 3px var(--tone),0 0 24px var(--tone);filter:brightness(1.6);}
    100%{border-color:var(--hairline);box-shadow:var(--sh-md);}
  }

  /* 좁은 화면 — 블럭이 작아지므로 글자도 같이 줄인다 */
  @media(max-width:640px){
    .block .icon{font-size:20px;}
    .block .name{font-size:8px;letter-spacing:.02em;}
    .hud .btn{padding:8px 12px;font-size:12px;}
  }
  @media(max-width:380px){
    .block .name{display:none;}
    .block .store{font-size:9px;padding:0 4px;}
    .block .icon{font-size:22px;}
  }
  /* 화면이 낮은 가로 모드 */
  @media(max-height:420px){
    .hud .btn{padding:6px 10px;font-size:12px;}
  }
</style>
</head>
<body>
  <div class="board" id="board"></div>
  <nav class="hud">
    <a class="btn btn-secondary btn-sm" href="../index.html">← 목록</a>
  </nav>

<script>
(() => {
  // 블럭 종류 — clicker와 beeper만 반응한다
  const TYPES = {
    pusher:   { icon: '⏩', tone: '#FFD400' },
    timer:    { icon: '⏱', tone: '#3A78C2' },
    loader:   { icon: '📥', tone: '#3FA66A' },
    unloader: { icon: '📤', tone: '#E0941A' },
    clicker:  { icon: '👆', tone: '#D24A4A' },
    beeper:   { icon: '🔊', tone: '#7C5CD6' },
    mover:    { icon: '🧲', tone: '#2FA8A0' },
    maker:    { icon: '🏭', tone: '#D95A9E' },
    collector:{ icon: '🧺', tone: '#B7C34A' },
    '+':      { icon: '➕', tone: '#5BB8E8' },
  };
  // 화면에 깔아 두는 블럭 20장
  const START = [
    'clicker', 'clicker', 'clicker',
    'beeper', 'beeper', 'beeper',
    'maker', 'maker', 'maker',
    'mover', 'mover', 'mover',
    'collector', 'collector',
    '+', '+',
    'pusher', 'timer', 'loader', 'unloader',
  ];
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const SNAP_RATIO = 0.5;   // 블럭 한 변의 절반 안에 들어오면 붙는다
  const CLICK_SLOP = 5;     // 이만큼 안 움직이면 드래그로 치지 않는다
  const HOP_MS = 100;       // 기본딜레이 — 행동이 인접 블럭까지 가는 시간
  const FORGET_MS = 5000;   // 지나간 행동 uid를 잊는 시간
  const BLINK_MS = 340;     // 반응 깜빡임 길이

  // 겹칠 때의 depth 순서: 행동중 > 반응중 > 하단 > 우측 > 상단 > 좌측
  const Z_ACTING = 2000000000;
  const Z_REACTING = 1500000000;
  const Z_ROW = 4000;       // 아래쪽 한 줄이 오른쪽 끝보다 항상 위
  const Z_CHIP = 1900000000;
  const Z_CHIP_DRAG = 2150000000;

  const CHIP_KIND = 'chip'; // 칩 유형 — 아직 한 종류뿐이다
  const CHIP_VALUE = 1;     // 칩에 적히는 기본 숫자
  const CHIP_POP = 0.09;    // 튀어나갈 때의 힘 (블럭 한 변 기준)
  const CHIP_DRAG_FRICTION = 0.92;
  const CHIP_BOUNCE = 0.5;
  const COLLECT_RANGE = 2.5;   // 등록 범위 (블럭 한 변 기준)
  const COLLECT_PULL = 0.06;   // 반응 한 번에 끌어당기는 힘

  const board = document.getElementById('board');

  let S = 96;               // 블럭 한 변 (px)
  let groups = [];
  let uidSeq = 0;
  let chips = [];
  let chipRaf = null;

  // 생성 — 새 객체마다 고유 uid를 붙인다
  const nextUid = () => ++uidSeq;

  /* ---------- 뭉치·블럭 만들기 ---------- */

  function makeGroup(x, y) {
    const g = { x, y, blocks: [], el: document.createElement('div') };
    g.el.className = 'group';
    board.appendChild(g.el);
    groups.push(g);
    return g;
  }

  function addBlock(g, type, gx, gy) {
    const el = document.createElement('div');
    el.className = 'block';
    el.dataset.type = type;
    el.style.setProperty('--tone', TYPES[type].tone);
    el.innerHTML = '<span class="icon">' + TYPES[type].icon + '</span>' +
                   '<span class="name">' + type + '</span>';
    g.el.appendChild(el);
    const b = { type, gx, gy, el, g, seen: new Set(), acting: 0, reacting: 0, solo: false, stored: 0, registered: null, regs: [] };
    g.blocks.push(b);
    return b;
  }

  function dropGroup(g) {
    groups = groups.filter((x) => x !== g);
    g.el.remove();
  }

  // 판 기준 좌표로 depth를 매긴다. 아래쪽이 위로, 같은 줄이면 오른쪽이 위로.
  function zOf(b) {
    const y = Math.max(0, Math.round(b.g.y + b.gy * S));
    const x = Math.max(0, Math.round(b.g.x + b.gx * S));
    return 1000 + y * Z_ROW + Math.min(x, Z_ROW - 1);
  }

  function applyZ(b) {
    b.el.style.zIndex = b.acting ? Z_ACTING : (b.reacting ? Z_REACTING : zOf(b));
  }

  function render(g) {
    g.el.style.transform = 'translate(' + g.x + 'px,' + g.y + 'px)';
    g.blocks.forEach((b) => {
      b.el.style.width = S + 'px';
      b.el.style.height = S + 'px';
      b.el.style.left = b.gx * S + 'px';
      b.el.style.top = b.gy * S + 'px';
      applyZ(b);
    });
  }

  const box = (g) => ({
    minX: Math.min(...g.blocks.map((b) => b.gx)),
    minY: Math.min(...g.blocks.map((b) => b.gy)),
    maxX: Math.max(...g.blocks.map((b) => b.gx)),
    maxY: Math.max(...g.blocks.map((b) => b.gy)),
  });

  // 뭉치 전체를 판 안으로 밀어 넣는다
  function clamp(g) {
    const bb = box(g);
    const w = (bb.maxX - bb.minX + 1) * S;
    const h = (bb.maxY - bb.minY + 1) * S;
    const left = g.x + bb.minX * S;
    const top = g.y + bb.minY * S;
    g.x += Math.max(0, Math.min(left, board.clientWidth - w)) - left;
    g.y += Math.max(0, Math.min(top, board.clientHeight - h)) - top;
  }

  /* ---------- 붙이기 ---------- */

  // 새 자리에 놓았을 때 이미 찬 칸을 침범하는지 — 한 면에는 한 블럭만 붙는다
  function overlaps(g, nx, ny) {
    const eps = S * 0.2;
    return g.blocks.some((mb) => {
      const ax = nx + mb.gx * S;
      const ay = ny + mb.gy * S;
      return groups.some((other) => {
        if (other === g) return false;
        return other.blocks.some((ob) => {
          const bx = other.x + ob.gx * S;
          const by = other.y + ob.gy * S;
          return Math.abs(ax - bx) < S - eps && Math.abs(ay - by) < S - eps;
        });
      });
    });
  }

  // 놓은 자리에서 가장 가까운 4방향 접합면을 찾아 붙인다
  function trySnap(g) {
    let best = null;
    for (const other of groups) {
      if (other === g) continue;
      for (const ob of other.blocks) {
        for (const dir of DIRS) {
          const tx = other.x + (ob.gx + dir[0]) * S;
          const ty = other.y + (ob.gy + dir[1]) * S;
          for (const mb of g.blocks) {
            const nx = tx - mb.gx * S;
            const ny = ty - mb.gy * S;
            const d = Math.hypot(nx - g.x, ny - g.y);
            if (d > S * SNAP_RATIO) continue;
            if (best && d >= best.d) continue;
            if (overlaps(g, nx, ny)) continue;
            best = { d: d, nx: nx, ny: ny, other: other };
          }
        }
      }
    }
    if (!best) return false;

    g.x = best.nx;
    g.y = best.ny;
    merge(best.other, g);
    attachAll(best.other);    // 닿은 뭉치가 여럿이면 한꺼번에 다 붙는다
    return true;
  }

  // 두 뭉치가 4방향으로 맞닿아 있는가
  function touches(a, b) {
    const tol = S * 0.2;
    return a.blocks.some((ab) => {
      const ax = a.x + ab.gx * S;
      const ay = a.y + ab.gy * S;
      return b.blocks.some((bb) => {
        const dx = Math.abs(ax - (b.x + bb.gx * S));
        const dy = Math.abs(ay - (b.y + bb.gy * S));
        return (Math.abs(dx - S) < tol && dy < tol) ||
               (Math.abs(dy - S) < tol && dx < tol);
      });
    });
  }

  // b의 블럭들이 a의 빈 칸에만 들어가는가
  function fits(a, b) {
    const taken = new Set(a.blocks.map((x) => x.gx + ',' + x.gy));
    return b.blocks.every((x) => {
      const gx = Math.round((b.x + x.gx * S - a.x) / S);
      const gy = Math.round((b.y + x.gy * S - a.y) / S);
      return !taken.has(gx + ',' + gy);
    });
  }

  // 맞닿은 뭉치를 더 없을 때까지 계속 흡수한다
  function attachAll(g) {
    for (;;) {
      const next = groups.find((o) => o !== g && touches(g, o) && fits(g, o));
      if (!next) return;
      merge(g, next);
    }
  }

  // g의 블럭을 target 뭉치로 옮겨 담는다 (좌표는 target 기준 칸으로 환산)
  function merge(target, g) {
    g.blocks.forEach((b) => {
      b.gx = Math.round((g.x + b.gx * S - target.x) / S);
      b.gy = Math.round((g.y + b.gy * S - target.y) / S);
      b.g = target;
      target.el.appendChild(b.el);
      target.blocks.push(b);
    });
    g.blocks = [];
    dropGroup(g);
    render(target);
  }

  /* ---------- 떼어내기 ---------- */

  // 블럭 하나를 제 뭉치에서 빼내 낱개 뭉치로 만든다
  function detach(b) {
    const src = b.g;
    if (src.blocks.length === 1) return src;

    const ng = makeGroup(src.x + b.gx * S, src.y + b.gy * S);
    src.blocks = src.blocks.filter((x) => x !== b);
    b.g = ng;
    b.gx = 0;
    b.gy = 0;
    ng.el.appendChild(b.el);
    ng.blocks.push(b);
    render(ng);

    splitApart(src);
    render(src);
    return ng;
  }

  // 가운데가 빠져 끊어진 뭉치는 이어진 덩어리끼리 갈라 놓는다
  function splitApart(g) {
    if (g.blocks.length < 2) return;
    const at = new Map(g.blocks.map((b) => [b.gx + ',' + b.gy, b]));
    const seen = new Set();
    const parts = [];

    g.blocks.forEach((b) => {
      if (seen.has(b)) return;
      const part = [];
      const stack = [b];
      seen.add(b);
      while (stack.length) {
        const cur = stack.pop();
        part.push(cur);
        DIRS.forEach((d) => {
          const n = at.get((cur.gx + d[0]) + ',' + (cur.gy + d[1]));
          if (n && !seen.has(n)) { seen.add(n); stack.push(n); }
        });
      }
      parts.push(part);
    });
    if (parts.length < 2) return;

    // 첫 덩어리는 원래 뭉치에 남기고 나머지는 자리 그대로 새 뭉치로 옮긴다
    parts.slice(1).forEach((part) => {
      const ng = makeGroup(g.x, g.y);
      part.forEach((b) => {
        g.blocks = g.blocks.filter((x) => x !== b);
        b.g = ng;
        ng.el.appendChild(b.el);
        ng.blocks.push(b);
      });
      render(ng);
    });
  }

  /* ---------- 행동과 반응 ---------- */

  // 같은 뭉치 안에서 4방향으로 맞닿은 블럭
  function neighbors(b) {
    return b.g.blocks.filter((o) =>
      Math.abs(o.gx - b.gx) + Math.abs(o.gy - b.gy) === 1);
  }

  // 반응했다는 표시로 한 번 깜빡인다 — 그동안 다른 블럭 위로 올라온다
  function blink(b) {
    b.el.classList.remove('is-reacting');
    void b.el.offsetWidth;            // 애니메이션 재시작
    b.el.classList.add('is-reacting');
    b.reacting += 1;
    applyZ(b);
    setTimeout(() => {
      b.reacting -= 1;
      if (!b.reacting) b.el.classList.remove('is-reacting');
      applyZ(b);
    }, BLINK_MS);
  }

  // 행동을 쥐고 있는 동안(다음 블럭으로 넘기기 전까지) 가장 위로 올라온다
  function hold(b, uid) {
    b.acting += 1;
    applyZ(b);
    setTimeout(() => {
      b.acting -= 1;
      applyZ(b);
      spread(b, uid);
    }, HOP_MS);
  }

  let audio = null;

  // beeper의 반응 — 낮게 떨어지는 deep 소리
  function deepSound() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audio = audio || new Ctx();
      if (audio.state === 'suspended') audio.resume();
      const t = audio.currentTime;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(55, t + 0.28);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.3, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      osc.connect(gain).connect(audio.destination);
      osc.start(t);
      osc.stop(t + 0.32);
    } catch (err) { /* 소리를 못 내도 게임은 굴러간다 */ }
  }

  // 같은 uid의 행동에는 한 번만 반응한다
  function markSeen(b, uid) {
    if (b.seen.has(uid)) return false;
    b.seen.add(uid);
    setTimeout(() => b.seen.delete(uid), FORGET_MS);
    return true;
  }

  // 행동이 블럭에 도착 — 반응하는 블럭만 깜빡이고, 전달은 종류와 무관하게 이어진다
  function deliver(b, uid) {
    if (!b.el.isConnected) return;
    if (!markSeen(b, uid)) return;

    if (b.type === 'beeper') {
      blink(b);
      deepSound();
    } else if (b.type === 'maker') {
      blink(b);
      popChip(b);
    } else if (b.type === 'collector') {
      blink(b);
      pullChips(b);
    } else if (b.type === '+') {
      blink(b);
      flushPlus(b);
    }
    hold(b, uid);
  }

  function spread(b, uid) {
    if (!b.el.isConnected) return;
    neighbors(b).forEach((n) => deliver(n, uid));
  }

  // clicker의 반응 — 깜빡이고 새 행동을 하나 만든다
  function click(b) {
    const uid = nextUid();
    markSeen(b, uid);
    blink(b);
    hold(b, uid);
  }

  /* ---------- 칩 ---------- */

  const chipSize = () => Math.round(S / 3);

  function makeChip(x, y, value, kind) {
    const el = document.createElement('div');
    el.className = 'chip';
    el.textContent = value;
    el.style.zIndex = Z_CHIP;
    board.appendChild(el);
    const c = { uid: nextUid(), kind: kind || CHIP_KIND, value: value,
                x: x, y: y, vx: 0, vy: 0, held: false, el: el };
    chips.push(c);
    sizeChip(c);
    placeChip(c);
    refreshLinks();
    save();
    return c;
  }

  function sizeChip(c) {
    const d = chipSize();
    c.el.style.width = d + 'px';
    c.el.style.height = d + 'px';
    c.el.style.fontSize = Math.round(d * 0.5) + 'px';
  }

  // 판 안으로 가둔 뒤 그린다
  function placeChip(c) {
    const d = chipSize();
    c.x = Math.max(0, Math.min(c.x, board.clientWidth - d));
    c.y = Math.max(0, Math.min(c.y, board.clientHeight - d));
    c.el.style.left = c.x + 'px';
    c.el.style.top = c.y + 'px';
  }

  function startChips() {
    if (chipRaf === null) chipRaf = requestAnimationFrame(stepChips);
  }

  // 튕겨 나간 칩이 벽에 부딪히며 굴러가다 멈춘다
  function stepChips() {
    const d = chipSize();
    const maxX = board.clientWidth - d;
    const maxY = board.clientHeight - d;

    chips.forEach((c) => {
      if (c.held || (!c.vx && !c.vy)) return;
      c.x += c.vx;
      c.y += c.vy;
      if (c.x < 0) { c.x = 0; c.vx *= -CHIP_BOUNCE; }
      if (c.x > maxX) { c.x = maxX; c.vx *= -CHIP_BOUNCE; }
      if (c.y < 0) { c.y = 0; c.vy *= -CHIP_BOUNCE; }
      if (c.y > maxY) { c.y = maxY; c.vy *= -CHIP_BOUNCE; }
      c.vx *= CHIP_DRAG_FRICTION;
      c.vy *= CHIP_DRAG_FRICTION;
      if (Math.hypot(c.vx, c.vy) < 0.3) { c.vx = 0; c.vy = 0; }
      placeChip(c);
    });
    storeTouching();

    const moving = chips.some((c) => !c.held && (c.vx || c.vy));
    chipRaf = moving ? requestAnimationFrame(stepChips) : null;
    if (!moving) save();
  }

  // maker의 반응 — 칩 하나를 만들어 위쪽으로 튕겨낸다
  function popChip(b) {
    const d = chipSize();
    const c = makeChip(b.g.x + b.gx * S + (S - d) / 2,
                       b.g.y + b.gy * S + (S - d) / 2,
                       CHIP_VALUE, CHIP_KIND);
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
    const speed = S * CHIP_POP;
    c.vx = Math.cos(angle) * speed;
    c.vy = Math.sin(angle) * speed;
    startChips();
    return c;
  }

  /* ---------- collector ---------- */

  const eachBlock = (fn) => groups.forEach((g) => g.blocks.forEach(fn));
  const blockCenter = (b) => [b.g.x + b.gx * S + S / 2, b.g.y + b.gy * S + S / 2];
  const chipCenter = (c) => { const d = chipSize(); return [c.x + d / 2, c.y + d / 2]; };

  // 등록 — 사용자가 칩을 끌어다 놓으면, 범위 안의 collector에 그 칩의 '유형'이 기록된다.
  // 저장과 달리 칩은 그대로 남고, 기록된 유형은 블럭의 특수 기능이 쓰는 변수가 된다.
  function register(c) {
    const [cx, cy] = chipCenter(c);
    let owner = null;
    let best = COLLECT_RANGE * S;
    eachBlock((b) => {
      if (b.type !== 'collector') return;
      const [bx, by] = blockCenter(b);
      const dist = Math.hypot(cx - bx, cy - by);
      if (dist <= best) { best = dist; owner = b; }
    });
    if (!owner) return;
    owner.registered = c.kind;
    owner.el.classList.add('is-armed');
    refreshLinks();
    save();
  }

  // 어느 collector든 그 유형을 등록해 두었다면, 같은 유형의 칩은 모두 표시된다
  function refreshLinks() {
    const kinds = new Set();
    eachBlock((b) => { if (b.registered) kinds.add(b.registered); });
    chips.forEach((c) => {
      c.el.classList.toggle('is-linked', kinds.has(c.kind));
      c.el.style.setProperty('--link', TYPES.collector.tone);
    });
  }

  // collector의 반응 — 등록된 칩을 제 쪽으로 조금씩 끌어당긴다.
  // 등록된 칩이 하나도 없으면 아무것도 끌어당기지 않는다.
  function pullChips(b) {
    if (!b.registered) return;
    const mine = chips.filter((c) => c.kind === b.registered && !c.held);
    if (!mine.length) return;

    const [bx, by] = blockCenter(b);
    mine.forEach((c) => {
      const [cx, cy] = chipCenter(c);
      const dx = bx - cx;
      const dy = by - cy;
      const len = Math.hypot(dx, dy) || 1;
      const speed = S * COLLECT_PULL;
      c.vx += (dx / len) * speed;
      c.vy += (dy / len) * speed;
    });
    startChips();
  }

  // 원과 사각형이 닿았는지
  function touchesBlock(b, cx, cy, r) {
    const bx = b.g.x + b.gx * S;
    const by = b.g.y + b.gy * S;
    const nx = Math.max(bx, Math.min(cx, bx + S));
    const ny = Math.max(by, Math.min(cy, by + S));
    return Math.hypot(cx - nx, cy - ny) <= r;
  }

  // 칩이 블럭에 닿으면 collector는 저장하고, +는 받아 든다
  function storeTouching() {
    const r = chipSize() / 2;
    for (let i = chips.length - 1; i >= 0; i--) {
      const c = chips[i];
      if (c.held) continue;
      const [cx, cy] = chipCenter(c);

      // 방금 그 블럭이 내놓은 칩은 블럭에서 벗어나야 다시 먹힌다
      if (c.from && !touchesBlock(c.from, cx, cy, r)) c.from = null;

      let target = null;
      eachBlock((b) => {
        if (target || b === c.from) return;
        if (b.type !== 'collector' && b.type !== '+') return;
        if (touchesBlock(b, cx, cy, r)) target = b;
      });
      if (!target) continue;

      if (target.type === 'collector') {
        target.stored += c.value;
        showStore(target);
        dropChip(i);
      } else {
        takeIntoPlus(target, c, i);
      }
      save();
    }
  }

  function dropChip(i) {
    chips[i].el.remove();
    chips.splice(i, 1);
  }

  // + 는 받은 칩을 쌓아 둔다. 더하기는 행동을 받았을 때 한다.
  function takeIntoPlus(b, c, i) {
    b.regs.push({ kind: c.kind, value: c.value });
    showRegs(b);
    dropChip(i);
  }

  // + 의 반응 — 등록된 칩을 유형별로 모두 더해 내놓는다.
  // 유형이 다르면 더할 수 없으므로 유형마다 하나씩 따로 내놓는다.
  function flushPlus(b) {
    if (!b.regs.length) return;

    const sums = new Map();
    b.regs.forEach((r) => sums.set(r.kind, (sums.get(r.kind) || 0) + r.value));
    b.regs = [];
    showRegs(b);

    const kinds = [...sums.keys()];
    kinds.forEach((kind, i) => {
      const lean = kinds.length === 1 ? 0 : -0.6 + (1.2 * i) / (kinds.length - 1);
      eject(b, kind, sums.get(kind), lean);
    });
  }

  // 블럭에서 칩을 내보낸다 — 내보낸 블럭은 그 칩을 곧바로 다시 먹지 않는다
  function eject(b, kind, value, lean) {
    const d = chipSize();
    const c = makeChip(b.g.x + b.gx * S + (S - d) / 2,
                       b.g.y + b.gy * S + (S - d) / 2,
                       value, kind);
    const angle = -Math.PI / 2 + lean;
    const speed = S * CHIP_POP;
    c.vx = Math.cos(angle) * speed;
    c.vy = Math.sin(angle) * speed;
    c.from = b;
    startChips();
    return c;
  }

  // 블럭 모서리에 숫자를 띄운다 (collector는 저장 수량, +는 들고 있는 칩)
  function badge(b, text) {
    if (!b.storeEl) {
      b.storeEl = document.createElement('span');
      b.storeEl.className = 'store';
      b.el.appendChild(b.storeEl);
    }
    b.storeEl.textContent = text;
    b.storeEl.style.display = text === '' ? 'none' : '';
  }

  const showStore = (b) => badge(b, b.stored);
  const showRegs = (b) => badge(b, b.regs.length ? b.regs.length : '');

  /* ---------- 입력 ---------- */

  const findGroup = (el) => groups.find((g) => g.el.contains(el));

  // mover는 붙어 있는 것까지 통째로 끈다. 단, 혼자 이동이 예약됐으면 낱개로 떨어진다.
  const dragsAlone = (b) => b.type !== 'mover' || b.solo;

  board.addEventListener('pointerdown', (e) => {
    const blockEl = e.target.closest('.block');
    if (!blockEl) return;
    const src = findGroup(blockEl);
    if (!src) return;

    const b = src.blocks.find((x) => x.el === blockEl);
    const alone = dragsAlone(b);
    let lastX = e.clientX;
    let lastY = e.clientY;
    let moved = 0;
    let held = null;          // 손에 들린 뭉치
    let grabX = 0;
    let grabY = 0;

    // 캡처가 되면 좋지만, 안 되더라도 window에서 끝까지 따라간다
    try { blockEl.setPointerCapture(e.pointerId); } catch (err) { /* 캡처 불가한 입력은 그냥 진행 */ }

    const move = (ev) => {
      if (ev.pointerId !== e.pointerId) return;
      moved += Math.hypot(ev.clientX - lastX, ev.clientY - lastY);
      lastX = ev.clientX;
      lastY = ev.clientY;

      const br = board.getBoundingClientRect();
      if (!held) {
        if (moved < CLICK_SLOP) return;   // 살짝 흔든 건 클릭으로 본다
        held = alone ? detach(b) : src;
        // 잡은 지점은 처음 누른 자리 기준 — 문턱을 넘는 순간 튀지 않는다
        grabX = e.clientX - br.left - held.x;
        grabY = e.clientY - br.top - held.y;
        held.el.classList.add('is-dragging');
      }
      held.x = ev.clientX - br.left - grabX;
      held.y = ev.clientY - br.top - grabY;
      clamp(held);
      render(held);
    };

    // 커서가 블럭 밖이든 판 밖이든, 손을 떼면 드래그는 끝난다
    const up = (ev) => {
      if (ev && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      window.removeEventListener('blur', up);

      if (!held) {
        if (b.type === 'clicker') click(b);
        return;
      }
      held.el.classList.remove('is-dragging');
      setSolo(b, false);        // 예약된 혼자 이동은 한 번 쓰면 풀린다
      trySnap(held);
      save();
    };

    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    window.addEventListener('blur', up);
  });

  // 칩은 블럭과 상관없이 따로 끌어 옮긴다
  board.addEventListener('pointerdown', (e) => {
    const chipEl = e.target.closest('.chip');
    if (!chipEl) return;
    const c = chips.find((x) => x.el === chipEl);
    if (!c) return;

    const br = board.getBoundingClientRect();
    const grabX = e.clientX - br.left - c.x;
    const grabY = e.clientY - br.top - c.y;
    c.held = true;
    c.vx = 0;
    c.vy = 0;
    c.el.classList.add('is-dragging');
    c.el.style.zIndex = Z_CHIP_DRAG;
    try { chipEl.setPointerCapture(e.pointerId); } catch (err) { /* 캡처 불가한 입력은 그냥 진행 */ }

    const move = (ev) => {
      if (ev.pointerId !== e.pointerId) return;
      const r = board.getBoundingClientRect();
      c.x = ev.clientX - r.left - grabX;
      c.y = ev.clientY - r.top - grabY;
      placeChip(c);
    };

    const up = (ev) => {
      if (ev && ev.pointerId !== undefined && ev.pointerId !== e.pointerId) return;
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      window.removeEventListener('blur', up);
      c.held = false;
      c.el.classList.remove('is-dragging');
      c.el.style.zIndex = Z_CHIP;
      register(c);
      storeTouching();
      save();
    };

    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    window.addEventListener('blur', up);
  });

  function setSolo(b, on) {
    if (b.solo === on) return;
    b.solo = on;
    b.el.classList.toggle('is-solo', on);
    save();
  }

  // mover를 더블클릭하면 다음 드래그 한 번은 인접 블럭을 무시한다
  board.addEventListener('dblclick', (e) => {
    const blockEl = e.target.closest('.block');
    if (!blockEl) return;
    const g = findGroup(blockEl);
    if (!g) return;
    const b = g.blocks.find((x) => x.el === blockEl);
    if (!b || b.type !== 'mover') return;
    setSolo(b, !b.solo);
  });

  /* ---------- 저장 ---------- */

  const SAVE_KEY = 'game-card/state/v1';
  const SAVE_DELAY = 250;
  let saveTimer = null;

  // 좌표는 블럭 한 변(S) 기준으로 저장한다 — 화면 크기가 달라져도 자리가 유지된다
  function snapshot() {
    return {
      v: 1,
      groups: groups.map((g) => ({
        x: g.x / S,
        y: g.y / S,
        blocks: g.blocks.map((b) => ({
          t: b.type, x: b.gx, y: b.gy,
          s: b.stored || 0,
          r: b.registered || null,
          h: b.regs.length ? b.regs : null,
        })),
      })),
      chips: chips.map((c) => ({ k: c.kind, v: c.value, x: c.x / S, y: c.y / S })),
    };
  }

  function writeState() {
    saveTimer = null;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot()));
    } catch (err) { /* 저장을 못 해도 게임은 굴러간다 */ }
  }

  // 상태가 바뀔 때마다 불린다. 연달아 불려도 한 번만 쓴다.
  function save() {
    if (saveTimer === null) saveTimer = setTimeout(writeState, SAVE_DELAY);
  }

  function restore() {
    let state = null;
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      state = JSON.parse(raw);
    } catch (err) {
      return false;
    }
    if (!state || state.v !== 1 || !Array.isArray(state.groups)) return false;

    const total = state.groups.reduce((n, g) => n + (g.blocks ? g.blocks.length : 0), 0);
    if (!total) return false;

    groups.slice().forEach(dropGroup);
    chips.forEach((c) => c.el.remove());
    chips = [];
    S = fitSize(total);

    state.groups.forEach((gs) => {
      if (!gs.blocks || !gs.blocks.length) return;
      const g = makeGroup(gs.x * S, gs.y * S);
      gs.blocks.forEach((bs) => {
        const type = bs.t === 'deeper' ? 'beeper' : bs.t;   // 옛 저장 호환
        if (!TYPES[type]) return;
        const b = addBlock(g, type, bs.x, bs.y);
        b.stored = bs.s || 0;
        b.registered = bs.r || null;
        b.regs = Array.isArray(bs.h) ? bs.h : [];
        if (b.stored) showStore(b);
        else if (b.regs.length) showRegs(b);
        if (b.registered) b.el.classList.add('is-armed');
      });
      if (!g.blocks.length) { dropGroup(g); return; }
      clamp(g);
      render(g);
    });
    if (!groups.length) return false;

    (state.chips || []).forEach((cs) => {
      makeChip(cs.x * S, cs.y * S, cs.v || 1, cs.k);
    });
    refreshLinks();
    return true;
  }

  /* ---------- 배치 ---------- */

  // 화면이 좁을수록 블럭도 작아진다
  function blockSize() {
    const base = Math.min(board.clientWidth, board.clientHeight);
    return Math.round(Math.max(56, Math.min(120, base * 0.18)));
  }

  // 시작 블럭 전부가 화면에 들어갈 때까지 크기를 줄인다
  function fitSize(n) {
    let size = blockSize();
    for (; size > 28; size -= 2) {
      const gap = Math.round(size * 0.25);
      const cols = Math.max(1, Math.floor((board.clientWidth - gap) / (size + gap)));
      const rows = Math.ceil(n / cols);
      if (rows * size + (rows - 1) * gap <= board.clientHeight - gap * 2) break;
    }
    return size;
  }

  // 시작 블럭을 화면 가운데에 늘어놓는다. 한 줄에 다 안 들어가면 줄을 나눈다.
  function layout() {
    groups.slice().forEach(dropGroup);
    S = fitSize(START.length);

    const gap = Math.round(S * 0.25);
    const cols = Math.max(1, Math.min(START.length,
      Math.floor((board.clientWidth - gap) / (S + gap))));
    const rows = Math.ceil(START.length / cols);
    const x0 = (board.clientWidth - (cols * S + (cols - 1) * gap)) / 2;
    const y0 = (board.clientHeight - (rows * S + (rows - 1) * gap)) / 2;

    START.forEach((type, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const g = makeGroup(x0 + col * (S + gap), y0 + row * (S + gap));
      addBlock(g, type, 0, 0);
      clamp(g);
      render(g);
    });
    save();
  }

  // 화면 크기가 바뀌면 블럭 크기를 다시 잡되, 조립해 둔 건 그대로 둔다
  let laidOut = false;
  new ResizeObserver(() => {
    if (!board.clientWidth) return;
    if (!laidOut) {
      laidOut = true;
      if (!restore()) layout();
      return;
    }

    const next = blockSize();
    const ratio = next / S;
    S = next;
    groups.forEach((g) => {
      g.x *= ratio;
      g.y *= ratio;
      clamp(g);
      render(g);
    });
    chips.forEach((c) => {
      c.x *= ratio;
      c.y *= ratio;
      sizeChip(c);
      placeChip(c);
    });
    save();
  }).observe(board);
})();
</script>
</body>
</html>
