<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 블럭 — Game Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  .hero{margin-bottom:var(--s4);}
  .hero h1{font-size:36px;line-height:1.1;margin:0;}
  .hero p{color:var(--muted);font-size:16px;margin-top:var(--s3);}

  .bar{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center;margin-bottom:var(--s4);}

  /* 블럭이 놓이는 판 */
  .board{
    position:relative;
    height:min(70vh,560px);
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:var(--r-lg);
    box-shadow:var(--sh-sm);
    overflow:hidden;
    touch-action:none;
  }

  /* 붙어 있는 블럭 뭉치 — 통째로 움직인다 */
  .group{position:absolute;left:0;top:0;width:0;height:0;}
  .group.is-dragging{z-index:2100000000;}

  /* 1 : 1 비율 블럭 */
  .block{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    background:linear-gradient(160deg,var(--surface-soft),#191914);
    border:1px solid var(--hairline);
    border-radius:var(--r-md);
    box-shadow:var(--sh-md);
    cursor:grab;
    user-select:none;
    touch-action:none;
    transition:border-color .15s,box-shadow .15s;
  }
  .block::before{
    content:'';position:absolute;inset:0;border-radius:inherit;
    background:var(--tone);opacity:.12;pointer-events:none;
  }
  .block:hover{border-color:var(--tone);}
  .group.is-dragging .block{cursor:grabbing;border-color:var(--tone);box-shadow:var(--sh-lg);}
  .block .icon{font-size:26px;line-height:1;}
  .block .name{
    color:var(--tone);font-size:11px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;
  }

  /* 반응 — 한 번 깜빡인다 */
  .block.is-reacting{animation:react .32s ease-out;}
  @keyframes react{
    0%  {border-color:var(--tone);box-shadow:var(--sh-md);}
    25% {border-color:var(--tone);box-shadow:0 0 0 3px var(--tone),0 0 24px var(--tone);filter:brightness(1.6);}
    100%{border-color:var(--hairline);box-shadow:var(--sh-md);}
  }

  @media(max-width:560px){
    .hero h1{font-size:28px;}
    .board{height:min(64vh,460px);}
    .block .icon{font-size:20px;}
    .block .name{font-size:9px;}
  }
</style>
</head>
<body>
  <main class="container">
    <header class="hero">
      <span class="eyebrow">Game Block</span>
      <h1>게임 블럭</h1>
      <p>드래그해서 4방향으로 붙이면 연결된다. clicker를 클릭하면 행동이 인접 블럭으로 퍼진다.</p>
    </header>

    <div class="bar">
      <button class="btn btn-primary" type="button" id="reset">블럭 정렬</button>
      <a class="btn btn-secondary" href="../index.html">← 목록으로</a>
    </div>

    <div class="board" id="board"></div>
  </main>

<script>
(() => {
  // 블럭 종류 — clicker와 deeper만 반응한다
  const TYPES = {
    pusher:   { icon: '⏩', tone: '#FFD400' },
    timer:    { icon: '⏱', tone: '#3A78C2' },
    loader:   { icon: '📥', tone: '#3FA66A' },
    unloader: { icon: '📤', tone: '#E0941A' },
    clicker:  { icon: '👆', tone: '#D24A4A' },
    deeper:   { icon: '🔊', tone: '#7C5CD6' },
  };
  const START = ['clicker', 'deeper', 'deeper', 'pusher', 'timer'];
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const SNAP_RATIO = 0.5;   // 블럭 한 변의 절반 안에 들어오면 붙는다
  const CLICK_SLOP = 5;     // 이만큼 안 움직이면 드래그로 치지 않는다
  const HOP_MS = 100;       // 기본딜레이 — 행동이 인접 블럭까지 가는 시간
  const FORGET_MS = 5000;   // 지나간 행동 uid를 잊는 시간
  const BLINK_MS = 340;     // 반응 깜빡임 길이

  // 겹칠 때의 depth 순서: 행동중 > 반응중 > 하단 > 우측 > 상단 > 좌측
  const Z_ACTING = 2000000000;
  const Z_REACTING = 1500000000;
  const Z_ROW = 4000;       // 아래쪽 한 줄이 오른쪽 끝보다 항상 위

  const board = document.getElementById('board');

  let S = 96;               // 블럭 한 변 (px)
  let groups = [];
  let uidSeq = 0;

  /* ---------- 뭉치·블럭 만들기 ---------- */

  function makeGroup(x, y) {
    const g = { x, y, blocks: [], el: document.createElement('div') };
    g.el.className = 'group';
    board.appendChild(g.el);
    groups.push(g);
    return g;
  }

  function addBlock(g, type, gx, gy) {
    const el = document.createElement('div');
    el.className = 'block';
    el.dataset.type = type;
    el.style.setProperty('--tone', TYPES[type].tone);
    el.innerHTML = '<span class="icon">' + TYPES[type].icon + '</span>' +
                   '<span class="name">' + type + '</span>';
    g.el.appendChild(el);
    const b = { type, gx, gy, el, g, seen: new Set(), acting: 0, reacting: 0 };
    g.blocks.push(b);
    return b;
  }

  function dropGroup(g) {
    groups = groups.filter((x) => x !== g);
    g.el.remove();
  }

  // 판 기준 좌표로 depth를 매긴다. 아래쪽이 위로, 같은 줄이면 오른쪽이 위로.
  function zOf(b) {
    const y = Math.max(0, Math.round(b.g.y + b.gy * S));
    const x = Math.max(0, Math.round(b.g.x + b.gx * S));
    return 1000 + y * Z_ROW + Math.min(x, Z_ROW - 1);
  }

  function applyZ(b) {
    b.el.style.zIndex = b.acting ? Z_ACTING : (b.reacting ? Z_REACTING : zOf(b));
  }

  function render(g) {
    g.el.style.transform = 'translate(' + g.x + 'px,' + g.y + 'px)';
    g.blocks.forEach((b) => {
      b.el.style.width = S + 'px';
      b.el.style.height = S + 'px';
      b.el.style.left = b.gx * S + 'px';
      b.el.style.top = b.gy * S + 'px';
      applyZ(b);
    });
  }

  const box = (g) => ({
    minX: Math.min(...g.blocks.map((b) => b.gx)),
    minY: Math.min(...g.blocks.map((b) => b.gy)),
    maxX: Math.max(...g.blocks.map((b) => b.gx)),
    maxY: Math.max(...g.blocks.map((b) => b.gy)),
  });

  // 뭉치 전체를 판 안으로 밀어 넣는다
  function clamp(g) {
    const bb = box(g);
    const w = (bb.maxX - bb.minX + 1) * S;
    const h = (bb.maxY - bb.minY + 1) * S;
    const left = g.x + bb.minX * S;
    const top = g.y + bb.minY * S;
    g.x += Math.max(0, Math.min(left, board.clientWidth - w)) - left;
    g.y += Math.max(0, Math.min(top, board.clientHeight - h)) - top;
  }

  /* ---------- 붙이기 ---------- */

  // 새 자리에 놓았을 때 다른 뭉치와 겹치는지
  function overlaps(g, nx, ny, ignore) {
    const eps = S * 0.2;
    return g.blocks.some((mb) => {
      const ax = nx + mb.gx * S;
      const ay = ny + mb.gy * S;
      return groups.some((other) => {
        if (other === g || other === ignore) return false;
        return other.blocks.some((ob) => {
          const bx = other.x + ob.gx * S;
          const by = other.y + ob.gy * S;
          return Math.abs(ax - bx) < S - eps && Math.abs(ay - by) < S - eps;
        });
      });
    });
  }

  // 놓은 자리에서 가장 가까운 4방향 접합면을 찾아 붙인다
  function trySnap(g) {
    let best = null;
    for (const other of groups) {
      if (other === g) continue;
      for (const ob of other.blocks) {
        for (const dir of DIRS) {
          const tx = other.x + (ob.gx + dir[0]) * S;
          const ty = other.y + (ob.gy + dir[1]) * S;
          for (const mb of g.blocks) {
            const nx = tx - mb.gx * S;
            const ny = ty - mb.gy * S;
            const d = Math.hypot(nx - g.x, ny - g.y);
            if (d > S * SNAP_RATIO) continue;
            if (best && d >= best.d) continue;
            if (overlaps(g, nx, ny, other)) continue;
            best = { d: d, nx: nx, ny: ny, other: other };
          }
        }
      }
    }
    if (!best) return false;

    g.x = best.nx;
    g.y = best.ny;
    merge(best.other, g);
    return true;
  }

  // g의 블럭을 target 뭉치로 옮겨 담는다 (좌표는 target 기준 칸으로 환산)
  function merge(target, g) {
    g.blocks.forEach((b) => {
      b.gx = Math.round((g.x + b.gx * S - target.x) / S);
      b.gy = Math.round((g.y + b.gy * S - target.y) / S);
      b.g = target;
      target.el.appendChild(b.el);
      target.blocks.push(b);
    });
    g.blocks = [];
    dropGroup(g);
    render(target);
  }

  /* ---------- 행동과 반응 ---------- */

  // 같은 뭉치 안에서 4방향으로 맞닿은 블럭
  function neighbors(b) {
    return b.g.blocks.filter((o) =>
      Math.abs(o.gx - b.gx) + Math.abs(o.gy - b.gy) === 1);
  }

  // 반응했다는 표시로 한 번 깜빡인다 — 그동안 다른 블럭 위로 올라온다
  function blink(b) {
    b.el.classList.remove('is-reacting');
    void b.el.offsetWidth;            // 애니메이션 재시작
    b.el.classList.add('is-reacting');
    b.reacting += 1;
    applyZ(b);
    setTimeout(() => {
      b.reacting -= 1;
      if (!b.reacting) b.el.classList.remove('is-reacting');
      applyZ(b);
    }, BLINK_MS);
  }

  // 행동을 쥐고 있는 동안(다음 블럭으로 넘기기 전까지) 가장 위로 올라온다
  function hold(b, uid) {
    b.acting += 1;
    applyZ(b);
    setTimeout(() => {
      b.acting -= 1;
      applyZ(b);
      spread(b, uid);
    }, HOP_MS);
  }

  let audio = null;

  // deeper의 반응 — 낮게 떨어지는 deep 소리
  function deepSound() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audio = audio || new Ctx();
      if (audio.state === 'suspended') audio.resume();
      const t = audio.currentTime;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(55, t + 0.28);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.3, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      osc.connect(gain).connect(audio.destination);
      osc.start(t);
      osc.stop(t + 0.32);
    } catch (err) { /* 소리를 못 내도 게임은 굴러간다 */ }
  }

  // 같은 uid의 행동에는 한 번만 반응한다
  function markSeen(b, uid) {
    if (b.seen.has(uid)) return false;
    b.seen.add(uid);
    setTimeout(() => b.seen.delete(uid), FORGET_MS);
    return true;
  }

  // 행동이 블럭에 도착 — 반응하는 블럭만 깜빡이고, 전달은 종류와 무관하게 이어진다
  function deliver(b, uid) {
    if (!b.el.isConnected) return;
    if (!markSeen(b, uid)) return;

    if (b.type === 'deeper') {
      blink(b);
      deepSound();
    }
    hold(b, uid);
  }

  function spread(b, uid) {
    if (!b.el.isConnected) return;
    neighbors(b).forEach((n) => deliver(n, uid));
  }

  // clicker의 반응 — 깜빡이고 새 행동을 하나 만든다
  function click(b) {
    const uid = ++uidSeq;
    markSeen(b, uid);
    blink(b);
    hold(b, uid);
  }

  /* ---------- 입력 ---------- */

  const findGroup = (el) => groups.find((g) => g.el.contains(el));

  board.addEventListener('pointerdown', (e) => {
    const blockEl = e.target.closest('.block');
    if (!blockEl) return;
    const g = findGroup(blockEl);
    if (!g) return;

    const b = g.blocks.find((x) => x.el === blockEl);
    const startX = e.clientX - g.x;
    const startY = e.clientY - g.y;
    let moved = 0;

    g.el.classList.add('is-dragging');
    try { blockEl.setPointerCapture(e.pointerId); } catch (err) { /* 캡처 불가한 입력은 그냥 진행 */ }

    const move = (ev) => {
      if (ev.pointerId !== e.pointerId) return;
      const px = g.x;
      const py = g.y;
      g.x = ev.clientX - startX;
      g.y = ev.clientY - startY;
      clamp(g);
      render(g);
      moved += Math.hypot(g.x - px, g.y - py);
    };

    const up = (ev) => {
      if (ev.pointerId !== e.pointerId) return;
      blockEl.removeEventListener('pointermove', move);
      blockEl.removeEventListener('pointerup', up);
      blockEl.removeEventListener('pointercancel', up);
      g.el.classList.remove('is-dragging');

      if (moved < CLICK_SLOP) {
        if (b.type === 'clicker') click(b);
        return;
      }
      trySnap(g);
    };

    blockEl.addEventListener('pointermove', move);
    blockEl.addEventListener('pointerup', up);
    blockEl.addEventListener('pointercancel', up);
  });

  /* ---------- 배치 ---------- */

  function blockSize() {
    const byWidth = (board.clientWidth - 24 * (START.length + 1)) / START.length;
    const byHeight = board.clientHeight * 0.4;
    return Math.max(64, Math.min(byWidth, byHeight, 120));
  }

  // 낱개 블럭 5개를 판 가운데에 가로로 늘어놓는다
  function layout() {
    groups.slice().forEach(dropGroup);
    S = blockSize();

    const gap = Math.min(24, S * 0.25);
    const total = S * START.length + gap * (START.length - 1);
    const x0 = (board.clientWidth - total) / 2;
    const y = (board.clientHeight - S) / 2;

    START.forEach((type, i) => {
      const g = makeGroup(x0 + i * (S + gap), y);
      addBlock(g, type, 0, 0);
      clamp(g);
      render(g);
    });
  }

  document.getElementById('reset').addEventListener('click', layout);

  // 첫 배치 이후에는 판 크기가 바뀌어도 조립해 둔 걸 흩뜨리지 않고 안쪽으로만 붙잡는다
  let laidOut = false;
  new ResizeObserver(() => {
    if (!board.clientWidth) return;
    if (!laidOut) { laidOut = true; layout(); return; }
    groups.forEach((g) => { clamp(g); render(g); });
  }).observe(board);
})();
</script>
</body>
</html>
