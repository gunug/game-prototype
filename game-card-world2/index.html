<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>카드 월드 RPG 2 — Game Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}
  body{background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;}
  [hidden]{display:none!important;}
  /* 인스펙터 자리: 가로가 긴 화면은 오른쪽 폭, 세로가 긴 화면은 하단 높이 (레거시와 같음) */
  :root{--insp-w:0px;--insp-h:0px;--top-h:48px;}
  @media (orientation: landscape){ :root{--insp-w:clamp(200px, 22vw, 280px);} }
  @media (orientation: portrait){ :root{--insp-h:clamp(150px, 28vh, 240px);} }

  /* 상단 막대 */
  .topbar{position:fixed;left:0;right:0;top:0;height:var(--top-h);z-index:2147483000;display:flex;align-items:center;gap:10px;padding:0 12px;
    background:rgba(20,20,16,.96);border-bottom:1px solid var(--hairline);box-sizing:border-box;}
  .topbar .title{font-weight:800;font-size:14px;white-space:nowrap;}
  .tabs{display:flex;gap:4px;flex:1;min-width:0;overflow:hidden;}
  .tabbtn{border:1px solid var(--hairline);background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;
    padding:6px 12px;border-radius:var(--r-pill);white-space:nowrap;cursor:pointer;}
  .tabbtn.on{background:var(--brand-yellow);color:var(--on-brand);border-color:var(--brand-yellow);}
  .topbar .meta{font-size:12px;color:var(--muted);white-space:nowrap;}
  .topbar .reset{border:1px solid var(--hairline);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:4px 10px;border-radius:var(--r-pill);cursor:pointer;}
  @media (max-width:480px){ .topbar .title{display:none;} }

  /* 필드 */
  .table{position:fixed;top:var(--top-h);left:0;right:var(--insp-w);bottom:var(--insp-h);overflow:hidden;touch-action:none;
    background:radial-gradient(ellipse at 50% 40%,#25251d 0%,var(--canvas) 72%);}
  .hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);color:var(--muted);font-size:14px;text-align:center;pointer-events:none;line-height:1.6;}

  /* 필드 아래 조작: 신의 선물 / 버리기 */
  .gift{position:absolute;left:12px;bottom:12px;z-index:2147482000;display:flex;align-items:center;gap:6px;
    background:var(--brand-yellow);color:var(--on-brand);border:0;font:inherit;font-weight:800;font-size:14px;padding:10px 14px;border-radius:var(--r-pill);box-shadow:var(--sh-md);cursor:pointer;}
  .gift .icon{width:24px;height:24px;margin:0;}
  .gift:active{transform:scale(.96);}
  .trash{position:absolute;right:12px;bottom:12px;z-index:1;width:calc(var(--cw) * 1.2);height:calc(var(--ch) * .9);
    border:2px dashed var(--hairline);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--muted);font-size:12px;font-weight:700;gap:2px;pointer-events:none;transition:background .15s,border-color .15s;}
  .trash .big{font-size:22px;}
  .trash.hot{border-color:#ff6b6b;background:rgba(255,90,90,.15);color:#ffb3b3;}

  /* 카드 (레거시 모양 그대로) */
  .cw{
    position:absolute;width:var(--cw);height:var(--ch);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw) * .03);
    background:linear-gradient(160deg,var(--surface-soft),#191914);
    border:1px solid var(--hairline);border-radius:var(--r-md);
    box-shadow:var(--sh-md);cursor:grab;touch-action:none;box-sizing:border-box;
    --tone:#8E8C82;
  }
  .cw::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--tone);opacity:.10;pointer-events:none;}
  .cw .emoji{font-size:calc(var(--cw) * .38);line-height:1;pointer-events:none;}
  .icon{display:block;width:1.15em;height:1.15em;margin:auto;image-rendering:pixelated;pointer-events:none;-webkit-user-drag:none;}
  .icon.inline{display:inline-block;width:1.35em;height:1.35em;margin:0 1px;vertical-align:-.35em;}
  .cw .name{color:var(--ink);font-size:calc(var(--cf) * .13);font-weight:700;text-align:center;padding:0 4px;line-height:1.15;pointer-events:none;}
  .cw .stats{position:absolute;left:0;right:0;top:calc(var(--cw) * .05);display:flex;justify-content:center;gap:4px;
    font-size:calc(var(--cf) * .095);font-weight:700;line-height:1;pointer-events:none;}
  .cw .stats .icon.inline{width:1.1em;height:1.1em;margin:0 1px 0 0;vertical-align:0;}
  .cw.framed{background:var(--frame) center/100% 100% no-repeat border-box;border-color:transparent;}
  .cw.framed::before{opacity:0;}
  .f-gold{--frame:url(images/frame/frame_gold.png);}
  .f-stone{--frame:url(images/frame/frame_stone.png);}
  .f-wood{--frame:url(images/frame/frame_wood.png);}
  .cw.sel{outline:2px solid rgba(255,255,255,.55);outline-offset:2px;}
  /* v0.1.1: 끌기 시작하면 조합 안 되는 카드는 흐려짐 (레거시 '흐려짐' = 어둡고 저채도) */
  .cw{transition:filter .2s;}
  .cw.dim{filter:brightness(.42) saturate(.3);}
  .cw.dragging{cursor:grabbing;box-shadow:var(--sh-lg);pointer-events:none;}
  /* v0.2.0: 조합되는 카드의 노란 테두리·번쩍임 없앰 — 흐려지지 않은 것만으로 구분 */
  .cw.spawn{animation:spawn .32s ease-out;}
  .cw.pop{animation:pop .5s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:translate(var(--fx),var(--fy)) scale(.2);opacity:0;}60%{opacity:1;}to{transform:none;opacity:1;}}
  .cw.bump{animation:bump .3s ease-out;}
  /* v0.2.2: 제작 성공 — 조합으로 막 나온 카드는 3초 동안 노란 테두리 깜빡임 (레거시 v0.79.0 모양) */
  .cw.made::after{content:'';position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--brand-yellow);
    box-shadow:0 0 6px rgba(255,212,0,.5);pointer-events:none;animation:freshBlink .5s steps(1,end) infinite;}
  .cw.fail::after{content:'';position:absolute;inset:-2px;border-radius:inherit;border:2px solid #ff6b6b;
    box-shadow:0 0 6px rgba(255,90,90,.55);pointer-events:none;animation:freshBlink .5s steps(1,end) infinite;}
  @keyframes freshBlink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
  .cw.gone{animation:gone .3s ease-in forwards;pointer-events:none;}
  @keyframes spawn{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.12);}100%{transform:scale(1);}}
  @keyframes gone{to{transform:scale(.3);opacity:0;}}

  /* 알림 */
  .toasts{position:fixed;left:0;right:var(--insp-w);z-index:2147483300;top:calc(var(--top-h) + 8px);
    display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;}
  .toast{background:rgba(28,28,23,.94);border:1px solid var(--hairline);color:var(--ink);
    font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--r-pill);white-space:nowrap;animation:toast 2.6s forwards;}
  @keyframes toast{0%{opacity:0;transform:translateY(-6px);}10%{opacity:1;transform:none;}85%{opacity:1;}100%{opacity:0;}}

  /* 인스펙터 */
  .insp{position:fixed;z-index:2147482900;background:rgba(22,22,18,.97);box-sizing:border-box;overflow-y:auto;padding:12px 14px;font-size:13px;line-height:1.5;}
  @media (orientation: landscape){ .insp{right:0;top:var(--top-h);bottom:0;width:var(--insp-w);border-left:1px solid var(--hairline);} }
  @media (orientation: portrait){ .insp{left:0;right:0;bottom:0;height:var(--insp-h);border-top:1px solid var(--hairline);} }
  .insp .empty{color:var(--muted);}
  .insp .head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .insp .head .pic{font-size:34px;line-height:1;}
  .insp .head .nm{font-size:16px;font-weight:800;}
  .insp .head .kd{font-size:12px;color:var(--muted);}
  .insp .desc{color:var(--muted);font-style:italic;margin:2px 0 8px;}
  .insp .chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .insp .chip{font-size:11px;padding:2px 8px;border-radius:var(--r-pill);border:1px solid var(--hairline);color:var(--ink);}
  .insp .sub{font-size:11px;font-weight:800;color:var(--brand-yellow);margin:8px 0 4px;letter-spacing:.02em;}
  .insp .row{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);}
  .insp .i-muted{color:var(--muted);}
  .locked .icon{filter:brightness(0) opacity(.45);}                 /* 미발견: 검은 실루엣 */

  /* 콜렉터북 (v0.4.0) — 화면 아래에서 올라오는 모달. 뒤는 어둡게 가림 */
  .book-back{position:fixed;inset:0;z-index:2147483200;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;}
  .book-back.open{opacity:1;pointer-events:auto;}
  .book{position:fixed;left:0;right:0;bottom:0;z-index:2147483210;max-height:82vh;display:flex;flex-direction:column;box-sizing:border-box;
    background:linear-gradient(180deg,#2a2419,#1b1812);border-top:1px solid var(--hairline);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.6);
    transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.85,.25,1);padding-bottom:env(safe-area-inset-bottom,0px);}
  .book.open{transform:translateY(0);}
  .book-grip{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:8px auto 2px;flex:none;}
  .book-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 16px 8px;flex:none;}
  .book-title{font-weight:800;font-size:15px;}
  .book-tabs{display:flex;gap:4px;flex:1;}
  .book-head .meta{font-size:12px;color:var(--muted);}
  .book-close{border:1px solid var(--hairline);background:transparent;color:var(--ink);font:inherit;width:30px;height:30px;border-radius:var(--r-pill);cursor:pointer;}
  .book-close:disabled{opacity:.3;cursor:default;}
  .book-detail{margin:0 16px 6px;padding:8px 10px;border-radius:var(--r-md);background:rgba(255,255,255,.04);font-size:12px;line-height:1.5;min-height:1.5em;flex:none;}
  .book-detail .nm{font-weight:800;font-size:13px;}
  .book-detail .i-muted{color:var(--muted);}
  .book-body{overflow-y:auto;padding:0 16px 20px;}
  .book-inner{max-width:760px;margin:0 auto;}
  .book-field{margin:10px 0 14px;}
  .book-fname{font-size:13px;font-weight:800;color:var(--brand-yellow);margin-bottom:6px;}
  .book-row{display:flex;gap:10px;flex-wrap:wrap;}
  /* 슬리브: 카드를 끼우는 투명 비닐 주머니. 앞면 아래쪽 덮개(::after)가 카드 위에 겹쳐 '끼워진' 느낌 */
  .sleeve{position:relative;width:calc(var(--cw) + 8px);height:calc(var(--ch) + 8px);border-radius:calc(var(--r-md) + 2px);cursor:pointer;
    background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
  .sleeve::after{content:'';position:absolute;left:0;right:0;bottom:0;height:58%;border-radius:0 0 calc(var(--r-md) + 2px) calc(var(--r-md) + 2px);
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05) 30%,rgba(255,255,255,.03));border-top:1px solid rgba(255,255,255,.22);pointer-events:none;z-index:2;}
  .sleeve .cw{position:absolute;left:4px;top:4px;cursor:pointer;z-index:1;}
  .sleeve .cw.locked{opacity:.55;}
  .sleeve .cw.locked .name{color:var(--muted);}
  .sleeve.sel{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);}
  /* 새 카드 끼우기: 슬리브 위에서 아래로 쑥 */
  .sleeve .cw.insert{animation:sleeveIn .7s cubic-bezier(.3,.7,.3,1) both;}
  @keyframes sleeveIn{
    0%{transform:translateY(calc(-1 * var(--ch) - 30px)) rotate(-4deg);opacity:0;}
    25%{opacity:1;}
    75%{transform:translateY(4px) rotate(0deg);}
    100%{transform:translateY(0);}
  }
  .sleeve .cw.ghost{animation:ghostOut .35s ease-out forwards;}
  @keyframes ghostOut{to{opacity:0;}}
  .sleeve.glow{animation:sleeveGlow .6s ease-out .6s;}
  @keyframes sleeveGlow{0%{box-shadow:inset 0 0 0 2px var(--brand-yellow),0 0 0 0 rgba(255,212,0,.6);}100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 0 0 12px rgba(255,212,0,0);}}
  /* 일시정지: 필드 연출도 멈춤 */
  .table.paused .cw{animation-play-state:paused;}
</style></style>
</head>
<body>
<div class="topbar">
  <span class="title">🃏 카드 월드 2</span>
  <div class="tabs" id="tabs"><button class="tabbtn on" data-tab="craft">🔨 크래프팅</button></div>
  <span class="meta" id="seenMeta"></span>
  <button class="tabbtn" id="bookBtn">📖 콜렉터북</button>
  <button class="reset" id="reset">처음부터</button>
  <span class="meta" id="ver"></span>
</div>
<div class="table" id="table">
  <div class="hint" id="hint">🎁 <b>신의 선물</b>을 눌러 1티어 원물을 받고<br>📖 <b>콜렉터북</b>에서 모은 카드를 확인해 보세요</div>
  <button class="gift" id="gift"></button>
  <div class="trash" id="trash"><span class="big">🗑️</span>버리기</div>
</div>
<div class="book-back" id="bookBack"></div>
<div class="book" id="book"></div>
<div class="toasts" id="toasts"></div>
<div class="insp" id="insp"></div>
<script>
// ── world2 카드 데이터 (v0.3.0, 확정 48: 크래프트 티어) ─────────
// 레거시 조합식·재료는 쓰지 않음. 1티어만 있고, 2티어가 정해질 때까지 조합식 없음
// 1티어 = 자연에서 얻는 원물. 필드마다 4종 (v0.3.1: 석탄·약초·물고기·벌집 추가)
const FIELDS = [
  { id:'mountain',  name:'산',   emoji:'⛰️' },
  { id:'forest',    name:'숲',   emoji:'🌲' },
  { id:'river',     name:'강가', emoji:'🏞️' },
  { id:'grassland', name:'초원', emoji:'🌾' },
];
const FIELD_BY_ID = Object.fromEntries(FIELDS.map(f => [f.id, f]));
const DEFS = {
  package: { name:'신의 선물', kind:'package' },                // 신의 선물 버튼 그림만 (카드로는 안 나옴)
  // ⛰️ 산
  stone:   { name:'돌',     kind:'material', tier:1, field:'mountain' },
  flint:   { name:'부싯돌', kind:'material', tier:1, field:'mountain' },
  ore:     { name:'광석',   kind:'material', tier:1, field:'mountain' },
  coal:    { name:'석탄',   kind:'material', tier:1, field:'mountain' },
  // 🌲 숲
  tree:    { name:'나무',   kind:'material', tier:1, field:'forest' },
  berry:   { name:'열매',   kind:'material', tier:1, field:'forest' },
  sap:     { name:'수액',   kind:'material', tier:1, field:'forest' },
  herb:    { name:'약초',   kind:'material', tier:1, field:'forest' },
  // 🏞️ 강가
  water:   { name:'물',     kind:'material', tier:1, field:'river' },
  soil:    { name:'흙',     kind:'material', tier:1, field:'river' },
  sand:    { name:'모래',   kind:'material', tier:1, field:'river' },
  fish:    { name:'물고기', kind:'material', tier:1, field:'river' },
  // 🌾 초원
  grass:   { name:'풀',     kind:'material', tier:1, field:'grassland' },
  beast:   { name:'짐승',   kind:'material', tier:1, field:'grassland' },
  seed:    { name:'씨앗',   kind:'material', tier:1, field:'grassland' },
  honeycomb:{ name:'벌집',  kind:'material', tier:1, field:'grassland' },
};
// 카드 설명 — 인스펙터 이름 아래. 익살스럽고 재치 있게
const DESC = {
  stone: '어디에나 있다. 그래서 아무도 고마워하지 않는다.',
  flint: '딱딱한 것과 부딪히면 성질을 낸다. 불꽃으로.',
  ore:   '반짝이는 건 대개 아무것도 아니다. 이건 가끔 뭔가다.',
  tree:  '베기 전엔 그늘, 벤 뒤엔 재료.',
  berry: '먹어도 되는지는 먹어 봐야 안다.',
  sap:   '나무가 흘린 눈물. 손에 붙으면 안 떨어진다.',
  water: '모든 것의 시작. 담을 컵은 아직 없다.',
  soil:  '평생 밟고 다니던 그것. 이제 줍는다.',
  sand:  '신발 속에 들어가는 재주가 있다.',
  grass: '뽑아도 뽑아도 또 난다. 재료로선 최고의 성격.',
  beast: '털, 고기, 그리고 성질머리. 전부 한 몸에.',
  seed:  '작다. 그런데 안에 나무가 들어 있다고 한다.',
  coal:  '만지면 손이 까매진다. 태우면 기분이 좋아진다.',
  herb:  '쓴맛이 날수록 잘 듣는다고들 한다. 증명한 사람은 없다.',
  fish:  '물 밖에선 할 말이 없어 보인다.',
  honeycomb: '달콤함의 대가는 벌 떼가 청구한다.',
};

// 카드 그림: images/icon/card_<id>.png
function iconHtml(t, inline){
  const d = DEFS[t];
  return `<img class="icon${inline ? ' inline' : ''}" src="images/icon/card_${t}.png" alt="${esc(d.name)}" draggable="false">`;
}
const frameOf = d => 'wood';                                     // 1티어 원물은 모두 나무 프레임
const ICON_TOKEN = /⟦(\w+)⟧/g;
const ic = t => `⟦${t}⟧`;
const STAT_NAME = { atk:'공격', def:'방어', hp:'체력', people:'인원' };
const statImg = k => `<img class="icon inline" src="images/icon/ui_${k}.png" alt="${STAT_NAME[k]}" draggable="false">`;
const rich = s => esc(s).replace(ICON_TOKEN, (_, t) => DEFS[t] ? iconHtml(t, true) : t.startsWith('s_') && STAT_NAME[t.slice(2)] ? statImg(t.slice(2)) : '');

// 2장 조합 — 각 쪽은 { card } 또는 { tag, lv }. keep: 'a'/'b' = 남는 쪽
// v0.3.0: 레거시 조합식을 비움. 2티어 설계 후 채움
const RECIPES = [];
function tagLevel(def, name){
  let lv = 0;
  for (const t of (def.tags || [])){
    if (t === name) lv = Math.max(lv, 1);
    else if (t.startsWith(name + ' lv')){
      const n = parseInt(t.slice(name.length + 3), 10);
      if (n > lv) lv = n;
    }
  }
  return lv;
}
const sideMatch = (side, type) => side.card ? side.card === type
  : side.atk ? (DEFS[type].atk || 0) >= side.atk
  : tagLevel(DEFS[type], side.tag) >= (side.lv || 1);
function recipesFor(x, y){
  const out = [];
  for (const r of RECIPES){
    if (sideMatch(r.a, x) && sideMatch(r.b, y)) out.push({ r, aIsX: true });
    else if (sideMatch(r.a, y) && sideMatch(r.b, x)) out.push({ r, aIsX: false });
  }
  return out;
}
const usableRecipes = (x, y) => recipesFor(x, y);
const sideText = sd => sd.card ? `${ic(sd.card)} ${DEFS[sd.card].name}` : `🏷️ ${sd.tag}${sd.lv ? ' lv' + sd.lv + ' 이상' : ''}`;
function outText(r){
  const counts = new Map();
  for (const o of r.out) counts.set(o, (counts.get(o) || 0) + 1);
  return [...counts].map(([o, n]) => ic(o) + ' ' + DEFS[o].name + (n > 1 ? ` ×${n}` : '')).join(', ');
}

// ── 공용 도우미 ───────────────────────────────────────
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));

// ── 크래프팅 탭 (world2 v0.1.0) ───────────────────────
const VERSION = 'v0.4.0';
const SAVE_KEY = 'card-world2.v1';                              // 레거시(card-world-rpg.v1)와 따로
// 크래프팅 탭에 올라오는 카드 = 티어가 있는 카드 (v0.3.0: 1티어 12장)
const craftable = t => !!DEFS[t] && !!DEFS[t].tier;
const CRAFT_TYPES = Object.keys(DEFS).filter(craftable);
const TIERS = [...new Set(CRAFT_TYPES.map(t => DEFS[t].tier))].sort((x, y) => x - y);
// 크래프팅 탭에서 쓸 수 있는 조합식: 양쪽 다 크래프팅 카드로 채울 수 있고, 결과도 크래프팅 카드
const CRAFT_RECIPES = RECIPES.filter(r => [r.a, r.b].every(sd => CRAFT_TYPES.some(t => sideMatch(sd, t)))
  && (r.out || []).every(craftable));
// 신의 선물 풀 — v0.3.0: 1티어만, 모두 같은 확률
const GIFT_DRAW = 5;
const GIFT_POOL = CRAFT_TYPES.filter(t => DEFS[t].tier === 1).map(t => [t, 1]);
function drawGift(n){
  const total = GIFT_POOL.reduce((s, [, w]) => s + w, 0);
  const out = [];
  for (let i = 0; i < n; i++){
    let r = Math.random() * total;
    for (const [t, w] of GIFT_POOL){ r -= w; if (r < 0){ out.push(t); break; } }
  }
  return out;
}
const SPAWN_CAP = 3;                                            // 월드 최대 생성 개수 (레거시 v0.144.0 값)
const fieldText = t => { const f = FIELD_BY_ID[DEFS[t].field]; return f ? `${f.emoji} ${f.name}` : ''; };

const table = document.getElementById('table');
const inspEl = document.getElementById('insp');
let CW = 70, CH = 95;
let S = load() || fresh();
const els = new Map();
let selected = null;

function fresh(){ return { cards: [], seen: [], nextId: 1 }; }
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!s || !Array.isArray(s.cards)) return null;
    s.cards = s.cards.filter(c => craftable(c.type));
    s.seen = (s.seen || []).filter(t => DEFS[t]);
    return s;
  } catch (e){ return null; }
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
const byId = id => S.cards.find(c => c.id === id);
const looseCount = type => S.cards.filter(c => c.type === type).length;

function measure(){
  const m = Math.min(innerWidth, innerHeight);
  CW = Math.round(Math.max(57, Math.min(87, m / 7.375)));
  CH = Math.round(CW * 1.36);
  const root = document.documentElement.style;                  // v0.3.0: 콜렉터북도 카드 크기를 씀
  root.setProperty('--cw', CW + 'px');
  root.setProperty('--cf', (CW / 0.7 * 0.8) + 'px');
  root.setProperty('--ch', CH + 'px');
}
const bounds = () => ({ w: table.clientWidth, h: table.clientHeight });
function clampPos(x, y){
  const { w, h } = bounds();
  return { x: Math.max(4, Math.min(w - CW - 4, x)), y: Math.max(4, Math.min(h - CH - 4, y)) };
}
// 빈 자리 찾기 — (x, y) 둘레를 나선으로
function findSpot(x, y, skip){
  const step = CW * 1.05;
  for (let r = 0; r < 10; r++){
    const n = r === 0 ? 1 : r * 6;
    for (let i = 0; i < n; i++){
      const ang = (i / n) * Math.PI * 2 + r * 0.5;
      const p = clampPos(x + Math.cos(ang) * step * r, y + Math.sin(ang) * step * r * 1.1);
      if (S.cards.every(o => o.id === skip || Math.abs(o.x - p.x) > CW * 0.8 || Math.abs(o.y - p.y) > CH * 0.7)) return p;
    }
  }
  return clampPos(x + (Math.random() - 0.5) * CW, y + (Math.random() - 0.5) * CH);
}

// ── 카드 그리기 ─────────────────────────────────────
function cardHtml(c){
  const d = DEFS[c.type];
  let html = '';
  if (d.atk || d.defense){
    html += '<div class="stats">'
      + (d.atk ? `<span>${statImg('atk')}${d.atk}</span>` : '')
      + (d.defense ? `<span>${statImg('def')}${d.defense}</span>` : '')
      + '</div>';
  }
  return html + `<div class="emoji">${iconHtml(c.type)}</div><div class="name">${esc(d.name)}</div>`;
}
function mount(c, anim, from){
  const el = document.createElement('div');
  el.className = `cw framed f-${frameOf(DEFS[c.type])}`;
  el.dataset.id = c.id;
  el.innerHTML = cardHtml(c);
  place(el, c);
  table.appendChild(el);
  els.set(c.id, el);
  if (anim === 'pop' && from){
    el.style.setProperty('--fx', (from.x - c.x) + 'px');
    el.style.setProperty('--fy', (from.y - c.y) + 'px');
  }
  if (anim) flash(el, anim, anim === 'pop' ? 500 : 320);
  return el;
}
const place = (el, c) => { el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; };
function flash(el, cls, ms){
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}
function renderAll(){
  for (const el of els.values()) el.remove();
  els.clear();
  for (const c of S.cards){
    const p = clampPos(c.x, c.y); c.x = p.x; c.y = p.y;
    mount(c);
  }
  renderMeta();
  renderInsp();
  renderBook();
}
function renderMeta(){
  const found = CRAFT_TYPES.filter(t => S.seen.includes(t)).length;
  document.getElementById('seenMeta').textContent = `발견 ${found}/${CRAFT_TYPES.length}`;
  document.getElementById('hint').hidden = S.cards.length > 0;
}

// ── 알림 ────────────────────────────────────────────
function toast(s){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = rich(s);
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 2700);
}

// ── 카드 추가 / 제거 ─────────────────────────────────
function addCard(type, x, y, anim, from, made){
  const p = findSpot(x, y);
  const c = { id: S.nextId++, type, x: p.x, y: p.y };
  S.cards.push(c);
  mount(c, anim, from);
  if (!S.seen.includes(type)){
    S.seen.push(type);
    toast(`✨ 새 카드: ${ic(type)} ${DEFS[type].name}`);
    queueInsert(type);                                            // v0.4.0: 콜렉터북 슬리브에 끼우기 (게임 일시정지)
  }
  return c;
}
function removeCard(id){
  S.cards = S.cards.filter(c => c.id !== id);
  const el = els.get(id);
  els.delete(id);
  if (el){ el.classList.add('gone'); setTimeout(() => el.remove(), 300); }
  if (selected === id) selected = null;
}
// 여러 장 생성 — 상한까지 채우고, 빠진 것만 한 번에 '누락:' 알림. 실제로 나온 장 수를 돌려줌
function spawnMany(types, x, y, from, made3s){
  const made = [], miss = new Map();
  for (const t of types){
    if (looseCount(t) < SPAWN_CAP){
      const c = addCard(t, x, y, 'pop', from, made3s);
      made.push(c);
      if (made3s){ const el = els.get(c.id); el.classList.add('made'); setTimeout(() => el.classList.remove('made'), 3000); }   // v0.2.2
    }
    else miss.set(t, (miss.get(t) || 0) + 1);
  }
  if (miss.size){
    toast('누락: ' + [...miss].map(([t, n]) => `${ic(t)} ${DEFS[t].name}${n > 1 ? ' ×' + n : ''}`).join(', ') + ` — 월드에 ${SPAWN_CAP}장`);
  }
  return made;
}

// ── 신의 선물 ───────────────────────────────────────
const giftBtn = document.getElementById('gift');
giftBtn.innerHTML = `${iconHtml('package')}신의 선물`;
giftBtn.addEventListener('click', () => {
  const r = giftBtn.getBoundingClientRect(), tr = table.getBoundingClientRect();
  const from = { x: r.left - tr.left, y: r.top - tr.top - CH };
  const { w, h } = bounds();
  spawnMany(drawGift(GIFT_DRAW), w * 0.5 - CW / 2, h * 0.45 - CH / 2, from);
  renderMeta(); renderInsp(); save();
});

// ── 조합 ────────────────────────────────────────────
// 크래프팅 탭에서 되는 조합 (첫 번째)
function craftMatch(x, y){
  return usableRecipes(x, y).find(m => CRAFT_RECIPES.includes(m.r)) || null;
}
function craft(drag, tgt, m){
  const r = m.r;
  const a = m.aIsX ? drag : tgt, b = m.aIsX ? tgt : drag;
  const outs = r.cook ? [DEFS[b.type].cooked] : r.out.slice();
  const eaten = r.keep === 'a' ? [b] : r.keep === 'b' ? [a] : [a, b];
  // 재료가 사라진 뒤로 상한을 셈. 하나도 못 나오면 조합 안 됨
  const left = t => looseCount(t) - eaten.filter(c => c.type === t).length;
  if (!outs.some(t => left(t) < SPAWN_CAP)){
    const t = outs[0];
    toast(`${ic(t)} ${DEFS[t].name} — 월드에 ${SPAWN_CAP}장 있어서 더 생성되지 않음`);
    return false;
  }
  const from = { x: tgt.x, y: tgt.y };
  for (const c of eaten) removeCard(c.id);
  spawnMany(outs, tgt.x, tgt.y, from, true);                    // v0.2.2: 제작 성공 깜빡임
  const kept = eaten.includes(tgt) ? null : tgt;
  if (kept && els.get(kept.id)) flash(els.get(kept.id), 'bump', 300);
  return true;                                                   // 남는 도구·불은 밀어내기로 비킴
}

// ── 밀어내기 (v0.2.0) ────────────────────────────────
// 겹친 카드끼리 덜 겹친 축으로 서로 밀어냄. 끄는 중인 카드는 밀지도 밀리지도 않음 (조합 대상에 올릴 수 있게)
const PUSH_GAP = 4;                                              // 카드 사이 최소 틈 (px)
const PUSH_RATE = 0.3;                                           // 한 프레임에 겹친 만큼의 몇 배를 풀지
let pushSaveTimer = 0;
function pushStep(){
  if (paused){ requestAnimationFrame(pushStep); return; }        // v0.4.0: 콜렉터북에 끼우는 동안 멈춤
  const list = S.cards.filter(c => !(drag && drag.moved && drag.c === c));
  const sx = CW + PUSH_GAP, sy = CH + PUSH_GAP;
  const move = new Map();
  const add = (c, x, y) => { const m = move.get(c) || { x: 0, y: 0 }; m.x += x; m.y += y; move.set(c, m); };
  for (let i = 0; i < list.length; i++){
    for (let j = i + 1; j < list.length; j++){
      const a = list[i], b = list[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const px = sx - Math.abs(dx), py = sy - Math.abs(dy);
      if (px <= 0.5 || py <= 0.5) continue;
      const dir = v => v > 0 ? 1 : v < 0 ? -1 : (b.id > a.id ? 1 : -1);
      if (px < py){ add(a, -dir(dx) * px / 2, 0); add(b, dir(dx) * px / 2, 0); }
      else { add(a, 0, -dir(dy) * py / 2); add(b, 0, dir(dy) * py / 2); }
    }
  }
  let moved = false;
  for (const [c, m] of move){
    const p = clampPos(c.x + m.x * PUSH_RATE, c.y + m.y * PUSH_RATE);
    if (Math.abs(p.x - c.x) + Math.abs(p.y - c.y) < 0.05) continue;
    c.x = p.x; c.y = p.y;
    const el = els.get(c.id);
    if (el) place(el, c);
    moved = true;
  }
  if (moved){ clearTimeout(pushSaveTimer); pushSaveTimer = setTimeout(save, 500); }
  requestAnimationFrame(pushStep);
}

// ── 끌기 ────────────────────────────────────────────
let drag = null;
const trashEl = document.getElementById('trash');
const overTrash = (px, py) => { const r = trashEl.getBoundingClientRect(); return px >= r.left && px <= r.right && py >= r.top && py <= r.bottom; };
function cardAt(px, py, skip){
  const tr = table.getBoundingClientRect();
  const x = px - tr.left, y = py - tr.top;
  for (let i = S.cards.length - 1; i >= 0; i--){
    const c = S.cards[i];
    if (c.id !== skip && x >= c.x && x <= c.x + CW && y >= c.y && y <= c.y + CH) return c;
  }
  return null;
}
table.addEventListener('pointerdown', e => {
  if (paused) return;
  const el = e.target.closest('.cw');
  if (!el || el.classList.contains('gone')) return;
  const c = byId(+el.dataset.id);
  if (!c) return;
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  drag = { c, el, sx: e.clientX, sy: e.clientY, ox: c.x, oy: c.y, moved: false };
});
table.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved){
    if (Math.hypot(dx, dy) < 6) return;
    drag.moved = true;
    drag.el.classList.add('dragging');
    table.appendChild(drag.el);                                   // 맨 위로
    S.cards = S.cards.filter(c => c !== drag.c).concat(drag.c);
    for (const o of S.cards) if (o !== drag.c && !craftMatch(drag.c.type, o.type)) els.get(o.id)?.classList.add('dim');   // v0.1.1: 안 되면 흐려짐. v0.2.0: 되는 카드는 하이라이트 없음
  }
  const p = clampPos(drag.ox + dx, drag.oy + dy);
  drag.c.x = p.x; drag.c.y = p.y;
  place(drag.el, drag.c);
  trashEl.classList.toggle('hot', overTrash(e.clientX, e.clientY));
});
function endDrag(e){
  if (!drag) return;
  const d = drag;
  drag = null;
  d.el.classList.remove('dragging');
  for (const el of els.values()) el.classList.remove('dim');
  trashEl.classList.remove('hot');
  if (!d.moved){ select(d.c.id); return; }
  if (e.type !== 'pointercancel' && overTrash(e.clientX, e.clientY)){
    removeCard(d.c.id);
  } else {
    const tgt = e.type === 'pointercancel' ? null : cardAt(e.clientX, e.clientY, d.c.id);
    const m = tgt && craftMatch(d.c.type, tgt.type);
    if (m){
      if (!craft(d.c, tgt, m)) flash(d.el, 'fail', 1500);
    }                                                             // 겹친 채 놓인 카드는 밀어내기가 벌려 줌
  }
  renderMeta(); renderInsp(); save();
}
table.addEventListener('pointerup', endDrag);
table.addEventListener('pointercancel', endDrag);

// ── 인스펙터 ────────────────────────────────────────
const UNK = '<span class="i-muted">???</span>';
let inspType = null;                                             // v0.3.0: 콜렉터북에서 고른 카드 종류
function select(id){
  if (selected != null) els.get(selected)?.classList.remove('sel');

  inspType = null;
  els.get(id)?.classList.add('sel');

// 조합식 한 쪽이 가리키는 결과 — 발견 전이면 ???
function outHtml(r, t){
  if (r.cook){
    if (DEFS[t].cooked) return S.seen.includes(DEFS[t].cooked) ? rich(`${ic(DEFS[t].cooked)} ${DEFS[DEFS[t].cooked].name}`) : UNK;
    return '익힘 (날것이 익은 것으로)';
  }
  return r.out.every(o => S.seen.includes(o)) ? rich(outText(r)) : UNK;

function renderInsp(){
  const c = selected != null && byId(selected);
  const t = c ? c.type : inspType;
  if (!t){
    inspEl.innerHTML = '<div class="empty">카드를 탭하면 정보가 나와요.<br><br>'
      + `크래프팅 탭 — 1티어 원물 16장. 조합식은 2티어가 정해지면 들어옴.<br>같은 카드는 월드에 ${SPAWN_CAP}장까지.</div>`;
    return;
  }
  const d = DEFS[t];
  if (!S.seen.includes(t)){                                      // 콜렉터북의 미발견 칸
    inspEl.innerHTML = `<div class="head"><div class="pic locked">${iconHtml(t)}</div><div><div class="nm">???</div><div class="kd">${d.tier}티어 · ${fieldText(t)}</div></div></div>`
      + '<div class="desc">아직 발견하지 못한 카드.</div>';
    return;
  }
  let h = `<div class="head"><div class="pic">${iconHtml(t)}</div><div><div class="nm">${esc(d.name)}</div><div class="kd">${d.tier}티어 · ${fieldText(t)} · 월드 ${looseCount(t)}/${SPAWN_CAP}</div></div></div>`;
  if (DESC[t]) h += `<div class="desc">${esc(DESC[t])}</div>`;
  const tags = (d.tags || []).slice();
  if (d.atk) tags.push(`공격력 ${d.atk}`);
  if (d.defense) tags.push(`방어 ${d.defense}`);
  if (tags.length) h += '<div class="chips">' + tags.map(x => `<span class="chip">${esc(x)}</span>`).join('') + '</div>';
  // 쓰이는 조합 — 이 카드가 들어가는 쪽의 반대편 + 결과
  const uses = [];
  for (const r of CRAFT_RECIPES){
    for (const [mine, other] of [[r.a, r.b], [r.b, r.a]]){
      if (!sideMatch(mine, t)) continue;
      if (r.cook && mine.tag === '날것' && !d.cooked) continue;
      const keep = (r.keep === 'a' && mine === r.a) || (r.keep === 'b' && mine === r.b);
      uses.push(`<div class="row">+ ${rich(sideText(other))} → ${outHtml(r, t)}${keep ? ' <span class="i-muted">(남음)</span>' : ''}</div>`);
      break;
    }
  }
  h += '<div class="sub">쓰이는 조합</div>' + (uses.length ? uses.join('') : '<div class="i-muted">없음</div>');
  // 만드는 법 — 발견한 카드만
  const makes = CRAFT_RECIPES.filter(r => r.cook ? CRAFT_TYPES.some(x => DEFS[x].cooked === t) : (r.out || []).includes(t));
  if (makes.length){
    h += '<div class="sub">만드는 법</div>' + makes.map(r => {
      if (r.cook){
        const raw = CRAFT_TYPES.find(x => DEFS[x].cooked === t);
        return `<div class="row">${rich(sideText(r.a))} + ${rich(`${ic(raw)} ${DEFS[raw].name}`)}</div>`;
      }
      return `<div class="row">${rich(sideText(r.a))} + ${rich(sideText(r.b))}</div>`;
    }).join('');
  }
  inspEl.innerHTML = h;
}

// ── 콜렉터북 (v0.4.0) ────────────────────────────────
// 아래에서 올라오는 모달. 티어 탭 → 필드별 슬리브 4칸. 미발견은 검은 실루엣 + ???
// 새 카드를 발견하면 콜렉터북이 열리고 그 슬리브에 카드가 위에서 아래로 끼워짐. 끼우는 동안 게임 일시정지
const bookEl = document.getElementById('book');
const bookBack = document.getElementById('bookBack');

let bookOpen = false;

const shownSeen = t => S.seen.includes(t) && !pendingInsert.includes(t);
function slotHtml(t){

function detailHtml(){
  if (!bookPick) return '<span class="i-muted">슬리브를 탭하면 카드 정보가 나와요.</span>';
  const t = bookPick, d = DEFS[t], f = FIELD_BY_ID[d.field];
  const where = `${d.tier}티어 · ${f.emoji} ${f.name}`;
  return shownSeen(t)
    ? `<span class="nm">${esc(d.name)}</span> <span class="i-muted">${where}</span><br>${esc(DESC[t] || '')}`
    : `<span class="nm">???</span> <span class="i-muted">${where}</span><br><span class="i-muted">아직 발견하지 못한 카드.</span>`;
}
function renderBook(){
  if (!bookOpen) return;
  const inTier = CRAFT_TYPES.filter(t => DEFS[t].tier === bookTier);
  const found = inTier.filter(shownSeen).length;
  let h = '<div class="book-grip"></div><div class="book-head"><span class="book-title">📖 콜렉터북</span>'
    + '<div class="book-tabs">' + TIERS.map(n => `<button class="tabbtn${n === bookTier ? ' on' : ''}" data-tier="${n}">${n}티어</button>`).join('') + '</div>'
    + `<span class="meta">발견 ${found}/${inTier.length}</span><button class="book-close" data-close="1"${paused ? ' disabled' : ''}>✕</button></div>`
    + `<div class="book-detail">${detailHtml()}</div><div class="book-body"><div class="book-inner">`;
  for (const f of FIELDS){
    const list = inTier.filter(t => DEFS[t].field === f.id);
    if (!list.length) continue;
    h += `<div class="book-field"><div class="book-fname">${f.emoji} ${f.name}</div><div class="book-row">${list.map(slotHtml).join('')}</div></div>`;
  }
  const body = bookEl.querySelector('.book-body');
  const keep = body ? body.scrollTop : 0;
  bookEl.innerHTML = h + '</div></div>';
  bookEl.querySelector('.book-body').scrollTop = keep;
}
function openBook(open){
  bookOpen = open;
  bookEl.classList.toggle('open', open);
  bookBack.classList.toggle('open', open);
  document.getElementById('bookBtn').classList.toggle('on', open);
  if (!open) bookPick = null;
  renderBook();
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function setPaused(on){
  paused = on;
  table.classList.toggle('paused', on);
  const x = bookEl.querySelector('.book-close');
  if (x) x.disabled = on;
}
let inserting = false;
function queueInsert(t){
  pendingInsert.push(t);
  if (!inserting) runInserts();
}
async function runInserts(){
  inserting = true;
  setPaused(true);
  if (drag) endDrag({ type: 'pointercancel' });                  // 끌던 카드는 그 자리에 놓음
  const wasOpen = bookOpen;
  if (!bookOpen){ openBook(true); await wait(420); }            // 올라오는 시간
  while (pendingInsert.length){
    const t = pendingInsert[0];
    if (bookTier !== DEFS[t].tier){ bookTier = DEFS[t].tier; renderBook(); }
    const slot = bookEl.querySelector(`[data-book="${t}"]`);
    if (slot){
      slot.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      await wait(250);
      pendingInsert.shift();
      const ghost = slot.querySelector('.cw');
      ghost.classList.add('ghost');                               // 실루엣은 흐려지며 빠지고
      const card = document.createElement('div');                 // 진짜 카드가 위에서 끼워짐
      card.className = `cw framed f-${frameOf(DEFS[t])} insert`;
      card.innerHTML = `<div class="emoji">${iconHtml(t)}</div><div class="name">${esc(DEFS[t].name)}</div>`;
      slot.appendChild(card);
      slot.classList.add('glow');
      await wait(1000);
    } else pendingInsert.shift();
    renderBook();
  }
  await wait(250);
  setPaused(false);
  inserting = false;
  if (!wasOpen) openBook(false);
  else renderBook();
}
document.getElementById('bookBtn').addEventListener('click', () => { if (!paused) openBook(!bookOpen); });
bookBack.addEventListener('click', () => { if (!paused) openBook(false); });
bookEl.addEventListener('click', e => {
  if (paused) return;
  if (e.target.closest('[data-close]')) return openBook(false);
  const tab = e.target.closest('[data-tier]');
  if (tab){ bookTier = +tab.dataset.tier; return renderBook(); }
  const slot = e.target.closest('[data-book]');
  if (slot){ bookPick = slot.dataset.book; renderBook(); }
});

// ── 시작 ────────────────────────────────────────────
document.getElementById('ver').textContent = VERSION;
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('처음부터 다시 시작할까요?')) return;
  if (paused) return;
  S = fresh(); selected = null; renderAll(); save();
});
addEventListener('resize', () => { measure(); renderAll(); });
measure();
renderAll();
requestAnimationFrame(pushStep);
</script>
