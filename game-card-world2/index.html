// v0.44.0: 퀘스트 줄 표시 통일 — 오른쪽 끝은 **끝났을 때 ✓** 만.
//   진행 수는 할 일 글 뒤에 작게 (3/5). 단계형은 수를 아예 안 보여 줌 (몇 개를 만들라는 말로 읽혀서)
function questRowHtml(q, def){
  const goal = questGoal(def);
  const prog = def.steps || q.done || goal <= 1 ? '' : ` <span class="q-prog">${Math.min(q.n, goal)}/${goal}</span>`;
  return `<div class="q-row${q.done ? ' done' : ''}"><span class="q-tag">📜</span><b class="q-name">${esc(def.name)}</b>`
    + `<span class="q-text">${esc(q.done ? '완료' : questText(def, q))}${prog}</span>`
    + `<span class="q-n">${q.done ? '✓' : ''}</span></div>`;
}
// v0.41.0: 블록형 — 대제목 · 중제목은 모두 보이고, 소제목(완료 조건)은 지금 덩어리 것만
function questBlockHtml(q, def){
  const st = questGroupState(def);
  let h = `<div class="q-row${q.done ? ' done' : ''}"><span class="q-tag">📜</span><b class="q-name">${esc(def.name)}</b>`
    + `<span class="q-text">${q.done ? '완료' : `<span class="q-prog">${Math.min(st.done.filter(Boolean).length, def.groups.length)}/${def.groups.length}</span>`}</span>`
    + `<span class="q-n">${q.done ? '✓' : ''}</span></div>`;
  def.groups.forEach((g, i) => {
    const done = st.done[i], now = i === st.now;
    h += `<div class="q-mid${done ? ' done' : ''}${now ? ' now' : ''}">${done ? '✔' : now ? '▸' : '·'} ${esc(g.title)}</div>`;
    if (!now || q.done) return;
    for (const it of g.items){
      const n = have(it.card), ok = n >= it.n;
      h += `<div class="q-sub${ok ? ' done' : ''}">${ok ? '☑' : '☐'} ${iconHtml(it.card, true)} ${esc(DEFS[it.card].name)}`
        + (it.text ? `<span class="q-sub-t">${esc(it.text)}</span>` : '')
        + `<span class="q-sub-n">${Math.min(n, it.n)}/${it.n}</span></div>`;
    }
  });
  return h;
}
function questStep(id){
  const q = (S.quests || []).find(q => q.id === id && !q.done);
  if (!q) return;
  const def = QUESTS[q.id];
  q.n++;
  if (q.n >= questGoal(def)){
    q.done = true;
    toast(`📜 퀘스트 완료: ${def.name}`);
    renderQuest();
    questFade(q);                                                  // v0.38.0: 반짝 뒤 줄에서 사라짐
    const next = QUEST_NEXT[q.id];                                 // v0.60.0: 빈 순간이 없도록 바로 이어 붙임
    if (next) setTimeout(() => giveQuest(next), 900);
    save();
    return;
  }
  renderQuest();
  save();
}
// v0.47.0: 보스를 잡으면 그다음 잠긴 필드가 열림
//   자물쇠가 바들바들 떨리다 → 열린 자물쇠로 바뀌고 → 아래로 내려가며 사라짐 → 흐리던 색이 돌아오고 → 마지막에 이름이 나타남
function unlockNextField(afterId){
  const i = FIELDS.findIndex(f => f.id === afterId);
  const next = FIELDS.slice(i + 1).find(f => fieldLocked(f.id)) || FIELDS.find(f => fieldLocked(f.id));
  if (!next) return;
  S.fields[next.id].locked = false;
  save();
  playUnlock(next);
}
function playUnlock(f){
  const card = gatherEl.querySelector(`[data-field="${f.id}"]`);
  if (!card){ renderScreen(); return; }
  const lock = card.querySelector('.lock');
  card.classList.add('unlocking');                                // 색은 아직 흐린 채로 (field-locked 를 대신함)
  card.classList.remove('field-locked');
  if (!lock){ card.classList.remove('unlocking'); renderScreen(); return; }
  lock.classList.add('shake');                                    // ① 바들바들
  setTimeout(() => {                                              // ② 열린 자물쇠로
    lock.src = 'images/icon/ui_lock-open.png';
    lock.classList.remove('shake');
    lock.classList.add('opened');
  }, 700);
  setTimeout(() => {                                              // ③ 내려가며 사라짐
    lock.classList.add('drop');
  }, 1050);
  setTimeout(() => {                                              // ④ 색이 돌아옴
    card.classList.add('color-in');
  }, 1500);
  setTimeout(() => {                                              // ⑤ 마지막에 이름
    card.classList.add('name-in');
    toast(`🔓 ${f.emoji} ${f.name} — 새 필드가 열렸다`);
  }, 2050);
  setTimeout(() => { renderScreen(); renderInsp(); }, 2900);      // 원래 모습으로 정리
}
// v0.39.0: 단계가 있는 퀘스트 — 지금 단계의 열쇠와 맞을 때만 한 칸 나아가고, 기사가 한마디
// v0.41.0: 블록형 퀘스트는 보유 수로 판정 — 카드가 늘거나 줄 때마다 확인
function questCheckBlocks(){
  for (const q of (S.quests || [])){
    const def = QUESTS[q.id];
    if (q.done || !def.groups) continue;
    const st = questGroupState(def);
    if (!st.all) continue;
    q.done = true;
    toast(`📜 퀘스트 완료: ${def.name}`);
    renderQuest();
    questFade(q);
    save();
    return;
  }
}
// v0.38.0: 끝낸 퀘스트는 나타날 때처럼 노랗게 반짝인 뒤 줄에서 빠짐
function questFade(q){
  const i = (S.quests || []).indexOf(q);
  const row = document.getElementById('quest').children[i];
  if (row) flash(row, 'q-done-flash', 520);
  setTimeout(() => {
    S.quests = (S.quests || []).filter(x => x !== q);
    S.questDone = S.questDone || [];                               // v0.60.0
    if (!S.questDone.includes(q.id)) S.questDone.push(q.id);
    document.getElementById('quest').innerHTML = '';               // 줄 수가 줄었으니 다시 그림
    renderQuest();
    save();
  }, 560);
}
// 퀘스트 주기 — 같은 퀘스트가 이미 있으면 그대로 (주는 캐릭터는 아직 없음)
let questFlashPending = null;                                     // v0.43.0: 대사 중에 받은 퀘스트는 대사가 끝난 뒤에 알림
function giveQuest(id){
  if (!QUESTS[id] || (S.quests || []).some(q => q.id === id)) return;
  if (S.questDone && S.questDone.includes(id)) return;             // v0.60.0: 한 번 끝낸 메인 퀘스트는 다시 안 줌
  S.quests.push(newQuest(id));
  if (QUESTS[id].say && !knightLine) knightSay(QUESTS[id].say);    // v0.60.0: 목표를 기사 입으로 한 줄
  setTimeout(questSelfCheck, 0);                                   // v0.60.0: 이미 해 놓은 일이면 바로 끝남
  const el = document.getElementById('quest');
  renderQuest();
  if (knightLine){ questFlashPending = id; save(); return; }
  flash(el, 'q-new', 1450);
  toast(`📜 새 퀘스트: ${QUESTS[id].name}`);
  save();
}

// ── 시작 ────────────────────────────────────────────
document.getElementById('ver').textContent = VERSION;
// v0.16.0: 설정 패널 (⚙) — 발견 수 · 처음부터 · 버전
const setPan = document.getElementById('setpan');
// v0.24.0: 에디터 모드 — 모든 잠금 해제 (저장 안 함)
// v0.24.1: 켜면 진짜 저장 상태는 따로 두고, 모든 카드를 1개씩 가진 시험용 상태로 논다.
//   끄면 그대로 돌아옴. 에디터 모드 동안은 저장하지 않음
let realS = null;
const EDIT_KEY = 'card-world2.edit';                              // v0.32.1: 켜 둔 상태를 새로 고쳐도 유지 (게임 저장과 별개)
function setEditMode(on, quiet){
  if (on === editMode) return;
  if (on){
    realS = S;
    editMode = true;
    S = JSON.parse(JSON.stringify(realS));                        // 시험용 사본
    S.seen = CRAFT_TYPES.slice();                                 // 발견 전부
    S.newCards = [];
    S.boards = BOARDS.map(b => b.id);
    for (const id in S.fields) S.fields[id].locked = false;
    for (const t of CRAFT_TYPES){                                 // 모든 카드 1개씩
      const c = cardOf(t);
      if (c){ if (c.n < 1) c.n = 1; continue; }
      const { w, h } = bounds();
      const p = findSpot(w / 2 - CW / 2, h / 2 - CH / 2);
      S.cards.push({ id: S.nextId++, type: t, x: p.x, y: p.y, n: 1 });
    }
  } else {
    S = realS || S;
    realS = null;
    editMode = false;
  }
  try { localStorage.setItem(EDIT_KEY, on ? '1' : '0'); } catch (e) {}
  selected = null; fieldPick = null; slotPick = null; knightPick = false;
  renderTabs();
  if (S.tab !== 'battle' && !boardOpen(BOARD_BY_ID[S.tab])) S.tab = 'battle';
  setTab(S.tab);
  renderAll(); renderBook(); renderInsp();
  if (!quiet) toast(on ? '🔧 에디터 모드 — 모든 잠금 해제 · 카드 1개씩 (저장 안 함)' : '🔧 에디터 모드 끔 — 원래 상태로');
}
document.getElementById('editMode').addEventListener('change', e => setEditMode(e.target.checked));
document.getElementById('setBtn').addEventListener('click', e => {
  e.stopPropagation();
  setPan.hidden = !setPan.hidden;
  document.getElementById('setBtn').classList.toggle('on', !setPan.hidden);
});
document.addEventListener('click', e => {
  if (setPan.hidden || e.target.closest('#setpan') || e.target.closest('#setBtn')) return;
  setPan.hidden = true;
  document.getElementById('setBtn').classList.remove('on');
});
// v0.37.0: 처음부터 — 저장뿐 아니라 화면·연출·고른 것까지 모두 처음 상태로
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('처음부터 다시 시작할까요?')) return;
  if (paused) return;
  // 하던 것 끊기
  if (drag) endDrag({ type: 'pointercancel' });
  if (tokenDrag){ if (tokenDrag.moved) tokenDrag.el.remove(); tokenDrag = null; }
  exp = null; healProg = 0;                                       // 원정 · 회복
  clearTimeout(knightSayT); knightLine = null; knightSayDone = null;   // 기사 대사
  clearTimeout(lockPopT); document.querySelector('.lockpop')?.remove();
  clearTimeout(pushSaveTimer);
  openBook(false); bookTier = TIERS[0]; bookPick = null;          // 콜렉터북
  pendingInsertReset();
  // 고른 것 · 화면 상태
  selected = null; inspType = null; fieldPick = null; knightPick = false; slotPick = null;
  // 저장 상태 (에디터 모드면 진짜 저장도 함께)
  S = fresh();
  if (editMode && realS) realS = fresh();
  setTab(S.tab);
  renderTabs(); renderAll(); renderBook(); renderInsp();
  save();
  if (editMode){ setEditMode(false, true); document.getElementById('editMode').checked = false; }   // 에디터 모드는 끔
  knightIntro();                                                  // 첫 대사부터 다시
});
addEventListener('resize', () => { measure(); renderAll(); });
measure();
if (!S.tab) S.tab = 'battle';
renderAll();
setTab(S.tab);
try {                                                             // v0.32.1: 지난번에 켜 뒀으면 그대로 에디터 모드로
  if (localStorage.getItem(EDIT_KEY) === '1'){
    document.getElementById('editMode').checked = true;
    setEditMode(true, true);
  }
} catch (e){ console.warn('에디터 모드 복구 실패', e); }   // v0.76.1: 조용히 넘어가지 않게
requestAnimationFrame(pushStep);
knightIntro();                                                    // v0.36.0: 첫 대사 → 첫 퀘스트
setInterval(gameTick, 100);
</script>
