<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>카드 월드 RPG 2 — Game Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}
  body{background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;}
  [hidden]{display:none!important;}
  /* v0.16.0 화면 구조 (확정 50): 필드 1:1 · UI는 남는 공간 · 팝업은 1:1 레이어.
     크기는 JS layout() 이 잼 — --fs 필드 한 변, --ps 팝업 한 변 */
  :root{--fs:320px;}
  .field{position:fixed;overflow:hidden;background:#0f0f0a;box-shadow:0 0 0 1px var(--hairline);}
  .ui{position:fixed;z-index:2147482900;display:flex;flex-direction:column;box-sizing:border-box;background:rgba(20,20,16,.96);}
  .ui.side{border-left:1px solid var(--hairline);}
  .ui.bottom{border-top:1px solid var(--hairline);}
  /* UI 아래쪽 버튼 줄 — 채집 · 크래프팅 · 콜렉터북 · 설정 */
  .ver-out{margin-left:auto;opacity:.75;}   /* v0.47.1: 버전은 버튼 줄 오른쪽 끝에 */
  .uibar{flex:none;position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--hairline);}
  .tabbtn{border:1px solid var(--hairline);background:rgba(255,255,255,.08);color:var(--ink);font:inherit;font-size:13px;font-weight:700;
    padding:6px 12px;border-radius:var(--r-pill);white-space:nowrap;cursor:pointer;}   /* v0.21.3: 쓸 수 있는 버튼은 배경이 있음 */
  .tabbtn.on{background:var(--brand-yellow);color:var(--on-brand);border-color:var(--brand-yellow);}
  .meta{display:inline-block;font-size:12px;color:var(--muted);white-space:nowrap;}
  .reset{border:1px solid var(--hairline);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:4px 10px;border-radius:var(--r-pill);cursor:pointer;}
  /* 설정 패널 — ⚙ 를 누르면 버튼 줄 위로 */
  .setpan{position:absolute;right:10px;bottom:calc(100% + 6px);z-index:5;min-width:150px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
    background:rgba(28,28,23,.98);border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--sh-lg);padding:10px 12px;}

  /* 필드 */  /* 필드 */
  .table{position:absolute;inset:0;overflow:hidden;touch-action:none;
    background:radial-gradient(ellipse at 50% 40%,#25251d 0%,var(--canvas) 72%);}
  /* 채집 탭 (v0.6.0) — 크래프팅 필드와 같은 자리에 필드 카드 4장 */
  .gather{position:absolute;inset:0;overflow:hidden;box-sizing:border-box;padding:calc(var(--cw) * .12);   /* v0.17.0: 필드엔 스크롤이 없음 */
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw) * .12);
    background:radial-gradient(ellipse at 50% 40%,#1f2a1d 0%,var(--canvas) 72%);}
  .gather-hint{color:var(--muted);font-size:calc(var(--cf) * .105);text-align:center;}
  /* v0.25.0: 정비 화면 — 필드 위쪽에 장비 칸 줄. 카드를 끌어다 놓음 */
  /* v0.27.0: 화면을 위아래로 — 위는 줄 목록(넘치면 세로 스크롤), 아래는 카드를 놓는 자리 */
  .toplist{position:absolute;left:0;right:0;top:0;height:50%;z-index:4;box-sizing:border-box;overflow-y:auto;overflow-x:auto;
    display:flex;flex-direction:column;align-items:center;gap:calc(var(--cw) * .1);padding:calc(var(--cw) * .1);
    background:rgba(10,10,7,.55);border-bottom:1px solid var(--hairline);
    scrollbar-width:thin;scrollbar-color:rgba(255,212,0,.45) transparent;}
  .toplist[hidden]{display:none;}
  .toplist::-webkit-scrollbar{width:4px;}
  .toplist::-webkit-scrollbar-thumb{background:rgba(255,212,0,.35);border-radius:4px;}
  .lrow{flex:none;display:flex;align-items:center;gap:calc(var(--cw) * .1);}
  .lrow > .cw{position:relative;flex:none;width:var(--cw);height:var(--ch);cursor:pointer;}
  /* 줄 안의 필드 카드는 줄 높이에 맞춤 (채집 격자용 크기 규칙을 덮어씀) */
  .gather .lrow > .cw.field{width:var(--cw);height:var(--ch);aspect-ratio:auto;}
  .gather .lrow > .cw.field .emoji{font-size:calc(var(--cw) * .38);}
  .gather .lrow .yields{font-size:calc(var(--cw) * .13);}
  .lrow .pslot{width:calc(var(--cw) * .8);height:calc(var(--ch) * .8);}
  .lrow .slotbox .box{width:calc(var(--cw) * .8);height:calc(var(--ch) * .8);}
  .lrow .rowslots{display:flex;align-items:center;gap:calc(var(--cw) * .08);}
  /* v0.34.0: 위 절반 격자형 — 완성품 카드를 줄지어 (넘치면 세로 스크롤) */
  .toplist.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(var(--cw), 1fr));align-content:start;gap:calc(var(--cw) * .12);}
  .toplist.grid .cw{position:relative;width:100%;height:auto;aspect-ratio:1 / 1.36;cursor:pointer;}
  .toplist.grid .empty-lab{grid-column:1 / -1;color:var(--muted);font-size:calc(var(--cf) * .105);text-align:center;padding:calc(var(--cw) * .2) 0;}
  .lhint{flex:none;font-size:calc(var(--cf) * .1);color:var(--muted);text-align:center;}
  .table.half{top:50%;}                                            /* 카드는 아래 절반에만 */
  .slotbar[hidden]{display:none;}
  .slotbox{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .slotbox .box{position:relative;width:calc(var(--cw) * .8);height:calc(var(--ch) * .8);box-sizing:border-box;display:flex;align-items:center;justify-content:center;
    border:2px dashed var(--hairline);border-radius:var(--r-md);background:rgba(255,255,255,.05);}
  .slotbox .box .cw{position:relative;left:auto;top:auto;cursor:grab;}
  .slotbox.hot .box{border-style:solid;border-color:var(--brand-yellow);background:rgba(255,212,0,.16);}
  .slotbox.sel .box{border-color:rgba(255,255,255,.55);}
  .slotbox .lab{font-size:calc(var(--cf) * .1);color:var(--muted);}
  /* v0.27.0: 전투 화면 — 위에 필드마다 한 줄(필드 카드 + 출전 칸 5개), 아래에 캐릭터 카드 */
  .botarea{position:absolute;left:0;right:0;top:50%;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:calc(var(--cw) * .1);padding:calc(var(--cw) * .1);box-sizing:border-box;}
  .chars{position:relative;display:flex;align-items:center;gap:calc(var(--cw) * .2);}   /* v0.37.1: 대사 말풍선의 기준 */
  .chars .cw.knight{position:relative;flex:none;cursor:grab;}
  .pslot{position:relative;width:calc(var(--cw) * .8);height:calc(var(--ch) * .8);box-sizing:border-box;display:flex;align-items:center;justify-content:center;
    border:2px dashed var(--hairline);border-radius:var(--r-md);background:rgba(255,255,255,.05);}
  .pslot.can{border-style:solid;border-color:rgba(255,212,0,.75);box-shadow:0 0 0 1px rgba(255,212,0,.25);}   /* v0.32.0: 끌기 시작하면 놓을 수 있는 칸 */
  .pslot.hot{border-style:solid;border-color:var(--brand-yellow);background:rgba(255,212,0,.22);box-shadow:0 0 8px rgba(255,212,0,.45);}
  .pslot.locked{border-style:solid;opacity:.45;background:transparent;}
  .pslot .lock{width:55%;image-rendering:pixelated;}
  /* v0.98.0: 자물쇠 위에 겹쳐 '무엇이 있어야 열리는지' — 모든 자물쇠 공통 */
  .lockneed{position:absolute;left:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;white-space:nowrap;
    padding:2px 6px;border-radius:var(--r-pill);background:rgba(10,9,7,.86);border:1px solid rgba(255,255,255,.18);
    color:#fff;font-weight:800;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.8);}
  .pslot .lockneed{top:55%;font-size:calc(var(--cf) * .085);}
  .gather .cw.field .lockneed{top:52%;font-size:calc(var(--cf) * .075);}
  .pslot > .icon{width:70%;height:auto;}                           /* v0.29.2: 칸에 바로 놓인 그림만 (카드 안 그림은 건드리지 않음) */
  .pslot-lab{font-size:calc(var(--cf) * .1);color:var(--muted);}
  /* v0.30.0: 장비 실루엣 — 빈 칸 가운데(큰 것), 카드 왼쪽 위(작은 것) */

  .pslot{flex-direction:column;}
  .knight-drag{position:fixed;left:0;top:0;z-index:2147483060;pointer-events:none;opacity:.9;}
  /* 기사 카드의 작은 장비 칸 (전투 화면) */
  .knight .gearline{position:absolute;left:0;right:0;bottom:calc(var(--cw) * .06);display:flex;justify-content:center;gap:calc(var(--cw) * .04);pointer-events:none;}
  .knight .gslot{width:calc(var(--cw) * .26);height:calc(var(--cw) * .26);display:flex;align-items:center;justify-content:center;
    border:1px solid var(--hairline);border-radius:3px;background:rgba(0,0,0,.45);}
  .knight .gslot.empty{border-style:dashed;opacity:.5;}
  .knight .gslot .icon{width:88%;height:88%;margin:0;}
  /* v0.21.0: 잠긴 화면 버튼 — 버튼은 보이고 자물쇠가 붙음 */
  .tabbtn.locked{background:transparent;border-style:dashed;color:var(--muted);opacity:.5;}   /* v0.21.3: 잠김 — 배경 없음 · 점선 */
  /* v0.21.3: 잠긴 버튼을 누르면 그 버튼 바로 위에 뜨는 말풍선 */
  .lockpop{position:absolute;bottom:calc(100% + 8px);z-index:6;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
    background:var(--ink);color:#1a1a17;font-size:12px;font-weight:800;padding:6px 10px;border-radius:10px;box-shadow:var(--sh-md);animation:lockPopIn .16s ease-out;}
  /* v0.36.1: 가운데 맞춤(translateX(-50%))을 연출에도 그대로 둬서 뜨는 동안·뜬 뒤 자리가 같음 */
  @keyframes lockPopIn{from{opacity:0;transform:translateX(-50%) translateY(4px) scale(.96);}to{opacity:1;transform:translateX(-50%);}}
  .lockpop::after{content:'';position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink);}
  .lockpop.out{opacity:0;transition:opacity .25s;}
  .tabbtn .lockm{margin-right:3px;}
  .tabbtn .tabic{width:1.35em;height:1.35em;margin-right:3px;vertical-align:-.35em;}   /* v0.33.0: 탭 그림 */
  .gather-row{display:grid;grid-template-columns:repeat(4, 1fr);gap:calc(var(--cw) * .1);width:100%;}   /* v0.17.0: 네 칸 한 줄 고정 */
  .gather .cw.field{position:relative;width:100%;height:auto;aspect-ratio:1 / 1.36;cursor:pointer;--cf:calc(var(--cw) / .7 * .8 * 1.35);}
  .gather .cw.field .emoji{font-size:calc(var(--cw) * 1.35 * .42);}
  .gather .cw.field .yields{display:flex;gap:2px;justify-content:center;font-size:calc(var(--cw) * .2);margin-top:2px;pointer-events:none;}
  /* v0.18.3: 두 번째 줄 — 크리처 전리품 */
  .gather .cw.field .yields.loot{margin-top:1px;padding-top:2px;border-top:1px solid rgba(255,255,255,.14);font-size:calc(var(--cw) * .17);}
  .gather .cw.field .yields .locked .icon,.gather .cw.field .yields .icon.locked{filter:brightness(0) opacity(.45);}
  /* 채집한 카드 (v0.7.0): 필드 카드 위로 튀어나왔다가 작아지며 크래프팅 탭으로 날아감 */
  .fly{position:fixed;left:0;top:0;z-index:2147483050;pointer-events:none;margin:0;will-change:transform,opacity;}
  .gather .cw.field:active{transform:scale(.97);}
  .gather .cw.field.tap{animation:bump .3s ease-out;}
  /* v0.9.0: 숫자 톡 튀기 — 숫자가 바뀌는 곳 공통 (setNum) */
  .num-bump{animation:numBump .32s ease-out;}
  @keyframes numBump{0%{transform:scale(1);}35%{transform:scale(1.4);}100%{transform:scale(1);}}
  /* v0.9.0: 퀘스트 줄 — 상단 막대 바로 아래 */
  /* v0.16.1: 퀘스트 — 여러 개, 없으면 자리도 차지하지 않음 (hidden) */
  /* v0.41.1: 퀘스트 줄이 접혔다 펴지며 여닫힘 (없을 땐 높이 0) */
  .quest{flex:0 1 auto;min-height:0;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;
    max-height:0;opacity:0;padding:0 12px;border-bottom:0 solid var(--hairline);overflow:hidden;
    background:rgba(34,31,20,.96);font-size:13px;
    transition:max-height .34s cubic-bezier(.2,.85,.25,1),opacity .26s,padding .34s,border-bottom-width .34s;}
  .quest.show{max-height:40%;opacity:1;padding:6px 12px;border-bottom-width:1px;overflow-y:auto;}
  .q-row{display:flex;align-items:center;gap:8px;white-space:nowrap;min-height:26px;}
  .quest .q-tag{color:var(--brand-yellow);font-weight:800;flex:none;}
  .quest .q-name{flex:none;}
  .quest .q-text{color:var(--muted);overflow:hidden;text-overflow:ellipsis;}
  .quest .q-n{display:inline-block;margin-left:auto;flex:none;font-weight:800;font-variant-numeric:tabular-nums;}
  .quest .q-prog{color:var(--brand-yellow);font-weight:800;font-variant-numeric:tabular-nums;}   /* v0.44.0: 진행 수는 글 뒤에 작게 */
  .q-row.done .q-n{color:#8fdc8f;}
  /* v0.41.0: 블록형 퀘스트 — 중제목 · 소제목 */
  .q-mid{display:flex;gap:6px;align-items:center;padding-left:14px;font-size:12px;color:var(--muted);min-height:20px;white-space:nowrap;}
  .q-mid.now{color:var(--ink);font-weight:700;}
  .q-mid.done{color:#8fdc8f;}
  .q-sub{display:flex;gap:6px;align-items:center;padding-left:30px;font-size:12px;color:var(--muted);min-height:20px;white-space:nowrap;}
  .q-sub.done{color:#8fdc8f;}
  .q-sub .icon.inline{width:1.2em;height:1.2em;}
  .q-sub-t{color:var(--muted);opacity:.85;overflow:hidden;text-overflow:ellipsis;}
  .q-sub-n{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;}
  /* v0.9.0: 새 카드 표시 — 카드 왼쪽 위 NEW, 콜렉터북 버튼에 새 카드 수 */
  .cw .new-b{position:absolute;left:calc(var(--cw) * -.08);top:calc(var(--cw) * -.08);z-index:3;padding:0 calc(var(--cf) * .05);height:calc(var(--cf) * .18);box-sizing:border-box;
    display:flex;align-items:center;border-radius:999px;background:#ff5a5a;color:#fff;font-size:calc(var(--cf) * .1);font-weight:900;letter-spacing:.02em;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;}
  /* v0.45.0: 아직 해 본 적 없는 조합 상대 — 끄는 동안 '새로운 발견!' */
  .cw.new-combo{border-color:var(--brand-yellow);box-shadow:0 0 0 2px rgba(255,212,0,.55),var(--sh-md);}
  /* v0.81.0: 위 격자의 완성품도 놓는 자리 — 재료를 끌어다 올리면 다음 단계가 된다 */
  .toplist .cw.dim{opacity:.32;filter:grayscale(.6);}
  .toplist .cw.hot{border-color:var(--brand-yellow);box-shadow:0 0 0 2px rgba(255,212,0,.75),0 0 14px rgba(255,212,0,.5);}
  .cw .find-b{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);z-index:6;white-space:nowrap;
    padding:2px 7px;border-radius:999px;background:var(--brand-yellow);color:var(--on-brand);
    font-size:calc(var(--cf) * .1);font-weight:900;line-height:1.2;box-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none;
    animation:findPop .32s cubic-bezier(.2,1.4,.4,1);}
  @keyframes findPop{from{opacity:0;transform:translate(-50%,6px) scale(.8);}to{opacity:1;transform:translateX(-50%) scale(1);}}
  /* v0.48.0: 이미 해 본 조합 — 결과 그림 + 이름 + 보유 수 */
  .cw .find-b.known{background:rgba(12,12,9,.92);color:var(--ink);border:1px solid var(--hairline);font-weight:700;
    display:flex;align-items:center;gap:3px;}
  .cw .find-b.known b{color:var(--brand-yellow);font-weight:900;font-variant-numeric:tabular-nums;}
  .cw .find-b.known .icon.inline{width:1.15em;height:1.15em;margin:0;vertical-align:0;}
  /* v0.46.0: 콜렉터북 조합 탭 */
  .combo-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;}
  .combo-row.locked{color:var(--muted);}
  /* v0.59.0: 재료를 다 알지만 아직 안 만들어 본 조합 — 여기 뭔가 있다 */
  .combo-row.ready{background:rgba(255,212,0,.07);border-left:2px solid var(--brand-yellow);}
  .combo-where{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;}
  .combo-op{color:var(--muted);font-weight:800;}
  /* v0.63.0: 조합식 표기 — 못 얻어 본 재료는 검은 실루엣 */
  .rcp-ic.unk .icon{filter:brightness(0) opacity(.45);}
  .rcp-line{display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
  /* v1.1.0: 없는 재료 — 누르면 그걸 얻는 곳으로 */
  .rcp-jump{cursor:pointer;border-bottom:1px dashed rgba(255,212,0,.6);}
  .rcp-jump:hover{color:var(--brand-yellow);}
  .rcp-jump::after{content:' ↗';font-size:.85em;color:var(--brand-yellow);}
  .nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;box-sizing:border-box;border-radius:999px;
    background:#ff5a5a;color:#fff;font-size:11px;font-weight:900;line-height:1;vertical-align:1px;font-variant-numeric:tabular-nums;}
  .nbadge[hidden]{display:none;}
  /* v0.9.0: 잠긴 필드 — 어둡게 + 자물쇠 */
  .gather .cw.field.field-locked{cursor:default;}
  .gather .cw.field.field-locked > :not(.lock):not(.lockneed){filter:brightness(.3) saturate(.15);}
  .gather .cw.field .lock{position:absolute;left:50%;top:40%;width:46%;transform:translate(-50%,-50%);image-rendering:pixelated;pointer-events:none;z-index:4;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));}   /* v0.9.1: 어둡게 한 형제(필터)보다 위로 */
  /* v0.10.0: 갓 — 채집 화면 위쪽 캐릭터 카드 + 오른쪽 말풍선 */
  /* 기사 줄 · 원정 트랙 (v0.13.0) */
  /* v0.29.0: 기사 능력치는 카드 안에 */
  .cw.knight .kstat{display:flex;gap:calc(var(--cf) * .05);font-size:calc(var(--cf) * .1);font-weight:800;line-height:1;}
  .cw.knight .kstat .icon.inline{width:1em;height:1em;margin:0 1px 0 0;vertical-align:-.1em;}

  /* 카드 (레거시 모양 그대로) */
  .cw{
    position:absolute;width:var(--cw);height:var(--ch);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw) * .03);

    border:1px solid var(--hairline);border-radius:var(--r-md);
    box-shadow:var(--sh-md);cursor:grab;touch-action:none;box-sizing:border-box;
    --tone:#8E8C82;

  .cw::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--tone);opacity:.10;pointer-events:none;}
  .cw .emoji{font-size:calc(var(--cw) * .38);line-height:1;pointer-events:none;}
  .icon{display:block;width:1.15em;height:1.15em;margin:auto;image-rendering:pixelated;pointer-events:none;-webkit-user-drag:none;}
  .icon.emo{display:flex;align-items:center;justify-content:center;font-size:.95em;line-height:1;font-style:normal;}
  .icon.emo.inline{display:inline-flex;vertical-align:-.3em;}
  .icon.inline{display:inline-block;width:1.35em;height:1.35em;margin:0 1px;vertical-align:-.35em;}
  .cw .name{color:var(--ink);font-size:calc(var(--cf) * .13);font-weight:700;text-align:center;padding:0 4px;line-height:1.15;pointer-events:none;}
  /* v0.82.0: 카드 **아래쪽**에 `⚔ +2` 꼴. v0.87.0: 글씨 크기는 이름과 같게(.13), 색은 그림과 같게 */
  /* v0.88.0: 수치가 있는 카드만 그림·이름을 조금 위로 올리고, 수치도 살짝 올림 */
  .cw .stats ~ .emoji,.cw .stats ~ .name{position:relative;top:calc(var(--cw) * -.07);}
  .cw .stats{position:absolute;left:0;right:0;bottom:calc(var(--cw) * .09);display:flex;justify-content:center;gap:4px;
    font-size:calc(var(--cf) * .13);font-weight:800;line-height:1;pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.85);}
  .cw .stats > span{display:flex;align-items:center;gap:1px;}
  .cw .stats .s-atk{color:#ffce40;}
  .cw .stats .s-def{color:#7db0ff;}
  .cw .stats .s-hp{color:#ff7a7a;}
  .cw .stats .icon.inline{width:1.1em;height:1.1em;margin:0 1px 0 0;vertical-align:0;}
  /* 능력치 그림 — 공격 노랑 · 방어 파랑 · 체력 빨강. 벡터(SVG)라 색은 `color`로 칠해진다
     v0.84.1: 뒤에 깔던 색 라운드 박스는 없앰 (그림만) */
  svg.icon.stat-atk,svg.icon.stat-def,svg.icon.stat-hp{fill:currentColor;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));}
  svg.icon.stat-atk{color:#ffce40;}
  svg.icon.stat-def{color:#7db0ff;}
  svg.icon.stat-hp{color:#ff7a7a;}
  .cw.framed{background:var(--frame) center/100% 100% no-repeat border-box;border-color:transparent;}

    display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--brand-yellow);color:var(--on-brand);
    font-size:calc(var(--cf) * .12);font-weight:800;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;font-variant-numeric:tabular-nums;}
  /* v0.1.1: 끌기 시작하면 조합 안 되는 카드는 흐려짐 (레거시 '흐려짐' = 어둡고 저채도) */
  .cw{transition:filter .2s;}
  .cw.dim{filter:brightness(.42) saturate(.3);}
  .cw.dragging{cursor:grabbing;box-shadow:var(--sh-lg);pointer-events:none;z-index:9;}   /* v0.28.1: 끄는 카드는 필드 전체에서 맨 위 */
  .field.dragging .toplist{pointer-events:none;}                   /* 끌 때 줄 목록이 포인터를 가로채지 않게 */
  /* v0.2.0: 조합되는 카드의 노란 테두리·번쩍임 없앰 — 흐려지지 않은 것만으로 구분 */
  .cw.spawn{animation:spawn .32s ease-out;}
  .cw.pop{animation:pop .5s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:translate(var(--fx),var(--fy)) scale(.2);opacity:0;}60%{opacity:1;}to{transform:none;opacity:1;}}
  .cw.bump{animation:bump .3s ease-out;}
  /* v0.2.2: 제작 성공 — 조합으로 막 나온 카드는 3초 동안 노란 테두리 깜빡임 (레거시 v0.79.0 모양) */
  .cw.made::after{content:'';position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--brand-yellow);
    box-shadow:0 0 6px rgba(255,212,0,.5);pointer-events:none;animation:freshBlink .5s steps(1,end) infinite;}
  .cw.fail::after{content:'';position:absolute;inset:-2px;border-radius:inherit;border:2px solid #ff6b6b;
    box-shadow:0 0 6px rgba(255,90,90,.55);pointer-events:none;animation:freshBlink .5s steps(1,end) infinite;}
  @keyframes freshBlink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
  .cw.gone{animation:gone .3s ease-in forwards;pointer-events:none;}
  @keyframes spawn{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.12);}100%{transform:scale(1);}}
  @keyframes gone{to{transform:scale(.3);opacity:0;}}

  /* 알림 */
  .toasts{position:fixed;z-index:2147483300;   /* 자리는 JS layout() 이 필드에 맞춤 */
    display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;}
  .toast{background:rgba(28,28,23,.94);border:1px solid var(--hairline);color:var(--ink);
    font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--r-pill);white-space:nowrap;animation:toast 2.6s forwards;}
  @keyframes toast{0%{opacity:0;transform:translateY(-6px);}10%{opacity:1;transform:none;}85%{opacity:1;}100%{opacity:0;}}

  /* 인스펙터 */
  .insp{flex:1 1 auto;min-height:0;overflow-y:auto;box-sizing:border-box;padding:12px 14px;font-size:13px;line-height:1.5;}
  .insp .empty{color:var(--muted);}
  .insp .head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .insp .head .pic{font-size:34px;line-height:1;}
  .insp .head .nm{font-size:16px;font-weight:800;}
  .insp .head .kd{font-size:12px;color:var(--muted);}
  .insp .desc{color:var(--muted);font-style:italic;margin:2px 0 8px;}
  .insp .chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .insp .chip{font-size:11px;padding:2px 8px;border-radius:var(--r-pill);border:1px solid var(--hairline);color:var(--ink);}
  .insp .chip.use{border-color:rgba(255,212,0,.45);color:#ffe08a;}   /* v0.19.0: 용도 태그 */
  .insp .chip .icon.inline{width:1em;height:1em;margin:0 1px 0 0;vertical-align:-.1em;}
  .insp .sub{font-size:11px;font-weight:800;color:var(--brand-yellow);margin:8px 0 4px;letter-spacing:.02em;}
  .insp .row{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);}
  /* v0.73.0: 같은 결의 정보는 **가로로 묶고**, 폭이 모자라면 줄내림. 조합식처럼 한 줄이 긴 것은 세로 그대로 */
  .insp .rows{display:flex;flex-wrap:wrap;gap:2px 14px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);}
  .insp .rows .row{padding:0;border-bottom:none;white-space:nowrap;}
  .insp .row.gpick{cursor:pointer;}
  .insp .row.gpick:hover{background:rgba(255,255,255,.06);}
  .insp .row.gpick.on{color:var(--brand-yellow);}
  .insp .i-muted{color:var(--muted);}
  /* v0.89.0: 수치 글씨도 그림과 같은 색 (경험치는 사이안) */
  .v-atk{color:#ffce40;} .v-def{color:#7db0ff;} .v-hp{color:#ff7a7a;} .v-xp{color:#57d9e0;}
  .locked .icon{filter:brightness(0) opacity(.45);}                 /* 미발견: 검은 실루엣 */

  /* 콜렉터북 (v0.4.0) — 화면 아래에서 올라오는 모달. 뒤는 어둡게 가림 */
  /* v0.66.0: 정비 화면의 거점 줄 · 기사 카드의 레벨/경험치 */
  .cw.camp-lab .sub-lab{font-size:calc(var(--cf) * .1);color:var(--muted);}
  /* v0.69.0: 경험치 바는 레벨 글씨 **아래에 깔리는 레이어** — 줄을 더 차지하지 않는다 */
  .lvrow{position:relative;margin-top:2px;padding-bottom:4px;text-align:center;}
  .klv{position:relative;z-index:1;font-size:calc(var(--cf) * .11);font-weight:800;color:var(--brand-yellow);}
  .xpbar{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;}
  .xpbar i{display:block;height:100%;background:#57d9e0;opacity:.85;}
  /* v0.68.0: 인스펙터 레벨 표. v0.85.0: 한 레벨 = 길이가 같은 짧은 바, 가로로 늘어놓다 모자라면 줄내림 */
  /* v0.97.0: 기사 인스펙터 정리 — 바 길이는 모두 같게, 눈에 띄는 건 '다음 레벨' 하나뿐 */
  .lvnow{display:flex;align-items:center;gap:8px;margin:2px 0 6px;font-size:12px;}
  .lvnow .lvfrom{font-weight:800;white-space:nowrap;}
  .lvnow .lvbar{flex:1;position:relative;height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden;}
  .lvnow .lvbar i{display:block;height:100%;background:#57d9e0;opacity:.85;}
  .lvnow .lvbar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);font-variant-numeric:tabular-nums;}
  .lvnote{font-size:11px;color:var(--muted);margin:0 0 4px;}
  .lvtab{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
  .lvbreak{flex-basis:100%;height:0;}                              /* 해금 레벨 앞에서 줄을 바꿈 — 바 자체는 늘이지 않음 */
  .lvr{flex:0 0 auto;box-sizing:border-box;width:8.8em;display:flex;align-items:center;gap:4px;
    padding:3px 8px;border-radius:var(--r-pill);border:1px solid var(--hairline);
    font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;}
  .lvr.got{opacity:.45;}                                            /* 지난 레벨은 한 발 물러남 */
  .lvr.got .lvn{color:#8fdc8f;}
  .lvr.next{color:var(--ink);font-weight:800;opacity:1;border-color:rgba(255,212,0,.7);background:rgba(255,212,0,.09);}
  .lvr.next .lvn{color:var(--brand-yellow);}
  .lvr.unlock{border-style:dashed;}                                 /* 해금은 점선만 — 색으로 튀지 않게 */
  .lvr .lvn{flex:none;font-weight:800;font-variant-numeric:tabular-nums;}
  .lvr .lvw{flex:none;display:flex;align-items:center;gap:2px;}
  .lvr .lvx{flex:none;}
  .lvr .lvq{margin-left:auto;flex:none;opacity:.7;font-variant-numeric:tabular-nums;}
  .lvr .icon.inline{width:1.05em;height:1.05em;}
  /* v0.71.0: 원정 중 레벨업 — 기사 카드가 금빛으로 번쩍 */
  .cw.knight.lvup{animation:lvFlash .9s ease-out;}
  @keyframes lvFlash{0%{box-shadow:0 0 0 0 rgba(255,212,0,0);}
    25%{box-shadow:0 0 14px 4px rgba(255,212,0,.85);filter:brightness(1.35);}
    100%{box-shadow:0 0 0 0 rgba(255,212,0,0);}}
  /* v0.80.0: 트리 버튼 · 트리 팝업 (콜렉터북과 같은 옷) */
  /* v0.91.0: 던전 화면 — 아직 들어갈 던전이 없어 안내와 계획표 버튼만 */
  .dungeon[hidden]{display:none;}
  .dungeon{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    box-sizing:border-box;padding:calc(var(--cw) * .3);text-align:center;
    background:radial-gradient(ellipse at 50% 40%,#231d22 0%,var(--canvas) 72%);}
  .dungeon .dg-t{font-size:calc(var(--cw) * .28);font-weight:900;color:var(--ink);}
  .dungeon .dg-s{font-size:calc(var(--cw) * .17);color:var(--muted);line-height:1.6;max-width:26em;}
  /* v0.96.0: 필드(1:1 네모) 안에 붙는다. 예전엔 body 바로 밑이라 가로 화면에서 UI 뒤로 숨었음 */
  .treebtn{position:absolute;right:8px;top:8px;z-index:12;padding:4px 10px;border-radius:var(--r-pill);
    border:1px solid var(--hairline);background:rgba(20,18,15,.82);color:var(--ink);font:inherit;font-size:12px;font-weight:800;cursor:pointer;}
  .treebtn[hidden]{display:none;}
  .treebtn:hover{border-color:rgba(255,212,0,.5);}
  .trow{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;}
  .trow .tpad{flex:none;color:var(--muted);opacity:.55;white-space:pre;font-variant-numeric:tabular-nums;}
  .trow .tname{font-weight:800;white-space:nowrap;}
  .trow.plan .tname{color:var(--muted);}
  .trow .tmake{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .trow .tchips{display:flex;gap:3px;flex-wrap:wrap;margin-left:auto;}
  .trow .tchip{font-size:10px;padding:1px 6px;border-radius:var(--r-pill);border:1px solid var(--hairline);color:var(--muted);}
  .trow .tchip.atk{border-color:rgba(255,212,0,.45);color:#ffe08a;}
  .trow .tchip.plan{border-style:dashed;}
  .tnote{font-size:11px;color:var(--muted);margin:2px 0 10px;line-height:1.5;}
  .book-back{position:fixed;inset:0;z-index:2147483200;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;}
  .book-back.open{opacity:1;pointer-events:auto;}
  /* v0.17.1: 팝업은 화면 안에서 가능한 크게 — 가로·세로 비율은 화면 따라 자유롭게 */
  .book{position:fixed;left:max(12px, 2.5vw);right:max(12px, 2.5vw);top:max(12px, 2.5vh);bottom:max(12px, 2.5vh);
    z-index:2147483210;display:flex;flex-direction:column;box-sizing:border-box;
    background:linear-gradient(180deg,#2a2419,#1b1812);border:1px solid var(--hairline);border-radius:18px;box-shadow:0 10px 50px rgba(0,0,0,.65);
    transform:scale(.88);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.2,.85,.25,1),opacity .28s;}
  .book.open{transform:none;opacity:1;pointer-events:auto;}
  .book-grip{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:8px auto 0;flex:none;}
  .book-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 16px 8px;flex:none;}
  .book-title{font-weight:800;font-size:15px;}
  .book-tabs{display:flex;gap:4px;flex:1;}
  .book-head .meta{font-size:12px;color:var(--muted);}
  .book-close{border:1px solid var(--hairline);background:transparent;color:var(--ink);font:inherit;width:30px;height:30px;border-radius:var(--r-pill);cursor:pointer;}
  .edit-mode{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;}
  .edit-mode input{margin:0;accent-color:var(--brand-yellow);cursor:pointer;}
  .book-close:disabled{opacity:.3;cursor:default;}
  .book-detail{margin:0 16px 6px;padding:8px 10px;border-radius:var(--r-md);background:rgba(255,255,255,.04);font-size:12px;line-height:1.5;min-height:1.5em;flex:none;}
  .book-detail .nm{font-weight:800;font-size:13px;}
  .book-detail .i-muted{color:var(--muted);}
  .book-body{overflow-y:auto;padding:0 16px 20px;}
  .book-inner{max-width:760px;margin:0 auto;}
  .book-field{margin:10px 0 14px;}
  .book-fname{font-size:13px;font-weight:800;color:var(--brand-yellow);margin-bottom:6px;}
  .book-row{display:flex;gap:10px;flex-wrap:wrap;}
  /* 슬리브: 카드를 끼우는 투명 비닐 주머니. 앞면 아래쪽 덮개(::after)가 카드 위에 겹쳐 '끼워진' 느낌 */
  .sleeve{position:relative;width:calc(var(--cw) + 8px);height:calc(var(--ch) + 8px);border-radius:calc(var(--r-md) + 2px);cursor:pointer;
    background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
  .sleeve::after{content:'';position:absolute;left:0;right:0;bottom:0;height:58%;border-radius:0 0 calc(var(--r-md) + 2px) calc(var(--r-md) + 2px);
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05) 30%,rgba(255,255,255,.03));border-top:1px solid rgba(255,255,255,.22);pointer-events:none;z-index:2;}
  .sleeve .cw{position:absolute;left:4px;top:4px;cursor:pointer;z-index:1;}
  .sleeve .cw.locked{opacity:.55;}
  .sleeve .cw.locked .name{color:var(--muted);}
  .sleeve.sel{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);}
  /* 새 카드 끼우기: 슬리브 위에서 아래로 쑥 */
  .sleeve .cw.insert{animation:sleeveIn .24s cubic-bezier(.3,.7,.3,1) both;}
  @keyframes sleeveIn{
    0%{transform:translateY(calc(-1 * var(--ch) - 30px)) rotate(-4deg);opacity:0;}
    25%{opacity:1;}
    75%{transform:translateY(4px) rotate(0deg);}
    100%{transform:translateY(0);}
  }
  .sleeve .cw.ghost{animation:ghostOut .12s ease-out forwards;}
  @keyframes ghostOut{to{opacity:0;}}
  .sleeve.glow{animation:sleeveGlow .15s ease-out .12s;}   /* v0.11.1: 하이라이트 0.3초(0.3초 뒤) → 0.15초(0.12초 뒤) */
  @keyframes sleeveGlow{0%{box-shadow:inset 0 0 0 2px var(--brand-yellow),0 0 0 0 rgba(255,212,0,.6);}100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 0 0 12px rgba(255,212,0,0);}}
  /* 일시정지: 필드 연출도 멈춤 */
  .table.paused .cw{animation-play-state:paused;}
</style></style>
</head>
<body>
<!-- v0.16.0 화면 구조 (확정 50): 필드(1:1) · UI(남는 공간) · 팝업(1:1 레이어) -->
<div class="field" id="field">
  <div class="table" id="table">
    <div class="hint" id="hint">🧺 <b>채집</b>에서 필드를 탭해 재료를 모으고<br>여기서 카드를 끌어 조합해 보세요</div>
  </div>
  <div class="toplist grid" id="topgrid" hidden></div>
  <div class="gather" id="gather" hidden></div>
  <div class="dungeon" id="dungeon" hidden></div>
  <button class="treebtn" id="treeBtn" hidden></button>
</div>
<div class="ui side" id="ui">
  <div class="quest" id="quest"></div>
  <div class="insp" id="insp"></div>
  <div class="uibar" id="tabs">
    <button class="tabbtn" id="bookBtn">📖<span class="nbadge" id="bookBadge" hidden></span></button>
    <button class="tabbtn" id="setBtn">⚙</button>
    <span class="meta ver-out" id="ver"></span>   <!-- v0.47.1: 설정을 안 열어도 보이게 -->
    <div class="setpan" id="setpan" hidden>
      <span class="meta" id="seenMeta"></span>
      <label class="edit-mode"><input type="checkbox" id="editMode">에디터 모드</label>
      <button class="reset" id="reset">처음부터</button>
    </div>
  </div>
</div>
<div class="book-back" id="treeBack"></div>
<div class="book" id="tree"></div>
<div class="book-back" id="bookBack"></div>
<div class="book" id="book"></div>
<div class="toasts" id="toasts"></div>
<script>
// ── world2 카드 데이터 (v0.3.0, 확정 48: 크래프트 티어) ─────────
// 레거시 조합식·재료는 쓰지 않음. 1티어만 있고, 2티어가 정해질 때까지 조합식 없음
// 1티어 = 자연에서 얻는 원물. 필드마다 4종 (v0.3.1: 석탄·약초·물고기·벌집 추가)
const FIELDS = [                                                  // v0.9.1: 순서 산 · 초원 · 숲 · 강가 (열린 필드 먼저)
  // v0.18.0: exp — 기사가 그곳에서 무엇을 하는지 (시스템 설명이 아니라 세계관 안의 말)
  { id:'mountain',  name:'산',   emoji:'⛰️', desc:'올라갈수록 돌이 많아지고, 캘수록 반짝이는 게 나온다.',
    exp:'기사는 비탈을 따라 올라가며 무너진 돌더미를 뒤진다. 인기척에 놀란 토끼가 바위 틈에서 튀어나오고, 더 깊은 굴에는 곰이 산다.' },
  { id:'grassland', name:'초원', emoji:'🌾', desc:'바람이 풀을 쓰다듬는 곳. 풀숲 너머에 뭔가 있다.',
    exp:'기사는 허리까지 오는 풀을 헤치며 씨앗과 벌집을 챙긴다. 풀이 흔들리면 그건 바람이 아닐 때가 있다.' },
  { id:'forest',    name:'숲',   emoji:'🌲', desc:'그늘, 열매, 끈적한 것, 쓴 풀. 길을 잃기 딱 좋다.',
    exp:'기사는 나무 사이를 돌며 열매를 따고 흘러내린 수액을 긁어모은다. 발밑의 쓴 풀도 그냥 두지 않는다.' },
  { id:'river',     name:'강가', emoji:'🏞️', desc:'물이 흙을 데려오고, 물고기가 가끔 인사한다.',
    exp:'기사는 물가를 훑으며 젖은 흙과 모래를 퍼내고, 여울에서 물고기를 노린다.' },
];
const FIELD_BY_ID = Object.fromEntries(FIELDS.map(f => [f.id, f]));
// v0.7.2: 필드 카드 그림 images/icon/card_<필드 id>.png
const fieldIcon = f => `<img class="icon" src="images/icon/card_${f.id}.png" alt="${f.name}" draggable="false">`;
// v0.20.0: 필드에서 나오는 재료는 따로 적음 (카드의 소속 필드 = 콜렉터북 묶음과 별개).
//   산은 샘물 대신 나무가 나옴 — 샘물은 카드로 남지만 지금은 나오는 곳이 없음
const FIELD_YIELDS = {
  mountain:  ['stone', 'flint', 'coal', 'tree'],
  grassland: ['grass', 'seed', 'honeycomb', 'feather'],        // v0.52.0: 짐승은 뺌 — 들개·들소를 잡으면 같은 재료가 나옴
  forest:    ['tree', 'berry', 'sap', 'herb'],
  river:     ['water', 'soil', 'sand', 'fish'],
};
const yieldsOf = id => (FIELD_YIELDS[id] || []).filter(t => DEFS[t]);
// 2티어 묶음 (v0.5.0) — 2티어는 필드가 없어 쓰임별로 콜렉터북에 묶음
const GROUPS = [
  { id:'tool',  name:'도구 · 불',  emoji:'🛠️' },
  { id:'build', name:'건축 재료',  emoji:'🧱' },
  { id:'food',  name:'음식',       emoji:'🍖' },
  { id:'body',  name:'몸 · 약',    emoji:'🧪' },
  { id:'loot',  name:'전리품',     emoji:'🐾' },   // v0.15.0: 크리처에게서 나오는 부위 — 생물 이름 대신 성질 이름
  { id:'gear',  name:'장비 · 도구', emoji:'🗡️' },   // v0.15.0: 3티어

  root.setProperty('--ch', CH + 'px');
}
// v0.7.0: 채집 탭에 있을 땐 크래프팅 필드가 숨어 크기가 0 → 같은 자리를 차지하는 채집 화면 크기로
const bounds = () => table.hidden ? { w: gatherEl.clientWidth, h: gatherEl.clientHeight } : { w: table.clientWidth, h: table.clientHeight };
const gatherEl = document.getElementById('gather');
function clampPos(x, y){
  const { w, h } = bounds();
  return { x: Math.max(4, Math.min(w - CW - 4, x)), y: Math.max(4, Math.min(h - CH - 4, y)) };
}
// 빈 자리 찾기 — (x, y) 둘레를 나선으로
function findSpot(x, y, skip){
  const step = CW * 1.05;
  for (let r = 0; r < 10; r++){
    const n = r === 0 ? 1 : r * 6;
    for (let i = 0; i < n; i++){
      const ang = (i / n) * Math.PI * 2 + r * 0.5;
      const p = clampPos(x + Math.cos(ang) * step * r, y + Math.sin(ang) * step * r * 1.1);
      if (S.cards.every(o => o.id === skip || Math.abs(o.x - p.x) > CW * 0.8 || Math.abs(o.y - p.y) > CH * 0.7)) return p;
    }
  }
  return clampPos(x + (Math.random() - 0.5) * CW, y + (Math.random() - 0.5) * CH);
}

// ── 카드 그리기 ─────────────────────────────────────
// v0.79.0: 카드에 붙는 공·방 표시 — 카드가 그려지는 곳 **모두**가 이걸 쓴다
//   (아래 재료 자리 · 위 격자 · 정비 아래 · 장비 칸 안 · 날아가는 카드)

// v0.31.0: 도구 · 무기 화면으로 넘어오면 카드가 가운데에서 제자리로 흩어짐
function spreadCards(){

    const c = byId(id);

    el.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(.35) rotate(${rot}deg)`, opacity: 0, offset: 0 },
      { transform: `translate(${dx * -0.06 + Math.cos(ang) * 6}px, ${dy * -0.06 + Math.sin(ang) * 6}px) scale(1.06) rotate(${rot * 0.15}deg)`, opacity: 1, offset: 0.72 },
      { transform: 'none', opacity: 1, offset: 1 },

// v0.8.0: 이미 있는 종류면 수량만 +1 (카드는 그 자리에서 톡 튐), 없으면 새 카드

function unlockBoards(){

function addCard(type, x, y, anim, from, made){

    c.n++;
    setCount(c);
    const el = els.get(c.id);
    if (anim && el) flash(el, 'bump', 300);
  } else {
    const p = findSpot(x, y);
    c = { id: S.nextId++, type, x: p.x, y: p.y, n: 1 };
    S.cards.push(c);
    if (onBoard(type, S.tab)) mount(c, anim, from);                // v0.20.0: 다른 화면 카드면 상태만 만들어 둠
  }

  syncCards();                                                    // v0.54.0: 보이는 곳 전부 갱신 (수량·격자·퀘스트·인스펙터)
  unlockBoards();                                                 // v0.20.0: 작업대를 만들면 무기 화면이 열림
  return c;
}
function removeCard(id){
  S.cards = S.cards.filter(c => c.id !== id);
  const el = els.get(id);
  els.delete(id);
  if (el){ el.classList.add('gone'); setTimeout(() => el.remove(), 300); }
  if (selected === id) selected = null;

}
// 한 장 쓰기 — 수량 -1, 0이면 카드 사라짐
function useOne(c){
  c.n--;
  if (c.n <= 0) removeCard(c.id);
  else setCount(c);

}
// 여러 장 생성. v0.8.0: 상한 없음 — 있는 종류는 수량 +1
function spawnMany(types, x, y, from, made3s){
  const made = [];
  for (const t of types){
    const c = addCard(t, x, y, 'pop', from, made3s);
    made.push(c);
    // v0.53.1: 완성품이 아래 재료로도 쓰이는지에 따라 연출이 다름
    //   ① 도구이기만 한 것 → 위로 사라진 뒤 격자에 박힘 (아래엔 안 남음)
    //   ② 도구이면서 재료이기도 한 것(뗀석기) → 아래 자리에 남고, 격자에는 박히는 연출만
    //   ③ 재료이기만 한 것 → 그냥 제자리
    if (onTopGrid(t, S.tab)) flyToTop(t, c.x, c.y, !onBoard(t, S.tab));
    else if (!onBoard(t, S.tab)) showAway(t, c.x, c.y);            // v0.22.1: 이 화면 카드가 아니면 잠깐 보였다 공중으로
    if (made3s){ const el = els.get(c.id); if (el){ el.classList.add('made'); clearTimeout(el._madeT); el._madeT = setTimeout(() => el.classList.remove('made'), 3000); } }   // v0.2.2   // v0.21.0: 다른 화면 카드면 el이 없음
  }

// ── 조합 ────────────────────────────────────────────
// 크래프팅 탭에서 되는 조합 (첫 번째)
// v0.46.0: 화면마다 만들 수 있는 유형이 정해져 있음 — 도구 화면에선 도구 계열만, 무기 화면에선 무기 계열만.

function boardMakes(r, id){
  const b = boardOf(id);
  if (!b || !b.tags) return true;
  if (b.dyn) return recipeKind(r) === id;                          // v1.0.0: 조합식이 속한 탭에서만
  const outs = r.cook ? [] : (r.out || []);
  return outs.some(o => useOf(o).some(u => b.tags.includes(u)));
}
// v0.48.0: 끌 때 보여 줄 결과 — 그림 + 이름 + 지금 보유 수
function outLabel(m, x, y){
  const b = m.aIsX ? y : x;
  const outs = m.r.cook ? [DEFS[b].cooked].filter(Boolean) : (m.r.out || []);
  return outs.map(t => `${iconHtml(t, true)} ${esc(DEFS[t].name)} <b>보유 ${have(t)}</b>`).join(' · ');   // v0.63.0: ×가 아니라 '보유 N'
}
function craftMatch(x, y){                                        // v0.57.0: 설비 개념을 없애 '한 번만 만들기' 제한도 없음
  return usableRecipes(x, y).find(m => CRAFT_RECIPES.includes(m.r) && boardMakes(m.r, S.tab)) || null;
}
function craft(drag, tgt, m){
  const r = m.r;
  const a = m.aIsX ? drag : tgt, b = m.aIsX ? tgt : drag;
  const outs = r.cook ? [DEFS[b.type].cooked] : r.out.slice();
  const eaten = [a, b];                                          // v0.9.0: 두 재료 모두 한 장씩 줄어듦 (남는 쪽 없음)
  const from = { x: tgt.x, y: tgt.y };
  S.madeRecipes = S.madeRecipes || [];                            // v0.45.0: 해 본 조합 기록
  if (!S.madeRecipes.includes(r.id)) S.madeRecipes.push(r.id);
  for (const c of eaten) useOne(c);
  spawnMany(outs, tgt.x, tgt.y, from, true);                    // v0.2.2: 제작 성공 깜빡임
  if (byId(tgt.id) && els.get(tgt.id)) flash(els.get(tgt.id), 'bump', 300);

}

// ── 밀어내기 (v0.2.0) ────────────────────────────────
// 겹친 카드끼리 덜 겹친 축으로 서로 밀어냄. 끄는 중인 카드는 밀지도 밀리지도 않음 (조합 대상에 올릴 수 있게)
const PUSH_GAP = 4;                                              // 카드 사이 최소 틈 (px)
const PUSH_RATE = 0.3;                                           // 한 프레임에 겹친 만큼의 몇 배를 풀지
let pushSaveTimer = 0;
function pushStep(){
  if (paused || table.hidden){ requestAnimationFrame(pushStep); return; }   // v0.6.0: 크래프팅 탭이 숨으면 필드 크기가 0이라 멈춤        // v0.4.0: 콜렉터북에 끼우는 동안 멈춤
  const list = visibleCards().filter(c => !(drag && drag.moved && drag.c === c));
  const sx = CW + PUSH_GAP, sy = CH + PUSH_GAP;
  const move = new Map();
  const add = (c, x, y) => { const m = move.get(c) || { x: 0, y: 0 }; m.x += x; m.y += y; move.set(c, m); };
  for (let i = 0; i < list.length; i++){
    for (let j = i + 1; j < list.length; j++){
      const a = list[i], b = list[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const px = sx - Math.abs(dx), py = sy - Math.abs(dy);
      if (px <= 0.5 || py <= 0.5) continue;
      const dir = v => v > 0 ? 1 : v < 0 ? -1 : (b.id > a.id ? 1 : -1);
      if (px < py){ add(a, -dir(dx) * px / 2, 0); add(b, dir(dx) * px / 2, 0); }
      else { add(a, 0, -dir(dy) * py / 2); add(b, 0, dir(dy) * py / 2); }
    }
  }
  let moved = false;
  for (const [c, m] of move){
    const p = clampPos(c.x + m.x * PUSH_RATE, c.y + m.y * PUSH_RATE);
    if (Math.abs(p.x - c.x) + Math.abs(p.y - c.y) < 0.05) continue;
    c.x = p.x; c.y = p.y;
    const el = els.get(c.id);
    if (el) place(el, c);
    moved = true;
  }
  if (moved){ clearTimeout(pushSaveTimer); pushSaveTimer = setTimeout(save, 500); }
  requestAnimationFrame(pushStep);
}

// ── 끌기 ────────────────────────────────────────────
let drag = null;
function cardAt(px, py, skip){
  const tr = table.getBoundingClientRect();
  const x = px - tr.left, y = py - tr.top;
  const vis = visibleCards();
  for (let i = vis.length - 1; i >= 0; i--){
    const c = vis[i];
    if (c.id !== skip && x >= c.x && x <= c.x + CW && y >= c.y && y <= c.y + CH) return c;
  }
  return null;
}
table.addEventListener('pointerdown', e => {

});

        `<div class="find-b known">${outLabel(m, drag.c.type, o.type)}</div>`);
    }
    for (const el of topGridEl.querySelectorAll('[data-topcard]')){   // v0.81.0: 위 격자도 같은 규칙으로
      const t = el.dataset.topcard;

        continue;
      }

    }
  }

function topCardAt(px, py){
  if (topGridEl.hidden) return null;

function endDrag(e){
  if (!drag) return;
  const d = drag;
  drag = null;
  d.el.classList.remove('dragging');
  fieldEl.classList.remove('dragging');
  if (d.el.parentElement === fieldEl){ table.appendChild(d.el); place(d.el, d.c); }   // v0.28.1: 카드 자리로 되돌림
  for (const el of els.values()){
    el.classList.remove('dim', 'new-combo');

  }
  for (const el of topGridEl.querySelectorAll('[data-topcard]')){   // v0.81.0

    el.querySelector('.find-b')?.remove();

  if (!d.moved){ select(d.c.id); return; }

  const topEl = e.type === 'pointercancel' ? null : topCardAt(e.clientX, e.clientY);
  if (topEl){
    const t = topEl.dataset.topcard, tgt = cardOf(t);
    const m = tgt && t !== d.c.type && craftMatch(d.c.type, t);
    d.c.x = d.ox; d.c.y = d.oy;                                   // 끌던 카드는 제자리로
    place(d.el, d.c);
    if (m){
      tgt.x = d.ox; tgt.y = d.oy;                                 // 결과는 끌어온 자리에서 태어나 격자로 날아감
      craft(d.c, tgt, m);

    } else flash(d.el, 'fail', 1500);
    renderMeta(); renderInsp(); save();
    return;

  const tr = table.getBoundingClientRect();
  const inField = e.type !== 'pointercancel' && e.clientX >= tr.left && e.clientX <= tr.right && e.clientY >= tr.top && e.clientY <= tr.bottom;
  if (!inField){
    d.c.x = d.ox; d.c.y = d.oy;

  d.c.x = cp.x; d.c.y = cp.y;

  const tgt = e.type === 'pointercancel' ? null : cardAt(e.clientX, e.clientY, d.c.id);   // v0.8.1: 버리기 칸 없앰
  const m = tgt && craftMatch(d.c.type, tgt.type);

  const all = CRAFT_RECIPES.filter(r => r.cook ? CRAFT_TYPES.some(x => DEFS[x].cooked === t) : (r.out || []).includes(t));

  for (const t of order){

      const card = document.createElement('div');                 // 진짜 카드가 위에서 끼워짐
      card.className = `cw framed f-${frameOf(DEFS[t])} insert`;
      card.innerHTML = `${statsHtml(t)}<div class="emoji">${iconHtml(t)}</div><div class="name">${esc(DEFS[t].name)}</div>`;

      await wait(300);

let tokenDrag = null;
gatherEl.addEventListener('pointerdown', e => {

addEventListener('pointermove', e => {
  const d = tokenDrag;
  if (!d) return;
  const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
  if (!d.moved){
    if (Math.hypot(dx, dy) < 6) return;
    d.moved = true;
    for (const b of gatherEl.querySelectorAll('[data-slot-id]')){   // v0.32.0: 놓을 수 있는 칸은 모두 노란 테두리

    d.el.style.width = d.el.offsetWidth + 'px';
    d.el.style.height = d.el.offsetHeight + 'px';
    document.body.appendChild(d.el);
  }
  d.el.style.transform = `translate(${d.ox + dx}px, ${d.oy + dy}px)`;
  const hit = slotUnder(e.clientX, e.clientY, d.token);
  for (const b of gatherEl.querySelectorAll('[data-slot-id]')) b.classList.toggle('hot', !!hit && b.dataset.slotId === hit);

function slotUnder(px, py, token){
  for (const b of gatherEl.querySelectorAll('[data-slot-id]')){
    if (!b.classList.contains('locked') && slotTakes(b.dataset.slotId, token)){
      const r = b.getBoundingClientRect();
      if (px >= r.left && px <= r.right && py >= r.top && py <= r.bottom) return b.dataset.slotId;
    }
  }
  return null;
}
addEventListener('pointerup', e => {

    if (d.fromSlot){ slotPick = d.fromSlot; renderScreen(); renderInsp(); }
    else if (d.token === 'knight'){ knightPick = true; fieldPick = null; slotPick = null; renderScreen(); renderInsp(); }
    else { inspType = d.token; selected = null; knightPick = false; renderInsp(); }
    return;
  }
  const hit = slotUnder(e.clientX, e.clientY, d.token);
  if (hit && hit !== d.fromSlot){
    if (d.fromSlot) unequipSlot(slotByKey(d.fromSlot.split(':')[1]));
    dropOnSlot(hit, d.token);
  } else if (d.fromSlot && !hit){

//   자리는 13개. 트랙 위에 고르게 놓음 (0.06 ~ 0.97)
function lanePlan(mob, mid, boss){
  const half = [{ loot: 1 }, { fight: mob }, { loot: 1 }, { fight: mob }, { loot: 1 }];
  const stops = half.concat([{ fight: mid, mid: true }], half, [{ fight: boss, boss: true }]);
  const last = stops.length - 1;
  return stops.map((st, i) => Object.assign({ at: +(0.06 + (0.97 - 0.06) * (i / last)).toFixed(3) }, st));
}

  const foes = planOf(id).filter(e => e.fight).map(e => ({ key: e.fight, at: e.at, hp: ENEMIES[e.fight].hp, dead: false, boss: !!e.boss, mid: !!e.mid }));   // v0.58.0: 중간보스
  // v0.13.4: 채집 포인트도 길 위에 미리 놓임 — 기사가 다다르면 잠시 뒤진다
  const spots = planOf(id).filter(e => e.loot).map(e => ({ at: e.at, done: false }));
  exp = { id, t: 0, phase: 'run', idx: 0, foe: -1, foes, spot: -1, spots, search: 0, beat: 0, line: `${FIELD_BY_ID[id].name} 원정 시작` };
  fieldPick = id;                                                 // v0.49.2: 출전하면 그 필드를 인스펙터에 (직접 탭하지 않아도)
  knightPick = false; slotPick = null; inspType = null; selected = null;
  questHit(`exp-start:${id}`);                                    // v0.60.0: 그 필드로 떠나기만 하면 끝나는 퀘스트
  renderGather(); renderInsp(); save();
}
function expTick(dt){
  if (!exp || paused) return;
  if (exp.phase === 'end') return;
  const plan = planOf(exp.id);
  if (exp.phase === 'run'){
    exp.t = Math.min(1, exp.t + dt / EXP_RUN_MS);
    const ev = plan[exp.idx];
    if (ev && exp.t >= ev.at){
      exp.idx++;
      if (ev.loot){                                               // v0.13.4: 채집 포인트에서 잠시 뒤짐
        exp.spot = exp.spots.findIndex(sp => !sp.done && sp.at === ev.at);
        exp.phase = 'search'; exp.search = 0;
        exp.line = '채집 포인트를 뒤진다';
      }
      else if (ev.fight){
        exp.foe = exp.foes.findIndex(f => !f.dead && f.at === ev.at);
        exp.phase = 'fight'; exp.beat = 0;
        exp.line = ev.boss ? `👑 ${ENEMIES[ev.fight].name}이 길을 막았다`
          : ev.mid ? `⚔ ${ENEMIES[ev.fight].name}이 앞을 가로막았다`                // v0.58.0: 중간보스
          : `${ENEMIES[ev.fight].name}과 마주쳤다`;
        if (ev.boss){ toast(`👑 보스 — ${ENEMIES[ev.fight].name}`); S.metBoss = true; }   // v0.21.1: 보스를 만나 봤음
        else if (ev.mid) toast(`⚔ 중간보스 — ${ENEMIES[ev.fight].name}`);   // v0.58.0
      }
    }
    if (exp.t >= 1){ expEnd('clear'); return; }
  } else if (exp.phase === 'search'){
    exp.search += dt;
    if (exp.search >= SEARCH_MS){
      const sp = exp.spots[exp.spot];
      if (sp) sp.done = true;
      exp.spot = -1;
      exp.phase = 'run';
      expLoot();
    }
  } else if (exp.phase === 'fight'){
    exp.beat += dt;
    while (exp.phase === 'fight' && exp.beat >= FIGHT_BEAT_MS){
      exp.beat -= FIGHT_BEAT_MS;
      expBeat();
    }
  }
  expPaint();
}
// 한 번 주고받기 — 기사가 먼저 치고, **적은 죽더라도 한 번은 되친다** (v0.78.0)
//   그전엔 한 방에 죽는 적은 반격을 못 해 잡몹이 아무 위협이 없었음
function expBeat(){
  const k = S.knight, e = exp.foes[exp.foe], def = ENEMIES[e.key];
  const kd = Math.max(1, knightAtk() - def.def);
  e.hp -= kd;
  expSwing('knight', exp.foe, kd);
  const ed = Math.max(1, def.atk - knightDef());                  // v0.78.0: 마지막 일격
  k.hp = Math.max(0, k.hp - ed);
  expSwing(exp.foe, 'knight', ed);
  renderKnight();
  if (e.hp <= 0){
    e.dead = true;
    exp.foe = -1;
    exp.phase = 'run';
    exp.line = `${def.name}을 쓰러뜨렸다`;
    dropLoot(def, exp.foes.indexOf(e));                           // v0.15.0: 확률 전리품
    gainXp(enemyXp(def));                                         // v0.71.0: 잡는 즉시 오른다 (카드에 바로 보이게)
    S.killed = S.killed || [];                                    // v0.66.0: 잡아 본 적 (퀘스트를 늦게 받아도 막히지 않게)
    if (!S.killed.includes(e.key)) S.killed.push(e.key);
    questHit(`kill:${e.key}`);                                    // v0.60.0
    if (e.boss){                                                  // v0.14.0: 그 필드의 마지막 보스를 잡으면 원정 끝
      // v0.51.1: 그 필드를 **처음** 정복했을 때만 다음 필드가 열림
      //   (보스를 다시 잡을 때마다 열려 산 하나로 초원·숲·강가가 다 열리던 것)
      S.cleared = S.cleared || [];
      if (!S.cleared.includes(exp.id)){
        S.cleared.push(exp.id);
        unlockNextField(exp.id);
      }
      expEnd('boss');
      return;
    }
    if (k.hp <= 0){                                               // v0.78.0: 마지막 일격에 함께 쓰러짐 — 처치는 인정하고 빈사 귀환
      exp.killer = { name: def.name, boss: !!e.boss, mid: !!e.mid };
      expEnd('down');
    }
    return;
  }
  if (k.hp <= 0){
    exp.killer = { name: def.name, boss: !!e.boss, mid: !!e.mid };   // v0.61.0: 무엇에게 쓰러졌나
    expEnd('down');                                               // v0.38.1: 빈사 판정을 그리기보다 먼저
  }
  save();
}
function expEnd(kind){
  const line = kind === 'down' ? '기사가 쓰러져 돌아왔다'
    : kind === 'boss' ? '보스를 쓰러뜨리고 돌아왔다'
    : '원정을 마쳤다';
  if (kind === 'down') toast('🩸 기사 빈사 — 원정 중단');
  exp.phase = 'end';
  exp.foe = -1;
  exp.spot = -1;
  exp.line = line;
  exp.fail = kind === 'down';                                     // v0.21.0: 실패 — 큰 글씨 + 한 줄 팁
  // v0.61.0: 여기까지 와 봤다 — 가장 멀리 간 자리를 필드마다 남긴다 (넘어서면 그 자리로 옮겨감)
  S.marks = S.marks || {};
  const best = S.marks[exp.id] || 0;
  exp.beatMark = exp.fail && exp.t > best + 0.02 && best > 0.02;
  if (exp.t > best) S.marks[exp.id] = exp.t;
  questHit(`exp-end:${exp.id}`);                                  // v0.60.0: 다녀오기만 해도 끝나는 퀘스트
  expPaint();
  const bearLoss = exp.fail && exp.killer && exp.killer.boss;     // v0.72.0: 그 필드 보스에게 지고 돌아옴
  setTimeout(() => {
    exp = null;
    renderGather(); renderInsp(); save();
    if (bearLoss && !S.said.includes('bossloss')){                // v0.72.0: 보스에게 처음 졌을 때 한 번
      S.said.push('bossloss');
      knightSay('돌조각으론 곰을 당해낼 수 없겠어');
      save();
    }
  }, exp && exp.fail ? 2600 : 1600);
}
// 전리품 (v0.15.0): 쓰러뜨린 자리에서 확률대로 튀어나와 크래프팅 탭으로 날아감
function dropLoot(def, foeIdx){
  const from = tokOf(foeIdx) || document.querySelector('#exp .tok.knight');
  const r = from ? from.getBoundingClientRect() : gatherEl.getBoundingClientRect();
  const table = def.loot || [];
  if (!table.length) return;
  let roll = Math.random() * table.reduce((sum, l) => sum + l[1], 0);   // v0.15.2: 확률대로 하나를 뽑음 (빈손 없음)
  const hit = table.find(l => (roll -= l[1]) < 0) || table[0];
  const got = Array.from({ length: hit[2] }, () => hit[0]);
  exp.line = `${def.name} — ${got.map(t => DEFS[t].name).join(' · ')}`;
  const key = exp.foes[foeIdx] ? exp.foes[foeIdx].key : null;     // v0.18.2: 이 크리처에게서 받아 봤다고 기록
  if (key){
    const list = S.lootSeen[key] || (S.lootSeen[key] = []);
    let added = false;
    for (const t of got) if (!list.includes(t)){ list.push(t); added = true; }
    if (added){ save(); renderInsp(); }
  }
  got.forEach((t, i) => setTimeout(() => flyToCraft(t, r), i * 260));   // 여러 장이면 차례로
}
// 재료 줍기 — 기사 자리에서 카드가 튀어나와 크래프팅 탭으로 날아감
function expLoot(){
  const pool = yieldsOf(exp.id);                                  // v0.20.0
  if (!pool.length) return;
  const t = pick(pool);
  const tok = document.querySelector('#exp .tok.knight');
  exp.line = `${DEFS[t].name}을(를) 주웠다`;
  flyToCraft(t, tok ? tok.getBoundingClientRect() : gatherEl.getBoundingClientRect());
  expPaint();
}

function flyToTop(t, fx, fy, vanish){
  const tr = table.getBoundingClientRect();
  const mk = () => {
    const el = document.createElement('div');
    el.className = `cw framed f-${frameOf(DEFS[t])} fly`;
    el.innerHTML = `${statsHtml(t)}<div class="emoji">${iconHtml(t)}</div><div class="name">${esc(DEFS[t].name)}</div>`;
    el.style.setProperty('--cw', CW + 'px'); el.style.setProperty('--ch', CH + 'px');
    document.body.appendChild(el);
    return el;
  };
  const at = (x, y, sc, rot) => `translate(${x}px, ${y}px) scale(${sc}) rotate(${rot}deg)`;
  renderTopGrid();                                                // 격자 자리를 먼저 만들어 두고
  const slot = topGridEl.querySelector(`[data-topcard="${t}"]`);
  const sx = tr.left + fx, sy = tr.top + fy;
  const r = slot ? slot.getBoundingClientRect() : { left: sx, top: sy - CH, width: CW, height: CH };
  const ex = r.left + (r.width - CW) / 2, ey = r.top + (r.height - CH) / 2;
  if (slot) slot.style.visibility = 'hidden';                     // 박힐 때까지 자리는 비워 둠
  const land = () => {                                            // 격자 자리에 위에서 내려와 박힘
    const el = mk();
    el.animate([
      { transform: at(ex, ey - CH * 0.75, .92, -3), opacity: 0 },
      { offset: 0.35, transform: at(ex, ey - CH * 0.12, 1, 0), opacity: 1, easing: 'ease-out' },
      { transform: at(ex, ey, 1, 0), opacity: 1 },
    ], { duration: 420, fill: 'forwards' }).finished.then(() => {
      el.remove();
      renderTopGrid();
      const gel = topGridEl.querySelector(`[data-topcard="${t}"]`);
      if (gel) flash(gel, 'bump', 300);                            // 박히며 톡
    });
  };
  if (!vanish){                                                   // ② 아래에도 남는 것 — 격자에 박히는 연출만
    land();
    return;
  }
  const fly = mk();                                               // ① 만든 자리에서 잠깐 보였다 위로 사라짐
  fly.animate([
    { offset: 0,    transform: at(sx, sy, 0.4, 0), opacity: 0 },
    { offset: 0.22, transform: at(sx, sy - 10, 1.1, -4), opacity: 1, easing: 'ease-out' },
    { offset: 0.45, transform: at(sx, sy, 1, 0), opacity: 1 },
    { offset: 0.7,  transform: at(sx, sy, 1, 0), opacity: 1 },
    { offset: 1,    transform: at(sx, sy - CH * 0.9, 0.85, 0), opacity: 0, easing: 'ease-in' },
  ], { duration: 820, fill: 'forwards' }).finished.then(() => { fly.remove(); land(); });
}

function flyToCraft(t, r){

    ], { duration: 680, fill: 'forwards' }).finished;
    if (!S.seen.includes(t)){                                     // ② 새 카드면 발견 (NEW 뱃지·콜렉터북 수)

    await fly.animate([                                           // ③ v0.21.2: 탭으로 날아가지 않고 공중으로 떠오르며 사라짐
      { transform: at(ux, uy, 1, 0), opacity: 1 },
      { offset: 0.35, transform: at(ux, uy - CH * 0.3, 1.04, -2), opacity: 1 },
      { transform: at(ux, uy - CH * 0.9, 0.9, -4), opacity: 0 },

    fly.remove();
    const { w, h } = bounds();
    addCard(t, w * (0.25 + Math.random() * 0.5) - CW / 2, h * (0.3 + Math.random() * 0.4) - CH / 2, S.tab === boardFor(t) ? 'spawn' : null);
    renderMeta(); save();
  })();

    // v0.61.0: 결론도 숫자도 쓰지 않는다 — 무엇에게 쓰러졌는지 사실만
    const k = exp.killer;
    const tip = k ? `${k.boss ? '👑 ' : k.mid ? '⚔ ' : ''}${esc(k.name)}에게 쓰러졌다` : '쓰러져 돌아왔다';
    el.insertAdjacentHTML('afterbegin', `<div class="exp-fail"><div class="big">실패</div><div class="tip">${tip}</div>`
      + (exp.beatMark ? '<div class="tip i-muted">지난번보다 멀리 갔다</div>' : '') + '</div>');
  }
}
// 한 대 — 때린 쪽은 앞으로 돌진(0.3초), 맞은 쪽은 빨갛게(0.3초) + 피해 숫자 (레거시 world 던전과 같음)
const tokOf = who => document.querySelector(who === 'knight' ? '#exp .tok.knight' : `#exp .tok.enemy[data-foe="${who}"]`);
function expSwing(from, to, dmg){
  const a = tokOf(from), b = tokOf(to);
  if (a) flash(a, 'atk', 300);
  if (b){
    flash(b, 'hurt', 300);
    const f = document.createElement('div');
    f.className = 'dmg';
    f.textContent = `-${dmg}`;
    f.style.left = b.style.left || '5%';
    f.style.bottom = 'calc(var(--ch) * .7)';
    b.parentElement.appendChild(f);
    setTimeout(() => f.remove(), 1000);
  }
}
// 기사의 수치를 **보이는 곳 전부** 다시 그림 (v0.78.1)
//   기사 카드는 전투 줄 · 전투 아래 · 정비 줄에 동시에 있고, 원정 트랙에도 기사 토큰이 있다.
//   예전엔 전투 탭의 카드 하나만 고쳐서 같은 값이 화면마다 달라 보였음 (카드 최대 체력 ≠ 트랙 최대 체력)
// v0.38.1: 능력치가 카드 안으로 들어간 뒤(v0.29.0) 체력 막대를 못 찾아 여기서 오류가 났음 → 카드 기준으로 찾음
function renderKnight(){
  const k = S.knight, max = knightMaxHp(), need = xpNeed(knightLv());
  for (const card of gatherEl.querySelectorAll('.cw.knight')){    // 줄·아래·정비 — 있는 것 모두
    const st = card.querySelector('.kstat');
    if (st) st.innerHTML = `<span>${statImg('atk')}${knightAtk()}</span><span>${statImg('def')}${knightDef()}</span>`;
    const hb = card.querySelector('.hpbar');                      // v0.70.0: 숫자가 막대 위에 겹쳐 있음
    if (hb){
      hb.classList.toggle('down', k.hp <= 0);
      hb.querySelector('i').style.width = (k.hp / max * 100) + '%';
      hb.querySelector('.barlab').textContent = `${k.hp}/${max}`;
    }
    const xb = card.querySelector('.xpbar');
    if (xb){
      xb.querySelector('i').style.width = Math.min(100, (k.xp || 0) / need * 100) + '%';
      xb.querySelector('.barlab').innerHTML = `Lv ${knightLv()}<span class="xpn">${k.xp || 0}/${need}</span>`;
    }
  }
  const kt = document.querySelector('#exp .tok.knight .hp');      // 원정 트랙의 기사 토큰
  if (kt && exp) kt.innerHTML = statBox(knightAtk(), knightDef(), k.hp, max);
  renderInsp();                                                   // 인스펙터도 같은 값이어야 함
}
// v0.66.0: 경험치. v0.71.0: **적을 잡는 즉시** 오르고 **보상도 그 자리에서** 붙는다 (카드에 바로 보이게)
//   **최대 체력·공격·방어만 오르고 지금 체력은 그대로** — 레벨업으로 회복되지 않는다
//   원정 중이면 모달은 띄우지 않고 카드가 번쩍인다. 모아 뒀다가 돌아온 뒤 한 번에 보여 줌
function gainXp(n){
  const k = S.knight;
  k.xp = (k.xp || 0) + n;
  const ups = [];
  while (k.xp >= xpNeed(k.lv)){
    k.xp -= xpNeed(k.lv);
    k.lv++;
    ups.push(k.lv);
  }
  save();
  renderKnight();                                                 // 카드의 막대·숫자는 바로 갱신
  if (!exp) renderScreen();                                       // v0.71.0: 원정 중엔 줄을 다시 그리지 않는다 (트랙이 다시 만들어짐)
  renderInsp();
  if (!ups.length){ toast(`✨ 경험치 +${n}`); return; }
  // v0.77.0: **모달을 띄우지 않는다.** 캐릭터가 여럿이 되고 전투를 보내 놓고 다른 일을 하게 되면
  //   레벨업마다 화면을 가리는 건 방해만 된다. 카드가 번쩍이고 알림 줄만 지나간다
  const card = gatherEl.querySelector('.chars .cw.knight');
  if (card) flash(card, 'lvup', 900);
  for (const lv of ups){
    const r = lvReward(lv);
    toast(`⬆ ${KNIGHT.name} Lv ${lv} — ${LV_REWARD_TEXT(r)}`);
    if (r.slot) toast(`🔓 ${slotByKey(r.slot).name} 칸이 열렸다`);
  }
}
// 쉬는 동안 회복 (원정 중엔 안 됨)
function healTick(dt){
  if (exp || paused || S.knight.hp >= knightMaxHp()){ healProg = 0; return; }
  healProg += dt;
  const ms = healMs();
  while (healProg >= ms && S.knight.hp < knightMaxHp()){
    healProg -= ms;
    S.knight.hp++;
    renderKnight();
    save();
  }
}

// ── 퀘스트 (v0.9.0) ─────────────────────────────────
// v0.16.1: 퀘스트가 없으면 줄 자체를 숨겨 자리를 차지하지 않음. 여러 개면 한 줄씩 쌓이고, 많으면 UI 높이의 40%까지만 쓰고 스크롤
let questClear = 0;                                               // v0.41.1: 다 접힌 뒤에 내용을 비움
function renderQuest(){
  const el = document.getElementById('quest');
  const list = S.quests || [];
  el.hidden = false;
  el.classList.toggle('show', list.length > 0 && !knightLine);    // v0.43.0: 기사가 말하는 동안엔 퀘스트를 감춤
  if (!list.length){
    clearTimeout(questClear);
    questClear = setTimeout(() => { if (!(S.quests || []).length) el.innerHTML = ''; }, 360);
    return;
  }
  clearTimeout(questClear);
  el.innerHTML = list.map(q => {
    const def = QUESTS[q.id];
    return def.groups ? questBlockHtml(q, def) : questRowHtml(q, def);
  }).join('');
}
// v0.44.0: 퀘스트 줄 표시 통일 — 오른쪽 끝은 **끝났을 때 ✓** 만.
//   진행 수는 할 일 글 뒤에 작게 (3/5). 단계형은 수를 아예 안 보여 줌 (몇 개를 만들라는 말로 읽혀서)
function questRowHtml(q, def){
  const goal = questGoal(def);
  const prog = def.steps || q.done || goal <= 1 ? '' : ` <span class="q-prog">${Math.min(q.n, goal)}/${goal}</span>`;
  return `<div class="q-row${q.done ? ' done' : ''}"><span class="q-tag">📜</span><b class="q-name">${esc(def.name)}</b>`
    + `<span class="q-text">${esc(q.done ? '완료' : questText(def, q))}${prog}</span>`
    + `<span class="q-n">${q.done ? '✓' : ''}</span></div>`;
}
// v0.41.0: 블록형 — 대제목 · 중제목은 모두 보이고, 소제목(완료 조건)은 지금 덩어리 것만
function questBlockHtml(q, def){
  const st = questGroupState(def);
  let h = `<div class="q-row${q.done ? ' done' : ''}"><span class="q-tag">📜</span><b class="q-name">${esc(def.name)}</b>`
    + `<span class="q-text">${q.done ? '완료' : `<span class="q-prog">${Math.min(st.done.filter(Boolean).length, def.groups.length)}/${def.groups.length}</span>`}</span>`
    + `<span class="q-n">${q.done ? '✓' : ''}</span></div>`;
  def.groups.forEach((g, i) => {
    const done = st.done[i], now = i === st.now;
    h += `<div class="q-mid${done ? ' done' : ''}${now ? ' now' : ''}">${done ? '✔' : now ? '▸' : '·'} ${esc(g.title)}</div>`;
    if (!now || q.done) return;
    for (const it of g.items){
      const n = have(it.card), ok = n >= it.n;
      h += `<div class="q-sub${ok ? ' done' : ''}">${ok ? '☑' : '☐'} ${iconHtml(it.card, true)} ${esc(DEFS[it.card].name)}`
        + (it.text ? `<span class="q-sub-t">${esc(it.text)}</span>` : '')
        + `<span class="q-sub-n">${Math.min(n, it.n)}/${it.n}</span></div>`;
    }
  });
  return h;
}
function questStep(id){
  const q = (S.quests || []).find(q => q.id === id && !q.done);
  if (!q) return;
  const def = QUESTS[q.id];
  q.n++;
  if (q.n >= questGoal(def)){
    q.done = true;
    toast(`📜 퀘스트 완료: ${def.name}`);
    renderQuest();
    questFade(q);                                                  // v0.38.0: 반짝 뒤 줄에서 사라짐
    const next = QUEST_NEXT[q.id];                                 // v0.60.0: 빈 순간이 없도록 바로 이어 붙임
    if (next) setTimeout(() => giveQuest(next), 900);
    save();
    return;
  }
  renderQuest();
  save();
}
// v0.47.0: 보스를 잡으면 그다음 잠긴 필드가 열림
//   자물쇠가 바들바들 떨리다 → 열린 자물쇠로 바뀌고 → 아래로 내려가며 사라짐 → 흐리던 색이 돌아오고 → 마지막에 이름이 나타남
// v0.98.0: 그 필드가 열리는 조건 — 필드는 앞 필드를 처음 깨면 하나씩 열린다
function fieldNeed(id){
  const i = FIELDS.findIndex(f => f.id === id);
  const prev = i > 0 ? FIELDS[i - 1] : null;
  return prev ? `${prev.name} 클리어` : '잠김';                    // v0.98.1: '필요' 뺌
}
function unlockNextField(afterId){
  const i = FIELDS.findIndex(f => f.id === afterId);
  const next = FIELDS.slice(i + 1).find(f => fieldLocked(f.id)) || FIELDS.find(f => fieldLocked(f.id));
  if (!next) return;
  S.fields[next.id].locked = false;
  save();
  playUnlock(next);
}
function playUnlock(f){
  gatherEl.querySelector(`[data-field="${f.id}"] .lockneed`)?.remove();   // v0.98.0
  const card = gatherEl.querySelector(`[data-field="${f.id}"]`);
  if (!card){ renderScreen(); return; }
  const lock = card.querySelector('.lock');
  card.classList.add('unlocking');                                // 색은 아직 흐린 채로 (field-locked 를 대신함)
  card.classList.remove('field-locked');
  if (!lock){ card.classList.remove('unlocking'); renderScreen(); return; }
  lock.classList.add('shake');                                    // ① 바들바들
  setTimeout(() => {                                              // ② 열린 자물쇠로
    lock.src = 'images/icon/ui_lock-open.png';
    lock.classList.remove('shake');
    lock.classList.add('opened');
  }, 700);
  setTimeout(() => {                                              // ③ 내려가며 사라짐
    lock.classList.add('drop');
  }, 1050);
  setTimeout(() => {                                              // ④ 색이 돌아옴
    card.classList.add('color-in');
  }, 1500);
  setTimeout(() => {                                              // ⑤ 마지막에 이름
    card.classList.add('name-in');
    toast(`🔓 ${f.emoji} ${f.name} — 새 필드가 열렸다`);
  }, 2050);
  setTimeout(() => { renderScreen(); renderInsp(); }, 2900);      // 원래 모습으로 정리
}
// v0.39.0: 단계가 있는 퀘스트 — 지금 단계의 열쇠와 맞을 때만 한 칸 나아가고, 기사가 한마디
// v0.41.0: 블록형 퀘스트는 보유 수로 판정 — 카드가 늘거나 줄 때마다 확인
function questCheckBlocks(){
  for (const q of (S.quests || [])){
    const def = QUESTS[q.id];
    if (q.done || !def.groups) continue;
    const st = questGroupState(def);
    if (!st.all) continue;
    q.done = true;
    toast(`📜 퀘스트 완료: ${def.name}`);
    renderQuest();
    questFade(q);
    save();
    return;
  }
}
// v0.38.0: 끝낸 퀘스트는 나타날 때처럼 노랗게 반짝인 뒤 줄에서 빠짐
function questFade(q){
  const i = (S.quests || []).indexOf(q);
  const row = document.getElementById('quest').children[i];
  if (row) flash(row, 'q-done-flash', 520);
  setTimeout(() => {
    S.quests = (S.quests || []).filter(x => x !== q);
    S.questDone = S.questDone || [];                               // v0.60.0
    if (!S.questDone.includes(q.id)) S.questDone.push(q.id);
    document.getElementById('quest').innerHTML = '';               // 줄 수가 줄었으니 다시 그림
    renderQuest();
    save();
  }, 560);
}
// 퀘스트 주기 — 같은 퀘스트가 이미 있으면 그대로 (주는 캐릭터는 아직 없음)
let questFlashPending = null;                                     // v0.43.0: 대사 중에 받은 퀘스트는 대사가 끝난 뒤에 알림
function giveQuest(id){
  if (!QUESTS[id] || (S.quests || []).some(q => q.id === id)) return;
  if (S.questDone && S.questDone.includes(id)) return;             // v0.60.0: 한 번 끝낸 메인 퀘스트는 다시 안 줌
  S.quests.push(newQuest(id));
  if (QUESTS[id].say && !knightLine) knightSay(QUESTS[id].say);    // v0.60.0: 목표를 기사 입으로 한 줄
  setTimeout(questSelfCheck, 0);                                   // v0.60.0: 이미 해 놓은 일이면 바로 끝남
  const el = document.getElementById('quest');
  renderQuest();
  if (knightLine){ questFlashPending = id; save(); return; }
  flash(el, 'q-new', 1450);
  toast(`📜 새 퀘스트: ${QUESTS[id].name}`);
  save();
}

// ── 시작 ────────────────────────────────────────────
document.getElementById('ver').textContent = VERSION;
// v0.16.0: 설정 패널 (⚙) — 발견 수 · 처음부터 · 버전
const setPan = document.getElementById('setpan');
// v0.24.0: 에디터 모드 — 모든 잠금 해제 (저장 안 함)
// v0.24.1: 켜면 진짜 저장 상태는 따로 두고, 모든 카드를 1개씩 가진 시험용 상태로 논다.
//   끄면 그대로 돌아옴. 에디터 모드 동안은 저장하지 않음
let realS = null;
const EDIT_KEY = 'card-world2.edit';                              // v0.32.1: 켜 둔 상태를 새로 고쳐도 유지 (게임 저장과 별개)
function setEditMode(on, quiet){
  if (on === editMode) return;
  if (on){
    realS = S;
    editMode = true;
    S = JSON.parse(JSON.stringify(realS));                        // 시험용 사본
    S.seen = CRAFT_TYPES.slice();                                 // 발견 전부
    S.newCards = [];
    S.boards = BOARDS.map(b => b.id);
    for (const id in S.fields) S.fields[id].locked = false;
    for (const t of CRAFT_TYPES){                                 // 모든 카드 1개씩
      const c = cardOf(t);
      if (c){ if (c.n < 1) c.n = 1; continue; }
      const { w, h } = bounds();
      const p = findSpot(w / 2 - CW / 2, h / 2 - CH / 2);
      S.cards.push({ id: S.nextId++, type: t, x: p.x, y: p.y, n: 1 });
    }
  } else {
    S = realS || S;
    realS = null;
    editMode = false;
  }
  try { localStorage.setItem(EDIT_KEY, on ? '1' : '0'); } catch (e) {}
  selected = null; fieldPick = null; slotPick = null; knightPick = false;
  renderTabs();
  if (S.tab !== 'battle' && S.tab !== 'dungeon' && !boardOpen(BOARD_BY_ID[S.tab])) S.tab = 'battle';   // v0.91.0
  setTab(S.tab);
  renderAll(); renderBook(); renderInsp();
  if (!quiet) toast(on ? '🔧 에디터 모드 — 모든 잠금 해제 · 카드 1개씩 (저장 안 함)' : '🔧 에디터 모드 끔 — 원래 상태로');
}
document.getElementById('editMode').addEventListener('change', e => setEditMode(e.target.checked));
document.getElementById('setBtn').addEventListener('click', e => {
  e.stopPropagation();
  setPan.hidden = !setPan.hidden;
  document.getElementById('setBtn').classList.toggle('on', !setPan.hidden);
});
document.addEventListener('click', e => {
  if (setPan.hidden || e.target.closest('#setpan') || e.target.closest('#setBtn')) return;
  setPan.hidden = true;
  document.getElementById('setBtn').classList.remove('on');
});
// v0.37.0: 처음부터 — 저장뿐 아니라 화면·연출·고른 것까지 모두 처음 상태로
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('처음부터 다시 시작할까요?')) return;
  if (paused) return;
  // 하던 것 끊기
  if (drag) endDrag({ type: 'pointercancel' });
  if (tokenDrag){ if (tokenDrag.moved) tokenDrag.el.remove(); tokenDrag = null; }
  exp = null; healProg = 0;                                       // 원정 · 회복
  clearTimeout(knightSayT); knightLine = null; knightSayDone = null;   // 기사 대사
  clearTimeout(lockPopT); document.querySelector('.lockpop')?.remove();
  clearTimeout(pushSaveTimer);
  openBook(false); bookTier = TIERS[0]; bookPick = null;          // 콜렉터북
  pendingInsertReset();
  // 고른 것 · 화면 상태
  selected = null; inspType = null; fieldPick = null; knightPick = false; slotPick = null;
  // 저장 상태 (에디터 모드면 진짜 저장도 함께)
  S = fresh();
  if (editMode && realS) realS = fresh();
  setTab(S.tab);
  renderTabs(); renderAll(); renderBook(); renderInsp();
  save();
  if (editMode){ setEditMode(false, true); document.getElementById('editMode').checked = false; }   // 에디터 모드는 끔
  knightIntro();                                                  // 첫 대사부터 다시
});
addEventListener('resize', () => { measure(); renderAll(); });
measure();
if (!S.tab) S.tab = 'battle';
renderAll();
setTab(S.tab);
try {                                                             // v0.32.1: 지난번에 켜 뒀으면 그대로 에디터 모드로
  if (localStorage.getItem(EDIT_KEY) === '1'){
    document.getElementById('editMode').checked = true;
    setEditMode(true, true);
  }
} catch (e){ console.warn('에디터 모드 복구 실패', e); }   // v0.76.1: 조용히 넘어가지 않게
requestAnimationFrame(pushStep);
knightIntro();                                                    // v0.36.0: 첫 대사 → 첫 퀘스트
setInterval(gameTick, 100);
</script>
