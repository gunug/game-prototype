<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>카드 월드 RPG 2 — Game Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}
  body{background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;}
  [hidden]{display:none!important;}
  /* 인스펙터 자리: 가로가 긴 화면은 오른쪽 폭, 세로가 긴 화면은 하단 높이 (레거시와 같음) */
  :root{--insp-w:0px;--insp-h:0px;--top-h:48px;--quest-h:32px;--play-top:calc(var(--top-h) + var(--quest-h));}
  @media (orientation: landscape){ :root{--insp-w:clamp(200px, 22vw, 280px);} }
  @media (orientation: portrait){ :root{--insp-h:clamp(150px, 28vh, 240px);} }

  /* 상단 막대 */
  .topbar{position:fixed;left:0;right:0;top:0;height:var(--top-h);z-index:2147483000;display:flex;align-items:center;gap:10px;padding:0 12px;
    background:rgba(20,20,16,.96);border-bottom:1px solid var(--hairline);box-sizing:border-box;
    overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:rgba(255,212,0,.45) transparent;}
  .topbar > *{flex:none;}                                           /* v0.7.7: 좁으면 줄어들지 않고 가로 스크롤 */
  .topbar::-webkit-scrollbar{height:4px;}
  .topbar::-webkit-scrollbar-track{background:transparent;}
  .topbar::-webkit-scrollbar-thumb{background:rgba(255,212,0,.35);border-radius:4px;}
  .topbar::-webkit-scrollbar-thumb:hover{background:rgba(255,212,0,.7);}
  .topbar .title{font-weight:800;font-size:14px;white-space:nowrap;}
  .topbar > .tabs{display:flex;gap:4px;flex:1 0 auto;}
  .tabbtn{border:1px solid var(--hairline);background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;
    padding:6px 12px;border-radius:var(--r-pill);white-space:nowrap;cursor:pointer;}
  .tabbtn.on{background:var(--brand-yellow);color:var(--on-brand);border-color:var(--brand-yellow);}
  .topbar .meta{display:inline-block;font-size:12px;color:var(--muted);white-space:nowrap;}
  .topbar .reset{border:1px solid var(--hairline);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:4px 10px;border-radius:var(--r-pill);cursor:pointer;}
  @media (max-width:480px){ .topbar .title{display:none;} }

  /* 필드 */
  .table{position:fixed;top:var(--play-top);left:0;right:var(--insp-w);bottom:var(--insp-h);overflow:hidden;touch-action:none;
    background:radial-gradient(ellipse at 50% 40%,#25251d 0%,var(--canvas) 72%);}
  /* 채집 탭 (v0.6.0) — 크래프팅 필드와 같은 자리에 필드 카드 4장 */
  .gather{position:fixed;top:var(--play-top);left:0;right:var(--insp-w);bottom:var(--insp-h);overflow:auto;box-sizing:border-box;padding:16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(ellipse at 50% 40%,#1f2a1d 0%,var(--canvas) 72%);}
  .gather-hint{color:var(--muted);font-size:13px;text-align:center;}
  .gather-row{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--cw) * .35);max-width:calc(var(--cw) * 1.6 * 4 + var(--cw) * .35 * 3);}
  .gather .cw.field{position:relative;width:calc(var(--cw) * 1.6);height:calc(var(--ch) * 1.6);cursor:pointer;--cf:calc(var(--cw) / .7 * .8 * 1.6);}
  .gather .cw.field .emoji{font-size:calc(var(--cw) * 1.6 * .42);}
  .gather .cw.field .yields{display:flex;gap:2px;justify-content:center;font-size:calc(var(--cw) * .2);margin-top:2px;pointer-events:none;}
  .gather .cw.field .yields .locked .icon,.gather .cw.field .yields .icon.locked{filter:brightness(0) opacity(.45);}
  /* 채집한 카드 (v0.7.0): 필드 카드 위로 튀어나왔다가 작아지며 크래프팅 탭으로 날아감 */
  .fly{position:fixed;left:0;top:0;z-index:2147483050;pointer-events:none;margin:0;will-change:transform,opacity;}
  .gather .cw.field:active{transform:scale(.97);}
  .gather .cw.field.tap{animation:bump .3s ease-out;}
  /* v0.8.2: 필드 고갈 — 위쪽에 남은 횟수 n/10 + 회복 게이지 */
  .gather .cw.field .stock{position:absolute;left:14%;right:14%;top:7%;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;}
  .gather .cw.field .stock-n{display:inline-block;font-size:calc(var(--cf) * .1);font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.8);}
  .gather .cw.field .gauge{width:100%;height:4px;border-radius:2px;background:rgba(0,0,0,.45);overflow:hidden;}
  .gather .cw.field .gauge i{display:block;height:100%;width:0;background:var(--brand-yellow);border-radius:2px;}
  .gather .cw.field.full .gauge{visibility:hidden;}
  .gather .cw.field.depleted .emoji,.gather .cw.field.depleted .yields,.gather .cw.field.depleted .name{filter:brightness(.4) saturate(.3);}
  .gather .cw.field.depleted .stock-n{color:#ff8a8a;}
  /* v0.9.0: 숫자 톡 튀기 — 숫자가 바뀌는 곳 공통 (setNum) */
  .num-bump{animation:numBump .32s ease-out;}
  @keyframes numBump{0%{transform:scale(1);}35%{transform:scale(1.4);}100%{transform:scale(1);}}
  /* v0.9.0: 퀘스트 줄 — 상단 막대 바로 아래 */
  .quest{position:fixed;left:0;right:0;top:var(--top-h);height:var(--quest-h);z-index:2147482990;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 14px;
    background:rgba(34,31,20,.96);border-bottom:1px solid var(--hairline);font-size:13px;white-space:nowrap;overflow:hidden;}
  .quest .q-tag{color:var(--brand-yellow);font-weight:800;}
  .quest .q-text{color:var(--muted);overflow:hidden;text-overflow:ellipsis;}
  .quest .q-n{display:inline-block;margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;}
  .quest.done .q-n{color:#8fdc8f;}
  /* v0.9.0: 새 카드 표시 — 카드 왼쪽 위 NEW, 콜렉터북 버튼에 새 카드 수 */
  .cw .new-b{position:absolute;left:calc(var(--cw) * -.08);top:calc(var(--cw) * -.08);z-index:3;padding:0 calc(var(--cf) * .05);height:calc(var(--cf) * .18);box-sizing:border-box;
    display:flex;align-items:center;border-radius:999px;background:#ff5a5a;color:#fff;font-size:calc(var(--cf) * .1);font-weight:900;letter-spacing:.02em;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;}
  .nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;box-sizing:border-box;border-radius:999px;
    background:#ff5a5a;color:#fff;font-size:11px;font-weight:900;line-height:1;vertical-align:1px;font-variant-numeric:tabular-nums;}
  .nbadge[hidden]{display:none;}
  /* v0.9.0: 잠긴 필드 — 어둡게 + 자물쇠 */
  .gather .cw.field.field-locked{cursor:default;}
  .gather .cw.field.field-locked > :not(.lock){filter:brightness(.3) saturate(.15);}
  .gather .cw.field .lock{position:absolute;left:50%;top:40%;width:46%;transform:translate(-50%,-50%);image-rendering:pixelated;pointer-events:none;z-index:4;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));}   /* v0.9.1: 어둡게 한 형제(필터)보다 위로 */
  /* v0.10.0: 갓 — 채집 화면 위쪽 캐릭터 카드 + 오른쪽 말풍선 */
  .god-row{display:flex;align-items:center;gap:14px;width:100%;max-width:calc(var(--cw) * 1.6 * 4 + var(--cw) * .35 * 3);min-height:var(--ch);}
  .god-row .cw.god{position:relative;flex:none;cursor:pointer;}
  .god-speech{position:relative;max-width:min(300px, 62vw);background:var(--ink);color:#1a1a17;font-size:13px;font-weight:600;line-height:1.35;
    padding:8px 12px;border-radius:12px;box-shadow:var(--sh-md);cursor:pointer;animation:speechIn .18s ease-out;}
  .god-speech::after{content:'';position:absolute;right:100%;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:var(--ink);}
  .god-speech[hidden]{display:none;}
  @keyframes speechIn{from{opacity:0;transform:translateY(4px) scale(.96);}to{opacity:1;transform:none;}}
  /* 갓 파워로 풀리는 자물쇠 */
  .gather .cw.field.unlock-bump{animation:unlockBump .3s ease-out;}   /* v0.10.1: 채집 튐(1.12배)의 절반 */
  @keyframes unlockBump{0%{transform:scale(1);}40%{transform:scale(1.06);}100%{transform:scale(1);}}
  .gather .cw.field .lock.unlocking{animation:unlockOut .6s ease-in forwards;}
  @keyframes unlockOut{0%{transform:translate(-50%,-50%) scale(1);}30%{transform:translate(-50%,-50%) scale(1.25) rotate(-12deg);opacity:1;}100%{transform:translate(-50%,-110%) scale(.6) rotate(8deg);opacity:0;}}
  .quest.q-new{animation:questIn .5s ease-out;}
  @keyframes questIn{0%{background:rgba(255,212,0,.35);}100%{background:rgba(34,31,20,.96);}}
  .tabbtn.catch{animation:tabCatch .35s ease-out;}
  @keyframes tabCatch{0%{transform:scale(1);}40%{transform:scale(1.18);}100%{transform:scale(1);}}
  .hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);color:var(--muted);font-size:14px;text-align:center;pointer-events:none;line-height:1.6;}


  /* 카드 (레거시 모양 그대로) */
  .cw{
    position:absolute;width:var(--cw);height:var(--ch);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw) * .03);
    background:linear-gradient(160deg,var(--surface-soft),#191914);
    border:1px solid var(--hairline);border-radius:var(--r-md);
    box-shadow:var(--sh-md);cursor:grab;touch-action:none;box-sizing:border-box;
    --tone:#8E8C82;
  }
  .cw::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--tone);opacity:.10;pointer-events:none;}
  .cw .emoji{font-size:calc(var(--cw) * .38);line-height:1;pointer-events:none;}
  .icon{display:block;width:1.15em;height:1.15em;margin:auto;image-rendering:pixelated;pointer-events:none;-webkit-user-drag:none;}
  .icon.emo{display:flex;align-items:center;justify-content:center;font-size:.95em;line-height:1;font-style:normal;}
  .icon.emo.inline{display:inline-flex;vertical-align:-.3em;}
  .icon.inline{display:inline-block;width:1.35em;height:1.35em;margin:0 1px;vertical-align:-.35em;}
  .cw .name{color:var(--ink);font-size:calc(var(--cf) * .13);font-weight:700;text-align:center;padding:0 4px;line-height:1.15;pointer-events:none;}
  .cw .stats{position:absolute;left:0;right:0;top:calc(var(--cw) * .05);display:flex;justify-content:center;gap:4px;
    font-size:calc(var(--cf) * .095);font-weight:700;line-height:1;pointer-events:none;}
  .cw .stats .icon.inline{width:1.1em;height:1.1em;margin:0 1px 0 0;vertical-align:0;}
  .cw.framed{background:var(--frame) center/100% 100% no-repeat border-box;border-color:transparent;}
  .cw.framed::before{opacity:0;}
  .f-gold{--frame:url(images/frame/frame_gold.png);}
  .f-stone{--frame:url(images/frame/frame_stone.png);}
  .f-wood{--frame:url(images/frame/frame_wood.png);}
  .cw.sel{outline:2px solid rgba(255,255,255,.55);outline-offset:2px;}
  /* v0.8.0: 보유 수량 — 카드 오른쪽 위 알약 */
  .cw .cnt{position:absolute;right:calc(var(--cw) * -.08);top:calc(var(--cw) * -.08);z-index:3;min-width:calc(var(--cf) * .2);height:calc(var(--cf) * .2);padding:0 calc(var(--cf) * .05);box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--brand-yellow);color:var(--on-brand);
    font-size:calc(var(--cf) * .12);font-weight:800;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;font-variant-numeric:tabular-nums;}
  /* v0.1.1: 끌기 시작하면 조합 안 되는 카드는 흐려짐 (레거시 '흐려짐' = 어둡고 저채도) */
  .cw{transition:filter .2s;}
  .cw.dim{filter:brightness(.42) saturate(.3);}
  .cw.dragging{cursor:grabbing;box-shadow:var(--sh-lg);pointer-events:none;}
  /* v0.2.0: 조합되는 카드의 노란 테두리·번쩍임 없앰 — 흐려지지 않은 것만으로 구분 */
  .cw.spawn{animation:spawn .32s ease-out;}
  .cw.pop{animation:pop .5s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:translate(var(--fx),var(--fy)) scale(.2);opacity:0;}60%{opacity:1;}to{transform:none;opacity:1;}}
  .cw.bump{animation:bump .3s ease-out;}
  /* v0.2.2: 제작 성공 — 조합으로 막 나온 카드는 3초 동안 노란 테두리 깜빡임 (레거시 v0.79.0 모양) */
  .cw.made::after{content:'';position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--brand-yellow);
    box-shadow:0 0 6px rgba(255,212,0,.5);pointer-events:none;animation:freshBlink .5s steps(1,end) infinite;}
  .cw.fail::after{content:'';position:absolute;inset:-2px;border-radius:inherit;border:2px solid #ff6b6b;
    box-shadow:0 0 6px rgba(255,90,90,.55);pointer-events:none;animation:freshBlink .5s steps(1,end) infinite;}
  @keyframes freshBlink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
  .cw.gone{animation:gone .3s ease-in forwards;pointer-events:none;}
  @keyframes spawn{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.12);}100%{transform:scale(1);}}
  @keyframes gone{to{transform:scale(.3);opacity:0;}}

  /* 알림 */
  .toasts{position:fixed;left:0;right:var(--insp-w);z-index:2147483300;top:calc(var(--play-top) + 8px);
    display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;}
  .toast{background:rgba(28,28,23,.94);border:1px solid var(--hairline);color:var(--ink);
    font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--r-pill);white-space:nowrap;animation:toast 2.6s forwards;}
  @keyframes toast{0%{opacity:0;transform:translateY(-6px);}10%{opacity:1;transform:none;}85%{opacity:1;}100%{opacity:0;}}

  /* 인스펙터 */
  .insp{position:fixed;z-index:2147482900;background:rgba(22,22,18,.97);box-sizing:border-box;overflow-y:auto;padding:12px 14px;font-size:13px;line-height:1.5;}
  @media (orientation: landscape){ .insp{right:0;top:var(--play-top);bottom:0;width:var(--insp-w);border-left:1px solid var(--hairline);} }
  @media (orientation: portrait){ .insp{left:0;right:0;bottom:0;height:var(--insp-h);border-top:1px solid var(--hairline);} }
  .insp .empty{color:var(--muted);}
  .insp .head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .insp .head .pic{font-size:34px;line-height:1;}
  .insp .head .nm{font-size:16px;font-weight:800;}
  .insp .head .kd{font-size:12px;color:var(--muted);}
  .insp .desc{color:var(--muted);font-style:italic;margin:2px 0 8px;}
  .insp .chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .insp .chip{font-size:11px;padding:2px 8px;border-radius:var(--r-pill);border:1px solid var(--hairline);color:var(--ink);}
  .insp .sub{font-size:11px;font-weight:800;color:var(--brand-yellow);margin:8px 0 4px;letter-spacing:.02em;}
  .insp .row{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);}
  .insp .i-muted{color:var(--muted);}
  .locked .icon{filter:brightness(0) opacity(.45);}                 /* 미발견: 검은 실루엣 */

  /* 콜렉터북 (v0.4.0) — 화면 아래에서 올라오는 모달. 뒤는 어둡게 가림 */
  .book-back{position:fixed;inset:0;z-index:2147483200;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;}
  .book-back.open{opacity:1;pointer-events:auto;}
  .book{position:fixed;left:0;right:0;bottom:0;z-index:2147483210;max-height:82vh;display:flex;flex-direction:column;box-sizing:border-box;
    background:linear-gradient(180deg,#2a2419,#1b1812);border-top:1px solid var(--hairline);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.6);
    transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.85,.25,1);padding-bottom:env(safe-area-inset-bottom,0px);}
  .book.open{transform:translateY(0);}
  .book-grip{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:8px auto 2px;flex:none;}
  .book-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 16px 8px;flex:none;}
  .book-title{font-weight:800;font-size:15px;}
  .book-tabs{display:flex;gap:4px;flex:1;}
  .book-head .meta{font-size:12px;color:var(--muted);}
  .book-close{border:1px solid var(--hairline);background:transparent;color:var(--ink);font:inherit;width:30px;height:30px;border-radius:var(--r-pill);cursor:pointer;}
  .book-all{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;}
  .book-all input{margin:0;accent-color:var(--brand-yellow);cursor:pointer;}
  .book-close:disabled{opacity:.3;cursor:default;}
  .book-detail{margin:0 16px 6px;padding:8px 10px;border-radius:var(--r-md);background:rgba(255,255,255,.04);font-size:12px;line-height:1.5;min-height:1.5em;flex:none;}
  .book-detail .nm{font-weight:800;font-size:13px;}
  .book-detail .i-muted{color:var(--muted);}
  .book-body{overflow-y:auto;padding:0 16px 20px;}
  .book-inner{max-width:760px;margin:0 auto;}
  .book-field{margin:10px 0 14px;}
  .book-fname{font-size:13px;font-weight:800;color:var(--brand-yellow);margin-bottom:6px;}
  .book-row{display:flex;gap:10px;flex-wrap:wrap;}
  /* 슬리브: 카드를 끼우는 투명 비닐 주머니. 앞면 아래쪽 덮개(::after)가 카드 위에 겹쳐 '끼워진' 느낌 */
  .sleeve{position:relative;width:calc(var(--cw) + 8px);height:calc(var(--ch) + 8px);border-radius:calc(var(--r-md) + 2px);cursor:pointer;
    background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
  .sleeve::after{content:'';position:absolute;left:0;right:0;bottom:0;height:58%;border-radius:0 0 calc(var(--r-md) + 2px) calc(var(--r-md) + 2px);
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05) 30%,rgba(255,255,255,.03));border-top:1px solid rgba(255,255,255,.22);pointer-events:none;z-index:2;}
  .sleeve .cw{position:absolute;left:4px;top:4px;cursor:pointer;z-index:1;}
  .sleeve .cw.locked{opacity:.55;}
  .sleeve .cw.locked .name{color:var(--muted);}
  .sleeve.sel{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);}
  /* 새 카드 끼우기: 슬리브 위에서 아래로 쑥 */
  .sleeve .cw.insert{animation:sleeveIn .35s cubic-bezier(.3,.7,.3,1) both;}
  @keyframes sleeveIn{
    0%{transform:translateY(calc(-1 * var(--ch) - 30px)) rotate(-4deg);opacity:0;}
    25%{opacity:1;}
    75%{transform:translateY(4px) rotate(0deg);}
    100%{transform:translateY(0);}
  }
  .sleeve .cw.ghost{animation:ghostOut .18s ease-out forwards;}

const have = type => cardOf(type)?.n || 0;                       // 보유 수량

function measure(){
  const m = Math.min(innerWidth, innerHeight);
  CW = Math.round(Math.max(57, Math.min(87, m / 7.375)));
  CH = Math.round(CW * 1.36);
  const root = document.documentElement.style;                  // v0.3.0: 콜렉터북도 카드 크기를 씀
  root.setProperty('--cw', CW + 'px');
  root.setProperty('--cf', (CW / 0.7 * 0.8) + 'px');
  root.setProperty('--ch', CH + 'px');
}
// v0.7.0: 채집 탭에 있을 땐 크래프팅 필드가 숨어 크기가 0 → 같은 자리를 차지하는 채집 화면 크기로
const bounds = () => table.hidden ? { w: gatherEl.clientWidth, h: gatherEl.clientHeight } : { w: table.clientWidth, h: table.clientHeight };
const gatherEl = document.getElementById('gather');
function clampPos(x, y){
  const { w, h } = bounds();
  return { x: Math.max(4, Math.min(w - CW - 4, x)), y: Math.max(4, Math.min(h - CH - 4, y)) };
}
// 빈 자리 찾기 — (x, y) 둘레를 나선으로
function findSpot(x, y, skip){
  const step = CW * 1.05;
  for (let r = 0; r < 10; r++){
    const n = r === 0 ? 1 : r * 6;
    for (let i = 0; i < n; i++){
      const ang = (i / n) * Math.PI * 2 + r * 0.5;
      const p = clampPos(x + Math.cos(ang) * step * r, y + Math.sin(ang) * step * r * 1.1);
      if (S.cards.every(o => o.id === skip || Math.abs(o.x - p.x) > CW * 0.8 || Math.abs(o.y - p.y) > CH * 0.7)) return p;
    }
  }
  return clampPos(x + (Math.random() - 0.5) * CW, y + (Math.random() - 0.5) * CH);
}

// ── 카드 그리기 ─────────────────────────────────────
function cardHtml(c){
  const d = DEFS[c.type];
  let html = '';
  if (d.atk || d.defense){
    html += '<div class="stats">'
      + (d.atk ? `<span>${statImg('atk')}${d.atk}</span>` : '')
      + (d.defense ? `<span>${statImg('def')}${d.defense}</span>` : '')
      + '</div>';
  }
  return html + `<div class="emoji">${iconHtml(c.type)}</div><div class="name">${esc(d.name)}</div><div class="cnt">${c.n}</div>`
    + (S.newCards.includes(c.type) ? '<div class="new-b">NEW</div>' : '');
}
// v0.9.0: 숫자 바꾸기 공통 — 글이 실제로 바뀌면 톡 튐 (처음 채울 땐 안 튐). 숫자가 바뀌는 곳은 모두 이걸로
function setNum(el, text){
  if (!el) return;
  text = String(text);
  if (el.textContent === text) return;
  const had = el.textContent !== '';
  el.textContent = text;
  if (had) flash(el, 'num-bump', 340);
}
function setCount(c){ setNum(els.get(c.id)?.querySelector('.cnt'), c.n); }
// 새 카드 표시 다시 그리기: 필드 카드 NEW 뱃지 · 콜렉터북 버튼 수
function renderNew(){
  for (const c of S.cards){
    const el = els.get(c.id);
    if (!el) continue;
    const on = S.newCards.includes(c.type), b = el.querySelector('.new-b');
    if (on && !b) el.insertAdjacentHTML('beforeend', '<div class="new-b">NEW</div>');
    if (!on && b) b.remove();
  }
  const badge = document.getElementById('bookBadge');
  badge.hidden = !S.newCards.length;
  if (S.newCards.length) setNum(badge, S.newCards.length);
  else badge.textContent = '';
}
// 처음 본 카드 — 발견 기록 + NEW (v0.9.0: 콜렉터북 끼우기는 콜렉터북을 열 때 한꺼번에)
function discover(type){
  if (S.seen.includes(type)) return;
  S.seen.push(type);
  S.newCards.push(type);
  toast(`✨ 새 카드: ${ic(type)} ${DEFS[type].name}`);
  renderMeta(); renderNew();
}
function mount(c, anim, from){
  const el = document.createElement('div');
  el.className = `cw framed f-${frameOf(DEFS[c.type])}`;
  el.dataset.id = c.id;
  el.innerHTML = cardHtml(c);
  place(el, c);
  table.appendChild(el);
  els.set(c.id, el);
  if (anim === 'pop' && from){
    el.style.setProperty('--fx', (from.x - c.x) + 'px');
    el.style.setProperty('--fy', (from.y - c.y) + 'px');
  }
  if (anim) flash(el, anim, anim === 'pop' ? 500 : 320);
  return el;
}
const place = (el, c) => { el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; };
function flash(el, cls, ms){
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}
function renderAll(){
  for (const el of els.values()) el.remove();
  els.clear();
  for (const c of S.cards){
    if (!table.hidden){ const p = clampPos(c.x, c.y); c.x = p.x; c.y = p.y; }   // v0.6.0: 숨은 필드에선 당기지 않음
    mount(c);
  }
  renderMeta();
  renderNew();
  renderQuest();
  renderInsp();
  renderBook();
  if (typeof renderGather === 'function') renderGather();
}
function renderMeta(){
  const found = CRAFT_TYPES.filter(t => S.seen.includes(t)).length;
  setNum(document.getElementById('seenMeta'), `발견 ${found}/${CRAFT_TYPES.length}`);
  document.getElementById('hint').hidden = S.cards.length > 0;
}

// ── 알림 ────────────────────────────────────────────
function toast(s){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = rich(s);
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 2700);
}

// ── 카드 추가 / 제거 ─────────────────────────────────
// v0.8.0: 이미 있는 종류면 수량만 +1 (카드는 그 자리에서 톡 튐), 없으면 새 카드
function addCard(type, x, y, anim, from, made){
  let c = cardOf(type);
  if (c){
    c.n++;
    setCount(c);
    if (anim) flash(els.get(c.id), 'bump', 300);
  } else {
    const p = findSpot(x, y);
    c = { id: S.nextId++, type, x: p.x, y: p.y, n: 1 };
    S.cards.push(c);
    mount(c, anim, from);
  }
  discover(type);
  return c;
}
function removeCard(id){
  S.cards = S.cards.filter(c => c.id !== id);
  const el = els.get(id);
  els.delete(id);
  if (el){ el.classList.add('gone'); setTimeout(() => el.remove(), 300); }
  if (selected === id) selected = null;
}
// 한 장 쓰기 — 수량 -1, 0이면 카드 사라짐
function useOne(c){
  c.n--;
  if (c.n <= 0) removeCard(c.id);
  else setCount(c);
}
// 여러 장 생성. v0.8.0: 상한 없음 — 있는 종류는 수량 +1
function spawnMany(types, x, y, from, made3s){
  const made = [];
  for (const t of types){
    const c = addCard(t, x, y, 'pop', from, made3s);
    made.push(c);
    if (made3s){ const el = els.get(c.id); el.classList.add('made'); clearTimeout(el._madeT); el._madeT = setTimeout(() => el.classList.remove('made'), 3000); }   // v0.2.2
  }
  return made;
}

// ── 조합 ────────────────────────────────────────────
// 크래프팅 탭에서 되는 조합 (첫 번째)
function craftMatch(x, y){
  return usableRecipes(x, y).find(m => CRAFT_RECIPES.includes(m.r)) || null;
}
function craft(drag, tgt, m){
  const r = m.r;
  const a = m.aIsX ? drag : tgt, b = m.aIsX ? tgt : drag;
  const outs = r.cook ? [DEFS[b.type].cooked] : r.out.slice();
  const eaten = [a, b];                                          // v0.9.0: 두 재료 모두 한 장씩 줄어듦 (남는 쪽 없음)
  const from = { x: tgt.x, y: tgt.y };
  for (const c of eaten) useOne(c);
  spawnMany(outs, tgt.x, tgt.y, from, true);                    // v0.2.2: 제작 성공 깜빡임
  if (byId(tgt.id) && els.get(tgt.id)) flash(els.get(tgt.id), 'bump', 300);
  return true;                                                   // 남은 카드는 밀어내기로 비킴
}

// ── 밀어내기 (v0.2.0) ────────────────────────────────
// 겹친 카드끼리 덜 겹친 축으로 서로 밀어냄. 끄는 중인 카드는 밀지도 밀리지도 않음 (조합 대상에 올릴 수 있게)
const PUSH_GAP = 4;                                              // 카드 사이 최소 틈 (px)
const PUSH_RATE = 0.3;                                           // 한 프레임에 겹친 만큼의 몇 배를 풀지
let pushSaveTimer = 0;
function pushStep(){
  if (paused || table.hidden){ requestAnimationFrame(pushStep); return; }   // v0.6.0: 크래프팅 탭이 숨으면 필드 크기가 0이라 멈춤        // v0.4.0: 콜렉터북에 끼우는 동안 멈춤
  const list = S.cards.filter(c => !(drag && drag.moved && drag.c === c));
  const sx = CW + PUSH_GAP, sy = CH + PUSH_GAP;
  const move = new Map();
  const add = (c, x, y) => { const m = move.get(c) || { x: 0, y: 0 }; m.x += x; m.y += y; move.set(c, m); };
  for (let i = 0; i < list.length; i++){
    for (let j = i + 1; j < list.length; j++){
      const a = list[i], b = list[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const px = sx - Math.abs(dx), py = sy - Math.abs(dy);
      if (px <= 0.5 || py <= 0.5) continue;
      const dir = v => v > 0 ? 1 : v < 0 ? -1 : (b.id > a.id ? 1 : -1);
      if (px < py){ add(a, -dir(dx) * px / 2, 0); add(b, dir(dx) * px / 2, 0); }
      else { add(a, 0, -dir(dy) * py / 2); add(b, 0, dir(dy) * py / 2); }
    }
  }
  let moved = false;
  for (const [c, m] of move){
    const p = clampPos(c.x + m.x * PUSH_RATE, c.y + m.y * PUSH_RATE);
    if (Math.abs(p.x - c.x) + Math.abs(p.y - c.y) < 0.05) continue;
    c.x = p.x; c.y = p.y;
    const el = els.get(c.id);
    if (el) place(el, c);
    moved = true;
  }
  if (moved){ clearTimeout(pushSaveTimer); pushSaveTimer = setTimeout(save, 500); }
  requestAnimationFrame(pushStep);
}

// ── 끌기 ────────────────────────────────────────────
let drag = null;
function cardAt(px, py, skip){
  const tr = table.getBoundingClientRect();
  const x = px - tr.left, y = py - tr.top;
  for (let i = S.cards.length - 1; i >= 0; i--){
    const c = S.cards[i];
    if (c.id !== skip && x >= c.x && x <= c.x + CW && y >= c.y && y <= c.y + CH) return c;
  }
  return null;
}
table.addEventListener('pointerdown', e => {
  if (paused) return;
  const el = e.target.closest('.cw');
  if (!el || el.classList.contains('gone')) return;
  const c = byId(+el.dataset.id);
  if (!c) return;
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  drag = { c, el, sx: e.clientX, sy: e.clientY, ox: c.x, oy: c.y, moved: false };
});
table.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved){
    if (Math.hypot(dx, dy) < 6) return;
    drag.moved = true;
    drag.el.classList.add('dragging');
    table.appendChild(drag.el);                                   // 맨 위로
    S.cards = S.cards.filter(c => c !== drag.c).concat(drag.c);
    for (const o of S.cards) if (o !== drag.c && !craftMatch(drag.c.type, o.type)) els.get(o.id)?.classList.add('dim');   // v0.1.1: 안 되면 흐려짐. v0.2.0: 되는 카드는 하이라이트 없음
  }
  const p = clampPos(drag.ox + dx, drag.oy + dy);
  drag.c.x = p.x; drag.c.y = p.y;
  place(drag.el, drag.c);
});
function endDrag(e){
  if (!drag) return;
  const d = drag;
  drag = null;
  d.el.classList.remove('dragging');
  for (const el of els.values()) el.classList.remove('dim');
  if (!d.moved){ select(d.c.id); return; }
  const tgt = e.type === 'pointercancel' ? null : cardAt(e.clientX, e.clientY, d.c.id);   // v0.8.1: 버리기 칸 없앰
  const m = tgt && craftMatch(d.c.type, tgt.type);
  if (m && !craft(d.c, tgt, m)) flash(d.el, 'fail', 1500);     // 겹친 채 놓인 카드는 밀어내기가 벌려 줌
  renderMeta(); renderInsp(); save();
}
table.addEventListener('pointerup', endDrag);
table.addEventListener('pointercancel', endDrag);

// ── 인스펙터 ────────────────────────────────────────
const UNK = '<span class="i-muted">???</span>';
let inspType = null;                                             // v0.3.0: 콜렉터북에서 고른 카드 종류
function select(id){
  if (selected != null) els.get(selected)?.classList.remove('sel');
  selected = id;
  inspType = null;
  els.get(id)?.classList.add('sel');
  renderInsp();
}
// 조합식 한 쪽이 가리키는 결과 — 발견 전이면 ???
function outHtml(r, t){
  if (r.cook){
    if (DEFS[t].cooked) return S.seen.includes(DEFS[t].cooked) ? rich(`${ic(DEFS[t].cooked)} ${DEFS[DEFS[t].cooked].name}`) : UNK;
    return '익힘 (날것이 익은 것으로)';
  }
  return r.out.every(o => S.seen.includes(o)) ? rich(outText(r)) : UNK;
}
function renderInsp(){
  if (S.tab === 'gather') return renderFieldInsp();
  const c = selected != null && byId(selected);
  const t = c ? c.type : inspType;
  if (!t){
    inspEl.innerHTML = '<div class="empty">카드를 탭하면 정보가 나와요.<br><br>'
      + `크래프팅 탭 — 1티어 재료 16장 · 2티어 16장 (추천안). 카드를 끌어 다른 카드에 놓으면 조합.<br>종류마다 카드 한 장, 오른쪽 위 숫자가 보유 수량.</div>`;
    return;
  }
  const d = DEFS[t];
  if (!S.seen.includes(t)){                                      // 콜렉터북의 미발견 칸
    inspEl.innerHTML = `<div class="head"><div class="pic locked">${iconHtml(t)}</div><div><div class="nm">???</div><div class="kd">${d.tier}티어 · ${fieldText(t)}</div></div></div>`
      + '<div class="desc">아직 발견하지 못한 카드.</div>';
    return;
  }
  let h = `<div class="head"><div class="pic">${iconHtml(t)}</div><div><div class="nm">${esc(d.name)}</div><div class="kd">${d.tier}티어 · ${fieldText(t)} · 보유 ${have(t)}</div></div></div>`;
  if (DESC[t]) h += `<div class="desc">${esc(DESC[t])}</div>`;
  const tags = (d.tags || []).slice();
  if (d.atk) tags.push(`공격력 ${d.atk}`);
  if (d.defense) tags.push(`방어 ${d.defense}`);
  if (tags.length) h += '<div class="chips">' + tags.map(x => `<span class="chip">${esc(x)}</span>`).join('') + '</div>';
  // 쓰이는 조합 — 이 카드가 들어가는 쪽의 반대편 + 결과
  const uses = [];
  for (const r of CRAFT_RECIPES){
    for (const [mine, other] of [[r.a, r.b], [r.b, r.a]]){
      if (!sideMatch(mine, t)) continue;
      if (r.cook && mine.tag === '날것' && !d.cooked) continue;
      const keep = (r.keep === 'a' && mine === r.a) || (r.keep === 'b' && mine === r.b);
      uses.push(`<div class="row">+ ${rich(sideText(other))} → ${outHtml(r, t)}${keep ? ' <span class="i-muted">(남음)</span>' : ''}</div>`);
      break;
    }
  }
  h += '<div class="sub">쓰이는 조합</div>' + (uses.length ? uses.join('') : '<div class="i-muted">없음</div>');
  // 만드는 법 — 발견한 카드만
  const makes = CRAFT_RECIPES.filter(r => r.cook ? CRAFT_TYPES.some(x => DEFS[x].cooked === t) : (r.out || []).includes(t));
  if (makes.length){
    h += '<div class="sub">만드는 법</div>' + makes.map(r => {
      if (r.cook){
        const raw = CRAFT_TYPES.find(x => DEFS[x].cooked === t);
        return `<div class="row">${rich(sideText(r.a))} + ${rich(`${ic(raw)} ${DEFS[raw].name}`)}</div>`;
      }
      return `<div class="row">${rich(sideText(r.a))} + ${rich(sideText(r.b))}</div>`;
    }).join('');
  }
  inspEl.innerHTML = h;
}

// ── 콜렉터북 (v0.4.0) ────────────────────────────────
// 아래에서 올라오는 모달. 티어 탭 → 필드별 슬리브 4칸. 미발견은 검은 실루엣 + ???
// 새 카드를 발견하면 콜렉터북이 열리고 그 슬리브에 카드가 위에서 아래로 끼워짐. 끼우는 동안 게임 일시정지
const bookEl = document.getElementById('book');
const bookBack = document.getElementById('bookBack');
let bookTier = TIERS[0];
let bookOpen = false;
let bookPick = null;                                              // 콜렉터북에서 고른 카드 (위 설명 줄)
const BOOK_ALL_KEY = 'card-world2.bookAll';                       // v0.7.3: 따로 저장 — 처음부터 해도 유지
let bookAll = false;                                              // '모든 카드 보기' (v0.7.1): 미발견도 보여 줌. 발견 기록은 안 바뀜
try { bookAll = localStorage.getItem(BOOK_ALL_KEY) === '1'; } catch (e) {}
let paused = false;
const shownSeen = t => S.seen.includes(t) && !S.newCards.includes(t);   // v0.9.0: 새 카드는 끼우기 전까지 실루엣
const shownOpen = t => bookAll || shownSeen(t);
function slotHtml(t){
  const on = shownOpen(t);
  return `<div class="sleeve${bookPick === t ? ' sel' : ''}" data-book="${t}">`
    + `<div class="cw framed f-${frameOf(DEFS[t])}${on ? '' : ' locked'}"><div class="emoji">${iconHtml(t)}</div><div class="name">${on ? esc(DEFS[t].name) : '???'}</div></div></div>`;
}
function detailHtml(){
  if (!bookPick) return '<span class="i-muted">슬리브를 탭하면 카드 정보가 나와요.</span>';

  return shownOpen(t)
    ? `<span class="nm">${esc(d.name)}</span> <span class="i-muted">${where}</span><br>${esc(DESC[t] || '')}`
    : `<span class="nm">???</span> <span class="i-muted">${where}</span><br><span class="i-muted">아직 발견하지 못한 카드.</span>`;
}
function renderBook(){
  if (!bookOpen) return;
  const inTier = CRAFT_TYPES.filter(t => DEFS[t].tier === bookTier);
  const found = inTier.filter(shownSeen).length;
  let h = '<div class="book-grip"></div><div class="book-head"><span class="book-title">📖 콜렉터북</span>'
    + '<div class="book-tabs">' + TIERS.map(n => `<button class="tabbtn${n === bookTier ? ' on' : ''}" data-tier="${n}">${n}티어</button>`).join('') + '</div>'

    + `<div class="book-detail">${detailHtml()}</div><div class="book-body"><div class="book-inner">`;
  for (const f of groupsOfTier(bookTier)){

  }
  const body = bookEl.querySelector('.book-body');
  const keep = body ? body.scrollTop : 0;
  bookEl.innerHTML = h + '</div></div>';
  bookEl.querySelector('.book-body').scrollTop = keep;

function openBook(open){
  bookOpen = open;
  bookEl.classList.toggle('open', open);
  bookBack.classList.toggle('open', open);
  document.getElementById('bookBtn').classList.toggle('on', open);
  if (!open) bookPick = null;
  renderBook();
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function setPaused(on){
  paused = on;
  table.classList.toggle('paused', on);
  const x = bookEl.querySelector('.book-close');
  if (x) x.disabled = on;
  const all = bookEl.querySelector('[data-all]');
  if (all) all.disabled = on;
}
let inserting = false;
// v0.9.0: 콜렉터북을 열면 새 카드를 티어 순으로 한꺼번에 끼움. 끼울 때마다 NEW 뱃지·버튼 수가 하나씩 줄어듦
async function runInserts(){
  if (inserting || !S.newCards.length) return;
  inserting = true;
  setPaused(true);
  if (drag) endDrag({ type: 'pointercancel' });                  // 끌던 카드는 그 자리에 놓음
  await wait(420);                                                // 올라오는 시간
  const order = S.newCards.slice().sort((x, y) => DEFS[x].tier - DEFS[y].tier || CRAFT_TYPES.indexOf(x) - CRAFT_TYPES.indexOf(y));
  for (const t of order){
    if (bookTier !== DEFS[t].tier){ bookTier = DEFS[t].tier; renderBook(); }
    const slot = bookEl.querySelector(`[data-book="${t}"]`);
    if (slot){
      slot.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      await wait(125);
      S.newCards = S.newCards.filter(x => x !== t);
      renderNew();
      const ghost = slot.querySelector('.cw');
      ghost.classList.add('ghost');                               // 실루엣은 흐려지며 빠지고
      const card = document.createElement('div');                 // 진짜 카드가 위에서 끼워짐
      card.className = `cw framed f-${frameOf(DEFS[t])} insert`;
      card.innerHTML = `<div class="emoji">${iconHtml(t)}</div><div class="name">${esc(DEFS[t].name)}</div>`;
      slot.appendChild(card);
      slot.classList.add('glow');
      await wait(500);
    } else { S.newCards = S.newCards.filter(x => x !== t); renderNew(); }
    renderBook();
  }
  await wait(125);
  setPaused(false);
  inserting = false;
  renderBook(); save();
}
document.getElementById('bookBtn').addEventListener('click', () => {
  if (paused || S.intro !== 'done') return;
  openBook(!bookOpen);
  if (bookOpen) runInserts();
});
bookBack.addEventListener('click', () => { if (!paused) openBook(false); });
bookEl.addEventListener('click', e => {
  if (paused) return;
  if (e.target.closest('[data-close]')) return openBook(false);
  const tab = e.target.closest('[data-tier]');
  if (tab){ bookTier = +tab.dataset.tier; return renderBook(); }
  const slot = e.target.closest('[data-book]');
  if (slot){ bookPick = slot.dataset.book; renderBook(); }
});
bookEl.addEventListener('change', e => {
  if (!e.target.matches('[data-all]')) return;
  bookAll = e.target.checked;
  try { localStorage.setItem(BOOK_ALL_KEY, bookAll ? '1' : '0'); } catch (e) {}
  renderBook();
});

// ── 탭 · 채집 (v0.6.0) ───────────────────────────────
// 채집 탭: 필드 4곳(산·숲·강가·초원)을 큰 카드로 늘어놓음. 탭하면 인스펙터에 필드 정보 · 나오는 1티어
// 판단: 아직 채집 동작은 없음 (카드 배치만)
let fieldPick = null;
function renderGather(){
  if (S.tab !== 'gather') return;
  gatherEl.innerHTML = '<div class="god-row">'
    + `<div class="cw framed f-gold god${godPick ? ' sel' : ''}" data-god="1"><div class="emoji">${godIcon()}</div><div class="name">갓</div></div>`
    + `<div class="god-speech" data-god="1"${godLine ? '' : ' hidden'}>${esc(godLine || '')}</div></div>`
    + '<div class="gather-row">' + FIELDS.map(f => {
    const ys = CRAFT_TYPES.filter(t => DEFS[t].tier === 1 && DEFS[t].field === f.id);
    const locked = S.fields[f.id].locked;
    return `<div class="cw framed f-stone field${fieldPick === f.id ? ' sel' : ''}${locked ? ' field-locked' : ''}" data-field="${f.id}">`
      + (locked ? '<img class="lock" src="images/icon/ui_lock.png" alt="잠김" draggable="false">' : '<div class="stock"><span class="stock-n"></span><div class="gauge"><i></i></div></div>')
      + `<div class="emoji">${fieldIcon(f)}</div><div class="name">${f.name}</div>`
      + `<div class="yields">${ys.map(t => `<span class="${S.seen.includes(t) ? '' : 'locked'}">${iconHtml(t, true)}</span>`).join('')}</div></div>`;
  }).join('') + '</div><div class="gather-hint">필드를 탭해서 재료를 모으세요</div>';
  renderStock();
}
// 필드 카드의 남은 횟수 · 게이지만 고침 (카드를 다시 그리지 않아 톡 튀는 연출이 안 끊김)
function renderStock(){
  if (S.tab !== 'gather') return;
  for (const el of gatherEl.querySelectorAll('[data-field]')){
    const st = S.fields[el.dataset.field];
    if (st.locked) continue;
    setNum(el.querySelector('.stock-n'), st.left ? `${st.left}/${FIELD_MAX}` : `고갈 0/${FIELD_MAX}`);
    el.querySelector('.gauge i').style.width = (st.left < FIELD_MAX ? st.prog / FIELD_REGEN_MS * 100 : 0) + '%';
    el.classList.toggle('full', st.left >= FIELD_MAX);
    el.classList.toggle('depleted', st.left <= 0);
  }
}
// 회복: 남은 횟수 < 최대면 게이지가 차고, 10초마다 +1. 일시정지(콜렉터북 끼우기) 중엔 멈춤
let regenLast = performance.now();
function regenTick(){
  const now = performance.now(), dt = Math.min(1000, now - regenLast);
  regenLast = now;
  if (paused) return;
  let changed = false;
  for (const f of FIELDS){
    const st = S.fields[f.id];
    if (st.locked || st.left >= FIELD_MAX){ st.prog = 0; continue; }
    st.prog += dt;
    while (st.prog >= FIELD_REGEN_MS && st.left < FIELD_MAX){ st.prog -= FIELD_REGEN_MS; st.left++; changed = true; }
    if (st.left >= FIELD_MAX) st.prog = 0;
  }
  renderStock();
  if (changed){ if (S.tab === 'gather' && fieldPick) renderInsp(); save(); }
}
function renderFieldInsp(){
  if (godPick){                                                   // v0.10.0: 갓을 탭했을 때
    inspEl.innerHTML = `<div class="head"><div class="pic">${godIcon()}</div><div><div class="nm">갓</div><div class="kd">캐릭터 · 수다쟁이</div></div></div>`
      + '<div class="desc">신… 비슷한 것. 체력도 말발도 무한.</div>';
    return;
  }
  const f = fieldPick && FIELD_BY_ID[fieldPick];
  if (!f){
    inspEl.innerHTML = '<div class="empty">필드를 탭하면 정보가 나와요.<br><br>채집 탭 — 재료가 나오는 필드 4곳.</div>';
    return;
  }
  const ys = CRAFT_TYPES.filter(t => DEFS[t].tier === 1 && DEFS[t].field === f.id);
  const st = S.fields[f.id];
  if (st.locked){
    inspEl.innerHTML = `<div class="head"><div class="pic locked">${fieldIcon(f)}</div><div><div class="nm">${esc(f.name)}</div><div class="kd">필드 · 🔒 잠김</div></div></div>`
      + '<div class="desc">아직 들어갈 수 없는 필드.</div>';
    return;
  }
  inspEl.innerHTML = `<div class="head"><div class="pic">${fieldIcon(f)}</div><div><div class="nm">${esc(f.name)}</div><div class="kd">필드</div></div></div>`
    + `<div class="desc">${esc(f.desc)}</div>`
    + `<div class="sub">남은 횟수</div><div class="row">${S.fields[f.id].left ? '' : '<b>고갈</b> · '}${S.fields[f.id].left}/${FIELD_MAX} <span class="i-muted">(10초에 +1)</span></div>`
    + '<div class="sub">나오는 재료</div>'
    + ys.map(t => S.seen.includes(t)
      ? `<div class="row">${iconHtml(t, true)} ${esc(DEFS[t].name)}</div>`
      : `<div class="row"><span class="locked">${iconHtml(t, true)}</span> <span class="i-muted">???</span></div>`).join('');
}
function setTab(tab){
  if (paused) return;
  if (S.intro !== 'done' && tab !== 'gather') return;             // v0.10.0: 갓 등장 동안은 채집 탭에 머묾
  if (drag) endDrag({ type: 'pointercancel' });
  S.tab = tab;
  for (const b of document.querySelectorAll('#tabs [data-tab]')) b.classList.toggle('on', b.dataset.tab === tab);
  table.hidden = tab !== 'craft';
  gatherEl.hidden = tab !== 'gather';
  renderGather(); renderInsp(); save();
}
// 상단 막대 가로 스크롤 (v0.7.7): 마우스 휠 세로 굴림도 가로로
const topbarEl = document.querySelector('.topbar');
topbarEl.addEventListener('wheel', e => {
  if (topbarEl.scrollWidth <= topbarEl.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  topbarEl.scrollLeft += e.deltaY;
  e.preventDefault();
}, { passive: false });
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (b) setTab(b.dataset.tab);
});
gatherEl.addEventListener('click', e => {
  if (paused) return;
  if (e.target.closest('[data-god]')){                            // v0.10.0: 갓 탭 → 말하는 중이면 다음 대사로, 인스펙터에 갓
    if (godItem) finishGodLine();
    if (!godPick){ godPick = true; fieldPick = null; renderGather(); renderInsp(); }
    return;
  }
  const card = e.target.closest('[data-field]');
  if (!card) return;
  if (godPick){ godPick = false; gatherEl.querySelector('.god')?.classList.remove('sel'); }
  if (fieldPick !== card.dataset.field){
    for (const el of gatherEl.querySelectorAll('[data-field]')) el.classList.toggle('sel', el === card);
    fieldPick = card.dataset.field;
    renderInsp();
  }
  harvest(card.dataset.field, card);
});

// 채집 (v0.7.0): 필드 카드를 탭하면 그 필드의 1티어 하나가 나옴 → 필드 카드 위로 튀어나왔다 작아지며 크래프팅 탭으로 날아감 → 크래프팅 필드에 놓임
//   v0.8.0: 수량 제한 없음 — 그 필드의 1티어 4종 중 하나
function harvest(fieldId, cardEl){
  const st = S.fields[fieldId];
  if (st.locked){                                                 // v0.9.0: 잠긴 필드
    flash(cardEl, 'fail', 600);
    toast(`🔒 ${FIELD_BY_ID[fieldId].emoji} ${FIELD_BY_ID[fieldId].name} — 아직 잠겨 있음`);
    return;
  }
  if (st.left <= 0){                                              // v0.8.2: 고갈 — 채집 안 됨
    flash(cardEl, 'fail', 600);
    toast(`${FIELD_BY_ID[fieldId].emoji} ${FIELD_BY_ID[fieldId].name} 고갈 — 10초마다 1회 회복`);
    return;
  }
  if (st.left >= FIELD_MAX) st.prog = 0;                          // 가득일 때 쓰면 게이지는 0부터
  st.left--;
  questStep('gather');
  renderStock(); renderInsp(); save();
  const pool = CRAFT_TYPES.filter(t => DEFS[t].tier === 1 && DEFS[t].field === fieldId);
  flash(cardEl, 'tap', 300);
  const t = pick(pool);
  // 날아가는 카드: 크래프팅 카드와 같은 모양
  const fly = document.createElement('div');
  fly.className = `cw framed f-${frameOf(DEFS[t])} fly`;
  fly.innerHTML = `<div class="emoji">${iconHtml(t)}</div><div class="name">${esc(DEFS[t].name)}</div>`;
  fly.style.setProperty('--cw', CW + 'px'); fly.style.setProperty('--ch', CH + 'px');
  document.body.appendChild(fly);
  const r = cardEl.getBoundingClientRect();
  const sx = r.left + r.width / 2 - CW / 2, sy = r.top + r.height / 2 - CH / 2;         // 필드 카드 가운데
  const ux = sx + (Math.random() - 0.5) * CW * 0.8, uy = r.top - CH * 0.55;               // 위로 튀어나온 자리
  const tab = document.querySelector('#tabs [data-tab="craft"]').getBoundingClientRect();
  const tx = tab.left + tab.width / 2 - CW / 2, ty = tab.top + tab.height / 2 - CH / 2;  // 크래프팅 탭
  const at = (x, y, sc, rot) => `translate(${x}px, ${y}px) scale(${sc}) rotate(${rot}deg)`;
  // v0.7.4: 순서 — ① 필드에서 튀어나옴 → ② (새 카드면) 발견 → ③ 크래프팅 탭으로 날아감. v0.9.0: 콜렉터북 끼우기는 기다리지 않음
  (async () => {
    // ① 튀어나와 잠시 머묾
    await fly.animate([
      { offset: 0,    transform: at(sx, sy, 0.3, 0), opacity: 0 },
      { offset: 0.45, transform: at(ux, uy - 14, 1.12, -6), opacity: 1, easing: 'ease-out' },
      { offset: 0.7,  transform: at(ux, uy, 1, 0), opacity: 1 },
      { offset: 1,    transform: at(ux, uy, 1, 0), opacity: 1 },
    ], { duration: 680, fill: 'forwards' }).finished;
    // ② 새 카드면 여기서 발견 (NEW 뱃지 · 콜렉터북 버튼 수)
    if (!S.seen.includes(t)){
      discover(t);
      renderGather(); save();                                     // 필드 카드 아래 실루엣 → 그림
    }
    // ③ 작아지며 크래프팅 탭으로
    await fly.animate([
      { transform: at(ux, uy, 1, 0), opacity: 1 },
      { transform: at(tx, ty, 0.18, 20), opacity: 0.4 },
    ], { duration: 620, easing: 'cubic-bezier(.5,0,.75,.3)', fill: 'forwards' }).finished;
    fly.remove();
    const tb = document.querySelector('#tabs [data-tab="craft"]');
    flash(tb, 'catch', 350);
    const { w, h } = bounds();
    addCard(t, w * (0.25 + Math.random() * 0.5) - CW / 2, h * (0.3 + Math.random() * 0.4) - CH / 2, S.tab === 'craft' ? 'spawn' : null);
    if (t === 'stone') questStep('stone');                        // v0.11.0: 돌 5개 모으기
    renderMeta(); save();
  })();
}

// ── 퀘스트 (v0.9.0) ─────────────────────────────────
function renderQuest(){
  const q = S.quest, el = document.getElementById('quest');
  if (!q){ el.innerHTML = ''; el.classList.remove('done'); return; }   // v0.10.0: 갓이 주기 전엔 빈 줄
  const def = QUESTS[q.id];
  el.classList.toggle('done', q.done);
  if (!el.firstChild) el.innerHTML = '<span class="q-tag">📜</span><b class="q-name"></b><span class="q-text"></span><span class="q-n"></span>';
  el.querySelector('.q-name').textContent = def.name;
  el.querySelector('.q-text').textContent = q.done ? '완료' : def.text;
  setNum(el.querySelector('.q-n'), `${Math.min(q.n, def.goal)}/${def.goal}${q.done ? ' ✓' : ''}`);
}
function questStep(id){
  const q = S.quest;
  if (!q || q.done || q.id !== id) return;
  const def = QUESTS[q.id];
  q.n++;
  if (q.n >= def.goal){
    q.done = true;
    toast(`📜 퀘스트 완료: ${def.name}`);
    questNext();
  }
  renderQuest();
  save();
}
// v0.11.0: 퀘스트가 끝난 뒤 갓의 다음 퀘스트 (다시 열었을 때도 이어짐)
function questNext(){
  const q = S.quest;
  if (!q || !q.done || godItem || godQ.length) return;
  if (q.id === 'gather'){
    godSay([
      ...GOD_LINES.gatherDone,
      { text: GOD_LINES.stoneQuest, start: () => giveQuest('stone') },
    ]);
  }
}

// ── 갓 (v0.10.0) ────────────────────────────────────
// 채집 화면 위쪽에 캐릭터 카드. 대사는 오른쪽 말풍선에 한 줄씩 (길이에 따라 1.8초~), 갓이나 말풍선을 탭하면 다음 줄
let godPick = false;                                              // 인스펙터에 갓
let godLine = null, godItem = null, godTimer = null;
const godQ = [];
const godIcon = () => '<img class="icon" src="images/icon/card_god.png" alt="갓" draggable="false">';
// lines: 문자열 또는 { text, start, done } — start는 그 줄이 뜰 때, done은 그 줄이 끝날 때
function godSay(lines){
  godQ.push(...lines.map(x => typeof x === 'string' ? { text: x } : x));
  if (!godItem) nextGodLine();
}
function nextGodLine(){
  godItem = godQ.shift() || null;
  godLine = godItem ? godItem.text : null;
  const b = gatherEl.querySelector('.god-speech');
  if (b){
    b.hidden = !godLine;
    b.textContent = godLine || '';
    if (godLine){ b.style.animation = 'none'; void b.offsetWidth; b.style.animation = ''; }
  }
  if (!godItem) return;
  if (godItem.start) godItem.start();
  godTimer = setTimeout(finishGodLine, Math.max(1800, godItem.text.length * 110));
}
function finishGodLine(){
  const it = godItem;
  if (!it) return;
  clearTimeout(godTimer);
  godItem = null;
  if (it.done) it.done();
  nextGodLine();
}
// 첫 등장: 인사 3줄 → "갓 파워!"(산·초원 자물쇠가 풀림) → 퀘스트 한 줄 → 끝나면 퀘스트 "채집"
function runGodIntro(){
  if (S.intro === 'done') return;
  godSay([
    ...GOD_LINES.intro,
    { text: GOD_LINES.power, start: () => unlockFields(START_FIELDS) },
    { text: GOD_LINES.quest, done: () => giveQuest('gather') },
  ]);
}
// v0.10.1: 여러 곳을 한 번에 — 필드마다 따로 다시 그리면 뒤에 그린 게 앞 필드의 튐을 지워 마지막 필드만 튀었음
function unlockFields(ids){
  ids = ids.filter(id => S.fields[id].locked);
  if (!ids.length) return;
  for (const id of ids) gatherEl.querySelector(`[data-field="${id}"] .lock`)?.classList.add('unlocking');   // 자물쇠가 튀어 오르며 사라짐
  setTimeout(() => {
    for (const id of ids){ S.fields[id].locked = false; S.fields[id].left = FIELD_MAX; S.fields[id].prog = 0; }
    renderGather();                                               // 한 번만 그리고
    for (const id of ids){                                        // 열린 필드 모두 톡 튐
      const el = gatherEl.querySelector(`[data-field="${id}"]`);
      if (el) flash(el, 'unlock-bump', 300);
    }
    if (ids.includes(fieldPick)) renderInsp();
    save();
  }, 600);
}
function giveQuest(id){
  S.quest = { id, n: 0, done: false };
  S.intro = 'done';
  const el = document.getElementById('quest');
  renderQuest();
  flash(el, 'q-new', 520);
  toast(`📜 새 퀘스트: ${QUESTS[id].name}`);
  save();
}

// ── 시작 ────────────────────────────────────────────
document.getElementById('ver').textContent = VERSION;
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('처음부터 다시 시작할까요?')) return;
  if (paused) return;
  clearTimeout(godTimer); godQ.length = 0; godItem = null; godLine = null; godPick = false;   // v0.10.0: 하던 대사는 끊고 갓 등장부터 다시
  S = fresh(); selected = null; fieldPick = null; renderAll(); setTab(S.tab); save();   // v0.9.0: 처음부터는 채집 탭에서
  runGodIntro();
});
addEventListener('resize', () => { measure(); renderAll(); });
measure();
if (!S.tab || S.intro !== 'done') S.tab = 'gather';              // v0.10.0: 갓 등장 전이면 채집 탭
renderAll();
setTab(S.tab);
runGodIntro();
questNext();
requestAnimationFrame(pushStep);
setInterval(regenTick, 100);
</script>
</body>
</html>
