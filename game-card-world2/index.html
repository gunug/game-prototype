<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>카드 월드 RPG 2 — Game Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}
  body{background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;}
  [hidden]{display:none!important;}
  /* v0.16.0 화면 구조 (확정 50): 필드 1:1 · UI는 남는 공간 · 팝업은 1:1 레이어.
     크기는 JS layout() 이 잼 — --fs 필드 한 변, --ps 팝업 한 변 */
  :root{--fs:320px;}
  .field{position:fixed;overflow:hidden;background:#0f0f0a;box-shadow:0 0 0 1px var(--hairline);}
  .ui{position:fixed;z-index:2147482900;display:flex;flex-direction:column;box-sizing:border-box;background:rgba(20,20,16,.96);}
  .ui.side{border-left:1px solid var(--hairline);}
  .ui.bottom{border-top:1px solid var(--hairline);}
  /* UI 아래쪽 버튼 줄 — 채집 · 크래프팅 · 콜렉터북 · 설정 */
  .uibar{flex:none;position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--hairline);}
  .tabbtn{border:1px solid var(--hairline);background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;
    padding:6px 12px;border-radius:var(--r-pill);white-space:nowrap;cursor:pointer;}
  .tabbtn.on{background:var(--brand-yellow);color:var(--on-brand);border-color:var(--brand-yellow);}
  .meta{display:inline-block;font-size:12px;color:var(--muted);white-space:nowrap;}
  .reset{border:1px solid var(--hairline);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:4px 10px;border-radius:var(--r-pill);cursor:pointer;}
  /* 설정 패널 — ⚙ 를 누르면 버튼 줄 위로 */
  .setpan{position:absolute;right:10px;bottom:calc(100% + 6px);z-index:5;min-width:150px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
    background:rgba(28,28,23,.98);border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--sh-lg);padding:10px 12px;}

  /* 필드 */  /* 필드 */
  .table{position:absolute;inset:0;overflow:hidden;touch-action:none;
    background:radial-gradient(ellipse at 50% 40%,#25251d 0%,var(--canvas) 72%);}
  /* 채집 탭 (v0.6.0) — 크래프팅 필드와 같은 자리에 필드 카드 4장 */
  .gather{position:absolute;inset:0;overflow:hidden;box-sizing:border-box;padding:calc(var(--cw) * .12);   /* v0.17.0: 필드엔 스크롤이 없음 */
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw) * .12);
    background:radial-gradient(ellipse at 50% 40%,#1f2a1d 0%,var(--canvas) 72%);}
  .gather-hint{color:var(--muted);font-size:calc(var(--cf) * .105);text-align:center;}
  .gather-row{display:grid;grid-template-columns:repeat(4, 1fr);gap:calc(var(--cw) * .1);width:100%;}   /* v0.17.0: 네 칸 한 줄 고정 */
  .gather .cw.field{position:relative;width:100%;height:auto;aspect-ratio:1 / 1.36;cursor:pointer;--cf:calc(var(--cw) / .7 * .8 * 1.35);}
  .gather .cw.field .emoji{font-size:calc(var(--cw) * 1.35 * .42);}
  .gather .cw.field .yields{display:flex;gap:2px;justify-content:center;font-size:calc(var(--cw) * .2);margin-top:2px;pointer-events:none;}
  /* v0.18.3: 두 번째 줄 — 크리처 전리품 */
  .gather .cw.field .yields.loot{margin-top:1px;padding-top:2px;border-top:1px solid rgba(255,255,255,.14);font-size:calc(var(--cw) * .17);}
  .gather .cw.field .yields .locked .icon,.gather .cw.field .yields .icon.locked{filter:brightness(0) opacity(.45);}
  /* 채집한 카드 (v0.7.0): 필드 카드 위로 튀어나왔다가 작아지며 크래프팅 탭으로 날아감 */
  .fly{position:fixed;left:0;top:0;z-index:2147483050;pointer-events:none;margin:0;will-change:transform,opacity;}
  .gather .cw.field:active{transform:scale(.97);}
  .gather .cw.field.tap{animation:bump .3s ease-out;}
  /* v0.9.0: 숫자 톡 튀기 — 숫자가 바뀌는 곳 공통 (setNum) */
  .num-bump{animation:numBump .32s ease-out;}
  @keyframes numBump{0%{transform:scale(1);}35%{transform:scale(1.4);}100%{transform:scale(1);}}
  /* v0.9.0: 퀘스트 줄 — 상단 막대 바로 아래 */
  /* v0.16.1: 퀘스트 — 여러 개, 없으면 자리도 차지하지 않음 (hidden) */
  .quest{flex:0 1 auto;min-height:0;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;padding:6px 12px;overflow-y:auto;max-height:40%;
    background:rgba(34,31,20,.96);border-bottom:1px solid var(--hairline);font-size:13px;}
  .q-row{display:flex;align-items:center;gap:8px;white-space:nowrap;min-height:26px;}
  .quest .q-tag{color:var(--brand-yellow);font-weight:800;flex:none;}
  .quest .q-name{flex:none;}
  .quest .q-text{color:var(--muted);overflow:hidden;text-overflow:ellipsis;}
  .quest .q-n{display:inline-block;margin-left:auto;flex:none;font-weight:800;font-variant-numeric:tabular-nums;}
  .q-row.done .q-n{color:#8fdc8f;}
  /* v0.9.0: 새 카드 표시 — 카드 왼쪽 위 NEW, 콜렉터북 버튼에 새 카드 수 */
  .cw .new-b{position:absolute;left:calc(var(--cw) * -.08);top:calc(var(--cw) * -.08);z-index:3;padding:0 calc(var(--cf) * .05);height:calc(var(--cf) * .18);box-sizing:border-box;
    display:flex;align-items:center;border-radius:999px;background:#ff5a5a;color:#fff;font-size:calc(var(--cf) * .1);font-weight:900;letter-spacing:.02em;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;}
  .nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;box-sizing:border-box;border-radius:999px;
    background:#ff5a5a;color:#fff;font-size:11px;font-weight:900;line-height:1;vertical-align:1px;font-variant-numeric:tabular-nums;}
  .nbadge[hidden]{display:none;}
  /* v0.9.0: 잠긴 필드 — 어둡게 + 자물쇠 */
  .gather .cw.field.field-locked{cursor:default;}
  .gather .cw.field.field-locked > :not(.lock){filter:brightness(.3) saturate(.15);}
  .gather .cw.field .lock{position:absolute;left:50%;top:40%;width:46%;transform:translate(-50%,-50%);image-rendering:pixelated;pointer-events:none;z-index:4;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));}   /* v0.9.1: 어둡게 한 형제(필터)보다 위로 */
  /* v0.10.0: 갓 — 채집 화면 위쪽 캐릭터 카드 + 오른쪽 말풍선 */
  /* 기사 줄 · 원정 트랙 (v0.13.0) */
  .knight-row{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--ch);}
  .knight-row .cw.knight{position:relative;flex:none;cursor:pointer;}
  .kstat{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;}
  .kstat .icon.inline{width:1.1em;height:1.1em;margin:0 2px 0 0;vertical-align:-.15em;}
  .kstat .khp.down{color:#ff8a8a;}
  .kstat .hpbar{width:min(160px,28vw);height:8px;border-radius:4px;background:rgba(0,0,0,.5);overflow:hidden;}
  .kstat .hpbar i{display:block;height:100%;background:#7ad17a;transition:width .2s;}
  .exp{width:100%;}
  .exp[hidden]{display:none;}
  .exp-lane{position:relative;height:calc(var(--ch) * 1.05);margin:4px 0;border-radius:var(--r-md);overflow:hidden;
    background:linear-gradient(180deg,#2a2a1f,#16160f);border:1px solid var(--hairline);}
  .exp-lane .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--brand-yellow);opacity:.5;width:0;}
  /* v0.13.4: 채집 포인트 — 길 위에 미리 놓이고, 기사가 뒤지면 흔들리다 다 털리면 흐려짐 */
  .exp-lane .spot{position:absolute;bottom:6px;width:calc(var(--cw) * .46);margin-left:calc(var(--cw) * -.23);pointer-events:none;
    transition:opacity .3s,filter .3s;}
  .exp-lane .spot img{width:100%;height:auto;image-rendering:pixelated;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
  .exp-lane .spot.searching{animation:spotShake .22s ease-in-out infinite;}
  .exp-lane .spot.done{opacity:.35;filter:grayscale(.8);}
  @keyframes spotShake{0%,100%{transform:translateX(0) rotate(0);}30%{transform:translateX(-4%) rotate(-2deg);}70%{transform:translateX(4%) rotate(2deg);}}
  /* v0.15.1: 보스도 기사와 같은 크기 — 크게 그리면 트랙 위아래에 닿음 */
  .exp-lane .tok.boss::before{content:'👑';position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 18px);z-index:4;font-size:calc(var(--cw) * .26);}
  /* v0.13.2: 포트레이트 — 레거시 world 던전과 같은 연출 (들썩임 · 공격 돌진 · 피격 빨강) */
  .exp-lane .tok{position:absolute;bottom:7px;height:calc(var(--ch) * .66);width:calc(var(--cw) * .5);margin-left:calc(var(--cw) * -.25);
    display:flex;align-items:flex-end;justify-content:center;transition:left .12s linear;}
  .exp-lane .tok .pic{height:100%;width:auto;image-rendering:pixelated;-webkit-user-drag:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
  .exp-lane .tok.walk{animation:dunBob .5s ease-in-out infinite;}
  .exp-lane .tok.dig{animation:dunDig .4s ease-in-out infinite;}   /* v0.13.4: 쭈그려 뒤지는 몸짓 */
  @keyframes dunDig{0%,100%{transform:translateY(0) rotate(0deg);}35%{transform:translateY(7%) rotate(-5deg);}70%{transform:translateY(1%) rotate(3deg);}}
  /* v0.13.3: 포트레이트는 원래 왼쪽을 봄 → 오른쪽으로 걷는 기사만 뒤집음. 고블린은 그대로(기사 쪽) */
  .exp-lane .tok.knight .pic{transform:scaleX(-1);}
  @keyframes dunBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8%);}}
  .exp-lane .tok.atk .pic{animation:dunAtk .3s ease-out;}          /* 왼쪽을 보는 쪽(고블린): 뒤로 뺐다 왼쪽으로 돌진 */
  .exp-lane .tok.knight.atk .pic{animation:dunAtkF .3s ease-out;}  /* 뒤집힌 쪽(기사): 오른쪽으로 돌진 */
  @keyframes dunAtk{0%{transform:translateX(0);}35%{transform:translateX(22%);}60%{transform:translateX(-32%);}100%{transform:translateX(0);}}
  @keyframes dunAtkF{0%{transform:scaleX(-1) translateX(0);}35%{transform:scaleX(-1) translateX(22%);}60%{transform:scaleX(-1) translateX(-32%);}100%{transform:scaleX(-1) translateX(0);}}
  .exp-lane .tok.hurt .pic{filter:brightness(1.7) sepia(1) saturate(8) hue-rotate(-35deg) drop-shadow(0 2px 3px rgba(0,0,0,.5));}
  .exp-lane .dmg{position:absolute;z-index:5;pointer-events:none;white-space:nowrap;font-weight:800;font-size:calc(var(--cf) * .18);
    color:#ff8f8f;text-shadow:0 2px 6px rgba(0,0,0,.75);animation:floatUp 1s ease-out forwards;}
  /* v0.17.2: 체력 숫자가 포트레이트에 가려 안 보이던 것 — 그림 위쪽 바깥에 둥근 상자로 */
  .exp-lane .tok .hp{position:absolute;left:50%;bottom:100%;margin-bottom:3px;transform:translateX(-50%);z-index:4;
    display:flex;flex-direction:column;align-items:center;gap:0;
    padding:2px 7px;border-radius:calc(var(--cf) * .12);background:rgba(10,10,7,.85);border:1px solid rgba(255,255,255,.2);
    font-size:calc(var(--cf) * .095);font-weight:800;line-height:1.35;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink);}
  .exp-lane .tok .hp:empty{display:none;}
  .exp-lane .tok .hp .icon.inline{width:1.05em;height:1.05em;margin:0 1px 0 0;vertical-align:0;}
  .exp-lane .tok .hp .ln{display:flex;align-items:center;gap:calc(var(--cf) * .05);}
  .exp-lane .tok .hp .hp-n{color:#c9f2c9;}
  .exp-lane .tok.enemy{transition:opacity .3s,transform .3s;}
  .exp-lane .tok.enemy .hp{border-color:rgba(255,140,140,.45);}
  .exp-lane .tok.enemy .hp .hp-n{color:#ffb3b3;}
  .exp-lane .tok.enemy:not(.now):not(.dead){opacity:.75;}          /* 아직 만나지 않은 고블린 */
  .exp-lane .tok.enemy.dead{opacity:0;transform:translateY(8px) scale(.6);}
  .exp-lane .tok.enemy.now{filter:drop-shadow(0 0 4px rgba(255,120,120,.8));}
  /* v0.17.2: 진행 글도 둥근 상자 안에 */
  .exp-line{align-self:center;max-width:100%;box-sizing:border-box;padding:3px 10px;border-radius:999px;
    background:rgba(10,10,7,.7);border:1px solid var(--hairline);color:var(--ink);
    font-size:calc(var(--cf) * .1);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .exp-line:empty{display:none;}
  .exp{display:flex;flex-direction:column;align-items:stretch;}

  .god-row{display:flex;align-items:center;gap:14px;width:100%;max-width:calc(var(--cw) * 1.6 * 4 + var(--cw) * .35 * 3);min-height:var(--ch);}
  .god-row .cw.god{position:relative;flex:none;cursor:pointer;}
  .god-speech{position:relative;max-width:min(300px, 62vw);background:var(--ink);color:#1a1a17;font-size:13px;font-weight:600;line-height:1.35;
    padding:8px 12px;border-radius:12px;box-shadow:var(--sh-md);cursor:pointer;animation:speechIn .18s ease-out;}
  .god-speech::after{content:'';position:absolute;right:100%;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:var(--ink);}
  .god-speech[hidden]{display:none;}
  @keyframes speechIn{from{opacity:0;transform:translateY(4px) scale(.96);}to{opacity:1;transform:none;}}
  /* 갓 파워로 풀리는 자물쇠 */
  .gather .cw.field.unlock-bump{animation:unlockBump .3s ease-out;}   /* v0.10.1: 채집 튐(1.12배)의 절반 */
  @keyframes unlockBump{0%{transform:scale(1);}40%{transform:scale(1.06);}100%{transform:scale(1);}}
  .gather .cw.field .lock.unlocking{animation:unlockOut .6s ease-in forwards;}
  @keyframes unlockOut{0%{transform:translate(-50%,-50%) scale(1);}30%{transform:translate(-50%,-50%) scale(1.25) rotate(-12deg);opacity:1;}100%{transform:translate(-50%,-110%) scale(.6) rotate(8deg);opacity:0;}}
  .quest.q-new{animation:questIn .5s ease-out;}
  @keyframes questIn{0%{background:rgba(255,212,0,.35);}100%{background:rgba(34,31,20,.96);}}
  .tabbtn.catch{animation:tabCatch .35s ease-out;}
  @keyframes tabCatch{0%{transform:scale(1);}40%{transform:scale(1.18);}100%{transform:scale(1);}}
  .hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);color:var(--muted);font-size:14px;text-align:center;pointer-events:none;line-height:1.6;}


  /* 카드 (레거시 모양 그대로) */
  .cw{
    position:absolute;width:var(--cw);height:var(--ch);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw) * .03);
    background:linear-gradient(160deg,var(--surface-soft),#191914);
    border:1px solid var(--hairline);border-radius:var(--r-md);
    box-shadow:var(--sh-md);cursor:grab;touch-action:none;box-sizing:border-box;
    --tone:#8E8C82;
  }
  .cw::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--tone);opacity:.10;pointer-events:none;}
  .cw .emoji{font-size:calc(var(--cw) * .38);line-height:1;pointer-events:none;}
  .icon{display:block;width:1.15em;height:1.15em;margin:auto;image-rendering:pixelated;pointer-events:none;-webkit-user-drag:none;}
  .icon.emo{display:flex;align-items:center;justify-content:center;font-size:.95em;line-height:1;font-style:normal;}
  .icon.emo.inline{display:inline-flex;vertical-align:-.3em;}
  .icon.inline{display:inline-block;width:1.35em;height:1.35em;margin:0 1px;vertical-align:-.35em;}
  .cw .name{color:var(--ink);font-size:calc(var(--cf) * .13);font-weight:700;text-align:center;padding:0 4px;line-height:1.15;pointer-events:none;}
  .cw .stats{position:absolute;left:0;right:0;top:calc(var(--cw) * .05);display:flex;justify-content:center;gap:4px;
    font-size:calc(var(--cf) * .095);font-weight:700;line-height:1;pointer-events:none;}
  .cw .stats .icon.inline{width:1.1em;height:1.1em;margin:0 1px 0 0;vertical-align:0;}
  .cw.framed{background:var(--frame) center/100% 100% no-repeat border-box;border-color:transparent;}
  .cw.framed::before{opacity:0;}
  .f-gold{--frame:url(images/frame/frame_gold.png);}
  .f-stone{--frame:url(images/frame/frame_stone.png);}
  .f-wood{--frame:url(images/frame/frame_wood.png);}
  .cw.sel{outline:2px solid rgba(255,255,255,.55);outline-offset:2px;}
  /* v0.8.0: 보유 수량 — 카드 오른쪽 위 알약 */
  .cw .cnt{position:absolute;right:calc(var(--cw) * -.08);top:calc(var(--cw) * -.08);z-index:3;min-width:calc(var(--cf) * .2);height:calc(var(--cf) * .2);padding:0 calc(var(--cf) * .05);box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--brand-yellow);color:var(--on-brand);
    font-size:calc(var(--cf) * .12);font-weight:800;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;font-variant-numeric:tabular-nums;}
  /* v0.1.1: 끌기 시작하면 조합 안 되는 카드는 흐려짐 (레거시 '흐려짐' = 어둡고 저채도) */
  .cw{transition:filter .2s;}
  .cw.dim{filter:brightness(.42) saturate(.3);}
  .cw.dragging{cursor:grabbing;box-shadow:var(--sh-lg);pointer-events:none;}
  /* v0.2.0: 조합되는 카드의 노란 테두리·번쩍임 없앰 — 흐려지지 않은 것만으로 구분 */
  .cw.spawn{animation:spawn .32s ease-out;}
  .cw.pop{animation:pop .5s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:translate(var(--fx),var(--fy)) scale(.2);opacity:0;}60%{opacity:1;}to{transform:none;opacity:1;}}
  .cw.bump{animation:bump .3s ease-out;}
  /* v0.2.2: 제작 성공 — 조합으로 막 나온 카드는 3초 동안 노란 테두리 깜빡임 (레거시 v0.79.0 모양) */
  .cw.made::after{content:'';position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--brand-yellow);
    box-shadow:0 0 6px rgba(255,212,0,.5);pointer-events:none;animation:freshBlink .5s steps(1,end) infinite;}
  .cw.fail::after{content:'';position:absolute;inset:-2px;border-radius:inherit;border:2px solid #ff6b6b;
    box-shadow:0 0 6px rgba(255,90,90,.55);pointer-events:none;animation:freshBlink .5s steps(1,end) infinite;}
  @keyframes freshBlink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
  .cw.gone{animation:gone .3s ease-in forwards;pointer-events:none;}
  @keyframes spawn{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.12);}100%{transform:scale(1);}}
  @keyframes gone{to{transform:scale(.3);opacity:0;}}

  /* 알림 */

// 카드 그림: images/icon/card_<id>.png

  return `<img class="icon${inline ? ' inline' : ''}" src="images/icon/card_${t}.png" alt="${esc(d.name)}" draggable="false">`;
}
const frameOf = d => 'wood';                                     // 1티어 원물은 모두 나무 프레임
const ICON_TOKEN = /⟦(\w+)⟧/g;

const STAT_NAME = { atk:'공격', def:'방어', hp:'체력', people:'인원' };
const statImg = k => `<img class="icon inline" src="images/icon/ui_${k}.png" alt="${STAT_NAME[k]}" draggable="false">`;
const rich = s => esc(s).replace(ICON_TOKEN, (_, t) => DEFS[t] ? iconHtml(t, true) : t.startsWith('s_') && STAT_NAME[t.slice(2)] ? statImg(t.slice(2)) : '');

// 2장 조합 — 각 쪽은 { card } 또는 { tag, lv }. keep: 'a'/'b' = 남는 쪽

const RECIPES = [
  { id:'blade',      a:{ card:'stone' },  b:{ card:'flint' },     out:['blade'] },   // v0.7.6: 자기+자기 조합 없음
  { id:'whetstone',  a:{ card:'sand' },   b:{ card:'stone' },     out:['whetstone'] },

  { id:'butcher',    a:{ card:'flint' },  b:{ card:'beast' },     out:['hide', 'meat', 'bone'] },
  { id:'fillet',     a:{ card:'flint' },  b:{ card:'fish' },      out:['fillet'] },

  { id:'juice',      a:{ card:'berry' },  b:{ card:'water' },     out:['juice'] },
  { id:'salve',      a:{ card:'herb' },   b:{ card:'sap' },       out:['salve'] },
  // 3티어 (v0.15.0): 전리품으로 만드는 장비·도구·음식
  { id:'toothdagger',  a:{ card:'smalltooth' }, b:{ card:'firewood' }, out:['toothdagger'] },
  { id:'fangspear',    a:{ card:'fang' },       b:{ card:'firewood' }, out:['fangspear'] },
  { id:'leatherarmor', a:{ card:'toughhide' },  b:{ card:'blade' },    out:['leatherarmor'] },
  { id:'pouch',        a:{ card:'hide' },       b:{ card:'cord' },     out:['pouch'] },

  { id:'roastmeat',    a:{ card:'meat' },       b:{ card:'ember' },    out:['roastmeat'] },

function tagLevel(def, name){
  let lv = 0;
  for (const t of (def.tags || [])){
    if (t === name) lv = Math.max(lv, 1);
    else if (t.startsWith(name + ' lv')){
      const n = parseInt(t.slice(name.length + 3), 10);
      if (n > lv) lv = n;
    }
  }
  return lv;
}
const sideMatch = (side, type) => side.card ? side.card === type
  : side.atk ? (DEFS[type].atk || 0) >= side.atk
  : tagLevel(DEFS[type], side.tag) >= (side.lv || 1);
function recipesFor(x, y){
  const out = [];
  for (const r of RECIPES){
    if (sideMatch(r.a, x) && sideMatch(r.b, y)) out.push({ r, aIsX: true });
    else if (sideMatch(r.a, y) && sideMatch(r.b, x)) out.push({ r, aIsX: false });
  }
  return out;
}
const usableRecipes = (x, y) => recipesFor(x, y);
const sideText = sd => sd.card ? `${ic(sd.card)} ${DEFS[sd.card].name}` : `🏷️ ${sd.tag}${sd.lv ? ' lv' + sd.lv + ' 이상' : ''}`;
function outText(r){
  const counts = new Map();
  for (const o of r.out) counts.set(o, (counts.get(o) || 0) + 1);
  return [...counts].map(([o, n]) => ic(o) + ' ' + DEFS[o].name + (n > 1 ? ` ×${n}` : '')).join(', ');
}

  && (r.out || []).every(craftable));
// v0.8.0: 월드 최대 생성 개수(SPAWN_CAP) 없앰 — 종류마다 카드 한 장 + 보유 수량(n)

function fresh(){ return { cards: [], seen: [], newCards: [], nextId: 1, tab: 'gather', fields: freshFields(), quests: [], lootSeen: {}, intro: 'done',   // v0.18.2: 크리처별로 받아 본 전리품
  knight: { hp: KNIGHT.hp } }; }                                 // v0.13.0: 기사 (공 1 · 방 0 · 체 10)
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!s || !Array.isArray(s.cards)) return null;
    const merged = new Map();                                     // v0.8.0: 예전 저장의 같은 카드 여러 장 → 한 장 + 수량
    for (const c of s.cards.filter(c => craftable(c.type))){
      const m = merged.get(c.type);
      if (m) m.n += c.n || 1;
      else merged.set(c.type, { ...c, n: c.n || 1 });
    }
    s.cards = [...merged.values()];
    s.seen = (s.seen || []).filter(t => DEFS[t]);
    const fs = freshFields();                                     // 필드 잠금 상태
    for (const id in fs){
      const o = s.fields && s.fields[id];
      if (o) fs[id] = { locked: typeof o.locked === 'boolean' ? o.locked : !START_FIELDS.includes(id) };   // v0.17.0: 남은 횟수는 버림
    }
    s.fields = fs;
    s.newCards = (s.newCards || []).filter(t => DEFS[t] && s.seen.includes(t));   // v0.9.0: 콜렉터북에 아직 안 끼운 새 카드
    s.intro = s.intro === 'start' ? 'start' : 'done';              // v0.10.0: 예전 저장은 갓 등장을 본 것으로
    // v0.16.1: 예전 저장의 퀘스트 한 개(s.quest)를 목록으로 옮김
    s.quests = (Array.isArray(s.quests) ? s.quests : s.quest ? [s.quest] : []).filter(q => q && QUESTS[q.id]);
    const ls = {};                                                // v0.18.2: 크리처별 전리품 기록
    for (const k in (s.lootSeen || {})) ls[k] = (s.lootSeen[k] || []).filter(t => DEFS[t]);
    s.lootSeen = ls;
    delete s.quest;
    s.intro = 'done';
    s.knight = { hp: Math.max(0, Math.min(KNIGHT.hp, (s.knight && s.knight.hp) ?? KNIGHT.hp)) };   // v0.13.0: 기사
    return s;
  } catch (e){ return null; }
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
const byId = id => S.cards.find(c => c.id === id);
const cardOf = type => S.cards.find(c => c.type === type);
const have = type => cardOf(type)?.n || 0;                       // 보유 수량

// v0.16.0: 필드는 1:1, UI는 남는 공간, 팝업은 1:1 (확정 50)
const UI_MIN = 240;                                              // UI가 최소로 가져가는 폭/높이
let FS = 320;
function layout(){
  const W = innerWidth, H = innerHeight, land = W >= H;
  FS = Math.max(220, Math.min(land ? H : W, (land ? W : H) - UI_MIN));
  const fieldEl = document.getElementById('field'), uiEl = document.getElementById('ui');
  if (land){
    fieldEl.style.cssText = `left:0;top:${Math.round((H - FS) / 2)}px;width:${FS}px;height:${FS}px`;
    uiEl.style.cssText = `left:${FS}px;right:0;top:0;bottom:0`;
    uiEl.className = 'ui side';
  } else {
    fieldEl.style.cssText = `left:${Math.round((W - FS) / 2)}px;top:0;width:${FS}px;height:${FS}px`;
    uiEl.style.cssText = `left:0;right:0;top:${FS}px;bottom:0`;
    uiEl.className = 'ui bottom';
  }
  const fr = fieldEl.getBoundingClientRect();                    // 알림은 필드 위쪽 가운데
  Object.assign(document.getElementById('toasts').style,
    { left: fr.left + 'px', width: FS + 'px', top: (fr.top + 8) + 'px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px', pointerEvents: 'none' });
  const root = document.documentElement.style;
  root.setProperty('--fs', FS + 'px');
}
function measure(){
  layout();
  CW = Math.round(Math.max(44, Math.min(87, FS / 6.4)));         // v0.16.0: 카드 크기는 필드(정사각형) 기준
  CH = Math.round(CW * 1.36);
  const root = document.documentElement.style;                  // v0.3.0: 콜렉터북도 카드 크기를 씀
  root.setProperty('--cw', CW + 'px');
  root.setProperty('--cf', (CW / 0.7 * 0.8) + 'px');
  root.setProperty('--ch', CH + 'px');
}
// v0.7.0: 채집 탭에 있을 땐 크래프팅 필드가 숨어 크기가 0 → 같은 자리를 차지하는 채집 화면 크기로
const bounds = () => table.hidden ? { w: gatherEl.clientWidth, h: gatherEl.clientHeight } : { w: table.clientWidth, h: table.clientHeight };
const gatherEl = document.getElementById('gather');
function clampPos(x, y){
  const { w, h } = bounds();
  return { x: Math.max(4, Math.min(w - CW - 4, x)), y: Math.max(4, Math.min(h - CH - 4, y)) };
}
// 빈 자리 찾기 — (x, y) 둘레를 나선으로
function findSpot(x, y, skip){
  const step = CW * 1.05;
  for (let r = 0; r < 10; r++){
    const n = r === 0 ? 1 : r * 6;
    for (let i = 0; i < n; i++){
      const ang = (i / n) * Math.PI * 2 + r * 0.5;
      const p = clampPos(x + Math.cos(ang) * step * r, y + Math.sin(ang) * step * r * 1.1);
      if (S.cards.every(o => o.id === skip || Math.abs(o.x - p.x) > CW * 0.8 || Math.abs(o.y - p.y) > CH * 0.7)) return p;
    }
  }
  return clampPos(x + (Math.random() - 0.5) * CW, y + (Math.random() - 0.5) * CH);
}

// ── 카드 그리기 ─────────────────────────────────────
function cardHtml(c){
  const d = DEFS[c.type];
  let html = '';
  if (d.atk || d.def){
    html += '<div class="stats">'
      + (d.atk ? `<span>${statImg('atk')}${d.atk}</span>` : '')
      + (d.def ? `<span>${statImg('def')}${d.def}</span>` : '')
      + '</div>';
  }
  return html + `<div class="emoji">${iconHtml(c.type)}</div><div class="name">${esc(d.name)}</div><div class="cnt">${c.n}</div>`
    + (S.newCards.includes(c.type) ? '<div class="new-b">NEW</div>' : '');
}
// v0.9.0: 숫자 바꾸기 공통 — 글이 실제로 바뀌면 톡 튐 (처음 채울 땐 안 튐). 숫자가 바뀌는 곳은 모두 이걸로
function setNum(el, text){
  if (!el) return;
  text = String(text);
  if (el.textContent === text) return;
  const had = el.textContent !== '';
  el.textContent = text;
  if (had) flash(el, 'num-bump', 340);
}
function setCount(c){ setNum(els.get(c.id)?.querySelector('.cnt'), c.n); }
// 새 카드 표시 다시 그리기: 필드 카드 NEW 뱃지 · 콜렉터북 버튼 수
function renderNew(){
  for (const c of S.cards){
    const el = els.get(c.id);
    if (!el) continue;
    const on = S.newCards.includes(c.type), b = el.querySelector('.new-b');
    if (on && !b) el.insertAdjacentHTML('beforeend', '<div class="new-b">NEW</div>');
    if (!on && b) b.remove();
  }
  const badge = document.getElementById('bookBadge');
  badge.hidden = !S.newCards.length;
  if (S.newCards.length) setNum(badge, S.newCards.length);
  else badge.textContent = '';
}
// 처음 본 카드 — 발견 기록 + NEW (v0.9.0: 콜렉터북 끼우기는 콜렉터북을 열 때 한꺼번에)
function discover(type){
  if (S.seen.includes(type)) return;
  S.seen.push(type);
  S.newCards.push(type);
  toast(`✨ 새 카드: ${ic(type)} ${DEFS[type].name}`);
  renderMeta(); renderNew(); renderInsp();                        // v0.18.0: 인스펙터의 ??? 도 바로 풀림
}
function mount(c, anim, from){
  const el = document.createElement('div');
  el.className = `cw framed f-${frameOf(DEFS[c.type])}`;
  el.dataset.id = c.id;
  el.innerHTML = cardHtml(c);
  place(el, c);
  table.appendChild(el);
  els.set(c.id, el);
  if (anim === 'pop' && from){
    el.style.setProperty('--fx', (from.x - c.x) + 'px');
    el.style.setProperty('--fy', (from.y - c.y) + 'px');
  }
  if (anim) flash(el, anim, anim === 'pop' ? 500 : 320);
  return el;
}
const place = (el, c) => { el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; };
function flash(el, cls, ms){
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}
function renderAll(){
  for (const el of els.values()) el.remove();
  els.clear();
  for (const c of S.cards){
    if (!table.hidden){ const p = clampPos(c.x, c.y); c.x = p.x; c.y = p.y; }   // v0.6.0: 숨은 필드에선 당기지 않음
    mount(c);
  }
  renderMeta();
  renderNew();
  renderQuest();

// ── 카드 추가 / 제거 ─────────────────────────────────
// v0.8.0: 이미 있는 종류면 수량만 +1 (카드는 그 자리에서 톡 튐), 없으면 새 카드
function addCard(type, x, y, anim, from, made){
  let c = cardOf(type);
  if (c){
    c.n++;
    setCount(c);
    if (anim) flash(els.get(c.id), 'bump', 300);
  } else {
    const p = findSpot(x, y);
    c = { id: S.nextId++, type, x: p.x, y: p.y, n: 1 };
    S.cards.push(c);
    mount(c, anim, from);
  }
  discover(type);
  return c;
}
function removeCard(id){
  S.cards = S.cards.filter(c => c.id !== id);
  const el = els.get(id);
  els.delete(id);
  if (el){ el.classList.add('gone'); setTimeout(() => el.remove(), 300); }
  if (selected === id) selected = null;
}
// 한 장 쓰기 — 수량 -1, 0이면 카드 사라짐
function useOne(c){
  c.n--;
  if (c.n <= 0) removeCard(c.id);
  else setCount(c);
}
// 여러 장 생성. v0.8.0: 상한 없음 — 있는 종류는 수량 +1
function spawnMany(types, x, y, from, made3s){
  const made = [];
  for (const t of types){
    const c = addCard(t, x, y, 'pop', from, made3s);
    made.push(c);
    if (made3s){ const el = els.get(c.id); el.classList.add('made'); clearTimeout(el._madeT); el._madeT = setTimeout(() => el.classList.remove('made'), 3000); }   // v0.2.2

}

function craftMatch(x, y){
  return usableRecipes(x, y).find(m => CRAFT_RECIPES.includes(m.r)) || null;
}
function craft(drag, tgt, m){
  const r = m.r;
  const a = m.aIsX ? drag : tgt, b = m.aIsX ? tgt : drag;
  const outs = r.cook ? [DEFS[b.type].cooked] : r.out.slice();
  const eaten = [a, b];                                          // v0.9.0: 두 재료 모두 한 장씩 줄어듦 (남는 쪽 없음)
  const from = { x: tgt.x, y: tgt.y };
  for (const c of eaten) useOne(c);
  spawnMany(outs, tgt.x, tgt.y, from, true);                    // v0.2.2: 제작 성공 깜빡임
  if (byId(tgt.id) && els.get(tgt.id)) flash(els.get(tgt.id), 'bump', 300);
  return true;                                                   // 남은 카드는 밀어내기로 비킴
}

// ── 밀어내기 (v0.2.0) ────────────────────────────────
// 겹친 카드끼리 덜 겹친 축으로 서로 밀어냄. 끄는 중인 카드는 밀지도 밀리지도 않음 (조합 대상에 올릴 수 있게)
const PUSH_GAP = 4;                                              // 카드 사이 최소 틈 (px)
const PUSH_RATE = 0.3;                                           // 한 프레임에 겹친 만큼의 몇 배를 풀지
let pushSaveTimer = 0;
function pushStep(){
  if (paused || table.hidden){ requestAnimationFrame(pushStep); return; }   // v0.6.0: 크래프팅 탭이 숨으면 필드 크기가 0이라 멈춤        // v0.4.0: 콜렉터북에 끼우는 동안 멈춤
  const list = S.cards.filter(c => !(drag && drag.moved && drag.c === c));
  const sx = CW + PUSH_GAP, sy = CH + PUSH_GAP;
  const move = new Map();
  const add = (c, x, y) => { const m = move.get(c) || { x: 0, y: 0 }; m.x += x; m.y += y; move.set(c, m); };
  for (let i = 0; i < list.length; i++){
    for (let j = i + 1; j < list.length; j++){
      const a = list[i], b = list[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const px = sx - Math.abs(dx), py = sy - Math.abs(dy);
      if (px <= 0.5 || py <= 0.5) continue;
      const dir = v => v > 0 ? 1 : v < 0 ? -1 : (b.id > a.id ? 1 : -1);
      if (px < py){ add(a, -dir(dx) * px / 2, 0); add(b, dir(dx) * px / 2, 0); }
      else { add(a, 0, -dir(dy) * py / 2); add(b, 0, dir(dy) * py / 2); }
    }
  }
  let moved = false;
  for (const [c, m] of move){
    const p = clampPos(c.x + m.x * PUSH_RATE, c.y + m.y * PUSH_RATE);
    if (Math.abs(p.x - c.x) + Math.abs(p.y - c.y) < 0.05) continue;
    c.x = p.x; c.y = p.y;
    const el = els.get(c.id);
    if (el) place(el, c);
    moved = true;
  }
  if (moved){ clearTimeout(pushSaveTimer); pushSaveTimer = setTimeout(save, 500); }
  requestAnimationFrame(pushStep);
}

// ── 끌기 ────────────────────────────────────────────
let drag = null;
function cardAt(px, py, skip){
  const tr = table.getBoundingClientRect();
  const x = px - tr.left, y = py - tr.top;
  for (let i = S.cards.length - 1; i >= 0; i--){
    const c = S.cards[i];
    if (c.id !== skip && x >= c.x && x <= c.x + CW && y >= c.y && y <= c.y + CH) return c;
  }
  return null;
}
table.addEventListener('pointerdown', e => {
  if (paused) return;
  const el = e.target.closest('.cw');
  if (!el || el.classList.contains('gone')) return;
  const c = byId(+el.dataset.id);
  if (!c) return;
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  drag = { c, el, sx: e.clientX, sy: e.clientY, ox: c.x, oy: c.y, moved: false };
});
table.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved){
    if (Math.hypot(dx, dy) < 6) return;
    drag.moved = true;
    drag.el.classList.add('dragging');
    table.appendChild(drag.el);                                   // 맨 위로
    S.cards = S.cards.filter(c => c !== drag.c).concat(drag.c);
    for (const o of S.cards) if (o !== drag.c && !craftMatch(drag.c.type, o.type)) els.get(o.id)?.classList.add('dim');   // v0.1.1: 안 되면 흐려짐. v0.2.0: 되는 카드는 하이라이트 없음
  }
  const p = clampPos(drag.ox + dx, drag.oy + dy);
  drag.c.x = p.x; drag.c.y = p.y;
  place(drag.el, drag.c);
});
function endDrag(e){
  if (!drag) return;
  const d = drag;
  drag = null;
  d.el.classList.remove('dragging');
  for (const el of els.values()) el.classList.remove('dim');
  if (!d.moved){ select(d.c.id); return; }
  const tgt = e.type === 'pointercancel' ? null : cardAt(e.clientX, e.clientY, d.c.id);   // v0.8.1: 버리기 칸 없앰
  const m = tgt && craftMatch(d.c.type, tgt.type);
  if (m && !craft(d.c, tgt, m)) flash(d.el, 'fail', 1500);     // 겹친 채 놓인 카드는 밀어내기가 벌려 줌
  renderMeta(); renderInsp(); save();
}
table.addEventListener('pointerup', endDrag);

      // v0.18.3: 크리처 전리품도 한 줄 더 (그 크리처에게서 받아 본 것만 그림, 나머지는 실루엣)

// ── 기사 · 원정 (v0.13.0) ───────────────────────────
// 필드 카드를 탭하면 기사가 원정을 떠난다. 가로로 긴 진행 막대 위를 왼쪽 → 오른쪽으로 걸으며
//   도중에 재료를 줍고(크래프팅 탭으로 날아감), 고블린과 싸우고, 끝에는 보스 (보스는 아직 디자인 전)
// 기사는 공 1 · 방 0 · 체 10. 체력이 0이 되면 빈사로 돌아오고, 쉬는 동안 회복된다
// v0.14.0: 고블린 대신 토끼, 보스는 곰 (레거시 world 수치 그대로 — 토끼 체2 공1, 곰 체10 공3)
// loot: [카드, 확률(%), 장수] — v0.15.2: 한 마리에서 **반드시 하나**가 나옴. 확률을 합치면 100
//   송곳니 10% = 보스를 열 번쯤 잡으면 한 번 (보스를 반복해서 잡게 하는 목적)
const ENEMIES = {
  animal: { name:'토끼', portrait:'portrait_animal', atk:1, def:0, hp:2,
    loot: [['meat', 50, 1], ['hide', 30, 1], ['smalltooth', 20, 1]] },
  bear:   { name:'곰',   portrait:'portrait_bear',   atk:3, def:0, hp:10,
    loot: [['meat', 40, 2], ['toughhide', 30, 1], ['smalltooth', 20, 1], ['fang', 10, 1]] },
};
// 기사가 드는 것 — 크래프팅 필드에 있는 무기·방어구 중 가장 센 것을 자동으로 씀 (장착 UI는 아직 없음)
const bestOf = key => Math.max(0, ...CRAFT_TYPES.filter(t => DEFS[t][key] && have(t) > 0).map(t => DEFS[t][key]));
const knightAtk = () => KNIGHT.atk + bestOf('atk');
const knightDef = () => KNIGHT.def + bestOf('def');
const EXP_RUN_MS = 18000;                                        // 끝까지 걷는 시간 (전투 시간 제외)
const FIGHT_BEAT_MS = 700;                                       // 한 번 주고받는 간격
const SEARCH_MS = 1100;                                          // v0.13.4: 채집 포인트를 뒤지는 시간
const HEAL_MS = 3000;                                            // 원정 밖에서 체력 +1
// 원정 일정 — at: 진행도(0~1). loot 재료 줍기 · fight 전투 · boss 마지막
const EXP_PLAN = {
  mountain: [
    { at: 0.16, loot: 1 }, { at: 0.32, fight: 'animal' }, { at: 0.5, loot: 1 },
    { at: 0.66, fight: 'animal' }, { at: 0.84, loot: 1 }, { at: 0.97, fight: 'bear', boss: true },
  ],
};
const planOf = id => EXP_PLAN[id] || EXP_PLAN.mountain;
// v0.18.1: 트랙 양 끝에 여백을 두고 그 안쪽에만 세움 (기사·보스가 가장자리에서 잘리던 것)
const LANE_PAD = 10;                                             // 트랙 좌우 여백 (%)
const laneX = p => LANE_PAD + p * (100 - LANE_PAD * 2);
const SPOT_ICON = { mountain: 'mountain' };                      // v0.13.4: 필드별 채집 포인트 그림 (없으면 산 것)
let exp = null;                                                   // 진행 중 원정 (저장 안 함 — 새로 열면 없음)
let healProg = 0;

function expStart(id, cardEl){
  const st = S.fields[id];
  if (exp){ toast('🏃 기사가 이미 원정 중'); return; }
  if (st.locked){
    flash(cardEl, 'fail', 600);
    toast(`🔒 ${FIELD_BY_ID[id].emoji} ${FIELD_BY_ID[id].name} — 아직 잠겨 있음`);
    return;
  }
  if (S.knight.hp <= 0){
    flash(cardEl, 'fail', 600);
    toast('🩸 기사가 빈사 — 회복될 때까지 기다려야 함');
    return;
  }
  flash(cardEl, 'tap', 300);
  // v0.13.1: 고블린은 길 위에 미리 서 있음 (도착할 때 생기는 것처럼 보이지 않게)
  const foes = planOf(id).filter(e => e.fight).map(e => ({ key: e.fight, at: e.at, hp: ENEMIES[e.fight].hp, dead: false, boss: !!e.boss }));
  // v0.13.4: 채집 포인트도 길 위에 미리 놓임 — 기사가 다다르면 잠시 뒤진다
  const spots = planOf(id).filter(e => e.loot).map(e => ({ at: e.at, done: false }));
  exp = { id, t: 0, phase: 'run', idx: 0, foe: -1, foes, spot: -1, spots, search: 0, beat: 0, line: `${FIELD_BY_ID[id].name} 원정 시작` };
  renderGather(); renderInsp(); save();
}
function expTick(dt){
  if (!exp || paused) return;
  if (exp.phase === 'end') return;
  const plan = planOf(exp.id);
  if (exp.phase === 'run'){
    exp.t = Math.min(1, exp.t + dt / EXP_RUN_MS);
    const ev = plan[exp.idx];
    if (ev && exp.t >= ev.at){
      exp.idx++;
      if (ev.loot){                                               // v0.13.4: 채집 포인트에서 잠시 뒤짐
        exp.spot = exp.spots.findIndex(sp => !sp.done && sp.at === ev.at);
        exp.phase = 'search'; exp.search = 0;
        exp.line = '채집 포인트를 뒤진다';
      }
      else if (ev.fight){
        exp.foe = exp.foes.findIndex(f => !f.dead && f.at === ev.at);
        exp.phase = 'fight'; exp.beat = 0;
        exp.line = ev.boss ? `👑 ${ENEMIES[ev.fight].name}이 길을 막았다` : `${ENEMIES[ev.fight].name}과 마주쳤다`;
        if (ev.boss) toast(`👑 보스 — ${ENEMIES[ev.fight].name}`);
      }
    }
    if (exp.t >= 1){ expEnd('clear'); return; }
  } else if (exp.phase === 'search'){
    exp.search += dt;
    if (exp.search >= SEARCH_MS){
      const sp = exp.spots[exp.spot];
      if (sp) sp.done = true;
      exp.spot = -1;
      exp.phase = 'run';
      expLoot();
    }
  } else if (exp.phase === 'fight'){
    exp.beat += dt;
    while (exp.phase === 'fight' && exp.beat >= FIGHT_BEAT_MS){
      exp.beat -= FIGHT_BEAT_MS;
      expBeat();
    }
  }
  expPaint();
}
// 한 번 주고받기 — 기사가 먼저 친다
function expBeat(){
  const k = S.knight, e = exp.foes[exp.foe], def = ENEMIES[e.key];
  const kd = Math.max(1, knightAtk() - def.def);
  e.hp -= kd;
  expSwing('knight', exp.foe, kd);
  if (e.hp <= 0){
    e.dead = true;
    exp.foe = -1;
    exp.phase = 'run';
    exp.line = `${def.name}을 쓰러뜨렸다`;
    dropLoot(def, exp.foes.indexOf(e));                           // v0.15.0: 확률 전리품
    if (e.boss){                                                  // v0.14.0: 보스를 잡으면 원정 끝
      expEnd('boss');
    }
    return;
  }
  const ed = Math.max(1, def.atk - knightDef());
  k.hp = Math.max(0, k.hp - ed);
  expSwing(exp.foe, 'knight', ed);
  renderKnight();
  save();
  if (k.hp <= 0) expEnd('down');
}
function expEnd(kind){
  const line = kind === 'down' ? '기사가 쓰러져 돌아왔다'
    : kind === 'boss' ? '보스를 쓰러뜨리고 돌아왔다'
    : '원정을 마쳤다';
  if (kind === 'down') toast('🩸 기사 빈사 — 원정 중단');
  exp.phase = 'end';
  exp.foe = -1;
  exp.spot = -1;
  exp.line = line;
  expPaint();
  setTimeout(() => {
    exp = null;
    renderGather(); renderInsp(); save();
  }, 1600);
}
// 전리품 (v0.15.0): 쓰러뜨린 자리에서 확률대로 튀어나와 크래프팅 탭으로 날아감
function dropLoot(def, foeIdx){
  const from = tokOf(foeIdx) || document.querySelector('#exp .tok.knight');
  const r = from ? from.getBoundingClientRect() : gatherEl.getBoundingClientRect();
  const table = def.loot || [];
  if (!table.length) return;
  let roll = Math.random() * table.reduce((sum, l) => sum + l[1], 0);   // v0.15.2: 확률대로 하나를 뽑음 (빈손 없음)
  const hit = table.find(l => (roll -= l[1]) < 0) || table[0];
  const got = Array.from({ length: hit[2] }, () => hit[0]);
  exp.line = `${def.name} — ${got.map(t => DEFS[t].name).join(' · ')}`;
  const key = exp.foes[foeIdx] ? exp.foes[foeIdx].key : null;     // v0.18.2: 이 크리처에게서 받아 봤다고 기록
  if (key){
    const list = S.lootSeen[key] || (S.lootSeen[key] = []);
    let added = false;
    for (const t of got) if (!list.includes(t)){ list.push(t); added = true; }
    if (added){ save(); renderInsp(); }
  }
  got.forEach((t, i) => setTimeout(() => flyToCraft(t, r), i * 260));   // 여러 장이면 차례로
}
// 재료 줍기 — 기사 자리에서 카드가 튀어나와 크래프팅 탭으로 날아감
function expLoot(){
  const pool = CRAFT_TYPES.filter(t => DEFS[t].tier === 1 && DEFS[t].field === exp.id);
  if (!pool.length) return;
  const t = pick(pool);
  const tok = document.querySelector('#exp .tok.knight');
  exp.line = `${DEFS[t].name}을(를) 주웠다`;
  flyToCraft(t, tok ? tok.getBoundingClientRect() : gatherEl.getBoundingClientRect());
  expPaint();
}
function flyToCraft(t, r){
  const fly = document.createElement('div');
  fly.className = `cw framed f-${frameOf(DEFS[t])} fly`;
  fly.innerHTML = `<div class="emoji">${iconHtml(t)}</div><div class="name">${esc(DEFS[t].name)}</div>`;
  fly.style.setProperty('--cw', CW + 'px'); fly.style.setProperty('--ch', CH + 'px');
  document.body.appendChild(fly);
  const sx = r.left + r.width / 2 - CW / 2, sy = r.top + r.height / 2 - CH / 2;
  const ux = sx + (Math.random() - 0.5) * CW * 0.8, uy = r.top - CH * 0.75;
  const tab = document.querySelector('#tabs [data-tab="craft"]').getBoundingClientRect();
  const tx = tab.left + tab.width / 2 - CW / 2, ty = tab.top + tab.height / 2 - CH / 2;
  const at = (x, y, sc, rot) => `translate(${x}px, ${y}px) scale(${sc}) rotate(${rot}deg)`;
  (async () => {
    await fly.animate([                                           // ① 기사 위로 튀어나와 잠시 머묾
      { offset: 0,    transform: at(sx, sy, 0.3, 0), opacity: 0 },
      { offset: 0.45, transform: at(ux, uy - 14, 1.12, -6), opacity: 1, easing: 'ease-out' },
      { offset: 0.7,  transform: at(ux, uy, 1, 0), opacity: 1 },
      { offset: 1,    transform: at(ux, uy, 1, 0), opacity: 1 },
    ], { duration: 680, fill: 'forwards' }).finished;
    if (!S.seen.includes(t)){                                     // ② 새 카드면 발견 (NEW 뱃지·콜렉터북 수)
      discover(t);
      renderGather(); save();
    }
    await fly.animate([                                           // ③ 작아지며 크래프팅 탭으로
      { transform: at(ux, uy, 1, 0), opacity: 1 },
      { transform: at(tx, ty, 0.18, 20), opacity: 0.4 },
    ], { duration: 620, easing: 'cubic-bezier(.5,0,.75,.3)', fill: 'forwards' }).finished;
    fly.remove();
    flash(document.querySelector('#tabs [data-tab="craft"]'), 'catch', 350);
    const { w, h } = bounds();
    addCard(t, w * (0.25 + Math.random() * 0.5) - CW / 2, h * (0.3 + Math.random() * 0.4) - CH / 2, S.tab === 'craft' ? 'spawn' : null);
    renderMeta(); save();
  })();
}
// 트랙 만들기 (원정이 시작·끝날 때) / 그리기 (매 틱)
function expBuild(){
  const el = document.getElementById('exp');
  if (!el) return;
  el.hidden = !exp;
  if (!exp){ el.innerHTML = ''; return; }
  el.innerHTML = '<div class="exp-lane">'
    + exp.spots.map((sp, i) => `<div class="spot${sp.done ? ' done' : ''}" data-spot="${i}" style="left:${laneX(sp.at)}%">`
        + `<img src="images/icon/fx_spot-${SPOT_ICON[exp.id] || 'mountain'}.png" alt="채집 포인트" draggable="false"></div>`).join('')
    + '<div class="bar"></div>'
    // v0.13.1: 고블린은 처음부터 제자리에 서 있음
    + exp.foes.map((f, i) => `<div class="tok enemy${f.boss ? ' boss' : ''}${f.dead ? ' dead' : ''}" data-foe="${i}" style="left:${laneX(f.at)}%">`
        + `<div class="hp"></div><img class="pic" src="images/portrait/${ENEMIES[f.key].portrait}.png" alt="${ENEMIES[f.key].name}" draggable="false"></div>`).join('')
    + '<div class="tok knight walk"><div class="hp"></div><img class="pic" src="images/portrait/portrait_knight.png" alt="기사" draggable="false"></div>'
    + '</div><div class="exp-line"></div>';
  expPaint();
}
// v0.17.3: 트랙 위 둥근 상자 안에 공격 · 방어 · 체력
// v0.17.4: 두 줄 — 윗줄 공격·방어, 아랫줄 체력
const statBox = (atk, def, hp, max) =>
  `<span class="ln"><span>${statImg('atk')}${atk}</span><span>${statImg('def')}${def}</span></span>`
  + `<span class="ln hp-n">${statImg('hp')}${hp}/${max}</span>`;
function expPaint(){
  const el = document.getElementById('exp');
  if (!el || !exp || !el.firstChild) return;
  const lane = el.querySelector('.exp-lane');
  lane.querySelector('.bar').style.width = (exp.t * 100) + '%';
  const kt = lane.querySelector('.tok.knight');
  // v0.13.5: 기사 위치를 고블린·채집 포인트와 같은 눈금(0~100%)으로 맞추고, 대상보다 조금 앞(왼쪽)에 서게
  const stop = exp.foe >= 0 ? 6 : exp.phase === 'search' ? 5 : 2.5;
  kt.style.left = Math.max(3, laneX(exp.t) - stop) + '%';         // v0.18.1: 여백 안쪽에서만 움직임
  kt.classList.toggle('walk', exp.phase === 'run');                // v0.13.2: 걸을 때만 들썩
  kt.classList.toggle('dig', exp.phase === 'search');              // v0.13.4: 뒤지는 중
  for (const sp of lane.querySelectorAll('.spot')){                // v0.13.4: 채집 포인트
    const i = +sp.dataset.spot;
    sp.classList.toggle('done', exp.spots[i].done);
    sp.classList.toggle('searching', exp.spot === i);
  }
  kt.querySelector('.hp').innerHTML = statBox(knightAtk(), knightDef(), S.knight.hp, KNIGHT.hp);   // v0.17.3: 공·방·체력
  for (const et of lane.querySelectorAll('.tok.enemy')){          // v0.13.1: 미리 서 있는 고블린들
    const f = exp.foes[+et.dataset.foe];
    et.classList.toggle('dead', f.dead);
    et.classList.toggle('now', exp.foe === +et.dataset.foe);
    const ed = ENEMIES[f.key];
    et.querySelector('.hp').innerHTML = f.dead ? '' : statBox(ed.atk, ed.def, Math.max(0, f.hp), ed.hp);
  }
  el.querySelector('.exp-line').textContent = exp.line || '';
}
// 한 대 — 때린 쪽은 앞으로 돌진(0.3초), 맞은 쪽은 빨갛게(0.3초) + 피해 숫자 (레거시 world 던전과 같음)
const tokOf = who => document.querySelector(who === 'knight' ? '#exp .tok.knight' : `#exp .tok.enemy[data-foe="${who}"]`);
function expSwing(from, to, dmg){
  const a = tokOf(from), b = tokOf(to);
  if (a) flash(a, 'atk', 300);
  if (b){
    flash(b, 'hurt', 300);
    const f = document.createElement('div');
    f.className = 'dmg';
    f.textContent = `-${dmg}`;
    f.style.left = b.style.left || '5%';
    f.style.bottom = 'calc(var(--ch) * .7)';
    b.parentElement.appendChild(f);
    setTimeout(() => f.remove(), 1000);
  }
}
// 기사 줄의 체력만 고침
function renderKnight(){
  if (S.tab !== 'gather') return;
  const k = S.knight, row = gatherEl.querySelector('.kstat');
  if (!row) return;
  row.querySelector('.khp').innerHTML = `${statImg('hp')}${k.hp}/${KNIGHT.hp}`;
  row.querySelector('.khp').classList.toggle('down', k.hp <= 0);
  row.querySelector('.hpbar i').style.width = (k.hp / KNIGHT.hp * 100) + '%';
  if (knightPick) renderInsp();
}
// 쉬는 동안 회복 (원정 중엔 안 됨)
function healTick(dt){
  if (exp || paused || S.knight.hp >= KNIGHT.hp){ healProg = 0; return; }
  healProg += dt;
  while (healProg >= HEAL_MS && S.knight.hp < KNIGHT.hp){
    healProg -= HEAL_MS;
    S.knight.hp++;
    renderKnight();
    save();
  }
}

// ── 퀘스트 (v0.9.0) ─────────────────────────────────
// v0.16.1: 퀘스트가 없으면 줄 자체를 숨겨 자리를 차지하지 않음. 여러 개면 한 줄씩 쌓이고, 많으면 UI 높이의 40%까지만 쓰고 스크롤
function renderQuest(){
  const el = document.getElementById('quest');
  const list = S.quests || [];
  el.hidden = !list.length;
  if (!list.length){ el.innerHTML = ''; return; }
  const rows = [...el.querySelectorAll('.q-row')];
  if (rows.length !== list.length){
    el.innerHTML = list.map(() => '<div class="q-row"><span class="q-tag">📜</span><b class="q-name"></b><span class="q-text"></span><span class="q-n"></span></div>').join('');
  }
  list.forEach((q, i) => {
    const row = el.children[i], def = QUESTS[q.id];
    row.classList.toggle('done', q.done);
    row.querySelector('.q-name').textContent = def.name;
    row.querySelector('.q-text').textContent = q.done ? '완료' : def.text;
    setNum(row.querySelector('.q-n'), `${Math.min(q.n, def.goal)}/${def.goal}${q.done ? ' ✓' : ''}`);
  });
}
function questStep(id){
  const q = (S.quests || []).find(q => q.id === id && !q.done);
  if (!q) return;
  const def = QUESTS[q.id];
  q.n++;
  if (q.n >= def.goal){
    q.done = true;
    toast(`📜 퀘스트 완료: ${def.name}`);
  }
  renderQuest();
  save();
}
// 퀘스트 주기 — 같은 퀘스트가 이미 있으면 그대로 (주는 캐릭터는 아직 없음)
function giveQuest(id){
  if (!QUESTS[id] || (S.quests || []).some(q => q.id === id)) return;
  S.quests.push(newQuest(id));
  const el = document.getElementById('quest');
  renderQuest();
  flash(el, 'q-new', 520);
  toast(`📜 새 퀘스트: ${QUESTS[id].name}`);
  save();
}

// ── 시작 ────────────────────────────────────────────
document.getElementById('ver').textContent = VERSION;
// v0.16.0: 설정 패널 (⚙) — 발견 수 · 처음부터 · 버전
const setPan = document.getElementById('setpan');
document.getElementById('setBtn').addEventListener('click', e => {
  e.stopPropagation();
  setPan.hidden = !setPan.hidden;
  document.getElementById('setBtn').classList.toggle('on', !setPan.hidden);
});
document.addEventListener('click', e => {
  if (setPan.hidden || e.target.closest('#setpan') || e.target.closest('#setBtn')) return;
  setPan.hidden = true;
  document.getElementById('setBtn').classList.remove('on');
});
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('처음부터 다시 시작할까요?')) return;
  if (paused) return;
  exp = null; knightPick = false;                                 // v0.13.0: 하던 원정도 끊음
  S = fresh(); selected = null; fieldPick = null; renderAll(); setTab(S.tab); save();   // v0.9.0: 처음부터는 채집 탭에서
});
addEventListener('resize', () => { measure(); renderAll(); });
measure();
if (!S.tab) S.tab = 'gather';
renderAll();
setTab(S.tab);
requestAnimationFrame(pushStep);
setInterval(gameTick, 100);
</script>
</body>
