<style>

  /* 월드 타임라인 — 체력 · 경험치 줄 아래. 잡몹이 풀리는 때(그림) · 엘리트(회색 마름모 — 등급 색은 나온 뒤에) · 보스(큰 그림, 등급 색 고리) */
  #timeline{position:relative;margin:0 4px;height:40px;pointer-events:none}

  /* 보스 줄 자리는 늘 두 줄(중간 + 최종 보스) 비워 둔다 — 보스가 나오고 죽어도 위 칸 높이 · 게임 칸이 안 바뀐다 */
  /* 보스 등장 · 알림 글 (0.108.0): 게임 칸을 가리지 않게 위쪽 타임라인 위에 덮어 띄운다 (타임라인 안 · 같은 크기) */
  /* 보스 등장 연출: 작은 얼굴 + '중간 보스 · 이름 등장!' 이 커지며 나타났다 사라진다 (2.8초) */

  /* 레벨업 카드 안: 받는 무기 한 줄 — 그림(높이 21px) · 이름 + 지금→다음 (검은 상자 · 흰 글씨) */

<script>
'use strict';

const VERSION = '0.113.0';

// ───── 설정 ─────

const FACE = {survivor: false, police: false, firefighter: false, scientist: false, shaman: false, zombie: true, dog: true, brute: false, bossmid: false, bossking: false, crawler: false, riot: false,
  spitter: false, grenadier: true, shielder: true, bloater: false, bossmortar: false, bossgeneral: false};
// 현대물 — 도심의 좀비들. faceLeft: 그림이 왼쪽을 보면 true (오른쪽으로 갈 때 뒤집음)
// r = 크기 등급: 잡몹은 모두 15 (그림 넓이가 같다). 엘리트 ×1.3, 보스는 BOSSES 의 r
// wt = 무게: 넉백으로 밀리는 거리 = 넉백 ÷ 무게 (좀비 1 기준)
const ENEMY_TYPES = {
  zombie: {nm: '좀비',      hp: 120, def: 0, wt: 1, spd: 70,  dmg: 80,  r: 15, xp: 1, w: 10, color: '#7a9a6a', faceLeft: FACE.zombie},
  dog:    {nm: '들개',      hp: 60,  def: 0, wt: 0.6, spd: 135, dmg: 50,  r: 15, xp: 1, w: 6,  color: '#8a6a4a', faceLeft: FACE.dog},
  brute:  {nm: '거구 좀비', hp: 700, def: 30, wt: 2.5, spd: 42,  dmg: 180, r: 15, xp: 5, w: 2,  color: '#888',    faceLeft: FACE.brute},
  crawler:{nm: '기는 좀비', hp: 60,  def: 0, wt: 0.8, spd: 85,  dmg: 50,  r: 15, xp: 1, w: 8,  color: '#7a8a6a', faceLeft: FACE.crawler},   // 작고 조금 빠름 · 많이
  riot:   {nm: '진압 경찰 좀비', hp: 400, def: 60, wt: 1.5, spd: 50, dmg: 140, r: 15, xp: 4, w: 3, color: '#445',   faceLeft: FACE.riot},      // 방어 60 — 피해 −38% (0.76.0, 그 전엔 뺄셈이라 약한 연사를 다 막음)

  //   shot: 곧게 날아가는 탄 (지금 자리를 겨눔) · lob: 곡사 — 주인공의 이동 방향 · 빠르기로 떨어질 자리를 앞질러 겨눔 (빨간 원 예고)

  //   burst: 죽으면 그 자리에 T 초 예고 원 → 터져 주인공에게 피해
  spitter:  {nm: '침 좀비',     hp: 90,  def: 0, wt: 0.8, spd: 65, dmg: 60,  r: 15, xp: 2, w: 5, color: '#7a6', faceLeft: FACE.spitter,
             shot: {range: 170, cd: 2.4, spd: 115, dmg: 70, r: 6, col: '#ff4a3a'}},   // 0.85.2: 탄속 230 → 115 · 앞질러 겨눔
  grenadier:{nm: '수류탄 좀비', hp: 150, def: 0, wt: 1, spd: 55, dmg: 70,  r: 15, xp: 3, w: 3, color: '#675', faceLeft: FACE.grenadier,
             lob: {range: 210, cd: 3.2, T: 1.1, aoe: 42, dmg: 130}},
  shielder: {nm: '방패 좀비',   hp: 200, def: 0, wt: 2, spd: 38, dmg: 120, r: 15, xp: 4, w: 3, color: '#a44', faceLeft: FACE.shielder, shield: 25},
  bloater:  {nm: '부푼 좀비',   hp: 160, def: 0, wt: 1.5, spd: 48, dmg: 100, r: 15, xp: 3, w: 3, color: '#cc6', faceLeft: FACE.bloater,
             burst: {T: 0.7, aoe: 70, dmg: 160}},
};
const SHIELD_COL = '#6cf';            // 방패 횟수 표시 색 (방어 DEF_COL 과 다르게)
const ELITE_SHIELD = 2;               // 엘리트 방패 횟수 배율
// 엘리트: 그 시점 잡몹 하나를 키운다 (1.3배 · 등급 색 테두리 깜빡임)
const ELITE = {size: 1.3, hp: 10, dmg: 1.5, xp: 12, wt: 2, spd: 1.15};   // wt: 무게 ×2 · spd: 지금 나오는 잡몹 중 가장 빠른 것(흔들림 최대 ×1.1)보다 ×1.15 (0.81.0 — 무리에 묻히지 않게)
// 엘리트 등급 (0.73.0): 판마다 무작위 — 등장 확률(w)과 경험치 배율(xp). 일반(0)과 태고(5, 최종 보스)는 안 나옴
const ELITE_GRADES = [{g: 1, w: 50, xp: 1}, {g: 2, w: 30, xp: 1.5}, {g: 3, w: 15, xp: 2.5}, {g: 4, w: 5, xp: 4}];
const eliteXpMul = g => (ELITE_GRADES.find(q => q.g === g) || {xp: 1}).xp;
function rollEliteGrade() {
  let r = Math.random() * ELITE_GRADES.reduce((a, q) => a + q.w, 0);
  for (const q of ELITE_GRADES) if ((r -= q.w) <= 0) return q.g;
  return ELITE_GRADES[0].g;
}
// 보스 — 그림 sprite = images/portrait_<sprite>.png (make_character_sheet --only full, seed 1601 · 1602). pats: 특수 패턴 차례 (돌진 · 범위 · 부르기)
//   돌진: 0.8초 붉은 띠로 예고 → 그 방향으로 빠르게 · 범위: 1초 붉은 원 예고 → 원 안이면 큰 피해 · 부르기: 둘레에 잡몹
const BOSSES = {
  mid:   {nm: '거구 우두머리', sprite: 'bossmid', grade: 3, fightT: 30, def: 40, wt: 5, spd: 55, dmg: 220, r: 44, xp: 60,
          pats: ['charge'], gap: 3.2},
  final: {nm: '도심의 왕',     sprite: 'bossking', grade: 5, fightT: 60, def: 60, wt: 8, spd: 60, dmg: 300, r: 58, xp: 0,
          pats: ['charge', 'slam', 'summon', 'slam'], gap: 2.6, final: true},
  // 월드 2 (0.84.0) — lob: 앞질러 겨눈 자리 둘레에 수류탄 LOB_N 발 · volley: 부채꼴 탄 VOL_N 발을 VOL_W 번
  mortar:  {nm: '포격 하사',   sprite: 'bossmortar', grade: 3, fightT: 30, def: 40, wt: 5, spd: 55, dmg: 220, r: 44, xp: 60,
            pats: ['lob', 'charge'], gap: 3.0},
  general: {nm: '기지의 장군', sprite: 'bossgeneral', grade: 5, fightT: 60, def: 60, wt: 8, spd: 60, dmg: 300, r: 58, xp: 0,
            pats: ['volley', 'lob', 'summon', 'slam'], gap: 2.6, final: true},
};
const LOB_N = 5, LOB_T = 1.2, LOB_AOE = 50, LOB_DMG = 180;
// 수류탄 비 배치 (0.85.1): 가운데 하나 + 둘레 LOB_N-1 개를 고르게. 원끼리 LOB_GAP 이상 띄워 사이로 빠져나갈 틈 (주인공 지름 28)
const LOB_GAP = 40, LOB_RING = 2 * LOB_AOE + LOB_GAP;   // 가운데 ↔ 둘레 중심 거리 140 — 둘레끼리는 이보다 멀다 (4개면 198)
// 부채꼴 탄 (0.85.2): 5발을 0.45 라디안(26°) 간격 — 120px 거리에서 탄 사이 틈 40px. 번마다 반 칸씩 엇갈려 쏴 틈이 옮겨 다님
const VOL_N = 5, VOL_W = 3, VOL_GAP = 0.3, VOL_ARC = 1.8, VOL_SPD = 250, VOL_DMG = 120;
// 보스 체력 = '기준 빌드' 가 그 보스를 fightT 초에 잡는 양 (docs/보스_체력.md)
//   기준 레벨 = 그 보스가 나오는 때의 완벽 플레이 레벨 × BOSS_LV_PCT (지금 75%) — 이 퍼센트로 난이도를 조절한다
//   기준 빌드 = 권총 하나 · 레벨업의 절반을 공격력 · 공격속도에 번갈아 (나머지는 체력 · 사거리 같은 데) · 보스 방어 뺀 단일 대상 DPS
const BOSS_LV_PCT = 0.75;

// 적 체력 · 방어는 시간이 가도 그대로 (0.27.3 — 그 전엔 분당 체력 +45% · 방어 +1.5). 어려움은 나오는 수 · 엘리트 · 보스로
// 받는 피해 = 공격력 - 방어력, 그래도 최소 1 (플레이어 · 적 같은 규칙)
const armor = (dmg, def) => Math.max(1, dmg - def);            // 주인공이 받는 피해: 뺄셈 (최소 1)
// 몹 · 보스가 받는 피해 (0.76.0): 비율로 깎는다 — 방어 30 = −23%, 60 = −38%, 100 = −50%. 그 전엔 뺄셈이라 한 발 약한 무기(기관총 · 레이저 · 부메랑)는 1만 들어갔다
const mobArmor = (dmg, def) => dmg * 100 / (100 + (def || 0));
const MAX_ENEMIES = 500;
const TRAIT_MAX = 10;             // 특성 보조 최대 단계 (0.100.0, 그 전 5) — 부여 1 + 강화 9

const MAG_IMG = new Image(); MAG_IMG.src = `images/item_magdrop.png?v=${VERSION}`;   // 자석 (0.106.0, make_item seed 3901) — 보조 그림을 바닥에도
const MAGDROP_P = 0.005;   // 자석 떨굴 기본 확률 (적 하나마다)
// 가변 출현율 (0.107.0): 못 떨군 처치마다 확률이 오름. 3배(MAGDROP_MAX)에 이르면 100%. 떨구면 처음으로
//   0.107.1: 곧게 말고 끝으로 갈수록 가파르게 — 확률 = 기본 × (1 + 2 × (못 떨군 수 ÷ MAGDROP_N)²). MAGDROP_N 마리째에 3배 → 100%
const MAGDROP_N = 400, MAGDROP_MAX = 3;
const magDropP = n => { const k = 1 + (MAGDROP_MAX - 1) * (n / MAGDROP_N) ** 2; return k >= MAGDROP_MAX ? 1 : MAGDROP_P * k; };

// 그림 둘레 빈칸을 잘라낸다 → 적은 이 잘린 그림의 넓이로 크기를 맞춘다 (drawSprite byArea)
function trimSprite(img) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const a = g.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (a[(y * c.width + x) * 4 + 3] > 8) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) return img;
  const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return o;
}

const INF = '<span class="inf">∞</span>';
function badgeVal(id, st) {
  switch (id) {
    case 'dmg': return num(st.dmg);
    case 'cd': return num(st.cd) + 's';
    case 'mag': return st.mag;
    case 'reload': return num(st.reload) + 's';
    case 'stun': return num(st.stun) + 's';
    case 'range': return Math.round(st.range);
    case 'acc': return '±' + num(st.acc) + '°';
    case 'spd': return Math.round(st.spd);
    case 'chain': return st.chain;
    case 'spread': return st.shields || st.count;            // 방패는 방패 수
    case 'burst': return st.burst;
    case 'knock': return st.knock ? (st.knock > 0 ? '+' : '−') + Math.round(knockV(Math.abs(st.knock)) / 8) : 0;
    case 'splash': return st.splash ? `${splashR(st.splash)}·${Math.round(splashPct(st.splash) * 100)}%` : 0;
    case 'hp': return st.hp;
    case 'def': return st.def;
    case 'move': return Math.round(st.move);
    case 'regen': return st.regen + '/s';
    case 'magnet': return Math.round(st.magnet);
    case 'xpmul': return Math.round(st.xpMul * 100) + '%';
    case 'crit': return Math.round(st.crit * 100) + '%';
    case 'critdmg': return '×' + num(st.critDmg);
    case 'pierce': return st.pierce || INF;                            // 한 발이 맞히는 적 수 (없으면 지나는 길의 적 모두)
  }
  return null;

//   단일 DPS = 피해 × mag ÷ 한 바퀴 (평균) — 이것으로 비교 DPS 를 맞춘다
const DPS_REF = 100;   // 0.44.0 수치 10배 (그 전 10)
const RELOAD_K = 5, RELOAD_MIN = 1.5;
// 부메랑 길 (0.62.0 — 베지어 고리): 손에서 나가 사거리 끝(겨눈 쪽 정면)을 돌아 손으로 오는 고리. 가는 길은 한쪽(+), 오는 길은 반대쪽(−)으로 부푼다.
//   손에서 본 비낀 각은 사거리 중간쯤에서 발사각(acc)만큼으로 가장 크고, 사거리 끝에서는 0° — 끝은 옆으로 둥글게 돌아 원을 그리듯 꺾인다.
//   가는 길 = 3차 베지어 P0 손 · P1 = (0.2R, 0) 겨눈 쪽 곧게 · P2 = (R, c) 끝 옆 · P3 = 끝 (R, 0). 오는 길은 위아래 뒤집어 거꾸로.
//   이 꼴이면 비낀 각이 사거리 0.5 쯤에서 가장 크다 — c 는 그 가장 큰 각이 acc 가 되게 반으로 나눠 찾는다.
//   길은 주인공 손을 따라 움직이고 (던질 때 겨눈 방향은 고정), 늘 탄속으로 길이를 따라 나아간다. 끝까지 가면 손에 잡힘
const BOOM = {rehit: 0.5, seg: 24, anchor: 0.4};   // anchor: 고리의 이만큼(길이 비율)까지는 던진 자리 기준, 그 뒤 끝까지 손 기준으로 옮겨 감 (0.68.0)   // 같은 적 다시 베기(초) · 베지어 한 쪽을 몇 토막으로 펴는가
const BOOM_PATHS = new Map();
function boomPath(R, acc) {           // 지역 좌표 (x = 겨눈 쪽, y = 옆) 꺾은선 + 누적 길이
  const key = Math.round(R) + '|' + acc.toFixed(2);
  if (BOOM_PATHS.has(key)) return BOOM_PATHS.get(key);
  const P = [[0, 0], [0.2 * R, 0], [R, 0], [R, 0]];
  const bz = (t, k) => (1 - t) ** 3 * P[0][k] + 3 * (1 - t) ** 2 * t * P[1][k] + 3 * (1 - t) * t * t * P[2][k] + t ** 3 * P[3][k];
  const peak = () => { let m = 0; for (let i = 1; i < 100; i++) { const t = i / 100; m = Math.max(m, Math.atan2(bz(t, 1), bz(t, 0))); } return m; };
  let lo = 0, hi = 2 * R; const al = acc * Math.PI / 180;
  for (let n = 0; n < 30; n++) { P[2][1] = (lo + hi) / 2; if (peak() < al) lo = P[2][1]; else hi = P[2][1]; }
  const pts = [];
  for (let i = 0; i <= BOOM.seg; i++) { const t = i / BOOM.seg; pts.push([bz(t, 0), bz(t, 1)]); }        // 가는 길 (+ 쪽)
  for (let i = BOOM.seg - 1; i >= 0; i--) { const t = i / BOOM.seg; pts.push([bz(t, 0), -bz(t, 1)]); }    // 오는 길 (− 쪽, 거꾸로)
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const r = {pts, cum, L: cum[cum.length - 1]};
  BOOM_PATHS.set(key, r);
  return r;
}
// 서서 던졌을 때 날아갔다 돌아오는 시간 = 고리 길이 ÷ 탄속 — DPS 맞춤용
const boomFlight = (range, spd, acc = 0) => boomPath(range, acc).L / spd;

function saveRec() {

  if (G.mode === 'clear') r.clear = true;
  localStorage.setItem(recKey(G.world.id), JSON.stringify(r));
  return `생존 <b>${fmt(G.t)}</b>${nt ? ' (신기록)' : ''} · 처치 <b>${G.kills}</b>${nk ? ' (신기록)' : ''} · 레벨 <b>${G.lv}</b><br>
    <span class="hint">${G.world.name} 최고 기록 — 생존 ${fmt(r.t)} · 처치 ${r.kills}</span>`;

// 출발 보조 (0.102.0): 무기를 고른 뒤 보조도 무작위 3개 중 하나 — 특성 보조 · 기능형(주사위 · 봉인 부적) 모두.
//   특성 보조는 고른 무기가 받을 수 있는 것만 후보. 카드 밑에 받는 무기 줄 (상자 카드와 같음)

  G = {char: C, weapons: [newWeapon(wid)], s: newStats(C), tl: newTl(), ups, subs: [], banned: new Set()};   // 후보 · 카드 값 계산용 (그리기 전에 되돌림)
  const pool = UPGRADES.filter(u => u.sub && subOk(u)); pickSubs = [];   // 고른 무기에 효과 있는 것만 (부여 · 강화 · 기능형 모두)

function newGame(wi, weaponId, subId) {
  const C = CHARACTERS[charIdx];

  G = {

    elites: WORLDS[wi].elites.map(ev => ({at: ev.at, grade: rollEliteGrade()})),   // 이번 판 엘리트 등급 (타임라인에 미리 보임)
    mode: 'play', t: 0, kills: 0, lv: 1, xp: 0, pendingLv: 0,

  ['worldSel', 'charSel', 'wpnSel', 'subSel', 'over', 'clear', 'levelup', 'pause'].forEach(id => $(id).hidden = true);

// ───── 입력 ─────
const keys = {};

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Backquote' && !e.repeat) { document.body.classList.toggle('dbg'); return; }   // 능력치 디버그 글
  if (e.code === 'KeyI' && !e.repeat) { $('info').hidden ? openInfo() : closeInfo(); return; }      // 정보 창
  if (!$('info').hidden && e.code === 'Escape') { closeInfo(); return; }
  if (e.code === 'KeyE' && !e.repeat && $('info').hidden) { $('foes').hidden ? openFoes() : closeFoes(); return; }   // 적 창 (0.85.0)
  if (!$('foes').hidden && e.code === 'Escape') { closeFoes(); return; }
  for (const b of BOOKS) if (!$(b).hidden && e.code === 'Escape') { closeBook(b); return; }
  const scr = navSync();
  if (scr) {                                                    // 선택 창: 방향키 · WASD 로 테두리, Enter · Space 로 결정
    const d = {ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', KeyA: 'L', KeyD: 'R', KeyW: 'U', KeyS: 'D'}[e.code];
    if (d) { e.preventDefault(); if (!(scr === 'levelup' && e.repeat)) navStep(d); }   // 레벨업: 누르고 있던 이동 키는 무시
    if (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') { e.preventDefault(); if (!e.repeat) navConfirm(); return; }
  }
  if (!G) {                                                     // 월드 · 캐릭터 · 무기 선택: 숫자 1~9
    const dg = /^(Digit|Numpad)([1-9])$/.exec(e.code), i = dg ? +dg[2] - 1 : undefined;
    if (!$('subSel').hidden) { if (pickSubs[i]) newGame(pickWi, pickWid, pickSubs[i]); else if (e.code === 'Escape') backToWpn(); }
    else if (!$('wpnSel').hidden) { if (pickWpns[i]) showSubPick(pickWpns[i]); else if (e.code === 'Escape') showChars(); }
    else if (!$('charSel').hidden) { if (pickChars[i] != null) pickChar(pickChars[i]); else if (e.code === 'Escape') showWorlds(); }
    else if (WORLDS[i]) pickWorld(i);
    return;
  }
  if (G.mode === 'levelup') {
    const i = {Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2}[e.code];   // 이동 키(WASD)와 겹치지 않게 숫자
    if (i !== undefined && !e.repeat) choose(i);
    else if (e.code === 'KeyR' && !e.repeat) rerollPicks();
    else if (e.code === 'KeyB' && !e.repeat) toggleBan();
  } else if (G.mode === 'over' || G.mode === 'clear') {
    if (e.code === 'KeyR') newGame(G.wi);
    else if (e.code === 'KeyN' && G.mode === 'clear' && WORLDS[G.wi + 1]) newGame(G.wi + 1);
    else if (e.code === 'Escape') showWorlds();
  } else if (e.code === 'KeyP' || e.code === 'Escape') {
    togglePause();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
// 창을 벗어나면 멈추고, 돌아오면 다시 간다. P 로 직접 멈춘 것은 돌아와도 그대로
addEventListener('blur', () => { for (const k in keys) keys[k] = false; joy.id = null; if (G && G.mode === 'play') { togglePause(); G.autoPaused = true; } });
addEventListener('focus', () => { if (G && G.mode === 'pause' && G.autoPaused) togglePause(); });
$('pauseBtn').onclick = e => { e.currentTarget.blur(); if (G) togglePause(); };

function gradeInfo(g) {

              ...Wd.bosses.filter(e => BOSSES[e.id].grade === g).map(e => [e.at, BOSSES[e.id].nm])].sort((a, b) => a[0] - b[0]);
  return [...s, ...ev.map(([at, nm]) => `${fmt(at)} ${nm}`)].join(' · ');

  G.pickKind = 'lv'; G.pickUse = {reroll: 0, ban: 0}; G.banMode = false;
  showPicks(levelPicks(), '레벨 업!');
}
// 고르기 창 — 레벨업과 상자가 같이 쓴다 (둥근 메뉴 · 키 · 탭이 그대로 붙는다)
function showPicks(picks, title, keep) {
  G.choices = picks;
  G.mode = 'levelup';
  if (!keep) G.inputLock = 0.35;                                // 봉인 고르기로 다시 그릴 땐 잠그지 않음
  $('luTitle').textContent = title;
  const box = $('cards'); box.innerHTML = '';
  picks.forEach((u, i) => {
    const d = document.createElement('div');
    const banned = G.banned.has(u.id);                          // 봉인됨 (0.102.1): 다른 것으로 채우지 않고 자리에 남겨 막음
    d.className = 'up' + (banned ? ' banned' : G.banMode ? ' banning' : '');
    if (banned) d.disabled = true;
    const lv = G.ups[u.id] || 0;
    // 업그레이드 단계 = 칸: 채운 칸(찍은 횟수) + 깜빡이는 칸(이번에 찍을 것) + 빈 칸(남은 것). 끝없는(99) 것은 빈 칸 없이
    // 새 무기 = 무기 슬롯 칸 (가진 무기 수 + 깜빡이는 새 칸)
    d.innerHTML = `<div class="key">${i + 1}</div><div class="nm">${u.sub || u.nm}</div>${u.sub ? `<div class="sublbl">${!G.subs.some(x => x.id === u.id) ? '새 보조 · ' + (u.give ? '특성 부여' : '기능') : '보조 강화'}</div>` : u.tup ? '<div class="sublbl">특성 강화</div>' : u.wup ? '<div class="sublbl">무기 강화</div>' : ''}
      ${u.newWeapon ? pipsHtml(G.weapons.length, G.char.wSlots) : u.axis ? axisHtml(u) : u.tup ? pipsHtml(G.tl[u.tup], TRAIT_MAX) : pipsHtml(lv, u.max < 99 ? u.max : Infinity)}
      ${u.newWeapon ? `<div class="wimg"><img src="images/weapon_${u.newWeapon}.png?v=${VERSION}" alt=""></div>` + wpnInfoHtml(WEAPONS[u.newWeapon], wstat(u.newWeapon))
        : u.wup ? `<div class="wimg"><img src="images/weapon_${u.wup}.png?v=${VERSION}" alt=""></div>` + wupHtml(u.wup)
        : (u.sub || u.tup ? `<div class="wimg"><img src="images/item_${u.tup ? 'give_' + u.tup : u.id}.png?v=${VERSION}" alt="" onerror="this.parentNode.remove()"></div>` : '') + upHtml(u)}`;   // 특성 강화 = 그 특성 인장 그림 (0.104.0)
    if (banned) d.insertAdjacentHTML('beforeend', '<div class="banTag">봉인됨<br>이번 게임 동안 출현하지 않음</div>');
    else d.onclick = () => choose(i, true);
    box.appendChild(d);
  });
  // 행운 주사위 · 봉인 부적 단추 (가진 것만)
  const nR = usesLeft('reroll', 'reroll'), nB = usesLeft('banish', 'ban');   // 남은 횟수를 단추에
  $('luBtns').innerHTML = (hasSub('reroll') ? `<button id="rerollBtn"${nR > 0 ? '' : ' disabled'}>다시 뽑기 ${nR} (R)</button>` : '')
    + (hasSub('banish') ? `<button id="banBtn" class="${G.banMode ? 'on' : ''}"${nB > 0 || canUnban() ? '' : ' disabled'}>${G.banMode ? '봉인 취소' : canUnban() ? '봉인 해제' : '봉인 ' + nB} (B)</button>` : '');
  if ($('rerollBtn')) $('rerollBtn').onclick = e => { e.stopPropagation(); rerollPicks(); };
  if ($('banBtn')) $('banBtn').onclick = e => { e.stopPropagation(); toggleBan(); };
  $('luHint').textContent = G.banMode ? '봉인할 것을 고르세요' : '1 · 2 · 3 또는 클릭';
  $('levelup').hidden = false;
  // 판 중 누르고 있던 손가락은 메뉴로 잇지 않는다 — 새로 눌러 끌어야 열린다 (0.11.4)
}

// 무기 강화 카드 (0.101.0): 오르는 능력치마다 지금 → 다음
function wupHtml(id) {
  const W = WEAPONS[id], w = G.weapons.find(x => x.id === id), ids = ['dmg', ...(W.cd ? ['cd'] : []), ...(W.reload ? ['reload'] : []), 'range'];
  const a = wstat(id); w.lv++; const b = wstat(id); w.lv--;
  return `<div class="stats">${ids.map(k => statHtml(k, `${badgeVal(k, a)} → ${badgeVal(k, b)}`)).join('')}</div>`;
}
// 업그레이드 카드: 바뀌는 뱃지 + 늘어나는 양(fx) → 숫자로 지금 → 다음
//   무기 업그레이드: 가진 무기마다 한 줄 — 받는 무기는 '권총 10 → 12' (주황), 안 받는 무기는 회색 취소선
//   체력 · 방어: 주인공 값 지금 → 다음
function upHtml(u) {
  if (u.passive) return `<div class="udesc">${u.ds}</div>`;    // 얻으면 끝인 기능 보조 (자석 출현)
  if (u.util) {                                                  // 쓰는 보조: 설명 + 창마다 횟수 지금 → 다음
    const lv = G.ups[u.id] || 0;
    return `<div class="udesc">${u.ds}</div><div class="wrows"><div class="wrow"><span class="wch on">창마다</span><span class="wv">${lv}회 → <b>${lv + 1}회</b></span></div></div>`;
  }
  const t = u.tup || u.give;
  if (t) {                                                       // 특성 (0.103.0): 받는 무기만 한 줄씩 — 부여는 '없음 → 값', 강화는 '지금 → 다음'
    const vals = () => G.weapons.map(w => hasTrait(WEAPONS[w.id], t) ? badgeVal(t, wstat(w.id)) : null);
    const a = vals();
    if (u.give) G.subs.push({id: u.id}); else G.tl[t]++;
    const b = vals();
    if (u.give) G.subs.pop(); else G.tl[t]--;
    const rows = G.weapons.map((w, k) => (u.give ? a[k] == null && b[k] != null : a[k] != null)
      ? `<div class="wl" title="${WEAPONS[w.id].nm}"><img src="images/weapon_${w.id}.png?v=${VERSION}" alt=""><span class="wn">${WEAPONS[w.id].nm}</span><b>${a[k] == null ? '없음' : a[k]}→${b[k]}</b></div>` : '').join('');
    return tagsHtml(u.badges, () => u.fx) + (u.give ? '<div class="udesc">앞으로 얻는 무기도</div>' : '') + `<div class="wls">${rows}</div>`;
  }
  const fx = tagsHtml(u.badges, () => u.fx);
  if (!u.wpn) {
    // 주인공 능력치: 복사본에 업그레이드를 걸어 보고 지금 → 다음 (0.74.0 — 체력 재생 · 획득 범위 · 경험치도)
    const pv = (s, p) => badgeVal(b, {hp: p.maxHp, def: s.def, move: p.speed, regen: s.regen, magnet: magnetR(s), xpMul: s.xpMul, crit: s.crit, critDmg: s.critDmg});
    const b = u.badges[0], s1 = {...G.s}, p1 = {...G.p}; u.apply(s1, p1);
    const now = pv(G.s, G.p), nx = pv(s1, p1);
    return fx + `<div class="wrows"><div class="wrow"><span class="wch on">${BADGES[b].nm}</span><span class="wv">${now} → <b>${nx}</b></span></div></div>`;
  }
  // 받는 무기만 한 줄씩 (세로): 작은 무기 그림 + '지금→다음' (검은 상자). 이름은 그림 위에 마우스 · 팁 대신 title
  const s0 = G.s, s1 = {...s0}; u.apply(s1, {maxHp: 0, hp: 0});
  const rows = G.weapons.filter(w => wpnTakes(WEAPONS[w.id], u.id)).map(w => {
    const W = WEAPONS[w.id], b = u.badges.find(x => wpnBadges(W).includes(x));
    const a = badgeVal(b, wstat(w.id)); G.s = s1; const c = badgeVal(b, wstat(w.id)); G.s = s0;
    return `<div class="wl" title="${W.nm}"><img src="images/weapon_${w.id}.png?v=${VERSION}" alt=""><span class="wn">${W.nm}</span><b>${a}→${c}</b></div>`;
  }).join('');
  return fx + `<div class="wls">${rows}</div>`;
}

// 등급 색 (디아블로식 아이템 등급) — 업그레이드 칸 색 단계에 쓰고, 나중에 아이템 · 보상에도 같은 표를 쓴다
const GRADES = [
  {id: 'normal',    nm: '일반', col: '#c8c8c8'},   // 흰 · 회색
  {id: 'magic',     nm: '마법', col: '#6f8cff'},   // 파랑
  {id: 'rare',      nm: '희귀', col: '#ffe14d'},   // 노랑
  {id: 'legendary', nm: '전설', col: '#ff8a1e'},   // 주황
  {id: 'set',       nm: '세트', col: '#3fe05a'},   // 초록
  {id: 'ancient',   nm: '태고', col: '#ff4040'},   // 빨강 (마지막 — 여기서 더 오르지 않음)
];
const gradeCol = g => GRADES[Math.min(g, GRADES.length - 1)].col;
// 단계 칸: 늘 5칸(PIP_N). 다 차면 다음 등급 색으로 처음부터 다시 채운다 (일반 → 마법 → 희귀 → 전설 → 세트 → 태고)
// done = 지금까지 찍은 횟수, total = 최대 (Infinity = 끝없음). 뒤에 (이번 것/최대) 글자
//   최대가 5 이하인 것(확산 · 연쇄 …, 무기 슬롯)은 칸 수 = 최대, 일반 색 한 바퀴
const PIP_N = 5;
// 저울 칸: 5칸, 가운데 칸은 기준 테두리. 지금 자리는 채움, 이번에 옮겨 갈 자리는 깜빡임. 양 끝에 그쪽 이름
function axisHtml(u) {
  const A = AXES[u.axis], cur = G.s[u.axis], nx = cur + u.dir, col = gradeCol(0), nc = gradeCol(1);
  let h = '';
  for (let v = -AXIS_MAX; v <= AXIS_MAX; v++) {
    const on = v === cur, next = v === nx;
    h += `<i class="pip${on ? ' on' : ''}${next ? ' next' : ''}${v === 0 ? ' mid' : ''}" style="${on ? `--b:${col};` : ''}${next ? `--c:${nc};` : ''}"></i>`;
  }
  return `<div class="pipsrow axis"><span class="pipl">${A.l}</span><div class="pips">${h}</div><span class="pipn">${A.r}</span></div>`;
}
function pipsHtml(done, total) {
  const n = Number.isFinite(total) ? Math.min(total, PIP_N) : PIP_N;
  const g = Math.floor(done / n), k0 = done % n;                // g = 지금 채우는 등급, k0 = 그 등급으로 찬 칸 수
  let h = '';
  for (let k = 0; k < n; k++) {
    const cur = k < k0 ? gradeCol(g) : g > 0 ? gradeCol(g - 1) : '';   // 이번 바퀴에 찬 칸 · 전 바퀴 색 · 빈 칸
    const style = (cur ? `--b:${cur};` : '') + (k === k0 ? `--c:${gradeCol(g)};` : '');
    h += `<i class="pip${cur ? ' on' : ''}${k === k0 && done < total ? ' next' : ''}" style="${style}"></i>`;
  }
  const lim = Number.isFinite(total) ? total : INF;
  return `<div class="pipsrow"><span class="pipl">Lv.</span><div class="pips">${h}</div><span class="pipn">(${done + 1}/${lim})</span></div>`;
}

function choose(i, click) {
  if (G.mode !== 'levelup' || G.inputLock > 0) return;          // 창이 뜨자마자 누른 탭 · 키는 무시
  if (G.banMode) { banPick(i); return; }                        // 봉인할 것 고르는 중
  const u = G.choices[i]; if (!u || G.banned.has(u.id)) return;   // 봉인한 카드는 못 고름
  G.ups[u.id] = (G.ups[u.id] || 0) + 1;
  u.apply(G.s, G.p);
  if (u.sub && !G.subs.some(x => x.id === u.id)) G.subs.push({id: u.id, nm: u.sub});   // 새 보조 아이템 → 보조 슬롯
  closePicks();
}
function closePicks() {
  $('levelup').hidden = true;
  G.mode = 'play';
  if (G.chestQ > 0) { G.chestQ--; openChest(); }               // 쌓인 상자 먼저, 그다음 밀린 레벨업
  else if (G.pendingLv > 0) { G.pendingLv--; openLevelUp(); }
}

// ───── 상자 · 보조 아이템 (0.67.0) ─────
// 엘리트(특수몹)가 죽으면 상자를 떨군다. 주인공이 닿으면 열려 보조 아이템 3개 중 하나를 고른다
//   보조 아이템 = 연속 · 투사체 · 연쇄 · 폭발 (레벨업에서 뺀 것). 처음 고르면 보조 슬롯 하나를 차지, 다시 고르면 단계 +1 (최대 5)
//   슬롯이 다 차면 가진 것만 나온다. 가진 무기가 받지 못하는 것은 안 나온다
// 0.103.0: 강화 보조 = 그 특성을 가진 무기가 있고 단계가 덜 참 · 부여 보조 = 안 가졌고 붙을 무기가 있음 · 기능형 = 단계가 덜 참
const traitOwned = t => G.weapons.some(w => hasTrait(WEAPONS[w.id], t));
const enhOk = t => traitOwned(t) && G.tl[t] < TRAIT_MAX;
const giveOk = t => !ownsSub('give_' + t) && G.weapons.some(w => giveable(WEAPONS[w.id], t));
const subOk = u => u.give ? giveOk(u.give) : G.ups[u.id] < u.max;
const subKind = u => u.give ? '<div class="sublbl">특성 부여</div>' : '<div class="sublbl">기능</div>';
const chestPool = () => UPGRADES.filter(u => u.sub && subOk(u) && !G.banned.has(u.id)
  && (G.subs.some(x => x.id === u.id) || subsUsed() < G.char.sSlots));
// 빈 무기 슬롯이 있으면 해금된 새 무기도 상자에서 나온다 (0.69.0 — 그 전엔 레벨업에서)
const newWeaponPool = () => G.weapons.length >= G.char.wSlots ? [] : UNLOCKED_WEAPONS.filter(id => !G.weapons.some(w => w.id === id) && !G.banned.has('new_' + id))
  .map(id => ({id: 'new_' + id, nm: '새 무기: ' + WEAPONS[id].nm, ds: WEAPONS[id].ds, max: 1, newWeapon: id, apply: () => G.weapons.push(newWeapon(id))}));
// 무기 강화 (0.101.0): 가진 무기마다 하나. 최대치 없음 → 상자가 비지 않음
const weaponUpPool = () => G.weapons.filter(w => !G.banned.has('wup_' + w.id))
  .map(w => ({id: 'wup_' + w.id, nm: WEAPONS[w.id].nm + ' 강화', max: 99, wup: w.id, apply: () => { w.lv = (w.lv || 0) + 1; }}));
// 새 무기는 상자 한 번에 1장만 (0.102.4) — 해금된 무기가 여럿이면 그중 하나만 후보에 (그 전엔 전부 들어가 보조를 밀어냄)
const oneNewWeapon = () => { const a = newWeaponPool(); return a.length ? [a[Math.floor(Math.random() * a.length)]] : []; };
const chestAll = () => [...chestPool(), ...oneNewWeapon(), ...weaponUpPool()];
function chestPicks(pool = chestAll()) {
  const picks = [];
  while (picks.length < 3 && pool.length) picks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  // 0.108.2: 세 장을 채우는 게 먼저 — 다른 후보가 모자라면 남은 새 무기로 채움 (그땐 새 무기가 여러 장)
  const rest = newWeaponPool().filter(u => !picks.some(x => x.id === u.id));
  while (picks.length < 3 && rest.length) picks.push(rest.splice(Math.floor(Math.random() * rest.length), 1)[0]);
  return picks;
}
function openChest() {
  const picks = chestPicks();
  if (!picks.length) { if (G.pendingLv > 0) { G.pendingLv--; openLevelUp(); } return; }   // 고를 것이 없으면 빈 상자
  G.pickKind = 'chest'; G.pickUse = {reroll: 0, ban: 0}; G.banMode = false;
  showPicks(picks, '상자');
}

// ───── 행운 주사위 · 봉인 부적 (0.78.0) ─────
// 가진 보조면 고르기 창(레벨업 · 상자)마다 단계 수만큼: 다시 뽑기 = 세 장을 새로 · 봉인 = 고른 하나를 이번 판에서 빼고 그 자리를 새로 채움
const hasSub = id => G.subs.some(x => x.id === id);
const usesLeft = (id, k) => hasSub(id) ? (G.ups[id] || 0) - G.pickUse[k] : 0;   // 이 창에서 남은 횟수
const canReroll = () => G && G.mode === 'levelup' && usesLeft('reroll', 'reroll') > 0;
const winBans = () => G.pickUse.bans || (G.pickUse.bans = []);   // 이 창에서 봉인한 것 (0.108.1 — 봉인 해제용)
const canUnban = () => G && G.mode === 'levelup' && hasSub('banish') && usesLeft('banish', 'ban') <= 0 && winBans().length > 0;
const canBan = () => G && G.mode === 'levelup' && (usesLeft('banish', 'ban') > 0 || canUnban());
const pickTitle = () => G.pickKind === 'chest' ? '상자' : '레벨 업!';
function rerollPicks() {
  if (!canReroll() || G.inputLock > 0) return;
  G.pickUse.reroll++; G.banMode = false;
  showPicks(G.pickKind === 'chest' ? chestPicks() : levelPicks(), pickTitle());
}
function toggleBan() {
  if (!canBan() || G.inputLock > 0) return;
  if (canUnban()) {                                              // 0.108.1: 봉인을 다 쓴 뒤 한 번 더 누르면 이 창에서 마지막에 봉인한 것을 풂
    G.banned.delete(winBans().pop()); G.pickUse.ban--; G.banMode = false;
    showPicks(G.choices, pickTitle(), true); return;
  }
  G.banMode = !G.banMode; showPicks(G.choices, pickTitle(), true);
}
function banPick(i) {
  const u = G.choices[i]; if (!u || G.banned.has(u.id)) return;
  G.banned.add(u.id); G.pickUse.ban++; G.banMode = false; winBans().push(u.id);   // 0.108.1: 묻지 않고 바로 봉인 (봉인 단추를 한 번 더 누르면 풂)
  // 0.102.1: 그 자리를 새것으로 채우지 않는다 — 카드는 '봉인됨' 으로 남고 못 고름
  if (G.choices.every(x => G.banned.has(x.id))) { closePicks(); return; }   // 다 봉인하면 고를 게 없어 닫힘
  showPicks(G.choices, pickTitle(), true);
}

function gainXp(n) {
  G.xp += n;
  while (G.xp >= xpNeed(G.lv)) {
    G.xp -= xpNeed(G.lv); G.lv++;
    if (G.mode === 'levelup') G.pendingLv++; else openLevelUp();
  }
}

// ───── 적 ─────
// 지금 풀린 잡몹 (월드 타임라인 mobs 중 at 이 지난 것)
const mobTypes = () => G.world.mobs.filter(m => G.t >= m.at).map(m => m.type);
// noRanged (0.98.0): 엘리트용 — 멈춰 서서 쏘는 원거리형(shot · lob)은 뺌. 무리 뒤에 머물러 잡히지 않으므로
const isRanged = type => { const T = ENEMY_TYPES[type]; return !!(T.shot || T.lob); };
function pickMob(noRanged) {
  let ms = G.world.mobs.filter(m => G.t >= m.at);

    e.dead = true; G.kills++;

    const bu = (ENEMY_TYPES[e.type] || {}).burst;                // 부푼 좀비: 그 자리에 예고 원 → 터짐 (0.84.0)
    if (bu) G.eshots.push({blast: true, x: e.x, y: e.y, t: 0, T: bu.T, aoe: bu.aoe * (e.elite != null ? 1.3 : 1), dmg: bu.dmg * (e.elite != null ? ELITE.dmg : 1)});
    if (!e.boss && ownsSub('magdrop')) {                          // 자석 출현 (0.106.0) · 가변 출현율 (0.107.0)
      if (Math.random() < magDropP(G.magMiss || 0)) { G.mags.push({x: e.x, y: e.y, t: 0}); G.magMiss = 0; } else G.magMiss = (G.magMiss || 0) + 1;
    }
    if (e.elite != null && !e.boss) G.chests.push({x: e.x, y: e.y, g: e.elite, t: 0});   // 엘리트 → 상자 (보스는 따로 — 영구 성장템, 아직)
    if (e.boss && e.boss.final) G.finalDead = true;               // 최종 보스를 잡으면 클리어 (update 에서)
    else if (e.boss) setBanner(`${e.boss.nm} 처치!`, gradeCol(e.boss.grade));
  }
}

// 경험치 보석 떨구기 (0.73.0): n 개로 나눠 사방으로 튀어 오른다 (z = 높이). 땅에 닿기 전엔 못 줍고 끌리지도 않는다
const MAGNET = 90;                    // 보석을 끌어오기 시작하는 거리 (기본)
const magnetR = s => MAGNET * s.magnetMul * (hasPen('heavy') ? 0.5 : 1);
const GEM_G = 900;                    // 보석 중력 (px/초²)
function dropGems(x, y, v, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = n > 1 ? 40 + Math.random() * 90 : 15 + Math.random() * 25;
    G.gems.push({x, y, v: v / n, pull: false, z: 0, vz: n > 1 ? 160 + Math.random() * 100 : 130, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, air: true});
  }
}
// 상자 그림 (캔버스로): 나무 몸통 · 뚜껑 · 금테 · 자물쇠, 둘레에 등급 빛
function drawChest(x, y, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.shadowColor = col; ctx.shadowBlur = 10;
  ctx.fillStyle = '#7a4a22'; ctx.fillRect(-11, -4, 22, 12);          // 몸통
  ctx.fillStyle = '#93592a'; ctx.beginPath(); ctx.moveTo(-11, -4); ctx.lineTo(-11, -9); ctx.quadraticCurveTo(0, -15, 11, -9); ctx.lineTo(11, -4); ctx.fill();   // 뚜껑
  ctx.shadowBlur = 0;
  ctx.fillStyle = col; ctx.fillRect(-11, -5, 22, 2); ctx.fillRect(-8, -12, 2, 20); ctx.fillRect(6, -12, 2, 20);   // 테
  ctx.fillStyle = '#ffe27a'; ctx.fillRect(-2, -6, 4, 5);              // 자물쇠
  ctx.strokeStyle = '#2a170a'; ctx.lineWidth = 1; ctx.strokeRect(-11, -4, 22, 12);
  ctx.restore();
}

// ───── 공격 ─────
const spreadRnd = st => (Math.random() * 2 - 1) * (st.acc || 0) * Math.PI / 180;   // 발사각: 한 발마다 ±acc 도
const AIM_T = 0.07;                   // 쏘기 직전 대상 쪽으로 도는 시간 (초)
const newWeapon = id => ({id, lv: 0, cdT: 0, shots: [], aim: 0, kick: 0, ammo: WEAPONS[id].mag, rl: 0, rlMax: 0});
// 재장전 중이면 시간을 흘리고 true. 다 채우면 바로 쏠 수 있게
function reloading(w, st, dt) {
  if (!(w.rl > 0)) return false;
  w.rl -= dt;
  if (w.rl <= 0) { w.rl = 0; w.ammo = st.mag; w.cdT = 0; }
  return true;
}
// 한 번 쏠 때(연속 · 확산 포함) 한 발. 비면 재장전 — 마지막 발 간격(cd) + 재장전을 한 번에 기다린다
function useAmmo(w, st) { if (--w.ammo <= 0) { w.ammo = 0; w.rl = w.rlMax = st.cd + st.reload; } }

// 무기 자세: 손 위치 · 각도 · 총구 위치
// 무기가 여럿이면 얼굴 높이(WPN_CY) 둘레 원(반지름 WPN_RING) 위 **정해진 자리**에 고르게 놓는다 (360° / 개수).
// 자리는 겨누는 쪽과 상관없이 고정 — 총마다 **제 자리를 축으로** 제 적을 겨눠 돈다. 짝수 개는 오른쪽부터, 홀수 개는 위부터
const WPN_RING = 22, WPN_CY = -22;   // 원 중심 = 몸 중심에서 위로 22px (얼굴 높이)
function weaponPose(w, i) {
  const p = G.p, W = WEAPONS[w.id], a = w.aim, c = Math.cos(a), sn = Math.sin(a);
  const img = WEAPON_IMG[w.id], len = W.len, h = img ? len * img.height / img.width : len * 0.6;
  const back = w.kick * 5;                                       // 반동: 쏘면 뒤로 살짝
  const n = G.weapons.length;
  let hx, hy;
  if (n > 1) {
    const th = (n % 2 ? -Math.PI / 2 : 0) + i * Math.PI * 2 / n;
    hx = p.x + Math.cos(th) * WPN_RING - c * back; hy = p.y + WPN_CY + Math.sin(th) * WPN_RING - sn * back;
  } else { hx = p.x + c * (9 - back); hy = p.y + WPN_CY + sn * (9 - back); }   // 하나면 몸 앞
  const flip = c < 0 ? -1 : 1;                                   // 왼쪽을 보면 위아래를 뒤집어 손잡이가 아래로
  const mx = (W.muzzle[0] - W.pivot[0]) * len, my = (W.muzzle[1] - W.pivot[1]) * h * flip;
  return {hx, hy, a, flip, len, h, mx: hx + c * mx - sn * my, my: hy + sn * mx + c * my};
}

// 총 계열: 가장 가까운 적에게, 투사체 수만큼 부채꼴로. 총구에서 나간다
function fireGun(st, w, i) {
  const p = G.p;
  const tgt = nearestEnemy(p.x, p.y, st.range);
  if (!tgt) return;
  w.aim = Math.atan2(tgt.y - p.y, tgt.x - p.x); w.kick = 1;     // 쏘는 순간엔 정확히 그쪽
  const m = weaponPose(w, i), base = Math.atan2(tgt.y - m.my, tgt.x - m.mx), spread = 0.14;
  for (let k = 0; k < st.count; k++) {
    const a = base + (k - (st.count - 1) / 2) * spread + spreadRnd(st);
    G.bullets.push({x: m.mx, y: m.my, vx: Math.cos(a) * st.spd, vy: Math.sin(a) * st.spd,
      dmg: st.dmg, stun: st.stun, knock: st.knock, splash: st.splash, chain: st.chain, travel: 0, maxTravel: st.range * 1.25, hit: new Set(),
      ...(st.pierce ? {pierce: true, pleft: st.pierce, rad: 3} : {})});   // 관통 부여 (0.103.0)
  }
  G.fx.push({kind: 'muzzle', x: m.mx, y: m.my, t: 0.06});
}

// 저격총: 가장 가까운 적 쪽으로 빠른 관통탄. 날아가는 길의 적 모두 맞고 사거리 끝(+30px)까지 간다
function fireRail(st, w, i) {
  const p = G.p, W = WEAPONS[w.id];
  const tgt = nearestEnemy(p.x, p.y, st.range);
  if (!tgt) return;
  w.aim = Math.atan2(tgt.y - p.y, tgt.x - p.x); w.kick = 1;
  const m = weaponPose(w, i), base = Math.atan2(tgt.y - m.my, tgt.x - m.mx), spread = 0.12;
  for (let k = 0; k < st.count; k++) {
    const a = base + (k - (st.count - 1) / 2) * spread + spreadRnd(st);
    G.bullets.push({x: m.mx, y: m.my, vx: Math.cos(a) * st.spd, vy: Math.sin(a) * st.spd, pierce: true, rail: true, pleft: st.pierce || Infinity, rad: W.width / 2,
      dmg: st.dmg, stun: st.stun, knock: st.knock, splash: 0, chain: st.chain, tgt, travel: 0, maxTravel: st.range + 30, hit: new Set()});
  }
  G.fx.push({kind: 'muzzle', x: m.mx, y: m.my, t: 0.08});
}

// 부메랑: 가까운 적 쪽으로 투사체 수만큼 부채꼴. 길은 BOOM 설명 (boom: 1 가는 중 · 2 오는 중). 던질 때마다 부푸는 쪽이 번갈아 바뀜
function fireBoom(st, w, i) {
  const p = G.p, W = WEAPONS[w.id];
  const tgt = nearestEnemy(p.x, p.y, st.range);
  if (!tgt) return;
  w.aim = Math.atan2(tgt.y - p.y, tgt.x - p.x); w.kick = 1;
  const hx = p.x, hy = p.y + WPN_CY, base = Math.atan2(tgt.y - hy, tgt.x - hx), spread = 0.35;
  const sg = w.bside = -(w.bside || -1), path = boomPath(st.range, st.acc || 0);   // 부푸는 쪽 (번갈아) · 고리 길
  for (let k = 0; k < st.count; k++) {
    const a = base + (k - (st.count - 1) / 2) * spread;
    G.bullets.push({x: hx, y: hy, ax: hx, ay: hy, vx: 0, vy: 0, boom: 1, w, sp: st.spd, th: a, sg, path, s: 0, pi: 0, hitAt: new Map(), rot: Math.random() * 6, pierce: true, pleft: st.pierce || Infinity, tgts: new Set(), rad: W.rad,
      dmg: st.dmg, stun: st.stun, knock: st.knock, splash: 0, chain: st.chain, travel: 0, maxTravel: Infinity, life: 0, hit: new Set()});   // chain (0.109.1)
  }
}

const LASER_BEND = [60, 35, 18, 10];   // 마디별 휨(도) — 마디가 출발할 때 곧은 선에서 벌어지는 각. 첫 마디가 가장 크게
const LASER_HANDLE = 0.42;             // 베지어 손잡이 길이 (마디 길이 비율)
const LASER_SPEED = 1200;             // 빔 끝이 다음 적으로 뻗어 가는 빠르기 (px/초) — 0.95.1: 420 → 1200 (폭발보다 빔이 늦게 보였음)
const LASER_SAMPLES = 16;             // 마디 하나를 몇 조각 꺾은선으로 (그리기 · 맞힘 판정 공용)
// 점들(총구 · 적 …)을 지나는 매끄러운 곡선 — 마디마다 3차 베지어, 이음점은 앞뒤 마디가 같은 접선 (꺾이지 않게)
// 마디 k 가 원하는 출발각 = 곧은 각 + 휨, 도착각 = 곧은 각 - 휨. 이음점 접선 = 앞 마디 도착각과 뒤 마디 출발각의 평균
function laserSegs(P) {
  const n = P.length - 1, a = [], b = [], L = [], c0 = [], segs = [];
  for (let k = 0; k < n; k++) {
    const A = P[k], B = P[k + 1], c = Math.atan2(B.y - A.y, B.x - A.x);
    const d = LASER_BEND[Math.min(k, LASER_BEND.length - 1)] * Math.PI / 180 * (k % 2 ? -1 : 1);
    a.push(c + d); b.push(c - d); L.push(Math.hypot(B.x - A.x, B.y - A.y)); c0.push(c);
  }
  const T = [c0[0]];   // 총구에선 적을 똑바로 향해 나간다 (옆으로 쏘지 않게). 휨은 첫 마디 끝 · 이음점에서 생긴다
  for (let j = 1; j < n; j++) T.push(Math.atan2(Math.sin(b[j - 1]) + Math.sin(a[j]), Math.cos(b[j - 1]) + Math.cos(a[j])));
  T.push(b[n - 1]);
  for (let k = 0; k < n; k++) {
    const A = P[k], B = P[k + 1], h = L[k] * LASER_HANDLE;
    const c1x = A.x + Math.cos(T[k]) * h, c1y = A.y + Math.sin(T[k]) * h, c2x = B.x - Math.cos(T[k + 1]) * h, c2y = B.y - Math.sin(T[k + 1]) * h;
    const seg = [];
    for (let i = 0; i <= LASER_SAMPLES; i++) {
      const u = i / LASER_SAMPLES, v = 1 - u;
      seg.push({x: v * v * v * A.x + 3 * v * v * u * c1x + 3 * v * u * u * c2x + u * u * u * B.x,
                y: v * v * v * A.y + 3 * v * v * u * c1y + 3 * v * u * u * c2y + u * u * u * B.y});
    }
    seg.len = seg.reduce((s, q, i) => i ? s + Math.hypot(q.x - seg[i - 1].x, q.y - seg[i - 1].y) : 0, 0);
    segs.push(seg);
  }
  return segs;
}
// 지금 그려진 만큼(prog 마디)의 꺾은선
function beamLine(bm) {
  const out = [], full = Math.floor(bm.prog), fr = bm.prog - full;
  bm.segs.forEach((seg, k) => {
    if (k < full) { out.push(...(k ? seg.slice(1) : seg)); return; }
    if (k > full || fr <= 0) return;
    const f = fr * LASER_SAMPLES, i = Math.floor(f), w = f - i;
    out.push(...(k ? seg.slice(1, i + 1) : seg.slice(0, i + 1)));
    if (i < LASER_SAMPLES) out.push({x: seg[i].x + (seg[i + 1].x - seg[i].x) * w, y: seg[i].y + (seg[i + 1].y - seg[i].y) * w});
  });
  return out;
}
// 굴곡 레이저 — 늘 켜진 빔. 마디(node)마다 겨누는 적(e)과 **그려지는 자리(x, y)** 가 따로 있다
// 처음엔 총구에서 첫 적으로 천천히 뻗어 가고(prog), 닿으면 그 적 둘레(hop)의 다음 적으로 또 뻗는다 (최대 chain)
// 겨누던 적이 죽거나 멀어지면 **빔을 거두지 않고** 그 마디가 지금 자리에서 새 적으로 미끄러져 옮겨 간다 (LASER_MOVE)
// 맞힘: 쿨다운마다 **빔이 지나는 길 위의 적 모두** 한 번씩 (연쇄 대상이 아니어도)
const LASER_MOVE = 2400;              // 마디가 새 적으로 옮겨 가는 빠르기 (px/초) — 0.95.1: 700 → 2400. 맞힘은 바로 새 적에 들어가므로 빔이 거의 같이 닿게
function updateLaser(w, wi, st, dt) {
  const p = G.p, W = WEAPONS[w.id], hop = W.hop * st.range / W.range;
  let bm = w.beam;
  const before = k => new Set(bm.nodes.slice(0, k).map(n => n.e));   // 앞 마디들이 겨눈 적 (뒤 마디의 적은 가져와도 됨)
  if (bm) {
    // 마디마다 겨눌 적 다시 확인 — 죽었거나 멀어졌으면 새 적으로 (자리는 그대로, 아래에서 미끄러져 감)
    for (let k = 0; k < bm.nodes.length; k++) {
      const n = bm.nodes[k], from = k ? bm.nodes[k - 1].e : p, lim = k ? hop * 1.3 : st.range * 1.15;
      if (!n.e.dead && Math.hypot(n.e.x - from.x, n.e.y - from.y) <= lim) continue;
      const nx = nearestEnemy(from.x, from.y, k ? hop : st.range, before(k));
      if (nx) {
        n.e = nx;
        const dup = bm.nodes.findIndex((q, j) => j > k && q.e === nx);   // 뒤 마디의 적을 가져왔으면 그 마디는 빠진다
        if (dup > 0) { bm.nodes.splice(dup, 1); bm.prog = Math.min(bm.prog, bm.nodes.length); }
        continue;
      }
      bm.nodes.length = k; bm.prog = Math.min(bm.prog, k);   // 이을 적이 없으면 거기서 잘림
      break;
    }
    if (!bm.nodes.length) bm = w.beam = null;
  }
  if (!bm) {
    const f = nearestEnemy(p.x, p.y, st.range);
    if (!f) { w.cdT = Math.max(0, w.cdT - dt); return; }
    bm = w.beam = {nodes: [{e: f, x: f.x, y: f.y}], prog: 0, ph: Math.random(), segs: []};
  }
  // 마디 자리를 겨누는 적 쪽으로 옮긴다 (붙어 있으면 그대로 따라감)
  for (const n of bm.nodes) {
    const dx = n.e.x - n.x, dy = n.e.y - n.y, d = Math.hypot(dx, dy), mv = LASER_MOVE * dt;
    if (d <= mv) { n.x = n.e.x; n.y = n.e.y; } else { n.x += dx / d * mv; n.y += dy / d * mv; }
  }
  const m = weaponPose(w, wi);
  bm.segs = laserSegs([{x: m.mx, y: m.my}, ...bm.nodes]);
  // 뻗기 (새 마디만 — 이미 그려진 마디는 옮겨 갈 뿐 다시 뻗지 않는다)
  const k = Math.floor(bm.prog);
  if (k < bm.nodes.length) bm.prog = Math.min(bm.nodes.length, bm.prog + dt * LASER_SPEED / Math.max(20, bm.segs[k].len));
  if (bm.prog >= bm.nodes.length && bm.nodes.length < st.chain + 1) {   // 첫 적 + 연쇄
    const last = bm.nodes[bm.nodes.length - 1].e, nx = nearestEnemy(last.x, last.y, hop, new Set(bm.nodes.map(q => q.e)));
    if (nx) bm.nodes.push({e: nx, x: nx.x, y: nx.y});
  }
  // 맞힘
  w.cdT -= dt;
  if (w.cdT > 0) return;
  w.cdT = Math.max(0, w.cdT + st.cd);                           // 남은 몫을 넘긴다 (간격 0.07 이 프레임에 잘려 느려지지 않게)
  // 맞힘 (0.75.0): 관통 없음 — 빔이 다 뻗어 닿은 마디의 적만. 폭발이 있으면 닿은 자리마다 둘레 피해
  const hits = bm.nodes.filter((n, k) => bm.prog >= k + 1 && !n.e.dead).map(n => n.e);
  for (const e of hits) {
    hurtEnemy(e, st.dmg, st.stun);
    if (st.splash) {
      const R = splashR(st.splash), sd = st.dmg * splashPct(st.splash);
      if (!(e.sfxT > G.t)) { G.fx.push({kind: 'splash', mine: true, x: e.x, y: e.y, r: R, t: 0.25}); e.sfxT = G.t + 0.25; }   // 빔은 0.07초마다라 그림은 0.25초에 한 번
      for (const o of G.enemies) if (o !== e && !o.dead && (o.x - e.x) ** 2 + (o.y - e.y) ** 2 < (R + o.r) ** 2) hurtEnemy(o, sd);
    }
  }
  if (hits.length) useAmmo(w, st);                                        // 빔이 아직 뻗는 중이라 아무도 못 맞혔으면 탄을 안 쓴다
}

// 총알 연쇄: e 를 맞힌 b 를 다음 적으로 돌린다. 이을 적이 없으면 false
const CHAIN_HOP = 170;                // 연쇄로 다음 적을 찾는 거리 (px)
// 탄이 남은 길(maxTravel 까지)에서 아직 안 맞힌 적과 닿을까 (0.93.1)
function enemyAhead(b) {
  const sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp, left = b.maxTravel - b.travel;
  for (const o of G.enemies) {
    if (o.dead || b.hit.has(o)) continue;
    const t = (o.x - b.x) * ux + (o.y - b.y) * uy;
    if (t < 0 || t > left) continue;
    if (Math.abs((o.x - b.x) * uy - (o.y - b.y) * ux) <= o.r + (b.rad || 5)) return true;
  }
  return false;
}
function chainBullet(b, e) {
  const nx = nearestEnemy(e.x, e.y, CHAIN_HOP, b.hit);
  if (!nx) return false;
  const sp = Math.hypot(b.vx, b.vy), d = Math.hypot(nx.x - e.x, nx.y - e.y) || 1;
  b.x = e.x; b.y = e.y; b.vx = (nx.x - e.x) / d * sp; b.vy = (nx.y - e.y) / d * sp;
  b.chain--; b.tgt = nx;
  b.maxTravel = b.travel + CHAIN_HOP * 1.3;                     // 튄 뒤엔 다음 적까지만 (빗나가면 곧 사라짐)
  G.fx.push({kind: 'muzzle', x: e.x, y: e.y, t: 0.05});
  return true;
}

// ───── 갱신 ─────
function update(dt) {
  const p = G.p, s = G.s;
  G.t += dt;
  if (G.finalDead) { worldClear(); return; }                     // 최종 보스를 잡아야 클리어 (시간이 다 돼도 보스가 나올 뿐)
  timelineTick();
  if (G.banner && (G.banner.t -= dt) <= 0) G.banner = null;

  // 이동
  let mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), my = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  if (mx || my) { const l = Math.hypot(mx, my); mx /= l; my /= l; }
  else if (joy.id !== null) { const v = joyVec(); mx = v.x; my = v.y; }   // 조이스틱은 끌어낸 만큼 (0~1)
  else if (pad.v.x || pad.v.y) { const l = Math.max(1, Math.hypot(pad.v.x, pad.v.y)); mx = pad.v.x / l; my = pad.v.y / l; }   // 패드 왼쪽 스틱
  const amt = Math.hypot(mx, my);
  p.vx = mx * p.speed; p.vy = my * p.speed;                     // 부메랑 물리가 쓴다
  p.x += p.vx * dt; p.y += p.vy * dt;
  { const k = Math.min(1, dt * 4); G.pv.x += (p.vx - G.pv.x) * k; G.pv.y += (p.vy - G.pv.y) * k; }   // 곡사가 보는 이동 (0.84.0)
  // 몸 방향: 움직이는 동안엔 이동 방향만 따른다 (위아래로만 갈 땐 그대로). 서 있을 때만 아래 조준이 공격 방향으로 돌린다
  p.moving = amt > 0.15;
  if (Math.abs(mx) > 0.15) p.face = Math.sign(mx);
  p.move += (amt - p.move) * Math.min(1, dt * 10);   // 걷기 세기 0~1 (멈추면 서서히 가라앉음)
  p.walk += dt * Math.PI * p.speed / WALK_STRIDE * p.move;   // 한 걸음(통통 한 번 = π) 에 WALK_STRIDE 만큼 나아간다 — 빠른 캐릭터는 발도 빠르게
  p.inv = Math.max(0, p.inv - dt); tickGhost(p, dt);
  G.hitT = Math.max(0, (G.hitT || 0) - dt); G.shake = (G.shake || 0) * Math.exp(-SHAKE_DECAY * dt);
  { const sk = G.shake > 0.3 ? G.shake : 0; G.skx = (Math.random() * 2 - 1) * sk; G.sky = (Math.random() * 2 - 1) * sk; }   // 흔들림 자리는 판이 돌 때만 바뀜 — 멈추면 같이 멈춤 (0.106.1)
  // 체력 재생 (0.74.0) — 0.83.0 부터 REGEN_T 초마다 한 번에 (초당 양은 그대로). 찰 때마다 녹색 +숫자
  if (G.s.regen && p.hp < p.maxHp) {
    if ((G.regenAcc = (G.regenAcc || 0) + dt) >= REGEN_T) {
      G.regenAcc -= REGEN_T;
      const h = Math.min(p.maxHp - p.hp, G.s.regen * REGEN_T); p.hp += h;
      if (h >= 0.5) G.texts.push({x: p.x, y: p.y - 24, v: '+' + Math.round(h), t: 0.8, heal: true});
    }
  } else G.regenAcc = 0;

  // 생성: 초당 1.2 + 0.06·초 마리, 1분마다 둘레 무리
  G.spawnAcc += spawnRate() * dt;
  if (G.spawnAcc >= 1) {
    let n = mobCount();
    const cap = SPAWN.cap(G.t / 60);
    while (G.spawnAcc >= 1) {
      G.spawnAcc--;
      if (n >= cap) { G.missed++; continue; }                     // 상한: 이 차례는 버림 (알리지 않음)
      spawnEnemy(); n++;
    }
  }

  // 조준 · 발사 — 무기마다 따로 (연속공격은 0.1초 간격)
  // 총(권총 · 저격총)은 **쏘기 전까지 방향을 그대로** 둔다 (적을 미리 따라 돌면 덜덜거림).
  // 쏠 때가 되면 AIM_T 초 동안 그때의 대상 쪽으로 짧게 돌고 → 발사. 레이저는 늘 쏘고 있으므로 계속 따라 돈다
  G.weapons.forEach((w, wi) => {
    const kind = WEAPONS[w.id].kind, st = wstat(w.id);
    const tgt = nearestEnemy(p.x, p.y, st.range);
    const turnTo = (want, k) => { let d = want - w.aim; d = Math.atan2(Math.sin(d), Math.cos(d)); w.aim += d * k; };   // 가까운 쪽으로
    w.kick = Math.max(0, w.kick - dt * 8);
    if (kind === 'laser') {
      if (tgt) { let d = Math.atan2(tgt.y - p.y, tgt.x - p.x) - w.aim; d = Math.atan2(Math.sin(d), Math.cos(d));
                 w.aim += Math.sign(d) * Math.min(Math.abs(d), WEAPONS[w.id].turn * dt); }
      if (wi === 0 && tgt && !p.moving) p.face = Math.cos(w.aim) >= 0 ? 1 : -1;
      if (reloading(w, st, dt)) { w.beam = null; return; }   // 재장전(과열) 중엔 빔이 꺼진다
      updateLaser(w, wi, st, dt); return;
    }
    if (kind === 'orbit') { updateOrbit(w, st, dt); return; }
    if (kind === 'charm') { updateCharm(w, st, dt); return; }
    if (kind === 'boom') {                                         // 부메랑: 날아간 게 하나라도 있으면 못 던짐. 다 받은 뒤부터 쿨다운
      w.out = w.shots.length > 0 || G.bullets.some(b => b.boom && b.w === w);
      if (w.out) { if (!w.shots.length) w.cdT = st.reload; }   // 0.97.0: 쿨다운 → 재장전
      else { w.cdT -= dt; if (w.cdT <= 0 && tgt) { for (let i = 0; i < st.burst; i++) w.shots.push(AIM_T + i * 0.1); w.out = true; } }
    } else if (!reloading(w, st, dt)) {
      w.cdT -= dt;
      if (w.cdT <= 0 && tgt && !w.shots.length) {
        w.cdT = st.cd; useAmmo(w, st);
        for (let i = 0; i < st.burst; i++) w.shots.push(AIM_T + i * 0.1);
      }
    }
    // 다음 발이 AIM_T 안으로 들어오면 그 발이 겨눌 대상 쪽으로 남은 시간에 맞춰 돈다 (발사 순간 딱 맞게)
    const next = w.shots.length ? Math.min(...w.shots) : Infinity;
    if (next <= AIM_T + 1e-6 && tgt) turnTo(Math.atan2(tgt.y - p.y, tgt.x - p.x), Math.min(1, dt / Math.max(dt, next)));
    if (wi === 0 && w.shots.length && !p.moving) p.face = Math.cos(w.aim) >= 0 ? 1 : -1;   // 서서 쏘면 몸도 그쪽을 본다
    w.shots = w.shots.map(t => t - dt).filter(t => t > 0 || ((kind === 'rail' ? fireRail : kind === 'boom' ? fireBoom : fireGun)(st, w, wi), false));
  });

  // 적 이동 + 겹침 밀어내기 (격자 버킷)
  const grid = new Map(), CELL = 48;
  tickAllies(dt);                                                // 아군 (0.113.0)
  for (const e of G.enemies) {
    const tg = G.allies.length ? foeTarget(e) : p;               // 가장 가까운 아군이나 주인공 쪽으로 (0.113.0)
    const dx = tg.x - e.x, dy = tg.y - e.y, d = Math.hypot(dx, dy) || 1;
    tickGhost(e, dt);
    e.flash = Math.max(0, e.flash - dt);
    if (e.stop > 0) {                                             // 경직: 움직임 · 넉백 · 출렁임 모두 멈춤 (넉백은 풀린 뒤 이어짐)
      e.stop -= dt; e.ph -= dt * Math.PI * 2 * BOB[e.type].hz;
    } else {
      if (e.boss) bossTick(e, dt);
      else if (!rangedTick(e, dx, dy, d, dt)) { const sp = chaseSpd(e, d); e.vx = dx / d * sp; e.x += e.vx * dt; e.y += dy / d * sp * dt; }
      e.x += e.kbx * dt; e.y += e.kby * dt;
      const kd = Math.exp(-KNOCK_DECAY * dt); e.kbx *= kd; e.kby *= kd;   // 넉백은 빠르게 잦아든다
    }
    const k = ((e.x / CELL) | 0) + ',' + ((e.y / CELL) | 0);
    (grid.get(k) || grid.set(k, []).get(k)).push(e);
  }
  parting(dt);
  for (const e of G.enemies) {
    const cx = (e.x / CELL) | 0, cy = (e.y / CELL) | 0;
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      const b = grid.get((cx + ox) + ',' + (cy + oy)); if (!b) continue;
      for (const o of b) {
        if (o === e || e.boss) continue;                            // 보스는 밀리지 않는다
        // 몹은 다른 몹을 밀지 못한다 (0.72.0): 겹치면 주인공에게서 더 먼(뒤에 선) 쪽만 비킨다 — 뒤에서 몰려와도 앞줄이 떠밀려 들어오지 않음
        // 엘리트 · 보스는 밀어낸다 (0.82.0): 급이 높은 쪽 앞에선 낮은 쪽이 늘 비킨다. 급이 같을 때만 먼 쪽이 비킴
        const re = pushRank(e), ro = pushRank(o);
        if (re !== ro) continue;                                    // 급이 다르면 아래 parting() 이 맡는다 (0.95.0)
        if ((re === ro && (e.x - p.x) ** 2 + (e.y - p.y) ** 2 < (o.x - p.x) ** 2 + (o.y - p.y) ** 2)) continue;
        const dx = e.x - o.x, dy = e.y - o.y, min = e.r + o.r, d2 = dx * dx + dy * dy;
        if (d2 < min * min && d2 > 0.01) {
          const d = Math.sqrt(d2), push = (min - d) * 0.5;   // 한쪽만 비키니 0.25 → 0.5 (0.72.0)
          e.x += dx / d * push; e.y += dy / d * push;
        }
      }
    }
    // 닿으면 피해
    if (p.inv <= 0 && (e.x - p.x) ** 2 + (e.y - p.y) ** 2 < (e.r + p.r) ** 2) {
      hurtPlayer(e.dmg);
      if (G.mode === 'over') return;
    }
  }

  tickEshots(dt);
  if (G.mode === 'over') return;

  // 투사체
  for (const b of G.bullets) {
    if (b.boom) {                                                 // 부메랑 길 (0.62.0) — BOOM 설명 참고. 길 위 다음 자리를 정하고 속도로 바꿔 넣는다
      b.rot += dt * 22; b.life += dt;
      const P = b.path;
      if (b.chase) {                                              // 연쇄 (0.109.1): 관통을 다 쓴 뒤 가까운 적으로 곧장 날아가 벰 — 연쇄 수만큼, 그다음 손으로 돌아옴
        let t = b.chase;
        if (t.dead) t = b.chase = b.chain > 0 ? nearestEnemy(b.x, b.y, CHAIN_HOP, b.hit) : null;
        if (!t) { b.chase = null; b.ret = true; continue; }
        const dx = t.x - b.x, dy = t.y - b.y, d = Math.hypot(dx, dy) || 1;
        if (d <= b.sp * dt + t.r) {
          b.x = t.x; b.y = t.y; hurtEnemy(t, b.dmg, b.stun); b.hit.add(t); b.hitAt.set(t, b.life); b.chain--;
          G.fx.push({kind: 'muzzle', x: t.x, y: t.y, t: 0.05});
          b.chase = b.chain > 0 ? nearestEnemy(t.x, t.y, CHAIN_HOP, b.hit) : null;
          if (!b.chase) b.ret = true;
        } else { b.vx = dx / d * b.sp; b.vy = dy / d * b.sp; b.x += b.vx * dt; b.y += b.vy * dt; }
        continue;
      }
      if (b.ret) {                                                // 관통을 다 써서 되돌아오는 중 (0.75.0): 손으로 곧장, 탄속 그대로
        const hx = p.x - b.x, hy = p.y + WPN_CY - b.y, hd = Math.hypot(hx, hy);
        if (hd <= b.sp * dt + 4) { b.dead = true; continue; }
        b.vx = hx / hd * b.sp; b.vy = hy / hd * b.sp; b.boom = 2;
        for (const [e, t] of b.hitAt) if (b.life - t > BOOM.rehit) { b.hit.delete(e); b.hitAt.delete(e); }
      } else {
      b.s += b.sp * dt;
      if (b.s >= P.L) { b.dead = true; continue; }                // 고리를 다 돌면 손에 잡힘
      while (P.cum[b.pi + 1] < b.s) b.pi++;
      const q = (b.s - P.cum[b.pi]) / (P.cum[b.pi + 1] - P.cum[b.pi] || 1), A = P.pts[b.pi], B = P.pts[b.pi + 1];
      const lx = A[0] + (B[0] - A[0]) * q, ly = (A[1] + (B[1] - A[1]) * q) * b.sg, c = Math.cos(b.th), sn = Math.sin(b.th);
      // 기준점 (0.68.0): 던진 자리(땅)에서 지금 손으로 옮겨 간다 — 가는 길은 땅에 고정돼 겨눈 적까지 가고, 오는 길은 걷는 주인공 손으로 돌아온다
      const k = Math.max(0, Math.min(1, (b.s / P.L - BOOM.anchor) / (1 - BOOM.anchor))), wk = k * k * (3 - 2 * k);   // 부드럽게 (smoothstep)
      const ox0 = b.ax + (p.x - b.ax) * wk, oy0 = b.ay + (p.y + WPN_CY - b.ay) * wk;
      const nx = ox0 + lx * c - ly * sn, ny = oy0 + lx * sn + ly * c;   // 던질 때 겨눈 방향으로
      b.vx = (nx - b.x) / dt; b.vy = (ny - b.y) / dt;
      b.boom = b.s < P.L / 2 ? 1 : 2;
      for (const [e, t] of b.hitAt) if (b.life - t > BOOM.rehit) { b.hit.delete(e); b.hitAt.delete(e); }   // 같은 적도 조금 뒤 다시 벤다
      }
    }
    const st = Math.hypot(b.vx, b.vy) * dt, ox = b.x, oy = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt; b.travel += st;
    if (!b.boom && b.travel > b.maxTravel) { b.dead = true; continue; }
    for (const e of G.enemies) {
      if (e.dead || b.hit.has(e)) continue;
      if (b.boom && !b.tgts.has(e) && b.tgts.size >= b.pleft) continue;   // 부메랑: 관통 수만큼 벤 뒤 새 적은 그냥 지나침 (벤 적은 다시 벰)
      if (b.pierce) {                                             // 관통탄: 이번 프레임에 지나온 선분과의 거리
        const dx = b.x - ox, dy = b.y - oy, u = Math.max(0, Math.min(1, ((e.x - ox) * dx + (e.y - oy) * dy) / (dx * dx + dy * dy || 1)));
        if (Math.hypot(ox + dx * u - e.x, oy + dy * u - e.y) > e.r + b.rad) continue;
      } else if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 > (e.r + 5) ** 2) continue;
      hurtEnemy(e, b.dmg, b.stun); b.hit.add(e); if (b.boom) b.hitAt.set(e, b.life);
      if (b.splash) {
        const R = splashR(b.splash), sd = b.dmg * splashPct(b.splash);
        G.fx.push({kind: 'splash', mine: true, x: b.x, y: b.y, r: R, t: 0.25});
        for (const o of G.enemies) if (o !== e && !o.dead && (o.x - b.x) ** 2 + (o.y - b.y) ** 2 < (R + o.r) ** 2) hurtEnemy(o, sd);
      }
      if (b.knock) {                                              // 밀당 (0.63.0): 탄이 지나는 줄 기준 — 당김은 줄 쪽으로 모으고, 밀침은 줄에서 옆으로 흩는다
        const sp = Math.hypot(b.vx, b.vy) || 1, nx = -b.vy / sp, ny = b.vx / sp;   // 줄의 옆(법선)
        const off = (e.x - b.x) * nx + (e.y - b.y) * ny;            // 적이 줄에서 어느 쪽 · 얼마나 떨어졌나
        const side = Math.sign(off) || (Math.random() < 0.5 ? -1 : 1);   // 정통으로 맞으면 아무 쪽
        let v0 = knockV(Math.abs(b.knock)) / (e.wt || 1);          // 무거운 적은 덜 움직임 (거리 = 넉백 ÷ 무게)
        if (b.knock < 0) v0 = -Math.min(v0, Math.abs(off) * KNOCK_DECAY);   // 당김: 줄을 넘어가지 않게 (움직이는 거리 = v0 ÷ 잦아듦)
        e.kbx += nx * side * v0; e.kby += ny * side * v0;
      }
      // 연쇄: 남은 수가 있으면 맞힌 자리에서 아직 안 맞은 가장 가까운 적(CHAIN_HOP 안)으로 방향을 틀어 더 날아간다
      //   관통탄은 관통을 먼저 다 쓰고 (pleft 마리 꿰뚫음) 마지막으로 꿰뚫은 적에서 연쇄한다. 튄 뒤엔 한 마리씩 (관통 없음)
      if (b.boom) {
        b.tgts.add(e);
        if (b.tgts.size >= b.pleft && !b.chased && b.chain > 0) {   // 연쇄 (0.109.1): 관통을 다 쓰면 다음 적으로 (한 번 던질 때 한 번)
          b.chased = true; b.chase = nearestEnemy(e.x, e.y, CHAIN_HOP, b.hit);
          if (b.chase) break;
        }
        if (b.tgts.size >= b.pleft && b.boom === 1) b.ret = true;
        continue;
      }   // 관통을 다 쓰면 가던 길을 접고 손으로 돌아온다 (0.75.0)
      if (b.pierce && --b.pleft > 0) {                            // 관통이 남았으면 꿰뚫고 계속 날아간다
        // 0.93.1: 남은 길(사거리 안)에 꿰뚫을 적이 없으면 관통을 기다리지 않고 바로 연쇄 — 튄 뒤엔 한 마리씩
        if (b.chain > 0 && !enemyAhead(b) && chainBullet(b, e)) { b.pleft = 1; break; }
        continue;
      }
      if (b.chain > 0 && chainBullet(b, e)) break;
      b.dead = true;
      break;
    }
  }

  // 보석
  const magnet = magnetR(G.s);                                  // 획득 범위 (업그레이드 +25% 씩 · 패널티 '무거운 장비' ×0.5)
  for (const g of G.gems) {
    if (g.air) {                                                  // 튀어 오르는 중: 포물선, 땅에 닿으면 한 번 작게 튕기고 멈춤
      g.x += g.vx * dt; g.y += g.vy * dt; g.vz -= GEM_G * dt; g.z += g.vz * dt;
      if (g.z <= 0) { g.z = 0; if (g.vz < -120) { g.vz *= -0.35; g.vx *= 0.5; g.vy *= 0.5; } else g.air = false; }
      continue;
    }
    const dx = p.x - g.x, dy = p.y - g.y, d = Math.hypot(dx, dy);
    if (d < magnet) g.pull = true;
    if (g.pull) { const sp = 420 * dt; g.x += dx / d * Math.min(sp, d); g.y += dy / d * Math.min(sp, d); }
    if (d < p.r + 6) { g.dead = true; gainXp(g.v * G.s.xpMul * (ownsSub('xp2') ? 2 : 1)); }   // 경험치 증가 배율 · 연구 일지 ×2 (0.112.0)
  }
  // 상자: 닿으면 연다 (레벨업 창이 떠 있으면 줄 세워 두었다가 닫힐 때)
  for (const c of G.chests) {
    c.t += dt;
    if (Math.hypot(p.x - c.x, p.y - c.y) < p.r + 14) { c.dead = true; if (G.mode === 'levelup') G.chestQ++; else openChest(); }
  }
  G.chests = G.chests.filter(c => !c.dead);
  // 자석 (0.106.0): 닿으면 필드의 보석을 모두 끌어옴 (공중에 뜬 것은 땅에 닿자마자)
  for (const m of G.mags) {
    m.t += dt;
    if (Math.hypot(p.x - m.x, p.y - m.y) < p.r + 12) { m.dead = true; for (const g of G.gems) g.pull = true; G.fx.push({kind: 'splash', mine: true, x: p.x, y: p.y, r: 40, t: 0.3}); }
  }
  G.mags = G.mags.filter(m => !m.dead);


  G.enemies = G.enemies.filter(e => !e.dead);
  G.bullets = G.bullets.filter(b => !b.dead);
  G.gems = G.gems.filter(g => !g.dead);
  G.fx = G.fx.filter(f => (f.t -= dt) > 0);
  G.texts = G.texts.filter(t => (t.t -= dt) > 0);
}

function gameOver() {

}

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

// ───── 그리기 ─────
// 들썩: 종류마다 뛰는 빠르기(hz) · 높이(amp, 그림 키 비율) · 착지 찌그러짐(sq) · 흔들림(tilt) · 부드러운 오르내림(smooth: 박쥐)
const WALK_STRIDE = 64;   // 주인공 한 걸음 거리(px). 속도 190 이면 초당 약 3 걸음 (그 전: 속도와 상관없이 초당 5.2)
const BOB = {
  survivor: {amp: 0.08, sq: 0.10, tilt: 0.06},
  zombie:   {hz: 1.5, amp: 0.05, sq: 0.06, tilt: 0.10},   // 비틀비틀
  dog:      {hz: 3.6, amp: 0.10, sq: 0.08, tilt: 0.05},   // 다다닥
  brute:    {hz: 1.2, amp: 0.04, sq: 0.06, tilt: 0.07},   // 쿵쿵
  crawler:  {hz: 2.2, amp: 0.02, sq: 0.10, tilt: 0.04},   // 질질
  riot:     {hz: 1.4, amp: 0.04, sq: 0.05, tilt: 0.06},
  bossmid:  {hz: 1.0, amp: 0.04, sq: 0.06, tilt: 0.06},   // 보스: 무겁게
  bossking: {hz: 0.9, amp: 0.03, sq: 0.05, tilt: 0.05},
  spitter:  {hz: 1.6, amp: 0.05, sq: 0.06, tilt: 0.10},
  grenadier:{hz: 1.5, amp: 0.05, sq: 0.06, tilt: 0.08},
  shielder: {hz: 1.0, amp: 0.03, sq: 0.05, tilt: 0.05},   // 무겁게
  bloater:  {hz: 1.2, amp: 0.04, sq: 0.12, tilt: 0.04},   // 출렁
  bossmortar:  {hz: 1.0, amp: 0.04, sq: 0.06, tilt: 0.06},
  bossgeneral: {hz: 0.9, amp: 0.03, sq: 0.05, tilt: 0.05},
};
// ph: 위상(라디안), k: 세기 0~1. 들린 높이(px)를 돌려줌 → 그림자 크기에 씀
function bobOf(name, ph, k, h) {
  const B = BOB[name];
  const hop = B.smooth ? (Math.sin(ph) + 1) / 2 : Math.abs(Math.sin(ph));   // 0 = 땅, 1 = 꼭대기
  return {lift: hop * B.amp * h * k, sy: 1 - (1 - hop) ** 3 * B.sq * k + hop * B.sq * 0.5 * k,
          tilt: Math.sin(B.smooth ? ph : ph * 0.5) * B.tilt * k};
}

// byArea: 적은 **면적**으로 크기를 맞춘다 — 그림 넓이 = (h² × SPRITE_AREA), 가로 · 세로 비율은 그림 그대로. 같은 등급(반지름)이면 같은 넓이
//   주인공은 예전처럼 높이 h
const SPRITE_AREA = 0.55;             // 서 있는 좀비(폭/높이 ≈ 0.53)가 예전과 거의 같은 크기가 되는 값
// 그림 모양 그대로 하얀 판 (번쩍임용) — 그림마다 한 번 만들어 둔다
const WHITE = {};
function whiteOf(name, img) {
  if (WHITE[name]) return WHITE[name];
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  x.globalCompositeOperation = 'source-atop'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  return (WHITE[name] = c);
}
function drawSprite(name, x, y, h, flip, fallback, bob, byArea, white) {
  const img = SPRITES[name];
  const b = bob || {lift: 0, sy: 1, tilt: 0};
  if (!img) { ctx.save(); ctx.translate(0, -b.lift); fallback(); ctx.restore(); return; }
  const foot = y + h * 0.38;                                     // 발밑을 축으로 찌그러뜨린다
  const asp = img.width / img.height;
  const hh = byArea ? h * Math.sqrt(SPRITE_AREA / asp) : h, w = hh * asp;
  ctx.save(); ctx.translate(x, foot - b.lift);
  ctx.rotate(b.tilt);
  ctx.scale((flip ? -1 : 1) / Math.sqrt(b.sy), b.sy);          // 납작해지면 옆으로 퍼짐
  ctx.drawImage(img, -w / 2, -hh, w, hh);
  if (white > 0) {                                               // 번쩍임: 하얀 판을 덮는다
    const a = ctx.globalAlpha; ctx.globalAlpha = a * Math.min(1, white) * 0.85;
    ctx.drawImage(whiteOf(name, img), -w / 2, -hh, w, hh); ctx.globalAlpha = a;
  }
  ctx.restore();
}

// 부메랑 미터 (0.57.2): 날고 있는 동안은 빈 파이. 다 받은 뒤 쿨다운이 도는 동안 주황 파이가 차오르고, 준비되면 노란 파이 가득
// 미터 자리 (0.90.1): 착탄 원 둘레 — 원 반지름 8 + 파이 반지름 8.5 + 2 만큼 떨어져, 무기 수만큼 고르게 (하나면 오른쪽, 둘이면 오른쪽 · 왼쪽 …). 겨눔 · 반동과 상관없음
const METER_RING = 19;
function meterPos(i) {
  const p = G.p, th = i * Math.PI * 2 / Math.max(1, G.weapons.length);
  return {x: p.x + Math.cos(th) * METER_RING, y: p.y + HIT_CY + Math.sin(th) * METER_RING};
}
function boomMeter(w, i) {
  const st = wstat(w.id), R = 7, {x, y} = meterPos(i);
  const ready = !w.out && w.cdT <= 0;
  const k = ready ? 1 : w.out ? 0 : 1 - Math.max(0, w.cdT) / st.reload;
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.beginPath(); ctx.arc(x, y, R + 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = ready ? '#c9a93a' : '#ff9a4a';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.closePath(); ctx.fill();
}
// 방패 미터 (0.90.0): 남은 방패 ÷ 전부 만큼 노랗게 + 남은 수. 다 깨지면 주황 파이가 쿨다운만큼 차오름
function orbitMeter(w, i) {                                    // 다른 무기와 같은 꼴: 남은 방패 ÷ 전부 노란 파이 + 남은 수, 다 깨지면 주황 파이가 재장전만큼
  const st = wstat(w.id), R = 7, {x, y} = meterPos(i);
  // 0.111.5: 숫자 · 파이 = 남은 버팀 총량 (방패마다 남은 버팀의 합, 관통 포함) ÷ 처음 총량 (방패 수 × 버팀)
  const left = w.orb ? w.orb.alive.reduce((a, h) => a + Math.max(0, h), 0) : 0, n = (w.orb ? w.orb.alive.length : orbitN(st)) * orbitHp(st), rl = left === 0;
  const k = rl ? 1 - Math.max(0, w.cdT) / st.reload : Math.min(1, left / n);
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.beginPath(); ctx.arc(x, y, R + 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rl ? '#ff9a4a' : '#c9a93a';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.closePath(); ctx.fill();
  if (!rl) {
    ctx.font = 'bold 8px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.strokeText(left, x, y + 0.5);
    ctx.fillStyle = '#fff'; ctx.fillText(left, x, y + 0.5);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
}
// 날아가는 부메랑: 무기 그림을 돌려 그린다 (그림이 없으면 V 모양)
function drawBoomerang(x, y, rot, len) {
  const img = WEAPON_IMG.boomerang;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  if (img) { const h = len * img.height / img.width; ctx.drawImage(img, -len / 2, -h / 2, len, h); }
  else { ctx.strokeStyle = '#c8955a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
         ctx.beginPath(); ctx.moveTo(-len / 2, len / 4); ctx.lineTo(0, -len / 4); ctx.lineTo(len / 2, len / 4); ctx.stroke(); }
  ctx.restore();
}
function drawWeapon(w, m) {
  if (w.out && WEAPONS[w.id].kind === 'boom' && !w.shots.length) return;   // 던진 부메랑이 손에 없을 때
  const W = WEAPONS[w.id], img = WEAPON_IMG[w.id];
  ctx.save(); ctx.translate(m.hx, m.hy); ctx.rotate(m.a); ctx.scale(1, m.flip);
  if (img) ctx.drawImage(img, -W.pivot[0] * m.len, -W.pivot[1] * m.h, m.len, m.h);
  else { ctx.fillStyle = '#333'; ctx.fillRect(-4, -3, m.len, 6); }
  ctx.restore();
}

function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#1f2125'; ctx.fillRect(0, 0, W, H);             // 아스팔트
  if (!G) return;
  const p = G.p;                                                 // 맞으면 흔들림 (0.87.0) — 흔드는 양은 update 에서 (0.106.1)
  const ox = W / 2 - p.x + (G.skx || 0), oy = H / 2 - p.y + (G.sky || 0);

  // 바닥: 블록 줄 + 큰 간격마다 노란 점선 차선
  ctx.strokeStyle = '#272a2f'; ctx.lineWidth = 1; ctx.beginPath();
  const S = 64;
  for (let x = ((ox % S) + S) % S; x < W; x += S) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = ((oy % S) + S) % S; y < H; y += S) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  const LANE = S * 8;
  ctx.strokeStyle = 'rgba(230,190,60,.28)'; ctx.lineWidth = 4; ctx.setLineDash([36, 28]);
  ctx.lineDashOffset = -ox;
  ctx.beginPath();
  for (let y = ((oy % LANE) + LANE) % LANE; y < H; y += LANE) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset = 0;

  ctx.save(); ctx.translate(ox, oy);

  // 사거리
  ctx.strokeStyle = 'rgba(120,200,255,.12)'; ctx.setLineDash([6, 8]);
  const maxRange = Math.max(...G.weapons.map(w => wstat(w.id).range));
  ctx.beginPath(); ctx.arc(p.x, p.y, maxRange, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);

  // 보석
  for (const g of G.gems) {
    const r = g.v > 1 ? 7 : 5, z = g.z || 0;
    if (z > 0) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(g.x, g.y + 2, r * 0.8, r * 0.3, 0, 0, Math.PI * 2); ctx.fill(); }   // 그림자
    ctx.fillStyle = g.v > 1 ? '#fc4' : '#4cf';
    ctx.save(); ctx.translate(0, -z);
    ctx.beginPath(); ctx.moveTo(g.x, g.y - r); ctx.lineTo(g.x + r * 0.7, g.y); ctx.lineTo(g.x, g.y + r); ctx.lineTo(g.x - r * 0.7, g.y); ctx.fill(); ctx.restore();
  }

  // 상자: 등급 색으로 빛나며 살짝 뜀
  for (const c of G.chests) drawChest(c.x, c.y - 4 - Math.abs(Math.sin(c.t * 3)) * 4, gradeCol(c.g));
  // 자석 (0.106.0): 청록 빛 + 살짝 뜀
  for (const m of G.mags) {
    const y = m.y - 4 - Math.abs(Math.sin(m.t * 3)) * 4, sz = 20;
    ctx.save(); ctx.shadowColor = '#3ef'; ctx.shadowBlur = 10;
    if (MAG_IMG.complete && MAG_IMG.naturalWidth) ctx.drawImage(MAG_IMG, m.x - sz / 2, y - sz / 2, sz, sz); else circle(m.x, y, 7, '#e44');
    ctx.restore();

  const view = (x, y, m) => x + ox > -m && x + ox < W + m && y + oy > -m && y + oy < H + m;
  const es = G.enemies.filter(e => view(e.x, e.y, e.r * 4)).sort((a, b) => a.y - b.y);
  drawEshots();
  // 보스 예고 (땅에): 돌진 = 붉은 띠, 범위 = 차오르는 붉은 원
  for (const e of G.enemies) {
    if (!e.boss) continue;
    if (e.st === 'aimC') {
      const L = DASH_SPD * DASH_T, k = 1 - Math.max(0, e.bt) / 0.8;
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.dir);
      ctx.fillStyle = `rgba(255,60,40,${0.15 + 0.25 * k})`; ctx.fillRect(0, -e.r * 0.8, L, e.r * 1.6);
      ctx.strokeStyle = 'rgba(255,90,60,.8)'; ctx.lineWidth = 2; ctx.strokeRect(0, -e.r * 0.8, L, e.r * 1.6);
      ctx.restore();
    } else if (e.st === 'aimS') {
      const k = 1 - Math.max(0, e.bt) / 1.0;
      ctx.fillStyle = 'rgba(255,60,40,.18)'; ctx.beginPath(); ctx.arc(e.x, e.y, SLAM_R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,60,40,.3)'; ctx.beginPath(); ctx.arc(e.x, e.y, SLAM_R * k, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,90,60,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, SLAM_R, 0, Math.PI * 2); ctx.stroke();

  }

    const bob = bobOf(e.type, G.t * Math.PI * 2 * BOB[e.type].hz + e.ph, 1, eh), sh = 1 - bob.lift / eh * 2;

    }
    // 왼쪽을 보는 그림은 오른쪽으로 갈 때, 오른쪽을 보는 그림은 왼쪽으로 갈 때 뒤집는다
    drawSprite(e.type, e.x, e.y, eh, T.faceLeft ? e.vx > 0 : e.vx < 0, () => circle(e.x, e.y, e.r, e.flash > 0 ? '#fff' : T.color), bob, true, e.flash / FLASH_T);
    if (e.elite != null) {                                        // 빛을 한 번 더 겹쳐 테두리를 또렷하게
      drawSprite(e.type, e.x, e.y, eh, T.faceLeft ? e.vx > 0 : e.vx < 0, () => {}, bob, true);
      ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
    }
    ctx.globalAlpha = 1;
    if (e.boss) bossBar(e);                                       // 보스 체력 줄도 머리 위 (0.86.0 — 그 전엔 위쪽 정보칸)
    else if (e.hp < e.maxHp) {
      ctx.fillStyle = '#300'; ctx.fillRect(e.x - e.r, e.y - e.r * 2.3, e.r * 2, 3);
      ctx.fillStyle = '#fff'; ctx.fillRect(e.x - e.r, e.y - e.r * 2.3, e.r * 2 * (e.gk ?? 1), 3);
      ctx.fillStyle = '#f44'; ctx.fillRect(e.x - e.r, e.y - e.r * 2.3, e.r * 2 * e.hp / e.maxHp, 3);
    }

    if (e.shield > 0) shieldMark(e.x, e.y - e.r * 2.3 - 9, e.shield);   // 방패 횟수: 체력 줄 위 가운데 (0.84.0)
  }

    if (!view(a.x, a.y, a.r * 4)) continue;

    const bob = bobOf(a.type, G.t * Math.PI * 2 * BOB[a.type].hz + a.ph, 1, eh);
    ctx.strokeStyle = '#5f8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(a.x, a.y + a.r * 0.8, a.r * 1.1, a.r * 0.45, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.save(); ctx.shadowColor = '#5f8'; ctx.shadowBlur = 10;
    drawSprite(a.type, a.x, a.y, eh, T.faceLeft ? a.vx > 0 : a.vx < 0, () => circle(a.x, a.y, a.r, '#4a4'), bob, true, (a.flash || 0) / FLASH_T);

    ctx.fillStyle = '#5f8'; ctx.fillRect(a.x - a.r, a.y - a.r * 2.3, a.r * 2 * Math.max(0, a.hp) / a.maxHp, 3);
