<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>서바이버</title>
<link rel="icon" href="../favicon.svg">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#12141a;color:#e8e8ee;font-family:system-ui,"Malgun Gothic",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  #pauseBtn{position:fixed;right:10px;top:6px;pointer-events:auto;padding:4px 12px;font-size:14px;background:#2a2d38;color:#ccd}
  canvas{display:block;width:100vw;height:100vh}
  .top{position:fixed;left:0;right:0;top:0;padding:8px 12px;display:flex;gap:14px;align-items:center;font-size:14px;pointer-events:none}
  .top a{pointer-events:auto;color:#9ab;text-decoration:none}
  .top b{color:#fff}
  .bars{position:fixed;left:12px;right:12px;top:36px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
  .bar{height:10px;background:#2a2d38;border-radius:5px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0}
  #hpBar>i{background:linear-gradient(90deg,#d33,#f66)}
  #xpBar>i{background:linear-gradient(90deg,#39f,#7cf)}
  .stats{position:fixed;left:12px;bottom:10px;font-size:12px;line-height:1.5;color:#aab;pointer-events:none;white-space:pre}
  .overlay{position:fixed;inset:0;background:rgba(8,9,14,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .overlay[hidden]{display:none}
  .overlay h2{margin:0;font-size:28px}
  .cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .up{width:200px;padding:16px;border-radius:12px;background:#232634;border:2px solid #3a3f55;cursor:pointer;text-align:center;transition:transform .08s}
  .up:hover{transform:translateY(-3px);border-color:#7cf}
  .up.ext{border-color:#a7f}
  .up .key{display:inline-block;width:34px;height:34px;line-height:32px;border-radius:8px;background:#fff;color:#111;font-weight:700;font-size:18px;margin-bottom:8px}
  .up .nm{font-size:17px;font-weight:700}
  .up .lv{font-size:12px;color:#9ab;margin:4px 0 8px}
  .up .ds{font-size:13px;color:#ccd}
  .up .tag{font-size:11px;color:#c9f}
  .result{font-size:16px;line-height:1.8;text-align:center}
  .hint{font-size:13px;color:#9ab}
  /* 월드 선택 화면: 월드는 위, 캐릭터는 아래 — 둘 다 가로 스크롤 */
  #worldSel{justify-content:flex-start;padding:56px 0 28px;gap:12px}
  #worldSel h2{margin-top:8px}
  #startHint{padding:0 16px;text-align:center}
  .hscroll{display:flex;gap:12px;width:100%;overflow-x:auto;overflow-y:hidden;padding:6px 16px 12px;
           scroll-snap-type:x mandatory;scroll-padding:0 16px;touch-action:pan-x;-webkit-overflow-scrolling:touch;
           scrollbar-width:thin;scrollbar-color:#3a3f55 transparent}
  .hscroll>*{flex:0 0 auto;scroll-snap-align:start}
  .hscroll::after{content:'';flex:0 0 4px;margin-right:auto}   /* 끝 칸 오른쪽 여백 */
  .hscroll>:first-child{margin-left:auto}                       /* 넘치지 않으면 가운데, 넘치면 왼쪽부터 스크롤 */
  .charSec{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
  .world{width:240px;padding:14px 16px;border-radius:12px;background:#232634;border:2px solid #3a3f55;color:#e8e8ee;text-align:left;cursor:pointer}
  .world:hover:not(:disabled){border-color:#7cf}
  .world:disabled{opacity:.45;cursor:default}
  .world .wn{font-size:18px;font-weight:700}
  .world .wd{font-size:12px;color:#9ab;margin-top:4px}
  .world .ok{color:#7e7;font-size:12px;margin-left:6px}
  .char{width:150px;padding:10px;border-radius:12px;background:#232634;border:2px solid #3a3f55;color:#e8e8ee;cursor:pointer;text-align:center}
  .char.on{border-color:#fc4;box-shadow:0 0 0 2px rgba(255,204,68,.25)}
  .char img{width:72px;height:96px;object-fit:contain;display:block;margin:0 auto 4px}
  .char .cn{font-weight:700}
  .char .ct{font-size:11px;color:#9ab;margin-top:4px}
  .slotrow{display:flex;gap:3px;justify-content:center;align-items:center;font-size:11px;color:#9ab;margin-top:4px}
  .slot{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:4px;border:1px solid #6a7090;font-size:10px;color:#dde}
  .slot.w{border-color:#e9a23b}
  .slot.s{border-color:#5fb0e8}
  .slot.empty{border-style:dashed;opacity:.6}
  .sec{font-size:12px;color:#9ab;letter-spacing:.1em}
  #slots{position:fixed;left:12px;bottom:84px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
  #slots[hidden]{display:none}
  #slots .slotrow{justify-content:flex-start}
  #slots .slot{height:20px;font-size:11px;padding:0 6px}
  .up .aff{font-size:11px;color:#e9a23b;margin-top:6px}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btns button.sub{background:#3a3f55}
  button:disabled{opacity:.4;cursor:default}
  button{font:inherit;padding:10px 22px;border-radius:8px;border:0;background:#39f;color:#fff;cursor:pointer}
  /* 좁은 화면: 카드를 세로로 쌓고 줄인다 (아래 규칙보다 뒤에 있어야 이긴다) */
  @media (max-width:700px){.char{width:120px}.world{width:200px}#worldSel{padding-top:44px}#slots{bottom:70px}.cards{flex-direction:column;gap:10px}.up{width:min(80vw,280px);padding:10px}.up .key{width:28px;height:28px;line-height:26px;font-size:15px;margin-bottom:4px}.up .lv{margin:2px 0 4px}.top{gap:8px;font-size:12px}.top .hint{display:none}.stats{font-size:10px}}
  /* 버전 — 우하단, 모든 창(레벨업 · 일시정지 · 게임오버) 위에 */
  #ver{position:fixed;right:8px;bottom:6px;z-index:2147483647;font-size:11px;color:rgba(255,255,255,.55);pointer-events:none;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top">
  <a href="../index.html">← 프로토타입 목록</a>
  <span>Lv <b id="lv">1</b></span>
  <span>시간 <b id="time">0:00</b></span>
  <span>처치 <b id="kills">0</b></span>
  <span class="hint">WASD 이동 · P 일시정지</span>
  <button id="pauseBtn">II</button>
</div>
<div class="bars">
  <div class="bar" id="hpBar"><i></i></div>
  <div class="bar" id="xpBar"><i></i></div>
</div>
<div id="slots" hidden></div>
<div class="stats" id="stats"></div>

<div class="overlay" id="worldSel">
  <h2>서바이버</h2>
  <div class="hint" id="startHint">캐릭터와 월드를 고르면 무기를 고른다. WASD 로 피하고, 총은 저절로 쏜다. 레벨업하면 1 · 2 · 3.</div>
  <div class="sec">월드</div>
  <div class="hscroll" id="worldList"></div>
  <div class="charSec">
    <div class="sec">캐릭터</div>
    <div class="hscroll" id="charList"></div>
  </div>
</div>
<div class="overlay" id="wpnSel" hidden>
  <h2>무기 선택</h2>
  <div class="hint" id="wpnHint">시작할 무기를 고른다 (1 · 2 · 3)</div>
  <div class="cards" id="wpnCards"></div>
  <div class="btns"><button class="sub" id="wpnBack">뒤로</button></div>
</div>
<div class="overlay" id="levelup" hidden>
  <h2>레벨 업!</h2>
  <div class="cards" id="cards"></div>
  <div class="hint" id="luHint">1 · 2 · 3 또는 클릭</div>
</div>
<div class="overlay" id="pause" hidden>
  <h2>일시정지</h2>
  <div class="hint" id="pauseHint">P / Esc 로 계속</div>
  <div class="btns"><button class="sub" id="pauseExit">나가기</button></div>
</div>
<div class="overlay" id="over" hidden>
  <h2>쓰러졌다</h2>
  <div class="result" id="result"></div>
  <div class="btns"><button class="sub" id="overExit">나가기</button><button id="retryBtn">다시하기 (R)</button></div>
</div>
<div class="overlay" id="clear" hidden>
  <h2 id="clearTitle">클리어!</h2>
  <div class="result" id="clearResult"></div>
  <div class="btns"><button class="sub" id="clearExit">나가기</button><button class="sub" id="clearRetry">다시하기 (R)</button><button id="clearNext">다음 월드 (N)</button></div>
</div>

<div id="ver"></div>

<script>
'use strict';
// 버전 — 업데이트마다 올린다. 기능 추가 = 가운데(0.x.0), 수정 · 작은 변경 = 끝(0.0.x). 기록은 docs/기능.md 의 '# 버전'
const VERSION = '0.8.3';
document.getElementById('ver').textContent = 'v' + VERSION;
// ───── 설정 ─────
// 그림이 보는 방향 — true 면 왼쪽을 봄 (뽑은 그림을 눈으로 보고 정함)
const FACE = {survivor: false, zombie: true, dog: true, brute: false};
// 현대물 — 도심의 좀비들. faceLeft: 그림이 왼쪽을 보면 true (오른쪽으로 갈 때 뒤집음)
const ENEMY_TYPES = {
  zombie: {hp: 12, def: 0, spd: 70,  dmg: 8,  r: 15, xp: 1, from: 0,   w: 10, color: '#7a9a6a', faceLeft: FACE.zombie},
  dog:    {hp: 6,  def: 0, spd: 135, dmg: 5,  r: 12, xp: 1, from: 60,  w: 6,  color: '#8a6a4a', faceLeft: FACE.dog},
  brute:  {hp: 70, def: 3, spd: 42,  dmg: 18, r: 24, xp: 5, from: 180, w: 2,  color: '#888',    faceLeft: FACE.brute},
};
const HP_PER_MIN = 0.45;        // 분당 적 체력 +45%
const DEF_PER_MIN = 1.5;        // 분당 적 방어 +1.5 (생길 때 정해짐)
// 받는 피해 = 공격력 - 방어력, 그래도 최소 1 (플레이어 · 적 같은 규칙)
const armor = (dmg, def) => Math.max(1, dmg - def);
const MAX_ENEMIES = 500;
const EXT_FROM_LV = 3;          // 확장 업그레이드는 이 레벨부터 후보에

const SPRITES = {};             // 없으면 도형으로
const WEAPON_IMG = {};          // 무기 그림 — 총구가 오른쪽을 보게 뽑음 (tools/make_weapon.py)
for (const n of ['pistol']) { const im = new Image(); im.onload = () => { WEAPON_IMG[n] = im; }; im.src = `images/weapon_${n}.png?v=${VERSION}`; }
for (const n of ['survivor', 'zombie', 'dog', 'brute']) {
  const img = new Image();
  img.onload = () => { SPRITES[n] = img; };
  img.src = `images/portrait_${n}.png?v=${VERSION}`;   // 버전을 붙여 예전 그림이 캐시에 남지 않게
}

// wpn: 무기 업그레이드 — 가진 무기 중 하나라도 affects 에 이 id 가 있어야 후보에 나온다. 카드 밑에 영향받는 무기 표시
const UPGRADES = [
  {id: 'dmg',    nm: '공격력',     ds: '피해 +20%',            max: 99, wpn: true, apply: s => s.dmgMul *= 1.2},
  {id: 'rate',   nm: '공격속도',   ds: '쿨다운 ×0.85',         max: 99, wpn: true, apply: s => s.cdMul *= 0.85},
  {id: 'range',  nm: '사거리',     ds: '사거리 +15%',          max: 99, wpn: true, apply: s => s.rangeMul *= 1.15},
  {id: 'hp',     nm: '체력',       ds: '최대 체력 +25, 회복',  max: 99, apply: (s, p) => { p.maxHp += 25; p.hp = Math.min(p.maxHp, p.hp + 25); }},
  {id: 'def',    nm: '방어력',     ds: '받는 피해 -2',         max: 99, apply: s => s.def += 2},
  {id: 'count',  nm: '투사체 +1',  ds: '부채꼴로 한 발 더',    max: 5, ext: true, wpn: true, apply: s => s.count++},
  {id: 'burst',  nm: '연속공격 +1',ds: '한 번에 한 번 더 쏜다',max: 5, ext: true, wpn: true, apply: s => s.burst++},
  {id: 'knock',  nm: '넉백',       ds: '맞은 적을 뒤로 밀어낸다', max: 5, ext: true, wpn: true, apply: s => s.knock++},
  {id: 'splash', nm: '스플래시',   ds: '맞은 지점 둘레 피해',  max: 5, ext: true, wpn: true, apply: s => s.splash++},
];

// ───── 무기 ─────
// affects: 영향받는 업그레이드 id. 능력치는 기본값 — 업그레이드 배율이 곱해진다
const WEAPONS = {
  pistol: {nm: '권총', ds: '가장 가까운 적에게 한 발씩. 무난한 기본 무기',
           dmg: 10, cd: 0.75, range: 280, spd: 620,
           // 그림: 화면 길이(px) · 손잡이 축(그림 안 비율) · 총구(그림 안 비율) · 도는 빠르기(라디안/초)
           len: 22, pivot: [0.28, 0.5], muzzle: [1.0, 0.22], turn: 16,
           affects: ['dmg', 'rate', 'range', 'count', 'burst', 'knock', 'splash']},
};
const UNLOCKED_WEAPONS = ['pistol'];   // 해금된 무기 (해금 방식은 미정 — 지금은 권총만)

// 무기 한 자루의 지금 능력치 (업그레이드 중 영향받는 것만 적용)
function wstat(id) {
  const W = WEAPONS[id], s = G.s, a = k => W.affects.includes(k), c = G.char;
  return {
    dmg: W.dmg * (a('dmg') ? s.dmgMul : 1) * (c.wDmgMul || 1),
    cd: W.cd * (a('rate') ? s.cdMul : 1),
    range: W.range * (a('range') ? s.rangeMul : 1),
    spd: W.spd,
    count: 1 + (a('count') ? s.count : 0),
    burst: 1 + (a('burst') ? s.burst : 0),
    knock: a('knock') ? s.knock : 0,
    splash: a('splash') ? s.splash : 0,
  };
}
const affectedBy = uid => G.weapons.filter(w => WEAPONS[w.id].affects.includes(uid)).map(w => WEAPONS[w.id].nm);

// ───── 캐릭터 ─────
// wSlots · sSlots: 무기 · 보조 슬롯 수. 특징은 docs/기획_캐릭터.md
const CHARACTERS = [
  {id: 'survivor', nm: '생존자', sprite: 'survivor', wSlots: 2, sSlots: 2, hp: 100, speed: 190, trait: '특징 없음 — 기준 캐릭터'},
];
let charIdx = Math.max(0, CHARACTERS.findIndex(c => c.id === localStorage.getItem('survivor.char')));
const slotRow = (label, n, cls, items = []) =>
  `<div class="slotrow">${label}${Array.from({length: n}, (_, i) => items[i]
    ? `<span class="slot ${cls}">${items[i]}</span>` : `<span class="slot ${cls} empty"></span>`).join('')}</div>`;
const splashR = lv => 45 + (lv - 1) * 12;
const splashPct = lv => 0.4 + (lv - 1) * 0.15;
const knockV = lv => 320 + (lv - 1) * 200;   // 처음 속도. 밀리는 거리 ≈ v/8 (Lv1 40px, 레벨당 +25px)

// ───── 상태 ─────
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}
addEventListener('resize', resize); resize();

let G;   // 판 상태

// ───── 동적 조이스틱 (터치 · 마우스 드래그) ─────
// 누른 곳이 중심. 반지름 JOY_R 밖으로 끌면 중심이 손가락을 따라온다 (방향을 바로 틀 수 있게)
const JOY_R = 60, JOY_DEAD = 8;
const joy = {id: null, bx: 0, by: 0, x: 0, y: 0};
function joyVec() {
  const dx = joy.x - joy.bx, dy = joy.y - joy.by, d = Math.hypot(dx, dy);
  if (d < JOY_DEAD) return {x: 0, y: 0};
  const k = Math.min(1, d / JOY_R) / d;
  return {x: dx * k, y: dy * k};
}
cv.addEventListener('pointerdown', e => {
  if (joy.id !== null) return;                                  // 손가락 하나만
  joy.id = e.pointerId; joy.bx = joy.x = e.clientX; joy.by = joy.y = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  joy.x = e.clientX; joy.y = e.clientY;
  const dx = joy.x - joy.bx, dy = joy.y - joy.by, d = Math.hypot(dx, dy);
  if (d > JOY_R) { joy.bx = joy.x - dx / d * JOY_R; joy.by = joy.y - dy / d * JOY_R; }
});
const joyEnd = e => { if (e.pointerId === joy.id) joy.id = null; };
cv.addEventListener('pointerup', joyEnd);
cv.addEventListener('pointercancel', joyEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());

// 터치 기기면 안내 글을 바꾼다
if (matchMedia('(pointer: coarse)').matches) {
  document.getElementById('startHint').textContent = '캐릭터와 월드를 고르면 무기를 고른다. 화면을 누른 채 끌면 움직이고, 총은 저절로 쏜다.';
  document.getElementById('luHint').textContent = '카드를 누른다';
  document.getElementById('pauseHint').textContent = '화면을 누르면 계속';
  document.getElementById('wpnHint').textContent = '시작할 무기를 누른다';
}
// ───── 월드 ─────
// 한 월드 = dur 초 버티면 클리어. 중간보스 · 마지막 보스는 아직 미정
const WORLDS = [
  {id: 1, name: '월드 1', desc: '도심 — 좀비 · 들개 · 거구 좀비', dur: 600},
];
// PC: 마우스 휠을 가로 스크롤로
for (const id of ['worldList', 'charList']) $(id).addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.currentTarget.scrollLeft += e.deltaY; e.preventDefault(); }
}, {passive: false});
const WORLD_SLOTS = 3;           // 선택 화면에 보일 칸 수 (없는 월드는 '준비 중')
const recKey = w => 'survivor.w' + w;
const getRec = w => JSON.parse(localStorage.getItem(recKey(w)) || '{"t":0,"kills":0,"clear":false}');

function showWorlds() {
  G = null;
  const keep = [$('worldList').scrollLeft, $('charList').scrollLeft];   // 다시 그려도 스크롤 자리 유지
  ['over', 'clear', 'levelup', 'pause', 'wpnSel'].forEach(id => $(id).hidden = true);
  const cl = $('charList'); cl.innerHTML = '';
  CHARACTERS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'char' + (i === charIdx ? ' on' : '');
    b.innerHTML = `<img src="images/portrait_${c.sprite}.png?v=${VERSION}" alt=""><div class="cn">${c.nm}</div>
      ${slotRow('무기 ', c.wSlots, 'w')}${slotRow('보조 ', c.sSlots, 's')}<div class="ct">${c.trait}</div>`;
    b.onclick = () => { charIdx = i; localStorage.setItem('survivor.char', c.id); showWorlds(); };
    cl.appendChild(b);
  });
  const box = $('worldList'); box.innerHTML = '';
  for (let i = 0; i < WORLD_SLOTS; i++) {
    const w = WORLDS[i], b = document.createElement('button');
    b.className = 'world';
    if (!w) {
      b.disabled = true;
      b.innerHTML = `<div class="wn">월드 ${i + 1}</div><div class="wd">준비 중</div>`;
    } else {
      const r = getRec(w.id);
      b.innerHTML = `<div class="wn">${w.name}${r.clear ? '<span class="ok">클리어</span>' : ''}</div>
        <div class="wd">${w.desc} · ${fmt(w.dur)}</div>
        <div class="wd">${r.t ? `최고 ${fmt(r.t)} · 처치 ${r.kills}` : '기록 없음'}</div>`;
      b.onclick = () => showWeaponPick(i);
    }
    box.appendChild(b);
  }
  $('worldSel').hidden = false;
  $('worldList').scrollLeft = keep[0]; $('charList').scrollLeft = keep[1];
}

function saveRec() {
  const r = getRec(G.world.id), nt = G.t > r.t, nk = G.kills > r.kills;
  r.t = Math.max(r.t, G.t); r.kills = Math.max(r.kills, G.kills);
  if (G.mode === 'clear') r.clear = true;
  localStorage.setItem(recKey(G.world.id), JSON.stringify(r));
  return `생존 <b>${fmt(G.t)}</b>${nt ? ' (신기록)' : ''} · 처치 <b>${G.kills}</b>${nk ? ' (신기록)' : ''} · 레벨 <b>${G.lv}</b><br>
    <span class="hint">${G.world.name} 최고 기록 — 생존 ${fmt(r.t)} · 처치 ${r.kills}</span>`;
}

function worldClear() {
  G.mode = 'clear'; joy.id = null;
  $('clearTitle').textContent = `${G.world.name} 클리어!`;
  $('clearResult').innerHTML = saveRec();
  const next = WORLDS[G.wi + 1];
  $('clearNext').disabled = !next;
  $('clearNext').textContent = next ? '다음 월드 (N)' : '다음 월드 (준비 중)';
  $('clear').hidden = false;
}

// 월드를 시작할 때 무기를 고른다 (해금된 것 중)
let pickWi = 0;
function showWeaponPick(wi) {
  pickWi = wi; G = null;
  ['worldSel', 'over', 'clear', 'levelup', 'pause'].forEach(id => $(id).hidden = true);
  const box = $('wpnCards'); box.innerHTML = '';
  UNLOCKED_WEAPONS.forEach((id, i) => {
    const W = WEAPONS[id], d = document.createElement('div');
    d.className = 'up';
    d.innerHTML = `<div class="key">${i + 1}</div><div class="nm">${W.nm}</div>
      <div class="lv">피해 ${W.dmg} · 쿨다운 ${W.cd}s · 사거리 ${W.range}</div><div class="ds">${W.ds}</div>`;
    d.onclick = () => newGame(wi, id);
    box.appendChild(d);
  });
  $('wpnSel').hidden = false;
}

function newGame(wi, weaponId) {
  const C = CHARACTERS[charIdx];
  G = {
    wi, world: WORLDS[wi], char: C,
    weapons: [newWeapon(weaponId)], subs: [],
    mode: 'play', t: 0, kills: 0, lv: 1, xp: 0, pendingLv: 0,
    p: {x: 0, y: 0, r: 14, speed: C.speed, hp: C.hp, maxHp: C.hp, inv: 0, face: 1, walk: 0, move: 0},
    s: {dmgMul: 1, cdMul: 1, rangeMul: 1, def: 0, count: 0, burst: 0, knock: 0, splash: 0},
    ups: {},
    enemies: [], bullets: [], gems: [], fx: [], texts: [],
    spawnAcc: 0, nextWave: 60, choices: [], inputLock: 0,
  };
  for (const u of UPGRADES) G.ups[u.id] = 0;
  ['worldSel', 'wpnSel', 'over', 'clear', 'levelup', 'pause'].forEach(id => $(id).hidden = true);
}

// ───── 입력 ─────
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!G) {                                                     // 월드 · 무기 선택: 숫자
    const i = {Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2}[e.code];
    if (!$('wpnSel').hidden) { if (UNLOCKED_WEAPONS[i]) newGame(pickWi, UNLOCKED_WEAPONS[i]); else if (e.code === 'Escape') showWorlds(); }
    else if (WORLDS[i]) showWeaponPick(i);
    return;
  }
  if (G.mode === 'levelup') {
    const i = {Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2}[e.code];   // 이동 키(WASD)와 겹치지 않게 숫자
    if (i !== undefined && !e.repeat) choose(i);
  } else if (G.mode === 'over' || G.mode === 'clear') {
    if (e.code === 'KeyR') showWeaponPick(G.wi);
    else if (e.code === 'KeyN' && G.mode === 'clear' && WORLDS[G.wi + 1]) showWeaponPick(G.wi + 1);
    else if (e.code === 'Escape') showWorlds();
  } else if (e.code === 'KeyP' || e.code === 'Escape') {
    togglePause();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
// 창을 벗어나면 멈추고, 돌아오면 다시 간다. P 로 직접 멈춘 것은 돌아와도 그대로
addEventListener('blur', () => { for (const k in keys) keys[k] = false; joy.id = null; if (G && G.mode === 'play') { togglePause(); G.autoPaused = true; } });
addEventListener('focus', () => { if (G && G.mode === 'pause' && G.autoPaused) togglePause(); });
$('pauseBtn').onclick = e => { e.currentTarget.blur(); if (G) togglePause(); };
$('pause').onclick = () => { if (G && G.mode === 'pause') togglePause(); };
$('retryBtn').onclick = () => showWeaponPick(G.wi);
$('clearRetry').onclick = () => showWeaponPick(G.wi);
$('clearNext').onclick = () => showWeaponPick(G.wi + 1);
$('wpnBack').onclick = () => showWorlds();
$('overExit').onclick = $('clearExit').onclick = () => showWorlds();
$('pauseExit').onclick = e => { e.stopPropagation(); showWorlds(); };

function togglePause() {
  G.autoPaused = false;
  if (G.mode === 'play') { G.mode = 'pause'; $('pause').hidden = false; }
  else if (G.mode === 'pause') { G.mode = 'play'; $('pause').hidden = true; }
}

// ───── 레벨업 ─────
const xpNeed = lv => 5 + (lv - 1) * 4;

function openLevelUp() {
  const pool = UPGRADES.filter(u => G.ups[u.id] < u.max && (!u.ext || G.lv >= EXT_FROM_LV)
    && (!u.wpn || affectedBy(u.id).length));                     // 영향받는 무기가 없으면 안 나온다
  if (G.weapons.length < G.char.wSlots)                         // 빈 무기 슬롯 → 해금된 새 무기
    for (const id of UNLOCKED_WEAPONS) if (!G.weapons.some(w => w.id === id))
      pool.push({id: 'new_' + id, nm: '새 무기: ' + WEAPONS[id].nm, ds: WEAPONS[id].ds, max: 1, newWeapon: id,
                 apply: () => G.weapons.push(newWeapon(id))});
  const picks = [];
  while (picks.length < 3 && pool.length) {
    const tot = pool.reduce((a, u) => a + (u.ext ? 2 : 3), 0);
    let r = Math.random() * tot, k = 0;
    for (; k < pool.length; k++) { r -= pool[k].ext ? 2 : 3; if (r <= 0) break; }
    picks.push(pool.splice(Math.min(k, pool.length - 1), 1)[0]);
  }
  G.choices = picks;
  G.mode = 'levelup';
  G.inputLock = 0.35;
  const box = $('cards'); box.innerHTML = '';
  picks.forEach((u, i) => {
    const d = document.createElement('div');
    d.className = 'up' + (u.ext ? ' ext' : '');
    const lv = G.ups[u.id] || 0;
    let ds = u.ds;
    if (u.id === 'splash') ds = `반경 ${splashR(lv + 1)} · 피해 ${Math.round(splashPct(lv + 1) * 100)}%`;
    d.innerHTML = `<div class="key">${i + 1}</div><div class="nm">${u.nm}</div>
      ${u.newWeapon ? '<div class="lv">무기 슬롯에 추가</div>' : `<div class="lv">Lv ${lv} → ${lv + 1}${u.max < 99 ? ' / ' + u.max : ''}</div>`}
      <div class="ds">${ds}</div>${u.ext ? '<div class="tag">확장</div>' : ''}
      ${u.wpn ? `<div class="aff">영향: ${affectedBy(u.id).join(' · ')}</div>` : ''}`;
    d.onclick = () => choose(i, true);
    box.appendChild(d);
  });
  $('levelup').hidden = false;
}

function choose(i, click) {
  if (G.mode !== 'levelup' || G.inputLock > 0) return;          // 창이 뜨자마자 누른 탭 · 키는 무시
  const u = G.choices[i]; if (!u) return;
  G.ups[u.id] = (G.ups[u.id] || 0) + 1;
  u.apply(G.s, G.p);
  $('levelup').hidden = true;
  G.mode = 'play';
  if (G.pendingLv > 0) { G.pendingLv--; openLevelUp(); }
}

function gainXp(n) {
  G.xp += n;
  while (G.xp >= xpNeed(G.lv)) {
    G.xp -= xpNeed(G.lv); G.lv++;
    if (G.mode === 'levelup') G.pendingLv++; else openLevelUp();
  }
}

// ───── 적 ─────
function spawnEnemy() {
  if (G.enemies.length >= MAX_ENEMIES) return;
  const types = Object.entries(ENEMY_TYPES).filter(([, t]) => G.t >= t.from);
  let r = Math.random() * types.reduce((a, [, t]) => a + t.w, 0), name = types[0][0];
  for (const [n, t] of types) { r -= t.w; if (r <= 0) { name = n; break; } }
  const T = ENEMY_TYPES[name];
  const ang = Math.random() * Math.PI * 2, dist = Math.hypot(W, H) / 2 + 60;
  const hpMul = 1 + HP_PER_MIN * G.t / 60;
  const hp = T.hp * hpMul, def = T.def + DEF_PER_MIN * G.t / 60;
  G.enemies.push({type: name, x: G.p.x + Math.cos(ang) * dist, y: G.p.y + Math.sin(ang) * dist,
    r: T.r, hp, maxHp: hp, def, spd: T.spd * (0.9 + Math.random() * 0.2), dmg: T.dmg, xp: T.xp, flash: 0, vx: 0, kbx: 0, kby: 0, ph: Math.random() * Math.PI * 2});
}

function nearestEnemy(x, y, maxD, skip) {
  let best = null, bd = maxD * maxD;
  for (const e of G.enemies) {
    if (e.dead || (skip && skip.has(e))) continue;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function hurtEnemy(e, dmg) {
  if (e.dead) return;
  const real = armor(dmg, e.def);
  e.hp -= real; e.flash = 0.1;
  G.texts.push({x: e.x, y: e.y - e.r, v: Math.round(real), t: 0.6, weak: real <= dmg * 0.5});   // 방어에 반 넘게 막히면 회색
  if (e.hp <= 0) {
    e.dead = true; G.kills++;
    G.gems.push({x: e.x, y: e.y, v: e.xp, pull: false});
  }
}

// ───── 공격 ─────
const newWeapon = id => ({id, cdT: 0, shots: [], aim: 0, kick: 0});

// 무기 자세: 손 위치 · 각도 · 총구 위치. 무기가 둘이면 손을 위아래로 나눈다
function weaponPose(w, i) {
  const p = G.p, W = WEAPONS[w.id], a = w.aim, c = Math.cos(a), sn = Math.sin(a);
  const img = WEAPON_IMG[w.id], len = W.len, h = img ? len * img.height / img.width : len * 0.6;
  const back = w.kick * 5;                                       // 반동: 쏘면 뒤로 살짝
  const hx = p.x + c * (9 - back), hy = p.y - 2 + (i ? 7 : 0) + sn * (9 - back);
  const flip = c < 0 ? -1 : 1;                                   // 왼쪽을 보면 위아래를 뒤집어 손잡이가 아래로
  const mx = (W.muzzle[0] - W.pivot[0]) * len, my = (W.muzzle[1] - W.pivot[1]) * h * flip;
  return {hx, hy, a, flip, len, h, mx: hx + c * mx - sn * my, my: hy + sn * mx + c * my};
}

// 총 계열: 가장 가까운 적에게, 투사체 수만큼 부채꼴로. 총구에서 나간다
function fireGun(st, w, i) {
  const p = G.p;
  const tgt = nearestEnemy(p.x, p.y, st.range);
  if (!tgt) return;
  w.aim = Math.atan2(tgt.y - p.y, tgt.x - p.x); w.kick = 1;     // 쏘는 순간엔 정확히 그쪽
  const m = weaponPose(w, i), base = Math.atan2(tgt.y - m.my, tgt.x - m.mx), spread = 0.14;
  for (let k = 0; k < st.count; k++) {
    const a = base + (k - (st.count - 1) / 2) * spread;
    G.bullets.push({x: m.mx, y: m.my, vx: Math.cos(a) * st.spd, vy: Math.sin(a) * st.spd,
      dmg: st.dmg, knock: st.knock, splash: st.splash, travel: 0, maxTravel: st.range * 1.25, hit: new Set()});
  }
  G.fx.push({kind: 'muzzle', x: m.mx, y: m.my, t: 0.06});
}

// ───── 갱신 ─────
function update(dt) {
  const p = G.p, s = G.s;
  G.t += dt;
  if (G.t >= G.world.dur) { G.t = G.world.dur; worldClear(); return; }

  // 이동
  let mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), my = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  if (mx || my) { const l = Math.hypot(mx, my); mx /= l; my /= l; }
  else if (joy.id !== null) { const v = joyVec(); mx = v.x; my = v.y; }   // 조이스틱은 끌어낸 만큼 (0~1)
  const amt = Math.hypot(mx, my);
  p.x += mx * p.speed * dt; p.y += my * p.speed * dt;
  if (Math.abs(mx) > 0.15) p.face = Math.sign(mx);              // 겨눌 적이 있으면 아래 조준에서 덮어씀
  p.move += (amt - p.move) * Math.min(1, dt * 10);   // 걷기 세기 0~1 (멈추면 서서히 가라앉음)
  p.walk += dt * Math.PI * 2 * 2.6 * p.move;
  p.inv = Math.max(0, p.inv - dt);

  // 생성: 초당 1.2 + 0.06·초 마리, 1분마다 둘레 무리
  G.spawnAcc += (1.2 + G.t * 0.06) * dt;
  while (G.spawnAcc >= 1) { G.spawnAcc--; spawnEnemy(); }
  if (G.t >= G.nextWave) { G.nextWave += 60; for (let i = 0; i < 20 + G.t / 6; i++) spawnEnemy(); }

  // 조준 · 발사 — 무기마다 따로 (연속공격은 0.1초 간격)
  G.weapons.forEach((w, wi) => {
    const st = wstat(w.id), tgt = nearestEnemy(p.x, p.y, st.range);
    // 겨눌 방향: 사거리 안 가장 가까운 적. 없으면 걷는 쪽
    const want = tgt ? Math.atan2(tgt.y - p.y, tgt.x - p.x) : (amt > 0.1 ? Math.atan2(my, mx) : w.aim);
    let d = want - w.aim; d = Math.atan2(Math.sin(d), Math.cos(d));   // 가까운 쪽으로 돈다
    w.aim += Math.sign(d) * Math.min(Math.abs(d), WEAPONS[w.id].turn * dt);
    w.kick = Math.max(0, w.kick - dt * 8);
    if (wi === 0 && tgt) p.face = Math.cos(w.aim) >= 0 ? 1 : -1;     // 쏘는 동안 몸도 그쪽을 본다
    w.cdT -= dt;
    if (w.cdT <= 0 && tgt) {
      w.cdT = st.cd;
      for (let i = 0; i < st.burst; i++) w.shots.push(i * 0.1);
    }
    w.shots = w.shots.map(t => t - dt).filter(t => t > 0 || (fireGun(st, w, wi), false));
  });

  // 적 이동 + 겹침 밀어내기 (격자 버킷)
  const grid = new Map(), CELL = 48;
  for (const e of G.enemies) {
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.vx = dx / d * e.spd;
    e.x += (e.vx + e.kbx) * dt; e.y += (dy / d * e.spd + e.kby) * dt;
    const kd = Math.exp(-8 * dt); e.kbx *= kd; e.kby *= kd;     // 넉백은 빠르게 잦아든다
    e.flash = Math.max(0, e.flash - dt);
    const k = ((e.x / CELL) | 0) + ',' + ((e.y / CELL) | 0);
    (grid.get(k) || grid.set(k, []).get(k)).push(e);
  }
  for (const e of G.enemies) {
    const cx = (e.x / CELL) | 0, cy = (e.y / CELL) | 0;
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      const b = grid.get((cx + ox) + ',' + (cy + oy)); if (!b) continue;
      for (const o of b) {
        if (o === e) continue;
        const dx = e.x - o.x, dy = e.y - o.y, min = e.r + o.r, d2 = dx * dx + dy * dy;
        if (d2 < min * min && d2 > 0.01) {
          const d = Math.sqrt(d2), push = (min - d) * 0.25;
          e.x += dx / d * push; e.y += dy / d * push;
        }
      }
    }
    // 닿으면 피해
    if (p.inv <= 0 && (e.x - p.x) ** 2 + (e.y - p.y) ** 2 < (e.r + p.r) ** 2) {
      const dmg = armor(e.dmg, s.def);
      p.hp -= dmg; p.inv = 0.5;
      G.texts.push({x: p.x, y: p.y - 24, v: -dmg, t: 0.8, me: true});
      if (p.hp <= 0) { gameOver(); return; }
    }
  }

  // 투사체
  for (const b of G.bullets) {
    const st = Math.hypot(b.vx, b.vy) * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.travel += st;
    if (b.travel > b.maxTravel) { b.dead = true; continue; }
    for (const e of G.enemies) {
      if (e.dead || b.hit.has(e)) continue;
      if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 > (e.r + 5) ** 2) continue;
      hurtEnemy(e, b.dmg); b.hit.add(e);
      if (b.splash) {
        const R = splashR(b.splash), sd = b.dmg * splashPct(b.splash);
        G.fx.push({kind: 'splash', x: b.x, y: b.y, r: R, t: 0.25});
        for (const o of G.enemies) if (o !== e && !o.dead && (o.x - b.x) ** 2 + (o.y - b.y) ** 2 < (R + o.r) ** 2) hurtEnemy(o, sd);
      }
      if (b.knock) {                                              // 총알이 날던 방향으로 밀림. 큰 적은 덜 밀림
        const sp = Math.hypot(b.vx, b.vy), v0 = knockV(b.knock) * Math.min(1, 15 / e.r);
        e.kbx += b.vx / sp * v0; e.kby += b.vy / sp * v0;
      }
      b.dead = true;
      break;
    }
  }

  // 보석
  const magnet = 90;
  for (const g of G.gems) {
    const dx = p.x - g.x, dy = p.y - g.y, d = Math.hypot(dx, dy);
    if (d < magnet) g.pull = true;
    if (g.pull) { const sp = 420 * dt; g.x += dx / d * Math.min(sp, d); g.y += dy / d * Math.min(sp, d); }
    if (d < p.r + 6) { g.dead = true; gainXp(g.v); }
  }

  // 너무 멀어진 적은 다시 둘레로 (버려진 적이 쌓이지 않게)
  const far = Math.hypot(W, H) * 0.9;
  for (const e of G.enemies) if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) > far) {
    const a = Math.random() * Math.PI * 2, d = Math.hypot(W, H) / 2 + 60;
    e.x = p.x + Math.cos(a) * d; e.y = p.y + Math.sin(a) * d;
  }

  G.enemies = G.enemies.filter(e => !e.dead);
  G.bullets = G.bullets.filter(b => !b.dead);
  G.gems = G.gems.filter(g => !g.dead);
  G.fx = G.fx.filter(f => (f.t -= dt) > 0);
  G.texts = G.texts.filter(t => (t.t -= dt) > 0);
}

function gameOver() {
  G.mode = 'over'; joy.id = null;
  $('result').innerHTML = saveRec();
  $('over').hidden = false;
}

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

// ───── 그리기 ─────
// 들썩: 종류마다 뛰는 빠르기(hz) · 높이(amp, 그림 키 비율) · 착지 찌그러짐(sq) · 흔들림(tilt) · 부드러운 오르내림(smooth: 박쥐)
const BOB = {
  survivor: {amp: 0.08, sq: 0.10, tilt: 0.06},
  zombie:   {hz: 1.5, amp: 0.05, sq: 0.06, tilt: 0.10},   // 비틀비틀
  dog:      {hz: 3.6, amp: 0.10, sq: 0.08, tilt: 0.05},   // 다다닥
  brute:    {hz: 1.2, amp: 0.04, sq: 0.06, tilt: 0.07},   // 쿵쿵
};
// ph: 위상(라디안), k: 세기 0~1. 들린 높이(px)를 돌려줌 → 그림자 크기에 씀
function bobOf(name, ph, k, h) {
  const B = BOB[name];
  const hop = B.smooth ? (Math.sin(ph) + 1) / 2 : Math.abs(Math.sin(ph));   // 0 = 땅, 1 = 꼭대기
  return {lift: hop * B.amp * h * k, sy: 1 - (1 - hop) ** 3 * B.sq * k + hop * B.sq * 0.5 * k,
          tilt: Math.sin(B.smooth ? ph : ph * 0.5) * B.tilt * k};
}

function drawSprite(name, x, y, h, flip, fallback, bob) {
  const img = SPRITES[name];
  const b = bob || {lift: 0, sy: 1, tilt: 0};
  if (!img) { ctx.save(); ctx.translate(0, -b.lift); fallback(); ctx.restore(); return; }
  const w = h * img.width / img.height, foot = y + h * 0.38;    // 발밑을 축으로 찌그러뜨린다
  ctx.save(); ctx.translate(x, foot - b.lift);
  ctx.rotate(b.tilt);
  ctx.scale((flip ? -1 : 1) / Math.sqrt(b.sy), b.sy);          // 납작해지면 옆으로 퍼짐
  ctx.drawImage(img, -w / 2, -h, w, h);
  ctx.restore();
}

function drawWeapon(w, m) {
  const W = WEAPONS[w.id], img = WEAPON_IMG[w.id];
  ctx.save(); ctx.translate(m.hx, m.hy); ctx.rotate(m.a); ctx.scale(1, m.flip);
  if (img) ctx.drawImage(img, -W.pivot[0] * m.len, -W.pivot[1] * m.h, m.len, m.h);
  else { ctx.fillStyle = '#333'; ctx.fillRect(-4, -3, m.len, 6); }
  ctx.restore();
}

function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#1f2125'; ctx.fillRect(0, 0, W, H);             // 아스팔트
  if (!G) return;
  const p = G.p, ox = W / 2 - p.x, oy = H / 2 - p.y;

  // 바닥: 블록 줄 + 큰 간격마다 노란 점선 차선
  ctx.strokeStyle = '#272a2f'; ctx.lineWidth = 1; ctx.beginPath();
  const S = 64;
  for (let x = ((ox % S) + S) % S; x < W; x += S) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = ((oy % S) + S) % S; y < H; y += S) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  const LANE = S * 8;
  ctx.strokeStyle = 'rgba(230,190,60,.28)'; ctx.lineWidth = 4; ctx.setLineDash([36, 28]);
  ctx.lineDashOffset = -ox;
  ctx.beginPath();
  for (let y = ((oy % LANE) + LANE) % LANE; y < H; y += LANE) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset = 0;

  ctx.save(); ctx.translate(ox, oy);

  // 사거리
  ctx.strokeStyle = 'rgba(120,200,255,.12)'; ctx.setLineDash([6, 8]);
  const maxRange = Math.max(...G.weapons.map(w => wstat(w.id).range));
  ctx.beginPath(); ctx.arc(p.x, p.y, maxRange, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);

  // 보석
  for (const g of G.gems) {
    ctx.fillStyle = g.v > 1 ? '#fc4' : '#4cf';
    const r = g.v > 1 ? 7 : 5;
    ctx.beginPath(); ctx.moveTo(g.x, g.y - r); ctx.lineTo(g.x + r * 0.7, g.y); ctx.lineTo(g.x, g.y + r); ctx.lineTo(g.x - r * 0.7, g.y); ctx.fill();
  }

  // 적 (아래 있는 것이 앞에)
  const view = (x, y, m) => x + ox > -m && x + ox < W + m && y + oy > -m && y + oy < H + m;
  const es = G.enemies.filter(e => view(e.x, e.y, 60)).sort((a, b) => a.y - b.y);
  for (const e of es) {
    const T = ENEMY_TYPES[e.type], eh = e.r * 3.4;
    const bob = bobOf(e.type, G.t * Math.PI * 2 * BOB[e.type].hz + e.ph, 1, eh), sh = 1 - bob.lift / eh * 2;
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(e.x, e.y + e.r * 0.8, e.r * sh, e.r * 0.35 * sh, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = e.flash > 0 ? 0.55 : 1;
    // 왼쪽을 보는 그림은 오른쪽으로 갈 때, 오른쪽을 보는 그림은 왼쪽으로 갈 때 뒤집는다
    drawSprite(e.type, e.x, e.y, eh, T.faceLeft ? e.vx > 0 : e.vx < 0, () => circle(e.x, e.y, e.r, e.flash > 0 ? '#fff' : T.color), bob);
    ctx.globalAlpha = 1;
    if (e.hp < e.maxHp) {
      ctx.fillStyle = '#300'; ctx.fillRect(e.x - e.r, e.y - e.r * 2.3, e.r * 2, 3);
      ctx.fillStyle = '#f44'; ctx.fillRect(e.x - e.r, e.y - e.r * 2.3, e.r * 2 * e.hp / e.maxHp, 3);
    }
  }

  // 플레이어
  const pb = bobOf('survivor', p.walk, p.move, 54), psh = 1 - pb.lift / 54 * 2;
  pb.sy *= 1 + Math.sin(G.t * 3) * 0.015 * (1 - p.move);       // 서 있으면 숨쉬기만
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 12, 13 * psh, 5 * psh, 0, 0, Math.PI * 2); ctx.fill();
  // 무기는 늘 몸 위에 그린다 (어느 쪽을 겨눠도 가려지지 않게)
  const poses = G.weapons.map((w, i) => [w, weaponPose(w, i)]);
  const blink = p.inv > 0 && Math.floor(G.t * 20) % 2;
  if (!blink) {
    drawSprite(G.char.sprite, p.x, p.y, 54, FACE.survivor ? p.face > 0 : p.face < 0, () => { circle(p.x, p.y, p.r, '#fd6'); circle(p.x + p.face * 5, p.y - 3, 3, '#333'); }, pb);
  }
  if (!blink) poses.forEach(([w, m]) => drawWeapon(w, m));

  // 투사체
  // 총알: 날아가는 쪽으로 짧은 노란 꼬리
  ctx.lineCap = 'round';
  for (const b of G.bullets) {
    const sp = Math.hypot(b.vx, b.vy), tx = b.vx / sp * 12, ty = b.vy / sp * 12;
    ctx.strokeStyle = 'rgba(255,200,80,.35)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(b.x - tx, b.y - ty); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.strokeStyle = '#ffe9a0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x - tx * 0.6, b.y - ty * 0.6); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // 효과: 총구 불꽃 · 스플래시
  for (const f of G.fx) {
    if (f.kind === 'muzzle') {
      ctx.fillStyle = `rgba(255,220,120,${Math.min(1, f.t * 14)})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, Math.PI * 2); ctx.fill();
      continue;
    }
    ctx.strokeStyle = `rgba(255,170,60,${f.t * 3})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.2 - f.t * 0.8), 0, Math.PI * 2); ctx.stroke();
  }

  // 숫자
  ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
  for (const t of G.texts) {
    ctx.globalAlpha = Math.min(1, t.t * 2);
    ctx.fillStyle = t.me ? '#f66' : t.weak ? '#889' : '#fff';
    ctx.fillText(t.v, t.x, t.y - (0.8 - t.t) * 30);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 조이스틱 (화면 좌표)
  if (joy.id !== null) {
    const v = joyVec();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, JOY_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    circle(joy.bx + v.x * JOY_R, joy.by + v.y * JOY_R, 24, 'rgba(255,255,255,.45)');
  }
}

function hud() {
  $('slots').hidden = !G;
  if (!G) return;
  $('lv').textContent = G.lv;
  $('time').textContent = `${fmt(G.t)} / ${fmt(G.world.dur)}`;
  $('kills').textContent = G.kills;
  $('hpBar').firstElementChild.style.width = Math.max(0, G.p.hp / G.p.maxHp * 100) + '%';
  $('xpBar').firstElementChild.style.width = (G.xp / xpNeed(G.lv) * 100) + '%';
  const s = G.s;
  const sl = slotRow('무기 ', G.char.wSlots, 'w', G.weapons.map(w => WEAPONS[w.id].nm)) + slotRow('보조 ', G.char.sSlots, 's', G.subs.map(x => x.nm));
  if ($('slots').dataset.k !== sl) { $('slots').innerHTML = sl; $('slots').dataset.k = sl; }
  $('stats').textContent =
    `체력 ${Math.ceil(G.p.hp)}/${G.p.maxHp}  방어 ${s.def}\n` +
    G.weapons.map(w => { const t = wstat(w.id);
      return `${WEAPONS[w.id].nm}  피해 ${t.dmg.toFixed(1)}  쿨 ${t.cd.toFixed(2)}s  사거리 ${Math.round(t.range)}  탄 ${t.count}  연속 ${t.burst}  넉백 ${t.knock}  스플 ${t.splash}\n`; }).join('') +
    `적 ${G.enemies.length}  적 체력 ×${(1 + HP_PER_MIN * G.t / 60).toFixed(2)}  적 방어 +${(DEF_PER_MIN * G.t / 60).toFixed(1)}`;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G) {
    if (G.mode === 'play') update(dt);
    if (G.mode === 'levelup') G.inputLock -= dt;
  }
  draw(); hud();
  requestAnimationFrame(loop);
}
showWorlds();
requestAnimationFrame(loop);
window.__G = () => G;   // 디버그
window.__sim = sec => { for (let i = 0; i < sec * 60 && G.mode === 'play'; i++) update(1 / 60); return G.mode; };
</script>
</body>
</html>
