<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>서바이버</title>
<link rel="icon" href="../favicon.svg">
<script>
// PC(넓은 창 · 마우스)로 열면 폰 화면 틀(phone.html)로 — 모바일 전용 개발이라 PC 에서도 폰 해상도로 본다. ?raw 면 그대로
if (window.top === window && innerWidth >= 600 && matchMedia('(pointer: fine)').matches && !/[?&]raw(?:[=&]|$)/.test(location.search))
  location.replace('phone.html' + location.hash);
</script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#12141a;color:#e8e8ee;font-family:system-ui,"Malgun Gothic",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  #pauseBtn{position:fixed;right:10px;top:6px;pointer-events:auto;padding:4px 12px;font-size:14px;background:#2a2d38;color:#ccd}
  /* 화면 세 구획: 위 정보칸(#hudTop) · 가운데 게임(canvas) · 아래 정보칸(#hudBot). 정보는 게임 위에 겹치지 않는다.
     구획 높이는 내용대로 — resize() 가 재서 canvas 를 그 사이에 둔다 (--topH · --botH) */
  canvas{display:block;position:fixed;left:0;width:100vw;top:var(--topH,0px);height:calc(100vh - var(--topH,0px) - var(--botH,0px))}
  #hudTop,#hudBot{position:fixed;left:0;right:0;background:#0c0e13;display:flex;flex-direction:column;gap:4px;pointer-events:none}
  #hudTop{top:0;padding:6px 12px 6px;border-bottom:1px solid #2a2d38}
  #hudBot{bottom:0;padding:6px 76px calc(6px + env(safe-area-inset-bottom)) 12px;border-top:1px solid #2a2d38;min-height:52px}
  .top{padding:2px 56px 2px 0;min-height:22px;display:flex;gap:14px;align-items:center;font-size:14px;pointer-events:none}
  .top a{pointer-events:auto;color:#9ab;text-decoration:none}
  .top b{color:#fff}
  .bar{height:10px;background:#2a2d38;border-radius:5px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0}
  /* 체력 마디 (보스 줄만): 100 마다 가는 금, 1000 마다 굵은 금. --s1 · --s10 = 100 · 1000 이 줄 폭의 몇 % 인지 (hpTicks) */
  .bar.ticks{position:relative}
  .bar.ticks::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(90deg,transparent 0 calc(var(--s10) - 2px),rgba(0,0,0,.85) calc(var(--s10) - 2px) var(--s10)),
               repeating-linear-gradient(90deg,transparent 0 calc(var(--s1) - 1px),rgba(0,0,0,.5) calc(var(--s1) - 1px) var(--s1))}
  /* 월드 타임라인 — 체력 · 경험치 줄 아래. 잡몹이 풀리는 때(그림) · 엘리트(등급 색 마름모) · 보스(큰 그림, 등급 색 고리) */
  #timeline{position:relative;margin:0 4px;height:26px;pointer-events:none}
  #timeline[hidden],#banner[hidden]{display:none}
  .tl-track{position:absolute;left:0;right:0;top:12px;height:3px;background:#2a2d38;border-radius:2px;overflow:hidden}
  .tl-fill{display:block;height:100%;width:0;background:#9ab}
  .tl-marks{position:absolute;inset:0}
  .tl-m{position:absolute;top:13px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
  .tl-m img{width:18px;height:18px;object-fit:cover;object-position:top;border-radius:50%;background:#232634;border:1px solid #556}
  .tl-m.boss img{width:24px;height:24px;border:2px solid var(--gc)}
  .tl-m.elite i{display:block;width:9px;height:9px;transform:rotate(45deg);background:var(--gc);border:1px solid #000}
  .tl-m.done{opacity:.4}
  .tl-now{position:absolute;top:2px;width:2px;height:22px;background:#fff;border-radius:1px;transform:translateX(-1px)}
  /* 보스 체력 줄: 보스마다 한 줄, 아래로 쌓인다. 왼쪽에 얼굴(초상화 위쪽을 잘라) · 오른쪽에 이름 + 줄. 알림은 그 아래 */
  /* 보스 줄 자리는 늘 두 줄(중간 + 최종 보스) 비워 둔다 — 보스가 나오고 죽어도 위 칸 높이 · 게임 칸이 안 바뀐다 */
  #bossBars{display:flex;flex-direction:column;gap:5px;width:min(420px,100%);align-self:center;min-height:65px}
  .bb{display:flex;align-items:center;gap:6px;width:100%}
  .bb .bf{flex:0 0 auto;width:30px;height:30px;border-radius:6px;border:2px solid var(--gc);background:#232634 no-repeat;background-size:230%;background-position:50% 5%}   /* 초상화를 키워 얼굴만 */
  .bb .bi{flex:1 1 auto;min-width:0;text-align:left}
  .bb .bn{font-size:12px;font-weight:700;color:var(--gc,#fff)}
  .bb .bar{height:8px;margin-top:2px;border:1px solid var(--gc,#fff)}
  .bb .bar>i{background:linear-gradient(90deg,#b22,#f55)}
  /* 보스 등장 연출: 화면 가운데쯤 — 큰 얼굴 + '이름 등장!' 이 커지며 나타났다 사라진다 (2.8초) */
  #bossIntro{position:fixed;left:50%;top:calc(var(--topH,0px) + (100vh - var(--topH,0px) - var(--botH,0px)) * .4);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:5}
  #bossIntro[hidden]{display:none}
  #bossIntro.play{animation:bossIn 2.8s ease-out forwards}
  #bossIntro .bf{width:110px;height:110px;border-radius:14px;border:3px solid var(--gc);background:#232634 no-repeat;background-size:230%;background-position:50% 5%;box-shadow:0 0 24px var(--gc)}
  #bossIntro .bt{font-size:26px;font-weight:900;color:var(--gc);text-shadow:0 2px 8px #000,0 0 3px #000;white-space:nowrap}
  #bossIntro .bk{font-size:12px;font-weight:700;color:#ddd;letter-spacing:.3em;text-shadow:0 1px 4px #000}
  @keyframes bossIn{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.92)}}
  /* 알림 글 (새 몹 · 엘리트): 게임 칸 맨 위에 잠깐 */
  #banner{position:fixed;left:50%;top:calc(var(--topH,0px) + 10px);transform:translateX(-50%);z-index:5;font-size:20px;font-weight:800;color:var(--gc,#fff);text-shadow:0 2px 6px #000,0 0 2px #000;pointer-events:none;text-align:center;max-width:94vw}
  .stats{font-size:12px;line-height:1.5;color:#aab;pointer-events:none;white-space:pre;display:none}
  body.dbg .stats{display:block}   /* 능력치 디버그 글 — ` 키로 켜고 끔 (아래 정보칸에 붙는다) */
  .overlay{position:fixed;inset:0;background:rgba(8,9,14,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .overlay[hidden]{display:none}
  .overlay h2{margin:0;font-size:28px}
  .cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .up{width:200px;padding:16px;border-radius:12px;background:#232634;border:2px solid #3a3f55;cursor:pointer;text-align:center;transition:transform .08s}
  .up:hover{transform:translateY(-3px);border-color:#7cf}
  .up .key{display:inline-block;width:34px;height:34px;line-height:32px;border-radius:8px;background:#fff;color:#111;font-weight:700;font-size:18px;margin-bottom:8px}
  .up .nm{font-size:17px;font-weight:700}
  .up .lv{font-size:12px;color:#9ab;margin:4px 0 8px}
  .up .ds{font-size:13px;color:#ccd}
  .up .tag{font-size:11px;color:#c9f}
  .result{font-size:16px;line-height:1.8;text-align:center}
  .hint{font-size:13px;color:#9ab}
  /* 월드 선택 화면: 월드는 위, 캐릭터는 아래 — 둘 다 가로 스크롤 */
  #worldSel{padding:56px 0 28px;gap:12px}
  #worldSel h2{margin-top:8px}
  #startHint,#charHint,#wpnHint{padding:0 16px;text-align:center}
  #worldSel,#charSel{justify-content:center}
  .world{width:240px;padding:14px 16px;border-radius:12px;background:#232634;border:2px solid #3a3f55;color:#e8e8ee;text-align:left;cursor:pointer}
  .world:hover:not(:disabled){border-color:#7cf}
  .world:disabled{opacity:.45;cursor:default}
  .world .wn{font-size:18px;font-weight:700}
  .world .wd{font-size:12px;color:#9ab;margin-top:4px}
  .world .ok{color:#7e7;font-size:12px;margin-left:6px}
  .char{width:150px;padding:10px;border-radius:12px;background:#232634;border:2px solid #3a3f55;color:#e8e8ee;cursor:pointer;text-align:center}
  .world.on{border-color:#fc4;box-shadow:0 0 0 2px rgba(255,204,68,.25)}
  .char.on{border-color:#fc4;box-shadow:0 0 0 2px rgba(255,204,68,.25)}
  .char img{width:72px;height:96px;object-fit:contain;display:block;margin:0 auto 4px}
  .char .cn{font-weight:700}
  .char .ct{font-size:11px;color:#9ab;margin-top:4px}
  .slotrow{display:flex;gap:3px;justify-content:center;align-items:center;font-size:11px;color:#9ab;margin-top:4px}
  .slot{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:4px;border:1px solid #6a7090;font-size:10px;color:#dde}
  .slot.w{border-color:#e9a23b}
  .slot.s{border-color:#5fb0e8}
  .slot.empty{border-style:dashed;opacity:.6}
  .sec{font-size:12px;color:#9ab;letter-spacing:.1em}
  #slots{display:flex;flex-direction:column;gap:3px;pointer-events:none}
  #slots[hidden]{display:none}
  #slots .slotrow{justify-content:flex-start}
  #slots .slot{height:20px;font-size:11px;padding:0 6px}
  .up .aff{font-size:11px;color:#e9a23b;margin-top:6px}
  /* 뱃지 — 무기 특성 · 업그레이드가 닿는 범위. 올리거나(마우스) 누르면(터치) 팁 */
  .badges{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:6px}
  /* 뱃지: 모두 같은 폭 — 이름은 왼쪽, 값은 오른쪽 검은 둥근 상자에 흰 글씨 */
  .badge{display:inline-flex;align-items:center;justify-content:space-between;gap:4px;width:96px;box-sizing:border-box;font-size:11px;font-weight:700;line-height:15px;padding:2px 2px 2px 7px;border-radius:9px;background:var(--bc,#888);color:#14161c;white-space:nowrap;overflow:hidden}
  .wchs{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:4px}
  .wch{font-size:11px;line-height:15px;padding:0 5px;border-radius:4px;white-space:nowrap}
  .wch.on{color:#e9a23b;border:1px solid #e9a23b}
  .wch.off{color:#6a7080;border:1px dashed #3a3f55;text-decoration:line-through}
  .badge b{background:#000;color:#fff;border-radius:7px;padding:0 5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;min-width:12px}
  /* 레벨업 카드 안: 받는 무기 한 줄 — 그림(높이 21px) · 이름 + 지금→다음 (검은 상자 · 흰 글씨) */
  /* 업그레이드 단계 칸: 채움 = 찍은 횟수, 깜빡임 = 이번 것 */
  .pipsrow{display:flex;align-items:center;justify-content:center;gap:5px;margin:5px auto 7px}
  .pipl{font-size:11px;font-weight:700;color:#9ab}
  .pips{display:flex;flex-wrap:wrap;gap:3px;max-width:150px}
  .pip{width:11px;height:7px;border-radius:2px;border:1px solid #6a7080;box-sizing:border-box;background:var(--b,transparent)}
  .pip.on{border-color:var(--b)}
  .pip.next{border-color:var(--c);animation:pipBlink .7s ease-in-out infinite}   /* 깜빡임: 지금 색(--b) ↔ 다음 등급 색(--c) */
  @keyframes pipBlink{0%,100%{background:var(--b,transparent)}50%{background:var(--c)}}
  .inf{display:inline-block;font-size:1.45em;line-height:0;vertical-align:-.05em}
  #cards .pipsrow{flex-wrap:nowrap;gap:3px} #cards .pipn{white-space:nowrap}
  @media (max-width:700px){#cards .pip{width:7px;height:6px} #cards .pips{gap:2px} #cards .pipl,#cards .pipn{font-size:10px}}
  .pipn{font-size:11px;font-weight:700;color:#9ab;font-variant-numeric:tabular-nums}
  .wls{display:flex;flex-direction:column;gap:2px;margin-top:5px;align-items:center}
  .wl{display:flex;align-items:center;gap:5px;width:100%;max-width:190px;height:23px}
  .wl .wn{flex:1 1 auto;min-width:0;font-size:11px;color:#ccd;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* 그림 오른쪽, 모자라면 … */
  .wl b{flex:0 0 auto}
  .wl img{flex:0 0 auto;height:21px;width:55px;box-sizing:border-box;padding:1px 3px;object-fit:contain;background:#5a6078;border-radius:5px;image-rendering:pixelated}   /* 어두운 총이 보이게 밝은 바탕 */
  .wl b{background:#000;color:#fff;border-radius:7px;padding:0 6px;font-size:11px;line-height:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .wrows{display:flex;flex-direction:column;gap:3px;margin-top:6px;align-items:stretch}
  .wrow{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:12px}
  .wrow .wv{color:#ccd;font-variant-numeric:tabular-nums;white-space:nowrap}
  .wrow .wv b{color:#ffd28a}
  .up .wimg{width:100%;height:40px;display:flex;align-items:center;justify-content:center;margin-top:4px}
  .up .wimg img{max-width:80%;max-height:34px;image-rendering:pixelated}
  /* 무기 카드 (출발 무기): 그림 · 이름 · 한 줄 · 숫자 표 · 뱃지 */
  .wcard{display:flex;flex-direction:column;align-items:center;gap:4px}
  .wcard .wimg{width:100%;height:48px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#2e3346 0,#232634 70%);border-radius:8px}
  .wcard .wimg img{max-width:88%;max-height:40px;image-rendering:pixelated}
  .wcard .wsh{font-size:11px;color:#9ab;min-height:15px}
  @media (max-width:700px){.wcard .nm{font-size:13px;white-space:nowrap;letter-spacing:-.03em}.wcard .wimg{height:34px}.wcard .wimg img{max-height:28px}#cards .wrow{font-size:10px;flex-wrap:wrap;justify-content:center}#cards .badge{font-size:9px;line-height:13px;width:76px;padding:1px 1px 1px 4px}#cards .badge b{padding:0 3px}#cards .wl{gap:3px}#cards .wl{gap:3px;height:20px}#cards .wl img{width:42px;height:18px;padding:1px 2px}#cards .wl .wn{font-size:9px;letter-spacing:-.03em}#cards .wl b{font-size:9px;line-height:13px;padding:0 4px}.wcard .wsh{font-size:10px}.wcard .badge{font-size:9px;line-height:13px;width:76px;padding:1px 1px 1px 4px}.wcard .badge b{padding:0 3px}}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btns button.sub{background:#3a3f55}
  button:disabled{opacity:.4;cursor:default}
  button{font:inherit;padding:10px 22px;border-radius:8px;border:0;background:#39f;color:#fff;cursor:pointer}
  /* 고르는 테두리 · 선택 창 조이스틱 */
  .focus{outline:3px solid #fff;outline-offset:3px}
  .up.focus{transform:translateY(-3px)}
  #radial{position:fixed;width:244px;height:244px;margin:-122px 0 0 -122px;pointer-events:none;z-index:2147483646}
  #radial[hidden]{display:none}
  #radial svg{width:100%;height:100%;overflow:visible}
  #radial .rs{stroke:#12141a;stroke-width:2}
  #radial .rs.up{fill:rgba(40,70,120,.88)}
  #radial .rs.down{fill:rgba(110,85,30,.88)}
  #radial .rs.on{stroke:#fc4}
  #radial .rs.dis{fill:rgba(50,52,60,.8)}
  #radial .rs.hot{fill:#39f}
  #radial .rs.down.hot{fill:#e9a23b}
  #radial .rs.dis.hot{fill:rgba(80,80,90,.9)}
  #radial text{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:3px}
  #radial .rc{fill:rgba(20,22,30,.9);stroke:rgba(255,255,255,.4);stroke-width:2}
  #radial .rct{font-size:11px;fill:#9ab}
  #radial.cancel .rc{stroke:#f66}
  #radial.cancel .rct{fill:#f99}
  #cards{flex-wrap:nowrap;padding:0 10px;max-width:100%}
  /* 좁은 화면: 카드를 세로로 쌓고 줄인다 (아래 규칙보다 뒤에 있어야 이긴다) */
  @media (max-width:700px){.char{width:120px}.world{width:200px}#worldSel{padding-top:44px}.cards{flex-direction:column;gap:10px}.up{width:min(80vw,280px);padding:10px}.up .key{width:28px;height:28px;line-height:26px;font-size:15px;margin-bottom:4px}.up .lv{margin:2px 0 4px}#cards{flex-direction:row;gap:8px;width:100%}#cards .up{width:auto;flex:1 1 0;min-width:0;padding:8px 6px}#cards .nm{font-size:14px}#cards .ds{font-size:11px}.top{gap:8px;font-size:12px}.top .hint{display:none}.stats{font-size:10px}}
  /* 월드 · 캐릭터 · 출발 무기: 늘 1행 N열 (스크롤 · 줄바꿈 없이 칸을 줄여 한 줄에) — 방사형 메뉴 위 절반 왼→오른과 맞춘다 */
  .row1{display:flex;flex-wrap:nowrap;flex-direction:row;justify-content:center;gap:10px;width:100%;max-width:900px;padding:6px 12px 12px;touch-action:none;box-sizing:border-box}
  #wpnCards.row1{flex-direction:row;flex-wrap:nowrap}
  .row1>.world,.row1>.char,.row1>.up{flex:1 1 0;width:auto;min-width:0;max-width:250px;box-sizing:border-box}
  @media (max-width:700px){.row1{gap:6px;padding:4px 8px 10px}.row1>.world,.row1>.char,.row1>.up{padding:8px 6px}
    .row1>.world .wn{font-size:15px}.row1 .wd,.row1 .ct{font-size:10px}.row1>.char img{width:56px;height:75px}}
  /* 버전 — 우하단, 모든 창(레벨업 · 일시정지 · 게임오버) 위에 */
  /* 정보 버튼 — 우하단 (버전 위). 누르면 판이 멈추고 뱃지 설명 창 */
  #infoBtn{position:fixed;right:8px;bottom:24px;z-index:2147483645;padding:4px 12px;font-size:12px;background:#2a2d38;color:#ccd;border:1px solid #3a3f55}
  #info{z-index:2147483646;justify-content:flex-start;padding:48px 0 24px;overflow-y:auto}
  .infoList{display:flex;flex-direction:column;gap:6px;width:min(520px,92vw)}
  .infoList h3{margin:10px 0 2px;font-size:13px;color:#9ab;letter-spacing:.1em}
  .infoRow{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.45;color:#dde}
  .infoRow .chip{flex:0 0 auto;width:64px;text-align:center;font-size:12px;font-weight:700;line-height:18px;border-radius:9px;background:var(--bc);color:#14161c}
  #ver{position:fixed;right:8px;bottom:6px;z-index:2147483647;font-size:11px;color:rgba(255,255,255,.55);pointer-events:none;font-variant-numeric:tabular-nums}
</style>

<body>
<div id="hudTop">
<div class="top">
  <a href="../index.html" target="_top">← 프로토타입 목록</a>
  <span>시간 <b id="time">0:00</b></span>
  <span>처치 <b id="kills">0</b></span>
  <span class="hint">WASD 이동 · P 일시정지</span>
  <button id="pauseBtn">II</button>

<script>
'use strict';
// 버전 — 업데이트마다 올린다. 기능 추가 = 가운데(0.x.0), 수정 · 작은 변경 = 끝(0.0.x). 기록은 docs/기능.md 의 '# 버전'
const VERSION = '0.43.0';
document.getElementById('ver').textContent = 'v' + VERSION;
// ───── 설정 ─────
// 그림이 보는 방향 — true 면 왼쪽을 봄 (뽑은 그림을 눈으로 보고 정함)
const FACE = {survivor: false, police: false, firefighter: false, zombie: true, dog: true, brute: false, bossmid: false, bossking: false, crawler: false, riot: false};
// 현대물 — 도심의 좀비들. faceLeft: 그림이 왼쪽을 보면 true (오른쪽으로 갈 때 뒤집음)
// r = 크기 등급: 잡몹은 모두 15 (그림 넓이가 같다). 엘리트 ×1.3, 보스는 BOSSES 의 r
const ENEMY_TYPES = {
  zombie: {nm: '좀비',      hp: 12, def: 0, spd: 70,  dmg: 8,  r: 15, xp: 1, w: 10, color: '#7a9a6a', faceLeft: FACE.zombie},
  dog:    {nm: '들개',      hp: 6,  def: 0, spd: 135, dmg: 5,  r: 15, xp: 1, w: 6,  color: '#8a6a4a', faceLeft: FACE.dog},
  brute:  {nm: '거구 좀비', hp: 70, def: 3, spd: 42,  dmg: 18, r: 15, xp: 5, w: 2,  color: '#888',    faceLeft: FACE.brute},
  crawler:{nm: '기는 좀비', hp: 6,  def: 0, spd: 85,  dmg: 5,  r: 15, xp: 1, w: 8,  color: '#7a8a6a', faceLeft: FACE.crawler},   // 작고 조금 빠름 · 많이
  riot:   {nm: '진압 경찰 좀비', hp: 40, def: 6, spd: 50, dmg: 14, r: 15, xp: 4, w: 3, color: '#445',   faceLeft: FACE.riot},      // 방어 6 — 약한 연사를 막음
};
// 엘리트: 그 시점 잡몹 하나를 키운다 (1.3배 · 등급 색 테두리 깜빡임)
const ELITE = {size: 1.3, hp: 10, dmg: 1.5, xp: 12};
// 보스 — 그림 sprite = images/portrait_<sprite>.png (make_character_sheet --only full, seed 1601 · 1602). pats: 특수 패턴 차례 (돌진 · 범위 · 부르기)
//   돌진: 0.8초 붉은 띠로 예고 → 그 방향으로 빠르게 · 범위: 1초 붉은 원 예고 → 원 안이면 큰 피해 · 부르기: 둘레에 잡몹
const BOSSES = {
  mid:   {nm: '거구 우두머리', sprite: 'bossmid', grade: 3, fightT: 30, def: 4, spd: 55, dmg: 22, r: 44, xp: 60,
          pats: ['charge'], gap: 3.2},
  final: {nm: '도심의 왕',     sprite: 'bossking', grade: 5, fightT: 60, def: 6, spd: 60, dmg: 30, r: 58, xp: 0,
          pats: ['charge', 'slam', 'summon', 'slam'], gap: 2.6, final: true},
};
// 보스 체력 = '기준 빌드' 가 그 보스를 fightT 초에 잡는 양 (docs/보스_체력.md)
//   기준 레벨 = 그 보스가 나오는 때의 완벽 플레이 레벨 × BOSS_LV_PCT (지금 75%) — 이 퍼센트로 난이도를 조절한다
//   기준 빌드 = 권총 하나 · 레벨업의 절반을 공격력 · 공격속도에 번갈아 (나머지는 체력 · 사거리 같은 데) · 보스 방어 뺀 단일 대상 DPS
const BOSS_LV_PCT = 0.75;
const DASH_SPD = 560, DASH_T = 0.55, SLAM_R = 150, SLAM_DMG = 32;
// 적 체력 · 방어는 시간이 가도 그대로 (0.27.3 — 그 전엔 분당 체력 +45% · 방어 +1.5). 어려움은 나오는 수 · 엘리트 · 보스로
// 받는 피해 = 공격력 - 방어력, 그래도 최소 1 (플레이어 · 적 같은 규칙)
const armor = (dmg, def) => Math.max(1, dmg - def);
const MAX_ENEMIES = 500;
const EXT_FROM_LV = 3;          // 확장 업그레이드는 이 레벨부터 후보에

const SPRITES = {};             // 없으면 도형으로
const WEAPON_IMG = {};          // 무기 그림 — 총구가 오른쪽을 보게 뽑음 (tools/make_weapon.py)
for (const n of ['pistol', 'laser', 'sniper', 'mg']) { const im = new Image(); im.onload = () => { WEAPON_IMG[n] = im; }; im.src = `images/weapon_${n}.png?v=${VERSION}`; }
for (const n of ['survivor', 'police', 'firefighter', 'zombie', 'dog', 'brute', 'bossmid', 'bossking', 'crawler', 'riot']) {
  const img = new Image();
  img.onload = () => { SPRITES[n] = trimSprite(img); };
  img.src = `images/portrait_${n}.png?v=${VERSION}`;   // 버전을 붙여 예전 그림이 캐시에 남지 않게
}
// 그림 둘레 빈칸을 잘라낸다 → 적은 이 잘린 그림의 넓이로 크기를 맞춘다 (drawSprite byArea)
function trimSprite(img) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const a = g.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (a[(y * c.width + x) * 4 + 3] > 8) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) return img;
  const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return o;
}

// wpn: 무기 업그레이드. badges: 이 뱃지 중 하나라도 가진 무기만 영향받는다 (없으면 모든 무기)
// 가진 무기 중 영향받는 것이 하나라도 있어야 후보에 나온다. 카드 밑에 뱃지 · 영향받는/안 받는 무기 표시
const UPGRADES = [
  {id: 'dmg',    nm: '공격력',     ds: '피해 +20%',            max: 99, wpn: true, badges: ['dmg'], fx: '+20%', apply: s => s.dmgMul *= 1.2},
  {id: 'rate',   nm: '공격속도',   ds: '쿨다운 ×0.85',         max: 99, wpn: true, badges: ['cd'], fx: '×0.85', apply: s => s.cdMul *= 0.85},
  {id: 'range',  nm: '사거리',     ds: '사거리 +15%',          max: 3, wpn: true, badges: ['range'], fx: '+15%', apply: s => s.rangeMul *= 1.15},
  {id: 'hp',     nm: '체력',       ds: '최대 체력 +25, 회복',  max: 99, badges: ['hp'], fx: '+25', apply: (s, p) => { p.maxHp += 25; p.hp = Math.min(p.maxHp, p.hp + 25); }},
  {id: 'def',    nm: '방어력',     ds: '받는 피해 -2',         max: 99, badges: ['def'], fx: '+2', apply: s => s.def += 2},
  {id: 'count',  nm: '투사체 +1',  ds: '부채꼴로 한 발 더',    max: 5, ext: true, wpn: true, badges: ['spread'], fx: '+1', apply: s => s.count++},
  {id: 'chain',  nm: '연쇄 +1',    ds: '맞힌 뒤 다음 적으로 한 번 더 이어 간다', max: 5, ext: true, wpn: true, badges: ['chain'], fx: '+1', apply: s => s.chain++},
  {id: 'focus',  nm: '집탄',       ds: '발사각 ×0.8 — 탄이 잘 모인다', max: 5, ext: true, wpn: true, badges: ['acc'], fx: '×0.8', apply: s => s.accMul *= 0.8},
  {id: 'scatter',nm: '산탄',       ds: '발사각 ×1.25 — 탄이 넓게 흩어진다', max: 5, ext: true, wpn: true, badges: ['acc'], fx: '×1.25', apply: s => s.accMul *= 1.25},
  {id: 'burst',  nm: '연속공격 +1',ds: '한 번에 한 번 더 쏜다',max: 5, ext: true, wpn: true, badges: ['burst'], fx: '+1', apply: s => s.burst++},
  {id: 'knock',  nm: '넉백',       ds: '맞은 적을 뒤로 밀어낸다', max: 5, ext: true, wpn: true, badges: ['knock'], fx: '+1', apply: s => s.knock++},
  {id: 'splash', nm: '폭발',       ds: '맞은 지점 둘레 피해',  max: 5, ext: true, wpn: true, badges: ['splash'], fx: '+1', apply: s => s.splash++},
];
const UPG = Object.fromEntries(UPGRADES.map(u => [u.id, u]));

// 뱃지 — 무기의 특성. 업그레이드에 붙은 뱃지(연속 · 넉백 · 폭발 · 확산 · 연쇄)는 '그 업그레이드를 받는다' 는 뜻도 된다
// 색은 --bc. 팁은 마우스를 올리거나 터치하면 뜬다
const BADGES = {
  // 능력치 뱃지 — 모든 무기가 가진다 (발사각은 탄이 있는 무기만). 값은 숫자로 붙는다
  dmg:    {nm: '피해',   col: '#ff9f9f', tip: '한 번 맞힐 때 피해. 「공격력」을 받으면 +20%.'},
  cd:     {nm: '쿨다운', col: '#9fd3ff', tip: '다시 쏠 때까지 걸리는 초. 「공격속도」를 받으면 ×0.85 (짧을수록 좋음).'},
  range:  {nm: '사거리', col: '#b6f0a0', tip: '겨누는 거리(px). 「사거리」를 받으면 +15%.'},
  acc:    {nm: '발사각', col: '#e0e0e0', tip: '한 발마다 겨눈 쪽에서 ± 이만큼 빗나간다. 「집탄」을 받으면 좁아지고(×0.8, 잘 모임) 「산탄」을 받으면 넓어진다(×1.25, 넓게 흩어짐).'},
  hp:     {nm: '체력',   col: '#ff8fb0', tip: '최대 체력. 「체력」을 받으면 +25 하고 그만큼 회복.'},
  def:    {nm: '방어',   col: '#c0c8d8', tip: '받는 피해를 이만큼 줄인다.'},
  rapid:  {nm: '연사',   col: '#ffd166', tip: '1초에 쏘는 횟수. 쏘는 간격이 아주 짧은 무기에 붙는다.'},
  pierce: {nm: '관통',   col: '#9be7ff', tip: '한 발이 맞히는 적 수 (꿰뚫고 지나감). ∞ = 지나는 길의 적을 모두 맞힌다.'},
  chain:  {nm: '연쇄',   col: '#7cf0d0', tip: '첫 적을 맞힌 뒤 탄 · 빔이 다음 적으로 이어 가는 수. 「연쇄 +1」을 받으면 +1.'},
  far:    {nm: '원거리', col: '#c7b8ff', tip: '사거리 안 가장 먼 적을 노린다. 값 = 노리는 거리(사거리 끝).'},
  spread: {nm: '확산',   col: '#f6a6c1', tip: '한 번에 부채꼴로 쏘는 발 수. 「투사체 +1」을 받으면 +1.'},
  burst:  {nm: '연속',   col: '#ffb070', tip: '한 번에 잇달아 쏘는 발 수 (발마다 새로 겨눔). 「연속공격 +1」을 받으면 +1.'},
  knock:  {nm: '넉백',   col: '#a8d08d', tip: '맞은 적을 밀어내는 거리(px). 「넉백」을 받으면 늘어난다 (Lv1 40, 레벨당 +25).'},
  splash: {nm: '폭발',   col: '#ff7a6b', tip: '맞은 자리 둘레 반경(px) · 그 둘레 피해(%). 「폭발」을 받으면 늘어난다.'},
};
// 뱃지 값 — st 는 wstat 결과(판 중) 또는 무기 기본값. 값이 없는 뱃지(연사 · 관통 · 원거리)는 이름만
const num = v => +v.toFixed(Math.abs(v) < 10 && v % 1 ? 2 : 1);
// ∞ 는 글자가 납작해 1.45배로 (줄 높이는 안 늘림)
const INF = '<span class="inf">∞</span>';
function badgeVal(id, st) {
  switch (id) {
    case 'dmg': return num(st.dmg);
    case 'cd': return num(st.cd) + 's';
    case 'range': return Math.round(st.range);
    case 'acc': return '±' + num(st.acc) + '°';
    case 'chain': return st.chain;
    case 'spread': return st.count;
    case 'burst': return st.burst;
    case 'knock': return st.knock ? Math.round(knockV(st.knock) / 8) : 0;
    case 'splash': return st.splash ? `${splashR(st.splash)}·${Math.round(splashPct(st.splash) * 100)}%` : 0;
    case 'hp': return st.hp;
    case 'def': return st.def;
    case 'rapid': return st.cd ? num((st.burst || 1) / st.cd) : 0;    // 초당 쏘는 횟수
    case 'pierce': return st.pierce || INF;                            // 한 발이 맞히는 적 수 (없으면 지나는 길의 적 모두)
    case 'far': return Math.round(st.range);                           // 노리는 거리 = 사거리 끝
  }
  return null;
}
const badgeHtml = (id, val) => `<span class="badge" data-badge="${id}" style="--bc:${BADGES[id].col}"><span>${BADGES[id].nm}</span><b>${val == null || val === '' ? 0 : val}</b></span>`;   // 값이 없으면 0
const badgesHtml = (ids, st) => `<div class="badges">${ids.map(id => badgeHtml(id, st ? badgeVal(id, st) : null)).join('')}</div>`;
// 무기가 가진 뱃지 전부 = 능력치 뱃지(피해 · 쿨다운 · 사거리 · 발사각) + 특성 뱃지(badges)
const wpnBadges = W => ['dmg', 'cd', 'range', ...(W.acc != null ? ['acc'] : []), ...W.badges];
// 무기가 업그레이드 uid 를 받는가 — 그 업그레이드의 뱃지 중 하나를 가진 무기만
const wpnTakes = (W, uid) => { const u = UPG[uid]; return !!u && !!u.wpn && u.badges.some(b => wpnBadges(W).includes(b)); };

// ───── 무기 ─────
// badges: 특성 뱃지 (업그레이드가 닿는 범위도 이것으로 정해진다). 능력치는 기본값 — 업그레이드 배율이 곱해진다
const WEAPONS = {
  // acc = 발사각: 한 발마다 겨눈 쪽에서 ±acc 도 안으로 무작위로 빗나간다 (작을수록 좋음). 저격총 < 권총 < 기관총
  pistol: {nm: '권총', kind: 'gun', sh: '가까운 적에게 한 발', ds: '가장 가까운 적에게 한 발씩. 무난한 기본 무기',
           dmg: 0, cd: 1.5, range: 145, spd: 620, acc: 4, maxT: 1,
           // 그림: 화면 길이(px) · 회전 축(그림 안 비율, x 0 = 총 뒤끝) · 총구(그림 안 비율) · 도는 빠르기(라디안/초)
           len: 22, pivot: [0, 0.5], muzzle: [1.0, 0.22], turn: 16,
           badges: ['spread', 'chain', 'burst', 'knock', 'splash']},
  // 굴곡 레이저: 가장 가까운 적 → 그 둘레 적 … 최대 chain 마리를 잇는다. 이펙트는 마디마다 반원
  // 피해는 약하지만 쿨다운이 짧아 다단히트. 투사체 업그레이드 = 연쇄 +1, hop = 다음 적을 찾는 거리
  laser:  {nm: '굴곡 레이저', kind: 'laser', sh: '적을 잇는 굽은 빔', ds: '빔이 가까운 적부터 최대 3마리로 굽이쳐 뻗는다. 빔이 지나는 길의 적은 모두 맞는다',
           dmg: 0, cd: 0.2, range: 120, spd: 0, chain: 2, hop: 150, maxT: 3,   // maxT 3 = 연쇄 대상 (빔 길 위 적은 덤)   // chain 2 = 첫 적 + 2 (모두 3마리)
           len: 22, pivot: [0, 0.55], muzzle: [1.0, 0.3], turn: 16,
           badges: ['rapid', 'chain', 'pierce']},
  // 저격총: 사거리 안 **가장 먼** 적을 겨눠 빠른 관통탄을 쏜다 — 날아가는 길(폭 width)의 적을 pierce 마리까지 꿰뚫는다.

// ── 무기 기본 DPS (docs/무기_DPS.md) ── 업그레이드 0 · 적 방어 0 · 늘 쏠 수 있는 거리
//   단일 DPS = 피해 ÷ 쿨다운 · 최적 DPS = 단일 × maxT(가장 유리하게 섰을 때 한 번에 맞는 수)
//   비교 DPS = 단일과 최적의 가운데 = 단일 × (1 + maxT) / 2 → 모든 무기가 DPS_REF 가 되게 **피해를 계산해 넣는다** (소수 한 자리)
const DPS_REF = 10;
for (const W of Object.values(WEAPONS)) W.dmg = Math.round(DPS_REF * W.cd * 2 / (1 + W.maxT) * 10) / 10;
const dpsOf = W => { const s = W.dmg / W.cd; return {single: s, best: s * W.maxT, mid: s * (1 + W.maxT) / 2}; };

// 사거리 상한 = 무기마다 기본 사거리 × 1.4 — 모든 무기가 같은 배율이라 다 올려도 저격총(기본이 가장 김)이 가장 길다
// 저격총 상한 ≈ 300 (0.31.2: 예전 저격총 시작 사거리 300 이 최종 사거리가 되게 모두 ÷1.4). 자세한 기준은 docs/사거리_가이드.md
const RANGE_CAP = 1.4;
// 무기 기본 능력치 (업그레이드 없음) — 출발 무기 카드 뱃지 값
const baseStat = id => { const W = WEAPONS[id]; return {dmg: W.dmg, cd: W.cd, range: W.range, acc: W.acc, chain: W.chain || 0, count: 1, burst: 1, knock: 0, splash: 0}; };
// 무기 한 자루의 지금 능력치 (업그레이드 중 영향받는 것만 적용)
function wstat(id) {
  const W = WEAPONS[id], s = G.s, a = k => wpnTakes(W, k), c = G.char;
  return {
    dmg: W.dmg * (a('dmg') ? s.dmgMul : 1) * (c.wDmgMul || 1),
    cd: W.cd * (a('rate') ? s.cdMul : 1),
    range: W.range * Math.min(RANGE_CAP, a('range') ? s.rangeMul : 1),   // 상한: 기본 × RANGE_CAP
    spd: W.spd,
    pierce: W.pierce || 0,                                   // 한 발이 맞히는 적 수 (0 = 제한 없음)
    count: 1 + (a('count') ? s.count : 0),
    chain: (W.chain || 0) + (a('chain') ? s.chain : 0),      // 연쇄: 첫 적 다음에 더 이어 가는 수
    burst: 1 + (a('burst') ? s.burst : 0),
    knock: a('knock') ? s.knock : 0,
    splash: a('splash') ? s.splash : 0,
    acc: W.acc != null ? W.acc * (a('focus') ? s.accMul : 1) : undefined,   // 발사각 — 집탄 ×0.8 · 산탄 ×1.25
  };
}

function resize() {
  let pz = 1; try { pz = (parent !== window && parent.__phoneZoom) || 1; } catch (_) {}   // PC 폰 틀에서 확대하면 캔버스도 그만큼 촘촘히
  DPR = (window.devicePixelRatio || 1) * pz;

  document.documentElement.style.setProperty('--topH', tH + 'px');
  document.documentElement.style.setProperty('--botH', bH + 'px');
  cvTop = tH; W = innerWidth; H = Math.max(100, innerHeight - tH - bH);
  cv.width = W * DPR; cv.height = H * DPR;
}

// 누른 곳이 중심. 반지름 JOY_R 밖으로 끌면 중심이 손가락을 따라온다 (방향을 바로 틀 수 있게)
const JOY_R = 60, JOY_DEAD = 8;
const joy = {id: null, bx: 0, by: 0, x: 0, y: 0};
function joyVec() {
  const dx = joy.x - joy.bx, dy = joy.y - joy.by, d = Math.hypot(dx, dy);
  if (d < JOY_DEAD) return {x: 0, y: 0};
  const k = Math.min(1, d / JOY_R) / d;
  return {x: dx * k, y: dy * k};
}
cv.addEventListener('pointerdown', e => {
  if (joy.id !== null) return;                                  // 손가락 하나만
  joy.id = e.pointerId; joy.bx = joy.x = e.clientX; joy.by = joy.y = e.clientY - cvTop;   // 게임 칸 좌표
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  joy.x = e.clientX; joy.y = e.clientY - cvTop;
  const dx = joy.x - joy.bx, dy = joy.y - joy.by, d = Math.hypot(dx, dy);
  if (d > JOY_R) { joy.bx = joy.x - dx / d * JOY_R; joy.by = joy.y - dy / d * JOY_R; }
});
const joyEnd = e => { if (e.pointerId === joy.id) joy.id = null; };
cv.addEventListener('pointerup', joyEnd);

  if (e.code === 'KeyI' && !e.repeat) { $('info').hidden ? openInfo() : closeInfo(); return; }      // 정보 창
  if (!$('info').hidden && e.code === 'Escape') { closeInfo(); return; }
  const scr = navSync();
  if (scr) {                                                    // 선택 창: 방향키 · WASD 로 테두리, Enter · Space 로 결정
    const d = {ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', KeyA: 'L', KeyD: 'R', KeyW: 'U', KeyS: 'D'}[e.code];
    if (d) { e.preventDefault(); if (!(scr === 'levelup' && e.repeat)) navStep(d); }   // 레벨업: 누르고 있던 이동 키는 무시
    if (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') { e.preventDefault(); if (!e.repeat) navConfirm(); return; }
  }
  if (!G) {                                                     // 월드 · 캐릭터 · 무기 선택: 숫자 1~9
    const dg = /^(Digit|Numpad)([1-9])$/.exec(e.code), i = dg ? +dg[2] - 1 : undefined;
    if (!$('wpnSel').hidden) { if (UNLOCKED_WEAPONS[i]) newGame(pickWi, UNLOCKED_WEAPONS[i]); else if (e.code === 'Escape') showChars(); }
    else if (!$('charSel').hidden) { if (CHARACTERS[i]) pickChar(i); else if (e.code === 'Escape') showWorlds(); }
    else if (WORLDS[i]) pickWorld(i);
    return;
  }
  if (G.mode === 'levelup') {
    const i = {Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2}[e.code];   // 이동 키(WASD)와 겹치지 않게 숫자
    if (i !== undefined && !e.repeat) choose(i);
  } else if (G.mode === 'over' || G.mode === 'clear') {
    if (e.code === 'KeyR') showWeaponPick(G.wi);

// 정보 창: 뱃지 설명. 판 중이면 멈추고, 닫으면 다시 (멈춰 있던 창 · 레벨업 · 메뉴에서 열면 그대로)
const INFO_GROUPS = [['능력치', ['dmg', 'cd', 'range', 'acc', 'hp', 'def']], ['특성', ['rapid', 'pierce', 'chain', 'far', 'spread', 'burst', 'knock', 'splash']]];

    `<div class="infoRow"><span class="chip" style="--bc:${BADGES[id].col}">${BADGES[id].nm}</span><span>${BADGES[id].tip}</span></div>`).join('')).join('')
    + `<h3>등급 색</h3>` + GRADES.map((gr, g) => `<div class="infoRow"><span class="chip" style="--bc:${gr.col}">${gr.nm}</span><span>${gradeInfo(g)}</span></div>`).join('');
  $('info').dataset.resume = G && G.mode === 'play' ? '1' : '';
  if (G && G.mode === 'play') G.mode = 'pause';
  joy.id = null;
  $('info').hidden = false; $('infoBtn').hidden = true;
}
// 등급 하나의 설명: 끝없는 업그레이드 칸이 몇 번째에서 이 색인지 + 지금 월드에서 이 등급인 엘리트 · 보스
function gradeInfo(g) {
  const Wd = G ? G.world : WORLDS[selWorld] || WORLDS[0], s = [];
  s.push(g < GRADES.length - 1 ? `업그레이드 칸 ${g * PIP_N + 1}~${(g + 1) * PIP_N}번째` : `업그레이드 칸 ${g * PIP_N + 1}번째부터`);
  const ev = [...Wd.elites.filter(e => e.grade === g).map(e => [e.at, '엘리트']),
              ...Wd.bosses.filter(e => BOSSES[e.id].grade === g).map(e => [e.at, BOSSES[e.id].nm])].sort((a, b) => a[0] - b[0]);
  return [...s, ...ev.map(([at, nm]) => `${fmt(at)} ${nm}`)].join(' · ');
}
function closeInfo() {
  $('info').hidden = true; $('infoBtn').hidden = false;
  if ($('info').dataset.resume && G && G.mode === 'pause' && $('pause').hidden) G.mode = 'play';
}
$('infoBtn').onclick = openInfo;
$('infoClose').onclick = closeInfo;

function togglePause() {
  G.autoPaused = false;
  if (G.mode === 'play') { G.mode = 'pause'; $('pause').hidden = false; }
  else if (G.mode === 'pause') { G.mode = 'play'; $('pause').hidden = true; }
}

// ───── 고르는 테두리 (커서) — 키보드 · 게임패드 · 화면 조이스틱 공통 ─────
// 창마다 줄(행) 목록. 위아래 = 줄 바꿈, 좌우 = 줄 안에서 옆 칸. 결정 = 그 칸을 누른 것과 같다
const NAV_ROWS = {
  worldSel: ['#worldList > button'],
  charSel:  ['#charList > button', '#charBack'],
  wpnSel:   ['#wpnCards > .up', '#wpnBack'],
  levelup:  ['#cards > .up'],
  pause:    ['#pause .btns button'],
  over:     ['#over .btns button'],
  clear:    ['#clear .btns button'],
  info:     ['#info .btns button'],
};
const NAV_ORDER = ['info', 'levelup', 'pause', 'over', 'clear', 'wpnSel', 'charSel', 'worldSel'];   // 겹치면 앞이 이긴다
const nav = {scr: null, r: 0, cs: [], el: null, needNeutral: false, dir: null, hold: 0};
const navScreen = () => NAV_ORDER.find(id => !$(id).hidden) || null;
const navRows = () => (NAV_ROWS[nav.scr] || []).map(q => [...document.querySelectorAll(q)].filter(e => !e.disabled));
function navSync() {
  const scr = navScreen();
  if (scr === nav.scr) return scr;
  nav.scr = scr; nav.dir = null; nav.needNeutral = true;        // 새 창: 스틱을 한 번 놓아야 움직인다 (피하던 스틱이 그대로 고르지 않게)
  const rows = navRows();
  nav.r = 0; nav.cs = rows.map(() => 0);
  if (scr === 'worldSel') nav.cs[0] = selWorld;
  if (scr === 'charSel') nav.cs[0] = charIdx;
  if (scr === 'over' || scr === 'clear') nav.cs[0] = rows[0].length - 1;   // 다시하기 · 다음 월드
  return scr;
}
function navCur() {
  const rows = navRows(), row = rows[nav.r];
  if (!row || !row.length) return null;
  nav.cs[nav.r] = Math.max(0, Math.min(row.length - 1, nav.cs[nav.r] || 0));
  return row[nav.cs[nav.r]];
}
function navStep(dir) {
  if (!navSync()) return;
  const rows = navRows();
  if (dir === 'U' || dir === 'D') {
    for (let r = nav.r + (dir === 'D' ? 1 : -1); r >= 0 && r < rows.length; r += dir === 'D' ? 1 : -1)
      if (rows[r].length) { nav.r = r; break; }
  } else nav.cs[nav.r] = (nav.cs[nav.r] || 0) + (dir === 'R' ? 1 : -1);
  navPaint();
}
function navConfirm() {
  if (!navSync()) return;
  const el = navCur(); if (!el) return;
  el.click();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  navPaint();
}
function navBack() {
  const scr = navSync();
  if (scr === 'wpnSel') showChars();
  else if (scr === 'charSel' || scr === 'over' || scr === 'clear') showWorlds();
  else if (scr === 'pause') togglePause();
  else if (scr === 'info') closeInfo();
}
function navPaint() {
  const el = nav.scr ? navCur() : null;
  if (el === nav.el && (!el || el.classList.contains('focus'))) return;
  if (nav.el) nav.el.classList.remove('focus');
  nav.el = el;
  if (el) { el.classList.add('focus'); el.scrollIntoView({block: 'nearest', inline: 'center', behavior: 'smooth'}); }
}
// 스틱(패드 · 화면 조이스틱) → 한 칸씩. 계속 기울이면 0.35초 뒤부터 0.13초마다
function navAxis(v, dt) {
  const m = Math.hypot(v.x, v.y);
  if (nav.needNeutral) { if (m < 0.3) nav.needNeutral = false; return; }
  const dir = m < 0.5 ? null : Math.abs(v.x) > Math.abs(v.y) ? (v.x > 0 ? 'R' : 'L') : (v.y > 0 ? 'D' : 'U');
  if (!dir) { nav.dir = null; return; }
  if (dir !== nav.dir) { nav.dir = dir; nav.hold = 0.35; navStep(dir); }
  else if ((nav.hold -= dt) <= 0) { nav.hold = 0.13; navStep(dir); }
}

// ───── 게임패드 (Gamepad API) ─────
// 왼쪽 스틱 · 십자키 = 이동 / 고르기, A = 결정, B = 뒤로, Start = 일시정지
const pad = {v: {x: 0, y: 0}, prev: [], on: false};
function pollPad() {
  const gp = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(g => g && g.connected);
  if (!gp) { pad.v = {x: 0, y: 0}; pad.prev = []; return; }
  const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed), down = i => b(i) && !pad.prev[i];
  let x = gp.axes[0] || 0, y = gp.axes[1] || 0;
  if (Math.hypot(x, y) < 0.2) x = y = 0;                        // 데드존
  const dx = (b(15) ? 1 : 0) - (b(14) ? 1 : 0), dy = (b(13) ? 1 : 0) - (b(12) ? 1 : 0);
  if (dx || dy) { x = dx; y = dy; }                             // 십자키가 먼저
  pad.v = {x, y};
  if (!pad.on) { pad.on = true; setPadHints(); }
  const scr = navSync();
  if (scr) {
    if (down(0)) navConfirm();
    else if (down(1)) navBack();
    else if (down(9) && scr === 'pause') togglePause();
  } else if (G && G.mode === 'play' && down(9)) togglePause();
  pad.prev = gp.buttons.map(x => x.pressed);
}
function setPadHints() {
  $('startHint').textContent = '패드: 스틱 · 십자키로 고르고 A 로 정한다 (B 뒤로). 판 중엔 왼쪽 스틱으로 움직이고 Start 로 멈춘다.';
  $('luHint').textContent = '스틱으로 고르고 A';
  $('pauseHint').textContent = 'Start 로 계속';
  $('wpnHint').textContent = '3단계 — 스틱으로 고르고 A 면 바로 시작 (B 뒤로)';
}
addEventListener('gamepadconnected', () => { pad.on = true; setPadHints(); });

// ───── 방사형 메뉴 (월드 선택 · 레벨업 창에서 끌기) ─────
// 누른 곳이 중심 — 멀리 끌어도 중심은 그대로. 가운데(DEAD 안)에서 떼면 취소, 칸 위에서 떼면 그 칸을 고른다
// 월드 선택: 위 절반 = 월드 (왼→오른), 아래 절반 = 캐릭터 (왼→오른)
// 무기 선택: 위 절반 = 무기, 아래 절반 = 뒤로
// 메뉴는 두 가지 —
//   선택형 (월드 · 캐릭터 · 무기 · 업그레이드): 화면 배치와 같은 방향 (왼→오른)
//   확인형 (쓰러졌다 · 클리어 · 일시정지 · 뒤로/취소): 긍정 · 확인은 위, 부정 · 취소 · 나가기는 아래
// ※ 대전제: 모든 UI 는 방사형 메뉴로도 고를 수 있어야 한다 (docs/기능.md '# 대전제')
// 레벨업: 위 절반 = 카드 1 · 2 · 3 (왼 · 가운데 · 오른), 아래 절반은 빈칸 (떼면 취소)
// 끌지 않고 떼면 그냥 탭 (버튼을 누른 것)
const RM_R = 120, RM_IN = 34, RM_MOVE = 14;
const rm = {id: null, scr: null, cx: 0, cy: 0, x: 0, y: 0, open: false, up: [], down: [], hit: null};
let rmSuppress = 0;
function rmItems(scr) {
  if (scr === 'worldSel') {
    const wb = [...$('worldList').children];
    return {up: Array.from({length: WORLD_SLOTS}, (_, i) => ({label: WORLDS[i] ? WORLDS[i].name : `월드 ${i + 1}`, disabled: !WORLDS[i],
              el: wb[i], act: () => pickWorld(i)})), down: []};
  }
  if (scr === 'charSel') {                                      // 위 절반 = 캐릭터, 아래 절반 = 뒤로
    const cb = [...$('charList').children];
    return {up: CHARACTERS.map((c, i) => ({label: c.nm, img: `images/portrait_${c.sprite}.png?v=${VERSION}`, el: cb[i], act: () => pickChar(i)})),
            down: [{label: '뒤로', el: $('charBack'), act: () => showWorlds()}]};
  }
  if (scr === 'wpnSel') {                                       // 위 절반 = 무기, 아래 절반 = 뒤로
    const cards = [...$('wpnCards').children];
    return {up: UNLOCKED_WEAPONS.map((id, i) => ({label: WEAPONS[id].nm, img: `images/weapon_${id}.png?v=${VERSION}`, wide: true, el: cards[i], act: () => newGame(pickWi, id)})),
            down: [{label: '뒤로', el: $('wpnBack'), act: () => showChars()}]};
  }
  if (scr === 'over' || scr === 'clear' || scr === 'pause' || scr === 'info') {   // 확인형 — 긍정(다시하기 · 계속 · 다음 월드)은 위, 부정(data-neg: 나가기)은 아래
    const bs = [...$(scr).querySelectorAll('.btns button')];
    // rmSuppress = 0: 앞서 끈 뒤의 클릭 막기가 이 클릭을 먹지 않게
    const item = b => ({label: b.textContent.replace(/\s*\([A-Z]\)$/, ''), disabled: b.disabled, el: b, act: () => { rmSuppress = 0; b.click(); }});
    return {up: bs.filter(b => !b.hasAttribute('data-neg')).map(item), down: bs.filter(b => b.hasAttribute('data-neg')).map(item)};
  }
  const cards = [...$('cards').children];
  const list = G.choices.map((u, i) => ({label: u.nm, el: cards[i], act: () => choose(i, true)}));
  return {up: list, down: []};                                 // 아래 절반은 비워 둠 (나중에 리롤 같은 것)
}
// 손가락 위치 → {half, idx}. 가운데면 null
function rmHit(x, y) {
  const dx = x - rm.cx, dy = y - rm.cy;
  if (Math.hypot(dx, dy) < RM_IN) return null;
  const half = dy <= 0 ? 'up' : 'down', list = rm[half];
  if (!list.length) return null;
  const a = Math.atan2(Math.abs(dy), dx);                       // 0(오른쪽) ~ π(왼쪽)
  const idx = Math.min(list.length - 1, Math.floor((1 - a / Math.PI) * list.length));
  return {half, idx};
}
function rmStart(id, x, y, scr) {
  Object.assign(rm, {id, scr, cx: x, cy: y, x, y, open: false, hit: null});
}
function rmOpen() {
  Object.assign(rm, rmItems(rm.scr)); rm.open = true;
  // 그림: 칸마다 부채꼴. 위 절반은 위로 도는 호, 아래 절반은 아래로 도는 호
  const P = (th, r, s) => `${(Math.cos(th) * r).toFixed(1)},${(s * Math.sin(th) * r).toFixed(1)}`;
  let svg = '';
  for (const [half, s] of [['up', -1], ['down', 1]]) {
    const list = rm[half], n = list.length;
    list.forEach((it, k) => {
      const t1 = Math.PI - k * Math.PI / n, t2 = Math.PI - (k + 1) * Math.PI / n, tm = (t1 + t2) / 2;
      const sw = s < 0 ? 1 : 0;
      const cls = 'rs ' + half + (it.disabled ? ' dis' : '') + (it.on ? ' on' : '');
      svg += `<path class="${cls}" data-h="${half}" data-i="${k}" d="M${P(t1, RM_R, s)} A${RM_R} ${RM_R} 0 0 ${sw} ${P(t2, RM_R, s)} L${P(t2, RM_IN, s)} A${RM_IN} ${RM_IN} 0 0 ${1 - sw} ${P(t1, RM_IN, s)}Z"/>`;
      const [lx, ly] = P(tm, (RM_R + RM_IN) / 2 + 4, s).split(',').map(Number);
      if (it.img) svg += it.wide ? `<image href="${it.img}" x="${lx - 20}" y="${ly - 28}" width="40" height="30"/>`
                                 : `<image href="${it.img}" x="${lx - 15}" y="${ly - 30}" width="30" height="40"/>`;
      svg += `<text x="${lx}" y="${ly + (it.img ? 18 : 4)}">${it.label}${it.disabled ? '' : ''}</text>`;
    });
  }
  svg += `<circle class="rc" r="${RM_IN}"/><text class="rct" y="4">취소</text>`;
  const el = $('radial');
  el.innerHTML = `<svg viewBox="${-RM_R - 2} ${-RM_R - 2} ${RM_R * 2 + 4} ${RM_R * 2 + 4}">${svg}</svg>`;
  el.style.left = rm.cx + 'px'; el.style.top = rm.cy + 'px';
  el.hidden = false;
}
function rmMove(x, y) {
  rm.x = x; rm.y = y;
  if (!rm.open) { if (Math.hypot(x - rm.cx, y - rm.cy) > RM_MOVE) rmOpen(); else return; }
  const h = rmHit(x, y), key = h ? h.half + h.idx : '';
  if (key === (rm.hit ? rm.hit.half + rm.hit.idx : '')) return;
  rm.hit = h;
  $('radial').querySelectorAll('.rs').forEach(p => p.classList.toggle('hot', !!h && p.dataset.h === h.half && +p.dataset.i === h.idx));
  $('radial').classList.toggle('cancel', !h);
  const it = h && rm[h.half][h.idx];
  if (it && it.el && !it.disabled) navFocusEl(it.el);           // 진짜 카드에도 테두리
}
function rmClose() { rm.id = null; rm.open = false; rm.hit = null; $('radial').hidden = true; $('radial').classList.remove('cancel'); }
function rmEnd() {
  if (!rm.open) { rmClose(); return; }                          // 끌지 않았으면 그냥 탭
  const h = rmHit(rm.x, rm.y), it = h && rm[h.half][h.idx];
  rmClose();
  if (it && !it.disabled) it.act();
  rmSuppress = performance.now();                               // 뗀 자리의 클릭은 버린다 (act 안의 버튼 클릭은 막지 않게 뒤에)
}
['worldSel', 'charSel', 'wpnSel', 'levelup', 'over', 'clear', 'pause', 'info'].forEach(id => $(id).addEventListener('pointerdown', e => {
  if (rm.id !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
  rmStart(e.pointerId, e.clientX, e.clientY, id);
}));
addEventListener('pointermove', e => { if (e.pointerId === rm.id) rmMove(e.clientX, e.clientY); });
addEventListener('pointerup', e => { if (e.pointerId === rm.id) rmEnd(); });
addEventListener('pointercancel', e => { if (e.pointerId === rm.id) rmClose(); });
addEventListener('click', e => { if (performance.now() - rmSuppress < 400) { rmSuppress = 0; e.stopPropagation(); e.preventDefault(); } }, true);
function navFocusEl(el) {
  navSync();
  navRows().forEach((row, r) => { const c = row.indexOf(el); if (c >= 0) { nav.r = r; nav.cs[r] = c; } });
  navPaint();
}
function navTick(dt) {
  pollPad();
  const scr = navSync();
  if (rm.id !== null && scr !== rm.scr) rmClose();             // 창이 바뀌면 메뉴를 닫는다
  if (!scr) return;
  navAxis(pad.v, dt);
  navPaint();
}

// ───── 레벨업 ─────
// 레벨업 필요 경험치 — 완벽 플레이(다 잡고 다 줍기)에서 **약 20초마다 한 번** 레벨업 되게 맞춘 곡선 (docs/레벨업_곡선.md)
//   xpNeed(L) = 25 × 1.124^(L-1). 10분에 Lv 31. 빈도 · 몹 경험치를 바꾸면 콘솔 __fitXp(20) 으로 A · g 를 다시 뽑는다
const XP_A = 25, XP_G = 1.124;
const xpNeed = lv => Math.round(XP_A * XP_G ** (lv - 1));

function openLevelUp() {
  const pool = UPGRADES.filter(u => G.ups[u.id] < u.max && (!u.ext || G.lv >= EXT_FROM_LV)
    && (!u.wpn || affectedBy(u.id).length));                     // 영향받는 무기가 없으면 안 나온다
  if (G.weapons.length < G.char.wSlots)                         // 빈 무기 슬롯 → 해금된 새 무기
    for (const id of UNLOCKED_WEAPONS) if (!G.weapons.some(w => w.id === id))
      pool.push({id: 'new_' + id, nm: '새 무기: ' + WEAPONS[id].nm, ds: WEAPONS[id].ds, max: 1, newWeapon: id,
                 apply: () => G.weapons.push(newWeapon(id))});
  const picks = [];
  while (picks.length < 3 && pool.length) {
    const tot = pool.reduce((a, u) => a + (u.ext ? 2 : 3), 0);
    let r = Math.random() * tot, k = 0;
    for (; k < pool.length; k++) { r -= pool[k].ext ? 2 : 3; if (r <= 0) break; }
    picks.push(pool.splice(Math.min(k, pool.length - 1), 1)[0]);
  }
  G.choices = picks;
  G.mode = 'levelup';
  G.inputLock = 0.35;
  const box = $('cards'); box.innerHTML = '';
  picks.forEach((u, i) => {
    const d = document.createElement('div');
    d.className = 'up';
    const lv = G.ups[u.id] || 0;
    // 업그레이드 단계 = 칸: 채운 칸(찍은 횟수) + 깜빡이는 칸(이번에 찍을 것) + 빈 칸(남은 것). 끝없는(99) 것은 빈 칸 없이
    // 새 무기 = 무기 슬롯 칸 (가진 무기 수 + 깜빡이는 새 칸)
    d.innerHTML = `<div class="key">${i + 1}</div><div class="nm">${u.nm}</div>
      ${u.newWeapon ? pipsHtml(G.weapons.length, G.char.wSlots) : pipsHtml(lv, u.max < 99 ? u.max : Infinity)}
      ${u.newWeapon ? `<div class="wimg"><img src="images/weapon_${u.newWeapon}.png?v=${VERSION}" alt=""></div>` + badgesHtml(wpnBadges(WEAPONS[u.newWeapon]), wstat(u.newWeapon)) : upHtml(u)}`;
    d.onclick = () => choose(i, true);
    box.appendChild(d);
  });
  $('levelup').hidden = false;
  // 판 중 누르고 있던 손가락은 메뉴로 잇지 않는다 — 새로 눌러 끌어야 열린다 (0.11.4)
}

// 업그레이드 카드: 바뀌는 뱃지 + 늘어나는 양(fx) → 숫자로 지금 → 다음
//   무기 업그레이드: 가진 무기마다 한 줄 — 받는 무기는 '권총 10 → 12' (주황), 안 받는 무기는 회색 취소선
//   체력 · 방어: 주인공 값 지금 → 다음
function upHtml(u) {
  const fx = `<div class="badges">${u.badges.map(b => badgeHtml(b, u.fx)).join('')}</div>`;
  if (!u.wpn) {

    return fx + `<div class="wrows"><div class="wrow"><span class="wch on">${BADGES[b].nm}</span><span class="wv">${now} → <b>${nx}</b></span></div></div>`;

  const s0 = G.s, s1 = {...s0}; u.apply(s1, {maxHp: 0, hp: 0});
  const rows = G.weapons.filter(w => wpnTakes(WEAPONS[w.id], u.id)).map(w => {
    const W = WEAPONS[w.id], b = u.badges.find(x => wpnBadges(W).includes(x));
    const a = badgeVal(b, wstat(w.id)); G.s = s1; const c = badgeVal(b, wstat(w.id)); G.s = s0;

// 등급 색 (디아블로식 아이템 등급) — 업그레이드 칸 색 단계에 쓰고, 나중에 아이템 · 보상에도 같은 표를 쓴다

//   최대가 5 이하인 것(확산 · 연쇄 …, 무기 슬롯)은 칸 수 = 최대, 일반 색 한 바퀴
const PIP_N = 5;
function pipsHtml(done, total) {
  const n = Number.isFinite(total) ? Math.min(total, PIP_N) : PIP_N;

  let h = '';
  for (let k = 0; k < n; k++) {
    const cur = k < k0 ? gradeCol(g) : g > 0 ? gradeCol(g - 1) : '';   // 이번 바퀴에 찬 칸 · 전 바퀴 색 · 빈 칸
    const style = (cur ? `--b:${cur};` : '') + (k === k0 ? `--c:${gradeCol(g)};` : '');
    h += `<i class="pip${cur ? ' on' : ''}${k === k0 && done < total ? ' next' : ''}" style="${style}"></i>`;
  }
  const lim = Number.isFinite(total) ? total : INF;
  return `<div class="pipsrow"><span class="pipl">Lv.</span><div class="pips">${h}</div><span class="pipn">(${done + 1}/${lim})</span></div>`;
}

function choose(i, click) {
  if (G.mode !== 'levelup' || G.inputLock > 0) return;          // 창이 뜨자마자 누른 탭 · 키는 무시
  const u = G.choices[i]; if (!u) return;
  G.ups[u.id] = (G.ups[u.id] || 0) + 1;
  u.apply(G.s, G.p);
  $('levelup').hidden = true;
