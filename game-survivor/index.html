  // 착탄 범위 (0.88.0): 늘 보임 — 흰 테 + 옅은 붉은 속
  ctx.fillStyle = 'rgba(255,60,60,.45)'; ctx.beginPath(); ctx.arc(p.x, p.y + HIT_CY, HITBOX, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  // 탄 미터: 총마다 고정 자리 파이 (0.89.1 — 그 전엔 손잡이 밑이라 겨눌 때마다 움직임) — 남은 탄 ÷ 장탄 만큼 노랗게 + 가운데 남은 탄 수.
  //   다 쓰면 재장전: 주황 파이가 12시부터 시계 방향으로 차오른다 (숫자 없음)
  for (const [i, [w]] of poses.entries()) {
    if (WEAPONS[w.id].kind === 'boom') { boomMeter(w, i); continue; }
    if (WEAPONS[w.id].kind === 'orbit') { orbitMeter(w, i); continue; }
    if (WEAPONS[w.id].kind === 'charm') { charmMeter(w, i); continue; }
    const st = wstat(w.id), R = 7, {x, y} = meterPos(i), rl = w.rl > 0;
    const k = rl ? 1 - w.rl / w.rlMax : Math.max(0, w.ammo) / st.mag;
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.beginPath(); ctx.arc(x, y, R + 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rl ? '#ff9a4a' : '#c9a93a';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.closePath(); ctx.fill();
    if (!rl) {
      ctx.font = 'bold 8px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.strokeText(w.ammo, x, y + 0.5);
      ctx.fillStyle = '#fff'; ctx.fillText(w.ammo, x, y + 0.5);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
  }
  // 머리 위: 레벨 글 + 체력 줄 + 그 바로 밑 경험치 줄 (총 고리보다 위) — 늘 보인다. 레벨 글까지 합친 폭을 캐릭터 가운데에
  ctx.font = 'bold 10px system-ui';
  { const lt = 'Lv' + G.lv, tw = ctx.measureText(lt).width, gap = 3, bw = 44;   // 0.87.0: 36 → 44, 높이 5 → 6
    const bh = 6, xh = 3, bx = p.x - (tw + gap + bw) / 2 + tw + gap, by = p.y - 60, k = Math.max(0, p.hp / p.maxHp), kx = Math.min(1, G.xp / xpNeed(G.lv));
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + xh + 3);
    if (G.hitT > 0) {                                           // 맞으면 체력 줄 둘레가 붉게 빛남 (0.87.0)
      ctx.save(); ctx.shadowColor = '#f22'; ctx.shadowBlur = 10 * G.hitT / HIT_T;
      ctx.strokeStyle = `rgba(255,80,80,${G.hitT / HIT_T})`; ctx.lineWidth = 2; ctx.strokeRect(bx - 2, by - 2, bw + 4, bh + 3);
      ctx.restore();
    }
    ctx.fillStyle = '#3a1416'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#fff'; ctx.fillRect(bx, by, bw * (p.gk ?? k), bh);
    ctx.fillStyle = k > 0.3 ? '#e44' : (Math.floor(G.t * 6) % 2 ? '#f77' : '#c22'); ctx.fillRect(bx, by, bw * k, bh);
    ctx.fillStyle = '#132234'; ctx.fillRect(bx, by + bh + 1, bw, xh);
    ctx.fillStyle = '#5bf'; ctx.fillRect(bx, by + bh + 1, bw * kx, xh);
    // 레벨: 두 줄 왼쪽에 (검은 테 흰 글씨)
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const ly = by + (bh + xh + 1) / 2;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(lt, bx - gap, ly);
    ctx.fillStyle = '#fff'; ctx.fillText(lt, bx - gap, ly);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; }

  // 투사체
  // 총알: 날아가는 쪽으로 짧은 꼬리. 색 (0.89.0): 플레이어가 쏜 것은 파랑 · 청록 계열, 적이 쏜 것은 붉은 계열
  ctx.lineCap = 'round';
  for (const b of G.bullets) {
    if (b.orbShot) {                                              // 날아가는 방패 (연쇄, 0.109.0): 방패 그림이 돌며 날아감
      const img = WEAPON_IMG.shield, sz = WEAPONS.shield.rad * 2.4; b.rot += 0.3;
      ctx.save(); ctx.shadowColor = '#3ef'; ctx.shadowBlur = 8; ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      if (img) ctx.drawImage(img, -sz / 2, -sz / 2, sz, sz); else circle(0, 0, WEAPONS.shield.rad, '#4af');
      ctx.restore(); continue;
    }
    if (b.boom) {                                                 // 부메랑: 나무 그림 + 청록 빛
      ctx.save(); ctx.shadowColor = '#3ef'; ctx.shadowBlur = 10; drawBoomerang(b.x, b.y, b.rot, WEAPONS.boomerang.len); ctx.restore();
      continue;
    }
    const sp = Math.hypot(b.vx, b.vy), tl = b.rail ? 34 : 12, tx = b.vx / sp * tl, ty = b.vy / sp * tl;
    if (b.rail) {                                               // 저격탄: 긴 흰 꼬리 + 파란 빛
      ctx.strokeStyle = 'rgba(70,140,255,.45)'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(b.x - tx, b.y - ty); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = '#eef6ff'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(b.x - tx * 0.7, b.y - ty * 0.7); ctx.lineTo(b.x, b.y); ctx.stroke();
      continue;
    }
    ctx.strokeStyle = 'rgba(60,200,255,.4)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(b.x - tx, b.y - ty); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.strokeStyle = '#c8f4ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x - tx * 0.6, b.y - ty * 0.6); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // 굴곡 레이저: 그려진 만큼의 꺾은선 (updateLaser 가 계산). 청록 빛 3겹 · 닿은 적 빛 점 · 뻗는 끝 빛
  for (const [w, m] of poses) {
    const bm = w.beam;
    if (!bm || !bm.segs.length) continue;
    const line = beamLine(bm);
    if (line.length < 2) continue;
    const fl = 0.75 + 0.25 * Math.sin((G.t + bm.ph) * 60);   // 지글지글
    line[0] = {x: m.mx, y: m.my};                               // 총구는 이번 프레임 자세에 붙인다
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(line[0].x, line[0].y);
    for (const q of line) ctx.lineTo(q.x, q.y);
    ctx.strokeStyle = `rgba(60,220,255,${0.22 * fl})`; ctx.lineWidth = 9; ctx.stroke();
    ctx.strokeStyle = `rgba(120,240,255,${0.55 * fl})`; ctx.lineWidth = 4; ctx.stroke();
    ctx.strokeStyle = `rgba(235,255,255,${0.95 * fl})`; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = `rgba(160,245,255,${0.6 * fl})`;
    bm.nodes.forEach((n, k) => { if (k < Math.floor(bm.prog)) { ctx.beginPath(); ctx.arc(n.x, n.y, 5, 0, Math.PI * 2); ctx.fill(); } });
    const tip = line[line.length - 1];
    ctx.fillStyle = `rgba(220,255,255,${0.9 * fl})`; ctx.beginPath(); ctx.arc(tip.x, tip.y, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(200,250,255,${0.8 * fl})`; ctx.beginPath(); ctx.arc(m.mx, m.my, 3.5, 0, Math.PI * 2); ctx.fill();
  }

  // 효과: 총구 불꽃 · 스플래시
  for (const f of G.fx) {
    if (f.kind === 'muzzle') {
      ctx.fillStyle = `rgba(170,240,255,${Math.min(1, f.t * 14)})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, Math.PI * 2); ctx.fill();
      continue;
    }
    if (f.kind === 'shieldbreak') {
      ctx.strokeStyle = `rgba(102,204,255,${f.t * 2.5})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.4 - f.t), 0, Math.PI * 2); ctx.stroke();
      continue;
    }
    ctx.strokeStyle = f.mine ? `rgba(80,230,220,${f.t * 3})` : `rgba(255,60,50,${f.t * 3})`; ctx.lineWidth = 3;   // 색 (0.89.0): 내 것 청록 · 적 것 붉게
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.2 - f.t * 0.8), 0, Math.PI * 2); ctx.stroke();
  }

  // 숫자
  ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
  for (const t of G.texts) {
    ctx.globalAlpha = Math.min(1, t.t * 2);
    ctx.fillStyle = t.crit ? '#ffd84a' : t.brk ? SHIELD_COL : t.heal ? '#5f5' : t.me ? '#f66' : t.weak ? '#889' : '#fff';
    if (t.crit) { ctx.font = 'bold 16px system-ui';   // 치명타: 노란색 · 보통(13)보다 조금 크게 (0.92.1 — 18 → 16)
      ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.strokeText(t.v, t.x, t.y - (0.8 - t.t) * 30); }
    ctx.fillText(t.v, t.x, t.y - (0.8 - t.t) * 30);
    if (t.crit) ctx.font = 'bold 13px system-ui';
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  offscreenMarks(ox, oy);

  // 맞으면 화면 가장자리 붉게 (0.87.0) — 맞은 세기 · 남은 체력이 적을수록 진하게
  if (G.hitT > 0) {
    const a = G.hitT / HIT_T * Math.min(1, G.hitK * 0.6 + (1 - Math.max(0, p.hp / p.maxHp)) * 0.5);
    const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) / 2);
    gr.addColorStop(0, 'rgba(255,0,0,0)'); gr.addColorStop(1, `rgba(255,20,20,${a * 0.85})`);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }

  // 조이스틱 (화면 좌표)
  if (joy.id !== null) {
    const v = joyVec();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, JOY_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    circle(joy.bx + v.x * JOY_R, joy.by + v.y * JOY_R, 24, 'rgba(255,255,255,.45)');
  }
}

// 화면 밖 엘리트 · 보스: 게임 칸 테두리에 얼굴 동그라미 + 그쪽을 가리키는 화살표 (등급 색)
//   가운데(주인공)에서 그 적으로 그은 선이 테두리와 만나는 곳. 보스는 크게, 엘리트는 테두리가 깜빡인다
function offscreenMarks(ox, oy) {
  for (const e of G.enemies) {
    if (e.dead || e.elite == null) continue;
    const sx = e.x + ox, sy = e.y + oy, m = e.r;
    if (sx > -m && sx < W + m && sy > -m && sy < H + m) continue;      // 보이면 안 함
    const R = e.boss ? 17 : 12, M = R + 10, dx = sx - W / 2, dy = sy - H / 2;
    const k = Math.min((W / 2 - M) / Math.max(1e-6, Math.abs(dx)), (H / 2 - M) / Math.max(1e-6, Math.abs(dy)));
    const x = W / 2 + dx * k, y = H / 2 + dy * k, a = Math.atan2(dy, dx), col = gradeCol(e.elite);
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = col; ctx.beginPath();                               // 화살표
    ctx.moveTo(Math.cos(a) * (R + 9), Math.sin(a) * (R + 9));
    ctx.lineTo(Math.cos(a + 0.5) * (R + 1), Math.sin(a + 0.5) * (R + 1));
    ctx.lineTo(Math.cos(a - 0.5) * (R + 1), Math.sin(a - 0.5) * (R + 1)); ctx.fill();
    ctx.fillStyle = '#232634'; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    const img = SPRITES[e.type];
    if (img) {                                                         // 그림 위쪽(얼굴)을 동그라미에
      ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R - 1, 0, Math.PI * 2); ctx.clip();
      const w = R * 2.6, h = w * img.height / img.width;
      ctx.drawImage(img, -w / 2, -R * 1.15, w, h); ctx.restore();
    }
    ctx.globalAlpha = e.boss ? 1 : 0.55 + 0.45 * Math.sin(G.t * 8);
    ctx.strokeStyle = col; ctx.lineWidth = e.boss ? 3 : 2; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  // 화면 밖 상자 (0.69.0): 같은 꼴 — 동그라미 안에 상자 그림, 테두리는 떨군 엘리트 등급 색 (깜빡이지 않음)
  for (const c of G.chests) {
    const sx = c.x + ox, sy = c.y + oy, m = 14;
    if (sx > -m && sx < W + m && sy > -m && sy < H + m) continue;
    const R = 12, M = R + 10, dx = sx - W / 2, dy = sy - H / 2;
    const k = Math.min((W / 2 - M) / Math.max(1e-6, Math.abs(dx)), (H / 2 - M) / Math.max(1e-6, Math.abs(dy)));
    const x = W / 2 + dx * k, y = H / 2 + dy * k, a = Math.atan2(dy, dx), col = gradeCol(c.g);
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = col; ctx.beginPath();
    ctx.moveTo(Math.cos(a) * (R + 9), Math.sin(a) * (R + 9));
    ctx.lineTo(Math.cos(a + 0.5) * (R + 1), Math.sin(a + 0.5) * (R + 1));
    ctx.lineTo(Math.cos(a - 0.5) * (R + 1), Math.sin(a - 0.5) * (R + 1)); ctx.fill();
    ctx.fillStyle = '#232634'; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.scale(0.75, 0.75); drawChest(0, 4, col); ctx.restore();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  // 화면 밖 자석 (0.107.2): 상자와 같은 꼴 — 동그라미 안에 자석 그림, 테두리 · 화살표는 청록
  for (const mg of G.mags) {
    const sx = mg.x + ox, sy = mg.y + oy, m = 12;
    if (sx > -m && sx < W + m && sy > -m && sy < H + m) continue;
    const R = 11, M = R + 10, dx = sx - W / 2, dy = sy - H / 2;
    const k = Math.min((W / 2 - M) / Math.max(1e-6, Math.abs(dx)), (H / 2 - M) / Math.max(1e-6, Math.abs(dy)));
    const x = W / 2 + dx * k, y = H / 2 + dy * k, a = Math.atan2(dy, dx), col = '#3ef';
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = col; ctx.beginPath();
    ctx.moveTo(Math.cos(a) * (R + 9), Math.sin(a) * (R + 9));
    ctx.lineTo(Math.cos(a + 0.5) * (R + 1), Math.sin(a + 0.5) * (R + 1));
    ctx.lineTo(Math.cos(a - 0.5) * (R + 1), Math.sin(a - 0.5) * (R + 1)); ctx.fill();
    ctx.fillStyle = '#232634'; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    if (MAG_IMG.complete && MAG_IMG.naturalWidth) ctx.drawImage(MAG_IMG, -8, -8, 16, 16); else circle(0, 0, 5, '#e44');
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

// 월드 타임라인 표시 (새 판마다 다시 만든다)
// 방어 표시 — 왼쪽 끝 x, 가운데 y 에 방패 + 방어 숫자 (방어 뱃지 색)
const DEF_COL = '#c0c8d8';
function shieldPath(x, y, w, h) {                               // 위가 넓고 아래가 뾰족한 방패
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h * 0.45);
  ctx.quadraticCurveTo(x + w, y + h * 0.85, x + w / 2, y + h); ctx.quadraticCurveTo(x, y + h * 0.85, x, y + h * 0.45); ctx.closePath();
}
// 보스 체력 줄 (0.86.0): 머리 위 — 이름(등급 색) · 굵은 줄(등급 색 테두리 · 하얀 겹침 · 1000 마다 금) · 방어 표시
function bossBar(e) {
  const w = e.r * 2.4, h = 6, x = e.x - w / 2, y = e.y - e.r * 2.3 - 4, col = gradeCol(e.boss.grade);
  ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
  ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.strokeText(e.boss.nm, e.x, y - 4);
  ctx.fillStyle = col; ctx.fillText(e.boss.nm, e.x, y - 4); ctx.textAlign = 'left';
  ctx.fillStyle = '#300'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w * (e.gk ?? 1), h);
  ctx.fillStyle = '#f44'; ctx.fillRect(x, y, w * Math.max(0, e.hp / e.maxHp), h);
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  for (let k = 1000; k < e.maxHp; k += 1000) ctx.fillRect(x + w * k / e.maxHp - 0.5, y, 1, h);
  ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.strokeRect(x - 0.5, y - 0.5, w + 1, h + 1);
  if (e.def > 0) defMark(x + w + 4, y + h / 2, e.def);
}
// 방패 횟수 (0.84.0): 하늘색 테두리 둥근 판 + 남은 횟수
function shieldMark(x, y, n) {
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.beginPath(); ctx.roundRect(x - 13, y - 6, 26, 12, 6); ctx.fill();
  ctx.strokeStyle = SHIELD_COL; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.font = 'bold 9px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = SHIELD_COL; ctx.fillText(n, x, y + 0.5);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}
function defMark(x, y, def) {
  const w = 7, h = 9;
  shieldPath(x, y - h / 2, w, h);
  ctx.fillStyle = DEF_COL; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = '#000'; ctx.stroke();
  ctx.font = 'bold 9px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#000'; ctx.strokeText(def, x + w + 2, y + 0.5);
  ctx.fillStyle = DEF_COL; ctx.fillText(def, x + w + 2, y + 0.5);
  ctx.textBaseline = 'alphabetic';
}

function buildTimeline() {
  const Wd = G.world, pct = at => Math.min(100, at / Wd.dur * 100) + '%', img = n => `images/portrait_${n}.png?v=${VERSION}`;
  let h = '';
  Wd.mobs.forEach(m => { h += `<div class="tl-m mob" data-at="${m.at}" style="left:${pct(m.at)}" title="${ENEMY_TYPES[m.type].nm} ${fmt(m.at)}"><img src="${img(m.type)}" alt=""></div>`; });
  G.elites.forEach(ev => { h += `<div class="tl-m elite" data-at="${ev.at}" data-g="${ev.grade}" style="left:${pct(ev.at)}" title="엘리트 ${fmt(ev.at)}"><i></i></div>`; });
  Wd.bosses.forEach(ev => { const B = BOSSES[ev.id]; h += `<div class="tl-m boss" data-at="${ev.at}" style="left:${pct(ev.at)};--gc:${gradeCol(B.grade)}" title="${B.nm} ${fmt(ev.at)}"><img src="${img(B.sprite)}" alt=""></div>`; });
  $('timeline').querySelector('.tl-marks').innerHTML = h;
}

function hud() {
  $('slots').hidden = !G;
  $('timeline').hidden = !G;
  if (!G) { $('bossIntro').hidden = true; $('banner').hidden = true; return; }
  const tp = Math.min(1, G.t / G.world.dur) * 100;
  $('timeline').querySelector('.tl-fill').style.width = tp + '%';
  $('timeline').querySelector('.tl-now').style.left = tp + '%';
  $('timeline').querySelectorAll('.tl-m').forEach(m => {
    const on = G.t >= +m.dataset.at;
    m.classList.toggle('done', on && !m.classList.contains('boss'));
    if (on && m.dataset.g && !m.style.getPropertyValue('--gc')) m.style.setProperty('--gc', gradeCol(+m.dataset.g));   // 엘리트 등급은 나온 뒤에만
  });
  $('banner').hidden = !G.banner;
  if (G.banner) { $('banner').textContent = G.banner.txt; $('banner').style.setProperty('--gc', G.banner.col); $('banner').style.opacity = Math.min(1, G.banner.t); }
  $('time').textContent = G.t >= G.world.dur && !G.finalDead ? `${fmt(G.world.dur)} 보스!` : `${fmt(G.t)} / ${fmt(G.world.dur)}`;
  $('kills').textContent = G.kills;
  const s = G.s;
  // 슬롯 줄 (0.79.0): 그림 + 이름, 보조는 단계도
  const sl = slotRow('무기 ', G.char.wSlots, 'w', G.weapons.map(w => `<img src="images/weapon_${w.id}.png?v=${VERSION}" alt="">${WEAPONS[w.id].nm}`))
    + slotRow('보조 ', G.char.sSlots, 's', [...G.pens.map(id => `<img src="images/item_pen_${id}.png?v=${VERSION}" alt=""><i class="penTag">${PEN[id].nm}</i>`), ...G.subs.map(x => { const u = UPG[x.id], n = u.give || u.max === 1 ? '' : G.ups[x.id] || 1; return `<img src="images/item_${x.id}.png?v=${VERSION}" alt="">${x.nm}${n === '' ? '' : `<b>${n}</b>`}`; })]);   // 패널티가 앞 칸부터 (분홍)
  if ($('slots').dataset.k !== sl) { $('slots').innerHTML = sl; $('slots').dataset.k = sl; }
  $('stats').textContent =
    `체력 ${Math.ceil(G.p.hp)}/${G.p.maxHp}  방어 ${s.def}\n` +
    G.weapons.map(w => { const t = wstat(w.id);
      return `${WEAPONS[w.id].nm}  피해 ${t.dmg.toFixed(1)}  쿨 ${t.cd.toFixed(2)}s  사거리 ${Math.round(t.range)}  탄 ${t.count}  연속 ${t.burst}  밀당 ${t.knock}  스플 ${t.splash}\n`; }).join('') +
    `적 ${G.enemies.length}`;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  navTick(dt);
  if (G) {
    if (G.mode === 'play') update(dt);
    if (G.mode === 'levelup') G.inputLock -= dt;
  }
  draw(); hud();
  requestAnimationFrame(loop);
}
showWorlds();
requestAnimationFrame(loop);
window.__G = () => G;   // 디버그
window.__nav = () => ({scr: nav.scr, r: nav.r, cs: nav.cs.slice(), el: nav.el && (nav.el.id || nav.el.innerText.split('\n')[0])});
// 완벽 플레이 기대값: 1초 단위로 기대 마릿수 × 그때 몹 섞임의 평균 경험치 + 엘리트 · 중간 보스
//   보스 · 엘리트 살아 있는 시간은 보스 20초 · 엘리트 10초로 침 (그 동안 빈도 낮춤)
window.__perfect = (wi = 0) => {
  const save = G; G = {world: WORLDS[wi], t: 0, enemies: []};
  const out = [], cum = []; let xp = 0, lv = 1, cur = 0, mobs = 0;
  const elite = new Set(), boss = new Set();
  WORLDS[wi].elites.forEach(e => { for (let s = 0; s < 10; s++) elite.add(e.at + s); });
  WORLDS[wi].bosses.forEach(b => { if (!BOSSES[b.id].final) for (let s = 0; s < 20; s++) boss.add(b.at + s); });
  for (let s = 0; s < WORLDS[wi].dur; s++) {
    G.t = s + 0.5;
    let r = SPAWN.base(G.t / 60) * (G.t >= WORLDS[wi].dur - 60 ? SPAWN.lastMin : SPAWN.rhythm(G.t % 60));
    if (boss.has(s)) r *= SPAWN.boss; else if (elite.has(s)) r *= SPAWN.elite;
    // 그 초의 몹 섞임 평균 경험치
    const ms = WORLDS[wi].mobs.filter(m => G.t >= m.at), intro = ms.find(m => m.at > 0 && G.t < m.at + SPAWN.introT);
    const wt = ms.map((m, i) => ENEMY_TYPES[m.type].w * SPAWN.ageDecay ** (ms.length - 1 - i)), ws = wt.reduce((a, b) => a + b, 0);
    let avg = ms.reduce((a, m, i) => a + ENEMY_TYPES[m.type].xp * wt[i] / ws, 0);
    if (intro) avg = avg * (1 - SPAWN.introShare) + ENEMY_TYPES[intro.type].xp * SPAWN.introShare;
    xp += r * avg; mobs += r;
    const exMul = ELITE_GRADES.reduce((a, q) => a + q.w * q.xp, 0) / ELITE_GRADES.reduce((a, q) => a + q.w, 0);   // 등급 기대 배율
    WORLDS[wi].elites.forEach(e => { if (e.at === s) xp += avg * ELITE.xp * exMul; });   // 엘리트 = 그때 몹 평균 경험치 × 12 × 등급 기대 배율
    WORLDS[wi].bosses.forEach(b => { if (b.at === s) xp += BOSSES[b.id].xp; });
    cum.push(xp);
    while (xp - cur >= xpNeed(lv)) { cur += xpNeed(lv); lv++; }
    if ((s + 1) % 60 === 0) out.push({min: (s + 1) / 60, mobs: Math.round(mobs), xp: Math.round(xp), lv, cap: SPAWN.cap((s + 1) / 60)});
  }
  G = save;
  out.cum = cum;                                                 // 초마다 누적 경험치 (레벨업 곡선 맞출 때)
  return out;
};
// 완벽 플레이에서 D 초마다 레벨업 되게 xpNeed = A × g^(L-1) 을 맞춘다 (구간별 필요 경험치의 로그 직선 맞춤)
window.__fitXp = (D = 20, wi = 0) => {
  const cum = __perfect(wi).cum, X = s => s <= 0 ? 0 : cum[Math.min(cum.length, s) - 1], n = Math.floor(WORLDS[wi].dur / D);
  let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (let i = 0; i < n; i++) { const y = Math.log(Math.max(1, X((i + 1) * D) - X(i * D))); sx += i; sy += y; sxx += i * i; sxy += i * y; }
  const b = (n * sxy - sx * sy) / (n * sxx - sx * sx), a = (sy - b * sx) / n;
  return {A: +Math.exp(a).toFixed(2), g: +Math.exp(b).toFixed(4)};
};
window.__sim = sec => { for (let i = 0; i < sec * 60 && G.mode === 'play'; i++) update(1 / 60); return G.mode; };
</script>
