}

function gainXp(n) {
  G.xp += n;
  while (G.xp >= xpNeed(G.lv)) {
    G.xp -= xpNeed(G.lv); G.lv++;
    if (G.mode === 'levelup') G.pendingLv++; else openLevelUp();
  }
}

// ───── 적 ─────
// 지금 풀린 잡몹 (월드 타임라인 mobs 중 at 이 지난 것)
const mobTypes = () => G.world.mobs.filter(m => G.t >= m.at).map(m => m.type);
function pickMob() {
  const ms = G.world.mobs.filter(m => G.t >= m.at);
  const intro = ms.find(m => m.at > 0 && G.t < m.at + SPAWN.introT);   // 새 몹 소개: 처음 15초는 그 몹이 절반
  if (intro && Math.random() < SPAWN.introShare) return intro.type;
  const wt = ms.map((m, i) => ENEMY_TYPES[m.type].w * SPAWN.ageDecay ** (ms.length - 1 - i));   // 뒤에 나온 몹 하나마다 ×0.8
  let r = Math.random() * wt.reduce((a, b) => a + b, 0);
  for (let i = 0; i < ms.length; i++) { r -= wt[i]; if (r <= 0) return ms[i].type; }
  return ms[0].type;
}
// ── 잡몹 등장 빈도 (docs/등장_빈도.md) ──
// 시간표대로 '나올 차례' 가 생기고, 산 잡몹이 상한 이상이면 그 차례는 **버린다** (쌓아 두지 않음, 알리지 않음)
//   → 빨리 잡아도 더 나오지 않고(경험치 천장), 늦게 잡으면 덜 나와 레벨이 처진다(보스에서 드러남)
const SPAWN = {
  base: m => 1.2 + 0.5 * m + 0.08 * m * m,     // 초당 마릿수 (m = 분)
  cap:  () => 150,                               // 숨은 상한 — 산 잡몹 150 고정 = 폰 세로 화면이 꽉 찬 느낌 (빽빽이 채우면 약 330의 절반). 처리 능력과 무관 — 처리는 몹 체력 · DPS · 레벨업으로 맞춘다
                                                 // 엘리트 · 보스 · 보스가 부른 몹은 셈에서 뺌
  rhythm: s => s < 10 ? 0.6 : s < 40 ? 1 : 1.3,   // 1분 안: 사건 직후 숨 돌림 → 보통 → 다음 사건 앞 조임
  lastMin: 1.5,                                  // 9:00~10:00 마지막 1분
  elite: 0.8, boss: 0.4,                         // 엘리트 · 보스가 살아 있는 동안
  introT: 15, introShare: 0.5, ageDecay: 0.8,
};
function spawnRate() {
  const m = G.t / 60, dur = G.world.dur;
  let r = SPAWN.base(Math.min(m, dur / 60));
  r *= G.t >= dur - 60 && G.t < dur ? SPAWN.lastMin : SPAWN.rhythm(G.t % 60);
  if (G.enemies.some(e => e.boss && !e.dead)) r *= SPAWN.boss;
  else if (G.enemies.some(e => e.elite != null && !e.dead)) r *= SPAWN.elite;
  return r;
}
const mobCount = () => G.enemies.reduce((n, e) => n + (!e.dead && e.elite == null && !e.boss && !e.summon ? 1 : 0), 0);
function offscreen() { const ang = Math.random() * Math.PI * 2, dist = Math.hypot(W, H) / 2 + 60; return [G.p.x + Math.cos(ang) * dist, G.p.y + Math.sin(ang) * dist]; }
function makeEnemy(name, x, y) {
  const T = ENEMY_TYPES[name], hp = T.hp, def = T.def;
  return {type: name, x, y, r: T.r, hp, maxHp: hp, def, spd: T.spd * (0.9 + Math.random() * 0.2), dmg: T.dmg, xp: T.xp,
    flash: 0, vx: 0, kbx: 0, kby: 0, ph: Math.random() * Math.PI * 2};
}
function spawnEnemy() {
  if (G.enemies.length >= MAX_ENEMIES) return;
  const [x, y] = offscreen();
  G.enemies.push(makeEnemy(pickMob(), x, y));
}
// 엘리트: 지금 잡몹 하나를 1.3배로 · 체력 ×10 · 피해 ×1.5 · 경험치 ×12, 등급 색 테두리가 깜빡인다
function spawnElite(grade) {
  const [x, y] = offscreen(), e = makeEnemy(pickMob(), x, y);
  e.r *= ELITE.size; e.hp = e.maxHp = e.maxHp * ELITE.hp; e.dmg *= ELITE.dmg; e.xp *= ELITE.xp; e.elite = grade;
  G.enemies.push(e);
  setBanner(`${GRADES[grade].nm} 엘리트 ${ENEMY_TYPES[e.type].nm}!`, gradeCol(grade));
}
let bossSeq = 0;                      // 보스 줄을 가리는 번호
// 완벽 플레이 레벨 (월드 wi, t 초) — __perfect 의 초당 누적 경험치로
const perfCum = {};
function perfectLv(wi, t) {
  const cum = perfCum[wi] || (perfCum[wi] = __perfect(wi).cum), xp = cum[Math.max(0, Math.min(cum.length, Math.round(t)) - 1)] || 0;
  let lv = 1, need = 0;
  while (need + xpNeed(lv) <= xp) { need += xpNeed(lv); lv++; }
  return lv;
}
// 기준 빌드 DPS (레벨 L, 대상 방어 def): 권총 · 레벨업 (L-1) 번 중 절반을 공격력 → 공격속도 → 공격력 … 차례로
function refDps(L, def) {
  const W = WEAPONS.pistol, k = Math.floor((L - 1) / 2), nd = Math.ceil(k / 2), nr = Math.floor(k / 2);
  return Math.max(1, W.dmg * 1.2 ** nd - def) / (W.cd * 0.85 ** nr);
}
function bossPlan(id, wi, at) {
  const B = BOSSES[id], pl = perfectLv(wi, at), L = Math.max(1, Math.round(pl * BOSS_LV_PCT)), dps = refDps(L, B.def);
  return {perfectLv: pl, refLv: L, dps: +dps.toFixed(1), hp: Math.round(dps * B.fightT)};
}
function spawnBoss(id) {
  const B = BOSSES[id], [x, y] = offscreen(), hp = bossPlan(id, G.wi, G.t).hp;
  G.enemies.push({type: B.sprite, x, y, r: B.r, hp, maxHp: hp, def: B.def, spd: B.spd, dmg: B.dmg, xp: B.xp,
    flash: 0, vx: 0, kbx: 0, kby: 0, ph: 0, boss: B, bid: ++bossSeq, elite: B.grade, st: 'walk', bt: 2, pi: 0, dir: 0});
  // 등장 연출 (위쪽 알림 대신): 얼굴 + '이름 등장!' 이 가운데에 나타났다 사라짐
  const bi = $('bossIntro');
  bi.style.setProperty('--gc', gradeCol(B.grade));
  bi.innerHTML = `<i class="bf" style="background-image:url(images/portrait_${B.sprite}.png?v=${VERSION})"></i><div class="bk">${B.final ? '최종 보스' : '중간 보스'}</div><div class="bt">${B.nm} 등장!</div>`;
  bi.hidden = false; bi.classList.remove('play'); void bi.offsetWidth; bi.classList.add('play');
  clearTimeout(bi.tm); bi.tm = setTimeout(() => { bi.hidden = true; bi.classList.remove('play'); }, 2800);
}
const setBanner = (txt, col) => {                              // 같은 때 겹치면 이어 붙임 (예: 6:00 새 잡몹 · 엘리트)
  G.banner = G.banner && G.banner.t > 2.8 ? {txt: G.banner.txt + ' · ' + txt, col, t: 3} : {txt, col, t: 3};
};
// 타임라인 사건 (엘리트 · 보스 · 새 잡몹 알림) — 때가 되면 한 번씩
function timelineTick() {
  const Wd = G.world;
  Wd.mobs.forEach((m, i) => { const k = 'm' + i; if (i && G.t >= m.at && !G.evDone.has(k)) { G.evDone.add(k); setBanner(`${ENEMY_TYPES[m.type].nm} 등장`, '#e8e8ee'); } });
  Wd.elites.forEach((ev, i) => { const k = 'e' + i; if (G.t >= ev.at && !G.evDone.has(k)) { G.evDone.add(k); spawnElite(ev.grade); } });
  Wd.bosses.forEach((ev, i) => { const k = 'b' + i; if (G.t >= ev.at && !G.evDone.has(k)) { G.evDone.add(k); spawnBoss(ev.id); } });
}
// 보스 움직임: 걷기 → (gap 초) → 패턴 차례대로. 돌진은 예고 동안 방향을 따라가다 끝에 굳힌다
function bossTick(e, dt) {
  const p = G.p, B = e.boss, dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
  e.bt -= dt;
  if (e.st === 'walk') {
    e.vx = dx / d * e.spd; e.x += e.vx * dt; e.y += dy / d * e.spd * dt;
    if (e.bt > 0) return;
    const pat = B.pats[e.pi++ % B.pats.length];
    if (pat === 'charge') { e.st = 'aimC'; e.bt = 0.8; e.dir = Math.atan2(dy, dx); }
    else if (pat === 'slam') { e.st = 'aimS'; e.bt = 1.0; }
    else if (pat === 'summon') {
      for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2, s = makeEnemy(pickMob(), e.x + Math.cos(a) * (e.r + 40), e.y + Math.sin(a) * (e.r + 40)); s.summon = true; G.enemies.push(s); }
      G.fx.push({kind: 'splash', x: e.x, y: e.y, r: e.r + 50, t: 0.3});
      e.bt = B.gap;
    }
  } else if (e.st === 'aimC') {
    if (e.bt > 0.25) e.dir = Math.atan2(dy, dx);                 // 마지막 0.25초는 방향을 굳힘 (피할 틈)
    if (e.bt <= 0) { e.st = 'dash'; e.bt = DASH_T; }
  } else if (e.st === 'dash') {
    e.vx = Math.cos(e.dir) * DASH_SPD; e.x += e.vx * dt; e.y += Math.sin(e.dir) * DASH_SPD * dt;
    if (e.bt <= 0) { e.st = 'walk'; e.bt = B.gap; }
  } else if (e.st === 'aimS') {
    if (e.bt <= 0) {
      G.fx.push({kind: 'splash', x: e.x, y: e.y, r: SLAM_R, t: 0.35});
      if (p.inv <= 0 && d < SLAM_R + p.r) {
        const dmg = armor(SLAM_DMG, G.s.def); p.hp -= dmg; p.inv = 0.5;
        G.texts.push({x: p.x, y: p.y - 24, v: -dmg, t: 0.8, me: true});
        if (p.hp <= 0) gameOver();
      }
      e.st = 'walk'; e.bt = B.gap;
    }
  }
}

function farthestEnemy(x, y, maxD) {             // 사거리 안 가장 먼 적 (저격총)
  let best = null, bd = -1;
  for (const e of G.enemies) {
    if (e.dead) continue;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if (d <= maxD * maxD && d > bd) { bd = d; best = e; }
  }
  return best;
}
function nearestEnemy(x, y, maxD, skip) {
  let best = null, bd = maxD * maxD;
  for (const e of G.enemies) {
    if (e.dead || (skip && skip.has(e))) continue;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function hurtEnemy(e, dmg) {
  if (e.dead) return;
  const real = armor(dmg, e.def);
  e.hp -= real; e.flash = 0.1;
  G.texts.push({x: e.x, y: e.y - e.r, v: Math.round(real), t: 0.6, weak: real <= dmg * 0.5});   // 방어에 반 넘게 막히면 회색
  if (e.hp <= 0) {
    e.dead = true; G.kills++;
    if (e.xp) G.gems.push({x: e.x, y: e.y, v: e.xp, pull: false});
    if (e.boss && e.boss.final) G.finalDead = true;               // 최종 보스를 잡으면 클리어 (update 에서)
    else if (e.boss) setBanner(`${e.boss.nm} 처치!`, gradeCol(e.boss.grade));
  }
}

// ───── 공격 ─────
const spreadRnd = st => (Math.random() * 2 - 1) * (st.acc || 0) * Math.PI / 180;   // 발사각: 한 발마다 ±acc 도
const AIM_T = 0.07;                   // 쏘기 직전 대상 쪽으로 도는 시간 (초)
const newWeapon = id => ({id, cdT: 0, shots: [], aim: 0, kick: 0});

// 무기 자세: 손 위치 · 각도 · 총구 위치
// 무기가 여럿이면 얼굴 높이(WPN_CY) 둘레 원(반지름 WPN_RING) 위 **정해진 자리**에 고르게 놓는다 (360° / 개수).
// 자리는 겨누는 쪽과 상관없이 고정 — 총마다 **제 자리를 축으로** 제 적을 겨눠 돈다. 짝수 개는 오른쪽부터, 홀수 개는 위부터
const WPN_RING = 22, WPN_CY = -22;   // 원 중심 = 몸 중심에서 위로 22px (얼굴 높이)
function weaponPose(w, i) {
  const p = G.p, W = WEAPONS[w.id], a = w.aim, c = Math.cos(a), sn = Math.sin(a);
  const img = WEAPON_IMG[w.id], len = W.len, h = img ? len * img.height / img.width : len * 0.6;
  const back = w.kick * 5;                                       // 반동: 쏘면 뒤로 살짝
  const n = G.weapons.length;
  let hx, hy;
  if (n > 1) {
    const th = (n % 2 ? -Math.PI / 2 : 0) + i * Math.PI * 2 / n;
    hx = p.x + Math.cos(th) * WPN_RING - c * back; hy = p.y + WPN_CY + Math.sin(th) * WPN_RING - sn * back;
  } else { hx = p.x + c * (9 - back); hy = p.y + WPN_CY + sn * (9 - back); }   // 하나면 몸 앞
  const flip = c < 0 ? -1 : 1;                                   // 왼쪽을 보면 위아래를 뒤집어 손잡이가 아래로
  const mx = (W.muzzle[0] - W.pivot[0]) * len, my = (W.muzzle[1] - W.pivot[1]) * h * flip;
  return {hx, hy, a, flip, len, h, mx: hx + c * mx - sn * my, my: hy + sn * mx + c * my};
}

// 총 계열: 가장 가까운 적에게, 투사체 수만큼 부채꼴로. 총구에서 나간다
function fireGun(st, w, i) {
  const p = G.p;
  const tgt = nearestEnemy(p.x, p.y, st.range);
  if (!tgt) return;
  w.aim = Math.atan2(tgt.y - p.y, tgt.x - p.x); w.kick = 1;     // 쏘는 순간엔 정확히 그쪽
  const m = weaponPose(w, i), base = Math.atan2(tgt.y - m.my, tgt.x - m.mx), spread = 0.14;
  for (let k = 0; k < st.count; k++) {
    const a = base + (k - (st.count - 1) / 2) * spread + spreadRnd(st);
    G.bullets.push({x: m.mx, y: m.my, vx: Math.cos(a) * st.spd, vy: Math.sin(a) * st.spd,
      dmg: st.dmg, knock: st.knock, splash: st.splash, chain: st.chain, travel: 0, maxTravel: st.range * 1.25, hit: new Set()});
  }
  G.fx.push({kind: 'muzzle', x: m.mx, y: m.my, t: 0.06});
}

// 저격총: 가장 먼 적 쪽으로 빠른 관통탄. 날아가는 길의 적 모두 맞고 사거리 끝(+30px)까지 간다
function fireRail(st, w, i) {
  const p = G.p, W = WEAPONS[w.id];
  const tgt = farthestEnemy(p.x, p.y, st.range);
  if (!tgt) return;
  w.aim = Math.atan2(tgt.y - p.y, tgt.x - p.x); w.kick = 1;
  const m = weaponPose(w, i), base = Math.atan2(tgt.y - m.my, tgt.x - m.mx), spread = 0.12;
  for (let k = 0; k < st.count; k++) {
    const a = base + (k - (st.count - 1) / 2) * spread + spreadRnd(st);
    G.bullets.push({x: m.mx, y: m.my, vx: Math.cos(a) * st.spd, vy: Math.sin(a) * st.spd, pierce: true, pleft: st.pierce || Infinity, rad: W.width / 2,
      dmg: st.dmg, knock: st.knock, splash: 0, chain: st.chain, tgt, travel: 0, maxTravel: st.range + 30, hit: new Set()});
  }
  G.fx.push({kind: 'muzzle', x: m.mx, y: m.my, t: 0.08});
}

const LASER_BEND = [60, 35, 18, 10];   // 마디별 휨(도) — 마디가 출발할 때 곧은 선에서 벌어지는 각. 첫 마디가 가장 크게
const LASER_HANDLE = 0.42;             // 베지어 손잡이 길이 (마디 길이 비율)
const LASER_SPEED = 420;              // 빔 끝이 다음 적으로 뻗어 가는 빠르기 (px/초)
const LASER_SAMPLES = 16;             // 마디 하나를 몇 조각 꺾은선으로 (그리기 · 맞힘 판정 공용)
// 점들(총구 · 적 …)을 지나는 매끄러운 곡선 — 마디마다 3차 베지어, 이음점은 앞뒤 마디가 같은 접선 (꺾이지 않게)
// 마디 k 가 원하는 출발각 = 곧은 각 + 휨, 도착각 = 곧은 각 - 휨. 이음점 접선 = 앞 마디 도착각과 뒤 마디 출발각의 평균
function laserSegs(P) {
  const n = P.length - 1, a = [], b = [], L = [], c0 = [], segs = [];
  for (let k = 0; k < n; k++) {
    const A = P[k], B = P[k + 1], c = Math.atan2(B.y - A.y, B.x - A.x);
    const d = LASER_BEND[Math.min(k, LASER_BEND.length - 1)] * Math.PI / 180 * (k % 2 ? -1 : 1);
    a.push(c + d); b.push(c - d); L.push(Math.hypot(B.x - A.x, B.y - A.y)); c0.push(c);
  }
  const T = [c0[0]];   // 총구에선 적을 똑바로 향해 나간다 (옆으로 쏘지 않게). 휨은 첫 마디 끝 · 이음점에서 생긴다
  for (let j = 1; j < n; j++) T.push(Math.atan2(Math.sin(b[j - 1]) + Math.sin(a[j]), Math.cos(b[j - 1]) + Math.cos(a[j])));
  T.push(b[n - 1]);
  for (let k = 0; k < n; k++) {
    const A = P[k], B = P[k + 1], h = L[k] * LASER_HANDLE;
    const c1x = A.x + Math.cos(T[k]) * h, c1y = A.y + Math.sin(T[k]) * h, c2x = B.x - Math.cos(T[k + 1]) * h, c2y = B.y - Math.sin(T[k + 1]) * h;
    const seg = [];
    for (let i = 0; i <= LASER_SAMPLES; i++) {
      const u = i / LASER_SAMPLES, v = 1 - u;
      seg.push({x: v * v * v * A.x + 3 * v * v * u * c1x + 3 * v * u * u * c2x + u * u * u * B.x,
                y: v * v * v * A.y + 3 * v * v * u * c1y + 3 * v * u * u * c2y + u * u * u * B.y});
    }
    seg.len = seg.reduce((s, q, i) => i ? s + Math.hypot(q.x - seg[i - 1].x, q.y - seg[i - 1].y) : 0, 0);
    segs.push(seg);
  }
  return segs;
}
// 지금 그려진 만큼(prog 마디)의 꺾은선
function beamLine(bm) {
  const out = [], full = Math.floor(bm.prog), fr = bm.prog - full;
  bm.segs.forEach((seg, k) => {
    if (k < full) { out.push(...(k ? seg.slice(1) : seg)); return; }
    if (k > full || fr <= 0) return;
    const f = fr * LASER_SAMPLES, i = Math.floor(f), w = f - i;
    out.push(...(k ? seg.slice(1, i + 1) : seg.slice(0, i + 1)));
    if (i < LASER_SAMPLES) out.push({x: seg[i].x + (seg[i + 1].x - seg[i].x) * w, y: seg[i].y + (seg[i + 1].y - seg[i].y) * w});
  });
  return out;
}
// 굴곡 레이저 — 늘 켜진 빔. 마디(node)마다 겨누는 적(e)과 **그려지는 자리(x, y)** 가 따로 있다
// 처음엔 총구에서 첫 적으로 천천히 뻗어 가고(prog), 닿으면 그 적 둘레(hop)의 다음 적으로 또 뻗는다 (최대 chain)
// 겨누던 적이 죽거나 멀어지면 **빔을 거두지 않고** 그 마디가 지금 자리에서 새 적으로 미끄러져 옮겨 간다 (LASER_MOVE)
// 맞힘: 쿨다운마다 **빔이 지나는 길 위의 적 모두** 한 번씩 (연쇄 대상이 아니어도)
const LASER_MOVE = 700;               // 마디가 새 적으로 옮겨 가는 빠르기 (px/초)
function updateLaser(w, wi, st, dt) {
  const p = G.p, W = WEAPONS[w.id], hop = W.hop * st.range / W.range;
  let bm = w.beam;
  const before = k => new Set(bm.nodes.slice(0, k).map(n => n.e));   // 앞 마디들이 겨눈 적 (뒤 마디의 적은 가져와도 됨)
  if (bm) {
    // 마디마다 겨눌 적 다시 확인 — 죽었거나 멀어졌으면 새 적으로 (자리는 그대로, 아래에서 미끄러져 감)
    for (let k = 0; k < bm.nodes.length; k++) {
      const n = bm.nodes[k], from = k ? bm.nodes[k - 1].e : p, lim = k ? hop * 1.3 : st.range * 1.15;
      if (!n.e.dead && Math.hypot(n.e.x - from.x, n.e.y - from.y) <= lim) continue;
      const nx = nearestEnemy(from.x, from.y, k ? hop : st.range, before(k));
      if (nx) {
        n.e = nx;
        const dup = bm.nodes.findIndex((q, j) => j > k && q.e === nx);   // 뒤 마디의 적을 가져왔으면 그 마디는 빠진다
        if (dup > 0) { bm.nodes.splice(dup, 1); bm.prog = Math.min(bm.prog, bm.nodes.length); }
        continue;
      }
      bm.nodes.length = k; bm.prog = Math.min(bm.prog, k);   // 이을 적이 없으면 거기서 잘림
      break;
    }
    if (!bm.nodes.length) bm = w.beam = null;
  }
  if (!bm) {
    const f = nearestEnemy(p.x, p.y, st.range);
    if (!f) { w.cdT = Math.max(0, w.cdT - dt); return; }
    bm = w.beam = {nodes: [{e: f, x: f.x, y: f.y}], prog: 0, ph: Math.random(), segs: []};
  }
  // 마디 자리를 겨누는 적 쪽으로 옮긴다 (붙어 있으면 그대로 따라감)
  for (const n of bm.nodes) {
    const dx = n.e.x - n.x, dy = n.e.y - n.y, d = Math.hypot(dx, dy), mv = LASER_MOVE * dt;
    if (d <= mv) { n.x = n.e.x; n.y = n.e.y; } else { n.x += dx / d * mv; n.y += dy / d * mv; }
  }
  const m = weaponPose(w, wi);
  bm.segs = laserSegs([{x: m.mx, y: m.my}, ...bm.nodes]);
  // 뻗기 (새 마디만 — 이미 그려진 마디는 옮겨 갈 뿐 다시 뻗지 않는다)
  const k = Math.floor(bm.prog);
  if (k < bm.nodes.length) bm.prog = Math.min(bm.nodes.length, bm.prog + dt * LASER_SPEED / Math.max(20, bm.segs[k].len));
  if (bm.prog >= bm.nodes.length && bm.nodes.length < st.chain + 1) {   // 첫 적 + 연쇄
    const last = bm.nodes[bm.nodes.length - 1].e, nx = nearestEnemy(last.x, last.y, hop, new Set(bm.nodes.map(q => q.e)));
    if (nx) bm.nodes.push({e: nx, x: nx.x, y: nx.y});
  }
  // 맞힘
  w.cdT -= dt;
  if (w.cdT > 0) return;
  w.cdT = st.cd;
  const line = beamLine(bm);
  if (line.length < 2) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const q of line) { x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y); }
  for (const e of G.enemies) {
    if (e.dead) continue;
    const r = e.r + 4;
    if (e.x < x0 - r || e.x > x1 + r || e.y < y0 - r || e.y > y1 + r) continue;
    for (let i = 1; i < line.length; i++) {
      const A = line[i - 1], B = line[i], dx = B.x - A.x, dy = B.y - A.y, L2 = dx * dx + dy * dy || 1;
      const u = Math.max(0, Math.min(1, ((e.x - A.x) * dx + (e.y - A.y) * dy) / L2));
      if (Math.hypot(A.x + dx * u - e.x, A.y + dy * u - e.y) <= r) { hurtEnemy(e, st.dmg); break; }
    }
  }
}

// 총알 연쇄: e 를 맞힌 b 를 다음 적으로 돌린다. 이을 적이 없으면 false
const CHAIN_HOP = 170;                // 연쇄로 다음 적을 찾는 거리 (px)
function chainBullet(b, e) {
  const nx = nearestEnemy(e.x, e.y, CHAIN_HOP, b.hit);
  if (!nx) return false;
  const sp = Math.hypot(b.vx, b.vy), d = Math.hypot(nx.x - e.x, nx.y - e.y) || 1;
  b.x = e.x; b.y = e.y; b.vx = (nx.x - e.x) / d * sp; b.vy = (nx.y - e.y) / d * sp;
  b.chain--; b.tgt = nx;
  b.maxTravel = b.travel + CHAIN_HOP * 1.3;                     // 튄 뒤엔 다음 적까지만 (빗나가면 곧 사라짐)
  G.fx.push({kind: 'muzzle', x: e.x, y: e.y, t: 0.05});
  return true;
}

// ───── 갱신 ─────
function update(dt) {
  const p = G.p, s = G.s;
  G.t += dt;
  if (G.finalDead) { worldClear(); return; }                     // 최종 보스를 잡아야 클리어 (시간이 다 돼도 보스가 나올 뿐)
  timelineTick();
  if (G.banner && (G.banner.t -= dt) <= 0) G.banner = null;

  // 이동
  let mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), my = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  if (mx || my) { const l = Math.hypot(mx, my); mx /= l; my /= l; }
  else if (joy.id !== null) { const v = joyVec(); mx = v.x; my = v.y; }   // 조이스틱은 끌어낸 만큼 (0~1)
  else if (pad.v.x || pad.v.y) { const l = Math.max(1, Math.hypot(pad.v.x, pad.v.y)); mx = pad.v.x / l; my = pad.v.y / l; }   // 패드 왼쪽 스틱
  const amt = Math.hypot(mx, my);
  p.x += mx * p.speed * dt; p.y += my * p.speed * dt;
  // 몸 방향: 움직이는 동안엔 이동 방향만 따른다 (위아래로만 갈 땐 그대로). 서 있을 때만 아래 조준이 공격 방향으로 돌린다
  p.moving = amt > 0.15;
  if (Math.abs(mx) > 0.15) p.face = Math.sign(mx);
  p.move += (amt - p.move) * Math.min(1, dt * 10);   // 걷기 세기 0~1 (멈추면 서서히 가라앉음)
  p.walk += dt * Math.PI * p.speed / WALK_STRIDE * p.move;   // 한 걸음(통통 한 번 = π) 에 WALK_STRIDE 만큼 나아간다 — 빠른 캐릭터는 발도 빠르게
  p.inv = Math.max(0, p.inv - dt);

  // 생성: 초당 1.2 + 0.06·초 마리, 1분마다 둘레 무리
  G.spawnAcc += spawnRate() * dt;
  if (G.spawnAcc >= 1) {
    let n = mobCount();
    const cap = SPAWN.cap(G.t / 60);
    while (G.spawnAcc >= 1) {
      G.spawnAcc--;
      if (n >= cap) { G.missed++; continue; }                     // 상한: 이 차례는 버림 (알리지 않음)
      spawnEnemy(); n++;
    }
  }

  // 조준 · 발사 — 무기마다 따로 (연속공격은 0.1초 간격)
  // 총(권총 · 저격총)은 **쏘기 전까지 방향을 그대로** 둔다 (적을 미리 따라 돌면 덜덜거림).
  // 쏠 때가 되면 AIM_T 초 동안 그때의 대상 쪽으로 짧게 돌고 → 발사. 레이저는 늘 쏘고 있으므로 계속 따라 돈다
  G.weapons.forEach((w, wi) => {
    const kind = WEAPONS[w.id].kind, st = wstat(w.id);
    const tgt = (kind === 'rail' ? farthestEnemy : nearestEnemy)(p.x, p.y, st.range);
    const turnTo = (want, k) => { let d = want - w.aim; d = Math.atan2(Math.sin(d), Math.cos(d)); w.aim += d * k; };   // 가까운 쪽으로
    w.kick = Math.max(0, w.kick - dt * 8);
    if (kind === 'laser') {
      if (tgt) { let d = Math.atan2(tgt.y - p.y, tgt.x - p.x) - w.aim; d = Math.atan2(Math.sin(d), Math.cos(d));
                 w.aim += Math.sign(d) * Math.min(Math.abs(d), WEAPONS[w.id].turn * dt); }
      if (wi === 0 && tgt && !p.moving) p.face = Math.cos(w.aim) >= 0 ? 1 : -1;
      updateLaser(w, wi, st, dt); return;
    }
    w.cdT -= dt;
    if (w.cdT <= 0 && tgt && !w.shots.length) {
      w.cdT = st.cd;
      for (let i = 0; i < st.burst; i++) w.shots.push(AIM_T + i * 0.1);
    }
    // 다음 발이 AIM_T 안으로 들어오면 그 발이 겨눌 대상 쪽으로 남은 시간에 맞춰 돈다 (발사 순간 딱 맞게)
    const next = w.shots.length ? Math.min(...w.shots) : Infinity;
    if (next <= AIM_T + 1e-6 && tgt) turnTo(Math.atan2(tgt.y - p.y, tgt.x - p.x), Math.min(1, dt / Math.max(dt, next)));
    if (wi === 0 && w.shots.length && !p.moving) p.face = Math.cos(w.aim) >= 0 ? 1 : -1;   // 서서 쏘면 몸도 그쪽을 본다
    w.shots = w.shots.map(t => t - dt).filter(t => t > 0 || ((kind === 'rail' ? fireRail : fireGun)(st, w, wi), false));
  });

  // 적 이동 + 겹침 밀어내기 (격자 버킷)
  const grid = new Map(), CELL = 48;
  for (const e of G.enemies) {
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    if (e.boss) bossTick(e, dt);
    else { e.vx = dx / d * e.spd; e.x += e.vx * dt; e.y += dy / d * e.spd * dt; }
    e.x += e.kbx * dt; e.y += e.kby * dt;
    const kd = Math.exp(-8 * dt); e.kbx *= kd; e.kby *= kd;     // 넉백은 빠르게 잦아든다
    e.flash = Math.max(0, e.flash - dt);
    const k = ((e.x / CELL) | 0) + ',' + ((e.y / CELL) | 0);
    (grid.get(k) || grid.set(k, []).get(k)).push(e);
  }
  for (const e of G.enemies) {
    const cx = (e.x / CELL) | 0, cy = (e.y / CELL) | 0;
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      const b = grid.get((cx + ox) + ',' + (cy + oy)); if (!b) continue;
      for (const o of b) {
        if (o === e || e.boss) continue;                            // 보스는 밀리지 않는다
        const dx = e.x - o.x, dy = e.y - o.y, min = e.r + o.r, d2 = dx * dx + dy * dy;
        if (d2 < min * min && d2 > 0.01) {
          const d = Math.sqrt(d2), push = (min - d) * 0.25;
          e.x += dx / d * push; e.y += dy / d * push;
        }
      }
    }
    // 닿으면 피해
    if (p.inv <= 0 && (e.x - p.x) ** 2 + (e.y - p.y) ** 2 < (e.r + p.r) ** 2) {
      const dmg = armor(e.dmg, s.def);
      p.hp -= dmg; p.inv = 0.5;
      G.texts.push({x: p.x, y: p.y - 24, v: -dmg, t: 0.8, me: true});
      if (p.hp <= 0) { gameOver(); return; }
    }
  }

  // 투사체
  for (const b of G.bullets) {
    const st = Math.hypot(b.vx, b.vy) * dt, ox = b.x, oy = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt; b.travel += st;
    if (b.travel > b.maxTravel) { b.dead = true; continue; }
    for (const e of G.enemies) {
      if (e.dead || b.hit.has(e)) continue;
      if (b.pierce) {                                             // 관통탄: 이번 프레임에 지나온 선분과의 거리
        const dx = b.x - ox, dy = b.y - oy, u = Math.max(0, Math.min(1, ((e.x - ox) * dx + (e.y - oy) * dy) / (dx * dx + dy * dy || 1)));
        if (Math.hypot(ox + dx * u - e.x, oy + dy * u - e.y) > e.r + b.rad) continue;
      } else if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 > (e.r + 5) ** 2) continue;
      hurtEnemy(e, b.dmg); b.hit.add(e);
      if (b.splash) {
        const R = splashR(b.splash), sd = b.dmg * splashPct(b.splash);
        G.fx.push({kind: 'splash', x: b.x, y: b.y, r: R, t: 0.25});
        for (const o of G.enemies) if (o !== e && !o.dead && (o.x - b.x) ** 2 + (o.y - b.y) ** 2 < (R + o.r) ** 2) hurtEnemy(o, sd);
      }
      if (b.knock) {                                              // 총알이 날던 방향으로 밀림. 큰 적은 덜 밀림
        const sp = Math.hypot(b.vx, b.vy), v0 = knockV(b.knock) * Math.min(1, 15 / e.r);
        e.kbx += b.vx / sp * v0; e.kby += b.vy / sp * v0;
      }
      // 연쇄: 남은 수가 있으면 맞힌 자리에서 아직 안 맞은 가장 가까운 적(CHAIN_HOP 안)으로 방향을 틀어 더 날아간다
      //   관통탄은 겨눈 적(tgt)을 맞힐 때 튼다 (길 위의 다른 적은 그냥 꿰뚫음)
      if (b.chain > 0 && (!b.pierce || e === b.tgt) && chainBullet(b, e)) { if (b.pierce) continue; break; }   // 튄 관통탄은 관통 수를 안 씀 (연쇄가 한 마리 더)
      if (b.pierce && --b.pleft > 0) continue;                    // 관통탄은 남은 관통 수만큼 계속 날아간다
      b.dead = true;
      break;
    }
  }

  // 보석
  const magnet = 90;
  for (const g of G.gems) {
    const dx = p.x - g.x, dy = p.y - g.y, d = Math.hypot(dx, dy);
    if (d < magnet) g.pull = true;
    if (g.pull) { const sp = 420 * dt; g.x += dx / d * Math.min(sp, d); g.y += dy / d * Math.min(sp, d); }
    if (d < p.r + 6) { g.dead = true; gainXp(g.v); }
  }

  // 너무 멀어진 적은 다시 둘레로 (버려진 적이 쌓이지 않게)
  const far = Math.hypot(W, H) * 0.9;
  for (const e of G.enemies) if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) > far) {
    const a = Math.random() * Math.PI * 2, d = Math.hypot(W, H) / 2 + 60;
    e.x = p.x + Math.cos(a) * d; e.y = p.y + Math.sin(a) * d;
  }

  G.enemies = G.enemies.filter(e => !e.dead);
  G.bullets = G.bullets.filter(b => !b.dead);
  G.gems = G.gems.filter(g => !g.dead);
  G.fx = G.fx.filter(f => (f.t -= dt) > 0);
  G.texts = G.texts.filter(t => (t.t -= dt) > 0);
}

function gameOver() {
  G.mode = 'over'; joy.id = null;
  $('result').innerHTML = saveRec();
  $('over').hidden = false;
}

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

// ───── 그리기 ─────
// 들썩: 종류마다 뛰는 빠르기(hz) · 높이(amp, 그림 키 비율) · 착지 찌그러짐(sq) · 흔들림(tilt) · 부드러운 오르내림(smooth: 박쥐)
const WALK_STRIDE = 64;   // 주인공 한 걸음 거리(px). 속도 190 이면 초당 약 3 걸음 (그 전: 속도와 상관없이 초당 5.2)
const BOB = {
  survivor: {amp: 0.08, sq: 0.10, tilt: 0.06},
  zombie:   {hz: 1.5, amp: 0.05, sq: 0.06, tilt: 0.10},   // 비틀비틀
  dog:      {hz: 3.6, amp: 0.10, sq: 0.08, tilt: 0.05},   // 다다닥
  brute:    {hz: 1.2, amp: 0.04, sq: 0.06, tilt: 0.07},   // 쿵쿵
  crawler:  {hz: 2.2, amp: 0.02, sq: 0.10, tilt: 0.04},   // 질질
  riot:     {hz: 1.4, amp: 0.04, sq: 0.05, tilt: 0.06},
  bossmid:  {hz: 1.0, amp: 0.04, sq: 0.06, tilt: 0.06},   // 보스: 무겁게
  bossking: {hz: 0.9, amp: 0.03, sq: 0.05, tilt: 0.05},
};
// ph: 위상(라디안), k: 세기 0~1. 들린 높이(px)를 돌려줌 → 그림자 크기에 씀
function bobOf(name, ph, k, h) {
  const B = BOB[name];
  const hop = B.smooth ? (Math.sin(ph) + 1) / 2 : Math.abs(Math.sin(ph));   // 0 = 땅, 1 = 꼭대기
  return {lift: hop * B.amp * h * k, sy: 1 - (1 - hop) ** 3 * B.sq * k + hop * B.sq * 0.5 * k,
          tilt: Math.sin(B.smooth ? ph : ph * 0.5) * B.tilt * k};
}

// byArea: 적은 **면적**으로 크기를 맞춘다 — 그림 넓이 = (h² × SPRITE_AREA), 가로 · 세로 비율은 그림 그대로. 같은 등급(반지름)이면 같은 넓이
//   주인공은 예전처럼 높이 h
const SPRITE_AREA = 0.55;             // 서 있는 좀비(폭/높이 ≈ 0.53)가 예전과 거의 같은 크기가 되는 값
function drawSprite(name, x, y, h, flip, fallback, bob, byArea) {
  const img = SPRITES[name];
  const b = bob || {lift: 0, sy: 1, tilt: 0};
  if (!img) { ctx.save(); ctx.translate(0, -b.lift); fallback(); ctx.restore(); return; }
  const foot = y + h * 0.38;                                     // 발밑을 축으로 찌그러뜨린다
  const asp = img.width / img.height;
  const hh = byArea ? h * Math.sqrt(SPRITE_AREA / asp) : h, w = hh * asp;
  ctx.save(); ctx.translate(x, foot - b.lift);
  ctx.rotate(b.tilt);
  ctx.scale((flip ? -1 : 1) / Math.sqrt(b.sy), b.sy);          // 납작해지면 옆으로 퍼짐
  ctx.drawImage(img, -w / 2, -hh, w, hh);
  ctx.restore();
}

function drawWeapon(w, m) {
  const W = WEAPONS[w.id], img = WEAPON_IMG[w.id];
  ctx.save(); ctx.translate(m.hx, m.hy); ctx.rotate(m.a); ctx.scale(1, m.flip);
  if (img) ctx.drawImage(img, -W.pivot[0] * m.len, -W.pivot[1] * m.h, m.len, m.h);
  else { ctx.fillStyle = '#333'; ctx.fillRect(-4, -3, m.len, 6); }
  ctx.restore();
}

function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#1f2125'; ctx.fillRect(0, 0, W, H);             // 아스팔트
  if (!G) return;
  const p = G.p, ox = W / 2 - p.x, oy = H / 2 - p.y;

  // 바닥: 블록 줄 + 큰 간격마다 노란 점선 차선
  ctx.strokeStyle = '#272a2f'; ctx.lineWidth = 1; ctx.beginPath();
  const S = 64;
  for (let x = ((ox % S) + S) % S; x < W; x += S) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = ((oy % S) + S) % S; y < H; y += S) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  const LANE = S * 8;
  ctx.strokeStyle = 'rgba(230,190,60,.28)'; ctx.lineWidth = 4; ctx.setLineDash([36, 28]);
  ctx.lineDashOffset = -ox;
  ctx.beginPath();
  for (let y = ((oy % LANE) + LANE) % LANE; y < H; y += LANE) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset = 0;

  ctx.save(); ctx.translate(ox, oy);

  // 사거리
  ctx.strokeStyle = 'rgba(120,200,255,.12)'; ctx.setLineDash([6, 8]);
  const maxRange = Math.max(...G.weapons.map(w => wstat(w.id).range));
  ctx.beginPath(); ctx.arc(p.x, p.y, maxRange, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);

  // 보석
  for (const g of G.gems) {
    ctx.fillStyle = g.v > 1 ? '#fc4' : '#4cf';
    const r = g.v > 1 ? 7 : 5;
    ctx.beginPath(); ctx.moveTo(g.x, g.y - r); ctx.lineTo(g.x + r * 0.7, g.y); ctx.lineTo(g.x, g.y + r); ctx.lineTo(g.x - r * 0.7, g.y); ctx.fill();
  }

  // 적 (아래 있는 것이 앞에)
  const view = (x, y, m) => x + ox > -m && x + ox < W + m && y + oy > -m && y + oy < H + m;
  const es = G.enemies.filter(e => view(e.x, e.y, e.r * 4)).sort((a, b) => a.y - b.y);
  // 보스 예고 (땅에): 돌진 = 붉은 띠, 범위 = 차오르는 붉은 원
  for (const e of G.enemies) {
    if (!e.boss) continue;
    if (e.st === 'aimC') {
      const L = DASH_SPD * DASH_T, k = 1 - Math.max(0, e.bt) / 0.8;
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.dir);
      ctx.fillStyle = `rgba(255,60,40,${0.15 + 0.25 * k})`; ctx.fillRect(0, -e.r * 0.8, L, e.r * 1.6);
      ctx.strokeStyle = 'rgba(255,90,60,.8)'; ctx.lineWidth = 2; ctx.strokeRect(0, -e.r * 0.8, L, e.r * 1.6);
      ctx.restore();
    } else if (e.st === 'aimS') {
      const k = 1 - Math.max(0, e.bt) / 1.0;
      ctx.fillStyle = 'rgba(255,60,40,.18)'; ctx.beginPath(); ctx.arc(e.x, e.y, SLAM_R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,60,40,.3)'; ctx.beginPath(); ctx.arc(e.x, e.y, SLAM_R * k, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,90,60,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, SLAM_R, 0, Math.PI * 2); ctx.stroke();
    }
  }
  for (const e of es) {
    const T = ENEMY_TYPES[e.type] || {faceLeft: FACE[e.type], color: '#a44'}, eh = e.r * 3.4;   // 보스 그림은 적 표에 없음
    const bob = bobOf(e.type, G.t * Math.PI * 2 * BOB[e.type].hz + e.ph, 1, eh), sh = 1 - bob.lift / eh * 2;
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(e.x, e.y + e.r * 0.8, e.r * sh, e.r * 0.35 * sh, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = e.flash > 0 ? 0.55 : 1;
    if (e.elite != null) {                                        // 엘리트 · 보스: 등급 색 테두리(빛)가 깜빡인다
      ctx.shadowColor = gradeCol(e.elite); ctx.shadowBlur = 6 + 8 * (0.5 + 0.5 * Math.sin(G.t * 8));
    }
    // 왼쪽을 보는 그림은 오른쪽으로 갈 때, 오른쪽을 보는 그림은 왼쪽으로 갈 때 뒤집는다
    drawSprite(e.type, e.x, e.y, eh, T.faceLeft ? e.vx > 0 : e.vx < 0, () => circle(e.x, e.y, e.r, e.flash > 0 ? '#fff' : T.color), bob, true);
    if (e.elite != null) {                                        // 빛을 한 번 더 겹쳐 테두리를 또렷하게
      drawSprite(e.type, e.x, e.y, eh, T.faceLeft ? e.vx > 0 : e.vx < 0, () => {}, bob, true);
      ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
    }
    ctx.globalAlpha = 1;
    if (e.hp < e.maxHp && !e.boss) {                              // 보스 체력은 위쪽 큰 줄에
      ctx.fillStyle = '#300'; ctx.fillRect(e.x - e.r, e.y - e.r * 2.3, e.r * 2, 3);
      ctx.fillStyle = '#f44'; ctx.fillRect(e.x - e.r, e.y - e.r * 2.3, e.r * 2 * e.hp / e.maxHp, 3);
    }
  }

  // 플레이어
  const pb = bobOf('survivor', p.walk, p.move, 54), psh = 1 - pb.lift / 54 * 2;
  pb.sy *= 1 + Math.sin(G.t * 3) * 0.015 * (1 - p.move);       // 서 있으면 숨쉬기만
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 12, 13 * psh, 5 * psh, 0, 0, Math.PI * 2); ctx.fill();
  // 무기는 늘 몸 위에 그린다 (어느 쪽을 겨눠도 가려지지 않게)
  const poses = G.weapons.map((w, i) => [w, weaponPose(w, i)]);
  const blink = p.inv > 0 && Math.floor(G.t * 20) % 2;
  if (!blink) {
    drawSprite(G.char.sprite, p.x, p.y, 54, FACE[G.char.sprite] ? p.face > 0 : p.face < 0, () => { circle(p.x, p.y, p.r, '#fd6'); circle(p.x + p.face * 5, p.y - 3, 3, '#333'); }, pb);
  }
  if (!blink) poses.forEach(([w, m]) => drawWeapon(w, m));
  // 쿨타임 미터: 총마다 손잡이 자리에 작은 파이 — 다음 발까지 찬 만큼 시계 방향으로 채워짐, 다 차면 밝게
  for (const [w, m] of poses) {
    const cd = wstat(w.id).cd, k = cd > 0 ? 1 - Math.max(0, Math.min(cd, w.cdT || 0)) / cd : 1, R = 5, x = m.hx, y = m.hy + 9;
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.beginPath(); ctx.arc(x, y, R + 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = k >= 1 ? '#ffe27a' : '#9ab';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.closePath(); ctx.fill();
  }
  // 머리 위: 레벨 글 + 체력 줄 + 그 바로 밑 경험치 줄 (총 고리보다 위) — 늘 보인다. 레벨 글까지 합친 폭을 캐릭터 가운데에
  ctx.font = 'bold 10px system-ui';
  { const lt = 'Lv' + G.lv, tw = ctx.measureText(lt).width, gap = 3, bw = 36;
    const bh = 5, xh = 3, bx = p.x - (tw + gap + bw) / 2 + tw + gap, by = p.y - 60, k = Math.max(0, p.hp / p.maxHp), kx = Math.min(1, G.xp / xpNeed(G.lv));
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + xh + 3);
    ctx.fillStyle = '#3a1416'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = k > 0.3 ? '#e44' : (Math.floor(G.t * 6) % 2 ? '#f77' : '#c22'); ctx.fillRect(bx, by, bw * k, bh);
    ctx.fillStyle = '#132234'; ctx.fillRect(bx, by + bh + 1, bw, xh);
    ctx.fillStyle = '#5bf'; ctx.fillRect(bx, by + bh + 1, bw * kx, xh);
    // 레벨: 두 줄 왼쪽에 (검은 테 흰 글씨)
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const ly = by + (bh + xh + 1) / 2;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(lt, bx - gap, ly);
    ctx.fillStyle = '#fff'; ctx.fillText(lt, bx - gap, ly);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; }

  // 투사체
  // 총알: 날아가는 쪽으로 짧은 노란 꼬리
  ctx.lineCap = 'round';
  for (const b of G.bullets) {
    const sp = Math.hypot(b.vx, b.vy), tl = b.pierce ? 34 : 12, tx = b.vx / sp * tl, ty = b.vy / sp * tl;
    if (b.pierce) {                                               // 저격탄: 긴 흰 꼬리 + 붉은 빛
      ctx.strokeStyle = 'rgba(255,110,70,.4)'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(b.x - tx, b.y - ty); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = '#fff6e8'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(b.x - tx * 0.7, b.y - ty * 0.7); ctx.lineTo(b.x, b.y); ctx.stroke();
      continue;
    }
    ctx.strokeStyle = 'rgba(255,200,80,.35)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(b.x - tx, b.y - ty); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.strokeStyle = '#ffe9a0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x - tx * 0.6, b.y - ty * 0.6); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // 굴곡 레이저: 그려진 만큼의 꺾은선 (updateLaser 가 계산). 청록 빛 3겹 · 닿은 적 빛 점 · 뻗는 끝 빛
  for (const [w, m] of poses) {
    const bm = w.beam;
    if (!bm || !bm.segs.length) continue;
    const line = beamLine(bm);
    if (line.length < 2) continue;
    const fl = 0.75 + 0.25 * Math.sin((G.t + bm.ph) * 60);   // 지글지글
    line[0] = {x: m.mx, y: m.my};                               // 총구는 이번 프레임 자세에 붙인다
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(line[0].x, line[0].y);
    for (const q of line) ctx.lineTo(q.x, q.y);
    ctx.strokeStyle = `rgba(60,220,255,${0.22 * fl})`; ctx.lineWidth = 9; ctx.stroke();
    ctx.strokeStyle = `rgba(120,240,255,${0.55 * fl})`; ctx.lineWidth = 4; ctx.stroke();
    ctx.strokeStyle = `rgba(235,255,255,${0.95 * fl})`; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = `rgba(160,245,255,${0.6 * fl})`;
    bm.nodes.forEach((n, k) => { if (k < Math.floor(bm.prog)) { ctx.beginPath(); ctx.arc(n.x, n.y, 5, 0, Math.PI * 2); ctx.fill(); } });
    const tip = line[line.length - 1];
    ctx.fillStyle = `rgba(220,255,255,${0.9 * fl})`; ctx.beginPath(); ctx.arc(tip.x, tip.y, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(200,250,255,${0.8 * fl})`; ctx.beginPath(); ctx.arc(m.mx, m.my, 3.5, 0, Math.PI * 2); ctx.fill();
  }

  // 효과: 총구 불꽃 · 스플래시
  for (const f of G.fx) {
    if (f.kind === 'muzzle') {
      ctx.fillStyle = `rgba(255,220,120,${Math.min(1, f.t * 14)})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, Math.PI * 2); ctx.fill();
      continue;
    }
    ctx.strokeStyle = `rgba(255,170,60,${f.t * 3})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.2 - f.t * 0.8), 0, Math.PI * 2); ctx.stroke();
  }

  // 숫자
  ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
  for (const t of G.texts) {
    ctx.globalAlpha = Math.min(1, t.t * 2);
    ctx.fillStyle = t.me ? '#f66' : t.weak ? '#889' : '#fff';
    ctx.fillText(t.v, t.x, t.y - (0.8 - t.t) * 30);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  offscreenMarks(ox, oy);

  // 조이스틱 (화면 좌표)
  if (joy.id !== null) {
    const v = joyVec();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, JOY_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    circle(joy.bx + v.x * JOY_R, joy.by + v.y * JOY_R, 24, 'rgba(255,255,255,.45)');
  }
}

// 화면 밖 엘리트 · 보스: 게임 칸 테두리에 얼굴 동그라미 + 그쪽을 가리키는 화살표 (등급 색)
//   가운데(주인공)에서 그 적으로 그은 선이 테두리와 만나는 곳. 보스는 크게, 엘리트는 테두리가 깜빡인다
function offscreenMarks(ox, oy) {
  for (const e of G.enemies) {
    if (e.dead || e.elite == null) continue;
    const sx = e.x + ox, sy = e.y + oy, m = e.r;
    if (sx > -m && sx < W + m && sy > -m && sy < H + m) continue;      // 보이면 안 함
    const R = e.boss ? 17 : 12, M = R + 10, dx = sx - W / 2, dy = sy - H / 2;
    const k = Math.min((W / 2 - M) / Math.max(1e-6, Math.abs(dx)), (H / 2 - M) / Math.max(1e-6, Math.abs(dy)));
    const x = W / 2 + dx * k, y = H / 2 + dy * k, a = Math.atan2(dy, dx), col = gradeCol(e.elite);
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = col; ctx.beginPath();                               // 화살표
    ctx.moveTo(Math.cos(a) * (R + 9), Math.sin(a) * (R + 9));
    ctx.lineTo(Math.cos(a + 0.5) * (R + 1), Math.sin(a + 0.5) * (R + 1));
    ctx.lineTo(Math.cos(a - 0.5) * (R + 1), Math.sin(a - 0.5) * (R + 1)); ctx.fill();
    ctx.fillStyle = '#232634'; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    const img = SPRITES[e.type];
    if (img) {                                                         // 그림 위쪽(얼굴)을 동그라미에
      ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R - 1, 0, Math.PI * 2); ctx.clip();
      const w = R * 2.6, h = w * img.height / img.width;
      ctx.drawImage(img, -w / 2, -R * 1.15, w, h); ctx.restore();
    }
    ctx.globalAlpha = e.boss ? 1 : 0.55 + 0.45 * Math.sin(G.t * 8);
    ctx.strokeStyle = col; ctx.lineWidth = e.boss ? 3 : 2; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

// 월드 타임라인 표시 (새 판마다 다시 만든다)
// 체력 줄 마디 간격 — 최대 체력 maxHp 에서 100 · 1000 이 몇 %
const hpTicks = maxHp => `--s1:${100 / maxHp * 100}%;--s10:${1000 / maxHp * 100}%`;
function buildTimeline() {
  const Wd = G.world, pct = at => Math.min(100, at / Wd.dur * 100) + '%', img = n => `images/portrait_${n}.png?v=${VERSION}`;
  let h = '';
  Wd.mobs.forEach(m => { h += `<div class="tl-m mob" data-at="${m.at}" style="left:${pct(m.at)}" title="${ENEMY_TYPES[m.type].nm} ${fmt(m.at)}"><img src="${img(m.type)}" alt=""></div>`; });
  Wd.elites.forEach(ev => { h += `<div class="tl-m elite" data-at="${ev.at}" style="left:${pct(ev.at)};--gc:${gradeCol(ev.grade)}" title="${GRADES[ev.grade].nm} 엘리트 ${fmt(ev.at)}"><i></i></div>`; });
  Wd.bosses.forEach(ev => { const B = BOSSES[ev.id]; h += `<div class="tl-m boss" data-at="${ev.at}" style="left:${pct(ev.at)};--gc:${gradeCol(B.grade)}" title="${B.nm} ${fmt(ev.at)}"><img src="${img(B.sprite)}" alt=""></div>`; });
  $('timeline').querySelector('.tl-marks').innerHTML = h;
}

function hud() {
  $('slots').hidden = !G;
  $('timeline').hidden = !G;
  if (!G) { $('bossIntro').hidden = true; $('bossBars').innerHTML = ''; $('banner').hidden = true; return; }
  const tp = Math.min(1, G.t / G.world.dur) * 100;
  $('timeline').querySelector('.tl-fill').style.width = tp + '%';
  $('timeline').querySelector('.tl-now').style.left = tp + '%';
  $('timeline').querySelectorAll('.tl-m').forEach(m => m.classList.toggle('done', G.t >= +m.dataset.at && !m.classList.contains('boss')));
  // 보스 체력 줄 — 살아 있는 보스마다 한 줄 (나온 차례대로 아래로 쌓임). 보스가 바뀔 때만 다시 만들고 줄 길이만 매번
  const bosses = G.enemies.filter(e => e.boss && !e.dead), key = bosses.map(e => e.bid).join(',');
  if ($('bossBars').dataset.k !== key) {
    $('bossBars').dataset.k = key;
    $('bossBars').innerHTML = bosses.map(e => `<div class="bb" style="--gc:${gradeCol(e.boss.grade)}"><i class="bf" style="background-image:url(images/portrait_${e.boss.sprite}.png?v=${VERSION})"></i><div class="bi"><div class="bn">${e.boss.nm}</div><div class="bar ticks" style="${hpTicks(e.maxHp)}"><i></i></div></div></div>`).join('');
  }
  [...$('bossBars').children].forEach((row, i) => { row.querySelector('.bar>i').style.width = Math.max(0, bosses[i].hp / bosses[i].maxHp * 100) + '%'; });
  $('banner').hidden = !G.banner;
  if (G.banner) { $('banner').textContent = G.banner.txt; $('banner').style.setProperty('--gc', G.banner.col); $('banner').style.opacity = Math.min(1, G.banner.t); }
  $('time').textContent = G.t >= G.world.dur && !G.finalDead ? `${fmt(G.world.dur)} 보스!` : `${fmt(G.t)} / ${fmt(G.world.dur)}`;
  $('kills').textContent = G.kills;
  const s = G.s;
  const sl = slotRow('무기 ', G.char.wSlots, 'w', G.weapons.map(w => WEAPONS[w.id].nm)) + slotRow('보조 ', G.char.sSlots, 's', G.subs.map(x => x.nm));
  if ($('slots').dataset.k !== sl) { $('slots').innerHTML = sl; $('slots').dataset.k = sl; }
  $('stats').textContent =
    `체력 ${Math.ceil(G.p.hp)}/${G.p.maxHp}  방어 ${s.def}\n` +
    G.weapons.map(w => { const t = wstat(w.id);
      return `${WEAPONS[w.id].nm}  피해 ${t.dmg.toFixed(1)}  쿨 ${t.cd.toFixed(2)}s  사거리 ${Math.round(t.range)}  탄 ${t.count}  연속 ${t.burst}  넉백 ${t.knock}  스플 ${t.splash}\n`; }).join('') +
    `적 ${G.enemies.length}`;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  navTick(dt);
  if (G) {
    if (G.mode === 'play') update(dt);
    if (G.mode === 'levelup') G.inputLock -= dt;
  }
  draw(); hud();
  requestAnimationFrame(loop);
}
showWorlds();
requestAnimationFrame(loop);
window.__G = () => G;   // 디버그
window.__nav = () => ({scr: nav.scr, r: nav.r, cs: nav.cs.slice(), el: nav.el && (nav.el.id || nav.el.innerText.split('\n')[0])});
// 완벽 플레이 기대값: 1초 단위로 기대 마릿수 × 그때 몹 섞임의 평균 경험치 + 엘리트 · 중간 보스
//   보스 · 엘리트 살아 있는 시간은 보스 20초 · 엘리트 10초로 침 (그 동안 빈도 낮춤)
window.__perfect = (wi = 0) => {
  const save = G; G = {world: WORLDS[wi], t: 0, enemies: []};
  const out = [], cum = []; let xp = 0, lv = 1, cur = 0, mobs = 0;
  const elite = new Set(), boss = new Set();
  WORLDS[wi].elites.forEach(e => { for (let s = 0; s < 10; s++) elite.add(e.at + s); });
  WORLDS[wi].bosses.forEach(b => { if (!BOSSES[b.id].final) for (let s = 0; s < 20; s++) boss.add(b.at + s); });
  for (let s = 0; s < WORLDS[wi].dur; s++) {
    G.t = s + 0.5;
    let r = SPAWN.base(G.t / 60) * (G.t >= WORLDS[wi].dur - 60 ? SPAWN.lastMin : SPAWN.rhythm(G.t % 60));
    if (boss.has(s)) r *= SPAWN.boss; else if (elite.has(s)) r *= SPAWN.elite;
    // 그 초의 몹 섞임 평균 경험치
    const ms = WORLDS[wi].mobs.filter(m => G.t >= m.at), intro = ms.find(m => m.at > 0 && G.t < m.at + SPAWN.introT);
    const wt = ms.map((m, i) => ENEMY_TYPES[m.type].w * SPAWN.ageDecay ** (ms.length - 1 - i)), ws = wt.reduce((a, b) => a + b, 0);
    let avg = ms.reduce((a, m, i) => a + ENEMY_TYPES[m.type].xp * wt[i] / ws, 0);
    if (intro) avg = avg * (1 - SPAWN.introShare) + ENEMY_TYPES[intro.type].xp * SPAWN.introShare;
    xp += r * avg; mobs += r;
    WORLDS[wi].elites.forEach(e => { if (e.at === s) xp += avg * ELITE.xp; });   // 엘리트 = 그때 몹 평균 경험치 × 12
    WORLDS[wi].bosses.forEach(b => { if (b.at === s) xp += BOSSES[b.id].xp; });
    cum.push(xp);
    while (xp - cur >= xpNeed(lv)) { cur += xpNeed(lv); lv++; }
    if ((s + 1) % 60 === 0) out.push({min: (s + 1) / 60, mobs: Math.round(mobs), xp: Math.round(xp), lv, cap: SPAWN.cap((s + 1) / 60)});
  }
  G = save;
  out.cum = cum;                                                 // 초마다 누적 경험치 (레벨업 곡선 맞출 때)
  return out;
};
// 완벽 플레이에서 D 초마다 레벨업 되게 xpNeed = A × g^(L-1) 을 맞춘다 (구간별 필요 경험치의 로그 직선 맞춤)
window.__fitXp = (D = 20, wi = 0) => {
  const cum = __perfect(wi).cum, X = s => s <= 0 ? 0 : cum[Math.min(cum.length, s) - 1], n = Math.floor(WORLDS[wi].dur / D);
  let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (let i = 0; i < n; i++) { const y = Math.log(Math.max(1, X((i + 1) * D) - X(i * D))); sx += i; sy += y; sxx += i * i; sxy += i * y; }
  const b = (n * sxy - sx * sy) / (n * sxx - sx * sx), a = (sy - b * sx) / n;
  return {A: +Math.exp(a).toFixed(2), g: +Math.exp(b).toFixed(4)};
};
window.__sim = sec => { for (let i = 0; i < sec * 60 && G.mode === 'play'; i++) update(1 / 60); return G.mode; };
</script>
