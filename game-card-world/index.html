<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>카드 월드 RPG — Game Prototype</title>
<script>
// v0.78.0: 모바일 on/off (v0.81.0: 기본 off) — 갤럭시 S26 울트라 화면(물리 3120×1440, CSS 384×832) 크기의 틀(iframe) 안에 게임을 그림
//   틀 안에선 세로 화면 레이아웃·미디어쿼리가 그대로 동작. 바깥 페이지는 틀만 그리고(창이 작으면 줄임) 나머지 문서는 읽지 않음
(function(){
  var W = 384, H = 832;
  var inFrame = /[?&]mframe=1/.test(location.search);
  var on = false;                                    // v0.81.0: 기본값 on → off
  try { var st = JSON.parse(localStorage.getItem('card-world-rpg.v1.settings') || '{}'); if (typeof st.mobile === 'boolean') on = st.mobile; } catch (e) {}
  window.MOBILE = { on: on, inFrame: inFrame };
  if (!on || inFrame || window.top !== window) return;
  var src = location.pathname + (location.search ? location.search + '&' : '?') + 'mframe=1' + location.hash;
  document.write('<style>html,body{margin:0;height:100%;overflow:hidden;background:#0d0d0b;}'
    + '#mshell{position:fixed;left:0;top:0;width:' + W + 'px;height:' + H + 'px;border:0;transform-origin:0 0;background:#000;box-shadow:0 0 0 1px #333,0 10px 40px rgba(0,0,0,.6);}</style>'
    + '<iframe id="mshell" allow="clipboard-write" src="' + src + '"></iframe>'
    + '<script>(function(){var f=document.getElementById("mshell");'
    + 'function fit(){var s=Math.min(1,innerWidth/' + W + ',innerHeight/' + H + ');f.style.transform="scale("+s+")";'
    + 'f.style.left=((innerWidth-' + W + '*s)/2)+"px";f.style.top=((innerHeight-' + H + '*s)/2)+"px";}'
    + 'fit();addEventListener("resize",fit);'
    + 'addEventListener("message",function(e){if(e.data==="card-world-mobile")location.reload();});})();<\/script>'
    + '<plaintext style="display:none">');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}
  [hidden]{display:none!important;}
  /* 인스펙터 자리: 가로가 긴 화면은 오른쪽 폭, 세로가 긴 화면은 하단 높이 */
  :root{--insp-w:0px;--insp-h:0px;--top-h:46px;}   /* --top-h: 상단 UI 막대 높이 — JS 가 실제 높이로 맞춤 (v0.59.0) */
  @media (orientation: landscape){ :root{--insp-w:clamp(200px, 22vw, 280px);} }   /* v0.46.0: 28vw → 22vw */
  @media (orientation: portrait){ :root{--insp-h:clamp(130px, 24vh, 220px);} }    /* v0.46.0: 34vh → 24vh */

  /* 인스펙터와 상단 UI 막대를 뺀 나머지가 테이블 — 카드는 상단 UI 밑으로 들어가지 않음 */
  .table{
    position:fixed;top:var(--top-h);left:0;right:var(--insp-w);bottom:var(--insp-h);overflow:hidden;
    background:radial-gradient(ellipse at 50% 40%,#25251d 0%,var(--canvas) 72%);
    touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* 화면 위 최소 UI (시스템 메뉴 · 콜렉터북 — 카드 아님) */
  /* v0.59.0: 떠 있던 제목·버튼을 자리를 차지하는 막대로. 폭이 좁아 버튼이 줄바꿈되면 막대도 높아지고 테이블이 그만큼 내려감 */
  .topbar{
    position:fixed;z-index:2147483000;top:0;left:0;right:var(--insp-w);
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px calc(env(safe-area-inset-left,0px) + 14px);
    background:var(--surface);border-bottom:1px solid var(--hairline);
  }
  .title{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;white-space:nowrap;}
  .title a{color:var(--muted);text-decoration:none;}
  .title a:hover{color:var(--ink);}
  .hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-left:auto;}
  .hud .btn{background:rgba(28,28,23,.85);border-color:var(--hairline);color:var(--ink);backdrop-filter:blur(6px);}
  .hud .btn:hover{background:var(--surface-soft);}
  .hud .count{color:var(--brand-yellow);font-weight:700;}
  .hud .toggle{gap:6px;cursor:pointer;-webkit-user-select:none;user-select:none;}
  .hud .toggle input{accent-color:var(--brand-yellow);margin:0;cursor:pointer;}

  /* request와 주체를 잇는 실선 — 카드 뒤에 깔림 */
  .links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible;}
  .links line{stroke:#e8d9a8;stroke-opacity:.55;stroke-width:2;}
  .links line.visit{stroke:#ffb070;}
  .links line.dun{stroke:#ff6b5e;}

  /* 카드 */
  .cw{
    position:absolute;width:var(--cw);height:var(--ch);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw) * .03);
    background:linear-gradient(160deg,var(--surface-soft),#191914);
    border:1px solid var(--hairline);border-radius:var(--r-md);
    box-shadow:var(--sh-md);cursor:grab;touch-action:none;
    --tone:#8E8C82;
  }
  .cw::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--tone);opacity:.10;pointer-events:none;}
  .cw .emoji{font-size:calc(var(--cw) * .38);line-height:1;pointer-events:none;}
  /* 그림 아이콘 — 이모지 자리에 글자 크기(1em)에 맞춰 들어감. 픽셀아트라 확대해도 뭉개지지 않게 */
  .icon{display:block;width:1.15em;height:1.15em;margin:auto;image-rendering:pixelated;pointer-events:none;-webkit-user-drag:none;}
  /* 글자 줄 안의 그림 — 글자 높이에 맞춰 줄 안에 */
  .icon.inline{display:inline-block;width:1.35em;height:1.35em;margin:0 1px;vertical-align:-.35em;}
  .cw .name{color:var(--ink);font-size:calc(var(--cf) * .13);font-weight:700;text-align:center;padding:0 4px;line-height:1.15;pointer-events:none;}
  .cw .atk{color:#9fd0ff;font-size:calc(var(--cf) * .13);font-weight:700;line-height:1.1;pointer-events:none;}
  /* v0.53.0: 캐릭터·크리처 공격·방어·체력, 그림 아이콘 */
  /* v0.57.0: 카드가 작아져 모서리 대신 위쪽 가운데 — 첫 줄 공격·방어, 둘째 줄 체력 */
  .cw .stats{position:absolute;left:0;right:0;top:calc(var(--cw) * .05);display:flex;flex-direction:column;align-items:center;gap:1px;
    font-size:calc(var(--cf) * .095);font-weight:700;line-height:1;pointer-events:none;}
  .cw .stats div{display:flex;gap:.4em;}
  .cw .stats span{display:inline-flex;align-items:center;white-space:nowrap;}
  .cw .stats .icon.inline{width:1.1em;height:1.1em;margin:0 1px 0 0;vertical-align:0;}
  .cw .stats .s-atk{color:#9fd0ff;}
  .cw .stats .s-def{color:#b8e0a0;}
  .cw .stats .s-hp{color:#ff8f8f;}
  .cw .equip{display:flex;gap:3px;pointer-events:none;}
  .cw .equip span{min-width:calc(var(--cw) * .24);height:calc(var(--cw) * .24);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw) * .15);border:1px solid rgba(255,255,255,.15);border-radius:4px;background:rgba(0,0,0,.3);}
  .cw .equip span.empty{font-size:calc(var(--cf) * .085);color:var(--muted);border-style:dashed;padding:0 3px;}
  .cw .heal{color:#ff8f8f;font-size:calc(var(--cf) * .13);font-weight:700;line-height:1.1;pointer-events:none;}
  /* 장소 위쪽 가운데 한 줄: 방문 인원 + 파이 게이지 (v0.57.0: 양쪽 모서리 → 가운데) */
  .cw .top{position:absolute;left:0;right:0;top:calc(var(--cw) * .05);display:flex;justify-content:center;align-items:center;gap:calc(var(--cw) * .06);pointer-events:none;}
  .cw .cap{font-size:calc(var(--cf) * .1);font-weight:700;color:var(--body);line-height:1;}
  /* v0.72.0: 파이 한가운데에 게이지가 쓰는 자원 아이콘 (산 공격 · 강가 인원 · 체력 회복 장소 체력) */
  .cw .pie .icon{width:62%;height:62%;margin:0;filter:drop-shadow(0 0 1px rgba(0,0,0,.9));}
  .cw .pie{width:calc(var(--cw) * .2);height:calc(var(--cw) * .2);border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(#7fdc9a calc(var(--p, 0) * 360deg), rgba(255,255,255,.14) 0);box-shadow:0 0 0 1px rgba(0,0,0,.45);transition:background .3s;}
  /* 위쪽 수치 줄과 안 겹치게 내림 — 캐릭터·크리처는 두 줄, 장소는 한 줄 */
  .cw.has-corner{padding-top:calc(var(--ch) * .21);}
  .cw.has-top{padding-top:calc(var(--ch) * .17);}
  .devnote{position:fixed;left:10px;bottom:calc(var(--insp-h) + 10px);z-index:2147483300;max-width:min(440px,calc(100vw - 20px));background:#3a1414;border:1px solid #a33;color:#ffd6d6;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:8px;}
  .k-material{--tone:#b58c5a;}
  .k-creature{--tone:#e3a26f;}
  /* 홉핑: 뛰어오르며 세로로 길어졌다가 착지하며 눌림 */
  /* 등장·튕김 클래스가 남아 있어도 홉이 이기도록 우선 (v0.28.2 버그 수정) */
  .cw.hop{animation:hop .36s ease-out !important;transform-origin:50% 100%;}
  @keyframes hop{0%{transform:scale(1,1);}30%{transform:scale(.86,1.24);}72%{transform:scale(1.06,.93);}100%{transform:scale(1,1);}}
  /* 곰: 달리는 동안 위아래로 짧게 여러 번 출렁 (우다다다) */
  /* v0.45.1: 출렁 속도 절반 (한 번 0.112초 → 0.224초). 이동 0.56초 안에 2번만 들어가서 5번 → 2번 */
  .cw.run{animation:run .448s linear !important;transform-origin:50% 100%;}
  @keyframes run{0%,50%,100%{transform:translateY(0) scale(1.05,.95);}25%,75%{transform:translateY(-9px) scale(.97,1.04);}}
  .k-tool{--tone:#9fb6cc;}
  .k-food{--tone:#7fc77f;}
  .k-fire{--tone:#ff9a3c;}
  .k-character{--tone:var(--brand-yellow);border-color:#4a4428;}
  .k-package{--tone:var(--brand-yellow);background:linear-gradient(160deg,#3b3521,#221f14);border-color:#5e5431;}
  .k-quest{--tone:#e8d9a8;background:linear-gradient(160deg,#3a3527,#24211a);border-color:#5a5340;}
  .k-container{--tone:#c9a36b;}
  .k-place{--tone:#9aa3ad;}
  /* 장소 카드 아래: 하는 일 — 체력 회복 / 출현 자원과 확률 (장소를 따로 분류하지 않고 있는 것만 보여줌) */
  .cw.has-foot{padding-bottom:calc(var(--ch) * .12);}
  .cw .foot{position:absolute;left:calc(var(--cw) * .07);right:calc(var(--cw) * .07);bottom:calc(var(--cw) * .07);
    display:flex;flex-wrap:wrap;justify-content:center;gap:1px 5px;font-size:calc(var(--cf) * .085);font-weight:700;line-height:1.2;color:var(--body);pointer-events:none;}
  .cw .foot span{display:inline-flex;align-items:center;white-space:nowrap;}
  .cw .foot .rest{color:#ff8f8f;}
  .float.work{color:#ffd27a;}
  /* container 담긴 카드: 그림 + 수량. 잡아끌면 한 장씩 꺼냄 */
  .cw .held{display:flex;align-items:center;gap:2px;font-size:calc(var(--cf) * .13);font-weight:800;color:var(--ink);line-height:1;
    background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:2px 6px;pointer-events:none;}
  .cw .held[data-held]{pointer-events:auto;cursor:grab;touch-action:none;}
  .cw .held.empty{color:var(--muted);border-style:dashed;font-size:calc(var(--cf) * .11);}
  /* 신의 입: 버린 카드 기록 칸 (최근 것이 왼쪽). 잡아끌면 꺼냄 */
  .cw.has-eaten{padding-bottom:calc(var(--ch) * .25);}
  .cw .eaten{position:absolute;left:0;right:0;bottom:calc(var(--cw) * .06);display:flex;justify-content:center;gap:2px;}
  .cw .eaten .mini{width:calc(var(--cw) * .27);height:calc(var(--cw) * .32);margin:0;border-radius:4px;font-size:calc(var(--cw) * .17);}
  .cw .eaten .mini.empty{background:rgba(0,0,0,.3);border:1px dashed rgba(255,255,255,.2);box-shadow:none;cursor:default;pointer-events:none;}
  /* v0.65.0: 새 기록이 들어오면 기록 칸이 한 칸씩 밀림 / 밀려난 카드는 입 그림 쪽으로 돌며 작아짐 (삼킴) */
  .cw .eaten.shift .mini[data-eat]{animation:eatShift .28s ease-out;}
  @keyframes eatShift{from{transform:translateX(calc(-100% - 2px));}to{transform:none;}}
  .swallow{position:absolute;margin:0;border-radius:4px;pointer-events:none;z-index:2100000000;animation:swallow .6s ease-in forwards;}
  @keyframes swallow{from{transform:translate(0,0) rotate(0deg) scale(1);opacity:1;}to{transform:translate(var(--dx),var(--dy)) rotate(540deg) scale(.1);opacity:.2;}}
  /* container 택: 쓸어담을 게 없으면 깜빡이지 않음 */
  .tab.idle::before{animation:none;opacity:.18;}
  .tab.idle path{animation:none;stroke-opacity:.4;}
  .tab.idle svg.tab-arrow{display:none;}
  /* 카드 프레임 (v0.36.0): 캐릭터 금색, 장소 회색 돌무늬, 나머지 수수한 나무 — 카드 전체 배경 */
  .cw.framed,.mini.framed{background:var(--frame) center/100% 100% no-repeat border-box;border-color:transparent;}
  .cw.framed::before{opacity:0;}
  .f-gold{--frame:url(images/frame/frame_gold.png);}
  .f-stone{--frame:url(images/frame/frame_stone.png);}
  .f-wood{--frame:url(images/frame/frame_wood.png);}

  /* 대사 중: 말하는 카드만 원래대로, 나머지는 반투명 → 대사에 집중 */
  .cw{transition:opacity .25s;}
  .links{transition:opacity .25s;}
  .table.talking .cw:not(.speaker):not(.dragging){opacity:.35;}
  .table.talking .links{opacity:.35;}
  .table.paused{filter:saturate(.7) brightness(.82);transition:filter .2s;}
  .cw.dragging{cursor:grabbing;box-shadow:var(--sh-lg);border-color:var(--tone);pointer-events:none;}
  .cw.is-target{border-color:var(--brand-yellow);box-shadow:0 0 0 2px var(--brand-yellow),var(--sh-lg);}
  .cw.is-target.no{border-color:var(--hairline);box-shadow:0 0 0 2px rgba(142,140,130,.55),var(--sh-md);}
  .cw.spawn{animation:spawn .32s ease-out;}
  .cw.pop{animation:pop .5s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:translate(var(--fx),var(--fy)) scale(.2);opacity:0;}60%{opacity:1;}to{transform:none;opacity:1;}}
  .cw.bump{animation:bump .3s ease-out;}
  /* v0.79.0: 조합으로 막 나온 카드 — 3초 동안 노란 테두리 깜빡임. 등장·튕김 연출과 겹쳐도 되게 덧그리는 링 */
  /* v0.80.0: 쌓기 실패로 되돌아가는 카드 — 1.5초 동안 빨간 테두리 깜빡임 */
  .cw.fresh::after,.cw.fail::after{content:'';position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--brand-yellow);
    box-shadow:0 0 6px rgba(255,212,0,.5);pointer-events:none;animation:freshBlink .5s steps(1,end) infinite;}
  .cw.fail::after{border-color:#ff6b6b;box-shadow:0 0 6px rgba(255,90,90,.55);}
  @keyframes freshBlink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
  /* 첫 package: 안에 갇힌 갓이 두드리듯 달그락 — 톡톡 두 번, 쉬고, 다시 */
  .cw.rattle{animation:rattle 2.2s ease-in-out infinite;transform-origin:50% 90%;}
  .cw.rattle.peeling,.cw.rattle.ready{animation:none;}
  @keyframes rattle{
    0%,52%,100%{transform:none;}
    55%{transform:translate(-2px,0) rotate(-2.5deg);}
    58%{transform:translate(2px,-4px) rotate(2.5deg);}
    61%{transform:translate(-1px,0) rotate(-1deg);}
    64%{transform:none;}
    70%{transform:translate(2px,-3px) rotate(3deg);}
    73%{transform:translate(-2px,0) rotate(-2deg);}
    76%{transform:translate(1px,-1px) rotate(1deg);}
    79%{transform:none;}
  }
  .cw.gone{animation:gone .3s ease-in forwards;}
  /* 카드 위로 떠오르는 수치 (체력 +N 등) */
  .float{position:absolute;z-index:2147482500;pointer-events:none;white-space:nowrap;font-weight:800;font-size:calc(var(--cf) * .22);
    color:#ff8f8f;text-shadow:0 2px 6px rgba(0,0,0,.75);animation:floatUp 1.2s ease-out forwards;}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.7);}15%{opacity:1;transform:translate(-50%,0) scale(1.15);}100%{opacity:0;transform:translate(-50%,-44px) scale(1);}}
  @keyframes spawn{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.12);}100%{transform:scale(1);}}
  @keyframes gone{to{transform:scale(.3);opacity:0;}}

  /* package 택 — 좌상단 점선 모서리 */
  .tab{position:absolute;left:0;top:0;width:36%;height:27%;border-top-left-radius:var(--r-md);cursor:crosshair;touch-action:none;z-index:2;}
  .tab::before{content:'';position:absolute;inset:0;border-top-left-radius:inherit;background:linear-gradient(135deg,rgba(255,212,0,.55) 0 50%,transparent 50%);animation:tabBlink 1.1s ease-in-out infinite;}
  /* 택이 깜빡여서 잡아당겨 열 수 있음을 알림 */
  @keyframes tabBlink{0%,100%{opacity:.25;}50%{opacity:1;}}
  .tab svg.tab-arrow{inset:auto;left:calc(var(--cw) * -.02);top:calc(var(--cw) * -.02);width:calc(var(--cw) * .24);height:calc(var(--cw) * .24);pointer-events:none;animation:tabArrow 1.1s ease-in-out infinite;}
  .tab .tab-arrow path{stroke-dasharray:none;animation:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  @keyframes tabArrow{0%{transform:translate(6px,6px);opacity:.3;}60%{opacity:1;}100%{transform:translate(-4px,-4px);opacity:0;}}
  @keyframes tabDash{0%,100%{stroke-opacity:.45;}50%{stroke-opacity:1;}}
  .tab svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .tab path{fill:none;stroke:var(--brand-yellow);stroke-width:2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;animation:tabDash 1.1s ease-in-out infinite;}
  /* v0.67.0: 붉은 택 — 우상단. 신의 입 = 월드 정리, container = 배출. 할 게 없으면 깜빡이지 않음 */
  .rtab{position:absolute;right:0;top:0;width:30%;height:22%;border-top-right-radius:var(--r-md);cursor:crosshair;touch-action:none;z-index:2;}
  .rtab::before{content:'';position:absolute;inset:0;border-top-right-radius:inherit;background:linear-gradient(225deg,rgba(230,60,50,.75) 0 50%,transparent 50%);animation:tabBlink 1.1s ease-in-out infinite;}
  .rtab svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .rtab path{fill:none;stroke:#ff6b5e;stroke-width:2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;animation:tabDash 1.1s ease-in-out infinite;}
  .rtab.idle::before{animation:none;opacity:.25;}
  .rtab.idle path{animation:none;stroke-opacity:.4;}
  /* 확인 모달 (확인 · 취소) */
  .cmodal{position:fixed;inset:0;z-index:2147483600;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:0 16px;}
  .cmodal .cm-box{background:var(--surface-soft);border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--sh-lg);padding:18px 18px 14px;max-width:320px;width:100%;color:var(--ink);}
  .cmodal p{margin:0 0 14px;font-size:15px;font-weight:600;line-height:1.45;white-space:pre-line;}
  .cmodal .cm-btns{display:flex;justify-content:flex-end;gap:8px;}
  .cmodal .cm-ok{background:#c0392b;border-color:#c0392b;color:#fff;}
  .cw.peeling{cursor:grabbing;}
  .tab-piece{position:absolute;z-index:2000000002;pointer-events:none;transform-origin:35% 35%;
    background:linear-gradient(135deg,rgba(255,212,0,.38),#3b3521 75%);}
  .tab-piece.ready{background:linear-gradient(135deg,rgba(255,212,0,.7),#4a4226 75%);}
  .tab-piece svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .tab-piece path{fill:none;stroke:var(--brand-yellow);stroke-width:2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;}
  .cw.ready{box-shadow:0 0 0 2px var(--brand-yellow),var(--sh-lg);}
  .half{pointer-events:none;}
  .half-l{clip-path:inset(0 50% 0 0);animation:tearL .5s ease-in forwards;}
  .half-r{clip-path:inset(0 0 0 50%);animation:tearR .5s ease-in forwards;}
  @keyframes tearL{to{transform:translate(-45%,25%) rotate(-20deg);opacity:0;}}
  @keyframes tearR{to{transform:translate(45%,25%) rotate(20deg);opacity:0;}}

  /* quest */
  /* v0.57.0: Quest 표시 왼쪽 위 → 위쪽 가운데 */
  .quest-label{position:absolute;left:0;right:0;text-align:center;top:calc(var(--cw) * .05);font-size:calc(var(--cf) * .1);font-weight:800;letter-spacing:.04em;color:var(--brand-yellow);pointer-events:none;}
  .cw.k-quest{padding-top:calc(var(--ch) * .1);}
  .req-emoji{font-size:calc(var(--cw) * .24)!important;}
  .req-title{color:var(--ink);font-size:calc(var(--cf) * .12);font-weight:700;text-align:center;padding:0 6px;line-height:1.2;pointer-events:none;}
  .req-need{color:var(--brand-yellow);font-size:calc(var(--cf) * .12);font-weight:800;pointer-events:none;white-space:pre-line;text-align:center;line-height:1.25;}
  .cw .defl{color:#b8e0a0;font-size:calc(var(--cf) * .13);font-weight:700;line-height:1.1;pointer-events:none;}
  .req-reward{color:var(--muted);font-size:calc(var(--cf) * .11);font-weight:600;pointer-events:none;}
  .req-stack{position:absolute;left:0;right:0;top:-14%;display:flex;justify-content:center;}
  .mini{
    width:calc(var(--cw) * .36);height:calc(var(--cw) * .46);margin:0 -3px;
    display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw) * .2);
    background:linear-gradient(160deg,var(--surface-soft),#191914);
    border:1px solid var(--hairline);border-radius:6px;box-shadow:var(--sh-sm);
    cursor:grab;touch-action:none;
  }

  /* 갓의 말풍선 */
  .speech{
    position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
    width:max-content;max-width:220px;
    background:var(--ink);color:#1a1a17;font-size:13px;font-weight:600;line-height:1.35;
    padding:8px 12px;border-radius:12px;box-shadow:var(--sh-md);pointer-events:none;
  }
  .speech::after{content:'';position:absolute;top:100%;left:calc(50% + var(--arrow-x, 0px));margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink);}
  /* 위로 나갈 자리가 없으면 카드 아래에 */
  .speech.below{bottom:auto;top:calc(100% + 10px);}
  .speech.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--ink);}

  /* 알림 */
  .toasts{
    position:fixed;z-index:2147483100;left:calc((100vw - var(--insp-w)) / 2);transform:translateX(-50%);
    top:calc(var(--top-h) + 8px);
    display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
  }
  .toast{
    background:rgba(28,28,23,.94);border:1px solid var(--hairline);color:var(--ink);
    font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--r-pill);
    white-space:nowrap;animation:toast 2.6s forwards;
  }
  @keyframes toast{0%{opacity:0;transform:translateY(-6px);}10%{opacity:1;transform:none;}85%{opacity:1;}100%{opacity:0;}}

  /* 콜렉터북 */
  /* 콜렉터북 = 하단에서 올라오는 시트 */
  /* v0.61.0: 인스펙터보다 아래 레이어, 인스펙터·상단 막대와 겹치지 않는 테이블 영역 안에서 상단 막대 아래까지 올라옴 */
  .book{position:fixed;left:0;right:var(--insp-w);top:var(--top-h);bottom:var(--insp-h);z-index:2147483040;display:flex;justify-content:center;align-items:flex-end;pointer-events:none;
    transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.85,.25,1);}
  .book.open{transform:translateY(0);}
  .book-grip{width:44px;height:4px;border-radius:4px;background:var(--hairline);margin:0 auto 12px;}
  .slot.reg{animation:reg .55s cubic-bezier(.2,1.4,.4,1);border-color:var(--brand-yellow);box-shadow:0 0 0 2px rgba(255,212,0,.5),0 0 18px rgba(255,212,0,.35);}
  @keyframes reg{0%{transform:scale(.4) rotate(-12deg);opacity:.2;}60%{transform:scale(1.15) rotate(3deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}
  .book-panel{pointer-events:auto;background:var(--surface);border:1px solid var(--hairline);border-bottom:none;border-radius:var(--r-lg) var(--r-lg) 0 0;
    width:100%;max-width:720px;max-height:100%;overflow:auto;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 20px);box-shadow:0 -12px 40px rgba(0,0,0,.55);}
  .book-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .book-head h2{margin:0 0 12px;font-size:22px;}
  .book-head small,.book-sub small{color:var(--muted);font-weight:600;font-size:14px;margin-left:6px;}
  .book-head .eyebrow{margin-bottom:8px;}
  .book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;}
  .slot{background:var(--surface-soft);border:1px solid var(--hairline);border-radius:var(--r-md);padding:10px 4px;text-align:center;}
  .slot .e{font-size:26px;line-height:1;}
  .slot .n{margin-top:6px;font-size:11px;font-weight:600;color:var(--ink);}
  .slot.unseen .n{color:var(--muted);}
  .slot:not(.unseen){cursor:pointer;}
  .slot.selected{border-color:#9fd0ff;box-shadow:0 0 0 2px rgba(159,208,255,.55);}   /* 인스펙터에 보이는 칸 */
  .book-sub{margin:20px 0 8px;font-size:16px;}
  .recipes{list-style:none;margin:0;padding:0;display:grid;gap:4px;}
  .recipes li{background:var(--surface-soft);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:6px 10px;font-size:13px;color:var(--ink);}
  .recipes li.unknown{color:var(--muted);}
  /* 챕터 점프 메뉴 (테스트용 · 카드 아님) */
  .chapters{position:fixed;z-index:2147483150;top:calc(var(--top-h) + 4px);right:calc(var(--insp-w) + 10px);
    display:flex;flex-direction:column;gap:2px;min-width:230px;padding:6px;background:rgba(28,28,23,.97);
    border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--sh-lg);}
  .chapters .ch-head{font-size:11px;font-weight:700;color:var(--muted);padding:4px 8px 6px;}
  .chapters button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:13px;color:var(--ink);}
  .chapters button:hover{background:var(--surface-soft);}

  /* 인스펙터 (카드 아님) — 탭한 카드의 모든 정보. 가로가 긴 화면은 오른쪽, 세로가 긴 화면은 하단 */
  /* v0.46.0: 촘촘하게 — 머리 한 줄(그림·이름·태그) + 세 칸 [수치 | 상태 | 조합·출현]. 칸 자리는 모든 카드가 같음 */
  .insp{position:fixed;z-index:2147483050;top:0;right:0;bottom:0;width:var(--insp-w);
    background:var(--surface);border-left:1px solid var(--hairline);display:flex;flex-direction:column;overflow:hidden;   /* v0.56.0: 스크롤은 .i-body */
    padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 10px) 10px;
    color:var(--ink);font-size:11.5px;line-height:1.3;-webkit-user-select:none;user-select:none;}
  @media (orientation: portrait){
    .insp{top:auto;left:0;width:auto;height:var(--insp-h);border-left:none;border-top:1px solid var(--hairline);
      padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 6px);}
  }
  .i-empty{flex:1;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-weight:600;}
  /* 전신 포트레이트 (v0.56.0) — 인스펙터 오른쪽 아래. 정보는 .i-body 안에서 스크롤, 그림은 겹치지 않게 따로 자리 */
  .i-body{flex:1;min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;}
  .i-portrait{flex:none;align-self:flex-end;width:128px;height:256px;margin-top:6px;image-rendering:pixelated;pointer-events:none;-webkit-user-drag:none;}
  .i-portrait.dying{filter:grayscale(1);}
  @media (orientation: portrait){
    .insp{flex-direction:row;}
    .i-portrait{width:auto;height:100%;max-height:256px;margin:0 0 0 8px;}   /* 하단 막대 높이에 맞춰 줄임 */
  }
  .i-head{display:flex;align-items:center;flex-wrap:wrap;gap:3px 6px;padding-bottom:5px;border-bottom:1px solid var(--hairline);}
  .i-icon{font-size:24px;line-height:1;flex:none;}
  .i-kind{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--brand-yellow);}
  .i-name{font-size:14px;font-weight:800;margin-right:4px;}
  .i-tags{display:flex;flex-wrap:wrap;gap:3px;}
  .i-desc{font-size:11.5px;font-style:italic;line-height:1.4;color:var(--muted);padding:4px 0 5px;border-bottom:1px solid var(--hairline);}
  .i-tag{font-size:10.5px;font-weight:600;color:var(--body);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:0 4px;}
  .i-tag.st{color:#ff9d9d;border-color:rgba(255,120,120,.4);}
  .i-tag.combo{color:var(--brand-yellow);border-color:rgba(255,212,0,.35);}
  .i-grid{display:grid;grid-template-columns:minmax(0,1fr);}
  .i-cell{padding:5px 0;border-bottom:1px solid var(--hairline);min-width:0;}
  .i-cell:last-child{border-bottom:none;}
  @media (orientation: portrait){
    .i-grid{grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.4fr);}
    .i-cell{border-bottom:none;border-left:1px solid var(--hairline);padding:4px 8px;}
    .i-cell:first-child{border-left:none;padding-left:0;}
    .i-cell:last-child{padding-right:0;}
  }
  .i-cell h4{margin:0 0 2px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em;}
  .i-sub{margin:3px 0 1px;font-size:10px;font-weight:600;color:var(--muted);}
  .i-tbl{width:100%;border-collapse:collapse;}
  .i-tbl th{font-weight:500;color:var(--body);text-align:left;padding:0 6px 0 0;white-space:nowrap;}
  .i-tbl td{font-weight:700;text-align:right;padding:0;}
  .i-pre{white-space:pre-line;}
  .i-muted{color:var(--muted);}
  .i-chips{display:flex;flex-wrap:wrap;gap:1px 8px;}
  .i-chips span{display:inline-flex;align-items:center;white-space:nowrap;}
  .cw.selected{outline:2px solid #9fd0ff;outline-offset:3px;}
  /* 빈사 캐릭터: 그림만 무채색 (프레임·글자는 그대로) */
  .cw.dying .emoji .icon, .i-icon.dying .icon{filter:grayscale(1);}
  /* 대결 중인 캐릭터·크리처 */
  .cw.dueling{box-shadow:0 0 0 2px #ff6b6b,var(--sh-md);}
  /* v0.87.0: 던전 — 캐릭터가 들어오면 가로로 늘어나는 길 */
  .cw.k-place{transition:width .3s ease-out;}
  /* v0.90.0: 늘어난 카드는 프레임을 9slice로 — 모서리 비율 유지, 테두리·안쪽은 타일링 */
  .cw.framed.long{background:none;border-style:solid;border-width:calc(var(--cw) * .12) calc(var(--cw) * .13);
    border-image:var(--frame) 16 18 fill round;}
  /* v0.90.0: 던전을 걷는 포트레이트 — 기본 방향이 왼쪽이라 뒤집어서 오른쪽을 보게 */
  .cw .runner{position:absolute;bottom:calc(var(--cw) * .06);height:calc(var(--ch) * .62);width:calc(var(--cw) * .32);
    left:calc(var(--rp, 0) * (100% - var(--cw) * .32));pointer-events:none;
    display:flex;align-items:flex-end;justify-content:center;animation:dunBob .5s ease-in-out infinite;}
  .cw .runner .pic{height:100%;width:auto;image-rendering:pixelated;-webkit-user-drag:none;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
  .cw .runner.foe .pic{transform:scaleX(-1);}               /* 포트레이트 기본 방향은 왼쪽 → 크리처는 뒤집어 오른쪽 */
  /* v0.90.0: 이동 들썩들썩 / 공격 뒤로 뺐다 빠르게 전진 / 피격 빨강 */
  @keyframes dunBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8%);}}
  .cw .runner.atk .pic{animation:dunAtk .3s ease-out;}
  .cw .runner.foe.atk .pic{animation:dunAtkF .3s ease-out;}
  @keyframes dunAtk{0%{transform:translateX(0);}35%{transform:translateX(22%);}60%{transform:translateX(-32%);}100%{transform:translateX(0);}}
  @keyframes dunAtkF{0%{transform:scaleX(-1) translateX(0);}35%{transform:scaleX(-1) translateX(22%);}60%{transform:scaleX(-1) translateX(-32%);}100%{transform:scaleX(-1) translateX(0);}}
  .cw .runner.hurt .pic{animation:dunHurt .3s steps(1,end) 2;}
  @keyframes dunHurt{0%{filter:brightness(1.6) sepia(1) saturate(9) hue-rotate(-35deg);}50%{filter:none;}100%{filter:none;}}
</style>
</head>

<script>
(() => {
'use strict';

const VERSION = 'v0.92.0';
const STORE = 'card-world-rpg.v2';   // v0.7.0: 기사 상태 추가로 저장 초기화

// ── 카드 정의 ─────────────────────────────────────────
const DEFS = {
  // v0.58.0: 합칠 수 있음 = 카드 유형(package·quest·container)·캐릭터·크리처·장소·장비 전용(재료로 안 쓰는 무기·방패) 빼고 전부
  // package = 유형(kind). 카드: 신의 선물(무작위) · 신의 구원(정해진 구호물품)
  package:   { name:'신의 선물',   kind:'package' },          // v0.51.0: 이름 package → 신의 선물 (id 그대로)
  salvation: { name:'신의 구원',   kind:'package', fixed:['marrow', 'roastmeat', 'roastberry'] },   // 빈사 기사 구호물품
  quest:   { name:'quest',     kind:'quest' },
  knight:    { name:'기사',        kind:'character', tags:['캐릭터', '과묵'], hp:10, startHp:0, startStatus:['빈사'], slots:['무기', '방패'], baseAtk:0, baseDef:0 },
  god:       { name:'갓',          kind:'character', tags:['캐릭터', '수다쟁이'], hp:1, immortal:true, baseAtk:0, baseDef:0 },   // v0.88.0: 체력 무한 — 피해를 안 받고 죽지 않음
  stone:     { name:'돌',          kind:'material', tags:['손질 lv1', '합칠 수 있음'] },   // v0.75.0: 무기 아님 (무기 태그·공격력 1 삭제) — 조합 재료
  twig:      { name:'나뭇가지',    kind:'material', tags:['불에 타는', '합칠 수 있음'] },
  grass:     { name:'마른 풀',     kind:'material', tags:['불에 타는', '합칠 수 있음'] },
  flint:     { name:'부싯돌',      kind:'material', tags:['합칠 수 있음'] },
  bone:      { name:'뼈',          kind:'material', tags:['합칠 수 있음'] },
  carcass:   { name:'토끼 사체',   kind:'material', tags:['합칠 수 있음'] },       // v0.42.0: 동물 사체 → 토끼 사체 (id 그대로)
  // 크리처 (v0.47.0): hp 체력, baseAtk 공격력, baseDef 방어, loot 쓰러뜨리면 나오는 전리품
  // v0.52.0: strike → baseAtk (캐릭터와 같은 공방체)

const RECIPE_BY_ID = new Map(RECIPES.map(r => [r.id, r]));
// "조합 가능" 태그: 결과가 나오는 조합에 들어갈 수 있는 카드. 없으면 최후의 카드
let COMBOABLE = new Set();

function tagLevel(def, name){
  let lv = 0;
  for (const t of (def.tags || [])){
    if (t === name) lv = Math.max(lv, 1);
    else if (t.startsWith(name + ' lv')){
      const n = parseInt(t.slice(name.length + 3), 10);
      if (n > lv) lv = n;
    }
  }
  return lv;
}
// 조합 한쪽: { card } 카드 / { tag, lv } 태그 레벨 / { atk } 공격력 이상
const sideMatch = (side, type) => side.card ? side.card === type
  : side.atk ? (DEFS[type].atk || 0) >= side.atk
  : tagLevel(DEFS[type], side.tag) >= (side.lv || 1);
// x, y 두 카드에 맞는 조합 전부. aIsX = x가 a쪽
function recipesFor(x, y){
  const out = [];
  for (const r of RECIPES){
    if (sideMatch(r.a, x) && sideMatch(r.b, y)) out.push({ r, aIsX: true });
    else if (sideMatch(r.a, y) && sideMatch(r.b, x)) out.push({ r, aIsX: false });
  }
  return out;
}
function usableRecipes(x, y){
  return recipesFor(x, y).filter(m => {
    const a = m.aIsX ? x : y, b = m.aIsX ? y : x;
    if (m.r.cook && !DEFS[b].cooked) return false;
    // 장소는 파괴되지 않음 → 장소가 없어지는 조합은 안 됨 (예: 모닥불 + 풀 깔개 태우기)
    if (m.r.keep !== 'a' && tagLevel(DEFS[a], '장소')) return false;
    if (m.r.keep !== 'b' && tagLevel(DEFS[b], '장소')) return false;
    return true;
  });
}
function sideText(sd){
  if (sd.atk) return `${si('atk')} 공격력 ${sd.atk} 이상`;
  return sd.card ? `${ic(sd.card)} ${DEFS[sd.card].name}` : `🏷️ ${sd.tag}${sd.lv ? ' lv' + sd.lv + ' 이상' : ''}`;
}
function outText(r){
  if (r.burn) return `${ic('ash')} 재 (태우기)`;
  if (r.cook) return '익힘 (날것이 익은 것으로)';
  const counts = new Map();
  for (const o of r.out) counts.set(o, (counts.get(o) || 0) + 1);
  return [...counts].map(([o, n]) => ic(o) + ' ' + DEFS[o].name + (n > 1 ? ` ×${n}` : '')).join(', ');   // 같은 카드 여러 장 = ×N
}
const recipeText = r => `${sideText(r.a)} + ${sideText(r.b)} → ${outText(r)}`;

// 카드 테두리 깜빡임 — 조합으로 나온 카드는 노란색 3초 (v0.79.0), 쌓기 실패로 되돌아가는 카드는 빨간색 1.5초 (v0.80.0)
const RING_MS = { fresh: 3000, fail: 1500 };
const ringUntil = new Map();   // id → { cls, at 깜빡임이 끝나는 시각 }
function ringOf(id){
  const r = ringUntil.get(id);
  if (!r) return '';
  if (r.at <= performance.now()){ ringUntil.delete(id); return ''; }
  return r.cls;
}
function markRing(id, cls){
  const ms = RING_MS[cls];
  ringUntil.set(id, { cls, at: performance.now() + ms });
  setTimeout(() => {                                          // 시간이 지나면 그 카드만 다시 그려 테두리를 지움
    const r = ringUntil.get(id);
    if (!r || r.cls !== cls) return;
    ringUntil.delete(id);
    const el = els.get(id), c = byId(id);
    if (el && c && !drag) paint(el, c);
  }, ms);
}

function measure(){
  const { w, h } = tableSize();                                  // v0.37.0: 인스펙터를 뺀 테이블 기준
  const m = Math.min(w, h);
  CW = Math.round(Math.max(57, Math.min(87, m / 7.375)));      // v0.76.0: 한 번 더 0.8배 (v0.57.0 71~109, m/5.9 ← v0.19.0 102~156, m/4.13). 글씨·그림도 카드 따라 0.8배
  CH = Math.round(CW * 1.36);
  table.style.setProperty('--cw', CW + 'px');
  table.style.setProperty('--cf', (CW / 0.7 * 0.8) + 'px');      // 카드 글씨 기준: 예전 카드 폭의 0.8배 (카드는 0.7배)
  table.style.setProperty('--ch', CH + 'px');
}
function tableSize(){ return { w: table.clientWidth, h: table.clientHeight }; }
function clampPos(x, y){
  const { w, h } = tableSize();
  return {
    x: Math.max(8, Math.min(x, w - CW - 8)),
    y: Math.max(TOP_PAD, Math.min(y, h - CH - 8)),
  };
}
function findSpot(x, y, spread){
  const step = CW * 0.95 * (spread || 1);
  const groups = bodyHulls(S.cards).filter(h => h.n > 1);      // v0.63.0: 묶음 사이 틈에도 안 놓음
  for (let r = 0; r < 9; r++){
    const n = r === 0 ? 1 : r * 6;
    for (let i = 0; i < n; i++){
      const ang = (i / n) * Math.PI * 2 + r * 0.5;
      const p = clampPos(x + Math.cos(ang) * step * r, y + Math.sin(ang) * step * r * 0.9);
      const free = S.cards.every(o => Math.abs(o.x - p.x) > CW * 0.7 || Math.abs(o.y - p.y) > CH * 0.6)
        && groups.every(g => outsideHull(p.x, p.y, g));
      if (free) return p;
    }
  }
  return clampPos(x + (Math.random() - 0.5) * CW, y + (Math.random() - 0.5) * CH);
}
function drawPool(n){
  const total = POOL.reduce((s, [, w]) => s + w, 0);
  const out = [];
  for (let i = 0; i < n; i++){
    let r = Math.random() * total;
    for (const [t, w] of POOL){ r -= w; if (r < 0){ out.push(t); break; } }
  }
  return out;
}

// ── 카드 추가 / 제거 ──────────────────────────────────
function markSeen(type, quiet){
  if (S.seen.includes(type)) return;
  S.seen.push(type);
  if (!quiet) newSeen.push(type);
}
// 전체 규칙: 월드(테이블)에 같은 카드가 5장 있으면 그 카드는 더 생성되지 않음
//   container·quest 위·장비 칸에 들어간 카드는 세지 않음 — 테이블에 원래 모습으로 나와 있는 카드만
//   꺼내기·장비 방출처럼 이미 있던 카드가 나오는 건 생성이 아니라 막지 않음. quest 카드는 진행 로직이 내므로 제외
const SPAWN_CAP = 5;
const looseCount = type => S.cards.filter(c => c.type === type).length;
const canSpawn = type => type === 'quest' || looseCount(type) < SPAWN_CAP;
const capToast = type => toast(`${ic(type)} ${DEFS[type].name} — 월드에 ${SPAWN_CAP}장 있어서 더 생성되지 않음`);

function omitToast(list){
  if (!list.length) return;
  const counts = new Map();
  for (const t of list) counts.set(t, (counts.get(t) || 0) + 1);
  toast('월드 수량 초과로 누락: ' + [...counts].map(([t, n]) => `${ic(t)} ${DEFS[t].name}${n > 1 ? ' ×' + n : ''}`).join(', '));
}
function addCard(type, x, y, extra, quiet){
  const c = Object.assign({ id: S.nextId++, type, x, y, z: ++S.z }, extra || {});
  const d = DEFS[type];
  if (d.hp && c.hp == null) c.hp = d.startHp != null ? d.startHp : d.hp;
  if (d.startStatus && !c.status) c.status = d.startStatus.slice();
  const p = clampPos(c.x, c.y);
  c.x = p.x; c.y = p.y;
  S.cards.push(c);
  spawned.add(c.id);
  markSeen(type, quiet);
  return c;
}
function removeCard(id){ S.cards = S.cards.filter(c => c.id !== id); vel.delete(id); }
function relocate(c){
  S.cards = S.cards.filter(o => o.id !== c.id);
  const p = findSpot(c.x + CW * 0.6, c.y + CH * 0.2);
  c.x = p.x; c.y = p.y;
  S.cards.push(c);
}

function save(){

function load(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return false;
    const st = JSON.parse(raw);
    if (!st || !Array.isArray(st.cards) || !st.cards.length) return false;
    for (const c of st.cards) if (c.type === 'request') c.type = 'quest';   // v0.20.0: request → quest
    if (Array.isArray(st.seen)) st.seen = st.seen.map(t => t === 'request' ? 'quest' : t);
    st.cards = st.cards.filter(c => DEFS[c.type]);
    st.seen = (st.seen || []).filter(t => DEFS[t]);
    st.found = (st.found || []).filter(k => RECIPE_BY_ID.has(k));
    st.flags = st.flags || {};
    for (const c of st.cards) if (c.type === 'quest' && !Array.isArray(c.stack)) c.stack = [];
    for (const c of st.cards){                      // v0.69.0: 없어진 카드 (예: 뾰족한 막대) — quest 위·자루 안에서도 뺌
      if (c.type === 'quest') c.stack = c.stack.filter(t => DEFS[t]);
      if (c.fill && !DEFS[c.fill]){ delete c.fill; c.count = 0; }
    }
    for (const c of st.cards){                      // v0.18.0: 칼 → 무기 이름 변경
      if (c.equip && c.equip['칼'] != null){ c.equip['무기'] = c.equip['무기'] || c.equip['칼']; delete c.equip['칼']; }
      if (c.type === 'quest' && c.slot === '칼') c.slot = '무기';
      if (c.type === 'quest' && c.quest === 'foodmedicine' && c.goal === 'fullHp'){ c.goal = 'hpMin'; c.min = 5; }
      if (c.type === 'quest' && c.quest === 'foodmedicine'){ delete c.reward; c.rewardText = '보상: 허기짐 해결'; }
      if (c.type === 'quest' && c.quest === 'sleepmedicine' && c.goal === 'fullHp'){ c.goal = 'sleep'; c.place = 'bedding'; c.rewards = ['hilt', 'plank']; delete c.rewardText; }
      if (c.type === 'quest' && c.quest === 'firstcombo' && c.wants){ delete c.wants; delete c.reward; c.goal = 'make'; c.make = 'marrow'; c.need = 0; c.stack = []; c.title = '골수 만들기'; c.rewardText = '보상 없음'; c.target = c.giver; }
      if (c.type === 'quest' && c.quest === 'foodmedicine' && c.goal){ delete c.goal; delete c.min; delete c.target; c.wantsList = ['roastclam', 'roastmeat', 'roastberry']; c.need = 3; c.stack = []; }
      if (c.type === 'quest' && c.title === '칼을 들어라') c.title = '무기를 들어라';
      if (c.type === 'quest' && c.quest === 'bonepowder' && c.need > 1) c.need = 1;   // v0.92.0: 골수 2개 → 1개
      if (Array.isArray(c.eaten)) c.eaten = c.eaten.filter(r => r && DEFS[r.type]);   // 신의 입 기록 중 없어진 카드

      if (DEFS[c.type] && DEFS[c.type].kind === 'creature' && DEFS[c.type].hp && c.hp == null) c.hp = DEFS[c.type].hp;   // v0.47.0: 크리처 체력
      if (DEFS[c.type] && DEFS[c.type].hp && c.hp > DEFS[c.type].hp) c.hp = DEFS[c.type].hp;   // v0.68.0: 최대 체력이 줄었으면 (예전 저장 토끼 3 → 2)
    }
    // v0.75.0: 칸에 맞지 않게 된 장비 (예: 돌은 이제 무기 아님) → 장비에서 빼서 캐릭터 옆 테이블로
    for (const c of st.cards.slice()){
      for (const [slot, ty] of Object.entries(c.equip || {})){
        if (DEFS[ty] && tagLevel(DEFS[ty], slot)) continue;
        delete c.equip[slot];
        if (DEFS[ty]) st.cards.push({ id: st.nextId++, type: ty, x: c.x + 110, y: c.y + 30, z: ++st.z });
      }
    }
    if (!st.cards.length) return false;
    S = st;
    return true;
  } catch (e) { return false; }
}
function newGame(){
  S = { cards: [], seen: ['package'], found: [], flags: { discovered: false, requestsGiven: 0 }, nextId: 1, z: 1 };
  const { w, h } = tableSize();
  addCard('package', w / 2 - CW / 2, h / 2 - CH / 2, { contents: 'first' }, true);
  save();
  renderAll();
  setTimeout(() => trappedHint(true), 700);
}

// 장소 카드 아래 줄: 체력 회복이 있으면 회복량·주기. 없으면 빈 문자열
// v0.57.0: 출현 자원·확률은 카드에 안 보임 (인스펙터에만)
function placeFoot(d){
  if (!tagLevel(d, '장소')) return '';
  const lv = tagLevel(d, '체력 회복');
  return lv ? `<span class="rest">${statImg('hp')} +1 / ${REST_MS / lv / 1000}초</span>` : '';
}
function paint(el, c){
  const d = DEFS[c.type];
  let cls = 'cw k-' + d.kind + ' framed f-' + frameOf(d);
  if (fighter(d)) cls += ' has-corner';
  else if (d.capacity || d.yields || d.devour) cls += ' has-top';
  if (placeFoot(d)) cls += ' has-foot';
  if (d.devour) cls += ' has-eaten';
  if (c.duel != null) cls += ' dueling';
  if (selId === c.id) cls += ' selected';                      // 인스펙터에 보이는 카드
  if (d.kind === 'character' && statusOf(c).includes('빈사')) cls += ' dying';   // 빈사 → 그림 무채색
  const pf = popFrom.get(c.id);
  if (pf){
    cls += ' pop';
    el.style.setProperty('--fx', (pf.x - c.x) + 'px');
    el.style.setProperty('--fy', (pf.y - c.y) + 'px');
  } else if (spawned.has(c.id)) cls += ' spawn';
  const ring = ringOf(c.id);
  if (ring) cls += ' ' + ring;                                 // 조합으로 막 나온 카드(노랑) · 되돌아가는 카드(빨강)
  if (bumpIds.has(c.id)) cls += ' bump';
  if (c.type === 'package' && c.contents === 'first') cls += ' rattle';   // 안에서 두드리는 첫 package
  el.className = cls;
  // v0.87.0: 던전은 캐릭터가 들어와 있는 동안만 가로로 span배 (긴 길). v0.90.0: 프레임은 9slice, 안은 타일링
  const wide = d.span && visitorsOf(c).length;
  el.style.width = wide ? (CW * d.span) + 'px' : '';
  if (wide) el.classList.add('long');
  el.style.left = c.x + 'px';
  el.style.top = c.y + 'px';
  const talkingHere = (c.type === 'god' && speech) || (c.type === 'knight' && knightSpeech) || (c.type === 'package' && c.contents === 'first' && speech);
  el.style.zIndex = talkingHere ? 1999999999 : c.z;
  el.classList.toggle('speaker', !!talkingHere);               // 말하는 카드
  let html = '';
  if (d.kind === 'quest'){
    html += '<div class="quest-label">Quest</div>';
    html += `<div class="emoji req-emoji">${iconHtml(c.type)}</div>`;
    html += `<div class="req-title">${esc(c.title)}</div>`;   // 조합식은 인스펙터에서만 (v0.37.0)
    html += `<div class="req-need">${rich(reqProgress(c))}</div>`;
    const rw = reqReward(c);
    if (rw) html += `<div class="req-reward">${rich(rw)}</div>`;
    if (c.stack.length){
      html += '<div class="req-stack">' + c.stack.map((t, i) => `<div class="mini framed f-${frameOf(DEFS[t])}" data-idx="${i}">${iconHtml(t)}</div>`).join('') + '</div>';
    }
  } else {
    html += `<div class="emoji">${iconHtml(c.type)}</div><div class="name">${esc(d.name)}</div>`;
    const heal = healOf(d);
    if (heal > 0) html += `<div class="heal">${statImg('hp')} +${heal}</div>`;       // 음식 회복량을 이름 아래에
    if (d.atk) html += `<div class="atk">${statImg('atk')} +${d.atk}</div>`;         // 장비 공격력
    if (d.defense) html += `<div class="defl">${statImg('def')} +${d.defense}</div>`; // 장비 방어
    // 위쪽 가운데: 첫 줄 공격 · 방어 (장비 포함), 둘째 줄 체력
    if (fighter(d)) html += `<div class="stats"><div><span class="s-atk">${statImg('atk')}${atkOf(c)}</span>`
      + `<span class="s-def">${statImg('def')}${defOf(c)}</span></div><div><span class="s-hp">${statImg('hp')}${hpText(c)}</span></div></div>`;
    if (d.slots){
      // 장비 칸: 장비한 아이템 아이콘, 빈 칸은 칸 이름
      const eq = c.equip || {};
      html += '<div class="equip">' + d.slots.map(sl => eq[sl] && DEFS[eq[sl]]
        ? `<span title="${esc(sl)} — 우상단 붉은 택으로 무장해제">${iconHtml(eq[sl])}</span>`
        : `<span class="empty">${esc(sl)}</span>`).join('') + '</div>';
    }
    if (d.kind === 'container'){
      html += c.count && c.fill && DEFS[c.fill]
        ? `<div class="held" data-held title="드래그해서 꺼내기">${iconHtml(c.fill, true)} ${c.count}/${d.hold}</div>`

    if (d.kind === 'package' || d.kind === 'container') html += '<div class="tab' + (d.kind === 'container' && !sweepable(c) ? ' idle' : '') + '"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M100 0 L0 100"/></svg>'
      + '<svg class="tab-arrow" viewBox="0 0 24 24"><path d="M19 19 L6 6 M6 6 H15 M6 6 V15"/></svg></div>';
    // 붉은 택 (우상단): 신의 입 = 월드 정리, container = 배출
    if (d.kind === 'container' || d.devour || d.slots) html += `<div class="rtab${redTabReady(c) ? '' : ' idle'}"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0 L100 100"/></svg></div>`;
    if (c.type === 'package' && c.contents === 'first' && speech && !S.cards.some(o => o.type === 'god')){
      html += `<div class="speech">${esc(speech)}</div>`;             // 갇힌 갓이 package 안에서 말함
    }
    // 장소 위쪽 가운데 한 줄: 방문 인원 + 게이지
    let top = '';
    if (d.capacity) top += `<div class="cap">${statImg('people')}${visitorsOf(c).length}/${d.capacity}</div>`;   // 장소 방문 인원
    // v0.72.0: 게이지가 쓰는 자원 아이콘을 파이 한가운데에 (v0.71.0 파이 옆 아이콘 → 안으로)
    const gk = d.gauge || (tagLevel(d, '체력 회복') ? 'hp' : null);
    if ((tagLevel(d, '체력 회복') && visitorsOf(c).length) || d.yields) top += `<div class="pie" style="--p:${pieValue(c)}"${gk ? ` title="게이지: ${STAT_NAME[gk]}"` : ''}>${gk ? statImg(gk) : ''}</div>`;
    if (d.devour) top += `<div class="cap">흡족 ${c.satisfied || 0}</div>`;                  // 신의 입이 삼킨 횟수
    if (top) html += `<div class="top">${top}</div>`;
    // v0.90.0: 던전을 걷는 모습 — 카드가 아니라 포트레이트를 줄여 오른쪽을 보게 뒤집음
    if (d.span && wide){                                    // v0.90.0: 길 위의 캐릭터·크리처 (카드가 아니라 포트레이트)
      for (const u of visitorsOf(c).concat(dunFoes(c))){
        if (!PORTRAITS.has(u.type)) continue;
        html += `<div class="runner${u.dun != null ? ' foe' : ''}" data-run="${u.id}" style="--rp:${dunPos(u)}">`
          + `<img class="pic" src="images/portrait/portrait_${u.type}.png" alt="" draggable="false"></div>`;
      }
    }
    const foot = placeFoot(d);
    if (foot) html += `<div class="foot">${foot}</div>`;
    if (d.devour){
      // 신의 입: 버린 카드 기록 칸 (최근 것이 왼쪽). 잡아끌면 꺼냄
      const eaten = c.eaten || [];
      html += `<div class="eaten${eatShift.delete(c.id) ? ' shift' : ''}">` + Array.from({ length: d.devour }, (_, i) => eaten[i] && DEFS[eaten[i].type]
        ? `<div class="mini framed f-${frameOf(DEFS[eaten[i].type])}" data-eat="${i}" title="드래그해서 꺼내기">${iconHtml(eaten[i].type)}</div>`
        : '<div class="mini empty"></div>').join('') + '</div>';
    }
    if (c.type === 'god' && speech) html += `<div class="speech">${esc(speech)}</div>`;
    if (c.type === 'knight' && knightSpeech) html += `<div class="speech">${esc(knightSpeech)}</div>`;
  }
  el.innerHTML = html;
  const bubble = el.querySelector('.speech');
  if (bubble) fitBubble(bubble);
}
// 말풍선이 화면 밖으로 나가지 않게: 좌우로 밀어 넣고(꼬리는 말하는 카드 쪽 유지), 위로 나가면 카드 아래로
function fitBubble(b){
  const tr = table.getBoundingClientRect();
  const cr = b.parentElement.getBoundingClientRect();
  const bw = b.offsetWidth, bh = b.offsetHeight;
  const margin = 8;
  const center = cr.left + cr.width / 2 - tr.left;
  let shift = 0;
  if (center - bw / 2 < margin) shift = margin - (center - bw / 2);
  else if (center + bw / 2 > tr.width - margin) shift = (tr.width - margin) - (center + bw / 2);
  const below = (cr.top - tr.top) - bh - 12 < margin;
  const key = Math.round(shift) + (below ? 'b' : 't');
  if (b.dataset.fit === key) return;
  b.dataset.fit = key;
  b.style.transform = `translateX(calc(-50% + ${shift}px))`;
  b.style.setProperty('--arrow-x', `${-shift}px`);
  b.classList.toggle('below', below);
}
function fitBubbles(){
  for (const b of table.querySelectorAll('.speech')) fitBubble(b);
}
function renderAll(){
  if (drag) return;
  const alive = new Set();
  for (const c of S.cards){
    alive.add(c.id);
    let el = els.get(c.id);
    if (!el){
      el = document.createElement('div');
      el.dataset.id = c.id;
      table.appendChild(el);
      els.set(c.id, el);
    }
    el.style.visibility = '';
    if (!(tear && tear.id === c.id)){ el.style.transform = ''; el.style.clipPath = ''; }
    paint(el, c);
  }
  for (const [id, el] of els){
    if (!alive.has(id)){ el.remove(); els.delete(id); }
  }
  spawned.clear();
  popFrom.clear();
  bumpIds.clear();
  if (newSeen.length){
    showDiscoveries(newSeen);                 // 콜렉터북이 올라와 새 카드를 등록
    newSeen = [];
  }
  const n = PAGE.ids.filter(id => S.seen.includes(id)).length;
  bookCount.textContent = `${n}/${PAGE.ids.length}`;
  renderInspector();
}
function renderGod(){
  if (drag) return;
  const g = S.cards.find(c => c.type === 'god');

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = rich(msg);                       // 카드 그림 자리표(ic) → 그림
  toasts.appendChild(t);
  setTimeout(() => t.remove(), 2700);
  while (toasts.children.length > 4) toasts.firstChild.remove();
}

// ── 갓의 말 ───────────────────────────────────────────
const TALK_SCALE = 1;                          // 대사 머무는 시간 배율 — 모든 캐릭터 공통 (v0.26.1: 1.5 → 1 원래대로)
const SPEAKERS = ['god', 'knight'];            // 대사 우선순위 — 앞일수록 먼저
const talkQ = { god: [], knight: [] };          // 사람마다 할 말 줄 [{ text, done }]
let talking = null, talkTimer = null;           // 지금 말하는 사람
let talkItem = null;                            // 지금 말하는 대사 { text, pri }
function enqueueTalk(who, items){
  talkQ[who].push(...items);
  if (!talking) showNextTalk(null);
}
// 이 사람이 말하는 중이거나 할 말이 남아 있나
const isTalking = who => talking === who || talkQ[who].length > 0;
function setLine(who, text){
  if (who === 'god') speech = text; else knightSpeech = text;
  table.classList.toggle('talking', !!(speech || knightSpeech));   // 누가 말하는 동안 나머지 카드 반투명
  repaint(who);
  if (who === 'god'){
    const pk = S.cards.find(c => c.type === 'package' && c.contents === 'first');
    const el = pk && els.get(pk.id);
    if (el && !drag && !(tear && tear.id === pk.id)) paint(el, pk);
  }
}
// ── 일시 정지 ─────────────────────────────────────────
// 콜렉터북 등록 연출 동안 게임 필드를 멈춤: 조작, 밀어내기·붙이기, 체력 회복, 대사 진행, quest 지급·정산
let paused = false, pausedAt = 0, talkWait = null;
function setPaused(on){
  if (on === paused) return;
  paused = on;
  table.classList.toggle('paused', on);
  if (on){ pausedAt = performance.now(); return; }
  // 멈춘 시간만큼 진행 중이던 애니메이션 시작 시각을 미룸
  const dt = performance.now() - pausedAt;
  if (returning) returning.t0 += dt;
  for (const [id, t0] of slideIn) slideIn.set(id, t0 + dt);
  scheduleGod();
}
function showNextTalk(prev){
  if (paused){                                  // 멈춘 동안엔 새 대사를 시작하지 않음
    if (!talkWait) talkWait = setTimeout(() => { talkWait = null; if (!talking) showNextTalk(prev); }, 250);
    return;
  }
  // 방금 말한 사람이 이어서 할 말이 있으면 계속 (한쪽 대화가 다 끝나야 다음 사람)
  // 아니면 할 말이 있는 사람 중 우선순위가 높은 쪽
  const who = (prev && talkQ[prev].length) ? prev : SPEAKERS.find(w => talkQ[w].length);
  if (!who){ talking = null; return; }
  const item = talkQ[who].shift();
  talking = who;
  talkItem = item;
  setLine(who, item.text);
  const hasMouth = S.cards.some(c => c.type === who || (who === 'god' && c.type === 'package' && c.contents === 'first'));
  if (!hasMouth) toast(ic(who) + ' ' + item.text);
  talkTimer = setTimeout(function endLine(){
    // 멈춘 동안엔 말풍선을 붙잡아 두고, 풀리면 조금 더 보여준 뒤 넘어감
    if (paused){ item.held = true; talkTimer = setTimeout(endLine, 250); return; }
    if (item.held){ item.held = false; talkTimer = setTimeout(endLine, 1200 * TALK_SCALE); return; }
    setLine(who, null);
    talking = null;
    talkItem = null;
    if (item.done) item.done();
    if (!isTalking('god')) flushSpeechWaiters();
    if (!talking) showNextTalk(who);
  }, Math.max(1800, item.text.length * 110) * TALK_SCALE);
}
// v0.62.0: 대사 출력 룰 — 갓·기사 모두 speak() 하나로 (확정 35 / 기능.md 68절)
//   등급: 퀘스트·이벤트 > 횟수 대사(횟수 많을수록) > 확률 대사(확률 낮을수록)
//   겹침 = 지금 나오는 대사 + 기다리는 대사 (누가 말하든)
//   새 대사보다 같거나 높은 대사가 있으면 새 대사 스킵. 낮은 대사는 빼고, 나오는 중이면 끊음
//   퀘스트·이벤트끼리는 스킵 없이 차례로. 같은 사람의 같은 문장이 나오는 중이거나 기다리면 또 넣지 않음
//   스킵·끊긴 대사에 딸린 진행(done)은 그대로 실행 — 대사만 안 나옴
const PRI_EVENT = Infinity;
const priChance = p => 1 - p;                   // 확률 대사: 0 ~ 1
const priCount = n => 1 + n;                    // 횟수 대사: 1 ~ (확률 대사보다 위) — 지금 쓰는 대사 없음
function speak(who, x, pri = PRI_EVENT, done){
  const texts = Array.isArray(x) ? x : [x];
  const all = [talking ? talkItem : null].concat(...SPEAKERS.map(w => talkQ[w])).filter(Boolean);
  const lower = it => it.pri < pri;
  const dup = texts.some(t => all.some(it => it.who === who && it.text === t));
  if (dup || (pri !== PRI_EVENT && all.some(it => !lower(it)))){  // 중복이거나 같거나 높은 대사가 있음 → 스킵
    if (done) done();
    return false;
  }
  const dones = [];
  for (const w of SPEAKERS){                                      // 기다리는 낮은 대사 스킵
    for (const it of talkQ[w]) if (lower(it) && it.done) dones.push(it.done);
    talkQ[w] = talkQ[w].filter(it => !lower(it));
  }
  if (talking && talkItem && lower(talkItem)){                    // 나오는 중인 낮은 대사는 끊음
    if (talkItem.done) dones.push(talkItem.done);
    clearTimeout(talkTimer);
    talkTimer = null;
    setLine(talking, null);
    talking = null;
    talkItem = null;
  }
  enqueueTalk(who, texts.map((text, i) => ({ who, text, pri, done: i === texts.length - 1 ? done : undefined })));
  if (!isTalking('god')) flushSpeechWaiters();                    // 갓 대사가 끊겨 끝났으면 기다리던 일 진행
  for (const fn of dones) fn();
  return true;
}
function flushSpeechWaiters(){
  const ws = speechWaiters;
  speechWaiters = [];
  for (const fn of ws) fn();
}
const say = (x, pri) => speak('god', x, pri);
function sayMaybe(arr){
  const now = Date.now();
  if (now - lastMaybe < 6000 || Math.random() > 0.4) return;
  lastMaybe = now;
  say(pick(arr), priChance(0.4 / arr.length));
}
// 갓의 할 말이 다 끝나면 부름
function afterSpeech(fn){
  if (!isTalking('god')){ fn(); return; }
  speechWaiters.push(fn);
}

// ── 상태 태그 (카드 한 장에 붙고 떨어짐) ──────────────
const statusOf = c => c.status || [];
const tagsOf = c => (DEFS[c.type].tags || []).concat(statusOf(c));
function setStatus(c, remove, add){
  const s = statusOf(c).filter(t => !remove.includes(t));
  for (const a of add) if (!s.includes(a)) s.push(a);
  c.status = s;
}
// 음식 회복량: 익힘 +2, 날것 +1, 그 밖엔 카드 정의값(열매 등)
function healOf(def){
  if (def.heal) return def.heal;                               // v0.48.0: 카드별 회복량 우선
  if (tagLevel(def, '익힘')) return 2;
  if (tagLevel(def, '날것')) return 1;
  return def.heal || 0;
}

// ── quest 종류 ──────────────────────────────────────
//   갓: { need:3, stack } 아무거나 → package
//   제출형 퀘스트: { quest, wants:'카드', need, stack, reward:'카드' }
//   조건형 퀘스트: { quest, goal:'fullHp', target } / { quest, goal:'equip', slot, target }
const isGodRequest = rq => !rq.quest;
function reqDone(rq){
  if (rq.goal === 'fullHp'){
    const t = byId(rq.target);
    return !!t && t.hp >= DEFS[t.type].hp && !statusOf(t).includes('빈사');
  }
  if (rq.goal === 'make'){
    // 한 번이라도 만들어진 적 있으면 완료 — 만들자마자 다음 조합에 써버려도 인정 (v0.32.1 버그 수정)
    if (S.seen.includes(rq.make) || S.cards.some(c => c.type === rq.make)) rq.made = true;
    return !!rq.made;
  }
  if (rq.goal === 'hunt') return !!S.flags.hunted;             // v0.83.0: 크리처를 한 번이라도 쓰러뜨림
  if (rq.goal === 'store') return !!S.flags.stored;            // container에 한 장이라도 담은 적 있음
  if (rq.goal === 'devour') return !!S.flags.devoured;         // v0.84.0: 신의 입에 한 장이라도 넣은 적 있음
  if (rq.goal === 'undevour') return !!S.flags.mouthTook;      // v0.84.0: 신의 입 기록에서 꺼낸 적 있음
  if (rq.goal === 'sweep') return !!S.flags.swept;             // 택을 당겨 쓸어담은 적 있음
  if (rq.goal === 'gather') return (rq.gathered || 0) >= rq.need;   // v0.73.0: 장소 게이지가 need번 참 (산 채집)
  if (rq.goal === 'visitPlace'){
    const t = byId(rq.target);
    const pl = t && t.visit != null ? byId(t.visit) : null;
    return !!pl && pl.type === rq.place;                        // 대상이 그 장소를 방문하면 완료
  }
  if (rq.goal === 'sleep'){
    const t = byId(rq.target);
    if (!t) return false;
    const pl = t.visit != null ? byId(t.visit) : null;
    if (pl && pl.type === rq.place) rq.visited = true;         // 조건1: 풀 깔개 방문 (한 번 방문하면 체크 유지)
    return !!rq.visited && t.hp >= DEFS[t.type].hp;            // 조건2: 체력 가득
  }
  if (rq.goal === 'hpMin'){
    const t = byId(rq.target);
    return !!t && t.hp >= rq.min && !statusOf(t).includes('빈사');
  }
  if (rq.goal === 'equip'){
    const t = byId(rq.target);
    return !!t && !!(t.equip && t.equip[rq.slot]);          // 그 칸에 뭐든 장비하면 완료
  }
  return rq.stack.length >= rq.need;
}
function reqProgress(rq){
  if (rq.goal === 'fullHp'){
    const t = byId(rq.target);
    return t ? `체력 ${t.hp} / ${DEFS[t.type].hp}` : '대상 없음';
  }
  if (rq.goal === 'make'){
    const done = rq.made || S.seen.includes(rq.make) || S.cards.some(c => c.type === rq.make);
    return `${done ? '✔' : '☐'} ${ic(rq.make)} ${DEFS[rq.make].name} 만들기`;
  }
  if (rq.goal === 'hunt') return `${S.flags.hunted ? '✔' : '☐'} ${ic('animal')} 토끼 사냥`;
  if (rq.goal === 'store') return `${S.flags.stored ? '✔' : '☐'} ${ic('sack')} 합칠 수 있음 카드 1장 담기`;
  if (rq.goal === 'devour') return `${S.flags.devoured ? '✔' : '☐'} ${ic('godmouth')} 신의 입에 아무거나 1장 넣기`;
  if (rq.goal === 'undevour') return `${S.flags.mouthTook ? '✔' : '☐'} ${ic('godmouth')} 신의 입에서 한 장 꺼내기`;
  if (rq.goal === 'sweep') return `${S.flags.swept ? '✔' : '☐'} ${ic('sack')} 택을 당겨 쓸어담기`;
  if (rq.goal === 'gather') return `${ic(rq.place)} ${DEFS[rq.place].name} 채집 ${rq.gathered || 0} / ${rq.need}`;
  if (rq.goal === 'visitPlace'){
    const t = byId(rq.target);
    if (S.cards.some(c => c.type === rq.place)) rq.made = true;   // 한 번 만들면 체크 유지
    const pl = t && t.visit != null ? byId(t.visit) : null;
    const visited = !!pl && pl.type === rq.place;
    const P = DEFS[rq.place], T = t ? DEFS[t.type] : null;
    return `${rq.made ? '✔' : '☐'} ${ic(rq.place)} ${P.name} 만들기\n${visited ? '✔' : '☐'} ${T ? ic(t.type) + ' ' + T.name : '대상'} 올려놓기`;
  }
  if (rq.goal === 'sleep'){
    const t = byId(rq.target);
    if (!t) return '대상 없음';
    const pl = t.visit != null ? byId(t.visit) : null;
    const visited = rq.visited || (pl && pl.type === rq.place);
    const max = DEFS[t.type].hp;
    return `${visited ? '✔' : '☐'} ${DEFS[rq.place].name} 방문\n${t.hp >= max ? '✔' : '☐'} 체력 ${t.hp} / ${max}`;
  }
  if (rq.goal === 'hpMin'){
    const t = byId(rq.target);
    return t ? `체력 ${t.hp} / ${rq.min}` : '대상 없음';
  }
  if (rq.goal === 'equip'){
    const t = byId(rq.target);
    const it = t && t.equip && t.equip[rq.slot];
    return `${rq.slot} 칸: ${it && DEFS[it] ? ic(it) : '비어 있음'}`;
  }
  if (rq.wantsList) return rq.wantsList.map(t => `${rq.stack.includes(t) ? '✔' : '☐'} ${ic(t)} ${DEFS[t].name}`).join('\n');
  if (rq.wants) return `${ic(rq.wants)} ${DEFS[rq.wants].name} ${rq.stack.length} / ${rq.need}`;
  return `${rq.stack.length} / ${rq.need}`;
}
// v0.86.0: 보상이 없으면 아무 문구도 안 보여줌 (카드·인스펙터 모두)
function reqReward(rq){
  if (rq.rewards) return '보상 ' + rq.rewards.map(r => DEFS[r] ? ic(r) : '').join(' ');
  if (rq.rewardText) return rq.rewardText === '보상 없음' ? '' : rq.rewardText;
  if (rq.reward && DEFS[rq.reward]) return `보상 ${ic(rq.reward)} ${DEFS[rq.reward].name}`;
  if (rq.goal === 'fullHp') return '보상: 허기짐 해결';

  return `보상 ${ic('package')}`;
}

// ── 판정: 대상 + 올리는 카드 ──────────────────────────
// v0.82.0 (확정 5-2): 두 카드의 조합만 본다. 쌓은 순서는 중요하지 않음
//   올린 쪽 기준으로 되는 게 없으면 반대로도 봄 (예: 장소를 캐릭터에 쌓아도 캐릭터가 방문)
function evaluate(d, t){
  const ev = evaluateOne(d, t);
  if (ev) return ev;
  const rev = evaluateOne(t, d);
  return rev ? Object.assign({ swap: true }, rev) : null;    // swap = d와 t의 역할이 바뀜
}
const applyEv = (ev, d, t) => ev.swap ? apply(ev, t, d) : apply(ev, d, t);
function evaluateOne(d, t){
  const dd = DEFS[d.type], td = DEFS[t.type];
  if (t.duel != null) return null;                            // 대결 중인 카드엔 아무것도 못 올림
  if (t.dun != null || d.dun != null) return null;            // v0.90.0: 던전 안 크리처는 조합·쌓기 대상이 아님
  if (td.kind === 'creature'){
    if (dd.kind === 'character') return { act: 'duel', full: statusOf(d).includes('빈사') };   // 대결 (빈사면 못 함)
    if (tagLevel(dd, '무기')){
      const low = (dd.atk || 0) < t.hp;                         // 한 방에 못 쓰러뜨림
      return { act: 'strike', full: low, low };                // 전리품이 상한이면 그 카드만 안 나옴
    }
    return null;
  }
  if (td.devour){
    // 신의 입: 캐릭터·장소·quest 빼고 전부 먹음. 캐릭터는 방문도 못 함
    // v0.67.0: 물건이 들어 있는 container도 못 먹음
    if (!mouthEats(d)) return null;
    return { act: 'devour' };
  }
  if (dd.kind === 'character' && tagLevel(td, '장소')){
    // 방문. 장소마다 최대 인원이 있음 (다 차 있으면 못 함)
    const others = S.cards.filter(o => o.visit === t.id && o.id !== d.id).length;
    return { act: 'visit', full: others >= (td.capacity || Infinity) };
  }
  if (td.kind === 'container'){
    // 담기: 합칠 수 있음 카드만, 한 종류만, 용량까지
    if (!tagLevel(dd, '합칠 수 있음')) return null;
    if (t.count && t.fill !== d.type) return null;
    return { act: 'store', full: (t.count || 0) >= td.hold };
  }
  const edible = tagLevel(dd, '먹을 수 있음') || tagLevel(dd, '빈사 치유');
  if (td.kind === 'quest'){
    if (t.goal === 'equip'){
      // 조건형 request에 맞는 장비를 놓으면 대상에게 장비한 것과 같음
      const tg = byId(t.target);
      return tg && tagLevel(dd, t.slot) ? { act: 'equip', slot: t.slot, onto: tg } : null;
    }
    if (t.goal === 'fullHp' || t.goal === 'hpMin' || t.goal === 'sleep'){
      // 조건형 request에 음식을 내려놓으면 대상에게 먹인 것과 같음
      const tg = byId(t.target);
      return tg && edible ? { act: 'eat', feed: tg } : null;
    }
    if (t.goal || t.stack.length >= t.need) return null;      // 이미 다 참
    if (t.wantsList) return wantsNeed(t, d.type) ? { act: 'submit' } : null;
    if (t.wants) return d.type === t.wants ? { act: 'submit' } : null;
    return submittable(dd) ? { act: 'submit' } : null;
  }
  if (td.kind === 'character'){
    // 캐릭터의 장비 칸(칼·방패)과 같은 태그를 가진 카드 → 장비
    const slot = (td.slots || []).find(sl => tagLevel(dd, sl));
    if (slot) return { act: 'equip', slot };
  }
  if (td.kind === 'character' && edible){
    // 이 캐릭터가 준 제출형 request가 이 카드를 원하면, 직접 먹여도 그 request에 들어감
    const into = S.cards.find(r => r.type === 'quest' && r.giver === t.id && wantsNeed(r, d.type));
    if (into) return { act: 'submit', into, eatToo: true };   // quest 수량도 오르고, 체력 카드면 먹어서 체력도 오름
    return { act: 'eat' };
  }
  const ms = usableRecipes(d.type, t.type);
  if (!ms.length) return null;
  if (ms.length > 1) console.warn('[제작자 알림] 조합 겹침', d.type, t.type, ms.map(m => m.r.id));
  const m = ms[0];
  // 장소는 월드에 하나만 → 이미 있는 장소가 나오는 조합은 안 됨
  const dup = (m.r.out || []).find(o => tagLevel(DEFS[o], '장소') && S.cards.some(c => c.type === o));
  const outs = m.r.cook ? [DEFS[(m.aIsX ? t : d).type].cooked] : (m.r.out || []);   // 익히기는 익힌 카드가 새로 생김
  const capped = dup || !outs.length || outs.some(o => o && canSpawn(o)) ? null : outs[0];   // 하나도 못 나올 때만 조합 안 됨
  return { act: 'recipe', r: m.r, A: m.aIsX ? d : t, B: m.aIsX ? t : d, full: !!(dup || capped), dup, capped };
}
// 신의 입 기록: 카드 상태 그대로 (자루 내용물·체력·상태 등) idx 자리에 넣음. 최근 것이 앞, 넘치면 가장 오래된 기록이 밀려 사라짐
function recordEaten(mouth, c, idx){
  const rec = JSON.parse(JSON.stringify(c));
  for (const k of ['id', 'x', 'y', 'z', 'visit', 'visitSeq']) delete rec[k];
  const list = mouth.eaten || [];
  list.splice(Math.min(idx, list.length), 0, rec);
  mouth.eaten = list.slice(0, DEFS[mouth.type].devour);
  return list.slice(DEFS[mouth.type].devour);                   // 밀려난 기록 → 삼킴
}
// v0.65.0: 신의 입이 삼킴 — 기록에서 밀려난 카드가 입 그림 쪽으로 돌며 작아지고, 삼킬 때마다 흡족 +1 (흡족 기능은 아직 없음)
const SWALLOW_MS = 600;
const eatShift = new Set();                                     // 다음 그리기에서 기록 칸이 한 칸씩 밀리는 신의 입
// 밀려날 기록 칸(맨 오른쪽) 자리 — 기록을 바꾸기 전에 잼
function swallowFrom(mouth){
  const el = els.get(mouth.id);
  const slot = el && el.querySelector(`.eaten .mini:nth-child(${DEFS[mouth.type].devour})`);
  return slot ? slot.getBoundingClientRect() : null;
}
function swallow(mouth, recs, from){
  if (!recs.length) return;
  mouth.satisfied = (mouth.satisfied || 0) + recs.length;
  const el = els.get(mouth.id);
  const icon = el && el.querySelector('.emoji');
  const anim = !!(from && icon);
  if (anim){
    const tr = table.getBoundingClientRect(), ir = icon.getBoundingClientRect();
    for (const r of recs){
      const f = document.createElement('div');
      f.className = `mini framed f-${frameOf(DEFS[r.type])} swallow`;
      f.innerHTML = iconHtml(r.type);
      f.style.left = (from.left - tr.left) + 'px';
      f.style.top = (from.top - tr.top) + 'px';
      f.style.width = from.width + 'px';
      f.style.height = from.height + 'px';
      f.style.fontSize = 'calc(var(--cw) * .17)';
      f.style.setProperty('--dx', (ir.left + ir.width / 2 - from.left - from.width / 2) + 'px');
      f.style.setProperty('--dy', (ir.top + ir.height / 2 - from.top - from.height / 2) + 'px');
      table.appendChild(f);
      setTimeout(() => f.remove(), SWALLOW_MS);
    }
  }
  setTimeout(() => { if (byId(mouth.id)) floatText(mouth, `흡족 +${recs.length}`, 'work'); }, anim ? SWALLOW_MS : 0);
}
function apply(ev, d, t){
  const dd = DEFS[d.type];
  if (ev.act === 'submit'){
    const rq = ev.into || t;
    removeCard(d.id);
    rq.stack.push(d.type);
    rq.z = ++S.z;
    bumpIds.add(rq.id);
    if (ev.into) bumpIds.add(t.id);
    // 캐릭터가 원한 체력 카드: quest에 올리든 캐릭터에게 주든 똑같이 그 캐릭터 체력이 오름 (체력 아이템 학습)
    //   "아무거나 3개"처럼 특정 카드를 원하지 않는 quest는 먹이지 않음
    const g = rq.giver != null ? byId(rq.giver) : null;
    if (g && g.hp != null && (rq.wants || rq.wantsList)){
      const max = DEFS[g.type].hp;
      const heal = healOf(dd);
      if (heal > 0 && g.hp < max && !statusOf(g).includes('빈사')){
        const before = g.hp;
        g.hp = Math.min(max, g.hp + heal);
        floatText(g, `${si('hp')} +${g.hp - before}`);
        bumpIds.add(g.id);
        if (g.hp >= max && statusOf(g).includes('허기짐')){
          setStatus(g, ['허기짐'], []);
          toast(`🍽️ ${DEFS[g.type].name}: 허기짐 해결`);
        }
      }
    }
    return true;
  }
  if (ev.act === 'strike'){
    if (ev.low){
      toast(`${ic(d.type)} 무기의 공격력 낮음 (${si('atk')} ${dd.atk || 0} < ${si('hp')} ${t.hp})`);
      floatText(t, '무기의 공격력 낮음', 'work');
      return false;
    }
    killCreature(t);
    relocate(d);                                            // 무기는 남음
    return true;
  }
  if (ev.act === 'duel'){
    if (ev.full){ toast(`${DEFS[d.type].name} 빈사 상태 — 대결할 수 없음`); return false; }
    startDuel(d, t);
    return true;
  }
  if (ev.act === 'store'){
    if (ev.full){ toast(`가득 참 — ${DEFS[t.type].name} 최대 ${DEFS[t.type].hold}장`); return false; }
    removeCard(d.id);
    storeInto(t, d.type);
    return true;
  }
  if (ev.act === 'devour'){
    S.flags.devoured = true;                                // v0.84.0: 신의 입 quest 1단계
    removeCard(d.id);
    const from = swallowFrom(t);
    swallow(t, recordEaten(t, d, 0), from);                 // 기록이 가득 차 있으면 맨 오른쪽이 밀려나 삼켜짐
    eatShift.add(t.id);
    bumpIds.add(t.id);
    toast(`${ic(d.type)} ${dd.name} → ${DEFS[t.type].name}`);
    return true;
  }
  if (ev.act === 'visit'){
    if (ev.full){ toast(`자리가 가득 참 — ${DEFS[t.type].name} 최대 ${DEFS[t.type].capacity}명`); return false; }
    if (d.visit !== t.id){
      d.visit = t.id; d.visitSeq = ++S.z;                      // 방문: 장소 오른쪽 줄 끝에 섬
      if (DEFS[t.type].span) enterDungeon(t, d);               // v0.90.0: 던전이면 크리처 등장 + 오른쪽 끝에서 시작
    }
    bumpIds.add(t.id);
    toast(`📍 ${dd.name} → ${DEFS[t.type].name} 방문`);
    return true;
  }
  if (ev.act === 'equip'){
    if (ev.onto){ bumpIds.add(t.id); t = ev.onto; }            // request에 놓음 → 대상에게 장비
    const slot = ev.slot;
    t.equip = t.equip || {};
    const prev = t.equip[slot];
    removeCard(d.id);
    t.equip[slot] = d.type;
    bumpIds.add(t.id);
    toast(`${ic(d.type)} ${DEFS[t.type].name}: ${DEFS[d.type].name} 장비 (${slot})`);
    if (prev && DEFS[prev]){
      // 같은 칸에 다른 장비가 올라오면 이전 장비는 방출
      const p = findSpot(t.x + CW * 1.1, t.y + CH * 0.3);
      const pc = addCard(prev, p.x, p.y, null, true);
      spawned.delete(pc.id);
      popFrom.set(pc.id, { x: t.x, y: t.y });
      toast(`↩ ${DEFS[prev].name} 방출`);
    }
    return true;
  }
  if (ev.act === 'eat'){
    if (ev.feed){ bumpIds.add(t.id); t = ev.feed; }              // request에 내려놓음 → 대상에게 먹임
    const max = DEFS[t.type].hp;
    const talk = () => { if (t.type === 'knight' && knightLine(t)) knightSay(knightLine(t)); };   // 반응 대사 (중복은 speak가 거름)
    if (statusOf(t).includes('빈사')){
      // 빈사는 빈사 치유 아이템으로만 해결 → 허기짐
      if (!tagLevel(dd, '빈사 치유')){ toast('빈사 상태 — 빈사 치유가 필요함'); talk(); return false; }
      setStatus(t, ['빈사'], ['허기짐']);
      removeCard(d.id);
      bumpIds.add(t.id);
      toast(`💊 ${DEFS[t.type].name}: 빈사 → 허기짐`);
      return true;
    }
    const heal = healOf(dd);
    if (heal <= 0){ toast('효과 없음'); return false; }
    if (t.hp >= max){ toast('체력이 가득함'); return false; }
    const before = t.hp;
    t.hp = Math.min(max, t.hp + heal);
    floatText(t, `${si('hp')} +${t.hp - before}`);   // 먹어서 오른 체력
    removeCard(d.id);
    bumpIds.add(t.id);
    // 허기짐은 체력을 최대치까지 채우면 해결
    if (t.hp >= max && statusOf(t).includes('허기짐')){
      setStatus(t, ['허기짐'], []);
      toast(`🍽️ ${DEFS[t.type].name}: 허기짐 해결`);
    } else {
      talk();
    }
    return true;
  }
  if (ev.act === 'recipe'){
    if (ev.dup){ toast(`${ic(ev.dup)} ${DEFS[ev.dup].name} — 장소는 하나만 있을 수 있음`); return false; }
    if (ev.capped){ capToast(ev.capped); return false; }
    const { r, A, B } = ev;
    const bx = t.x, by = t.y;
    if (r.cook){
      // 날것 태그가 떨어지고 익힘 태그가 붙음 → 익힌 카드로 바뀜
      B.type = DEFS[B.type].cooked;
      markSeen(B.type);
      spawned.add(B.id);
      markFresh(B.id);                                        // 익힌 카드도 조합 결과
      bumpIds.add(A.id);
      relocate(d);
    } else {
      const consumed = [];
      if (r.keep !== 'a') consumed.push(A);
      if (r.keep !== 'b') consumed.push(B);
      const targetKept = !consumed.includes(t);
      for (const c of consumed) removeCard(c.id);
      const omitted = [];
      for (const o of (r.out || [])){
        if (!canSpawn(o)){ omitted.push(o); continue; }        // 월드 상한까지만 채움
        const p = findSpot(targetKept ? bx + CW * 0.9 : bx, by);
        markFresh(addCard(o, p.x, p.y).id);
      }
      omitToast(omitted);
      if (targetKept) bumpIds.add(t.id);
      if (!consumed.includes(d)) relocate(d);
      if (r.burn) toast(`${ic(B.type)} ${DEFS[B.type].name} 태우기 → ${ic('ash')} 재`);
    }
    if (!S.found.includes(r.id)){
      S.found.push(r.id);
      if (bookOpen && !discoRunning) renderBook();
      toast('✨ 새 조합: ' + recipeText(r));
      if (!S.flags.discovered){
        S.flags.discovered = true;
        say(LINES.firstDiscovery);
      } else {
        sayMaybe(LINES.discover);
      }
    }
    return true;
  }
  return false;
}

// 조합 규칙 점검 — 겹치거나 빠진 게 있으면 제작자에게 알림
function validateRecipes(){
  const issues = [];
  const types = Object.keys(DEFS);
  for (const id of types){
    const d = DEFS[id];
    if (tagLevel(d, '날것') && tagLevel(d, '익힘')) issues.push(`${d.name}: 날것과 익힘은 상극인데 둘 다 붙어 있음`);
  }
  for (let i = 0; i < types.length; i++){
    for (let j = i; j < types.length; j++){
      const ms = recipesFor(types[i], types[j]);
      for (const m of ms){
        if (!m.r.cook) continue;
        const raw = m.aIsX ? types[j] : types[i];
        if (!DEFS[raw].cooked) issues.push(`${DEFS[raw].name}: 날것인데 익힌 결과(cooked)가 없음`);
      }
      const ids = [...new Set(ms.map(m => m.r.id))];
      if (ids.length > 1) issues.push(`${DEFS[types[i]].name} + ${DEFS[types[j]].name}: 조합 겹침 (${ids.join(', ')}) — 하나를 해소해야 함`);
    }
  }
  const uniq = [...new Set(issues)];
  if (!uniq.length) return;
  console.warn('[제작자 알림] 조합 규칙 문제', uniq);
  devnote.innerHTML = '<b>⚠ 제작자 알림 · 조합 규칙</b><br>' + uniq.map(esc).join('<br>');
  devnote.hidden = false;
}

// ── 변화 후 처리 ──────────────────────────────────────
function afterChange(){
  checkSettle();
  save();
  renderAll();
  scheduleGod();
}
function checkSettle(){
  for (const rq of S.cards){
    if (rq.type !== 'quest') continue;
    if (reqDone(rq) && !settling.has(rq.id)){
      settling.add(rq.id);
      const id = rq.id;
      setTimeout(() => settle(id), 420);
    }
  }
}
function settle(id){
  if (paused || drag || tear || busy){ setTimeout(() => settle(id), 200); return; }
  settling.delete(id);
  const rq = byId(id);
  if (!rq || rq.type !== 'quest' || !reqDone(rq)) return;
  busy = true;
  const el = els.get(id);
  if (el) el.classList.add('gone');
  setTimeout(() => {
    const x = rq.x, y = rq.y;
    removeCard(id);                       // 정산: 제출물과 quest 제거
    busy = false;
    rewardFor(rq, x, y);
    save();
    renderAll();
    scheduleGod();
  }, 300);
}

// 무기를 들어라·방패를 들어라 둘 다 끝나면 기사: "준비됐어" (한 번)
function knightReady(){
  S.flags.knightStage = 5;
  if (S.flags.readySaid) return;
  S.flags.readySaid = true;
  knightSay('준비됐어', knightCheck);                        // 대사 끝나고 갓의 마음의 평화
}
function rewardFor(rq, x, y){
  if (rq.quest === 'bonepowder'){
    const k = byId(rq.giver);
    if (k && statusOf(k).includes('빈사')) setStatus(k, ['빈사'], ['허기짐']);
    S.flags.knightStage = 2;
    knightSay('배고파', knightCheck);                      // 대사 끝나고 다음 quest
    return;
  }
  if (rq.quest === 'foodmedicine'){
    const k = byId(rq.target);
    if (k) setStatus(k, ['빈사', '허기짐'], []);
    S.flags.knightStage = 3;
    toast('🩹 빈사 해결');
    knightSay('졸려', knightCheck);                          // "졸려" 뒤에 잠이 보약
    return;
  }
  if (rq.quest === 'takeshield'){
    S.flags.shieldDone = true;
    if (S.flags.swordDone || (S.flags.knightStage || 0) >= 5) knightReady();
    toast(`${si('def')} 방패를 들었다`);
    return;
  }
  if (rq.quest === 'takesword'){
    S.flags.swordDone = true;
    if (S.flags.shieldDone) knightReady();
    toast(`${si('atk')} 무기를 들었다`);
    return;
  }
  if (rq.quest === 'sleepmedicine'){
    const omitted = [];
    if (canSpawn('hilt')) addCard('hilt', x, y); else omitted.push('hilt');   // 보상이 먼저 보이고
    const p2 = findSpot(x + CW * 1.1, y);
    if (canSpawn('plank')) addCard('plank', p2.x, p2.y); else omitted.push('plank');
    omitToast(omitted);
    S.flags.knightStage = 4;
    toast('💤 잠이 보약 완료');
    knightSay('고맙다', knightCheck);                        // "고맙다" 뒤에 무기를 들어라
    return;
  }
  const mi = MOUTH_STEPS.findIndex(f => f.quest === rq.quest);
  if (mi >= 0){
    if (mi < MOUTH_STEPS.length - 1) giveMouthQuest(mi + 1);  // 넣기 → 꺼내기
    else {
      S.flags.mouthTaught = true;
      toast(`${ic('godmouth')} 신의 입 — 기록은 ${DEFS.godmouth.devour}장까지`);
      say(LINES.mouthWarn);                                 // "기록은 세 장까지야. 그 뒤론 되돌릴 수 없으니 조심해"
    }
    return;
  }
  if (rq.quest === 'mountainwork'){ giveRiverReward(x, y); return; }
  if (rq.quest === 'riverwork'){ giveDungeonReward(x, y); return; }   // v0.87.0: 강 채집 → 던전   // v0.73.0: 산 채집 → 강가
  const pi = PEACE_STEPS.findIndex(f => f.quest === rq.quest);
  if (pi >= 0){
    if (pi < PEACE_STEPS.length - 1) givePeaceQuest(pi + 1);  // 다음 마음의 평화 quest
    else finishPeace();
    return;
  }
  if (rq.quest === 'godsbed'){
    toast(`${ic('bedding')} 신의 품에서 완료`);
    return;
  }
  const hi = HUNT_STEPS.findIndex(f => f.quest === rq.quest);
  if (hi >= 0){
    if (hi < HUNT_STEPS.length - 1) giveHuntQuest(hi + 1);   // 다음 사냥 quest
    else {
      toast(`${ic('carcass')} 토끼를 사냥하기 완료`);
      if (!S.flags.fireGiven){                               // 사냥 줄이 끝나면 불 quest 줄
        S.flags.fireGiven = true;
        say(LINES.fireGrumble);                              // "익힌 것만 먹는 기사라, 입이 고급이구만"
        afterSpeech(() => giveFireQuest(0));
      }
    }
    return;
  }
  const fi = FIRE_STEPS.findIndex(f => f.quest === rq.quest);
  if (fi >= 0){
    if (fi < FIRE_STEPS.length - 1) giveFireQuest(fi + 1);   // 다음 불 quest
    else toast(`${ic('campfire')} 불멍이 하고 싶어 완료`);
    return;
  }
  if (rq.quest === 'firstcombo'){
    S.flags.comboDone = true;                               // 이제 기사가 첫 quest를 냄
    say(LINES.comboDone);
    return;
  }
  S.flags.godSettles = (S.flags.godSettles || 0) + 1;       // 갓의 "아무거나 3개" 정산 횟수
  const gg = rq.giver != null ? byId(rq.giver) : null;
  if (!canSpawn('package')) omitToast(['package']);
  else if (gg){
    // 정산 보상 package도 갓 아래 방향으로 튀어나옴
    const p = findSpot(gg.x, gg.y + CH + 12);
    const pk = addCard('package', p.x, p.y, { contents: 'tutorial' });
    spawned.delete(pk.id);
    popFrom.set(pk.id, { x: gg.x, y: gg.y });
  } else {
    addCard('package', x, y, { contents: 'tutorial' });
  }
  say(pick(LINES.settle), priChance(1 / LINES.settle.length));
}

// 이미 발견한 조합 중에 지금 테이블에서 할 수 있는 게 있나
function anyKnownRecipe(){
  const cs = S.cards;
  for (let i = 0; i < cs.length; i++){
    for (let j = i + 1; j < cs.length; j++){
      if (usableRecipes(cs[i].type, cs[j].type).some(m => S.found.includes(m.r.id))) return true;
    }
  }
  return false;
}
function submittableCount(){
  return S.cards.filter(c => submittable(DEFS[c.type])).length;
}
function scheduleGod(){
  clearTimeout(godTimer);
  godTimer = setTimeout(godCheck, 1400);
}
// 갓이 지금 무엇을 줘야 하나: null | 'quest' | 'package'
// 마음의 평화 완료: 갓의 "아무거나 3개"는 끝 (떠 있던 것도 사라지고, 올려둔 카드는 테이블로) → "갓 파워!" → 산
function finishPeace(){
  toast(`${ic('sack')} 마음의 평화 완료`);

    settling.delete(rq.id);
    removeCard(rq.id);
  }

  afterSpeech(giveMountain);
}
function giveMountain(){
