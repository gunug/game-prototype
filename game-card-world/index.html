//   quest: 수치 = 진행 / 상태 = 발주·올려놓은 카드 / 조합·출현 = 조합식·보상
const iRow = (k, v) => `<tr><th>${k}</th><td>${v}</td></tr>`;
const iTbl = rows => rows ? `<table class="i-tbl">${rows}</table>` : '';
const iSub = (title, body) => body ? `<div class="i-sub">${title}</div>${body}` : '';
const iLine = html => `<div class="i-line">${html}</div>`;
const iChips = list => `<div class="i-chips">${list.map(x => `<span>${x}</span>`).join('')}</div>`;
const iNone = text => `<div class="i-muted">${text}</div>`;
const cardRef = t => `${iconHtml(t, true)} ${esc(DEFS[t].name)}`;
const pctText = p => (Number.isInteger(p) ? p : p.toFixed(1)) + '%';
// 가중치 표 → 그림·이름·확률 칩 (한 줄에 여러 개)
function oddsChips(table){
  const total = table.reduce((sum, [, w]) => sum + w, 0);
  return iChips(table.map(([t, w]) => `${[].concat(t).map(cardRef).join(' + ')} ${pctText(w / total * 100)}`));
}
function inspectorHtml(c){
  const d = DEFS[c.type];
  const isQuest = d.kind === 'quest';
  const dying = d.kind === 'character' && statusOf(c).includes('빈사');
  const status = statusOf(c);
  const chips = (COMBOABLE.has(c.type) ? '<span class="i-tag combo">조합 가능</span>' : '')
    + (d.tags || []).map(t => `<span class="i-tag">${esc(t)}</span>`).join('')
    + status.map(t => `<span class="i-tag st">${esc(t)}</span>`).join('');
  const head = `<div class="i-head"><div class="i-icon${dying ? ' dying' : ''}">${iconHtml(c.type)}</div>`
    + (isQuest ? '<span class="i-kind">Quest</span>' : '')
    + `<div class="i-name">${esc(isQuest ? c.title : d.name)}</div>`
    + (chips ? `<div class="i-tags">${chips}</div>` : '') + '</div>';

  // ① 수치
  let c1 = '';
  if (isQuest){
    c1 = iSub('진행', `<div class="i-pre">${rich(reqProgress(c))}</div>`);
  } else {
    let st = '';
    if (fighter(d)) st += iRow(`${statImg('atk')}공격`, atkOf(c)) + iRow(`${statImg('def')}방어`, defOf(c)) + iRow(`${statImg('hp')}체력`, `${c.hp}/${d.hp}`);
    const heal = healOf(d);
    if (heal > 0) st += iRow(`${statImg('hp')}회복`, '+' + heal);
    if (d.atk) st += iRow(`${statImg('atk')}공격`, '+' + d.atk);
    if (d.defense) st += iRow(`${statImg('def')}방어`, '+' + d.defense);
    if (d.capacity) st += iRow('👤 인원', `${visitorsOf(c).length}/${d.capacity}`);
    if (d.hold) st += iRow('용량', `${c.count || 0}/${d.hold}`);
    const lv = tagLevel(d, '체력 회복');
    if (lv){
      const period = REST_MS / lv;
      const vs = visitorsOf(c);
      const healable = vs.filter(v => v.hp != null && v.hp < DEFS[v.type].hp && !statusOf(v).includes('빈사'));
      st += iRow('회복', `+1/${period / 1000}초`);
      st += iRow('다음', !vs.length ? '<span class="i-muted">방문자 없음</span>'
        : !healable.length ? '<span class="i-muted">회복할 캐릭터 없음</span>'
        : `${Math.max(0, Math.ceil((period - (c.restMs || 0)) / 1000))}초`);
    }
    if (d.yields){
      const vs = visitorsOf(c);
      st += iRow('게이지', `${c.yieldPts || 0}/${d.yieldNeed}`);
      st += iRow('1초마다', vs.length ? `+${vs.reduce((sum, v) => sum + atkOf(v), 0)}` : '<span class="i-muted">방문자 없음</span>');
    }
    c1 = iTbl(st);
  }

  // ② 상태
  let c2 = '';
  if (d.slots){
    const eq = c.equip || {};
    c2 += iSub('장비', iTbl(d.slots.map(sl => {
      const it = eq[sl] && DEFS[eq[sl]];
      return iRow(esc(sl), it ? cardRef(eq[sl]) + (it.atk ? ` ${statImg('atk')}+${it.atk}` : '') + (it.defense ? ` ${statImg('def')}+${it.defense}` : '') : '<span class="i-muted">비어 있음</span>');
    }).join('')));
  }
  if (d.capacity){
    const vs = visitorsOf(c);
    c2 += iSub('방문자', vs.length ? iChips(vs.map(v => cardRef(v.type))) : iNone('없음'));
  }
  if (c.visit != null){
    const pl = byId(c.visit);
    if (pl) c2 += iSub('방문 중', iLine(cardRef(pl.type)));
  }
  if (c.duel != null){
    const op = byId(c.duel);
    if (op) c2 += iSub('대결 중', iLine(cardRef(op.type)));
  }
  if (d.kind === 'container'){
    c2 += iSub('담긴 카드', c.count && c.fill && DEFS[c.fill] ? iLine(`${cardRef(c.fill)} ×${c.count}`) : iNone('비어 있음'));
  }
  if (isQuest){
    const g = c.giver != null ? byId(c.giver) : null;
    if (g) c2 += iSub('발주', iLine(cardRef(g.type)));
    if (c.stack.length) c2 += iSub('올려놓은 카드', iChips(c.stack.map(cardRef)));
  }

  // ③ 조합·출현
  let c3 = '';
  if (d.loot) c3 += iSub('전리품', iChips(d.loot.map(cardRef)));
  if (!['character', 'package', 'quest', 'creature'].includes(d.kind)){
    const { reach, use } = comboLists(c.type);
    c3 += iSub('도달하는 조합', reach.join('') || iNone('없음'));
    c3 += iSub('할 수 있는 조합', use.join('') || iNone('없음'));
  }
  if (d.yields) c3 += iSub('나오는 카드 — 게이지마다 하나', oddsChips(d.yields));
  if (d.kind === 'package' && d.fixed) c3 += iSub('들어 있는 카드', iChips(d.fixed.map(cardRef)));
  else if (d.kind === 'package'){
    if (c.contents === 'first') c3 += iSub('확정', iChips([cardRef('knight'), cardRef('god')]));
    c3 += iSub(`무작위 ${PACK_DRAW}장 — 한 장마다`, oddsChips(POOL.slice().sort((x, y) => y[1] - x[1])));
  }
  if (isQuest){
    const rs = c.recipes || (c.recipe ? [c.recipe] : []);
    if (c.recipeId && RECIPE_BY_ID.has(c.recipeId)) c3 += iSub('조합식', iLine(rich(recipeText(RECIPE_BY_ID.get(c.recipeId)))));   // 태그 조합도 그대로
    else if (rs.length) c3 += iSub('조합식', rs.map(([a, b, o]) => iLine(`${cardRef(a)} + ${cardRef(b)} → ${cardRef(o)}`)).join(''));
    c3 += iSub('보상', `<div class="i-pre">${rich(reqReward(c))}</div>`);
  }

  const cell = (title, body) => `<div class="i-cell"><h4>${title}</h4>${body || iNone('—')}</div>`;
  return head + `<div class="i-grid">${cell('수치', c1)}${cell('상태', c2)}${cell('조합·출현', c3)}</div>`;
}
// 인스펙터 조합 두 가지: 이 카드에 도달하는 조합 / 이 카드로 할 수 있는 조합
//   발견한 조합(S.found)은 전부 보여주고, 모르는 칸은 ???
//   익히기는 날것마다 한 줄 — 조합을 알고 그 익힌 카드도 본 적 있어야 공개
const UNK = '<span class="i-muted">???</span>';
const sideHtml = sd => rich(sideText(sd));
const comboLine = (a, b, out) => iLine(`${a} + ${b} → ${out}`);
function comboLists(t){
  const reach = [], use = [];
  const found = r => S.found.includes(r.id);
  for (const r of RECIPES){
    if (r.cook){
      for (const raw of Object.keys(DEFS)){
        const ck = DEFS[raw].cooked;
        if (!ck || !sideMatch(r.b, raw)) continue;
        const known = found(r) && S.seen.includes(ck);
        if (ck === t) reach.push(known ? comboLine(sideHtml(r.a), cardRef(raw), cardRef(t)) : comboLine(UNK, UNK, cardRef(t)));
        if (raw === t) use.push(known ? comboLine(cardRef(t), sideHtml(r.a), cardRef(ck)) : comboLine(cardRef(t), UNK, UNK));
      }
      if (sideMatch(r.a, t)) use.push(found(r) ? comboLine(cardRef(t), sideHtml(r.b), esc(outText(r))) : comboLine(cardRef(t), UNK, UNK));
      continue;
    }
    const outs = r.out || [];
    if (outs.includes(t)){
      reach.push(found(r)
        ? comboLine(sideHtml(r.a), sideHtml(r.b), rich(outText(r)))
        : comboLine(UNK, UNK, cardRef(t) + (outs.length > 1 ? ', ' + UNK : '')));
    }
    const aM = sideMatch(r.a, t), bM = sideMatch(r.b, t);
    if (aM || bM){
      const other = aM ? r.b : r.a;
      use.push(found(r) ? comboLine(cardRef(t), sideHtml(other), rich(outText(r))) : comboLine(cardRef(t), UNK, UNK));
    }
  }
  return { reach, use };
}

}

setInterval(renderInspector, 500);             // 인스펙터 실시간 갱신 (체력·게이지·진행)

measure();
if (load()){
  for (const c of S.cards){

  checkSettle();
  renderAll();
  scheduleGod();

} else {
  newGame();
}
requestAnimationFrame(physStep);
})();
