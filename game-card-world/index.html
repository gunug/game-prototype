<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>카드 월드 RPG — Game Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}
  [hidden]{display:none!important;}

  /* 뷰포트 전체가 테이블 */
  .table{
    position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(ellipse at 50% 40%,#25251d 0%,var(--canvas) 72%);
    touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* 화면 위 최소 UI (시스템 메뉴 · 콜렉터북 — 카드 아님) */
  .title{
    position:fixed;z-index:2147483000;
    top:calc(env(safe-area-inset-top,0px) + 16px);
    left:calc(env(safe-area-inset-left,0px) + 14px);
    color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;
  }
  .title a{color:var(--muted);text-decoration:none;}
  .title a:hover{color:var(--ink);}
  .hud{
    position:fixed;z-index:2147483000;
    top:calc(env(safe-area-inset-top,0px) + 10px);
    right:calc(env(safe-area-inset-right,0px) + 10px);
    display:flex;gap:8px;align-items:center;
  }
  .hud .btn{background:rgba(28,28,23,.85);border-color:var(--hairline);color:var(--ink);backdrop-filter:blur(6px);}
  .hud .btn:hover{background:var(--surface-soft);}
  .hud .count{color:var(--brand-yellow);font-weight:700;}
  .hud .toggle{gap:6px;cursor:pointer;-webkit-user-select:none;user-select:none;}
  .hud .toggle input{accent-color:var(--brand-yellow);margin:0;cursor:pointer;}

  /* request와 주체를 잇는 실선 — 카드 뒤에 깔림 */
  .links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible;}
  .links line{stroke:#e8d9a8;stroke-opacity:.55;stroke-width:2;}
  .links line.visit{stroke:#ffb070;}

  /* 카드 */
  .cw{
    position:absolute;width:var(--cw);height:var(--ch);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:linear-gradient(160deg,var(--surface-soft),#191914);
    border:1px solid var(--hairline);border-radius:var(--r-md);
    box-shadow:var(--sh-md);cursor:grab;touch-action:none;
    --tone:#8E8C82;
  }
  .cw::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--tone);opacity:.10;pointer-events:none;}
  .cw .emoji{font-size:calc(var(--cw) * .38);line-height:1;pointer-events:none;}
  .cw .name{color:var(--ink);font-size:calc(var(--cw) * .13);font-weight:700;text-align:center;padding:0 4px;line-height:1.15;pointer-events:none;}
  .cw .atk{color:#9fd0ff;font-size:calc(var(--cw) * .13);font-weight:700;line-height:1.1;pointer-events:none;}
  .cw .atkv{position:absolute;left:6px;top:5px;font-size:calc(var(--cw) * .11);font-weight:700;color:#9fd0ff;pointer-events:none;}
  .cw .equip{display:flex;gap:3px;pointer-events:none;}
  .cw .equip span{min-width:calc(var(--cw) * .24);height:calc(var(--cw) * .24);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw) * .15);border:1px solid rgba(255,255,255,.15);border-radius:4px;background:rgba(0,0,0,.3);}
  .cw .equip span[data-slot]{pointer-events:auto;cursor:grab;touch-action:none;}
  .cw .equip span.empty{font-size:calc(var(--cw) * .085);color:var(--muted);border-style:dashed;padding:0 3px;}
  .cw .heal{color:#ff8f8f;font-size:calc(var(--cw) * .13);font-weight:700;line-height:1.1;pointer-events:none;}
  .cw .hp{position:absolute;right:6px;top:5px;font-size:calc(var(--cw) * .11);font-weight:700;color:#ff8f8f;pointer-events:none;}
  .cw.has-tags{justify-content:flex-start;padding-top:calc(var(--ch) * .14);}
  .cw .tags{position:absolute;left:3px;right:3px;bottom:4px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;pointer-events:none;}
  .cw .tag.st{color:#ff9d9d;border-color:rgba(255,120,120,.4);}
  .cw .tag.combo{color:var(--brand-yellow);border-color:rgba(255,212,0,.35);}
  .cw .tag{font-size:calc(var(--cw) * .085);line-height:1.25;font-weight:600;color:var(--body);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:0 3px;white-space:nowrap;}
  .devnote{position:fixed;left:10px;bottom:10px;z-index:2147483300;max-width:min(440px,calc(100vw - 20px));background:#3a1414;border:1px solid #a33;color:#ffd6d6;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:8px;}
  .k-material{--tone:#b58c5a;}
  .k-tool{--tone:#9fb6cc;}
  .k-food{--tone:#7fc77f;}
  .k-fire{--tone:#ff9a3c;}
  .k-character{--tone:var(--brand-yellow);border-color:#4a4428;}
  .k-package{--tone:var(--brand-yellow);background:linear-gradient(160deg,#3b3521,#221f14);border-color:#5e5431;}
  .k-request{--tone:#e8d9a8;background:linear-gradient(160deg,#3a3527,#24211a);border-color:#5a5340;}

  .cw.dragging{cursor:grabbing;box-shadow:var(--sh-lg);border-color:var(--tone);pointer-events:none;}
  .cw.is-target{border-color:var(--brand-yellow);box-shadow:0 0 0 2px var(--brand-yellow),var(--sh-lg);}
  .cw.is-target.no{border-color:var(--hairline);box-shadow:0 0 0 2px rgba(142,140,130,.55),var(--sh-md);}
  .cw.spawn{animation:spawn .32s ease-out;}
  .cw.pop{animation:pop .5s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:translate(var(--fx),var(--fy)) scale(.2);opacity:0;}60%{opacity:1;}to{transform:none;opacity:1;}}
  .cw.bump{animation:bump .3s ease-out;}
  .cw.gone{animation:gone .3s ease-in forwards;}
  @keyframes spawn{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.12);}100%{transform:scale(1);}}
  @keyframes gone{to{transform:scale(.3);opacity:0;}}

  /* package 택 — 좌상단 점선 모서리 */
  .tab{position:absolute;left:0;top:0;width:36%;height:27%;border-top-left-radius:var(--r-md);cursor:crosshair;touch-action:none;z-index:2;}
  .tab::before{content:'';position:absolute;inset:0;border-top-left-radius:inherit;background:linear-gradient(135deg,rgba(255,212,0,.55) 0 50%,transparent 50%);animation:tabBlink 1.1s ease-in-out infinite;}
  /* 택이 깜빡여서 잡아당겨 열 수 있음을 알림 */
  @keyframes tabBlink{0%,100%{opacity:.25;}50%{opacity:1;}}
  @keyframes tabDash{0%,100%{stroke-opacity:.45;}50%{stroke-opacity:1;}}
  .tab svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .tab path{fill:none;stroke:var(--brand-yellow);stroke-width:2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;animation:tabDash 1.1s ease-in-out infinite;}
  .cw.peeling{cursor:grabbing;}
  .tab-piece{position:absolute;z-index:2000000002;pointer-events:none;transform-origin:35% 35%;
    background:linear-gradient(135deg,rgba(255,212,0,.38),#3b3521 75%);}
  .tab-piece.ready{background:linear-gradient(135deg,rgba(255,212,0,.7),#4a4226 75%);}
  .tab-piece svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .tab-piece path{fill:none;stroke:var(--brand-yellow);stroke-width:2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;}
  .cw.ready{box-shadow:0 0 0 2px var(--brand-yellow),var(--sh-lg);}
  .half{pointer-events:none;}
  .half-l{clip-path:inset(0 50% 0 0);animation:tearL .5s ease-in forwards;}
  .half-r{clip-path:inset(0 0 0 50%);animation:tearR .5s ease-in forwards;}
  @keyframes tearL{to{transform:translate(-45%,25%) rotate(-20deg);opacity:0;}}
  @keyframes tearR{to{transform:translate(45%,25%) rotate(20deg);opacity:0;}}

  /* request */
  .req-emoji{font-size:calc(var(--cw) * .24)!important;}
  .req-title{color:var(--ink);font-size:calc(var(--cw) * .12);font-weight:700;text-align:center;padding:0 6px;line-height:1.2;pointer-events:none;}
  .req-need{color:var(--brand-yellow);font-size:calc(var(--cw) * .13);font-weight:800;pointer-events:none;}
  .req-reward{color:var(--muted);font-size:calc(var(--cw) * .11);font-weight:600;pointer-events:none;}
  .req-stack{position:absolute;left:0;right:0;top:-14%;display:flex;justify-content:center;}
  .mini{
    width:calc(var(--cw) * .36);height:calc(var(--cw) * .46);margin:0 -3px;
    display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw) * .2);
    background:linear-gradient(160deg,var(--surface-soft),#191914);
    border:1px solid var(--hairline);border-radius:6px;box-shadow:var(--sh-sm);
    cursor:grab;touch-action:none;
  }

  /* 갓의 말풍선 */
  .speech{
    position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
    width:max-content;max-width:220px;
    background:var(--ink);color:#1a1a17;font-size:13px;font-weight:600;line-height:1.35;
    padding:8px 12px;border-radius:12px;box-shadow:var(--sh-md);pointer-events:none;
  }
  .speech::after{content:'';position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink);}

  /* 알림 */
  .toasts{
    position:fixed;z-index:2147483100;left:50%;transform:translateX(-50%);
    top:calc(env(safe-area-inset-top,0px) + 56px);
    display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
  }
  .toast{
    background:rgba(28,28,23,.94);border:1px solid var(--hairline);color:var(--ink);
    font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--r-pill);
    white-space:nowrap;animation:toast 2.6s forwards;
  }
  @keyframes toast{0%{opacity:0;transform:translateY(-6px);}10%{opacity:1;transform:none;}85%{opacity:1;}100%{opacity:0;}}

  /* 콜렉터북 */
  .book{position:fixed;inset:0;z-index:2147483200;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px;}
  .book-panel{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);width:100%;max-width:660px;max-height:90vh;overflow:auto;padding:20px;box-shadow:var(--sh-lg);}
  .book-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .book-head h2{margin:0 0 12px;font-size:22px;}
  .book-head small,.book-sub small{color:var(--muted);font-weight:600;font-size:14px;margin-left:6px;}
  .book-head .eyebrow{margin-bottom:8px;}
  .book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;}
  .slot{background:var(--surface-soft);border:1px solid var(--hairline);border-radius:var(--r-md);padding:10px 4px;text-align:center;}
  .slot .e{font-size:26px;line-height:1;}
  .slot .n{margin-top:6px;font-size:11px;font-weight:600;color:var(--ink);}
  .slot.unseen .n{color:var(--muted);}
  .book-sub{margin:20px 0 8px;font-size:16px;}
  .recipes{list-style:none;margin:0;padding:0;display:grid;gap:4px;}
  .recipes li{background:var(--surface-soft);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:6px 10px;font-size:13px;color:var(--ink);}
  .recipes li.unknown{color:var(--muted);}
</style>
</head>
<body>
  <div class="table" id="table"></div>
  <div class="title"><a href="../index.html">← 목록</a> · 카드 월드 RPG <span id="ver"></span></div>
  <div class="hud">
    <label class="btn btn-sm toggle"><input type="checkbox" id="physToggle"> 밀어내기</label>
    <button class="btn btn-sm" id="copyBtn" title="현재 필드 상태를 JSON으로 클립보드에 복사">📋 복사</button>
    <button class="btn btn-sm" id="bookBtn">📖 콜렉터북 <span class="count" id="bookCount"></span></button>
    <button class="btn btn-sm" id="resetBtn">↺ 처음부터</button>
  </div>
  <div class="toasts" id="toasts"></div>
  <div class="book" id="book" hidden></div>
  <div class="devnote" id="devnote" hidden></div>

<script>
(() => {
'use strict';

const VERSION = 'v0.14.1';
const STORE = 'card-world-rpg.v2';   // v0.7.0: 기사 상태 추가로 저장 초기화

// ── 카드 정의 ─────────────────────────────────────────
const DEFS = {
  package:   { name:'package',     emoji:'📦', kind:'package' },
  request:   { name:'request',     emoji:'📜', kind:'request' },
  knight:    { name:'기사',        emoji:'🛡️', kind:'character', tags:['캐릭터', '과묵'], hp:10, startHp:0, startStatus:['빈사'], slots:['칼', '방패'], baseAtk:0 },
  god:       { name:'갓',          emoji:'😇', kind:'character', tags:['캐릭터', '수다쟁이'], hp:1 },
  stone:     { name:'돌',          emoji:'🪨', kind:'material', tags:['손질 lv1', '합칠 수 있음'] },
  twig:      { name:'나뭇가지',    emoji:'🪵', kind:'material', tags:['불에 타는', '합칠 수 있음'] },
  grass:     { name:'마른 풀',     emoji:'🌾', kind:'material', tags:['불에 타는', '합칠 수 있음'] },
  flint:     { name:'부싯돌',      emoji:'💎', kind:'material', tags:['합칠 수 있음'] },
  bone:      { name:'뼈',          emoji:'🦴', kind:'material', tags:['합칠 수 있음'] },
  carcass:   { name:'동물 사체',   emoji:'🦌', kind:'material', tags:[] },
  shell:     { name:'조개',  emoji:'🐚', kind:'material', tags:['합칠 수 있음'] },
  berry:     { name:'열매',        emoji:'🫐', kind:'food', tags:['먹을 수 있음', '날것', '합칠 수 있음'], cooked:'roastberry' },
  handaxe:   { name:'뗀석기',      emoji:'🔪', kind:'tool', tags:['손질 lv2'] },
  marrow:    { name:'골수',        emoji:'🥣', kind:'food', tags:['먹을 수 있음', '빈사 치유'] },
  clam:      { name:'조갯살',      emoji:'🦪', kind:'food', tags:['먹을 수 있음', '날것'], cooked:'roastclam' },
  meat:      { name:'고기',        emoji:'🥩', kind:'food', tags:['먹을 수 있음', '날것'], cooked:'roastmeat' },
  hide:      { name:'가죽',        emoji:'🟫', kind:'material', tags:[] },
  stick:     { name:'뾰족한 막대', emoji:'🥢', kind:'tool', tags:['불에 타는'] },
  tinder:    { name:'불쏘시개',    emoji:'🪹', kind:'material', tags:['불에 타는'] },
  bedding:   { name:'풀 깔개',     emoji:'🛏️', kind:'material', tags:['불에 타는'] },
  ember:     { name:'불씨',        emoji:'✨', kind:'fire', tags:[] },
  campfire:  { name:'모닥불',      emoji:'🔥', kind:'fire', tags:['불', '장소'] },
  ash:       { name:'재',          emoji:'🌫️', kind:'material', tags:['합칠 수 있음'] },
  hilt:      { name:'부러진 칼자루', emoji:'🗡️', kind:'tool', tags:['칼'], atk:1 },
  roastmeat: { name:'구운 고기',   emoji:'🍖', kind:'food', tags:['먹을 수 있음', '익힘'] },
  roastclam: { name:'구운 조개',   emoji:'🍢', kind:'food', tags:['먹을 수 있음', '익힘'] },
  roastberry:{ name:'구운 열매',   emoji:'🍇', kind:'food', tags:['먹을 수 있음', '익힘', '합칠 수 있음'] },
};

// 튜토리얼 package 재료 풀 — 가중치 (확정 3)
const POOL = [
  ['stone', 18], ['berry', 18], ['twig', 16], ['grass', 14],
  ['bone', 12], ['shell', 12], ['carcass', 6], ['flint', 4],
];

// 2장 조합
//   각 쪽은 { card:'카드' } 또는 { tag:'태그', lv:최소 레벨 }
//   레벨 태그("손질 lv2")는 요구 레벨 이상이면 맞음 — 상위 도구는 하위 손질도 함
//   keep: 'a' / 'b' = 조합해도 남는 쪽
//   조합끼리 겹치면 안 됨 → 겹치면 제작자 알림 (validateRecipes)
const RECIPES = [
  { id:'handaxe',  a:{ card:'stone' },      b:{ card:'stone' },    out:['handaxe'] },
  { id:'ember',    a:{ card:'stone' },      b:{ card:'flint' },    out:['ember'], keep:'a' },
  { id:'marrow',   a:{ tag:'손질', lv:1 },  b:{ card:'bone' },     out:['marrow'], keep:'a' },
  { id:'clam',     a:{ tag:'손질', lv:1 },  b:{ card:'shell' },    out:['clam'], keep:'a' },
  { id:'butcher',  a:{ tag:'손질', lv:2 },  b:{ card:'carcass' },  out:['meat', 'hide'], keep:'a' },
  { id:'stick',    a:{ tag:'손질', lv:2 },  b:{ card:'twig' },     out:['stick'], keep:'a' },
  { id:'tinder',   a:{ card:'grass' },      b:{ card:'twig' },     out:['tinder'] },
  { id:'bedding',  a:{ card:'grass' },      b:{ card:'grass' },    out:['bedding'] },
  { id:'campfire', a:{ card:'ember' },      b:{ card:'tinder' },   out:['campfire'] },
  { id:'cook',     a:{ tag:'불' },          b:{ tag:'날것' },      cook:true, keep:'a' },
  { id:'burn',     a:{ tag:'불' },          b:{ tag:'불에 타는' }, out:['ash'], burn:true, keep:'a' },
];
const RECIPE_BY_ID = new Map(RECIPES.map(r => [r.id, r]));
// "조합 가능" 태그: 결과가 나오는 조합에 들어갈 수 있는 카드. 없으면 최후의 카드
let COMBOABLE = new Set();

function tagLevel(def, name){
  let lv = 0;
  for (const t of (def.tags || [])){
    if (t === name) lv = Math.max(lv, 1);
    else if (t.startsWith(name + ' lv')){
      const n = parseInt(t.slice(name.length + 3), 10);
      if (n > lv) lv = n;
    }
  }
  return lv;
}
const sideMatch = (side, type) => side.card ? side.card === type : tagLevel(DEFS[type], side.tag) >= (side.lv || 1);
// x, y 두 카드에 맞는 조합 전부. aIsX = x가 a쪽
function recipesFor(x, y){
  const out = [];
  for (const r of RECIPES){
    if (sideMatch(r.a, x) && sideMatch(r.b, y)) out.push({ r, aIsX: true });
    else if (sideMatch(r.a, y) && sideMatch(r.b, x)) out.push({ r, aIsX: false });
  }
  return out;
}
function usableRecipes(x, y){
  return recipesFor(x, y).filter(m => !m.r.cook || DEFS[m.aIsX ? y : x].cooked);
}
function sideText(sd){
  return sd.card ? `${DEFS[sd.card].emoji} ${DEFS[sd.card].name}` : `🏷️ ${sd.tag}${sd.lv ? ' lv' + sd.lv + ' 이상' : ''}`;
}
function outText(r){
  if (r.burn) return '🌫️ 재 (태우기)';
  if (r.cook) return '익힘 (날것이 익은 것으로)';
  return r.out.map(o => DEFS[o].emoji + ' ' + DEFS[o].name).join(', ');
}
const recipeText = r => `${sideText(r.a)} + ${sideText(r.b)} → ${outText(r)}`;

// 콜렉터북 페이지 (시대별)
const PAGE = {
  title: '석기시대 초기',
  ids: ['package', 'request', 'knight', 'god',
        'stone', 'twig', 'grass', 'flint', 'bone', 'carcass', 'shell', 'berry',
        'handaxe', 'marrow', 'clam', 'meat', 'hide', 'stick', 'tinder', 'bedding',
        'ember', 'campfire', 'ash', 'roastmeat', 'roastclam', 'roastberry', 'hilt'],
};

// 갓의 대사
const LINES = {
  intro:          ['푸하! …살았다.', '뭘 봐. 갓이다. 신… 비슷한 거.', '구해줬으니 거래 하나 하자고.'],

// ── 유틸 ──────────────────────────────────────────────
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));
const byId = id => S.cards.find(c => c.id === id);
const submittable = def => !['character', 'package', 'request'].includes(def.kind);

function measure(){
  const m = Math.min(innerWidth, innerHeight);
  CW = Math.round(Math.max(68, Math.min(104, m / 6.2)));
  CH = Math.round(CW * 1.36);
  table.style.setProperty('--cw', CW + 'px');
  table.style.setProperty('--ch', CH + 'px');
}
function tableSize(){ return { w: table.clientWidth, h: table.clientHeight }; }
function clampPos(x, y){
  const { w, h } = tableSize();
  return {
    x: Math.max(8, Math.min(x, w - CW - 8)),
    y: Math.max(TOP_PAD, Math.min(y, h - CH - 8)),
  };
}
function findSpot(x, y, spread){
  const step = CW * 0.95 * (spread || 1);
  for (let r = 0; r < 9; r++){
    const n = r === 0 ? 1 : r * 6;
    for (let i = 0; i < n; i++){
      const ang = (i / n) * Math.PI * 2 + r * 0.5;
      const p = clampPos(x + Math.cos(ang) * step * r, y + Math.sin(ang) * step * r * 0.9);
      const free = S.cards.every(o => Math.abs(o.x - p.x) > CW * 0.7 || Math.abs(o.y - p.y) > CH * 0.6);
      if (free) return p;
    }
  }
  return clampPos(x + (Math.random() - 0.5) * CW, y + (Math.random() - 0.5) * CH);
}
function drawPool(n){
  const total = POOL.reduce((s, [, w]) => s + w, 0);
  const out = [];
  for (let i = 0; i < n; i++){
    let r = Math.random() * total;
    for (const [t, w] of POOL){ r -= w; if (r < 0){ out.push(t); break; } }
  }
  return out;
}

// ── 카드 추가 / 제거 ──────────────────────────────────
function markSeen(type, quiet){
  if (S.seen.includes(type)) return;
  S.seen.push(type);
  if (!quiet) newSeen.push(type);
}
function addCard(type, x, y, extra, quiet){
  const c = Object.assign({ id: S.nextId++, type, x, y, z: ++S.z }, extra || {});
  const d = DEFS[type];
  if (d.hp && c.hp == null) c.hp = d.startHp != null ? d.startHp : d.hp;
  if (d.startStatus && !c.status) c.status = d.startStatus.slice();
  const p = clampPos(c.x, c.y);
  c.x = p.x; c.y = p.y;
  S.cards.push(c);
  spawned.add(c.id);
  markSeen(type, quiet);
  return c;
}
function removeCard(id){ S.cards = S.cards.filter(c => c.id !== id); vel.delete(id); }
function relocate(c){
  S.cards = S.cards.filter(o => o.id !== c.id);
  const p = findSpot(c.x + CW * 0.6, c.y + CH * 0.2);
  c.x = p.x; c.y = p.y;
  S.cards.push(c);
}

// ── 저장 ──────────────────────────────────────────────
function save(){
  try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {}
}
function load(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return false;
    const st = JSON.parse(raw);
    if (!st || !Array.isArray(st.cards) || !st.cards.length) return false;
    st.cards = st.cards.filter(c => DEFS[c.type]);
    st.seen = (st.seen || []).filter(t => DEFS[t]);
    st.found = (st.found || []).filter(k => RECIPE_BY_ID.has(k));
    st.flags = st.flags || {};
    for (const c of st.cards) if (c.type === 'request' && !Array.isArray(c.stack)) c.stack = [];
    if (!st.cards.length) return false;
    S = st;
    return true;
  } catch (e) { return false; }
}
function newGame(){
  S = { cards: [], seen: ['package'], found: [], flags: { discovered: false, requestsGiven: 0 }, nextId: 1, z: 1 };
  const { w, h } = tableSize();
  addCard('package', w / 2 - CW / 2, h / 2 - CH / 2, { contents: 'first' }, true);
  save();
  renderAll();
}

// ── 렌더 ──────────────────────────────────────────────
function paint(el, c){
  const d = DEFS[c.type];
  let cls = 'cw k-' + d.kind;
  const combo = COMBOABLE.has(c.type);
  const tags = tagsOf(c);
  if ((tags.length || combo) && d.kind !== 'request') cls += ' has-tags';
  const pf = popFrom.get(c.id);
  if (pf){
    cls += ' pop';
    el.style.setProperty('--fx', (pf.x - c.x) + 'px');
    el.style.setProperty('--fy', (pf.y - c.y) + 'px');
  } else if (spawned.has(c.id)) cls += ' spawn';
  if (bumpIds.has(c.id)) cls += ' bump';
  el.className = cls;
  el.style.left = c.x + 'px';
  el.style.top = c.y + 'px';
  el.style.zIndex = ((c.type === 'god' && speech) || (c.type === 'knight' && knightSpeech)) ? 1999999999 : c.z;
  let html = '';
  if (d.kind === 'request'){
    html += `<div class="emoji req-emoji">${d.emoji}</div>`;
    html += `<div class="req-title">${esc(c.title)}</div>`;
    html += `<div class="req-need">${esc(reqProgress(c))}</div>`;
    html += `<div class="req-reward">${esc(reqReward(c))}</div>`;
    if (c.stack.length){
      html += '<div class="req-stack">' + c.stack.map((t, i) => `<div class="mini" data-idx="${i}">${DEFS[t].emoji}</div>`).join('') + '</div>';
    }
  } else {
    html += `<div class="emoji">${d.emoji}</div><div class="name">${esc(d.name)}</div>`;
    const heal = healOf(d);
    if (heal > 0) html += `<div class="heal">❤ +${heal}</div>`;       // 음식 회복량을 이름 아래에
    if (d.atk) html += `<div class="atk">⚔ +${d.atk}</div>`;           // 장비 공격력
    if (d.slots){
      // 장비 칸: 장비한 아이템 아이콘, 빈 칸은 칸 이름. 왼쪽 위에 공격력 합계
      const eq = c.equip || {};
      const atk = (d.baseAtk || 0) + Object.values(eq).reduce((sum, ty) => sum + ((DEFS[ty] && DEFS[ty].atk) || 0), 0);
      html += `<div class="atkv">⚔ ${atk}</div>`;
      html += '<div class="equip">' + d.slots.map(sl => eq[sl] && DEFS[eq[sl]]
        ? `<span data-slot="${esc(sl)}" title="${esc(sl)} — 드래그해서 빼기">${DEFS[eq[sl]].emoji}</span>`
        : `<span class="empty">${esc(sl)}</span>`).join('') + '</div>';
    }
    if (d.kind === 'package') html += '<div class="tab"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M100 0 L0 100"/></svg></div>';
    if (d.hp) html += `<div class="hp">❤ ${c.hp}/${d.hp}</div>`;
    if (tags.length || combo){
      html += '<div class="tags">' + (combo ? '<span class="tag combo">조합 가능</span>' : '')
        + tags.map(t => `<span class="tag${statusOf(c).includes(t) ? ' st' : ''}">${esc(t)}</span>`).join('') + '</div>';
    }
    if (c.type === 'god' && speech) html += `<div class="speech">${esc(speech)}</div>`;
    if (c.type === 'knight' && knightSpeech) html += `<div class="speech">${esc(knightSpeech)}</div>`;
  }
  el.innerHTML = html;
}
function renderAll(){
  if (drag) return;
  const alive = new Set();
  for (const c of S.cards){
    alive.add(c.id);
    let el = els.get(c.id);
    if (!el){
      el = document.createElement('div');
      el.dataset.id = c.id;
      table.appendChild(el);
      els.set(c.id, el);
    }
    el.style.visibility = '';
    if (!(tear && tear.id === c.id)){ el.style.transform = ''; el.style.clipPath = ''; }
    paint(el, c);
  }
  for (const [id, el] of els){
    if (!alive.has(id)){ el.remove(); els.delete(id); }
  }
  spawned.clear();
  popFrom.clear();
  bumpIds.clear();
  if (newSeen.length){
    if (newSeen.length === 1) toast(`📖 새 카드: ${DEFS[newSeen[0]].emoji} ${DEFS[newSeen[0]].name}`);
    else toast(`📖 새 카드 ${newSeen.length}장 기록 ` + newSeen.map(t => DEFS[t].emoji).join(' '));
    newSeen = [];
  }
  const n = PAGE.ids.filter(id => S.seen.includes(id)).length;
  bookCount.textContent = `${n}/${PAGE.ids.length}`;
}
function renderGod(){
  if (drag) return;
  const g = S.cards.find(c => c.type === 'god');
  const el = g && els.get(g.id);
  if (el) paint(el, g);
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  toasts.appendChild(t);
  setTimeout(() => t.remove(), 2700);
  while (toasts.children.length > 4) toasts.firstChild.remove();
}

// ── 갓의 말 ───────────────────────────────────────────
const SPEAKERS = ['god', 'knight'];            // 대사 우선순위 — 앞일수록 먼저
const talkQ = { god: [], knight: [] };          // 사람마다 할 말 줄 [{ text, done }]
let talking = null, talkTimer = null;           // 지금 말하는 사람
function enqueueTalk(who, items){
  talkQ[who].push(...items);
  if (!talking) showNextTalk(null);
}
// 이 사람이 말하는 중이거나 할 말이 남아 있나
const isTalking = who => talking === who || talkQ[who].length > 0;
function setLine(who, text){
  if (who === 'god') speech = text; else knightSpeech = text;
  repaint(who);
}
function showNextTalk(prev){
  // 방금 말한 사람이 이어서 할 말이 있으면 계속 (한쪽 대화가 다 끝나야 다음 사람)
  // 아니면 할 말이 있는 사람 중 우선순위가 높은 쪽
  const who = (prev && talkQ[prev].length) ? prev : SPEAKERS.find(w => talkQ[w].length);
  if (!who){ talking = null; return; }
  const item = talkQ[who].shift();
  talking = who;
  setLine(who, item.text);
  if (!S.cards.some(c => c.type === who)) toast((who === 'god' ? '😇 ' : '🛡️ ') + item.text);
  talkTimer = setTimeout(() => {
    setLine(who, null);
    talking = null;
    if (item.done) item.done();
    if (who === 'god' && !talkQ.god.length){
      const ws = speechWaiters;
      speechWaiters = [];
      for (const fn of ws) fn();
    }
    if (!talking) showNextTalk(who);
  }, Math.max(1800, item.text.length * 110));
}
function say(x){
  enqueueTalk('god', (Array.isArray(x) ? x : [x]).map(text => ({ text })));
}
function sayMaybe(arr){
  const now = Date.now();
  if (now - lastMaybe < 6000 || Math.random() > 0.4) return;
  lastMaybe = now;
  say(pick(arr));
}
// 갓의 할 말이 다 끝나면 부름
function afterSpeech(fn){
  if (!isTalking('god')){ fn(); return; }
  speechWaiters.push(fn);
}

// ── 상태 태그 (카드 한 장에 붙고 떨어짐) ──────────────
const statusOf = c => c.status || [];
const tagsOf = c => (DEFS[c.type].tags || []).concat(statusOf(c));
function setStatus(c, remove, add){
  const s = statusOf(c).filter(t => !remove.includes(t));
  for (const a of add) if (!s.includes(a)) s.push(a);
  c.status = s;
}
// 음식 회복량: 익힘 +2, 날것 +1, 그 밖엔 카드 정의값(열매 등)
function healOf(def){
  if (tagLevel(def, '익힘')) return 2;
  if (tagLevel(def, '날것')) return 1;
  return def.heal || 0;
}

// ── request 종류 ──────────────────────────────────────
//   갓: { need:3, stack } 아무거나 → package
//   제출형 퀘스트: { quest, wants:'카드', need, stack, reward:'카드' }
//   조건형 퀘스트: { quest, goal:'fullHp', target } / { quest, goal:'equip', slot, target }
const isGodRequest = rq => !rq.quest;
function reqDone(rq){
  if (rq.goal === 'fullHp'){
    const t = byId(rq.target);
    return !!t && t.hp >= DEFS[t.type].hp && !statusOf(t).includes('빈사');
  }
  if (rq.goal === 'equip'){
    const t = byId(rq.target);
    return !!t && !!(t.equip && t.equip[rq.slot]);          // 그 칸에 뭐든 장비하면 완료
  }
  return rq.stack.length >= rq.need;
}
function reqProgress(rq){
  if (rq.goal === 'fullHp'){
    const t = byId(rq.target);
    return t ? `체력 ${t.hp} / ${DEFS[t.type].hp}` : '대상 없음';
  }
  if (rq.goal === 'equip'){
    const t = byId(rq.target);
    const it = t && t.equip && t.equip[rq.slot];
    return `${rq.slot} 칸: ${it && DEFS[it] ? DEFS[it].emoji : '비어 있음'}`;
  }
  if (rq.wants) return `${DEFS[rq.wants].emoji} ${DEFS[rq.wants].name} ${rq.stack.length} / ${rq.need}`;
  return `${rq.stack.length} / ${rq.need}`;
}
function reqReward(rq){
  if (rq.rewardText) return rq.rewardText;
  if (rq.reward && DEFS[rq.reward]) return `보상 ${DEFS[rq.reward].emoji} ${DEFS[rq.reward].name}`;
  if (rq.goal === 'fullHp') return '보상: 허기짐 해결';
  if (rq.goal === 'equip') return '보상 없음';
  if (rq.reward && DEFS[rq.reward]) return `보상 ${DEFS[rq.reward].emoji} ${DEFS[rq.reward].name}`;
  return '보상 📦';
}

// ── 기사의 퀘스트 ─────────────────────────────────────
//   stage 0: 시작 (빈사) → "..." → 뼛가루의 치유력
//   stage 2: 뼛가루 완료 (허기짐) → "배고파" → 밥이 보약
//   stage 3: 밥이 보약 완료 (빈사 해결) → 칼을 들어라
//   stage 4: 칼을 들어라 완료
let knightSpeech = null, knightTimer = null;
function repaint(type){
  if (drag) return;
  const c = S.cards.find(o => o.type === type);
  const el = c && els.get(c.id);
  if (el) paint(el, c);
}
function knightSay(text, done){
  enqueueTalk('knight', [{ text, done }]);
}
function knightLine(k){
  const st = statusOf(k);
  if (st.includes('빈사')) return '...';
  if (st.includes('허기짐')) return '배고파';
  return null;
}
const questExists = q => S.cards.some(c => c.type === 'request' && c.quest === q);
function giveKnightQuest(kind){
  const k = S.cards.find(c => c.type === 'knight');
  if (!k) return;
  const p = findSpot(k.x - CW * 1.1, k.y);
  const spec = {
    bone:  { quest: 'bonepowder', title: '뼛가루의 치유력', wants: 'marrow', need: 2, stack: [], rewardText: '보상: 빈사 → 허기짐' },
    food:  { quest: 'foodmedicine', title: '밥이 보약', goal: 'fullHp', target: k.id, need: 0, stack: [], reward: 'hilt' },
    sword: { quest: 'takesword', title: '칼을 들어라', goal: 'equip', slot: '칼', target: k.id, need: 0, stack: [] },
  }[kind];
  const rq = addCard('request', p.x, p.y, Object.assign({ giver: k.id }, spec));
  popFrom.set(rq.id, { x: k.x, y: k.y });                   // 기사에게서 튀어나옴
  bumpIds.add(k.id);
  save();
  renderAll();
}
function knightCheck(){
  if (!S || isTalking('knight') || drag || tear || busy) return;
  const k = S.cards.find(c => c.type === 'knight');
  if (!k) return;
  const stage = S.flags.knightStage || 0;
  if (stage === 0){
    if (!statusOf(k).includes('빈사')) return;
    S.flags.knightStage = 1;
    save();
    knightSay('...', knightCheck);                           // 대사 끝나고 request
    return;
  }
  if (stage === 1 && !questExists('bonepowder')) giveKnightQuest('bone');
  if (stage === 2 && !questExists('foodmedicine')) giveKnightQuest('food');
  if (stage === 3 && !questExists('takesword')) giveKnightQuest('sword');
}

// ── 판정: 대상 + 올리는 카드 ──────────────────────────
function evaluate(d, t){
  const dd = DEFS[d.type], td = DEFS[t.type];
  if (dd.kind === 'character' && tagLevel(td, '장소')) return { act: 'visit' };   // 방문
  const edible = tagLevel(dd, '먹을 수 있음') || tagLevel(dd, '빈사 치유');
  if (td.kind === 'request'){
    if (t.goal === 'equip'){
      // 조건형 request에 맞는 장비를 놓으면 대상에게 장비한 것과 같음
      const tg = byId(t.target);
      return tg && tagLevel(dd, t.slot) ? { act: 'equip', slot: t.slot, onto: tg } : null;
    }
    if (t.goal === 'fullHp'){
      // 조건형 request에 음식을 내려놓으면 대상에게 먹인 것과 같음
      const tg = byId(t.target);
      return tg && edible ? { act: 'eat', feed: tg } : null;
    }
    if (t.goal || t.stack.length >= t.need) return null;      // 이미 다 참
    if (t.wants) return d.type === t.wants ? { act: 'submit' } : null;
    return submittable(dd) ? { act: 'submit' } : null;
  }
  if (td.kind === 'character'){
    // 캐릭터의 장비 칸(칼·방패)과 같은 태그를 가진 카드 → 장비
    const slot = (td.slots || []).find(sl => tagLevel(dd, sl));
    if (slot) return { act: 'equip', slot };
  }
  if (td.kind === 'character' && edible){
    // 이 캐릭터가 준 제출형 request가 이 카드를 원하면, 직접 먹여도 그 request에 들어감
    const into = S.cards.find(r => r.type === 'request' && r.giver === t.id && r.wants === d.type && r.stack.length < r.need);
    if (into) return { act: 'submit', into };
    return { act: 'eat' };
  }
  const ms = usableRecipes(d.type, t.type);
  if (!ms.length) return null;
  if (ms.length > 1) console.warn('[제작자 알림] 조합 겹침', d.type, t.type, ms.map(m => m.r.id));
  const m = ms[0];
  return { act: 'recipe', r: m.r, A: m.aIsX ? d : t, B: m.aIsX ? t : d };
}
function apply(ev, d, t){
  const dd = DEFS[d.type];
  if (ev.act === 'submit'){
    const rq = ev.into || t;
    removeCard(d.id);
    rq.stack.push(d.type);
    rq.z = ++S.z;
    bumpIds.add(rq.id);
    if (ev.into) bumpIds.add(t.id);
    return true;
  }
  if (ev.act === 'visit'){
    d.visit = t.id;                     // 방문: 장소와 선으로 이어지고 거리를 유지함
    bumpIds.add(t.id);
    toast(`📍 ${dd.name} → ${DEFS[t.type].name} 방문`);
    return true;
  }
  if (ev.act === 'equip'){
    if (ev.onto){ bumpIds.add(t.id); t = ev.onto; }            // request에 놓음 → 대상에게 장비
    const slot = ev.slot;
    t.equip = t.equip || {};
    const prev = t.equip[slot];
    removeCard(d.id);
    t.equip[slot] = d.type;
    bumpIds.add(t.id);
    toast(`⚔ ${DEFS[t.type].name}: ${DEFS[d.type].name} 장비 (${slot})`);
    if (prev && DEFS[prev]){
      // 같은 칸에 다른 장비가 올라오면 이전 장비는 방출
      const p = findSpot(t.x + CW * 1.1, t.y + CH * 0.3);
      const pc = addCard(prev, p.x, p.y, null, true);
      spawned.delete(pc.id);
      popFrom.set(pc.id, { x: t.x, y: t.y });
      toast(`↩ ${DEFS[prev].name} 방출`);
    }
    return true;
  }
  if (ev.act === 'eat'){
    if (ev.feed){ bumpIds.add(t.id); t = ev.feed; }              // request에 내려놓음 → 대상에게 먹임
    const max = DEFS[t.type].hp;
    const talk = () => { if (t.type === 'knight' && !isTalking('knight') && knightLine(t)) knightSay(knightLine(t)); };
    if (statusOf(t).includes('빈사')){
      // 빈사는 빈사 치유 아이템으로만 해결 → 허기짐
      if (!tagLevel(dd, '빈사 치유')){ toast('빈사 상태 — 빈사 치유가 필요함'); talk(); return false; }
      setStatus(t, ['빈사'], ['허기짐']);
      removeCard(d.id);
      bumpIds.add(t.id);
      toast(`💊 ${DEFS[t.type].name}: 빈사 → 허기짐`);
      return true;
    }
    const heal = healOf(dd);
    if (heal <= 0){ toast('효과 없음'); return false; }
    if (t.hp >= max){ toast('체력이 가득함'); return false; }
    t.hp = Math.min(max, t.hp + heal);
    removeCard(d.id);
    bumpIds.add(t.id);
    // 허기짐은 체력을 최대치까지 채우면 해결
    if (t.hp >= max && statusOf(t).includes('허기짐')){
      setStatus(t, ['허기짐'], []);
      toast(`🍽️ ${DEFS[t.type].name}: 허기짐 해결`);
    } else {
      talk();
    }
    return true;
  }
  if (ev.act === 'recipe'){
    const { r, A, B } = ev;
    const bx = t.x, by = t.y;
    if (r.cook){
      // 날것 태그가 떨어지고 익힘 태그가 붙음 → 익힌 카드로 바뀜
      B.type = DEFS[B.type].cooked;
      markSeen(B.type);
      spawned.add(B.id);
      bumpIds.add(A.id);
      relocate(d);
    } else {
      const consumed = [];
      if (r.keep !== 'a') consumed.push(A);
      if (r.keep !== 'b') consumed.push(B);
      const targetKept = !consumed.includes(t);
      for (const c of consumed) removeCard(c.id);
      for (const o of (r.out || [])){
        const p = findSpot(targetKept ? bx + CW * 0.9 : bx, by);
        addCard(o, p.x, p.y);
      }
      if (targetKept) bumpIds.add(t.id);
      if (!consumed.includes(d)) relocate(d);
      if (r.burn) toast(`🔥 ${DEFS[B.type].name} 태우기 → 🌫️ 재`);
    }
    if (!S.found.includes(r.id)){
      S.found.push(r.id);
      toast('✨ 새 조합: ' + recipeText(r));
      if (!S.flags.discovered){
        S.flags.discovered = true;
        say(LINES.firstDiscovery);
      } else {
        sayMaybe(LINES.discover);
      }
    }
    return true;
  }
  return false;
}

// 조합 규칙 점검 — 겹치거나 빠진 게 있으면 제작자에게 알림
function validateRecipes(){
  const issues = [];
  const types = Object.keys(DEFS);
  for (const id of types){
    const d = DEFS[id];
    if (tagLevel(d, '날것') && tagLevel(d, '익힘')) issues.push(`${d.name}: 날것과 익힘은 상극인데 둘 다 붙어 있음`);
  }
  for (let i = 0; i < types.length; i++){
    for (let j = i; j < types.length; j++){
      const ms = recipesFor(types[i], types[j]);
      for (const m of ms){
        if (!m.r.cook) continue;
        const raw = m.aIsX ? types[j] : types[i];
        if (!DEFS[raw].cooked) issues.push(`${DEFS[raw].name}: 날것인데 익힌 결과(cooked)가 없음`);
      }
      const ids = [...new Set(ms.map(m => m.r.id))];
      if (ids.length > 1) issues.push(`${DEFS[types[i]].name} + ${DEFS[types[j]].name}: 조합 겹침 (${ids.join(', ')}) — 하나를 해소해야 함`);
    }
  }
  const uniq = [...new Set(issues)];
  if (!uniq.length) return;
  console.warn('[제작자 알림] 조합 규칙 문제', uniq);
  devnote.innerHTML = '<b>⚠ 제작자 알림 · 조합 규칙</b><br>' + uniq.map(esc).join('<br>');
  devnote.hidden = false;
}

// ── 변화 후 처리 ──────────────────────────────────────
function afterChange(){
  checkSettle();
  save();
  renderAll();
  scheduleGod();
}
function checkSettle(){
  for (const rq of S.cards){
    if (rq.type !== 'request') continue;
    if (reqDone(rq) && !settling.has(rq.id)){
      settling.add(rq.id);
      const id = rq.id;
      setTimeout(() => settle(id), 420);
    }
  }
}
function settle(id){
  if (drag || tear || busy){ setTimeout(() => settle(id), 200); return; }
  settling.delete(id);
  const rq = byId(id);
  if (!rq || !reqDone(rq)) return;
  busy = true;
  const el = els.get(id);
  if (el) el.classList.add('gone');
  setTimeout(() => {
    const x = rq.x, y = rq.y;
    removeCard(id);                       // 정산: 제출물과 request 제거
    busy = false;
    rewardFor(rq, x, y);
    save();
    renderAll();
    scheduleGod();
  }, 300);
}

function rewardFor(rq, x, y){
  if (rq.quest === 'bonepowder'){
    const k = byId(rq.giver);
    if (k && statusOf(k).includes('빈사')) setStatus(k, ['빈사'], ['허기짐']);
    S.flags.knightStage = 2;
    knightSay('배고파', knightCheck);                      // 대사 끝나고 다음 request
    return;
  }
  if (rq.quest === 'foodmedicine'){
    const k = byId(rq.target);
    if (k) setStatus(k, ['빈사', '허기짐'], []);
    addCard('hilt', x, y);                                  // 칼자루가 먼저 보이고
    S.flags.knightStage = 3;
    toast('🩹 빈사 해결');
    knightSay('고맙다', knightCheck);                        // "고맙다" 뒤에 칼을 들어라
    return;
  }
  if (rq.quest === 'takesword'){
    S.flags.knightStage = 4;
    toast('⚔ 칼을 들었다');
    return;
  }
  addCard('package', x, y, { contents: 'tutorial' });
  say(pick(LINES.settle));
}

// ── 갓의 request 공급 ─────────────────────────────────
// 이미 발견한 조합 중에 지금 테이블에서 할 수 있는 게 있나
function anyKnownRecipe(){
  const cs = S.cards;
  for (let i = 0; i < cs.length; i++){
    for (let j = i + 1; j < cs.length; j++){
      if (usableRecipes(cs[i].type, cs[j].type).some(m => S.found.includes(m.r.id))) return true;
    }
  }
  return false;
}
function submittableCount(){
  return S.cards.filter(c => submittable(DEFS[c.type])).length;
}
function scheduleGod(){
  clearTimeout(godTimer);
  godTimer = setTimeout(godCheck, 1400);
}
// 갓이 지금 무엇을 줘야 하나: null | 'request' | 'package'
function decideGift(){
  const has = type => S.cards.some(c => c.type === type);
  if (!has('god') || has('package')) return null;
  const avail = submittableCount();
  const requests = S.cards.filter(c => c.type === 'request' && isGodRequest(c));
  if (requests.length){
    // request 3개를 달성할 수 없으면 package로 보태줌. request는 그대로 둠
    return requests.some(rq => rq.stack.length + avail >= rq.need) ? null : 'package';
  }
  // 첫 발견 뒤엔 플레이어가 아는 조합으로 할 게 없을 때만
  if (S.flags.discovered && anyKnownRecipe()) return null;
  return avail >= 3 ? 'request' : 'package';
}
function godCheck(){
  knightCheck();
  if (gift) return;                                          // 이미 줄 게 정해져 멘트 중
  if (drag || tear || busy || settling.size){ scheduleGod(); return; }
  const kind = decideGift();
  if (!kind) return;
  gift = { kind };
  const hasRequest = S.cards.some(c => c.type === 'request' && isGodRequest(c));
  if (kind === 'package') say(hasRequest ? pick(LINES.rescue) : LINES.free);
  else if (S.flags.discovered) say(pick(LINES.stuck));
  else if (S.flags.requestsGiven) say(pick(LINES.again));
  else say(LINES.firstRequest);
  afterSpeech(deliverGift);                                   // 멘트를 다 끝낸 다음 줌
}
function deliverGift(){
  if (!gift) return;
  if (drag || tear || busy || settling.size){ setTimeout(deliverGift, 200); return; }
  const kind = gift.kind;
  gift = null;
  if (decideGift() !== kind){ scheduleGod(); return; }       // 멘트 동안 상황이 바뀜 → 취소 후 다시 판단
  const god = S.cards.find(c => c.type === 'god');
  const p = findSpot(god.x + CW * 1.1, god.y);
  const c = kind === 'package'
    ? addCard('package', p.x, p.y, { contents: 'tutorial' })
    : addCard('request', p.x, p.y, { need: 3, stack: [], title: '아무거나 3개만 줘봐', giver: god.id });
  if (kind === 'request') S.flags.requestsGiven = (S.flags.requestsGiven || 0) + 1;
  popFrom.set(c.id, { x: god.x, y: god.y });                  // 갓에게서 튀어나옴
  bumpIds.add(god.id);
  save();
  renderAll();
  scheduleGod();
}

// ── package 오픈 ──────────────────────────────────────
const tearLen = () => CW * 0.9;
// 택 = 좌상단 삼각형. 뜯긴 선은 들쭉날쭉
const tabSize = () => ({ tw: CW * 0.36, th: CH * 0.27 });
// (x1,y1) → (x2,y2) 사이 들쭉날쭉한 점들 (양 끝점 제외). 모양은 고정이라 매 프레임 흔들리지 않음
function jagLine(x1, y1, x2, y2, n, amp, seed){
  const pts = [];
  const len = Math.hypot(x2 - x1, y2 - y1) || 1;
  const nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
  for (let i = 1; i < n; i++){
    const t = i / n;
    const a = ((((i * 7 + seed) % 5) / 4) - 0.5) * 2 * amp;
    pts.push([x1 + (x2 - x1) * t + nx * a, y1 + (y2 - y1) * t + ny * a]);
  }
  return pts;
}
const poly = pts => 'polygon(' + pts.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(', ') + ')';
const tearEdge = () => { const { tw, th } = tabSize(); return jagLine(tw, 0, 0, th, 9, 2.2, 3); };
// 모서리가 뜯겨 나간 카드 모양
function cardMinusTab(){
  const { tw, th } = tabSize();
  return [[tw, 0], [CW, 0], [CW, CH], [0, CH], [0, th], ...tearEdge().reverse()];
}
function startPeel(){
  const c = byId(tear.id);
  const { tw, th } = tabSize();
  const piece = document.createElement('div');
  piece.className = 'tab-piece';
  piece.style.left = c.x + 'px';
  piece.style.top = c.y + 'px';
  piece.style.width = tw + 'px';
  piece.style.height = th + 'px';
  piece.style.clipPath = poly([[0, 0], [tw, 0], ...tearEdge(), [0, th]]);
  piece.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M100 0 L0 100"/></svg>';
  table.appendChild(piece);
  tear.piece = piece;
  if (tear.tab) tear.tab.style.visibility = 'hidden';
  tear.el.style.clipPath = poly(cardMinusTab());     // 카드의 모서리가 뜯겨 나감
}
function updateTear(px, py){
  const dx = px - tear.sx, dy = py - tear.sy;
  const dist = Math.hypot(dx, dy);
  tear.dist = dist;
  if (!tear.piece && dist > 3) startPeel();
  if (!tear.piece) return;
  const k = Math.min(1, dist / tearLen());
  const ux = dist ? dx / dist : 0, uy = dist ? dy / dist : 0;
  // 가까울 땐 카드에 붙어 버티고, 멀어질수록 떨어짐 (고무줄처럼)
  const off = dist * Math.pow(k, 1.8);
  tear.ux = ux; tear.uy = uy; tear.off = off;
  tear.piece.style.transform = `translate(${ux * off}px, ${uy * off}px) rotate(${-k * 28}deg)`;
  // 카드는 당기는 쪽으로 살짝 끌려옴
  const tug = k * CW * 0.05;
  tear.el.style.transform = `translate(${ux * tug}px, ${uy * tug}px) rotate(${k * 3}deg)`;
  tear.el.classList.toggle('ready', k >= 1);
  tear.piece.classList.toggle('ready', k >= 1);
}
function endTear(){
  const t = tear;
  tear = null;
  t.el.classList.remove('peeling', 'ready');
  if (t.piece && t.dist >= tearLen()){ openPackage(t.id, t); return; }
  // 기준 길이 미만 → 택이 제자리로 붙음
  busy = true;
  t.el.style.transition = 'transform .2s';
  t.el.style.transform = '';
  if (t.piece){
    t.piece.style.transition = 'transform .2s';
    t.piece.style.transform = '';
  }
  setTimeout(() => {
    t.el.style.transition = '';
    t.el.style.clipPath = '';
    if (t.tab) t.tab.style.visibility = '';
    if (t.piece) t.piece.remove();
    busy = false;
  }, 220);
}
function openPackage(id, t){
  const c = byId(id);
  const el = els.get(id);
  if (!c || !el) return;
  busy = true;
  // 뜯긴 택 조각은 당긴 방향으로 날아가며 사라짐
  if (t && t.piece){
    const piece = t.piece;
    const far = (t.off || 0) + CW * 1.2;
    piece.style.transition = 'transform .45s ease-out, opacity .45s ease-out';
    requestAnimationFrame(() => {
      piece.style.transform = `translate(${(t.ux || 0) * far}px, ${(t.uy || 0) * far}px) rotate(-75deg)`;
      piece.style.opacity = '0';
    });
    setTimeout(() => piece.remove(), 480);
  }
  // 카드는 뜯긴 모서리를 가진 채 가운데가 들쭉날쭉 찢어져 둘로 갈라짐
  const { tw, th } = tabSize();
  const mid = CW / 2;
  const split = jagLine(mid + 2, 0, mid - 2, CH, 12, 3, 1);            // 위 → 아래
  const edgeBack = tearEdge().reverse();                               // (0,th) 쪽 → (tw,0) 쪽
  const left  = [[tw, 0], [mid + 2, 0], ...split, [mid - 2, CH], [0, CH], [0, th], ...edgeBack];
  const right = [[mid + 2, 0], [CW, 0], [CW, CH], [mid - 2, CH], ...split.slice().reverse()];
  for (const [side, pts] of [['l', left], ['r', right]]){
    const half = el.cloneNode(true);
    half.className = 'cw k-package half half-' + side;
    half.removeAttribute('data-id');
    half.style.transform = '';
    half.style.clipPath = poly(pts);
    half.style.zIndex = 2000000001;
    const tab = half.querySelector('.tab');
    if (tab) tab.remove();
    table.appendChild(half);
    setTimeout(() => half.remove(), 520);
  }
  el.style.visibility = 'hidden';
  setTimeout(() => {
    const cx = c.x, cy = c.y, contents = c.contents;
    removeCard(id);
    const list = [];
    if (contents === 'first') list.push('knight', 'god');
    list.push(...drawPool(5));
    const n = list.length, base = Math.random() * Math.PI * 2;
    list.forEach((type, i) => {
      if (phys){
        // 중앙에 놓고 바깥쪽으로 튕겨냄 → 날아가며 서로 밀어냄
        const nc = addCard(type, cx + (Math.random() - 0.5) * 6, cy + (Math.random() - 0.5) * 6);
        const ang = base + (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
        const speed = CW * 1.9 * (1 - DAMP) * (0.8 + Math.random() * 0.4);   // 이동 거리 ≈ 예전의 2배
        vel.set(nc.id, { x: Math.cos(ang) * speed, y: Math.sin(ang) * speed * 0.9 });
      } else {
        // 물리 꺼짐: 2배 넓게 자리 잡고 중앙에서 튀어나오는 연출만
        const p = findSpot(cx, cy, 2);
        const nc = addCard(type, p.x, p.y);
        spawned.delete(nc.id);
        popFrom.set(nc.id, { x: cx, y: cy });
      }
    });
    busy = false;
    if (contents === 'first') say(LINES.intro);
    save();
    renderAll();
    scheduleGod();
  }, 260);
}

// ── 포인터 ────────────────────────────────────────────
function localPoint(e){
  const r = table.getBoundingClientRect();
  return { px: e.clientX - r.left, py: e.clientY - r.top };
}
function onDown(e){
  if (drag || tear || busy) return;
  const cardEl = e.target.closest('.cw');
  if (!cardEl || cardEl.classList.contains('half')) return;
  const c = byId(+cardEl.dataset.id);
  if (!c) return;
  e.preventDefault();
  const { px, py } = localPoint(e);

  // request 위에 쌓인 카드 꺼내기
  const mini = e.target.closest('.mini');
  if (mini && c.type === 'request'){
    if (settling.has(c.id)) return;
    const idx = +mini.dataset.idx;
    const type = c.stack.splice(idx, 1)[0];
    if (!type) return;
    const nc = addCard(type, px - CW / 2, py - CH / 2, null, true);
    spawned.delete(nc.id);
    renderAll();
    startDrag(nc, px, py, e.pointerId, { ox: c.x, oy: c.y, fromRequest: c.id });
    return;
  }

  // 장비 칸에서 장비 끌어내기
  const eqEl = e.target.closest('.equip span[data-slot]');
  if (eqEl && c.equip){
    const slot = eqEl.dataset.slot;
    const type = c.equip[slot];
    if (!type) return;
    delete c.equip[slot];
    const nc = addCard(type, px - CW / 2, py - CH / 2, null, true);
    spawned.delete(nc.id);
    renderAll();
    startDrag(nc, px, py, e.pointerId, { ox: c.x, oy: c.y, fromEquip: { id: c.id, slot } });
    return;
  }

  // package 택 당기기
  if (c.type === 'package' && e.target.closest('.tab')){
    tear = { id: c.id, sx: px, sy: py, el: cardEl, tab: cardEl.querySelector('.tab'), pid: e.pointerId, dist: 0 };
    cardEl.classList.add('peeling');
    return;
  }

  startDrag(c, px, py, e.pointerId, { ox: c.x, oy: c.y });
}
function startDrag(c, px, py, pid, o){
  c.z = ++S.z;
  const el = els.get(c.id);
  if (!el) return;
  drag = {
    id: c.id, pid, el,
    offX: px - c.x, offY: py - c.y,
    sx: px, sy: py,
    moved: !!(o.fromRequest || o.fromEquip),
    ox: o.ox, oy: o.oy,
    fromRequest: o.fromRequest || null,
    fromEquip: o.fromEquip || null,
    target: null,
  };
  el.style.zIndex = 2000000000;
  el.classList.add('dragging');
}
// 대상 고르기: 끌고 있는 카드와 겹친 넓이로 판단 (포인터 아래만 보던 v0.7.0보다 넓음)
//   카드 넓이의 15% 이상 겹친 카드 중에서, 되는 조합이면 2배 가산해 가장 점수 높은 카드
//   겹친 카드가 없으면 포인터 아래 카드
function pickTarget(clientX, clientY, c){
  let best = null, bestScore = 0;
  const minArea = CW * CH * 0.15;
  for (const o of S.cards){
    if (o.id === c.id) continue;
    const ox = Math.min(c.x, o.x) + CW - Math.max(c.x, o.x);
    const oy = Math.min(c.y, o.y) + CH - Math.max(c.y, o.y);
    if (ox <= 0 || oy <= 0) continue;
    const area = ox * oy;
    if (area < minArea) continue;
    const score = area * (evaluate(c, o) ? 2 : 1);
    if (score > bestScore){ bestScore = score; best = o; }
  }
  if (best) return best;
  for (const h of document.elementsFromPoint(clientX, clientY)){
    const ce = h.closest ? h.closest('.cw') : null;
    if (ce && !ce.classList.contains('half') && +ce.dataset.id !== c.id){
      const t = byId(+ce.dataset.id);
      if (t) return t;
    }
  }
  return null;
}
function clearTarget(){
  if (drag && drag.target){
    const el = els.get(drag.target.id);
    if (el) el.classList.remove('is-target', 'no');
    drag.target = null;
  }
}
function setTarget(t, c){
  if (drag.target && t && drag.target.id === t.id) return;
  clearTarget();
  if (!t) return;
  drag.target = t;
  const el = els.get(t.id);
  if (!el) return;
  el.classList.add('is-target');
  if (!evaluate(c, t)) el.classList.add('no');
}
function onMove(e){
  if (tear && e.pointerId === tear.pid){
    const { px, py } = localPoint(e);
    updateTear(px, py);
    return;
  }
  if (!drag || e.pointerId !== drag.pid) return;
  const { px, py } = localPoint(e);
  if (!drag.moved && Math.hypot(px - drag.sx, py - drag.sy) < 4) return;
  drag.moved = true;
  const c = byId(drag.id);
  if (!c) return;
  const p = clampPos(px - drag.offX, py - drag.offY);
  c.x = p.x; c.y = p.y;
  drag.el.style.left = p.x + 'px';
  drag.el.style.top = p.y + 'px';
  setTarget(pickTarget(e.clientX, e.clientY, c), c);
}
function animateTo(el, x, y, done){
  busy = true;
  el.style.transition = 'left .22s ease-out, top .22s ease-out';
  requestAnimationFrame(() => {
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });
  setTimeout(() => {
    el.style.transition = '';
    busy = false;
    done();
  }, 240);
}
function bounce(c, d0){
  const el = els.get(c.id);
  sayMaybe(LINES.bounce);
  if (d0.fromEquip){
    const owner = byId(d0.fromEquip.id);
    const slot = d0.fromEquip.slot;
    if (owner && !(owner.equip && owner.equip[slot])){
      animateTo(el, owner.x, owner.y, () => {
        removeCard(c.id);
        owner.equip = owner.equip || {};
        owner.equip[slot] = c.type;
        afterChange();
      });
      return;
    }
  }
  if (d0.fromRequest){
    const rq = byId(d0.fromRequest);
    if (rq){
      animateTo(el, rq.x, rq.y, () => {
        removeCard(c.id);
        rq.stack.push(c.type);
        afterChange();
      });
      return;
    }
  }
  animateTo(el, d0.ox, d0.oy, () => {
    c.x = d0.ox; c.y = d0.oy;
    afterChange();
  });
}
function onUp(e){
  if (tear && e.pointerId === tear.pid){ endTear(); return; }
  if (!drag || e.pointerId !== drag.pid) return;
  const c = byId(drag.id);
  const t = drag.target;
  clearTarget();
  drag.el.classList.remove('dragging');
  const d0 = drag;
  drag = null;
  if (!c || !d0.moved){ renderAll(); return; }   // 탭: 아직 정의 안 됨
  if (t && byId(t.id)){
    const ev = evaluate(c, t);
    if (ev && apply(ev, c, t)){ afterChange(); return; }
    bounce(c, d0);                                // 쌓기 실패 → 되돌아감
    return;
  }
  afterChange();                                  // 빈 자리 → 이동
}

// ── 필드 상태 복사 (시스템 메뉴) ──────────────────────
function fieldSnapshot(){
  const { w, h } = tableSize();
  const nameOf = id => { const o = byId(id); return o ? `${DEFS[o.type].name}#${o.id}` : null; };
  return {
    version: VERSION,
    time: new Date().toISOString(),
    table: { w, h, cardW: CW, cardH: CH },
    physics: phys,
    cards: S.cards.map(c => {
      const d = DEFS[c.type];
      const o = { id: c.id, type: c.type, name: d.name, x: Math.round(c.x), y: Math.round(c.y) };
      const tags = tagsOf(c);
      if (COMBOABLE.has(c.type)) tags.unshift('조합 가능');
      if (tags.length) o.tags = tags;
      if (c.hp != null) o.hp = `${c.hp}/${d.hp}`;
      if (d.slots){
        o.equip = {};
        for (const sl of d.slots) o.equip[sl] = c.equip && c.equip[sl] ? DEFS[c.equip[sl]].name : null;
      }
      if (c.visit != null) o.visit = nameOf(c.visit);
      if (c.contents) o.contents = c.contents;
      if (c.type === 'request'){
        o.title = c.title;
        if (c.quest) o.quest = c.quest;
        o.giver = c.giver != null ? nameOf(c.giver) : null;
        o.progress = reqProgress(c);
        o.reward = reqReward(c);
        if (c.stack && c.stack.length) o.stack = c.stack.map(t => DEFS[t].name);
      }
      return o;
    }),
    seen: S.seen.map(t => DEFS[t].name),
    found: S.found,
    flags: S.flags,
  };
}
async function copyField(){
  const text = JSON.stringify(fieldSnapshot(), null, 2);
  try {
    await navigator.clipboard.writeText(text);
    toast('📋 필드 상태를 복사함');
  } catch (e) {
    // 클립보드 API가 막힌 환경 → 예전 방식으로 한 번 더
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
    if (ok) toast('📋 필드 상태를 복사함');
    else { toast('복사 실패 — 콘솔에 출력함'); console.log(text); }
  }
}

// ── 콜렉터북 (카드 아님) ──────────────────────────────
function openBook(){
  const seen = new Set(S.seen);
  const n = PAGE.ids.filter(id => seen.has(id)).length;
  let html = '<div class="book-panel"><div class="book-head"><div>';
  html += `<span class="eyebrow">콜렉터북</span><h2>${esc(PAGE.title)}<small>${n} / ${PAGE.ids.length}</small></h2>`;
  html += '</div><button class="btn btn-secondary btn-sm" data-close>닫기</button></div><div class="book-grid">';
  for (const id of PAGE.ids){
    const d = DEFS[id];
    html += seen.has(id)
      ? `<div class="slot"><div class="e">${d.emoji}</div><div class="n">${esc(d.name)}</div></div>`
      : '<div class="slot unseen"><div class="e">❔</div><div class="n">???</div></div>';
  }
  html += `</div><h3 class="book-sub">발견한 조합<small>${S.found.length} / ${RECIPES.length}</small></h3><ul class="recipes">`;
  for (const r of RECIPES){
    if (S.found.includes(r.id)){
      html += `<li>${esc(recipeText(r))}</li>`;
    } else {
      html += '<li class="unknown">??? + ??? → ???</li>';
    }
  }
  html += '</ul></div>';
  book.innerHTML = html;
  book.hidden = false;
}

// ── 밀어내기 (물리) ───────────────────────────────────
function velOf(id){
  let v = vel.get(id);
  if (!v){ v = { x: 0, y: 0 }; vel.set(id, v); }
  return v;
}
function physStep(){
  requestAnimationFrame(physStep);
  let moved = false;
  if (S && !busy){
    if (phys && physMove()) moved = true;
    if (solveTethers()) moved = true;          // 밀어내기 체크와 상관없이 항상
  }
  if (moved) physDirty = true;
  else if (physDirty && !drag){ physDirty = false; save(); }   // 멈추면 한 번 저장
  drawLinks();
}
// 연결: request ─ 발주자, 장소 ─ 방문한 캐릭터
//   일정 거리를 유지하며 밀리거나 끌려감 (막대처럼)
//   끌고 있는 카드에서 연결을 따라 퍼져나가며 차례로 끌려감 (사슬)
//   아무도 안 끌 때는 b쪽(request·방문자)이 제 거리로 천천히 돌아감
const tetherLen = () => CW * 1.6;              // 카드 중심 사이 거리. 밀어내기 간격보다 길게
function tetherLinks(){
  const out = [];
  for (const c of S.cards){
    if (c.type === 'request' && c.giver != null){
      const g = byId(c.giver);
      if (g) out.push({ a: g, b: c, kind: 'request' });
    }
    if (c.visit != null){
      const pl = byId(c.visit);
      if (pl) out.push({ a: pl, b: c, kind: 'visit' });
    }
  }
  return out;
}
function pullTo(anchor, mover, L, k){
  if (tear && (tear.id === anchor.id || tear.id === mover.id)) return false;
  let dx = mover.x - anchor.x, dy = mover.y - anchor.y;
  let d = Math.hypot(dx, dy);
  if (d < 0.001){ dx = 1; dy = 0; d = 1; }
  if (Math.abs(d - L) < 0.5) return false;
  const tx = anchor.x + dx / d * L, ty = anchor.y + dy / d * L;
  const p = clampPos(mover.x + (tx - mover.x) * k, mover.y + (ty - mover.y) * k);
  if (Math.abs(p.x - mover.x) < 0.05 && Math.abs(p.y - mover.y) < 0.05) return false;
  mover.x = p.x; mover.y = p.y;
  const el = els.get(mover.id);
  if (el){ el.style.left = mover.x + 'px'; el.style.top = mover.y + 'px'; }
  return true;
}
function solveTethers(){
  const L = tetherLen();
  const links = tetherLinks();
  const done = new Set();
  let moved = false;
  if (drag){
    const reached = new Set([drag.id]);
    const queue = [drag.id];
    while (queue.length){
      const id = queue.shift();
      for (const lk of links){
        if (done.has(lk)) continue;
        let from = null, to = null;
        if (lk.a.id === id && !reached.has(lk.b.id)){ from = lk.a; to = lk.b; }
        else if (lk.b.id === id && !reached.has(lk.a.id)){ from = lk.b; to = lk.a; }
        else continue;
        done.add(lk);
        reached.add(to.id);
        queue.push(to.id);
        if (pullTo(from, to, L, 1)) moved = true;
      }
    }
  }
  for (const lk of links){
    if (done.has(lk)) continue;
    if (drag && (lk.a.id === drag.id || lk.b.id === drag.id)) continue;
    if (pullTo(lk.a, lk.b, L, 0.2)) moved = true;
  }
  return moved;
}
// 선 그리기. 카드 중심끼리 잇고, 바뀐 게 있을 때만 다시 그림
let linksKey = '';
function drawLinks(){
  if (!S) return;
  let out = '';
  for (const lk of tetherLinks()){
    const x1 = Math.round(lk.a.x + CW / 2), y1 = Math.round(lk.a.y + CH / 2);
    const x2 = Math.round(lk.b.x + CW / 2), y2 = Math.round(lk.b.y + CH / 2);
    out += `<line class="${lk.kind}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  }
  if (out !== linksKey){ linksKey = out; links.innerHTML = out; }
}
function physMove(){
  // 드래그 중인 카드와 찢는 중인 package는 밀지도 밀리지도 않음 (대상 위에 놓을 수 있게)
  const cs = S.cards.filter(c => !(drag && c.id === drag.id) && !(tear && c.id === tear.id));
  const gapX = CW * 1.06, gapY = CH * 1.04;
  for (let i = 0; i < cs.length; i++){
    const a = cs[i];
    for (let j = i + 1; j < cs.length; j++){
      const b = cs[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const ox = gapX - Math.abs(dx), oy = gapY - Math.abs(dy);
      if (ox <= 0 || oy <= 0) continue;
      const va = velOf(a.id), vb = velOf(b.id);
      if (ox < oy){
        const f = ox * PUSH * (dx < 0 ? -1 : 1);
        va.x -= f; vb.x += f;
      } else {
        const f = oy * PUSH * (dy < 0 ? -1 : 1);
        va.y -= f; vb.y += f;
      }
    }
  }
  let moving = false;
  for (const c of cs){
    const v = vel.get(c.id);
    if (!v) continue;
    if (Math.abs(v.x) < 0.02 && Math.abs(v.y) < 0.02){ vel.delete(c.id); continue; }
    const nx = c.x + v.x, ny = c.y + v.y;
    const p = clampPos(nx, ny);
    if (p.x !== nx) v.x = 0;                       // 벽에 닿으면 그 방향 속도 0
    if (p.y !== ny) v.y = 0;
    c.x = p.x; c.y = p.y;
    v.x *= DAMP; v.y *= DAMP;
    const el = els.get(c.id);
    if (el){ el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; }
    moving = true;
  }
  return moving;
}
const physToggle = document.getElementById('physToggle');
physToggle.checked = phys;
physToggle.addEventListener('change', () => {
  phys = physToggle.checked;
  if (!phys){ vel.clear(); save(); }
  try { localStorage.setItem(SETTINGS, JSON.stringify({ physics: phys })); } catch (e) {}
});

// ── 연결 ──────────────────────────────────────────────
table.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
document.getElementById('bookBtn').addEventListener('click', openBook);
document.getElementById('copyBtn').addEventListener('click', copyField);
book.addEventListener('click', e => {
  if (e.target === book || e.target.closest('[data-close]')) book.hidden = true;
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('처음부터 다시 시작할까? 콜렉션 기록도 지워짐.')) return;
  try { localStorage.removeItem(STORE); } catch (e) {}
  clearTimeout(godTimer);
  clearTimeout(talkTimer);
  talkTimer = null; talking = null; talkQ.god = []; talkQ.knight = [];
  speech = null; knightSpeech = null;
  gift = null; speechWaiters = [];
  settling.clear();
  drag = null; tear = null; busy = false;
  for (const el of els.values()) el.remove();
  els.clear();
  newGame();
});
window.addEventListener('resize', () => {
  measure();
  for (const c of S.cards){
    const p = clampPos(c.x, c.y);
    c.x = p.x; c.y = p.y;
  }
  renderAll();
});

validateRecipes();
(() => {
  const types = Object.keys(DEFS);
  for (const x of types) for (const y of types){
    if (usableRecipes(x, y).length){ COMBOABLE.add(x); COMBOABLE.add(y); }
  }
})();

// 고착 점검 안전망 — 상태 변화 없이도 주기적으로 한 번씩 본다
setInterval(() => { if (!drag && !tear && !busy) godCheck(); }, 5000);

measure();
if (load()){
  for (const c of S.cards){
    const p = clampPos(c.x, c.y);
    c.x = p.x; c.y = p.y;
  }
  checkSettle();
  renderAll();
  scheduleGod();
} else {
  newGame();
}
requestAnimationFrame(physStep);
})();
