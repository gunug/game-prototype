// ── package 오픈 ──────────────────────────────────────
const tearLen = () => CW * 0.9;
// 택 = 좌상단 삼각형. 뜯긴 선은 들쭉날쭉
const tabSize = () => ({ tw: CW * 0.36, th: CH * 0.27 });
// (x1,y1) → (x2,y2) 사이 들쭉날쭉한 점들 (양 끝점 제외). 모양은 고정이라 매 프레임 흔들리지 않음
function jagLine(x1, y1, x2, y2, n, amp, seed){
  const pts = [];
  const len = Math.hypot(x2 - x1, y2 - y1) || 1;
  const nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
  for (let i = 1; i < n; i++){
    const t = i / n;
    const a = ((((i * 7 + seed) % 5) / 4) - 0.5) * 2 * amp;
    pts.push([x1 + (x2 - x1) * t + nx * a, y1 + (y2 - y1) * t + ny * a]);
  }
  return pts;
}
const poly = pts => 'polygon(' + pts.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(', ') + ')';
const tearEdge = () => { const { tw, th } = tabSize(); return jagLine(tw, 0, 0, th, 9, 2.2, 3); };
// 모서리가 뜯겨 나간 카드 모양
function cardMinusTab(){
  const { tw, th } = tabSize();
  return [[tw, 0], [CW, 0], [CW, CH], [0, CH], [0, th], ...tearEdge().reverse()];
}
function startPeel(){
  const c = byId(tear.id);
  const { tw, th } = tabSize();
  const piece = document.createElement('div');
  piece.className = 'tab-piece';
  piece.style.left = c.x + 'px';
  piece.style.top = c.y + 'px';
  piece.style.width = tw + 'px';
  piece.style.height = th + 'px';
  piece.style.clipPath = poly([[0, 0], [tw, 0], ...tearEdge(), [0, th]]);
  piece.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M100 0 L0 100"/></svg>';
  table.appendChild(piece);
  tear.piece = piece;
  if (tear.tab) tear.tab.style.visibility = 'hidden';
  tear.el.style.clipPath = poly(cardMinusTab());     // 카드의 모서리가 뜯겨 나감
}
function updateTear(px, py){
  const dx = px - tear.sx, dy = py - tear.sy;
  const dist = Math.hypot(dx, dy);
  tear.dist = dist;
  if (tear.sweep){
    // container 택: 당기는 쪽으로 늘어나기만 하고 찢어지지 않음
    const k = Math.min(1, dist / tearLen());
    const ux = dist ? dx / dist : 0, uy = dist ? dy / dist : 0;
    const off = Math.min(dist, tearLen()) * 0.35;
    if (tear.tab) tear.tab.style.transform = `translate(${ux * off}px, ${uy * off}px)`;
    const tug = k * CW * 0.05;
    tear.el.style.transform = `translate(${ux * tug}px, ${uy * tug}px)`;
    tear.el.classList.toggle('ready', k >= 1);
    return;
  }
  if (!tear.piece && dist > 3) startPeel();
  if (!tear.piece) return;
  const k = Math.min(1, dist / tearLen());
  const ux = dist ? dx / dist : 0, uy = dist ? dy / dist : 0;
  // 가까울 땐 카드에 붙어 버티고, 멀어질수록 떨어짐 (고무줄처럼)
  const off = dist * Math.pow(k, 1.8);
  tear.ux = ux; tear.uy = uy; tear.off = off;
  tear.piece.style.transform = `translate(${ux * off}px, ${uy * off}px) rotate(${-k * 28}deg)`;
  // 카드는 당기는 쪽으로 살짝 끌려옴
  const tug = k * CW * 0.05;
  tear.el.style.transform = `translate(${ux * tug}px, ${uy * tug}px) rotate(${k * 3}deg)`;
  tear.el.classList.toggle('ready', k >= 1);
  tear.piece.classList.toggle('ready', k >= 1);
}
function endTear(){
  const t = tear;
  tear = null;
  t.el.classList.remove('peeling', 'ready');
  if (t.sweep){
    if (t.dist <= 3) setSelected(t.id);             // 택을 당기지 않고 뗌 = 탭 → 인스펙터
    busy = true;
    t.el.style.transition = 'transform .2s';
    t.el.style.transform = '';
    if (t.tab){ t.tab.style.transition = 'transform .2s'; t.tab.style.transform = ''; }
    setTimeout(() => {
      t.el.style.transition = '';
      if (t.tab) t.tab.style.transition = '';
      busy = false;
      if (t.dist >= tearLen()) (t.red ? pullRedTab : sweepInto)(t.id);   // 끝까지 당겼으면 붉은 택 = 정리·배출 / 택 = 쓸어담기
    }, 220);
    return;
  }
  if (t.piece && t.dist >= tearLen()){ openPackage(t.id, t); return; }
  // 기준 길이 미만 → 택이 제자리로 붙음
  if (!t.piece) setSelected(t.id);                 // 택을 당기지 않고 뗌 = 탭 → 인스펙터
  busy = true;
  t.el.style.transition = 'transform .2s';
  t.el.style.transform = '';
  if (t.piece){
    t.piece.style.transition = 'transform .2s';
    t.piece.style.transform = '';
  }
  setTimeout(() => {
    t.el.style.transition = '';
    t.el.style.clipPath = '';
    if (t.tab) t.tab.style.visibility = '';
    if (t.piece) t.piece.remove();
    busy = false;
  }, 220);
}
// ── container: 쓸어담기 ─────────────────────────────
//   담긴 카드가 있고, 자리가 남았고, 테이블에 같은 종류가 있으면 택이 깜빡임
const holdOf = c => DEFS[c.type].hold || 0;
const sweepable = c => !!c.fill && (c.count || 0) < holdOf(c) && S.cards.some(o => o.type === c.fill);
// 택을 끝까지 당겼다 놓으면: 테이블의 같은 종류 카드를 가까운 것부터 남은 자리만큼 빨아들임
function sweepInto(id){
  const c = byId(id);
  if (!c) return;
  const hold = holdOf(c);
  if (!c.fill){ toast('먼저 한 장 담아야 쓸어담을 수 있음'); return; }

    .sort((a, b) => Math.hypot(a.x - c.x, a.y - c.y) - Math.hypot(b.x - c.x, b.y - c.y))
    .slice(0, room);
  if (!picks.length){ toast(`쓸어담을 ${DEFS[c.fill].name} 없음`); return; }

  for (const o of picks){
    const el = els.get(o.id);
    if (!el) continue;
    el.style.zIndex = 1999998000;
    el.style.transition = 'left .32s ease-in, top .32s ease-in, transform .32s ease-in, opacity .32s ease-in';
    requestAnimationFrame(() => {
      el.style.left = c.x + 'px';
      el.style.top = c.y + 'px';
      el.style.transform = 'scale(.35)';
      el.style.opacity = '0';
    });
  }
  setTimeout(() => {
    for (const o of picks) removeCard(o.id);
    c.count = (c.count || 0) + picks.length;
    S.flags.swept = true;                                   // 마음의 평화 4단계
    bumpIds.add(c.id);
    busy = false;
    toast(`${ic(c.fill)} ${DEFS[c.fill].name} ${picks.length}장 쓸어담음 (${c.count}/${hold})`);
    afterChange();
  }, 340);
}
// ── 붉은 택 (v0.67.0) ────────────────────────────────
//   우상단 붉은 택을 끝까지 당겼다 놓으면
//   신의 입: 갓 "신중히 선택해…" → 확인 모달 → 월드 위 신의 입이 먹을 수 있는 카드 전부 빨아들임 (기록·삼킴·흡족 규칙 그대로)

// v0.74.0: 도구·무기·방패 태그 카드는 월드 정리로 빨려가지 않음 (직접 끌어다 넣으면 먹음)

const purgeTargets = () => S.cards.filter(o => mouthEats(o) && o.duel == null && o.dun == null && !(drag && drag.id === o.id)

function pullRedTab(id){

// v0.92.0: 무장해제 — 장비 칸의 카드를 전부 밖으로 배출 (장비는 끌어서 뺄 수 없고 이 방법뿐)

function ejectAll(id){

    spawned.delete(nc.id);

// 확인 · 취소 모달. 바깥을 누르거나 Esc = 취소
function confirmModal(text, onOk){
  const wrap = document.createElement('div');
  wrap.className = 'cmodal';
  wrap.innerHTML = `<div class="cm-box" role="dialog" aria-modal="true"><p>${esc(text)}</p>`
    + '<div class="cm-btns"><button type="button" class="btn cm-no">취소</button><button type="button" class="btn cm-ok">확인</button></div></div>';
  const key = e => { if (e.key === 'Escape') close(false); };
  function close(ok){
    wrap.remove();
    document.removeEventListener('keydown', key);
    if (ok) onOk();
  }
  wrap.addEventListener('pointerdown', e => { e.stopPropagation(); if (e.target === wrap) close(false); });
  wrap.querySelector('.cm-no').addEventListener('click', () => close(false));
  wrap.querySelector('.cm-ok').addEventListener('click', () => close(true));
  document.addEventListener('keydown', key);
  document.body.appendChild(wrap);
  wrap.querySelector('.cm-no').focus();
}

function cutTrappedTalk(){

function openPackage(id, t){

  const edgeBack = tearEdge().reverse();                               // (0,th) 쪽 → (tw,0) 쪽
  const left  = [[tw, 0], [mid + 2, 0], ...split, [mid - 2, CH], [0, CH], [0, th], ...edgeBack];

      if (looseCount(ty) + pending[ty] >= SPAWN_CAP){ omitted.push(ty); continue; }   // 월드에 5장이면 생성 안 됨
      pending[ty]++;

    omitToast(omitted);
    const n = list.length, base = Math.random() * Math.PI * 2;

      if (phys){

        const nc = addCard(type, cx + (Math.random() - 0.5) * 6, cy + (Math.random() - 0.5) * 6);
        const ang = base + (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
        const speed = CW * 1.9 * (1 - DAMP) * (0.8 + Math.random() * 0.4);   // 이동 거리 ≈ 예전의 2배
        vel.set(nc.id, { x: Math.cos(ang) * speed, y: Math.sin(ang) * speed * 0.9 });
      } else {

        const p = findSpot(cx, cy, 2);

// ── 포인터 ────────────────────────────────────────────
function localPoint(e){
  const r = table.getBoundingClientRect();
  return { px: e.clientX - r.left, py: e.clientY - r.top };
}
function onDown(e){
  if (!e.target.closest('.cw')){ if (!drag && !tear) setSelected(null); return; }   // 빈 테이블 탭 → 인스펙터 비움
  if (paused || drag || tear || busy || returning) return;
  const cardEl = e.target.closest('.cw');
  if (!cardEl || cardEl.classList.contains('half')) return;
  const c = byId(+cardEl.dataset.id);
  if (!c) return;
  e.preventDefault();
  if (c.duel != null || bodyOf(c).duel != null){ setSelected(c.id); return; }   // 대결 중엔 못 움직임
  if (c.dun != null){ setSelected(c.id); return; }                              // v0.90.0: 던전 안 크리처는 못 움직임
  const { px, py } = localPoint(e);

  // quest 위에 쌓인 카드 꺼내기
  const mini = e.target.closest('.mini');
  if (mini && c.type === 'quest'){
    if (settling.has(c.id)) return;
    const idx = +mini.dataset.idx;
    const type = c.stack.splice(idx, 1)[0];
    if (!type) return;
    const nc = addCard(type, px - CW / 2, py - CH / 2, null, true);
    spawned.delete(nc.id);
    renderAll();
    startDrag(nc, px, py, e.pointerId, { ox: c.x, oy: c.y, fromRequest: c.id });
    return;
  }

  // container에서 한 장 꺼내기
  const heldEl = e.target.closest('.held[data-held]');
  if (heldEl && c.fill && c.count > 0){
    const type = c.fill;
    c.count--;
    if (!c.count) delete c.fill;
    const nc = addCard(type, px - CW / 2, py - CH / 2, null, true);
    spawned.delete(nc.id);
    renderAll();
    startDrag(nc, px, py, e.pointerId, { ox: c.x, oy: c.y, fromContainer: c.id });
    return;
  }

  // 신의 입 기록에서 한 장 꺼내기 (기록 중 아무거나)
  const eatEl = e.target.closest('[data-eat]');
  if (eatEl && c.eaten){
    const idx = +eatEl.dataset.eat;
    const rec = c.eaten.splice(idx, 1)[0];
    if (!rec || !DEFS[rec.type]) return;
    S.flags.mouthTook = true;                               // v0.84.0: 신의 입 quest 2단계
    const nc = addCard(rec.type, px - CW / 2, py - CH / 2, rec, true);
    spawned.delete(nc.id);
    renderAll();
    startDrag(nc, px, py, e.pointerId, { ox: c.x, oy: c.y, fromMouth: { id: c.id, idx } });
    return;
  }

  // 붉은 택 당기기 (v0.67.0): 신의 입 = 월드 정리, container = 배출 (찢어지지 않음)
  if ((DEFS[c.type].kind === 'container' || DEFS[c.type].devour || DEFS[c.type].slots) && e.target.closest('.rtab')){
    tear = { id: c.id, sx: px, sy: py, el: cardEl, tab: cardEl.querySelector('.rtab'), pid: e.pointerId, dist: 0, sweep: true, red: true };
    return;
  }

  // container 택 당기기 = 쓸어담기 (찢어지지 않음)
  if (DEFS[c.type].kind === 'container' && e.target.closest('.tab')){
    tear = { id: c.id, sx: px, sy: py, el: cardEl, tab: cardEl.querySelector('.tab'), pid: e.pointerId, dist: 0, sweep: true };
    return;
  }

  // package 택 당기기
  if (DEFS[c.type].kind === 'package' && e.target.closest('.tab')){
    tear = { id: c.id, sx: px, sy: py, el: cardEl, tab: cardEl.querySelector('.tab'), pid: e.pointerId, dist: 0 };
    cardEl.classList.add('peeling');
    return;
  }

  startDrag(c, px, py, e.pointerId, { ox: c.x, oy: c.y });
}
// 붙음·방문으로 이어진 카드 전부 (사슬 포함)
function linkedGroup(c){
  const ids = new Set([c.id]);
  const queue = [c];
  while (queue.length){
    const x = queue.shift();
    for (const m of S.cards){
      if (ids.has(m.id)) continue;
      if (bodyOf(m) === bodyOf(x) || m.visit === x.id || x.visit === m.id || m.dun === x.id || x.dun === m.id){
        ids.add(m.id);
        queue.push(m);
      }
    }
  }
  return ids;
}
function startDrag(c, px, py, pid, o){
  // 붙음·방문으로 이어진 카드는 끌고 있는 카드와 함께 맨 위로 (서로의 앞뒤 순서는 유지)
  const group = linkedGroup(c);
  const members = S.cards.filter(m => m.id !== c.id && group.has(m.id)).sort((a, b) => a.z - b.z);
  members.forEach((m, i) => {
    m.z = ++S.z;
    const me = els.get(m.id);
    if (me) me.style.zIndex = 1999999000 + i;
  });
  c.z = ++S.z;
  const el = els.get(c.id);
  if (!el) return;
  drag = {
    id: c.id, pid, el,
    offX: px - c.x, offY: py - c.y,
    sx: px, sy: py,
    moved: !!(o.fromRequest || o.fromContainer || o.fromMouth),
    ox: o.ox, oy: o.oy,
    fromRequest: o.fromRequest || null,
    fromContainer: o.fromContainer || null,
    fromMouth: o.fromMouth || null,
    target: null,
  };
  el.style.zIndex = 2000000000;
  el.classList.add('dragging');
}
// 대상 고르기: 끌고 있는 카드와 겹친 넓이로 판단 (포인터 아래만 보던 v0.7.0보다 넓음)
//   카드 넓이의 15% 이상 겹친 카드 중에서, 되는 조합이면 2배 가산해 가장 점수 높은 카드
//   겹친 카드가 없으면 포인터 아래 카드
function pickTarget(clientX, clientY, c){
  let best = null, bestScore = 0;
  const minArea = CW * CH * 0.15;
  for (const o of S.cards){
    if (o.id === c.id || bodyOf(o) === bodyOf(c)) continue;
    const ox = Math.min(c.x, o.x) + CW - Math.max(c.x, o.x);
    const oy = Math.min(c.y, o.y) + CH - Math.max(c.y, o.y);
    if (ox <= 0 || oy <= 0) continue;
    const area = ox * oy;
    if (area < minArea) continue;
    const ev = evaluate(c, o);
    const score = area * (ev && !ev.full ? 2 : 1);
    if (score > bestScore){ bestScore = score; best = o; }
  }
  if (best) return best;
  for (const h of document.elementsFromPoint(clientX, clientY)){
    const ce = h.closest ? h.closest('.cw') : null;
    if (ce && !ce.classList.contains('half') && +ce.dataset.id !== c.id){
      const t = byId(+ce.dataset.id);
      if (t) return t;
    }
  }
  return null;
}
function clearTarget(){
  if (drag && drag.target){
    const el = els.get(drag.target.id);
    if (el) el.classList.remove('is-target', 'no');
    drag.target = null;
  }
}
function setTarget(t, c){
  if (drag.target && t && drag.target.id === t.id) return;
  clearTarget();
  if (!t) return;
  drag.target = t;
  const el = els.get(t.id);
  if (!el) return;
  el.classList.add('is-target');
  const ev = evaluate(c, t);
  if (!ev || ev.full) el.classList.add('no');
}
function onMove(e){
  if (tear && e.pointerId === tear.pid){
    const { px, py } = localPoint(e);
    updateTear(px, py);
    return;
  }
  if (!drag || e.pointerId !== drag.pid) return;
  const { px, py } = localPoint(e);
  if (!drag.moved && Math.hypot(px - drag.sx, py - drag.sy) < 4) return;
  drag.moved = true;
  const c = byId(drag.id);
  if (!c) return;
  const p = clampPos(px - drag.offX, py - drag.offY);
  const lim = attachLimits(c);                                  // 붙음 묶음은 통째로 화면 안에
  p.x = Math.max(lim.minX, Math.min(p.x, Math.max(lim.minX, lim.maxX)));
  if (lim.maxY != null && lim.maxY >= lim.minY) p.y = Math.min(Math.max(p.y, lim.minY), lim.maxY);
  c.x = p.x; c.y = p.y;
  drag.el.style.left = p.x + 'px';
  drag.el.style.top = p.y + 'px';
  setTarget(pickTarget(e.clientX, e.clientY, c), c);
}
function animateTo(el, x, y, done){
  busy = true;
  el.style.transition = 'left .22s ease-out, top .22s ease-out';
  requestAnimationFrame(() => {
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });
  setTimeout(() => {
    el.style.transition = '';
    busy = false;
    done();
  }, 240);
}
// 되돌아가기 — 매 프레임 실제 위치를 옮김
//   CSS 전환으로 겉모습만 옮기면 붙은 request가 따라오지 않고, 밀어내기도 멈춰 어색하게 겹쳤음
let returning = null;         // { id, fx, fy, tx, ty, t0, dur, done }
const heldId = () => drag ? drag.id : (returning ? returning.id : null);   // 끌거나 되돌아가는 중인 카드
function tweenTo(c, x, y, done){
  returning = { id: c.id, fx: c.x, fy: c.y, tx: x, ty: y, t0: performance.now(), dur: 240, done };
}
function stepReturn(){
  if (!returning) return false;
  const r = returning;
  const c = byId(r.id);
  if (!c){ returning = null; return false; }
  const t = Math.min(1, (performance.now() - r.t0) / r.dur);
  const e = 1 - Math.pow(1 - t, 3);                           // 끝에서 부드럽게 멈춤
  c.x = r.fx + (r.tx - r.fx) * e;
  c.y = r.fy + (r.ty - r.fy) * e;
  moveEl(c);
  if (t >= 1){
    returning = null;
    vel.delete(c.id);
    r.done();
  }
  return true;
}
// 원래 자리가 그사이 다른 카드로 막혔으면 가장 가까운 빈자리 (자기 묶음은 빈자리 판단에서 뺌)
function freeSpotFor(c, x, y){
  const group = linkedGroup(c);
  const all = S.cards;
  S.cards = all.filter(o => !group.has(o.id));
  const p = findSpot(x, y);
  S.cards = all;
  return p;
}
function bounce(c, d0){
  sayMaybe(LINES.bounce);
  markRing(c.id, 'fail');                                     // 되돌아가는 동안 빨간 테두리
  if (d0.fromContainer){
    // 꺼낸 카드를 못 놓으면 자루로 돌아감 (자리가 있고 같은 종류일 때)
    const box = byId(d0.fromContainer);
    if (box && (!box.count || box.fill === c.type) && (box.count || 0) < holdOf(box)){
      tweenTo(c, box.x, box.y, () => {
        removeCard(c.id);
        storeInto(box, c.type);
        afterChange();
      });
      return;
    }
  }
  if (d0.fromMouth){
    // 신의 입에서 꺼낸 카드를 못 놓으면 기록 제자리로 돌아감
    const mouth = byId(d0.fromMouth.id);
    if (mouth){
      tweenTo(c, mouth.x, mouth.y, () => {
        removeCard(c.id);
        const from = swallowFrom(mouth);
        swallow(mouth, recordEaten(mouth, c, d0.fromMouth.idx), from);   // 그사이 기록이 가득 찼으면 맨 오른쪽이 삼켜짐
        afterChange();
      });
      return;
    }
  }
  if (d0.fromRequest){
    const rq = byId(d0.fromRequest);
    if (rq){
      tweenTo(c, rq.x, rq.y, () => {
        removeCard(c.id);
        rq.stack.push(c.type);
        afterChange();
      });
      return;
    }
  }
  const spot = freeSpotFor(c, d0.ox, d0.oy);
  tweenTo(c, spot.x, spot.y, () => afterChange());
}
function onUp(e){
  if (tear && e.pointerId === tear.pid){ endTear(); return; }
  if (!drag || e.pointerId !== drag.pid) return;
  const c = byId(drag.id);
  const t = drag.target;
  clearTarget();
  drag.el.classList.remove('dragging');
  const d0 = drag;
  drag = null;
  if (!c || !d0.moved){ if (c) setSelected(c.id); renderAll(); return; }   // 탭 → 인스펙터
  if (t && byId(t.id)){
    const ev = evaluate(c, t);
    if (ev && applyEv(ev, c, t)){ afterChange(); return; }
    bounce(c, d0);                                // 쌓기 실패 → 되돌아감
    return;
  }
  afterChange();                                  // 빈 자리 → 이동
}

// 카드 위에 +N 같은 수치를 띄움 (떠오르며 사라짐)
function floatText(c, text, cls){

// ── 동물 홉핑 ─────────────────────────────────────────
//   1초마다 일정 거리를 뜀. 뛰는 동안 카드가 세로로 길어졌다 눌림
const HOP_MS = 320;
const hops = new Map();          // id → { fx, fy, tx, ty, t0 }
function animalTick(){
  if (!S || paused || busy) return;
  const hid = heldId();
  const { w, h } = tableSize();
  for (const c of S.cards){
    if (!DEFS[c.type].hops || hops.has(c.id)) continue;
    if (hid != null && bodyOf(byId(hid)) === bodyOf(c)) continue;   // 잡혀 있으면 안 뜀
    if (tear && tear.id === c.id) continue;
    if (c.duel != null) continue;                             // 대결 중엔 안 뜀
    const dd = DEFS[c.type];
    const dist = CW * 0.55 * (dd.hopScale || 1);             // 곰은 2배
    let ang = Math.random() * Math.PI * 2;
    // 가장자리 근처면 절반 확률로 안쪽을 향해 뜀
    const nearEdge = c.x < CW || c.y < TOP_PAD + CH * 0.5 || c.x > w - CW * 2 || c.y > h - CH * 1.5;
    if (nearEdge && Math.random() < 0.5) ang = Math.atan2(h / 2 - (c.y + CH / 2), w / 2 - (c.x + CW / 2)) + (Math.random() - 0.5);
    const p = clampPos(c.x + Math.cos(ang) * dist, c.y + Math.sin(ang) * dist);
    const anim = dd.hopAnim || 'hop';
    hops.set(c.id, { fx: c.x, fy: c.y, tx: p.x, ty: p.y, t0: performance.now(), ms: dd.hopMs || HOP_MS, anim });
    const el = els.get(c.id);
    if (el){
      el.classList.remove('hop', 'run', 'spawn', 'pop', 'bump');   // 끝난 등장·튕김 클래스를 치우고
      void el.offsetWidth;                                  // 애니메이션 다시 시작
      el.classList.add(anim);
    }
  }
}
function stepHops(){
  if (!hops.size) return false;
  const hid = heldId();
  let moved = false;
  for (const [id, hp] of hops){
    const c = byId(id);
    if (!c || (hid != null && bodyOf(byId(hid)) === bodyOf(c))){ hops.delete(id); continue; }
    const t = Math.min(1, (performance.now() - hp.t0) / hp.ms);
    const e = 1 - Math.pow(1 - t, 2);
    c.x = hp.fx + (hp.tx - hp.fx) * e;
    c.y = hp.fy + (hp.ty - hp.fy) * e;
    moveEl(c);
    moved = true;
    if (t >= 1){
      hops.delete(id);
      const el = els.get(id);
      if (el) setTimeout(() => el.classList.remove(hp.anim), 80);
    }
  }
  return moved;
}

// ── 크리처: 무기로 한 방 / 캐릭터와 대결 ─────────────────
//   무기를 쌓음: 무기 공격력 ≥ 크리처 남은 체력이면 바로 쓰러뜨리고 전리품. 아니면 "무기의 공격력 낮음"
//   캐릭터를 쌓음: 대결 — 캐릭터 선공, 크리처 후공을 한쪽이 쓰러질 때까지 반복 (DUEL_MS마다 한 번)
//     피해 = 공격력 − 상대 방어 (최소 0). 크리처도 공방체 (v0.52.0, 지금 방어 0)
//     승리: 전리품. 패배: 캐릭터 빈사, 크리처는 남은 체력 그대로
//     둘 다 피해를 못 주면 바로 끝 (무승부)
const DUEL_MS = 800;
function defOf(c){
  const d = DEFS[c.type];
  return (d.baseDef || 0) + Object.values(c.equip || {}).reduce((sum, ty) => sum + ((DEFS[ty] && DEFS[ty].defense) || 0), 0);
}
function killCreature(cr){
  const x = cr.x, y = cr.y;
  hops.delete(cr.id);
  removeCard(cr.id);
  S.flags.hunted = true;                                      // v0.83.0: 사냥 quest
  toast(`${ic(cr.type)} ${DEFS[cr.type].name} 쓰러뜨림`);
  const omitted = [];
  for (const t of (DEFS[cr.type].loot || [])){
    if (!canSpawn(t)){ omitted.push(t); continue; }            // 월드에 5장이면 그 전리품만 누락
    const p = findSpot(x, y);
    const nc = addCard(t, p.x, p.y);
    spawned.delete(nc.id);
    popFrom.set(nc.id, { x, y });
  }
  omitToast(omitted);
}
function startDuel(ch, cr){
  delete ch.visit;
  delete ch.visitSeq;
  hops.delete(cr.id);
  ch.duel = cr.id;
  cr.duel = ch.id;
  cr.turn = 'char';                                           // 캐릭터 선공
  setStatus(ch, [], ['대결']);
  setStatus(cr, [], ['대결']);
  // 크리처 왼쪽, 캐릭터 오른쪽으로 나란히 (캐릭터에 붙은 quest는 그 오른쪽)
  const gap = 12;
  const lim = attachLimits(ch);
  ch.x = Math.max(8 + CW + gap, Math.min(cr.x + CW + gap, lim.maxX));
  ch.y = clampPos(ch.x, cr.y).y;
  cr.x = ch.x - CW - gap;
  cr.y = ch.y;
  bumpIds.add(ch.id);
  bumpIds.add(cr.id);
  toast(`${si('atk')} ${DEFS[ch.type].name} vs ${DEFS[cr.type].name} — 대결`);
}
function endDuel(ch, cr){
  if (ch){ delete ch.duel; setStatus(ch, ['대결'], []); }
  if (cr){ delete cr.duel; delete cr.turn; setStatus(cr, ['대결'], []); }
}
function duelTick(){
  if (!S || paused || busy) return;
  let changed = false;
  for (const cr of S.cards.slice()){
    if (DEFS[cr.type].kind !== 'creature' || cr.duel == null) continue;
    const ch = byId(cr.duel);
    if (!ch || ch.duel !== cr.id){ endDuel(null, cr); changed = true; continue; }
    const charDmg = Math.max(0, atkOf(ch) - defOf(cr));
    const foeDmg = DEFS[ch.type].immortal ? 0 : Math.max(0, atkOf(cr) - defOf(ch));   // v0.88.0: 갓은 피해를 안 받음 → 서로 못 이기면 대결 끝
    if (charDmg <= 0 && foeDmg <= 0){
      endDuel(ch, cr);
      toast(`서로 피해를 못 줌 — 대결 끝`);
      changed = true;
      continue;
    }
    if ((cr.turn || 'char') === 'char'){
      cr.hp = Math.max(0, cr.hp - charDmg);
      floatText(cr, `-${charDmg}`);
      bumpIds.add(cr.id);
      if (cr.hp <= 0){
        endDuel(ch, cr);
        toast(`🏆 ${DEFS[ch.type].name} 승리`);
        killCreature(cr);
      } else cr.turn = 'foe';
    } else {
      ch.hp = Math.max(0, ch.hp - foeDmg);
      floatText(ch, `-${foeDmg}`);
      bumpIds.add(ch.id);
      if (ch.hp <= 0){
        endDuel(ch, cr);
        setStatus(ch, ['허기짐'], ['빈사']);                    // 패배: 캐릭터 빈사, 크리처는 체력 회복 안 함
        toast(`💀 ${DEFS[ch.type].name} 패배 — 빈사`);
      } else cr.turn = 'char';
    }
    changed = true;
  }
  if (changed) afterChange();
}

// ── 체력 회복 장소 ─────────────────────────────────────
//   "체력 회복 lvN" 장소를 방문한 캐릭터는 15초 / N 마다 체력 +1
//   장소마다 게이지 하나. 다 차면 방문자 전원 한꺼번에 +1. 빈사는 회복 안 됨 (빈사 치유가 필요)
const REST_MS = 15000;                         // lv1 = 15초에 +1
function pieValue(pl){
  if (DEFS[pl.type].yields) return Math.min(1, (pl.yieldPts || 0) / DEFS[pl.type].yieldNeed);   // 산: 나무 게이지
  const lv = tagLevel(DEFS[pl.type], '체력 회복');
  if (!lv || !visitorsOf(pl).length) return 0;
  return Math.min(1, (pl.restMs || 0) / (REST_MS / lv));
}
// 게이지는 장소 하나에 하나: 첫 방문자가 들어오면 차오르기 시작, 다 차는 순간 방문자 전원이 한꺼번에 +1
function restTick(){
  if (!S || paused) return;
  let hpChanged = false;
  for (const pl of S.cards){
    const lv = tagLevel(DEFS[pl.type], '체력 회복');
    if (!lv) continue;
    const vs = visitorsOf(pl);
    if (!vs.length){ pl.restMs = 0; continue; }            // 모두 떠나면 게이지 초기화
    const healable = vs.filter(v => v.hp != null && v.hp < DEFS[v.type].hp && !statusOf(v).includes('빈사'));
    if (!healable.length) continue;                         // 회복할 사람이 없으면 게이지 멈춤
    const period = REST_MS / lv;
    pl.restMs = (pl.restMs || 0) + 1000;
    if (pl.restMs < period) continue;
    pl.restMs -= period;
    for (const v of healable){
      v.hp = Math.min(DEFS[v.type].hp, v.hp + 1);
      floatText(v, `${si('hp')} +1`);                       // 쉬어서 오른 체력
      bumpIds.add(v.id);
      if (v.hp >= DEFS[v.type].hp && statusOf(v).includes('허기짐')){
        setStatus(v, ['허기짐'], []);
        toast(`🍽️ ${DEFS[v.type].name}: 허기짐 해결`);
      }
    }
    bumpIds.add(pl.id);
    hpChanged = true;
  }
  if (hpChanged){ afterChange(); return; }
  for (const pl of S.cards){                    // 게이지만 갱신
    const el = els.get(pl.id);
    const pie = el && el.querySelector('.pie');
    if (pie) pie.style.setProperty('--p', pieValue(pl));
  }
}

// ── 산: 방문한 캐릭터의 공격력만큼 게이지가 참 → 다 차면 나무 ──
//   1초마다 방문자 공격력 합계만큼 +. 공격력 0이면 +0 (아무리 기다려도 안 나옴)
//   방문자가 떠나도 게이지는 남음
function atkOf(c){
  const d = DEFS[c.type];
  return (d.baseAtk || 0) + Object.values(c.equip || {}).reduce((sum, ty) => sum + ((DEFS[ty] && DEFS[ty].atk) || 0), 0);
}
const pickWeighted = table => {
  let r = Math.random() * table.reduce((sum, [, w]) => sum + w, 0);
  for (const [t, w] of table){ r -= w; if (r < 0) return t; }
  return table[table.length - 1][0];
};
// v0.71.0: 게이지 기반 — 산 gauge:'atk' 방문자 공격력 합계, 강가 gauge:'people' 방문 인원
//   v0.88.0: 빈사 캐릭터는 일하지 않음 — 게이지에 안 들어감
const gaugeAdd = (d, vs) => {
  const w = vs.filter(v => !statusOf(v).includes('빈사'));
  return d.gauge === 'people' ? w.length : w.reduce((sum, v) => sum + atkOf(v), 0);
};
function yieldTick(){
  if (!S || paused || busy) return;
  let made = false, progressed = false;
  for (const pl of S.cards){
    const d = DEFS[pl.type];
    if (!d.yields) continue;
    const vs = visitorsOf(pl);
    if (!vs.length) continue;
    const add = gaugeAdd(d, vs);
    pl.yieldPts = (pl.yieldPts || 0) + add;
    floatText(pl, `+${add}`, 'work');                         // 게이지에 들어간 만큼
    while (pl.yieldPts >= d.yieldNeed){
      pl.yieldPts -= d.yieldNeed;
      const miss = [];
      for (const ty of [].concat(pickWeighted(d.yields))){   // 나무 + 돌 · 토끼 · 곰
        if (!canSpawn(ty)){ miss.push(DEFS[ty].name); continue; }   // 월드 수량 초과
        const p = findSpot(pl.x, pl.y + CH + 12);
        const nc = addCard(ty, p.x, p.y);
        spawned.delete(nc.id);
        popFrom.set(nc.id, { x: pl.x, y: pl.y });              // 산에서 튀어나옴
        bumpIds.add(pl.id);
        made = true;
      }
      if (miss.length) floatText(pl, `누락: ${miss.join(', ')}`, 'work');
      // 채집 quest: 그 장소의 게이지가 찰 때마다 1번 (여러 장이 같이 나와도 1번, 월드 상한으로 누락돼도 1번)
      // v0.87.0: 산·강가 공통
      const gq = S.cards.find(c => c.type === 'quest' && c.goal === 'gather' && c.place === pl.type);
      if (gq && (gq.gathered || 0) < gq.need){ gq.gathered = (gq.gathered || 0) + 1; progressed = true; }
    }
    const el = els.get(pl.id);
    const pie = el && el.querySelector('.pie');
    if (pie) pie.style.setProperty('--p', pieValue(pl));
  }
  if (made || progressed) afterChange();
  else save();
}

// ── 첫 package: 안에 갇힌 갓이 모서리를 당기라고 함 ───
let lastNag = 0;
function trappedHint(first){
  if (!S) return;
  const pk = S.cards.find(c => c.type === 'package' && c.contents === 'first');
  if (!pk || tear || isTalking('god')) return;
  const now = Date.now();
  if (!first && now - lastNag < 9000) return;
  lastNag = now;
  if (first) say(LINES.trapped);
  else say(pick(LINES.trappedNag), priChance(1 / LINES.trappedNag.length));
}

// ── 필드 상태 복사 (시스템 메뉴) ──────────────────────
function fieldSnapshot(){
  const { w, h } = tableSize();
  const nameOf = id => { const o = byId(id); return o ? `${DEFS[o.type].name}#${o.id}` : null; };
  return {
    version: VERSION,
    time: new Date().toISOString(),
    table: { w, h, cardW: CW, cardH: CH },
    physics: phys,
    cards: S.cards.map(c => {
      const d = DEFS[c.type];
      const o = { id: c.id, type: c.type, name: d.name, x: Math.round(c.x), y: Math.round(c.y) };
      const tags = tagsOf(c);
      if (COMBOABLE.has(c.type)) tags.unshift('조합 가능');
      if (tags.length) o.tags = tags;
      if (c.hp != null) o.hp = `${c.hp}/${d.hp}`;
      if (d.slots){
        o.equip = {};
        for (const sl of d.slots) o.equip[sl] = c.equip && c.equip[sl] ? DEFS[c.equip[sl]].name : null;
      }
      if (c.visit != null) o.visit = nameOf(c.visit);
      if (c.contents) o.contents = c.contents;
      if (c.eaten) o.eaten = c.eaten.map(r => DEFS[r.type] ? DEFS[r.type].name : r.type);
      if (DEFS[c.type].devour) o.satisfied = c.satisfied || 0;
      if (DEFS[c.type].kind === 'container') o.held = c.fill ? `${DEFS[c.fill].name} ${c.count}/${DEFS[c.type].hold}` : '비어 있음';
      if (c.type === 'quest'){
        o.title = c.title;
        if (c.quest) o.quest = c.quest;
        o.giver = c.giver != null ? nameOf(c.giver) : null;
        o.progress = plain(reqProgress(c));
        o.reward = plain(reqReward(c));
        if (c.stack && c.stack.length) o.stack = c.stack.map(t => DEFS[t].name);
      }
      return o;
    }),
    seen: S.seen.map(t => DEFS[t].name),
    found: S.found,
    flags: S.flags,
  };
}
async function copyField(){
  const text = JSON.stringify(fieldSnapshot(), null, 2);
  try {
    await navigator.clipboard.writeText(text);
    toast('📋 필드 상태를 복사함');
  } catch (e) {
    // 클립보드 API가 막힌 환경 → 예전 방식으로 한 번 더
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
    if (ok) toast('📋 필드 상태를 복사함');
    else { toast('복사 실패 — 콘솔에 출력함'); console.log(text); }
  }
}

// ── 콜렉터북 (카드 아님) ──────────────────────────────
let bookOpen = false;          // 시트가 올라와 있나
let bookManual = false;        // 버튼으로 연 상태 (자동으로 닫지 않음)
let bookPending = new Set();   // 아직 등록 연출 전이라 ??? 로 보일 카드
let discoQ = [], discoRunning = false, discoTimer = null;
function renderBook(){
  const seen = new Set(S.seen);
  const shown = id => seen.has(id) && !bookPending.has(id);
  const n = PAGE.ids.filter(shown).length;
  let html = '<div class="book-panel"><div class="book-grip"></div><div class="book-head"><div>';
  html += `<span class="eyebrow">콜렉터북</span><h2>${esc(PAGE.title)}<small class="book-count">${n} / ${PAGE.ids.length}</small></h2>`;
  html += '</div><button class="btn btn-secondary btn-sm" data-close>닫기</button></div><div class="book-grid">';
  for (const id of PAGE.ids){
    const d = DEFS[id];
    html += shown(id)
      ? `<div class="slot${id === selType ? ' selected' : ''}" data-slot="${id}"><div class="e">${iconHtml(id)}</div><div class="n">${esc(d.name)}</div></div>`
      : `<div class="slot unseen" data-slot="${id}"><div class="e">❔</div><div class="n">???</div></div>`;
  }
  html += `</div><h3 class="book-sub">발견한 조합<small>${S.found.length} / ${RECIPES.length}</small></h3><ul class="recipes">`;
  for (const r of RECIPES){
    html += S.found.includes(r.id) ? `<li>${rich(recipeText(r))}</li>` : '<li class="unknown">??? + ??? → ???</li>';
  }
  html += '</ul></div>';
  book.innerHTML = html;
}
function setBookOpen(open){
  bookOpen = open;
  book.classList.toggle('open', open);
}
// 상단 버튼: 하단에서 올라오고, 다시 누르면 하단으로 사라짐
function toggleBook(){
  if (bookOpen){
    closeBook();
  } else {
    bookManual = true;
    renderBook();
    setBookOpen(true);
  }
}
// 새 카드 발견: 시트가 올라오고 칸마다 아이콘이 차례로 등록됨 → 잠시 뒤 내려감
function showDiscoveries(types){
  const add = types.filter(t => PAGE.ids.includes(t) && !discoQ.includes(t));
  if (!add.length) return;
  discoQ.push(...add);
  for (const t of add) bookPending.add(t);
  if (!discoRunning) runDiscoveries();
}
function runDiscoveries(){
  clearTimeout(discoTimer);
  if (!discoQ.length){
    discoRunning = false;
    if (bookManual){ setPaused(false); return; }   // 버튼으로 연 상태면 시트는 두고 게임만 재개
    // 등록이 끝나고 잠깐 보여준 뒤 내려감 → 다 내려가면 게임 재개
    discoTimer = setTimeout(() => {
      if (bookManual || discoRunning) return;
      setBookOpen(false);
      discoTimer = setTimeout(() => { if (!discoRunning) setPaused(false); }, 400);
    }, 1200);
    return;
  }
  discoRunning = true;
  setPaused(true);                                // 등록 연출 동안 게임 필드 일시 정지
  const batch = discoQ.splice(0);
  renderBook();
  const delay = bookOpen ? 150 : 430;             // 막 올라오는 중이면 다 올라온 뒤에 등록
  setBookOpen(true);
  batch.forEach((t, i) => setTimeout(() => registerSlot(t), delay + i * 320));
  discoTimer = setTimeout(runDiscoveries, delay + batch.length * 320 + 250);
}
// 닫기: 남은 등록 연출은 건너뛰고 바로 게임 재개
function closeBook(){
  clearTimeout(discoTimer);
  discoQ = [];
  discoRunning = false;
  bookPending.clear();
  bookManual = false;
  setBookOpen(false);
  setPaused(false);
}
function registerSlot(t){
  bookPending.delete(t);
  const slot = book.querySelector(`.slot[data-slot="${t}"]`);
  if (!slot) return;
  const d = DEFS[t];
  slot.classList.remove('unseen');
  slot.innerHTML = `<div class="e">${iconHtml(t)}</div><div class="n">${esc(d.name)}</div>`;
  slot.classList.remove('reg');
  void slot.offsetWidth;                          // 애니메이션 다시 시작
  slot.classList.add('reg');
  slot.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  const cnt = book.querySelector('.book-count');
  if (cnt){
    const seen = new Set(S.seen);
    cnt.textContent = `${PAGE.ids.filter(id => seen.has(id) && !bookPending.has(id)).length} / ${PAGE.ids.length}`;
  }
}

// ── 던전 전투 (v0.90.0) ──────────────────────────────────
//   캐릭터를 올리면 던전이 가로 span배로 늘어나고, 왼쪽 끝에 spawns 크리처가 등장 (카드는 던전 왼쪽에 선으로 연결)
//   길 위의 모습은 카드가 아니라 포트레이트. 캐릭터는 오른쪽 → 왼쪽, 크리처는 왼쪽 → 오른쪽으로 전진
//   1) 사거리 안에 적이 없으면 자기 목표(반대쪽 끝)로 이동  2) 사거리 안에 적이 있으면 공격
//   피해 = 공격력 − 상대 방어 (최소 0). 캐릭터 체력이 0이면 빈사로 탈락, 끝까지 도달하면 클리어
const DUN_SPEED = 0.34;                          // 1초에 길의 몇 %를 가나
const DUN_RANGE = 0.14;                          // 사거리 (길 길이 대비)
const DUN_HIT = 800;                             // 공격 간격 (ms)
const runLast = new Map();                       // 던전 id → 마지막 계산 시각
const dunFoes = pl => S.cards.filter(c => c.dun === pl.id);
const dunPos = u => u.dunP != null ? u.dunP : 0;
// 던전 입장: 캐릭터는 오른쪽 끝, 크리처는 왼쪽 끝에서 시작
function enterDungeon(pl, ch){
  ch.dunP = 1;
  delete ch.atkT;
  for (const ty of DEFS[pl.type].spawns || []){
    if (S.cards.some(c => c.dun === pl.id && c.type === ty)) continue;
    const g = addCard(ty, pl.x - CW * 1.2, pl.y, { dun: pl.id, dunP: 0, hp: DEFS[ty].hp }, true);
    spawned.delete(g.id);
    popFrom.set(g.id, { x: pl.x, y: pl.y });
  }
}
// 던전 정리: 남은 크리처 제거, 진행값 지움
function clearDungeon(pl){
  for (const g of dunFoes(pl)) removeCard(g.id);
  runLast.delete(pl.id);
}
function dunPortrait(pl, u, cls){
  const el = els.get(pl.id);
  const r = el && el.querySelector(`.runner[data-run="${u.id}"]`);
  if (!r) return;
  r.classList.remove(cls);
  void r.offsetWidth;
  r.classList.add(cls);
  setTimeout(() => r.classList.remove(cls), 320);
}
function dunHit(pl, a, b){
  const dmg = Math.max(0, atkOf(a) - defOf(b));
  b.hp = Math.max(0, (b.hp || 0) - dmg);
  dunPortrait(pl, a, 'atk');
  dunPortrait(pl, b, 'hurt');
  floatText(b, `-${dmg}`);
  const be = els.get(b.id);
  if (be) paint(be, b);                          // 맞은 카드의 체력만 다시 그림 (던전 카드 안 포트레이트는 그대로)
  save();
  return dmg;
}
function stepDungeon(){
  if (!S) return false;
  const now = performance.now();
  let changed = false;
  for (const pl of S.cards.slice()){
    const d = DEFS[pl.type];
    if (!d.span) continue;
    const chs = visitorsOf(pl);
    const foes = dunFoes(pl);
    if (!chs.length){                                          // 아무도 없으면 던전 초기화
      if (foes.length){ clearDungeon(pl); changed = true; }
      continue;
    }
    const ch = chs[0];
    const last = runLast.get(pl.id);
    runLast.set(pl.id, now);
    if (last == null) continue;
    const dt = Math.min(0.2, (now - last) / 1000);
    if (heldId() === ch.id) continue;                          // 잡고 있는 동안은 멈춤
    const units = [{ u: ch, dir: -1, goal: 0, foes }].concat(foes.map(g => ({ u: g, dir: 1, goal: 1, foes: [ch] })));
    for (const { u, dir, goal, foes: es } of units){
      if (!byId(u.id)) continue;
      const alive = es.filter(e => byId(e.id) && (e.hp == null || e.hp > 0));
      const near = alive.filter(e => Math.abs(dunPos(e) - dunPos(u)) <= DUN_RANGE)
        .sort((a, b) => Math.abs(dunPos(a) - dunPos(u)) - Math.abs(dunPos(b) - dunPos(u)))[0];
      if (near){                                               // 2) 사거리 안에 적 → 공격
        if (now - (u.atkT || 0) < DUN_HIT) continue;
        u.atkT = now;
        dunHit(pl, u, near);
        changed = true;
        if (near.hp <= 0){
          if (near.id === ch.id){                              // 캐릭터 패배 → 빈사로 탈락
            setStatus(ch, ['허기짐'], ['빈사']);
            delete ch.visit; delete ch.visitSeq; delete ch.dunP; delete ch.atkT;
            clearDungeon(pl);
            toast(`💀 ${DEFS[ch.type].name} 패배 — 빈사`);
          } else {
            toast(`🏆 ${ic(near.type)} ${DEFS[near.type].name} 쓰러뜨림`);
            removeCard(near.id);
          }
          afterChange();
        }
        continue;
      }
      // 1) 사거리 안에 아무도 없으면 목표(반대쪽 끝)로 이동
      const np = Math.min(1, Math.max(0, dunPos(u) + dir * DUN_SPEED * dt));
      if (np !== dunPos(u)){ u.dunP = np; changed = true; }
      const el = els.get(pl.id);
      const r = el && el.querySelector(`.runner[data-run="${u.id}"]`);
      if (r) r.style.setProperty('--rp', u.dunP);
      if (u.id === ch.id && np <= 0 && !dunFoes(pl).length){    // 끝까지 도달 → 클리어
        delete ch.visit; delete ch.visitSeq; delete ch.dunP; delete ch.atkT;
        const q = clampPos(pl.x + CW * d.span + 12, pl.y);
        ch.x = q.x; ch.y = q.y;
        bumpIds.add(ch.id);
        clearDungeon(pl);
        toast(`${ic(pl.type)} ${DEFS[ch.type].name} — 던전 클리어`);
        afterChange();
      }
    }
  }
  return false;                                                 // 카드 위치는 안 건드림 (포트레이트만 움직임)
}

// ── 밀어내기 (물리) ───────────────────────────────────
function velOf(id){
  let v = vel.get(id);
  if (!v){ v = { x: 0, y: 0 }; vel.set(id, v); }
  return v;
}
function physStep(){
  requestAnimationFrame(physStep);
  let moved = false;
  if (S && !busy && !paused){
    if (stepReturn()) moved = true;            // 되돌아가는 카드를 먼저 옮기고
    if (stepHops()) moved = true;              // 동물 홉핑
    if (stepDungeon()) moved = true;           // 던전 진행
    if (solveAttach()) moved = true;           // 잡은 quest → 발주자
    if (solveVisit()) moved = true;            // 장소 → 방문자 줄 / 멀리 당기면 떠남
    if (solveDun()) moved = true;              // 던전 → 왼쪽 크리처 줄
    if (solveAttach()) moved = true;           // 방문자 → 붙은 quest
    if (phys ? physMove() : unwedge()) moved = true;   // 밀어내기 꺼짐이면 묶음 틈에 낀 카드만 빼냄
    if (solveVisit()) moved = true;
    if (solveAttach()) moved = true;
  }
  if (moved) physDirty = true;
  else if (physDirty && !drag){ physDirty = false; save(); }   // 멈추면 한 번 저장
  drawLinks();
  fitBubbles();                                // 카드가 움직여도 말풍선은 화면 안에
}
// ── quest 붙이기 ─────────────────────────────────────
// 붙음: request는 선 없이 발주자(캐릭터) 오른쪽에 붙어서 같이 움직임. 왼쪽으로는 가지 않음
const ATTACH_GAP = 4;
// quest 등장: 발주자 뒤에서 오른쪽으로 미끄러져 나옴
const SLIDE_MS = 350;
const slideIn = new Map();     // quest id → 등장 시작 시각
function slideProgress(id){
  const t0 = slideIn.get(id);
  if (t0 == null) return 1;
  const t = (performance.now() - t0) / SLIDE_MS;
  if (t >= 1){ slideIn.delete(id); return 1; }
  return 1 - Math.pow(1 - t, 3);
}
function slideOutFrom(rq, g){
  rq.x = g.x; rq.y = g.y;       // 발주자와 같은 자리에서 시작
  spawned.delete(rq.id);
  slideIn.set(rq.id, performance.now());
  g.z = ++S.z;                   // 발주자가 위 → request가 뒤에서 나오는 것처럼
  setTimeout(checkSettle, 0);     // 나오자마자 이미 조건을 채웠는지 확인 (다음 조작을 기다리지 않음)
}
// 붙어 있는 request의 몸통 = 발주자. 나머지 카드는 자기 자신
function bodyOf(c){
  let cur = c;
  for (let i = 0; cur && i < 6; i++){
    if (cur.type === 'quest' && cur.giver != null){ const g = byId(cur.giver); if (g){ cur = g; continue; } }
    if (cur.visit != null){ const pl = byId(cur.visit); if (pl){ cur = pl; continue; } }
    if (cur.dun != null){ const dg = byId(cur.dun); if (dg){ cur = dg; continue; } }
    break;
  }
  return cur;
}
function moveEl(c){
  const el = els.get(c.id);
  if (el){ el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; }
}
// 발주자에 붙은 quest 목록 (붙는 순서 = id 순)
// v0.85.0: 반복 생성되는 quest(갓의 "아무거나 3개")는 ord로 본래 자리를 지킴 — 다시 나와도 안쪽 제자리
const attachOrd = r => r.ord != null ? r.ord : r.id;
function attachedList(g){
  return S.cards.filter(r => r.type === 'quest' && r.giver === g.id).sort((a, b) => attachOrd(a) - attachOrd(b));
}
// 붙음 묶음이 화면 밖으로 나가지 않도록 카드별 x 범위
//   request는 항상 발주자 오른쪽 → 경계에 닿으면 순서를 바꾸지 않고 더 안 움직임
function attachLimits(c){
  const { w } = tableSize();
  const step = CW + ATTACH_GAP;
  const maxBase = w - CW - 8;
  if (c.type === 'quest' && c.giver != null){
    const g = byId(c.giver);
    if (g){
      const list = attachedList(g);
      const i = list.findIndex(r => r.id === c.id);
      return { minX: 8 + step * (i + 1), maxX: maxBase - step * (list.length - 1 - i) };
    }
  }
  const units = rowUnits(c);
  if (units) return visitBounds(c);           // 장소: 방문자 열까지 화면 안에
  return { minX: 8, maxX: maxBase - step * attachedList(c).length };
}
function solveAttach(){
  let moved = false;
  const step = CW + ATTACH_GAP;
  const groups = new Map();
  for (const c of S.cards){
    if (c.type !== 'quest' || c.giver == null) continue;
    const g = byId(c.giver);
    if (!g) continue;
    if (!groups.has(g.id)) groups.set(g.id, { g, list: [] });
    groups.get(g.id).list.push(c);
  }
  for (const { g, list } of groups.values()){
    list.sort((a, b) => attachOrd(a) - attachOrd(b));
    const hid = heldId();
    const di = hid != null ? list.findIndex(r => r.id === hid) : -1;
    if (di >= 0){
      // request를 끌면 발주자가 따라옴 (quest 위치는 onMove에서 이미 범위 안으로 제한됨)
      const r = list[di];
      const p = clampPos(r.x - step * (di + 1), r.y);
      if (Math.abs(p.x - g.x) > 0.05 || Math.abs(p.y - g.y) > 0.05){ g.x = p.x; g.y = p.y; moveEl(g); moved = true; }
    } else if (hid !== g.id){
      // 밀어내기·방문 연결 등으로 발주자가 오른쪽 끝에 몰리면 quest 자리만큼 안쪽으로
      const lim = attachLimits(g);
      if (lim.maxX >= lim.minX && g.x > lim.maxX + 0.05){ g.x = lim.maxX; moveEl(g); moved = true; }
    }
    list.forEach((r, i) => {
      if (r.id === hid) return;
      const p = clampPos(g.x + step * (i + 1) * slideProgress(r.id), g.y);
      if (Math.abs(p.x - r.x) > 0.05 || Math.abs(p.y - r.y) > 0.05){ r.x = p.x; r.y = p.y; moveEl(r); moved = true; }
    });
  }
  return moved;
}

// 연결: 장소 ─ 방문한 캐릭터
//   일정 거리를 유지하며 밀리거나 끌려감 (막대처럼)
//   끌고 있는 카드에서 연결을 따라 퍼져나가며 차례로 끌려감 (사슬)
//   아무도 안 끌 때는 b쪽(quest·방문자)이 제 거리로 천천히 돌아감
const tetherLen = () => CW * 1.6;              // 카드 중심 사이 거리. 밀어내기 간격보다 길게
// ── 방문 줄 ───────────────────────────────────────────
// 방문한 캐릭터는 장소 오른쪽에 위에서 아래로 섬 (먼저 방문한 캐릭터가 위). 장소와 선으로 이어짐
// 장소를 끌면 줄이 딸려 움직임. 캐릭터를 잡아당겨 자리에서 멀어지면 떠남
const detachDist = () => CW * 1.1;           // 자리에서 이만큼(카드 위치 거리) 벗어나면 떠남
const visitGap = () => CW * 0.225;           // 장소와 방문자 열 사이 가로 간격 (v0.63.0: 0.45 → 절반)
const VISIT_VGAP = 6;                        // 방문자끼리 위아래 간격
// 방문자 열의 맨 위 y — 장소의 세로 가운데에 맞춤
// v0.90.0: 던전 왼쪽에 등장 크리처 줄 (방문자 줄과 같은 방식, 방향만 반대)
function solveDun(){
  let moved = false;
  const hid = heldId();
  const vstep = CH + VISIT_VGAP;
  for (const pl of S.cards){
    if (!DEFS[pl.type].span) continue;
    const list = dunFoes(pl);
    if (!list.length) continue;
    const top = visitColumnTop(pl, list.length);
    list.forEach((g, i) => {
      if (g.id === hid) return;
      const p = clampPos(pl.x - CW - visitGap(), top + vstep * i);
      if (Math.abs(p.x - g.x) > 0.05 || Math.abs(p.y - g.y) > 0.05){ g.x = p.x; g.y = p.y; moveEl(g); moved = true; }
    });
  }
  return moved;
}
function visitColumnTop(pl, n){
  const H = n * CH + (n - 1) * VISIT_VGAP;
  return pl.y + CH / 2 - H / 2;
}
// 방문자 열이 화면 밖으로 안 나가도록 장소가 있을 수 있는 범위
// v0.90.0: 장소 폭 — 던전은 캐릭터가 들어와 있는 동안 span배
function spanOf(pl){
  const d = DEFS[pl.type];
  return d.span && visitorsOf(pl).length ? d.span : 1;
}
function visitBounds(pl){
  const { w, h } = tableSize();
  const n = visitorsOf(pl).length;
  const units = rowUnits(pl);
  const H = n * CH + (n - 1) * VISIT_VGAP;
  const half = Math.max(0, (H - CH) / 2);
  return {
    minX: 8,
    maxX: w - 8 - CW * spanOf(pl) - (CW + visitGap()) - (CW + ATTACH_GAP) * Math.max(0, units - 1),
    minY: TOP_PAD + half,
    maxY: h - 8 - CH - half,
  };
}
function visitorsOf(pl){
  return S.cards.filter(c => c.visit === pl.id).sort((a, b) => ((a.visitSeq || 0) - (b.visitSeq || 0)) || (a.id - b.id));
}
function rowUnits(pl){
  // 가장 긴 줄의 칸 수 (방문자 1칸 + 그 방문자에 붙은 quest 수)
  return visitorsOf(pl).reduce((n, v) => Math.max(n, 1 + attachedList(v).length), 0);
}
function heldVisitor(){
  const hid = heldId();
  const h = hid != null ? byId(hid) : null;
  if (!h) return null;
  if (h.visit != null) return h;
  if (h.type === 'quest' && h.giver != null){ const g = byId(h.giver); if (g && g.visit != null) return g; }
  return null;
}
function solveVisit(){
  let moved = false;
  const step = CW + ATTACH_GAP;
  const hid = heldId();
  const hv = heldVisitor();
  const places = new Map();
  for (const c of S.cards){
    if (c.visit == null) continue;
    const pl = byId(c.visit);
    if (!pl){ delete c.visit; delete c.visitSeq; continue; }
    places.set(pl.id, pl);
  }
  const vstep = CH + VISIT_VGAP;
  for (const pl of places.values()){
    const list = visitorsOf(pl);
    if (hid !== pl.id){
      // 장소가 끝에 몰려 방문자 열이 화면 밖이면 안쪽으로
      const b = visitBounds(pl);
      if (b.maxX >= b.minX && pl.x > b.maxX + 0.05){ pl.x = b.maxX; moveEl(pl); moved = true; }
      if (b.maxY >= b.minY){
        const ny = Math.min(Math.max(pl.y, b.minY), b.maxY);
        if (Math.abs(ny - pl.y) > 0.05){ pl.y = ny; moveEl(pl); moved = true; }
      }
    }
    const top = visitColumnTop(pl, list.length);
    for (let i = 0; i < list.length; i++){
      const v = list[i];
      // v0.90.0: 던전도 다른 장소와 같음 — 카드는 선으로 연결해 오른쪽에 두고, 던전 안은 포트레이트가 걸어감
      const tx = pl.x + CW * spanOf(pl) + visitGap(), ty = top + vstep * i;
      if (hv && hv.id === v.id){
        // 잡아당기는 중: 자리로 끌어오지 않음. 멀어지면 떠남
        if (drag && Math.hypot(v.x - tx, v.y - ty) > detachDist()){
          delete v.visit;
          delete v.visitSeq;
          toast(`👋 ${DEFS[v.type].name} — ${DEFS[pl.type].name}에서 떠남`);
          moved = true;
        }
        continue;
      }
      if (Math.abs(v.x - tx) > 0.05 || Math.abs(v.y - ty) > 0.05){
        const k = hid === pl.id ? 1 : 0.35;            // 장소를 끌 땐 바로, 아니면 부드럽게 제자리로
        const p = clampPos(v.x + (tx - v.x) * k, v.y + (ty - v.y) * k);
        v.x = p.x; v.y = p.y;
        moveEl(v);
        moved = true;
      }
    }
  }
  return moved;
}
// 선: 장소와 방문자를 항상 이음
function tetherLinks(){
  const out = [];
  for (const c of S.cards){
    if (c.dun != null){                                       // v0.90.0: 던전 ─ 등장 크리처
      const dg = byId(c.dun);
      if (dg) out.push({ a: dg, b: c, kind: 'dun' });
      continue;
    }
    if (c.visit == null) continue;
    const pl = byId(c.visit);
    if (pl) out.push({ a: pl, b: c, kind: 'visit' });
  }
  return out;
}
function pullTo(anchor, mover, L, k){
  if (tear && (tear.id === anchor.id || tear.id === mover.id)) return false;
  let dx = mover.x - anchor.x, dy = mover.y - anchor.y;
  let d = Math.hypot(dx, dy);
  if (d < 0.001){ dx = 1; dy = 0; d = 1; }
  if (Math.abs(d - L) < 0.5) return false;
  const tx = anchor.x + dx / d * L, ty = anchor.y + dy / d * L;
  const p = clampPos(mover.x + (tx - mover.x) * k, mover.y + (ty - mover.y) * k);
  if (Math.abs(p.x - mover.x) < 0.05 && Math.abs(p.y - mover.y) < 0.05) return false;
  mover.x = p.x; mover.y = p.y;
  const el = els.get(mover.id);
  if (el){ el.style.left = mover.x + 'px'; el.style.top = mover.y + 'px'; }
  return true;
}
function solveTethers(){
  const L = tetherLen();
  const links = tetherLinks();
  const done = new Set();
  let moved = false;
  const dragIds = new Set();
  const hid = heldId();
  if (hid != null){
    dragIds.add(hid);
    const body = bodyOf(byId(hid));
    if (body) dragIds.add(body.id);
  }
  if (hid != null){
    const reached = new Set(dragIds);
    const queue = [...dragIds];
    while (queue.length){
      const id = queue.shift();
      for (const lk of links){
        if (done.has(lk)) continue;
        let from = null, to = null;
        if (lk.a.id === id && !reached.has(lk.b.id)){ from = lk.a; to = lk.b; }
        else if (lk.b.id === id && !reached.has(lk.a.id)){ from = lk.b; to = lk.a; }
        else continue;
        done.add(lk);
        reached.add(to.id);
        queue.push(to.id);
        if (pullTo(from, to, L, 1)) moved = true;
      }
    }
  }
  for (const lk of links){
    if (done.has(lk)) continue;
    if (dragIds.has(lk.a.id) || dragIds.has(lk.b.id)) continue;
    if (pullTo(lk.a, lk.b, L, 0.2)) moved = true;
  }
  return moved;
}
// 선 그리기. 카드 중심끼리 잇고, 바뀐 게 있을 때만 다시 그림
let linksKey = '';
function drawLinks(){
  if (!S) return;
  let out = '';
  for (const lk of tetherLinks()){
    const x1 = Math.round(lk.a.x + CW / 2), y1 = Math.round(lk.a.y + CH / 2);
    const x2 = Math.round(lk.b.x + CW / 2), y2 = Math.round(lk.b.y + CH / 2);
    out += `<line class="${lk.kind}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  }
  if (out !== linksKey){ linksKey = out; links.innerHTML = out; }
}
function physMove(){
  // 드래그 중인 카드와 찢는 중인 package는 밀지도 밀리지도 않음 (대상 위에 놓을 수 있게)
  // 붙어 있는 request는 발주자와 한 몸으로 밀림. 끌고 있는 묶음은 밀지도 밀리지도 않음
  const hid = heldId();
  const dragBody = hid != null ? bodyOf(byId(hid)) : null;
  const cs = S.cards.filter(c => !(dragBody && bodyOf(c) === dragBody) && !(tear && c.id === tear.id) && bodyOf(c).duel == null);   // 대결 중인 묶음은 제자리
  // v0.63.0: 카드끼리가 아니라 묶음 전체 사각형끼리 밀어냄 → 장소─캐릭터, 캐릭터─quest 틈에 다른 카드가 끼지 않음
  //   (예전엔 틈에 들어간 카드를 양쪽 카드가 반대로 밀어 제자리에 갇혔음)
  const gx = CW * 0.06, gy = CH * 0.04;                       // 카드 사이 최소 간격 (예전 gapX·gapY 와 같음)
  const hs = bodyHulls(cs);
  for (let i = 0; i < hs.length; i++){
    const A = hs[i];
    for (let j = i + 1; j < hs.length; j++){
      const B = hs[j];
      const ox = Math.min(A.x2, B.x2) - Math.max(A.x1, B.x1) + gx;
      const oy = Math.min(A.y2, B.y2) - Math.max(A.y1, B.y1) + gy;
      if (ox <= 0 || oy <= 0) continue;
      const dx = (B.x1 + B.x2) - (A.x1 + A.x2), dy = (B.y1 + B.y2) - (A.y1 + A.y2);
      const va = velOf(A.body.id), vb = velOf(B.body.id);
      if (ox < oy){
        const f = ox * PUSH * (dx < 0 ? -1 : 1);
        va.x -= f; vb.x += f;
      } else {
        const f = oy * PUSH * (dy < 0 ? -1 : 1);
        va.y -= f; vb.y += f;
      }
    }
  }
  let moving = false;
  for (const c of cs){
    if (bodyOf(c) !== c) continue;             // 붙은 request는 붙이기가 위치를 정함
    const v = vel.get(c.id);
    if (!v) continue;
    if (Math.abs(v.x) < 0.02 && Math.abs(v.y) < 0.02){ vel.delete(c.id); continue; }
    const nx = c.x + v.x, ny = c.y + v.y;
    const p = clampPos(nx, ny);
    if (p.x !== nx) v.x = 0;                       // 벽에 닿으면 그 방향 속도 0
    if (p.y !== ny) v.y = 0;
    c.x = p.x; c.y = p.y;
    v.x *= DAMP; v.y *= DAMP;
    const el = els.get(c.id);
    if (el){ el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; }
    moving = true;
  }
  return moving;
}
// 묶음(장소·방문자·붙은 quest 가 한 몸)마다 전체를 감싸는 사각형. n = 묶음 카드 수
function bodyHulls(cards){
  const m = new Map();
  for (const c of cards){
    const b = bodyOf(c);
    let h = m.get(b.id);
    if (!h){ h = { body: b, n: 0, x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity }; m.set(b.id, h); }
    h.n++;
    h.x1 = Math.min(h.x1, c.x); h.y1 = Math.min(h.y1, c.y);
    h.x2 = Math.max(h.x2, c.x + CW); h.y2 = Math.max(h.y2, c.y + CH);
  }
  return [...m.values()];
}
const outsideHull = (x, y, g) => x + CW <= g.x1 || x >= g.x2 || y + CH <= g.y1 || y >= g.y2;
// 밀어내기가 꺼져 있어도: 묶음 사각형 안(틈 포함)에 들어간 낱장 카드는 가장 가까운 바깥 자리로 뺌 (v0.63.0)
function unwedge(){
  const hid = heldId();
  const dragBody = hid != null ? bodyOf(byId(hid)) : null;
  const cs = S.cards.filter(c => !(dragBody && bodyOf(c) === dragBody) && !(tear && c.id === tear.id) && !(returning && c.id === returning.id));
  const hs = bodyHulls(cs);
  const groups = hs.filter(h => h.n > 1);
  let moved = false;
  for (const h of hs){
    const c = h.body;
    if (h.n > 1 || c.duel != null) continue;
    for (const g of groups){
      if (outsideHull(c.x, c.y, g)) continue;
      const opts = [
        { x: g.x1 - CW - 4, y: c.y }, { x: g.x2 + 4, y: c.y },
        { x: c.x, y: g.y1 - CH - 4 }, { x: c.x, y: g.y2 + 4 },
      ].map(p => clampPos(p.x, p.y)).filter(p => outsideHull(p.x, p.y, g));
      if (!opts.length) continue;
      const p = opts.reduce((a, b) => Math.hypot(b.x - c.x, b.y - c.y) < Math.hypot(a.x - c.x, a.y - c.y) ? b : a);
      c.x = p.x; c.y = p.y; moveEl(c); moved = true;
      break;
    }
  }
  return moved;
}

const bookCard = t => ({ id: -1, type: t, hp: DEFS[t].hp, equip: {}, status: [], stack: [], title: DEFS[t].name });
// 인스펙터 칸 배정 (모든 카드 공통): 머리 한 줄(그림·이름·태그) + 세 칸 [수치 | 상태 | 조합·출현]
//   칸 자리는 카드가 달라도 같음. 넣을 게 없는 칸은 —
//   quest: 수치 = 진행 / 상태 = 발주·올려놓은 카드 / 조합·출현 = 조합식·보상
const iRow = (k, v) => `<tr><th>${k}</th><td>${v}</td></tr>`;
const iTbl = rows => rows ? `<table class="i-tbl">${rows}</table>` : '';
const iSub = (title, body) => body ? `<div class="i-sub">${title}</div>${body}` : '';
const iLine = html => `<div class="i-line">${html}</div>`;
const iChips = list => `<div class="i-chips">${list.map(x => `<span>${x}</span>`).join('')}</div>`;
const iNone = text => `<div class="i-muted">${text}</div>`;
const cardRef = t => `${iconHtml(t, true)} ${esc(DEFS[t].name)}`;
const pctText = p => (Number.isInteger(p) ? p : p.toFixed(1)) + '%';
// 가중치 표 → 그림·이름·확률 칩 (한 줄에 여러 개)
function oddsChips(table){
  const total = table.reduce((sum, [, w]) => sum + w, 0);
  return iChips(table.map(([t, w]) => `${[].concat(t).map(cardRef).join(' + ')} ${pctText(w / total * 100)}`));
}
function inspectorHtml(c){
  const d = DEFS[c.type];
  const isQuest = d.kind === 'quest';
  const dying = d.kind === 'character' && statusOf(c).includes('빈사');
  const status = statusOf(c);
  const chips = (COMBOABLE.has(c.type) ? '<span class="i-tag combo">조합 가능</span>' : '')
    + (d.tags || []).map(t => `<span class="i-tag">${esc(t)}</span>`).join('')
    + status.map(t => `<span class="i-tag st">${esc(t)}</span>`).join('');
  const head = `<div class="i-head"><div class="i-icon${dying ? ' dying' : ''}">${iconHtml(c.type)}</div>`
    + (isQuest ? '<span class="i-kind">Quest</span>' : '')
    + `<div class="i-name">${esc(isQuest ? c.title : d.name)}</div>`
    + (chips ? `<div class="i-tags">${chips}</div>` : '') + '</div>'
    + (DESC[c.type] ? `<div class="i-desc">${esc(DESC[c.type])}</div>` : '');   // 카드 설명

  // ① 수치
  let c1 = '';
  const fromBook = c.id === -1;                                 // 콜렉터북에서 고른 가상 카드
  if (isQuest){
    c1 = fromBook ? iNone('quest 카드마다 다름') : iSub('진행', `<div class="i-pre">${rich(reqProgress(c))}</div>`);
  } else {
    let st = '';
    if (fighter(d)) st += iRow(`${statImg('atk')}공격`, atkOf(c)) + iRow(`${statImg('def')}방어`, defOf(c)) + iRow(`${statImg('hp')}체력`, hpText(c));
    const heal = healOf(d);
    if (heal > 0) st += iRow(`${statImg('hp')}회복`, '+' + heal);
    if (d.atk) st += iRow(`${statImg('atk')}공격`, '+' + d.atk);
    if (d.defense) st += iRow(`${statImg('def')}방어`, '+' + d.defense);
    if (d.capacity) st += iRow(`${statImg('people')}인원`, `${visitorsOf(c).length}/${d.capacity}`);
    if (d.hold) st += iRow('용량', `${c.count || 0}/${d.hold}`);
    if (d.devour) st += iRow('기록', `${(c.eaten || []).length}/${d.devour}`) + iRow('흡족', c.satisfied || 0);
    const lv = tagLevel(d, '체력 회복');
    if (lv){
      const period = REST_MS / lv;
      const vs = visitorsOf(c);
      const healable = vs.filter(v => v.hp != null && v.hp < DEFS[v.type].hp && !statusOf(v).includes('빈사'));
      st += iRow('회복', `+1/${period / 1000}초`);
      st += iRow('다음', !vs.length ? '<span class="i-muted">방문자 없음</span>'
        : !healable.length ? '<span class="i-muted">회복할 캐릭터 없음</span>'
        : `${Math.max(0, Math.ceil((period - (c.restMs || 0)) / 1000))}초`);
    }
    if (d.yields){
      const vs = visitorsOf(c);
      st += iRow('게이지', `${c.yieldPts || 0}/${d.yieldNeed}`);
      if (d.gauge) st += iRow('기반', `${statImg(d.gauge)}${d.gauge === 'people' ? '방문 인원' : '방문자 공격력'}`);
      st += iRow('1초마다', vs.length ? `+${gaugeAdd(d, vs)}` : '<span class="i-muted">방문자 없음</span>');
    }
    c1 = iTbl(st);
  }

  // ② 상태
  let c2 = '';
  if (d.slots){
    const eq = c.equip || {};
    c2 += iSub('장비', iTbl(d.slots.map(sl => {
      const it = eq[sl] && DEFS[eq[sl]];
      return iRow(esc(sl), it ? cardRef(eq[sl]) + (it.atk ? ` ${statImg('atk')}+${it.atk}` : '') + (it.defense ? ` ${statImg('def')}+${it.defense}` : '') : '<span class="i-muted">비어 있음</span>');
    }).join('')));
  }
  if (d.capacity){
    const vs = visitorsOf(c);
    c2 += iSub('방문자', vs.length ? iChips(vs.map(v => cardRef(v.type))) : iNone('없음'));
  }
  if (c.visit != null){
    const pl = byId(c.visit);
    if (pl) c2 += iSub('방문 중', iLine(cardRef(pl.type)));
  }
  if (c.duel != null){
    const op = byId(c.duel);
    if (op) c2 += iSub('대결 중', iLine(cardRef(op.type)));
  }
  if (d.devour){
    const eaten = (c.eaten || []).filter(r => DEFS[r.type]);
    c2 += iSub('버린 카드 — 최근 순, 아무거나 꺼낼 수 있음', eaten.length ? iChips(eaten.map(r => cardRef(r.type))) : iNone('없음'));
  }
  if (d.kind === 'container'){
    c2 += iSub('담긴 카드', c.count && c.fill && DEFS[c.fill] ? iLine(`${cardRef(c.fill)} ×${c.count}`) : iNone('비어 있음'));
  }
  if (isQuest){
    const g = c.giver != null ? byId(c.giver) : null;
    if (g) c2 += iSub('발주', iLine(cardRef(g.type)));
    if (c.stack.length) c2 += iSub('올려놓은 카드', iChips(c.stack.map(cardRef)));
  }

  // ③ 조합·출현
  let c3 = '';
  if (d.loot) c3 += iSub('전리품', iChips(d.loot.map(cardRef)));
  if (!['character', 'package', 'quest', 'creature'].includes(d.kind)){
    const { reach, use } = comboLists(c.type);
    c3 += iSub('도달하는 조합', reach.join('') || iNone('없음'));
    c3 += iSub('할 수 있는 조합', use.join('') || iNone('없음'));
  }
  if (d.yields) c3 += iSub('나오는 카드 — 게이지마다 하나', oddsChips(d.yields));
  if (d.kind === 'package' && d.fixed) c3 += iSub('들어 있는 카드', iChips(d.fixed.map(cardRef)));
  else if (d.kind === 'package'){
    if (c.contents === 'first') c3 += iSub('확정', iChips([cardRef('knight'), cardRef('god')]));
    c3 += iSub(`무작위 ${PACK_DRAW}장 — 한 장마다`, oddsChips(POOL.slice().sort((x, y) => y[1] - x[1])));
  }
  if (isQuest){
    const rs = c.recipes || (c.recipe ? [c.recipe] : []);
    if (c.recipeId && RECIPE_BY_ID.has(c.recipeId)) c3 += iSub('조합식', iLine(rich(recipeText(RECIPE_BY_ID.get(c.recipeId)))));   // 태그 조합도 그대로
    else if (rs.length) c3 += iSub('조합식', rs.map(([a, b, o]) => iLine(`${cardRef(a)} + ${cardRef(b)} → ${cardRef(o)}`)).join(''));
    if (!fromBook && reqReward(c)) c3 += iSub('보상', `<div class="i-pre">${rich(reqReward(c))}</div>`);
  }

  const cell = (title, body) => `<div class="i-cell"><h4>${title}</h4>${body || iNone('—')}</div>`;
  return head + `<div class="i-grid">${cell('수치', c1)}${cell('상태', c2)}${cell('조합·출현', c3)}</div>`;
}
// 인스펙터 조합 두 가지: 이 카드에 도달하는 조합 / 이 카드로 할 수 있는 조합
//   발견한 조합(S.found)은 전부 보여주고, 모르는 칸은 ???
//   익히기는 날것마다 한 줄 — 조합을 알고 그 익힌 카드도 본 적 있어야 공개
const UNK = '<span class="i-muted">???</span>';
const sideHtml = sd => rich(sideText(sd));
const comboLine = (a, b, out) => iLine(`${a} + ${b} → ${out}`);
function comboLists(t){
  const reach = [], use = [];
  const found = r => S.found.includes(r.id);
  for (const r of RECIPES){
    if (r.cook){
      for (const raw of Object.keys(DEFS)){
        const ck = DEFS[raw].cooked;
        if (!ck || !sideMatch(r.b, raw)) continue;
        const known = found(r) && S.seen.includes(ck);
        if (ck === t) reach.push(known ? comboLine(sideHtml(r.a), cardRef(raw), cardRef(t)) : comboLine(UNK, UNK, cardRef(t)));
        if (raw === t) use.push(known ? comboLine(cardRef(t), sideHtml(r.a), cardRef(ck)) : comboLine(cardRef(t), UNK, UNK));
      }
      if (sideMatch(r.a, t)) use.push(found(r) ? comboLine(cardRef(t), sideHtml(r.b), esc(outText(r))) : comboLine(cardRef(t), UNK, UNK));
      continue;
    }
    const outs = r.out || [];
    if (outs.includes(t)){
      reach.push(found(r)
        ? comboLine(sideHtml(r.a), sideHtml(r.b), rich(outText(r)))
        : comboLine(UNK, UNK, cardRef(t) + (outs.length > 1 ? ', ' + UNK : '')));
    }
    const aM = sideMatch(r.a, t), bM = sideMatch(r.b, t);
    if (aM || bM){
      const other = aM ? r.b : r.a;
      use.push(found(r) ? comboLine(cardRef(t), sideHtml(other), rich(outText(r))) : comboLine(cardRef(t), UNK, UNK));
    }
  }
  return { reach, use };
}

  const html = c ? `<div class="i-body">${inspectorHtml(c)}</div>${portrait}` : '<div class="i-empty">카드를 선택하여 상세정보 보기</div>';

// ── 챕터 점프 (플레이 테스트용 · 시스템 메뉴, 카드 아님) ──
//   그 챕터의 quest가 나오기 직전 상태를 만들고, quest는 평소 로직(갓·기사 점검)이 냄
//   flags: 진행 기록 / knight: 기사 상태 / seen: 이미 본 카드 / found: 이미 발견한 조합 / cards: 테이블에 깔 카드
//   seen에 앞으로 만들 카드를 넣으면 만들기 quest가 바로 완료되므로 넣지 않음
const CH_REQ   = { requestsGiven: 1, godSettles: 1 };
const CH_COMBO = Object.assign({}, CH_REQ, { comboGiven: true, comboDone: true, discovered: true });
const CH_SEEN_FOOD = ['quest', 'marrow', 'handaxe', 'ember', 'tinder', 'campfire', 'clam', 'roastclam', 'carcass', 'meat', 'hide', 'roastmeat', 'roastberry'];
const CH_FOUND_FOOD = ['marrow', 'handaxe', 'ember', 'tinder', 'campfire', 'clam', 'butcher', 'cook'];
const CH_PEACE = Object.assign({}, CH_COMBO, { knightStage: 5, huntGiven: true, hunted: true, fireGiven: true, bedGiven: true, swordDone: true, shieldDone: true, readySaid: true });
const CHAPTERS = [
  { title: '처음 — 첫 package', start: true },
  { title: '갓: 아무거나 3개만 줘봐',
    cards: ['stone', 'stone', 'bone', 'berry', 'twig'] },
  { title: '갓: 골수 만들기',
    flags: CH_REQ, seen: ['quest'],
    cards: ['stone', 'bone', 'bone', 'berry', 'grass'] },
  { title: '기사: 뼛가루의 치유력',
    flags: CH_COMBO, seen: ['quest', 'marrow'], found: ['marrow'],
    cards: ['stone', 'bone', 'bone', 'bone', 'berry'] },
  { title: '기사: 밥이 보약 + 갓: 사냥 quest',
    flags: Object.assign({}, CH_COMBO, { knightStage: 2 }), knight: { hp: 0, status: ['허기짐'] },
    seen: ['quest', 'marrow'], found: ['marrow'],
    cards: ['stone', 'stone', 'stone', 'animal', 'flint', 'grass', 'twig', 'shell', 'berry'] },
  { title: '기사: 잠이 보약 + 갓: 신의 품에서',
    flags: Object.assign({}, CH_COMBO, { knightStage: 3, huntGiven: true, hunted: true, fireGiven: true }), knight: { hp: 6, status: [] },
    seen: CH_SEEN_FOOD, found: CH_FOUND_FOOD,
    cards: ['campfire', 'grass', 'grass', 'twig', 'berry'] },
  { title: '기사: 무기·방패를 들어라',
    flags: Object.assign({}, CH_COMBO, { knightStage: 4, huntGiven: true, hunted: true, fireGiven: true, bedGiven: true }), knight: { hp: 10, status: [] },
    seen: CH_SEEN_FOOD.concat(['bedding']), found: CH_FOUND_FOOD.concat(['bedding']),
    cards: ['hilt', 'plank', 'campfire', 'bedding', 'stone'] },
  { title: '갓: 마음의 평화',
    flags: CH_PEACE,
    knight: { hp: 10, status: [], equip: { '무기': 'hilt', '방패': 'plank' } },
    seen: CH_SEEN_FOOD.concat(['bedding', 'hilt', 'plank']), found: CH_FOUND_FOOD.concat(['bedding']),
    cards: ['handaxe', 'hide', 'hide', 'stone', 'stone', 'stone', 'berry', 'campfire'] },
  { title: '갓: 마음의 평화 마지막 → 갓 파워! 산',
    flags: Object.assign({}, CH_PEACE, { peaceGiven: true, stored: true }),
    knight: { hp: 10, status: [], equip: { '무기': 'hilt', '방패': 'plank' } },
    seen: CH_SEEN_FOOD.concat(['bedding', 'hilt', 'plank', 'tannedhide', 'sack']), found: CH_FOUND_FOOD.concat(['bedding', 'tan', 'sack']),
    cards: [['sack', { fill: 'stone', count: 1 }], 'stone', 'stone', 'stone', 'berry', 'campfire'],
    after: () => givePeaceQuest(3) },                   // 쓸어담기 quest부터
  { title: '산: 나무 · 토끼 · 곰 / 크리처 대결 / 신의 입',
    flags: Object.assign({}, CH_PEACE, { peaceGiven: true, stored: true, swept: true, peaceDone: true, mountainGiven: true, mouthGiven: true }),
    knight: { hp: 10, status: [], equip: { '무기': 'hilt', '방패': 'plank' } },
    seen: CH_SEEN_FOOD.concat(['bedding', 'hilt', 'plank', 'tannedhide', 'sack', 'mountain', 'godmouth']), found: CH_FOUND_FOOD.concat(['bedding', 'tan', 'sack']),
    cards: ['mountain', 'godmouth', 'campfire', 'berry', 'animal', 'bear', 'handaxe', 'marrow'] },

  { title: '강가 · 던전',                                  // v0.87.0
    flags: Object.assign({}, CH_PEACE, { peaceGiven: true, stored: true, swept: true, peaceDone: true, mountainGiven: true, mouthGiven: true, mouthTaught: true, mountainWorkDone: true, riverGiven: true }),
    knight: { hp: 10, status: [], equip: { '무기': 'hilt', '방패': 'plank' } },
    seen: CH_SEEN_FOOD.concat(['bedding', 'hilt', 'plank', 'tannedhide', 'sack', 'mountain', 'godmouth', 'river', 'dungeon']), found: CH_FOUND_FOOD.concat(['bedding', 'tan', 'sack']),
    cards: ['river', 'dungeon', 'mountain', 'godmouth', 'campfire', 'shell', 'berry'] },
];
function startChapter(ch){
  if (ch.start){ newGame(); toast('⏭ ' + ch.title); return; }
  S = {
    cards: [], seen: ['package', 'knight', 'god'], found: (ch.found || []).slice(),
    flags: Object.assign({ discovered: false, requestsGiven: 0 }, ch.flags), nextId: 1, z: 1,
  };
  for (const t of (ch.seen || [])) if (!S.seen.includes(t)) S.seen.push(t);
  const { w, h } = tableSize();
  addCard('god', w * 0.06, h * 0.2, null, true);
  addCard('knight', w * 0.06, h * 0.58, JSON.parse(JSON.stringify(ch.knight || {})), true);   // 정의를 건드리지 않게 복사
  for (const e of ch.cards){
    const [t, extra] = Array.isArray(e) ? e : [e];   // 'stone' 또는 ['sack', { fill, count }]
    const p = findSpot(w * 0.55, h * 0.5);
    addCard(t, p.x, p.y, extra ? JSON.parse(JSON.stringify(extra)) : null, true);                  // 조용히 (콜렉터북 등록 연출 없이)
  }
  save();
  renderAll();
  scheduleGod();
  if (ch.after) ch.after();
  toast('⏭ ' + ch.title);
}
const chaptersEl = document.getElementById('chapters');
chaptersEl.innerHTML = '<div class="ch-head">테스트용 챕터 점프 — 지금 진행이 지워짐</div>'
  + CHAPTERS.map((ch, i) => `<button data-ch="${i}">${i}. ${esc(ch.title)}</button>`).join('');
document.getElementById('chapterBtn').addEventListener('click', () => { chaptersEl.hidden = !chaptersEl.hidden; });
chaptersEl.addEventListener('click', e => {
  const b = e.target.closest('[data-ch]');
  if (!b) return;
  chaptersEl.hidden = true;
  clearRuntime();
  startChapter(CHAPTERS[+b.dataset.ch]);
});
document.addEventListener('pointerdown', e => {
  if (!chaptersEl.hidden && !e.target.closest('#chapters, #chapterBtn')) chaptersEl.hidden = true;   // 바깥 누르면 닫힘
});
function onResize(){
  measure();
  for (const c of S.cards){
    const p = clampPos(c.x, c.y);
    c.x = p.x; c.y = p.y;
  }
  renderAll();
}
window.addEventListener('resize', onResize);
// 상단 UI 막대 높이 → 테이블은 그 아래부터 (v0.59.0). 버튼이 줄바꿈돼 막대 높이가 바뀌면 카드도 테이블 안으로 다시 맞춤
const topbar = document.getElementById('topbar');
function syncTopH(){ document.documentElement.style.setProperty('--top-h', topbar.offsetHeight + 'px'); }
new ResizeObserver(() => {
  const before = table.clientHeight;
  syncTopH();
  if (S && table.clientHeight !== before) onResize();
}).observe(topbar);

validateRecipes();
(() => {
  const types = Object.keys(DEFS);
  for (const x of types) for (const y of types){
    if (usableRecipes(x, y).length){ COMBOABLE.add(x); COMBOABLE.add(y); }
  }
})();

// 고착 점검 안전망 — 상태 변화 없이도 주기적으로 한 번씩 본다
setInterval(() => { if (!paused && !drag && !tear && !busy){ checkSettle(); godCheck(); trappedHint(false); } }, 5000);
setInterval(restTick, 1000);                   // 체력 회복 장소
setInterval(yieldTick, 1000);                  // 산: 나무 게이지
setInterval(duelTick, DUEL_MS);                // 크리처 대결
setInterval(animalTick, 1000);                 // 동물 홉핑
setInterval(renderInspector, 500);             // 인스펙터 실시간 갱신 (체력·게이지·진행)

syncTopH();
measure();
if (load()){
  for (const c of S.cards){
    const p = clampPos(c.x, c.y);
    c.x = p.x; c.y = p.y;
  }
  checkSettle();
  renderAll();
  scheduleGod();
  setTimeout(() => trappedHint(true), 700);
} else {
  newGame();
}
requestAnimationFrame(physStep);
})();
</script>
</body>
</html>
