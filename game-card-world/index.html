  if (part.kind === 'eat'){                                   // v0.141.0: 신의 입 기록에서 한 장 되돌리기 (카드 상태 그대로)
    const rec = (c.eaten || []).splice(part.idx, 1)[0];
    if (!rec || !DEFS[rec.type]) return false;
    S.flags.mouthTook = true;                                 // 신의 입 quest "도로 뱉어"
    const p = findSpot(c.x, c.y + CH + 12);
    const nc = addCard(rec.type, p.x, p.y, rec, true);
    spawned.delete(nc.id);
    popFrom.set(nc.id, { x: c.x, y: c.y });
    bumpIds.add(c.id);
    return true;
  }
  if (part.kind === 'held'){
    if (!c.fill || !c.count || !DEFS[c.fill]) return false;
    const type = c.fill;
    c.count--;
    if (!c.count) delete c.fill;
    S.flags.tookOut = true;                                   // 마음의 평화 "하나 꺼내기"
    const p = findSpot(c.x, c.y + CH + 12);
    const nc = addCard(type, p.x, p.y, null, true);
    spawned.delete(nc.id);
    popFrom.set(nc.id, { x: c.x, y: c.y });
    bumpIds.add(c.id);
    return true;
  }
  if (part.kind === 'equip'){
    const sl = part.slot;
    const type = c.equip && c.equip[sl];
    if (!type || !DEFS[type]) return false;
    const before = statSnap(c);
    const lv = (c.equipLv || {})[sl] || 0;                    // 강화 레벨 유지
    delete c.equip[sl];
    if (c.equipLv) delete c.equipLv[sl];
    const p = findSpot(c.x + CW * 0.9, c.y);
    const nc = addCard(type, p.x, p.y, lv ? { lv } : null, true);
    spawned.delete(nc.id);
    popFrom.set(nc.id, { x: c.x, y: c.y });
    bumpIds.add(c.id);
    statDeltaFloat(c, before);
    return true;
  }
  return false;
}

function confirmModal(text, onOk){
  const wrap = document.createElement('div');
  wrap.className = 'cmodal';
  wrap.innerHTML = `<div class="cm-box" role="dialog" aria-modal="true"><p>${esc(text)}</p>`
    + '<div class="cm-btns"><button type="button" class="btn cm-no">취소</button><button type="button" class="btn cm-ok">확인</button></div></div>';
  const key = e => { if (e.key === 'Escape') close(false); };
  function close(ok){
    wrap.remove();
    document.removeEventListener('keydown', key);
    if (ok) onOk();
  }
  wrap.addEventListener('pointerdown', e => { e.stopPropagation(); if (e.target === wrap) close(false); });
  wrap.querySelector('.cm-no').addEventListener('click', () => close(false));
  wrap.querySelector('.cm-ok').addEventListener('click', () => close(true));
  document.addEventListener('keydown', key);
  document.body.appendChild(wrap);
  wrap.querySelector('.cm-no').focus();
}

// 붙음·방문으로 이어진 카드 전부 (사슬 포함)
function linkedGroup(c){
  const ids = new Set([c.id]);
  const queue = [c];
  while (queue.length){
    const x = queue.shift();
    for (const m of S.cards){
      if (ids.has(m.id)) continue;
      if (bodyOf(m) === bodyOf(x) || m.visit === x.id || x.visit === m.id || m.dun === x.id || x.dun === m.id){
        ids.add(m.id);
        queue.push(m);
      }
    }
  }
  return ids;
}
// v0.116.0: 카드를 끌면 그 카드로 할 수 있는 상대만 또렷하게, 나머지는 흐리게 (놓으면 풀림)

//   v0.118.0: 지금 막힌 경우(자리 참·자루 가득·빈사라 대결 불가 등, ev.full)도 흐림
//   (v0.100.0 의 "해봤는데 안 되던 조합만 흐리게"는 폐기)
function dimOthers(c){
  const group = linkedGroup(c);                               // 같이 끌려오는 묶음은 그대로

    const ev = evaluate(c, o);
    if (o.id === c.id || group.has(o.id) || (ev && !ev.full)) continue;
    const el = els.get(o.id);

}

function startDrag(c, px, py, pid, o){

  const group = linkedGroup(c);

  members.forEach((m, i) => {
    m.z = ++S.z;

    id: c.id, pid, el,
    offX: px - c.x, offY: py - c.y,
    sx: px, sy: py,
    moved: !!(o.fromContainer || o.fromMouth),
    ox: o.ox, oy: o.oy,
    fromContainer: o.fromContainer || null,

// 대상 고르기: 끌고 있는 카드와 겹친 넓이로 판단 (포인터 아래만 보던 v0.7.0보다 넓음)
//   카드 넓이의 15% 이상 겹친 카드 중에서, 되는 조합이면 2배 가산해 가장 점수 높은 카드
//   겹친 카드가 없으면 포인터 아래 카드
function pickTarget(clientX, clientY, c){
  let best = null, bestScore = 0;
  const minArea = CW * CH * 0.15;
  for (const o of S.cards){
    if (o.id === c.id || bodyOf(o) === bodyOf(c)) continue;
    const ox = Math.min(c.x, o.x) + CW - Math.max(c.x, o.x);
    const oy = Math.min(c.y, o.y) + CH - Math.max(c.y, o.y);
    if (ox <= 0 || oy <= 0) continue;
    const area = ox * oy;
    if (area < minArea) continue;
    const ev = evaluate(c, o);
    const score = area * (ev && !ev.full ? 2 : 1);
    if (score > bestScore){ bestScore = score; best = o; }
  }
  if (best) return best;
  for (const h of document.elementsFromPoint(clientX, clientY)){
    const ce = h.closest ? h.closest('.cw') : null;
    if (ce && !ce.classList.contains('half') && +ce.dataset.id !== c.id){
      const t = byId(+ce.dataset.id);
      if (t) return t;
    }
  }
  return null;
}

  if (!t) return;

  if (!ev || ev.full) el.classList.add('no');
}
function onMove(e){

    if (!pan.moved && Math.abs(dx) < 4) return;

function moveDragTo(clientX, clientY){
  if (!drag) return;
  const r = table.getBoundingClientRect();
  const px = clientX - r.left + table.scrollLeft, py = clientY - r.top;
  if (!drag.moved && Math.hypot(px - drag.sx, py - drag.sy) < 4) return;
  drag.moved = true;
  const c = byId(drag.id);
  if (!c) return;
  const p = clampPos(px - drag.offX, py - drag.offY);
  const lim = attachLimits(c);                                  // 붙음 묶음은 통째로 화면 안에
  p.x = Math.max(lim.minX, Math.min(p.x, Math.max(lim.minX, lim.maxX)));
  if (lim.maxY != null && lim.maxY >= lim.minY) p.y = Math.min(Math.max(p.y, lim.minY), lim.maxY);
  c.x = p.x; c.y = p.y;
  drag.el.style.left = p.x + 'px';
  drag.el.style.top = p.y + 'px';
  setTarget(pickTarget(clientX, clientY, c), c);
}

// 되돌아가기 — 매 프레임 실제 위치를 옮김
//   CSS 전환으로 겉모습만 옮기면 붙은 request가 따라오지 않고, 밀어내기도 멈춰 어색하게 겹쳤음
let returning = null;         // { id, fx, fy, tx, ty, t0, dur, done }
const heldId = () => drag ? drag.id : (returning ? returning.id : null);   // 끌거나 되돌아가는 중인 카드

function stepReturn(){
  if (!returning) return false;
  const r = returning;
  const c = byId(r.id);
  if (!c){ returning = null; return false; }
  const t = Math.min(1, (performance.now() - r.t0) / r.dur);
  const e = 1 - Math.pow(1 - t, 3);                           // 끝에서 부드럽게 멈춤
  c.x = r.fx + (r.tx - r.fx) * e;
  c.y = r.fy + (r.ty - r.fy) * e;

    vel.delete(c.id);

// 원래 자리가 그사이 다른 카드로 막혔으면 가장 가까운 빈자리 (자기 묶음은 빈자리 판단에서 뺌)
function freeSpotFor(c, x, y){
  const group = linkedGroup(c);
  const all = S.cards;
  S.cards = all.filter(o => !group.has(o.id));
  const p = findSpot(x, y);
  S.cards = all;
  return p;
}
function bounce(c, d0){

    // 꺼낸 카드를 못 놓으면 자루로 돌아감 (자리가 있고 같은 종류일 때)
    const box = byId(d0.fromContainer);
    if (box && (!box.count || box.fill === c.type) && (box.count || 0) < holdOf(box)){
      tweenTo(c, box.x, box.y, () => {
        removeCard(c.id);
        storeInto(box, c.type);

      });
      return;
    }
  }
  if (d0.fromMouth){
    // 신의 입에서 꺼낸 카드를 못 놓으면 기록 제자리로 돌아감
    const mouth = byId(d0.fromMouth.id);
    if (mouth){
      tweenTo(c, mouth.x, mouth.y, () => {
        removeCard(c.id);
        const from = swallowFrom(mouth);

}
function onUp(e){
  if (pan && e.pointerId === pan.pid){
    if (!pan.moved) setSelected(null);                           // 끌지 않았으면 빈 곳 탭 = 인스펙터 비움
    pan = null;
    return;
  }
  if (tear && e.pointerId === tear.pid){ endTear(); return; }
  if (!drag || e.pointerId !== drag.pid) return;
  const c = byId(drag.id);
  const t = drag.target;
  clearTarget();
  drag.el.classList.remove('dragging');
  const d0 = drag;
  drag = null;
  clearDim();
  if (!c || !d0.moved){
    if (c && d0.tapPart && tapTakeOut(c, d0.tapPart)){ afterChange(); return; }   // v0.134.0: 담긴 카드·장비 칸 탭 = 한 장 빼기
    if (c) setSelected(c.id);
    renderAll();
    return;
  }   // 탭 → 인스펙터
  if (t && byId(t.id)){
    const ev = evaluate(c, t);
    if (ev && applyEv(ev, c, t)){ afterChange(); return; }
    // v0.131.0: 지도는 더 이상 조합되지 않음 — 실패로 되돌리지 않고 놓은 자리에 그대로 (자리 차지)
    if (DEFS[c.type].kind === 'map' || DEFS[t.type].kind === 'map'){ afterChange(); return; }
    bounce(c, d0);                                // 쌓기 실패 → 되돌아감
    return;
  }
  afterChange();                                  // 빈 자리 → 이동
}

// 카드 위에 +N 같은 수치를 띄움 (떠오르며 사라짐)
// v0.102.0: 장비가 바뀌어 달라진 공격·방어를 캐릭터 머리 위에 띄움 (오르면 녹색 +, 내리면 빨강 -)
function statDeltaFloat(c, before){
  const now = { atk: atkOf(c), def: defOf(c) };
  const parts = [];
  for (const k of ['atk', 'def']){
    const dv = now[k] - before[k];
    if (!dv) continue;
    parts.push(`<span class="${dv > 0 ? 'up' : 'down'}">${si(k)}${dv > 0 ? '+' : ''}${dv}</span>`);
  }
  if (parts.length) floatText(c, parts.join(''), '', true);   // v0.111.0: HTML 그대로 (span 태그가 글자로 보이던 버그)
}
const statSnap = c => ({ atk: atkOf(c), def: defOf(c) });
function floatText(c, text, cls, raw){
  const f = document.createElement('div');
  f.className = 'float' + (cls ? ' ' + cls : '');
  // v0.111.0: raw = 이미 만든 HTML (자리표만 그림으로 바꿈). 아니면 글자로 보고 이스케이프
  f.innerHTML = raw ? richRaw(text) : rich(text);
  f.style.left = (c.x + CW / 2) + 'px';
  f.style.top = (c.y - CH * 0.05) + 'px';
  table.appendChild(f);
  setTimeout(() => f.remove(), 1250);
}

// ── 동물 홉핑 ─────────────────────────────────────────
//   1초마다 일정 거리를 뜀. 뛰는 동안 카드가 세로로 길어졌다 눌림
const HOP_MS = 320;
const hops = new Map();          // id → { fx, fy, tx, ty, t0 }
function animalTick(){
  if (!S || paused || busy) return;
  const hid = heldId();
  const { w, h } = tableSize();
  for (const c of S.cards){
    if (!DEFS[c.type].hops || hops.has(c.id)) continue;
    if (hid != null && bodyOf(byId(hid)) === bodyOf(c)) continue;   // 잡혀 있으면 안 뜀
    if (tear && tear.id === c.id) continue;
    if (c.duel != null) continue;                             // 대결 중엔 안 뜀
    const dd = DEFS[c.type];
    const dist = CW * 0.55 * (dd.hopScale || 1);             // 곰은 2배
    let ang = Math.random() * Math.PI * 2;
    // 가장자리 근처면 절반 확률로 안쪽을 향해 뜀
    const nearEdge = c.x < CW || c.y < TOP_PAD + CH * 0.5 || c.x > w - CW * 2 || c.y > h - CH * 1.5;
    if (nearEdge && Math.random() < 0.5) ang = Math.atan2(h / 2 - (c.y + CH / 2), w / 2 - (c.x + CW / 2)) + (Math.random() - 0.5);
    const p = clampPos(c.x + Math.cos(ang) * dist, c.y + Math.sin(ang) * dist);
    const anim = dd.hopAnim || 'hop';
    hops.set(c.id, { fx: c.x, fy: c.y, tx: p.x, ty: p.y, t0: performance.now(), ms: dd.hopMs || HOP_MS, anim });
    const el = els.get(c.id);
    if (el){
      el.classList.remove('hop', 'run', 'spawn', 'pop', 'bump');   // 끝난 등장·튕김 클래스를 치우고
      void el.offsetWidth;                                  // 애니메이션 다시 시작
      el.classList.add(anim);
    }
  }
}
function stepHops(){
  if (!hops.size) return false;
  const hid = heldId();
  let moved = false;
  for (const [id, hp] of hops){
    const c = byId(id);
    if (!c || (hid != null && bodyOf(byId(hid)) === bodyOf(c))){ hops.delete(id); continue; }
    const t = Math.min(1, (performance.now() - hp.t0) / hp.ms);
    const e = 1 - Math.pow(1 - t, 2);
    c.x = hp.fx + (hp.tx - hp.fx) * e;
    c.y = hp.fy + (hp.ty - hp.fy) * e;
    moveEl(c);
    moved = true;
    if (t >= 1){
      hops.delete(id);
      const el = els.get(id);
      if (el) setTimeout(() => el.classList.remove(hp.anim), 80);
    }
  }
  return moved;
}

// ── 크리처: 무기로 한 방 / 캐릭터와 대결 ─────────────────
//   무기를 쌓음: 무기 공격력 ≥ 크리처 남은 체력이면 바로 쓰러뜨리고 전리품. 아니면 "무기의 공격력 낮음"
//   캐릭터를 쌓음: 대결 — 캐릭터와 크리처가 **동시에** 때리기를 한쪽이 쓰러질 때까지 반복 (DUEL_MS마다 한 번)
//     v0.95.0: 선공/후공 없앰 — 한 방에 잡아도 상대의 반격은 그대로 맞음 (토끼를 무피해로 잡던 문제)
//     피해 = 공격력 − 상대 방어 (최소 0). 크리처도 공방체 (v0.52.0, 지금 방어 0)
//     승리: 전리품. 패배: 캐릭터 빈사, 크리처는 남은 체력 그대로
//     둘 다 피해를 못 주면 바로 끝 (무승부)
const DUEL_MS = 800;
function defOf(c){
  const d = DEFS[c.type];
  return (d.baseDef || 0) + Object.values(c.equip || {}).reduce((sum, ty) => sum + ((DEFS[ty] && DEFS[ty].defense) || 0), 0);
}
function killCreature(cr){
  const x = cr.x, y = cr.y;
  hops.delete(cr.id);
  removeCard(cr.id);
  S.flags.hunted = true;                                      // v0.83.0: 사냥 quest
  toast(`${ic(cr.type)} ${DEFS[cr.type].name} 쓰러뜨림`);
  const omitted = [];
  for (const t of (DEFS[cr.type].loot || [])){
    if (!canSpawn(t)){ omitted.push(t); continue; }            // 월드에 5장이면 그 전리품만 누락
    const p = findSpot(x, y);
    const nc = addCard(t, p.x, p.y);
    spawned.delete(nc.id);
    popFrom.set(nc.id, { x, y });
  }
  omitToast(omitted);
}
function startDuel(ch, cr){
  delete ch.visit;
  delete ch.visitSeq;
  hops.delete(cr.id);
  ch.duel = cr.id;
  cr.duel = ch.id;
  setStatus(ch, [], ['대결']);
  setStatus(cr, [], ['대결']);
  // 크리처 왼쪽, 캐릭터 오른쪽으로 나란히 (캐릭터에 붙은 quest는 그 오른쪽)
  const gap = 12;
  const lim = attachLimits(ch);
  ch.x = Math.max(8 + CW + gap, Math.min(cr.x + CW + gap, lim.maxX));
  ch.y = clampPos(ch.x, cr.y).y;
  cr.x = ch.x - CW - gap;
  cr.y = ch.y;
  bumpIds.add(ch.id);
  bumpIds.add(cr.id);
  toast(`${si('atk')} ${DEFS[ch.type].name} vs ${DEFS[cr.type].name} — 대결`);
}
function endDuel(ch, cr){
  if (ch){ delete ch.duel; setStatus(ch, ['대결'], []); }
  if (cr){ delete cr.duel; delete cr.turn; setStatus(cr, ['대결'], []); }
}
function duelTick(){
  if (!S || paused || busy) return;
  let changed = false;
  for (const cr of S.cards.slice()){
    if (DEFS[cr.type].kind !== 'creature' || cr.duel == null) continue;
    const ch = byId(cr.duel);
    if (!ch || ch.duel !== cr.id){ endDuel(null, cr); changed = true; continue; }
    const charDmg = Math.max(0, atkOf(ch) - defOf(cr));
    const foeDmg = DEFS[ch.type].immortal ? 0 : Math.max(0, atkOf(cr) - defOf(ch));   // v0.88.0: 갓은 피해를 안 받음 → 서로 못 이기면 대결 끝
    if (charDmg <= 0 && foeDmg <= 0){
      endDuel(ch, cr);
      toast(`서로 피해를 못 줌 — 대결 끝`);
      changed = true;
      continue;
    }
    // 동시 타격: 양쪽이 같은 번에 피해를 주고받음 → 둘 다 쓰러질 수 있음
    cr.hp = Math.max(0, cr.hp - charDmg);
    ch.hp = Math.max(0, ch.hp - foeDmg);
    if (charDmg > 0) floatText(cr, `-${charDmg}`);
    if (foeDmg > 0) floatText(ch, `-${foeDmg}`);
    bumpIds.add(cr.id);
    bumpIds.add(ch.id);
    const crDown = cr.hp <= 0, chDown = ch.hp <= 0;
    if (crDown || chDown){
      endDuel(ch, cr);
      if (crDown && chDown) toast(`💀 ${DEFS[ch.type].name} · ${DEFS[cr.type].name} 서로 쓰러짐`);
      else if (crDown) toast(`🏆 ${DEFS[ch.type].name} 승리`);
      else toast(`💀 ${DEFS[ch.type].name} 패배 — 빈사`);
      if (chDown) setStatus(ch, [], ['빈사']);          // 패배: 캐릭터 빈사, 크리처는 체력 회복 안 함
      if (crDown) killCreature(cr);                            // 승리: 전리품 (둘 다 쓰러져도 전리품은 나옴)
    }
    changed = true;
  }
  if (changed) afterChange();
}

// ── 체력 회복 장소 ─────────────────────────────────────
//   "체력 회복 lvN" 장소를 방문한 캐릭터는 15초 / N 마다 체력 +1
//   장소마다 게이지 하나. 다 차면 방문자 전원 한꺼번에 +1. 빈사는 회복 안 됨 (빈사 치유가 필요)
const REST_MS = 15000;                         // lv1 = 15초에 +1
function pieValue(pl){
  if (DEFS[pl.type].mill) return Math.min(1, (pl.millPts || 0) / DEFS[pl.type].mill.need);   // v0.134.0: 제재소 (방문 인원 게이지)
  if (DEFS[pl.type].yields) return Math.min(1, (pl.yieldPts || 0) / DEFS[pl.type].yieldNeed);   // 산: 나무 게이지
  const lv = tagLevel(DEFS[pl.type], '체력 회복');
  if (!lv || !visitorsOf(pl).length) return 0;
  return Math.min(1, (pl.restMs || 0) / (REST_MS / lv));
}
// 게이지는 장소 하나에 하나: 첫 방문자가 들어오면 차오르기 시작, 다 차는 순간 방문자 전원이 한꺼번에 +1
function restTick(){
  if (!S || paused) return;
  let hpChanged = false;
  for (const pl of S.cards){
    const lv = tagLevel(DEFS[pl.type], '체력 회복');
    if (!lv) continue;
    const vs = visitorsOf(pl);
    if (!vs.length){ pl.restMs = 0; continue; }            // 모두 떠나면 게이지 초기화
    const healable = vs.filter(v => v.hp != null && v.hp < DEFS[v.type].hp && !statusOf(v).includes('빈사'));
    if (!healable.length) continue;                         // 회복할 사람이 없으면 게이지 멈춤
    const period = REST_MS / lv;
    pl.restMs = (pl.restMs || 0) + 1000;
    if (pl.restMs < period) continue;
    pl.restMs -= period;
    for (const v of healable){
      v.hp = Math.min(DEFS[v.type].hp, v.hp + 1);
      floatText(v, `${si('hp')} +1`);                       // 쉬어서 오른 체력
      bumpIds.add(v.id);
    }
    bumpIds.add(pl.id);
    hpChanged = true;
  }
  if (hpChanged){ afterChange(); return; }
  for (const pl of S.cards){                    // 게이지만 갱신
    const el = els.get(pl.id);
    const pie = el && el.querySelector('.pie');
    if (pie) pie.style.setProperty('--p', pieValue(pl));
  }
}

// ── 산: 방문한 캐릭터의 공격력만큼 게이지가 참 → 다 차면 나무 ──
//   1초마다 방문자 공격력 합계만큼 +. 공격력 0이면 +0 (아무리 기다려도 안 나옴)
//   방문자가 떠나도 게이지는 남음
function atkOf(c){
  const d = DEFS[c.type];
  const eq = c.equip || {};
  // v0.97.0: 장비한 무기의 강화 레벨(equipLv)만큼 공격력이 더 오름
  return (d.baseAtk || 0) + Object.keys(eq).reduce((sum, sl) => sum + itemAtk(eq[sl], (c.equipLv || {})[sl]), 0);
}
const pickWeighted = table => {
  let r = Math.random() * table.reduce((sum, [, w]) => sum + w, 0);
  for (const [t, w] of table){ r -= w; if (r < 0) return t; }
  return table[table.length - 1][0];
};
// v0.71.0: 게이지 기반 — 산 gauge:'atk' 방문자 공격력 합계, 강가 gauge:'people' 방문 인원
//   v0.88.0: 빈사 캐릭터는 일하지 않음 — 게이지에 안 들어감
const gaugeAdd = (d, vs) => {
  const w = vs.filter(v => !statusOf(v).includes('빈사'));
  return d.gauge === 'people' ? w.length : w.reduce((sum, v) => sum + atkOf(v), 0);
};
function yieldTick(){
  if (!S || paused || busy) return;
  let made = false, progressed = false;
  for (const pl of S.cards){
    const d = DEFS[pl.type];
    if (!d.yields) continue;
    const vs = visitorsOf(pl);
    if (!vs.length){                                          // v0.134.0: 모두 떠나면 게이지 초기화 (생산시설 공통)
      delete pl.yieldRoll;
      if (pl.yieldPts){
        pl.yieldPts = 0;
        const el0 = els.get(pl.id);
        const pie0 = el0 && el0.querySelector('.pie');
        if (pie0) pie0.style.setProperty('--p', 0);
      }
      continue;
    }
    const add = gaugeAdd(d, vs);
    const before = pl.yieldPts || 0;
    pl.yieldPts = Math.min(d.yieldNeed, before + add);           // v0.136.0: 가득 차면 더 안 오름
    if (pl.yieldPts > before) floatText(pl, `+${pl.yieldPts - before}`, 'work');   // 게이지에 들어간 만큼
    const elG = els.get(pl.id);
    const pieG = elG && elG.querySelector('.pie');
    if (pieG) pieG.style.setProperty('--p', pieValue(pl));      // 기다리는 동안에도 가득 찬 게이지가 보이게
    if (pl.yieldPts >= d.yieldNeed){
      // v0.140.0: 나올 수 있는 카드가 전부 월드 5장이면 게이지가 가득 찬 채로 멈춤 (자리가 생기면 진행)
      //   하나라도 자리가 있으면 뽑음 → 뽑힌 카드가 5장이라 하나도 못 나오면 이번 생산은 누락 표시, 게이지 비우고 다음 진행
      //   (v0.136.0은 뽑은 결과를 붙잡고 기다려서, 다른 카드는 자리가 있어도 생산이 멈췄음)
      delete pl.yieldRoll;
      if (!d.yields.some(([t]) => [].concat(t).some(ty => canSpawn(ty)))) continue;
      pl.yieldPts = 0;
      const roll = [].concat(pickWeighted(d.yields));          // 나무 + 돌 · 토끼 · 곰
      if (!roll.some(ty => canSpawn(ty))){
        floatText(pl, `누락: ${roll.map(ty => DEFS[ty].name).join(', ')}`, 'work');   // v0.140.1: 기존 누락 표시와 같게
        if (pieG) pieG.style.setProperty('--p', 0);
        continue;
      }
      const miss = [];
      for (const ty of roll){
        if (!canSpawn(ty)){ miss.push(DEFS[ty].name); continue; }   // 월드 수량 초과
        const p = findSpot(pl.x, pl.y + CH + 12);
        const nc = addCard(ty, p.x, p.y);
        spawned.delete(nc.id);
        popFrom.set(nc.id, { x: pl.x, y: pl.y });              // 산에서 튀어나옴
        bumpIds.add(pl.id);
        made = true;
      }
      if (miss.length) floatText(pl, `누락: ${miss.join(', ')}`, 'work');
      // 채집 quest: 그 장소의 게이지가 찰 때마다 1번 (여러 장이 같이 나와도 1번, 월드 상한으로 누락돼도 1번)
      // v0.87.0: 산·강가 공통
      const gq = S.cards.find(c => c.type === 'quest' && c.goal === 'gather' && c.place === pl.type);
      if (gq && (gq.gathered || 0) < gq.need){ gq.gathered = (gq.gathered || 0) + 1; progressed = true; }
      const el = els.get(pl.id);
      const pie = el && el.querySelector('.pie');
      if (pie) pie.style.setProperty('--p', pieValue(pl));
      continue;
    }
    const el = els.get(pl.id);
    const pie = el && el.querySelector('.pie');
    if (pie) pie.style.setProperty('--p', pieValue(pl));
  }
  if (made || progressed) afterChange();
  else save();
}

// ── 첫 package: 안에 갇힌 갓이 모서리를 당기라고 함 ───
let lastNag = 0;
function trappedHint(first){
  if (!S) return;
  const pk = S.cards.find(c => c.type === 'package' && c.contents === 'first');
  if (!pk || tear || isTalking('god')) return;
  const now = Date.now();
  if (!first && now - lastNag < 9000) return;
  lastNag = now;
  if (first) say(LINES.trapped);
  else say(pick(LINES.trappedNag), priChance(1 / LINES.trappedNag.length));
}

// ── 필드 상태 복사 (시스템 메뉴) ──────────────────────
function fieldSnapshot(){
  const { w, h } = tableSize();
  const nameOf = id => { const o = byId(id); return o ? `${DEFS[o.type].name}#${o.id}` : null; };
  return {
    version: VERSION,
    time: new Date().toISOString(),
    table: { w, h, cardW: CW, cardH: CH },
    physics: phys,
    cards: S.cards.map(c => {
      const d = DEFS[c.type];
      const o = { id: c.id, type: c.type, name: d.name, x: Math.round(c.x), y: Math.round(c.y) };
      const tags = tagsOf(c);
      if (COMBOABLE.has(c.type)) tags.unshift('조합 가능');
      if (tags.length) o.tags = tags;
      if (c.hp != null) o.hp = `${c.hp}/${d.hp}`;
      if (d.slots){
        o.equip = {};
        for (const sl of d.slots) o.equip[sl] = c.equip && c.equip[sl] ? DEFS[c.equip[sl]].name : null;
      }
      if (c.visit != null) o.visit = nameOf(c.visit);
      if (c.contents) o.contents = c.contents;
      if (c.eaten) o.eaten = c.eaten.map(r => DEFS[r.type] ? DEFS[r.type].name : r.type);
      if (DEFS[c.type].devour) o.satisfied = c.satisfied || 0;
      if (DEFS[c.type].kind === 'container') o.held = c.fill ? `${DEFS[c.fill].name} ${c.count}/${DEFS[c.type].hold}` : '비어 있음';
      if (c.type === 'quest'){
        o.title = c.title;
        if (c.quest) o.quest = c.quest;
        o.giver = c.giver != null ? nameOf(c.giver) : null;
        o.progress = plain(reqProgress(c));
        o.reward = plain(reqReward(c));
        if (c.stack && c.stack.length) o.stack = c.stack.map(t => DEFS[t].name);
      }
      return o;
    }),
    seen: S.seen.map(t => DEFS[t].name),
    found: S.found,
    flags: S.flags,
  };
}
async function copyField(){
  const text = JSON.stringify(fieldSnapshot(), null, 2);
  try {
    await navigator.clipboard.writeText(text);
    toast('📋 필드 상태를 복사함');
  } catch (e) {
    // 클립보드 API가 막힌 환경 → 예전 방식으로 한 번 더
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
    if (ok) toast('📋 필드 상태를 복사함');
    else { toast('복사 실패 — 콘솔에 출력함'); console.log(text); }
  }
}

// ── 콜렉터북 (카드 아님) ──────────────────────────────
let bookOpen = false;          // 시트가 올라와 있나

let bookPending = new Set();   // 아직 등록 연출 전이라 ??? 로 보일 카드
let discoQ = [], discoRunning = false, discoTimer = null;
// 콜렉터북 탭 (v0.126.0): 캐릭터 · 크리처 · 장소 · 무기,방패,도구 · 패키지 · 재료(나머지 전부)
//   v0.137.0: 크리처(토끼·곰·고블린)·패키지(신의 선물·신의 구원·보물상자A) 탭 추가
const BOOK_TABS = [
  { key: 'char',  name: '캐릭터',        has: d => d.kind === 'character' },

const bookTabOf = id => {

let bookTab = 'char';
function renderBook(){

function setBookOpen(open){
  bookOpen = open;
  book.classList.toggle('open', open);
}
// 상단 버튼: 하단에서 올라오고, 다시 누르면 하단으로 사라짐
function toggleBook(){
  if (bookOpen){

  } else {
    bookManual = true;
    renderBook();
    setBookOpen(true);

// 새 카드 발견: 시트가 올라오고 칸마다 아이콘이 차례로 등록됨 → 잠시 뒤 내려감
function showDiscoveries(types){
  const add = types.filter(t => PAGE.ids.includes(t) && !discoQ.includes(t));
  if (!add.length) return;
  discoQ.push(...add);
  for (const t of add) bookPending.add(t);
  if (!discoRunning) runDiscoveries();
}
function runDiscoveries(){
  clearTimeout(discoTimer);
  if (!discoQ.length){
    discoRunning = false;
    if (bookManual){ setPaused(false); return; }   // 버튼으로 연 상태면 시트는 두고 게임만 재개
    // 등록이 끝나고 잠깐 보여준 뒤 내려감 → 다 내려가면 게임 재개
    discoTimer = setTimeout(() => {
      if (bookManual || discoRunning) return;
      setBookOpen(false);
      discoTimer = setTimeout(() => { if (!discoRunning) setPaused(false); }, 400);
    }, 1200);
    return;
  }
  discoRunning = true;
  setPaused(true);                                // 등록 연출 동안 게임 필드 일시 정지
  const batch = discoQ.splice(0);
  bookTab = bookTabOf(batch[0]);                  // v0.126.0: 새로 등록되는 카드가 있는 탭을 펼침
  renderBook();
  const delay = bookOpen ? 150 : 430;             // 막 올라오는 중이면 다 올라온 뒤에 등록
  setBookOpen(true);
  batch.forEach((t, i) => setTimeout(() => registerSlot(t), delay + i * 320));
  discoTimer = setTimeout(runDiscoveries, delay + batch.length * 320 + 250);
}
// 닫기: 남은 등록 연출은 건너뛰고 바로 게임 재개
function closeBook(){
  clearTimeout(discoTimer);
  discoQ = [];
  discoRunning = false;
  bookPending.clear();
  bookManual = false;
  setBookOpen(false);
  setPaused(false);
}
function registerSlot(t){
  bookPending.delete(t);
  let slot = book.querySelector(`.slot[data-slot="${t}"]`);
  if (!slot){                                    // v0.126.0: 다른 탭의 카드면 그 탭을 펼치고 다시 찾음
    bookTab = bookTabOf(t);
    renderBook();
    slot = book.querySelector(`.slot[data-slot="${t}"]`);
  }
  if (!slot) return;
  const d = DEFS[t];
  slot.classList.remove('unseen');
  slot.innerHTML = `<div class="e">${iconHtml(t)}</div><div class="n">${esc(d.name)}</div>`;
  slot.classList.remove('reg');
  void slot.offsetWidth;                          // 애니메이션 다시 시작
  slot.classList.add('reg');
  slot.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  const cnt = book.querySelector('.book-count');
  if (cnt){
    const seen = new Set(S.seen);
    cnt.textContent = `${PAGE.ids.filter(id => seen.has(id) && !bookPending.has(id)).length} / ${PAGE.ids.length}`;
  }
}

// ── 던전 전투 (v0.90.0) ──────────────────────────────────
//   캐릭터를 올리면 던전이 가로 span배로 늘어나고, 왼쪽 끝에 spawns 크리처가 등장 (카드는 던전 왼쪽에 선으로 연결)
//   길 위의 모습은 카드가 아니라 포트레이트. 캐릭터는 오른쪽 → 왼쪽, 크리처는 왼쪽 → 오른쪽으로 전진
//   1) 사거리 안에 적이 없으면 자기 목표(반대쪽 끝)로 이동  2) 사거리 안에 적이 있으면 공격
//   피해 = 공격력 − 상대 방어 (최소 0). 캐릭터 체력이 0이면 빈사로 탈락, 끝까지 도달하면 클리어
const DUN_SPEED = 0.34;                          // 1초에 길의 몇 %를 가나
const DUN_RANGE = 0.14;                          // 사거리 (길 길이 대비)
const DUN_HIT = 800;                             // 공격 간격 (ms)
const runLast = new Map();                       // 던전 id → 마지막 계산 시각
// v0.104.0: 던전 왼편 줄 = 등장 크리처 + 전리품(보물상자). 전투 상대는 크리처만
const dunSide = pl => S.cards.filter(c => c.dun === pl.id);
const dunFoes = pl => S.cards.filter(c => c.dun === pl.id && DEFS[c.type].kind === 'creature');
const dunPos = u => u.dunP != null ? u.dunP : 0;
// 던전 입장: 캐릭터는 오른쪽 끝, 크리처는 왼쪽 끝에서 시작
function enterDungeon(pl, ch){
  ch.dunP = 1;
  delete ch.atkT;
  for (const ty of DEFS[pl.type].spawns || []){
    if (S.cards.some(c => c.dun === pl.id && c.type === ty)) continue;
    const g = addCard(ty, pl.x - CW * 1.2, pl.y, { dun: pl.id, dunP: 0, hp: DEFS[ty].hp }, true);
    spawned.delete(g.id);
    popFrom.set(g.id, { x: pl.x, y: pl.y });
  }
  const chest = DEFS[pl.type].chest;                          // v0.104.0: 전리품도 왼편에 미리 보임
  if (chest && !S.cards.some(c => c.dun === pl.id && c.loot)){
    const b = addCard(chest, pl.x - CW * 1.2, pl.y, { dun: pl.id, loot: true }, true);
    spawned.delete(b.id);
    popFrom.set(b.id, { x: pl.x, y: pl.y });
  }
}
// 던전 정리: 남은 크리처 제거, 진행값 지움
function clearDungeon(pl){
  for (const g of dunSide(pl)) removeCard(g.id);              // 크리처와 아직 못 챙긴 전리품
  runLast.delete(pl.id);
}
function dunPortrait(pl, u, cls){
  const el = els.get(pl.id);
  const r = el && el.querySelector(`.runner[data-run="${u.id}"]`);
  if (!r) return;
  r.classList.remove(cls);
  void r.offsetWidth;
  r.classList.add(cls);
  setTimeout(() => r.classList.remove(cls), 320);
}
// v0.96.0: 피해 계산 한 곳으로 — 불사(갓)는 피해를 받지 않음 (대결과 같은 규칙)
const dunDmg = (a, b) => DEFS[b.type].immortal ? 0 : Math.max(0, atkOf(a) - defOf(b));
function dunHit(pl, a, b){
  const dmg = dunDmg(a, b);
  b.hp = Math.max(0, (b.hp || 0) - dmg);
  dunPortrait(pl, a, 'atk');
  dunPortrait(pl, b, 'hurt');
  floatText(b, `-${dmg}`);
  const be = els.get(b.id);
  if (be) paint(be, b);                          // 맞은 카드의 체력만 다시 그림 (던전 카드 안 포트레이트는 그대로)
  save();
  return dmg;
}
function stepDungeon(){
  if (!S) return false;
  const now = performance.now();
  let changed = false;
  for (const pl of S.cards.slice()){
    const d = DEFS[pl.type];
    if (!d.span) continue;
    const chs = visitorsOf(pl);
    const foes = dunFoes(pl);
    if (!chs.length){                                          // 아무도 없으면 던전 초기화
      if (foes.length){ clearDungeon(pl); changed = true; }
      continue;
    }
    const ch = chs[0];
    const last = runLast.get(pl.id);
    runLast.set(pl.id, now);
    if (last == null) continue;
    const dt = Math.min(0.2, (now - last) / 1000);
    if (heldId() === ch.id) continue;                          // 잡고 있는 동안은 멈춤
    const units = [{ u: ch, dir: -1, goal: 0, foes }].concat(foes.map(g => ({ u: g, dir: 1, goal: 1, foes: [ch] })));
    for (const { u, dir, goal, foes: es } of units){
      if (!byId(u.id)) continue;
      const alive = es.filter(e => byId(e.id) && (e.hp == null || e.hp > 0));
      const near = alive.filter(e => Math.abs(dunPos(e) - dunPos(u)) <= DUN_RANGE)
        .sort((a, b) => Math.abs(dunPos(a) - dunPos(u)) - Math.abs(dunPos(b) - dunPos(u)))[0];
      if (near){                                               // 2) 사거리 안에 적 → 공격
        // v0.96.0: 서로 피해를 못 주면 끝나지 않음 (갓처럼 불사인데 공격력 0) → 캐릭터를 내보내고 던전 초기화
        if (dunDmg(u, near) <= 0 && dunDmg(near, u) <= 0){
          delete ch.visit; delete ch.visitSeq; delete ch.dunP; delete ch.atkT;
          clearDungeon(pl);
          toast(`서로 피해를 못 줌 — ${DEFS[ch.type].name} 던전에서 나옴`);
          if (ch.type === 'god') say(LINES.dunBrag);          // v0.97.0: 갓이 센척
          afterChange();
          changed = true;
          break;
        }
        // v0.97.0: 첫 접촉에서 캐릭터가 반 박자 먼저 침 (크리처는 0.4초 늦게) — 프레임 흔들림에 승패가 뒤집히지 않게
        if (u.atkT == null) u.atkT = now - DUN_HIT + (u.dun != null ? 400 : 0);
        if (now - u.atkT < DUN_HIT) continue;
        u.atkT = now;
        dunHit(pl, u, near);
        changed = true;
        if (near.hp <= 0){
          if (near.id === ch.id){                              // 캐릭터 패배 → 빈사로 탈락
            setStatus(ch, [], ['빈사']);
            delete ch.visit; delete ch.visitSeq; delete ch.dunP; delete ch.atkT;
            clearDungeon(pl);
            toast(`💀 ${DEFS[ch.type].name} 패배 — 빈사`);
          } else {
            toast(`🏆 ${ic(near.type)} ${DEFS[near.type].name} 쓰러뜨림`);
            removeCard(near.id);
          }
          afterChange();
        }
        continue;
      }
      // 1) 사거리 안에 아무도 없으면 목표(반대쪽 끝)로 이동
      const np = Math.min(1, Math.max(0, dunPos(u) + dir * DUN_SPEED * dt));
      if (np !== dunPos(u)){ u.dunP = np; changed = true; }
      const el = els.get(pl.id);
      const r = el && el.querySelector(`.runner[data-run="${u.id}"]`);
      if (r) r.style.setProperty('--rp', u.dunP);
      if (u.id === ch.id && np <= 0 && !dunFoes(pl).length){    // 끝까지 도달 → 클리어
        delete ch.visit; delete ch.visitSeq; delete ch.dunP; delete ch.atkT;
        const q = clampPos(pl.x + CW * d.span + 12, pl.y);
        ch.x = q.x; ch.y = q.y;
        bumpIds.add(ch.id);
        const box = S.cards.find(o => o.loot && o.dun === pl.id);   // v0.104.0: 왼편에 보이던 전리품 (정리 전에 잡아둠)
        if (box){ delete box.dun; delete box.loot; }                // 정리에 같이 지워지지 않게
        clearDungeon(pl);
        toast(`${ic(pl.type)} ${DEFS[ch.type].name} — 던전 클리어`);
        if (box){
          const cp = findSpot(ch.x + CW * 1.1, ch.y);
          box.x = cp.x; box.y = cp.y;
          popFrom.set(box.id, { x: pl.x, y: pl.y });
          bumpIds.add(box.id);
          toast(`${ic(box.type)} ${DEFS[box.type].name} 획득`);
        }
        if (!S.flags.hostageGiven){                              // v0.105.0: 첫 클리어 — 던전에서 인질이 튀어나옴
          S.flags.hostageGiven = true;
          const hs = findSpot(pl.x + CW * 0.6, pl.y + CH * 0.9);
          const hos = addCard('hostage', hs.x, hs.y);
          spawned.delete(hos.id);
          popFrom.set(hos.id, { x: pl.x, y: pl.y });
          toast(`${ic('hostage')} 던전에서 인질이 튀어나옴`);
          const hq = addCard('quest', hos.x, hos.y, {         // v0.114.0: 인질 옆 "손질?" quest — 밧줄을 끊어 달라는 뜻
            quest: 'freehim', title: '손질?', goal: 'make', make: 'architect', recipeId: 'freeman',
            makeText: `${ic('hostage')} 인질 풀어주기`,               // v0.130.1: "건축가 만들기"로 보이지 않게
            target: hos.id, giver: hos.id, need: 0, stack: [], rewardText: '보상 없음',
          });
          slideOutFrom(hq, hos);
        }
        afterChange();
      }
    }
  }
  return false;                                                 // 카드 위치는 안 건드림 (포트레이트만 움직임)
}

// ── 밀어내기 (물리) ───────────────────────────────────
function velOf(id){
  let v = vel.get(id);
  if (!v){ v = { x: 0, y: 0 }; vel.set(id, v); }
  return v;
}
function physStep(){
  requestAnimationFrame(physStep);
  followDrag();                                // v0.122.0: 끄는 카드를 가운데로
  let moved = false;
  if (S && !busy && !paused){
    if (stepReturn()) moved = true;            // 되돌아가는 카드를 먼저 옮기고
    if (stepHops()) moved = true;              // 동물 홉핑
    if (stepDungeon()) moved = true;           // 던전 진행
    if (solveAttach()) moved = true;           // 잡은 quest → 발주자
    if (solveVisit()) moved = true;            // 장소 → 방문자 줄 / 멀리 당기면 떠남
    if (solveDun()) moved = true;
    if (solveMap()) moved = true;              // v0.125.0: 지도에 등록된 장소 줄              // 던전 → 왼쪽 크리처 줄
    if (solveAttach()) moved = true;           // 방문자 → 붙은 quest
    if (phys ? physMove() : unwedge()) moved = true;   // 밀어내기 꺼짐이면 묶음 틈에 낀 카드만 빼냄
    if (solveVisit()) moved = true;
    if (solveAttach()) moved = true;
  }
  if (moved) physDirty = true;
  else if (physDirty && !drag){ physDirty = false; save(); }   // 멈추면 한 번 저장
  drawLinks();
  fitBubbles();                                // 카드가 움직여도 말풍선은 화면 안에
}
// ── quest 붙이기 ─────────────────────────────────────
// 붙음: request는 선 없이 발주자(캐릭터) 오른쪽에 붙어서 같이 움직임. 왼쪽으로는 가지 않음
const ATTACH_GAP = 4;
// quest 등장: 발주자 뒤에서 오른쪽으로 미끄러져 나옴
const SLIDE_MS = 350;
const slideIn = new Map();     // quest id → 등장 시작 시각
function slideProgress(id){
  const t0 = slideIn.get(id);
  if (t0 == null) return 1;
  const t = (performance.now() - t0) / SLIDE_MS;
  if (t >= 1){ slideIn.delete(id); return 1; }
  return 1 - Math.pow(1 - t, 3);
}
function slideOutFrom(rq, g){
  rq.x = g.x; rq.y = g.y;       // 발주자와 같은 자리에서 시작
  spawned.delete(rq.id);
  slideIn.set(rq.id, performance.now());
  g.z = ++S.z;                   // 발주자가 위 → request가 뒤에서 나오는 것처럼
  setTimeout(checkSettle, 0);     // 나오자마자 이미 조건을 채웠는지 확인 (다음 조작을 기다리지 않음)
}
// 붙어 있는 request의 몸통 = 발주자. 나머지 카드는 자기 자신
function bodyOf(c){
  let cur = c;
  for (let i = 0; cur && i < 6; i++){

function pullTo(anchor, mover, L, k){

  const tx = anchor.x + dx / d * L, ty = anchor.y + dy / d * L;
  const p = clampPos(mover.x + (tx - mover.x) * k, mover.y + (ty - mover.y) * k);
  if (Math.abs(p.x - mover.x) < 0.05 && Math.abs(p.y - mover.y) < 0.05) return false;
  mover.x = p.x; mover.y = p.y;
  const el = els.get(mover.id);
  if (el){ el.style.left = mover.x + 'px'; el.style.top = mover.y + 'px'; }
  return true;

    if (body) dragIds.add(body.id);
  }
  if (hid != null){
    const reached = new Set(dragIds);
    const queue = [...dragIds];
    while (queue.length){
      const id = queue.shift();
      for (const lk of links){
        if (done.has(lk)) continue;
        let from = null, to = null;
        if (lk.a.id === id && !reached.has(lk.b.id)){ from = lk.a; to = lk.b; }
        else if (lk.b.id === id && !reached.has(lk.a.id)){ from = lk.b; to = lk.a; }
        else continue;
        done.add(lk);
        reached.add(to.id);
        queue.push(to.id);
        if (pullTo(from, to, L, 1)) moved = true;

    }
  }
  for (const lk of links){
    if (done.has(lk)) continue;
    if (dragIds.has(lk.a.id) || dragIds.has(lk.b.id)) continue;
    if (pullTo(lk.a, lk.b, L, 0.2)) moved = true;
  }
  return moved;
}

      const B = hs[j];
      const ox = Math.min(A.x2, B.x2) - Math.max(A.x1, B.x1) + gx;
      const oy = Math.min(A.y2, B.y2) - Math.max(A.y1, B.y1) + gy;
      if (ox <= 0 || oy <= 0) continue;
      const dx = (B.x1 + B.x2) - (A.x1 + A.x2), dy = (B.y1 + B.y2) - (A.y1 + A.y2);
      const va = velOf(A.body.id), vb = velOf(B.body.id);
      // v0.131.0: 지도 묶음은 지도 묶음끼리만 서로 밀어냄. 낱장 카드는 지도를 못 밀고 지도가 밀어냄
      const aMap = DEFS[A.body.type].kind === 'map', bMap = DEFS[B.body.type].kind === 'map';
      const wa = aMap && !bMap ? 0 : 1, wb = bMap && !aMap ? 0 : 1;
      if (ox < oy){
        const f = ox * PUSH * (dx < 0 ? -1 : 1);
        va.x -= f * wa; vb.x += f * wb;
      } else {
        const f = oy * PUSH * (dy < 0 ? -1 : 1);
        va.y -= f * wa; vb.y += f * wb;
      }
    }
  }
  let moving = false;
  const pinned = mapPinned();                  // v0.129.0: 지도 줄 카드는 제자리 (다른 카드는 밀어냄)
  for (const c of cs){
    if (bodyOf(c) !== c) continue;             // 붙은 request는 붙이기가 위치를 정함
    if (pinned.has(c.id)){ vel.delete(c.id); continue; }
    const v = vel.get(c.id);
    if (!v) continue;
    if (Math.abs(v.x) < 0.02 && Math.abs(v.y) < 0.02){ vel.delete(c.id); continue; }
    const nx = c.x + v.x, ny = c.y + v.y;
    const p = DEFS[c.type].kind === 'map' ? mapClampPos(c, nx, ny) : clampPos(nx, ny);   // v0.131.0: 지도는 묶음째 경계 판정
    if (p.x !== nx) v.x = 0;                       // 벽에 닿으면 그 방향 속도 0
    if (p.y !== ny) v.y = 0;
    c.x = p.x; c.y = p.y;
    v.x *= DAMP; v.y *= DAMP;
    const el = els.get(c.id);
    if (el){ el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; }
    moving = true;
  }
  return moving;
}
// 묶음(장소·방문자·붙은 quest 가 한 몸)마다 전체를 감싸는 사각형. n = 묶음 카드 수
function bodyHulls(cards){
  const m = new Map();
  for (const c of cards){
    const b = bodyOf(c);
    let h = m.get(b.id);
    if (!h){ h = { body: b, n: 0, x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity }; m.set(b.id, h); }
    h.n++;
    h.x1 = Math.min(h.x1, c.x); h.y1 = Math.min(h.y1, c.y);
    h.x2 = Math.max(h.x2, c.x + CW * spanOf(c)); h.y2 = Math.max(h.y2, c.y + CH);   // v0.130.0: 늘어난 던전은 늘어난 폭
  }
  return [...m.values()];
}
const outsideHull = (x, y, g) => x + CW <= g.x1 || x >= g.x2 || y + CH <= g.y1 || y >= g.y2;
// 밀어내기가 꺼져 있어도: 묶음 사각형 안(틈 포함)에 들어간 낱장 카드는 가장 가까운 바깥 자리로 뺌 (v0.63.0)
function unwedge(){
  const hid = heldId();
  const dragBody = hid != null ? bodyOf(byId(hid)) : null;
  const pinned = mapPinned();                  // v0.129.0: 지도 줄 카드는 제자리
  const cs = S.cards.filter(c => !(dragBody && bodyOf(c) === dragBody) && !(tear && c.id === tear.id) && !(returning && c.id === returning.id) && !heldSpawn(c.id) && !pinned.has(c.id));   // v0.121.0: 막 생성된 카드 제외
  const hs = bodyHulls(cs);
  const groups = hs.filter(h => h.n > 1);
  let moved = false;
  for (const h of hs){
    const c = h.body;
    if (h.n > 1 || c.duel != null) continue;
    for (const g of groups){
      if (outsideHull(c.x, c.y, g)) continue;
      const opts = [
        { x: g.x1 - CW - 4, y: c.y }, { x: g.x2 + 4, y: c.y },
        { x: c.x, y: g.y1 - CH - 4 }, { x: c.x, y: g.y2 + 4 },
      ].map(p => clampPos(p.x, p.y)).filter(p => outsideHull(p.x, p.y, g));
      if (!opts.length) continue;
      const p = opts.reduce((a, b) => Math.hypot(b.x - c.x, b.y - c.y) < Math.hypot(a.x - c.x, a.y - c.y) ? b : a);
      c.x = p.x; c.y = p.y; moveEl(c); moved = true;
      break;
    }
  }
  return moved;
}

  return head + `<div class="i-grid">${cell('수치', c1)}${cell('상태', c2)}${cell('조합·출현', c3)}</div>`;

// 인스펙터 조합 두 가지: 이 카드에 도달하는 조합 / 이 카드로 할 수 있는 조합
//   발견한 조합(S.found)은 전부 보여주고, 모르는 칸은 ???
//   익히기는 날것마다 한 줄 — 조합을 알고 그 익힌 카드도 본 적 있어야 공개
const UNK = '<span class="i-muted">???</span>';
const sideHtml = sd => rich(sideText(sd));
const comboLine = (a, b, out) => iLine(`${a} + ${b} → ${out}`);
function comboLists(t){
  const reach = [], use = [];
  const found = r => S.found.includes(r.id);
  for (const r of RECIPES){
    if (r.cook){
      for (const raw of Object.keys(DEFS)){
        const ck = DEFS[raw].cooked;
        if (!ck || !sideMatch(r.b, raw)) continue;
        const known = found(r) && S.seen.includes(ck);
        if (ck === t) reach.push(known ? comboLine(sideHtml(r.a), cardRef(raw), cardRef(t)) : comboLine(UNK, UNK, cardRef(t)));
        if (raw === t) use.push(known ? comboLine(cardRef(t), sideHtml(r.a), cardRef(ck)) : comboLine(cardRef(t), UNK, UNK));
      }
      if (sideMatch(r.a, t)) use.push(found(r) ? comboLine(cardRef(t), sideHtml(r.b), esc(outText(r))) : comboLine(cardRef(t), UNK, UNK));
      continue;
    }
    const outs = r.out || [];
    if (outs.includes(t)){
      reach.push(found(r)
        ? comboLine(sideHtml(r.a), sideHtml(r.b), rich(outText(r)))
        : comboLine(UNK, UNK, cardRef(t) + (outs.length > 1 ? ', ' + UNK : '')));
    }
    const aM = sideMatch(r.a, t), bM = sideMatch(r.b, t);
    if (aM || bM){
      const other = aM ? r.b : r.a;
      use.push(found(r) ? comboLine(cardRef(t), sideHtml(other), rich(outText(r))) : comboLine(cardRef(t), UNK, UNK));
    }
  }
  return { reach, use };
}

// ── 제재소 (v0.133.0) ─────────────────────────────────────
//   캐릭터가 있으면 일정 시간(고정)마다 게이지가 참. 다 차면 월드에서 가장 가까운 나무 1개를 끌어당겨 나무판자 + 톱밥
//   빈사 캐릭터는 일하지 않음. 나무가 없으면 게이지는 가득 찬 채로 기다림
function millTick(){
  if (!S || paused || busy) return;
  const hid = heldId();
  for (const pl of S.cards){
    const mill = DEFS[pl.type].mill;
    if (!mill) continue;
    const workers = visitorsOf(pl).filter(v => !statusOf(v).includes('빈사'));
    if (!visitorsOf(pl).length) pl.millPts = 0;                   // v0.134.0: 모두 떠나면 게이지 초기화
    else if ((pl.stock || 0) > 0) pl.millPts = Math.min(mill.need, (pl.millPts || 0) + workers.length);   // 1초마다 방문 인원만큼 (빈사는 일 안 함). v0.142.0: 등록된 나무가 있을 때만
    const el = els.get(pl.id);
    const pie = el && el.querySelector('.pie');
    if (pie) pie.style.setProperty('--p', pieValue(pl));
    if (!workers.length || !(pl.stock > 0) || pl.millPts < mill.need) continue;
    if (!mill.out.some(t => canSpawn(t))) continue;              // v0.136.0: 하나도 못 나오면(월드 5장 상한) 가득 찬 채로 기다림
    // v0.142.0: 월드의 나무를 끌어오지 않고, 등록된 나무를 하나 써서 배출
    pl.millPts = 0;
    pl.stock--;
    const omitted = [];
    for (const t of mill.out){
      if (!canSpawn(t)){ omitted.push(t); continue; }
      const p = findSpot(pl.x, pl.y + CH + 12);
      const nc = addCard(t, p.x, p.y);
      spawned.delete(nc.id);
      popFrom.set(nc.id, { x: pl.x, y: pl.y });
    }
    omitToast(omitted);
    bumpIds.add(pl.id);
    afterChange();
    return;
  }
}
// 카드 하나를 장소로 끌어당겨 없애고, 그 자리에서 결과물이 튀어나옴 (월드 상한은 누락 표시)
function pullInto(pl, o, outs){
  busy = true;
  const el = els.get(o.id);
  if (el){
    el.style.zIndex = 1999998000;
    el.style.transition = 'left .34s ease-in, top .34s ease-in, transform .34s ease-in, opacity .34s ease-in';
    requestAnimationFrame(() => {
      el.style.left = pl.x + 'px';
      el.style.top = pl.y + 'px';
      el.style.transform = 'scale(.35)';
      el.style.opacity = '0';
    });
  }
  setTimeout(() => {
    removeCard(o.id);
    busy = false;
    const omitted = [];
    for (const t of outs){
      if (!canSpawn(t)){ omitted.push(t); continue; }
      const p = findSpot(pl.x, pl.y + CH + 12);
      const nc = addCard(t, p.x, p.y);
      spawned.delete(nc.id);
      popFrom.set(nc.id, { x: pl.x, y: pl.y });
    }
    omitToast(omitted);
    bumpIds.add(pl.id);
    afterChange();
  }, 360);
}

// ── 조합대 (v0.133.0) ─────────────────────────────────────
//   인스펙터의 "만들 수 있는 것"에서 한 번이라도 조합한 아이템을 고르면, 재료를 모든 깊이까지 펼친 quest가 조합대 옆에 붙음
//   칸마다 "상위 단계 하나"(그 카드를 그대로) 또는 "하위 단계 두 가지"(그 카드의 재료)로 채움 → 다 차면 중간 단계까지 한꺼번에 조합
//   도구 칸(조합해도 남는 쪽)은 한 번 넣으면 같은 조건의 칸을 다 채우고, 완성되면 돌려줌
const benchable = r => !r.cook && !r.burn && r.out && r.out.length
  && r.out.every(t => !tagLevel(DEFS[t], '장소') && DEFS[t].kind !== 'character');
const producerOf = type => RECIPES.find(r => S.found.includes(r.id) && benchable(r) && r.out.includes(type));
const benchItems = () => [...new Set(RECIPES.filter(r => S.found.includes(r.id) && benchable(r)).flatMap(r => r.out))];
function benchNode(side, kept, depth, seen, nextId){
  const n = { id: nextId(), kept: !!kept };
  if (side.card){
    n.type = side.card;
    const r = !kept && depth < 6 && !seen.has(side.card) ? producerOf(side.card) : null;
    if (r){
      const s2 = new Set(seen).add(side.card);
      n.recipe = r.id;
      n.kids = [benchNode(r.a, r.keep === 'a', depth + 1, s2, nextId), benchNode(r.b, r.keep === 'b', depth + 1, s2, nextId)];
    }
  } else if (side.tag){ n.tag = side.tag; n.lv = side.lv || 1; }
  else if (side.atk) n.atk = side.atk;
  return n;
}
const benchMatch = (n, type) => n.type ? n.type === type
  : n.tag ? tagLevel(DEFS[type], n.tag) >= n.lv
  : n.atk ? (DEFS[type].atk || 0) >= n.atk : false;
function benchSat(rq, n){
  if (n.kept) return (rq.tools || []).some(t => benchMatch(n, t));
  if ((rq.fill || {})[n.id]) return true;
  return !!n.kids && n.kids.every(k => benchSat(rq, k));
}
// 올린 카드가 들어갈 칸: 위에서부터 아직 안 찬 칸 중 가장 높은 칸(상위 단계 먼저). 없으면 도구 칸
const filledBelow = (rq, n) => (n.kids || []).some(k => (rq.fill || {})[k.id] || filledBelow(rq, k));
function benchSlot(rq, type){
  if (!rq.tree) return null;
  const walk = n => {
    if (benchSat(rq, n)) return null;
    if (n !== rq.tree && !n.kept && benchMatch(n, type) && !filledBelow(rq, n)) return n;   // v0.134.0: 아래 칸에 이미 넣었으면 그 칸은 아래로만 채움
    if (n.kids && !(rq.fill || {})[n.id]) for (const k of n.kids){ const f = walk(k); if (f) return f; }
    return null;
  };
  const hit = walk(rq.tree);
  if (hit) return { node: hit };
  const toolWalk = n => {
    if (n.kept) return !benchSat(rq, n) && benchMatch(n, type) ? n : null;
    if (benchSat(rq, n) || !n.kids) return null;
    for (const k of n.kids){ const f = toolWalk(k); if (f) return f; }
    return null;
  };
  return toolWalk(rq.tree) ? { tool: true } : null;
}
function benchPut(rq, d){
  const slot = benchSlot(rq, d.type);
  if (!slot) return false;
  removeCard(d.id);
  if (slot.tool){
    rq.tools = (rq.tools || []).concat(d.type);
  } else {
    rq.fill = rq.fill || {};
    rq.fill[slot.node.id] = d.type;                           // v0.134.0: 낸 재료는 돌아오지 않음 (아래 칸을 채우기 시작한 칸은 위 단계로 못 채움)
  }
  bumpIds.add(rq.id);
  return true;
}
function benchLines(rq){
  if (!rq.tree) return '';
  const out = [];
  const label = n => n.type ? `${ic(n.type)} ${DEFS[n.type].name}` : n.tag ? `🏷️ ${n.tag} lv${n.lv} 이상` : `⚔ 공격력 ${n.atk} 이상`;
  const walk = (n, depth) => {
    const sat = benchSat(rq, n);
    out.push(`${'　'.repeat(depth)}${sat ? '✔' : '☐'} ${label(n)}${n.kept ? ' (도구)' : ''}`);
    if (!sat && n.kids && !(rq.fill || {})[n.id]) n.kids.forEach(k => walk(k, depth + 1));
  };
  (rq.tree.kids || []).forEach(k => walk(k, 0));
  return out.join('\n');
}
function benchFinish(rq, x, y){
  const g = rq.giver != null ? byId(rq.giver) : null;
  const bx = g ? g.x : x, by = g ? g.y : y;
  const outs = [];
  const walk = n => {
    if (!n.kids || (rq.fill || {})[n.id]) return;              // 직접 넣은 칸은 만들 필요 없음
    n.kids.forEach(walk);
    const r = RECIPE_BY_ID.get(n.recipe);
    const made = r && r.out ? r.out.slice() : [];
    if (n !== rq.tree){ const i = made.indexOf(n.type); if (i >= 0) made.splice(i, 1); }   // 중간 결과물은 다음 단계에 쓰이고 나머지는 부산물
    outs.push(...made);
  };
  walk(rq.tree);
  const pop = t => {
    const p = findSpot(bx, by + CH + 12);
    const nc = addCard(t, p.x, p.y);
    spawned.delete(nc.id);
    popFrom.set(nc.id, { x: bx, y: by });
  };
  const omitted = [];
  for (const t of outs){ if (canSpawn(t)) pop(t); else omitted.push(t); }
  for (const t of (rq.tools || [])) pop(t);                    // 도구는 돌려줌 (이미 있던 카드)
  omitToast(omitted);
  if (g) bumpIds.add(g.id);
  toast(`${ic(rq.tree.type)} ${DEFS[rq.tree.type].name} 완성`);
}
// 인스펙터에서 고르면: 조합대 옆 quest 하나 (다른 걸 고르면 넣어 둔 재료·도구를 돌려주고 바꿈)
function pickBench(benchId, type){
  const bench = byId(benchId);
  const r = producerOf(type);
  if (!S || !bench || !r || paused || busy) return;
  const old = S.cards.find(c => c.type === 'quest' && c.goal === 'bench' && c.giver === bench.id);
  if (old){
    if (old.tree && old.tree.type === type) return;
    const lost = Object.keys(old.fill || {}).length + (old.tools || []).length;
    removeCard(old.id);
    if (lost) toast(`${ic('workbench')} 만들 것을 바꿈 — 넣은 재료 ${lost}장은 돌아오지 않음`);   // v0.134.0: 낸 재료는 돌려주지 않음
  }
  let nid = 0;
  const nextId = () => ++nid;
  const seen = new Set([type]);
  const tree = { id: 0, type, recipe: r.id,
    kids: [benchNode(r.a, r.keep === 'a', 1, seen, nextId), benchNode(r.b, r.keep === 'b', 1, seen, nextId)] };
  const rq = addCard('quest', bench.x, bench.y, { quest: 'bench:' + type, title: `${DEFS[type].name} 만들기`, goal: 'bench',
    tree, fill: {}, tools: [], need: 0, stack: [], target: bench.id, giver: bench.id, rewards: r.out.slice() });
  slideOutFrom(rq, bench);
  save();
  renderAll();
}
function benchPickHtml(bench){
  const items = benchItems();
  if (!items.length) return iNone('아직 조합해 본 것이 없음');
  const cur = S.cards.find(c => c.type === 'quest' && c.goal === 'bench' && c.giver === bench.id);
  return `<div class="bench-picks">${items.map(t => `<button class="bench-pick${cur && cur.tree && cur.tree.type === t ? ' on' : ''}" data-bench="${bench.id}" data-item="${t}">${cardRef(t)}</button>`).join('')}</div>`;
}

// ── 카드 hover 팝업 (v0.113.0) ────────────────────────────
//   PC 전용 편의 기능: 카드에 마우스를 올리면 오른쪽에 인스펙터 축소판, 벗어나면 사라짐
//   터치·모바일 틀에서는 안 뜸 (인스펙터 창으로만 봄)
const cardPop = document.createElement('div');
cardPop.className = 'cardpop';
cardPop.hidden = true;
document.body.appendChild(cardPop);
let popId = null;
const POP_SCALE = 0.88;                          // .cardpop 의 transform scale 과 같은 값
const hoverOk = () => matchMedia('(hover: hover) and (pointer: fine)').matches && !(window.MOBILE && MOBILE.on);
function hidePop(){
  if (popId == null) return;
  popId = null;
  cardPop.hidden = true;
}
function placePop(el){
  const r = el.getBoundingClientRect();
  const w = cardPop.offsetWidth * POP_SCALE, h = cardPop.offsetHeight * POP_SCALE;   // 화면에 보이는 크기
  let x = r.right + 10;
  if (x + w > innerWidth - 8) x = Math.max(8, r.left - w - 10);   // 오른쪽이 좁으면 왼쪽으로
  const y = Math.max(8, Math.min(r.top, innerHeight - h - 8));
  cardPop.style.left = x + 'px';
  cardPop.style.top = y + 'px';
}
function showPop(c, el){
  popId = c.id;
  cardPop.innerHTML = inspectorHtml(c);
  cardPop.hidden = false;
  placePop(el);
}
function popMove(e){
  if (!hoverOk() || drag || tear || busy || !S){ hidePop(); return; }
  const el = e.target.closest && e.target.closest('.cw');
  if (!el || el.classList.contains('half')){ hidePop(); return; }
  const c = byId(+el.dataset.id);
  if (!c){ hidePop(); return; }
  if (popId === c.id){ placePop(el); return; }
  showPop(c, el);
}
table.addEventListener('mousemove', popMove);
table.addEventListener('mouseleave', hidePop);
window.addEventListener('blur', hidePop);
// 값이 바뀌면 (체력·게이지 등) 팝업도 같이 갱신
function refreshPop(){
  if (popId == null) return;
  const c = byId(popId);
  const el = els.get(popId);
  if (!c || !el){ hidePop(); return; }
  cardPop.innerHTML = inspectorHtml(c);
  placePop(el);
}

    seen: CH_SEEN_FOOD.concat(['bedding', 'hilt', 'plank', 'tannedhide', 'sack', 'mountain', 'godmouth', 'river', 'explorer', 'squidcarcass']).concat(['map', 'ink', 'squidmeat']), found: CH_FOUND_FOOD.concat(['bedding', 'tan', 'sack', 'squid', 'mapmake']),
    cards: ['explorer', 'map', 'river', 'mountain', 'campfire', 'godmouth', 'bedding'] },   // 등록할 장소 넉넉히
  { title: '건축가: 조합소를 짓겠어',                          // v0.133.0
    flags: Object.assign({}, CH_PEACE, { peaceGiven: true, stored: true, swept: true, peaceDone: true, mountainGiven: true, mouthGiven: true, mouthTaught: true, mountainWorkDone: true, riverGiven: true, riverWorkDone: true, explorerGiven: true, mapDone: true, dungeonGiven: true, hostageGiven: true, archFreed: true, millDone: true }),
    knight: { hp: 10, status: [], equip: { '무기': 'hilt', '방패': 'plank' } },
    seen: CH_SEEN_FOOD.concat(['bedding', 'hilt', 'plank', 'tannedhide', 'sack', 'mountain', 'godmouth', 'river', 'explorer', 'squidcarcass', 'map', 'ink', 'squidmeat', 'dungeon', 'hostage', 'architect', 'sawmill', 'tree']), found: CH_FOUND_FOOD.concat(['bedding', 'tan', 'sack', 'squid', 'mapmake', 'freeman']),
    cards: ['architect', 'sawmill', 'mountain', 'campfire', 'tree', 'tree', 'tree', 'tree', 'tree', 'stone', 'stone', 'flint'] },   // 기사를 제재소에 → 판자 5 → 조합대
];
function startChapter(ch){
  if (ch.start){ newGame(); toast('⏭ ' + ch.title); return; }
  S = {
    cards: [], seen: ['package', 'knight', 'god'], found: (ch.found || []).slice(),
    flags: Object.assign({ discovered: false, requestsGiven: 0 }, ch.flags), nextId: 1, z: 1,
  };
  for (const t of (ch.seen || [])) if (!S.seen.includes(t)) S.seen.push(t);
  const { w, h } = tableSize();
  addCard('god', w * 0.06, h * 0.2, null, true);
  addCard('knight', w * 0.06, h * 0.58, JSON.parse(JSON.stringify(ch.knight || {})), true);   // 정의를 건드리지 않게 복사
  for (const e of ch.cards){
    const [t, extra] = Array.isArray(e) ? e : [e];   // 'stone' 또는 ['sack', { fill, count }]
    const p = findSpot(w * 0.55, h * 0.5);
    addCard(t, p.x, p.y, extra ? JSON.parse(JSON.stringify(extra)) : null, true);                  // 조용히 (콜렉터북 등록 연출 없이)
  }
  save();
  renderAll();
  scheduleGod();
  if (ch.after) ch.after();
  toast('⏭ ' + ch.title);
}
const chaptersEl = document.getElementById('chapters');
chaptersEl.innerHTML = '<div class="ch-head">테스트용 챕터 점프 — 지금 진행이 지워짐</div>'
  + CHAPTERS.map((ch, i) => `<button data-ch="${i}">${i}. ${esc(ch.title)}</button>`).join('');
document.getElementById('chapterBtn').addEventListener('click', () => { openSettings(false); chaptersEl.hidden = !chaptersEl.hidden; });   // v0.123.0: 설정 닫고 목록
chaptersEl.addEventListener('click', e => {
  const b = e.target.closest('[data-ch]');
  if (!b) return;
  chaptersEl.hidden = true;
  clearRuntime();
  startChapter(CHAPTERS[+b.dataset.ch]);
});
document.addEventListener('pointerdown', e => {
  if (!chaptersEl.hidden && !e.target.closest('#chapters, #chapterBtn')) chaptersEl.hidden = true;   // 바깥 누르면 닫힘
});
function onResize(){
  measure();
  for (const c of S.cards){
    const p = clampPos(c.x, c.y);
    c.x = p.x; c.y = p.y;
  }
  renderAll();
}
window.addEventListener('resize', onResize);
// 상단 UI 막대 높이 → 테이블은 그 아래부터 (v0.59.0). 버튼이 줄바꿈돼 막대 높이가 바뀌면 카드도 테이블 안으로 다시 맞춤
const topbar = document.getElementById('topbar');
function syncTopH(){ document.documentElement.style.setProperty('--top-h', topbar.offsetHeight + 'px'); }
new ResizeObserver(() => {
  const before = table.clientHeight;
  syncTopH();
  if (S && table.clientHeight !== before) onResize();
}).observe(topbar);

validateRecipes();
(() => {
  const types = Object.keys(DEFS);
  for (const x of types) for (const y of types){
    if (usableRecipes(x, y).length){ COMBOABLE.add(x); COMBOABLE.add(y); }
  }
})();

// 고착 점검 안전망 — 상태 변화 없이도 주기적으로 한 번씩 본다
setInterval(() => { if (!paused && !drag && !tear && !busy){ checkSettle(); godCheck(); trappedHint(false); } }, 5000);
setInterval(restTick, 1000);                   // 체력 회복 장소
setInterval(yieldTick, 1000);
setInterval(millTick, 1000);                   // v0.133.0: 제재소                  // 산: 나무 게이지
setInterval(duelTick, DUEL_MS);                // 크리처 대결
setInterval(animalTick, 1000);                 // 동물 홉핑
setInterval(() => { renderInspector(); refreshPop(); }, 500);             // 인스펙터 실시간 갱신 (체력·게이지·진행)

syncTopH();
measure();
if (load()){
  for (const c of S.cards){
    const p = clampPos(c.x, c.y);
    c.x = p.x; c.y = p.y;
  }
  checkSettle();
  renderAll();
  scheduleGod();
  setTimeout(() => trappedHint(true), 700);
} else {
  newGame();
}
requestAnimationFrame(physStep);
})();
</script>
</body>
</html>
