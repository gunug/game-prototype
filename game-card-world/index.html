function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = rich(msg);                       // 카드 그림 자리표(ic) → 그림
  toasts.appendChild(t);
  setTimeout(() => t.remove(), 2700);
  while (toasts.children.length > 4) toasts.firstChild.remove();
}

// ── 갓의 말 ───────────────────────────────────────────
const TALK_SCALE = 1;                          // 대사 머무는 시간 배율 — 모든 캐릭터 공통 (v0.26.1: 1.5 → 1 원래대로)
const SPEAKERS = ['god', 'knight'];            // 대사 우선순위 — 앞일수록 먼저
const talkQ = { god: [], knight: [] };          // 사람마다 할 말 줄 [{ text, done }]
let talking = null, talkTimer = null;           // 지금 말하는 사람
function enqueueTalk(who, items){
  talkQ[who].push(...items);
  if (!talking) showNextTalk(null);
}
// 이 사람이 말하는 중이거나 할 말이 남아 있나
const isTalking = who => talking === who || talkQ[who].length > 0;
function setLine(who, text){
  if (who === 'god') speech = text; else knightSpeech = text;
  table.classList.toggle('talking', !!(speech || knightSpeech));   // 누가 말하는 동안 나머지 카드 반투명
  repaint(who);
  if (who === 'god'){
    const pk = S.cards.find(c => c.type === 'package' && c.contents === 'first');
    const el = pk && els.get(pk.id);
    if (el && !drag && !(tear && tear.id === pk.id)) paint(el, pk);
  }
}
// ── 일시 정지 ─────────────────────────────────────────
// 콜렉터북 등록 연출 동안 게임 필드를 멈춤: 조작, 밀어내기·붙이기, 체력 회복, 대사 진행, quest 지급·정산
let paused = false, pausedAt = 0, talkWait = null;
function setPaused(on){
  if (on === paused) return;
  paused = on;
  table.classList.toggle('paused', on);
  if (on){ pausedAt = performance.now(); return; }
  // 멈춘 시간만큼 진행 중이던 애니메이션 시작 시각을 미룸
  const dt = performance.now() - pausedAt;
  if (returning) returning.t0 += dt;
  for (const [id, t0] of slideIn) slideIn.set(id, t0 + dt);
  scheduleGod();
}
function showNextTalk(prev){
  if (paused){                                  // 멈춘 동안엔 새 대사를 시작하지 않음
    if (!talkWait) talkWait = setTimeout(() => { talkWait = null; if (!talking) showNextTalk(prev); }, 250);
    return;
  }
  // 방금 말한 사람이 이어서 할 말이 있으면 계속 (한쪽 대화가 다 끝나야 다음 사람)
  // 아니면 할 말이 있는 사람 중 우선순위가 높은 쪽
  const who = (prev && talkQ[prev].length) ? prev : SPEAKERS.find(w => talkQ[w].length);
  if (!who){ talking = null; return; }
  const item = talkQ[who].shift();
  talking = who;
  setLine(who, item.text);
  const hasMouth = S.cards.some(c => c.type === who || (who === 'god' && c.type === 'package' && c.contents === 'first'));
  if (!hasMouth) toast(ic(who) + ' ' + item.text);
  talkTimer = setTimeout(function endLine(){
    // 멈춘 동안엔 말풍선을 붙잡아 두고, 풀리면 조금 더 보여준 뒤 넘어감
    if (paused){ item.held = true; talkTimer = setTimeout(endLine, 250); return; }
    if (item.held){ item.held = false; talkTimer = setTimeout(endLine, 1200 * TALK_SCALE); return; }
    setLine(who, null);
    talking = null;
    if (item.done) item.done();
    if (who === 'god' && !talkQ.god.length){
      const ws = speechWaiters;
      speechWaiters = [];
      for (const fn of ws) fn();
    }
    if (!talking) showNextTalk(who);
  }, Math.max(1800, item.text.length * 110) * TALK_SCALE);
}
function say(x){
  enqueueTalk('god', (Array.isArray(x) ? x : [x]).map(text => ({ text })));
}
function sayMaybe(arr){
  const now = Date.now();
  if (now - lastMaybe < 6000 || Math.random() > 0.4) return;
  lastMaybe = now;
  say(pick(arr));
}
// 갓의 할 말이 다 끝나면 부름
function afterSpeech(fn){
  if (!isTalking('god')){ fn(); return; }
  speechWaiters.push(fn);
}

// ── 상태 태그 (카드 한 장에 붙고 떨어짐) ──────────────
const statusOf = c => c.status || [];
const tagsOf = c => (DEFS[c.type].tags || []).concat(statusOf(c));
function setStatus(c, remove, add){
  const s = statusOf(c).filter(t => !remove.includes(t));
  for (const a of add) if (!s.includes(a)) s.push(a);
  c.status = s;
}
// 음식 회복량: 익힘 +2, 날것 +1, 그 밖엔 카드 정의값(열매 등)
function healOf(def){
  if (def.heal) return def.heal;                               // v0.48.0: 카드별 회복량 우선
  if (tagLevel(def, '익힘')) return 2;
  if (tagLevel(def, '날것')) return 1;
  return def.heal || 0;
}

// ── quest 종류 ──────────────────────────────────────
//   갓: { need:3, stack } 아무거나 → package
//   제출형 퀘스트: { quest, wants:'카드', need, stack, reward:'카드' }
//   조건형 퀘스트: { quest, goal:'fullHp', target } / { quest, goal:'equip', slot, target }
const isGodRequest = rq => !rq.quest;
function reqDone(rq){
  if (rq.goal === 'fullHp'){
    const t = byId(rq.target);
    return !!t && t.hp >= DEFS[t.type].hp && !statusOf(t).includes('빈사');
  }
  if (rq.goal === 'make'){
    // 한 번이라도 만들어진 적 있으면 완료 — 만들자마자 다음 조합에 써버려도 인정 (v0.32.1 버그 수정)
    if (S.seen.includes(rq.make) || S.cards.some(c => c.type === rq.make)) rq.made = true;
    return !!rq.made;
  }
  if (rq.goal === 'store') return !!S.flags.stored;            // container에 한 장이라도 담은 적 있음
  if (rq.goal === 'sweep') return !!S.flags.swept;             // 택을 당겨 쓸어담은 적 있음
  if (rq.goal === 'visitPlace'){
    const t = byId(rq.target);
    const pl = t && t.visit != null ? byId(t.visit) : null;
    return !!pl && pl.type === rq.place;                        // 대상이 그 장소를 방문하면 완료
  }
  if (rq.goal === 'sleep'){
    const t = byId(rq.target);
    if (!t) return false;
    const pl = t.visit != null ? byId(t.visit) : null;
    if (pl && pl.type === rq.place) rq.visited = true;         // 조건1: 풀 깔개 방문 (한 번 방문하면 체크 유지)
    return !!rq.visited && t.hp >= DEFS[t.type].hp;            // 조건2: 체력 가득
  }
  if (rq.goal === 'hpMin'){
    const t = byId(rq.target);
    return !!t && t.hp >= rq.min && !statusOf(t).includes('빈사');
  }
  if (rq.goal === 'equip'){
    const t = byId(rq.target);
    return !!t && !!(t.equip && t.equip[rq.slot]);          // 그 칸에 뭐든 장비하면 완료
  }
  return rq.stack.length >= rq.need;
}
function reqProgress(rq){
  if (rq.goal === 'fullHp'){
    const t = byId(rq.target);
    return t ? `체력 ${t.hp} / ${DEFS[t.type].hp}` : '대상 없음';
  }
  if (rq.goal === 'make'){
    const done = rq.made || S.seen.includes(rq.make) || S.cards.some(c => c.type === rq.make);
    return `${done ? '✔' : '☐'} ${ic(rq.make)} ${DEFS[rq.make].name} 만들기`;
  }
  if (rq.goal === 'store') return `${S.flags.stored ? '✔' : '☐'} ${ic('sack')} 합칠 수 있음 카드 1장 담기`;
  if (rq.goal === 'sweep') return `${S.flags.swept ? '✔' : '☐'} ${ic('sack')} 택을 당겨 쓸어담기`;
  if (rq.goal === 'visitPlace'){
    const t = byId(rq.target);
    if (S.cards.some(c => c.type === rq.place)) rq.made = true;   // 한 번 만들면 체크 유지
    const pl = t && t.visit != null ? byId(t.visit) : null;
    const visited = !!pl && pl.type === rq.place;
    const P = DEFS[rq.place], T = t ? DEFS[t.type] : null;
    return `${rq.made ? '✔' : '☐'} ${ic(rq.place)} ${P.name} 만들기\n${visited ? '✔' : '☐'} ${T ? ic(t.type) + ' ' + T.name : '대상'} 올려놓기`;
  }
  if (rq.goal === 'sleep'){
    const t = byId(rq.target);
    if (!t) return '대상 없음';
    const pl = t.visit != null ? byId(t.visit) : null;
    const visited = rq.visited || (pl && pl.type === rq.place);
    const max = DEFS[t.type].hp;
    return `${visited ? '✔' : '☐'} ${DEFS[rq.place].name} 방문\n${t.hp >= max ? '✔' : '☐'} 체력 ${t.hp} / ${max}`;
  }
  if (rq.goal === 'hpMin'){
    const t = byId(rq.target);
    return t ? `체력 ${t.hp} / ${rq.min}` : '대상 없음';
  }
  if (rq.goal === 'equip'){
    const t = byId(rq.target);
    const it = t && t.equip && t.equip[rq.slot];
    return `${rq.slot} 칸: ${it && DEFS[it] ? ic(it) : '비어 있음'}`;
  }
  if (rq.wantsList) return rq.wantsList.map(t => `${rq.stack.includes(t) ? '✔' : '☐'} ${ic(t)} ${DEFS[t].name}`).join('\n');
  if (rq.wants) return `${ic(rq.wants)} ${DEFS[rq.wants].name} ${rq.stack.length} / ${rq.need}`;
  return `${rq.stack.length} / ${rq.need}`;
}
function reqReward(rq){
  if (rq.rewards) return '보상 ' + rq.rewards.map(r => DEFS[r] ? ic(r) : '').join(' ');
  if (rq.rewardText) return rq.rewardText;
  if (rq.reward && DEFS[rq.reward]) return `보상 ${ic(rq.reward)} ${DEFS[rq.reward].name}`;
  if (rq.goal === 'fullHp') return '보상: 허기짐 해결';
  if (rq.goal === 'equip') return '보상 없음';
  if (rq.reward && DEFS[rq.reward]) return `보상 ${ic(rq.reward)} ${DEFS[rq.reward].name}`;
  return `보상 ${ic('package')}`;
}

// ── 기사의 퀘스트 ─────────────────────────────────────
//   stage 0: 시작 (빈사) → 갓의 "골수를 만들어 와" 완료 뒤 "..." → 뼛가루의 치유력 → 갓 "이런 우연이"
//   stage 2: 뼛가루 완료 (허기짐) → "배고파" → 밥이 보약
//   stage 3: 밥이 보약 완료 (빈사 해결) → "졸려" → 잠이 보약
//   stage 4: 잠이 보약 완료 → 부러진 칼자루·나무판 → "고맙다" → 무기를 들어라
//   stage 5: 무기를 들어라 완료
let knightSpeech = null, knightTimer = null;
function repaint(type){
  if (drag) return;
  const c = S.cards.find(o => o.type === type);
  const el = c && els.get(c.id);
  if (el) paint(el, c);
}
function knightSay(text, done){
  enqueueTalk('knight', [{ text, done }]);
}
function knightLine(k){
  const st = statusOf(k);
  if (st.includes('빈사')) return '...';
  if (st.includes('허기짐')) return '배고파';
  return null;
}
// 이 quest가 이 카드를 아직 원하나 (wants: 한 종류 N개 / wantsList: 여러 종류 1개씩)
function wantsNeed(rq, type){
  if (rq.wantsList) return rq.wantsList.includes(type) && !rq.stack.includes(type);
  if (rq.wants) return rq.wants === type && rq.stack.length < rq.need;
  return false;
}
// 갓의 불 quest 줄: 불씨 만들기 → 불쏘시개 만들기 → 모닥불 만들기 → 불멍이 하고 싶어(갓을 모닥불에 올려놓기)
//   만들기 quest는 조합식 공개 + 그 카드가 테이블에 생기면 완료 (제출하지 않음 → 다음 단계 재료로 씀)
const FIRE_STEPS = [
  { quest: 'fire1', title: '불씨 만들기', goal: 'make', make: 'ember', recipe: ['stone', 'flint', 'ember'] },
  { quest: 'fire2', title: '불쏘시개 만들기', goal: 'make', make: 'tinder', recipe: ['grass', 'twig', 'tinder'] },
  { quest: 'fire3', title: '모닥불 만들기', goal: 'make', make: 'campfire', recipe: ['ember', 'tinder', 'campfire'] },
  { quest: 'firemood', title: '불멍이 하고 싶어', goal: 'visitPlace', place: 'campfire' },
];
function giveFireQuest(i){
  if (paused || drag || tear || busy){ setTimeout(() => giveFireQuest(i), 200); return; }
  const g = S.cards.find(c => c.type === 'god');
  const step = FIRE_STEPS[i];
  if (!g || !step || questExists(step.quest)) return;
  const deliver = () => {
    if (paused || drag || tear || busy){ setTimeout(deliver, 200); return; }
    const gg = S.cards.find(c => c.type === 'god');
    if (!gg || questExists(step.quest)) return;
    const rq = addCard('quest', gg.x, gg.y, Object.assign({ target: gg.id, giver: gg.id, need: 0, stack: [], rewardText: '보상 없음' }, step));
    slideOutFrom(rq, gg);
    save();
    renderAll();
  };
  if (step.quest === 'firemood'){ say(LINES.fireAsk); afterSpeech(deliver); }   // "나를 모닥불 위에 올려놔"
  else deliver();
}
// 갓의 quest "신의 품에서": 풀 깔개 조합식 공개, 풀 깔개가 생기면 완료 (제출 없음)
function giveBedQuest(){
  if (paused || drag || tear || busy){ setTimeout(giveBedQuest, 200); return; }
  const g = S.cards.find(c => c.type === 'god');
  if (!g || questExists('godsbed')) return;
  const rq = addCard('quest', g.x, g.y, {
    quest: 'godsbed', title: '신의 품에서', goal: 'make', make: 'bedding', recipe: ['grass', 'grass', 'bedding'],
    target: g.id, giver: g.id, need: 0, stack: [], rewardText: '보상 없음',
  });
  slideOutFrom(rq, g);
  save();
  renderAll();
}
// 갓의 quest 줄 "마음의 평화": 손질된 가죽 → 부실한 자루 → 자루에 담기 → 쓸어담기 (한 단계 끝나면 다음 quest)
//   만들기 두 단계는 조합식을 인스펙터에서 공개 (recipeId)
const PEACE_STEPS = [
  { quest: 'peace1', title: '손질된 가죽 만들기', goal: 'make', make: 'tannedhide', recipeId: 'tan' },
  { quest: 'peace2', title: '부실한 자루 만들기', goal: 'make', make: 'sack', recipeId: 'sack' },
  { quest: 'peace3', title: '자루에 담기', goal: 'store' },
  { quest: 'peace4', title: '마음의 평화', goal: 'sweep' },
];
function givePeaceQuest(i){
  if (paused || drag || tear || busy){ setTimeout(() => givePeaceQuest(i), 200); return; }
  const g = S.cards.find(c => c.type === 'god');
  const step = PEACE_STEPS[i];
  if (!g || !step || questExists(step.quest)) return;
  const rq = addCard('quest', g.x, g.y, Object.assign({ target: g.id, giver: g.id, need: 0, stack: [], rewardText: '보상 없음' }, step));
  slideOutFrom(rq, g);
  save();
  renderAll();
}
const questExists = q => S.cards.some(c => c.type === 'quest' && c.quest === q);
function giveKnightQuest(kind){
  const k = S.cards.find(c => c.type === 'knight');
  if (!k) return;
  const p = findSpot(k.x - CW * 1.1, k.y);
  const spec = {
    bone:  { quest: 'bonepowder', title: '뼛가루의 치유력', wants: 'marrow', need: 2, stack: [], rewardText: '보상: 빈사 → 허기짐' },
    food:  { quest: 'foodmedicine', title: '밥이 보약', wantsList: ['roastclam', 'roastmeat', 'roastberry'], need: 3, stack: [], rewardText: '보상: 허기짐 해결' },
    sleep: { quest: 'sleepmedicine', title: '잠이 보약', goal: 'sleep', place: 'bedding', target: k.id, need: 0, stack: [], rewards: ['hilt', 'plank'] },
    sword: { quest: 'takesword', title: '무기를 들어라', goal: 'equip', slot: '무기', target: k.id, need: 0, stack: [] },
    shield: { quest: 'takeshield', title: '방패를 들어라', goal: 'equip', slot: '방패', target: k.id, need: 0, stack: [] },
  }[kind];
  const rq = addCard('quest', p.x, p.y, Object.assign({ giver: k.id }, spec));
  if (kind === 'bone') say(LINES.coincidence);              // 방금 만든 게 골수 → 갓: "이런 우연이"
  if (kind === 'food' && !S.flags.fireGiven){
    S.flags.fireGiven = true;
    say(LINES.fireGrumble);                                 // "익힌 것만 먹는 기사라, 입이 고급이구만"
    afterSpeech(() => giveFireQuest(0));
  }
  if (kind === 'sleep' && !S.flags.bedGiven){
    S.flags.bedGiven = true;
    say(LINES.bedGrumble);                                  // "어이구, 이젠 잠자리까지. 소풍 왔나."
    afterSpeech(giveBedQuest);                              // → "신의 품에서" (풀 깔개 조합식 공개)
  }
  slideOutFrom(rq, k);                                      // 기사 뒤에서 오른쪽으로 미끄러져 나옴
  bumpIds.add(k.id);
  save();
  renderAll();
}
function knightCheck(){
  if (!S || paused || isTalking('knight') || drag || tear || busy) return;
  const k = S.cards.find(c => c.type === 'knight');
  if (!k) return;
  const stage = S.flags.knightStage || 0;
  if (stage === 0){
    if (!statusOf(k).includes('빈사') || !S.flags.comboDone) return;   // 갓의 첫 조합 quest를 끝낸 뒤
    S.flags.knightStage = 1;
    save();
    knightSay('...', knightCheck);                           // 대사 끝나고 quest
    return;
  }
  if (stage === 1 && !questExists('bonepowder')) giveKnightQuest('bone');
  if (stage === 2 && !questExists('foodmedicine')) giveKnightQuest('food');
  if (stage === 3 && !questExists('sleepmedicine')) giveKnightQuest('sleep');
  // 무기를 들어라와 방패를 들어라가 함께 나옴. 둘 다 끝나야 stage 5
  if (stage === 4 && !S.flags.swordDone && !questExists('takesword')) giveKnightQuest('sword');
  if ((stage === 4 || stage === 5) && !S.flags.shieldDone && !questExists('takeshield')) giveKnightQuest('shield');
  // "준비됐어" 뒤 → 갓의 마음의 평화
  if (stage === 5 && S.flags.readySaid && !S.flags.peaceGiven){
    S.flags.peaceGiven = true;
    save();
    givePeaceQuest(0);
  }
}

// ── 판정: 대상 + 올리는 카드 ──────────────────────────
function evaluate(d, t){
  const dd = DEFS[d.type], td = DEFS[t.type];
  if (t.duel != null) return null;                            // 대결 중인 카드엔 아무것도 못 올림
  if (td.kind === 'creature'){
    if (dd.kind === 'character') return { act: 'duel', full: statusOf(d).includes('빈사') };   // 대결 (빈사면 못 함)
    if (tagLevel(dd, '무기')){
      const low = (dd.atk || 0) < t.hp;                         // 한 방에 못 쓰러뜨림
      return { act: 'strike', full: low, low };                // 전리품이 상한이면 그 카드만 안 나옴
    }
    return null;
  }
  if (dd.kind === 'character' && tagLevel(td, '장소')){
    // 방문. 장소마다 최대 인원이 있음 (다 차 있으면 못 함)
    const others = S.cards.filter(o => o.visit === t.id && o.id !== d.id).length;
    return { act: 'visit', full: others >= (td.capacity || Infinity) };
  }
  if (td.kind === 'container'){
    // 담기: 합칠 수 있음 카드만, 한 종류만, 용량까지
    if (!tagLevel(dd, '합칠 수 있음')) return null;
    if (t.count && t.fill !== d.type) return null;
    return { act: 'store', full: (t.count || 0) >= td.hold };
  }
  const edible = tagLevel(dd, '먹을 수 있음') || tagLevel(dd, '빈사 치유');
  if (td.kind === 'quest'){
    if (t.goal === 'equip'){
      // 조건형 request에 맞는 장비를 놓으면 대상에게 장비한 것과 같음
      const tg = byId(t.target);
      return tg && tagLevel(dd, t.slot) ? { act: 'equip', slot: t.slot, onto: tg } : null;
    }
    if (t.goal === 'fullHp' || t.goal === 'hpMin' || t.goal === 'sleep'){
      // 조건형 request에 음식을 내려놓으면 대상에게 먹인 것과 같음
      const tg = byId(t.target);
      return tg && edible ? { act: 'eat', feed: tg } : null;
    }
    if (t.goal || t.stack.length >= t.need) return null;      // 이미 다 참
    if (t.wantsList) return wantsNeed(t, d.type) ? { act: 'submit' } : null;
    if (t.wants) return d.type === t.wants ? { act: 'submit' } : null;
    return submittable(dd) ? { act: 'submit' } : null;
  }
  if (td.kind === 'character'){
    // 캐릭터의 장비 칸(칼·방패)과 같은 태그를 가진 카드 → 장비
    const slot = (td.slots || []).find(sl => tagLevel(dd, sl));
    if (slot) return { act: 'equip', slot };
  }
  if (td.kind === 'character' && edible){
    // 이 캐릭터가 준 제출형 request가 이 카드를 원하면, 직접 먹여도 그 request에 들어감
    const into = S.cards.find(r => r.type === 'quest' && r.giver === t.id && wantsNeed(r, d.type));
    if (into) return { act: 'submit', into, eatToo: true };   // quest 수량도 오르고, 체력 카드면 먹어서 체력도 오름
    return { act: 'eat' };
  }
  const ms = usableRecipes(d.type, t.type);
  if (!ms.length) return null;
  if (ms.length > 1) console.warn('[제작자 알림] 조합 겹침', d.type, t.type, ms.map(m => m.r.id));
  const m = ms[0];
  // 장소는 월드에 하나만 → 이미 있는 장소가 나오는 조합은 안 됨
  const dup = (m.r.out || []).find(o => tagLevel(DEFS[o], '장소') && S.cards.some(c => c.type === o));
  const outs = m.r.cook ? [DEFS[(m.aIsX ? t : d).type].cooked] : (m.r.out || []);   // 익히기는 익힌 카드가 새로 생김
  const capped = dup || !outs.length || outs.some(o => o && canSpawn(o)) ? null : outs[0];   // 하나도 못 나올 때만 조합 안 됨
  return { act: 'recipe', r: m.r, A: m.aIsX ? d : t, B: m.aIsX ? t : d, full: !!(dup || capped), dup, capped };
}
function apply(ev, d, t){
  const dd = DEFS[d.type];
  if (ev.act === 'submit'){
    const rq = ev.into || t;
    removeCard(d.id);
    rq.stack.push(d.type);
    rq.z = ++S.z;
    bumpIds.add(rq.id);
    if (ev.into) bumpIds.add(t.id);
    // 캐릭터가 원한 체력 카드: quest에 올리든 캐릭터에게 주든 똑같이 그 캐릭터 체력이 오름 (체력 아이템 학습)
    //   "아무거나 3개"처럼 특정 카드를 원하지 않는 quest는 먹이지 않음
    const g = rq.giver != null ? byId(rq.giver) : null;
    if (g && g.hp != null && (rq.wants || rq.wantsList)){
      const max = DEFS[g.type].hp;
      const heal = healOf(dd);
      if (heal > 0 && g.hp < max && !statusOf(g).includes('빈사')){
        const before = g.hp;
        g.hp = Math.min(max, g.hp + heal);
        floatText(g, `${si('hp')} +${g.hp - before}`);
        bumpIds.add(g.id);
        if (g.hp >= max && statusOf(g).includes('허기짐')){
          setStatus(g, ['허기짐'], []);
          toast(`🍽️ ${DEFS[g.type].name}: 허기짐 해결`);
        }
      }
    }
    return true;
  }
  if (ev.act === 'strike'){
    if (ev.low){
      toast(`${ic(d.type)} 무기의 공격력 낮음 (${si('atk')} ${dd.atk || 0} < ${si('hp')} ${t.hp})`);
      floatText(t, '무기의 공격력 낮음', 'work');
      return false;
    }
    killCreature(t);
    relocate(d);                                            // 무기는 남음
    return true;
  }
  if (ev.act === 'duel'){
    if (ev.full){ toast(`${DEFS[d.type].name} 빈사 상태 — 대결할 수 없음`); return false; }
    startDuel(d, t);
    return true;
  }
  if (ev.act === 'store'){
    if (ev.full){ toast(`가득 참 — ${DEFS[t.type].name} 최대 ${DEFS[t.type].hold}장`); return false; }
    removeCard(d.id);
    storeInto(t, d.type);
    return true;
  }
  if (ev.act === 'visit'){
    if (ev.full){ toast(`자리가 가득 참 — ${DEFS[t.type].name} 최대 ${DEFS[t.type].capacity}명`); return false; }
    if (d.visit !== t.id){ d.visit = t.id; d.visitSeq = ++S.z; }   // 방문: 장소 오른쪽 줄 끝에 섬
    bumpIds.add(t.id);
    toast(`📍 ${dd.name} → ${DEFS[t.type].name} 방문`);
    return true;
  }
  if (ev.act === 'equip'){
    if (ev.onto){ bumpIds.add(t.id); t = ev.onto; }            // request에 놓음 → 대상에게 장비
    const slot = ev.slot;
    t.equip = t.equip || {};
    const prev = t.equip[slot];
    removeCard(d.id);
    t.equip[slot] = d.type;
    bumpIds.add(t.id);
    toast(`${ic(d.type)} ${DEFS[t.type].name}: ${DEFS[d.type].name} 장비 (${slot})`);
    if (prev && DEFS[prev]){
      // 같은 칸에 다른 장비가 올라오면 이전 장비는 방출
      const p = findSpot(t.x + CW * 1.1, t.y + CH * 0.3);
      const pc = addCard(prev, p.x, p.y, null, true);
      spawned.delete(pc.id);
      popFrom.set(pc.id, { x: t.x, y: t.y });
      toast(`↩ ${DEFS[prev].name} 방출`);
    }
    return true;
  }
  if (ev.act === 'eat'){
    if (ev.feed){ bumpIds.add(t.id); t = ev.feed; }              // request에 내려놓음 → 대상에게 먹임
    const max = DEFS[t.type].hp;
    const talk = () => { if (t.type === 'knight' && !isTalking('knight') && knightLine(t)) knightSay(knightLine(t)); };
    if (statusOf(t).includes('빈사')){
      // 빈사는 빈사 치유 아이템으로만 해결 → 허기짐
      if (!tagLevel(dd, '빈사 치유')){ toast('빈사 상태 — 빈사 치유가 필요함'); talk(); return false; }
      setStatus(t, ['빈사'], ['허기짐']);
      removeCard(d.id);
      bumpIds.add(t.id);
      toast(`💊 ${DEFS[t.type].name}: 빈사 → 허기짐`);
      return true;
    }
    const heal = healOf(dd);
    if (heal <= 0){ toast('효과 없음'); return false; }
    if (t.hp >= max){ toast('체력이 가득함'); return false; }
    const before = t.hp;
    t.hp = Math.min(max, t.hp + heal);
    floatText(t, `${si('hp')} +${t.hp - before}`);   // 먹어서 오른 체력
    removeCard(d.id);
    bumpIds.add(t.id);
    // 허기짐은 체력을 최대치까지 채우면 해결
    if (t.hp >= max && statusOf(t).includes('허기짐')){
      setStatus(t, ['허기짐'], []);
      toast(`🍽️ ${DEFS[t.type].name}: 허기짐 해결`);
    } else {
      talk();
    }
    return true;
  }
  if (ev.act === 'recipe'){
    if (ev.dup){ toast(`${ic(ev.dup)} ${DEFS[ev.dup].name} — 장소는 하나만 있을 수 있음`); return false; }
    if (ev.capped){ capToast(ev.capped); return false; }
    const { r, A, B } = ev;
    const bx = t.x, by = t.y;
    if (r.cook){
      // 날것 태그가 떨어지고 익힘 태그가 붙음 → 익힌 카드로 바뀜
      B.type = DEFS[B.type].cooked;
      markSeen(B.type);
      spawned.add(B.id);
      bumpIds.add(A.id);
      relocate(d);
    } else {
      const consumed = [];
      if (r.keep !== 'a') consumed.push(A);
      if (r.keep !== 'b') consumed.push(B);
      const targetKept = !consumed.includes(t);
      for (const c of consumed) removeCard(c.id);
      const omitted = [];
      for (const o of (r.out || [])){
        if (!canSpawn(o)){ omitted.push(o); continue; }        // 월드 상한까지만 채움
        const p = findSpot(targetKept ? bx + CW * 0.9 : bx, by);
        addCard(o, p.x, p.y);
      }
      omitToast(omitted);
      if (targetKept) bumpIds.add(t.id);
      if (!consumed.includes(d)) relocate(d);
      if (r.burn) toast(`${ic(B.type)} ${DEFS[B.type].name} 태우기 → ${ic('ash')} 재`);
    }
    if (!S.found.includes(r.id)){
      S.found.push(r.id);
      if (bookOpen && !discoRunning) renderBook();
      toast('✨ 새 조합: ' + recipeText(r));
      if (!S.flags.discovered){
        S.flags.discovered = true;
        say(LINES.firstDiscovery);
      } else {
        sayMaybe(LINES.discover);
      }
    }
    return true;
  }
  return false;
}

// 조합 규칙 점검 — 겹치거나 빠진 게 있으면 제작자에게 알림
function validateRecipes(){
  const issues = [];
  const types = Object.keys(DEFS);
  for (const id of types){
    const d = DEFS[id];
    if (tagLevel(d, '날것') && tagLevel(d, '익힘')) issues.push(`${d.name}: 날것과 익힘은 상극인데 둘 다 붙어 있음`);
  }
  for (let i = 0; i < types.length; i++){
    for (let j = i; j < types.length; j++){
      const ms = recipesFor(types[i], types[j]);
      for (const m of ms){
        if (!m.r.cook) continue;
        const raw = m.aIsX ? types[j] : types[i];
        if (!DEFS[raw].cooked) issues.push(`${DEFS[raw].name}: 날것인데 익힌 결과(cooked)가 없음`);
      }
      const ids = [...new Set(ms.map(m => m.r.id))];
      if (ids.length > 1) issues.push(`${DEFS[types[i]].name} + ${DEFS[types[j]].name}: 조합 겹침 (${ids.join(', ')}) — 하나를 해소해야 함`);
    }
  }
  const uniq = [...new Set(issues)];
  if (!uniq.length) return;
  console.warn('[제작자 알림] 조합 규칙 문제', uniq);
  devnote.innerHTML = '<b>⚠ 제작자 알림 · 조합 규칙</b><br>' + uniq.map(esc).join('<br>');
  devnote.hidden = false;
}

// ── 변화 후 처리 ──────────────────────────────────────
function afterChange(){
  checkSettle();
  save();
  renderAll();
  scheduleGod();
}
function checkSettle(){
  for (const rq of S.cards){
    if (rq.type !== 'quest') continue;
    if (reqDone(rq) && !settling.has(rq.id)){
      settling.add(rq.id);
      const id = rq.id;
      setTimeout(() => settle(id), 420);
    }
  }
}
function settle(id){
  if (paused || drag || tear || busy){ setTimeout(() => settle(id), 200); return; }
  settling.delete(id);
  const rq = byId(id);
  if (!rq || rq.type !== 'quest' || !reqDone(rq)) return;
  busy = true;
  const el = els.get(id);
  if (el) el.classList.add('gone');
  setTimeout(() => {
    const x = rq.x, y = rq.y;
    removeCard(id);                       // 정산: 제출물과 quest 제거
    busy = false;
    rewardFor(rq, x, y);
    save();
    renderAll();
    scheduleGod();
  }, 300);
}

// 무기를 들어라·방패를 들어라 둘 다 끝나면 기사: "준비됐어" (한 번)
function knightReady(){
  S.flags.knightStage = 5;
  if (S.flags.readySaid) return;
  S.flags.readySaid = true;
  knightSay('준비됐어', knightCheck);                        // 대사 끝나고 갓의 마음의 평화
}
function rewardFor(rq, x, y){
  if (rq.quest === 'bonepowder'){
    const k = byId(rq.giver);
    if (k && statusOf(k).includes('빈사')) setStatus(k, ['빈사'], ['허기짐']);
    S.flags.knightStage = 2;
    knightSay('배고파', knightCheck);                      // 대사 끝나고 다음 quest
    return;
  }
  if (rq.quest === 'foodmedicine'){
    const k = byId(rq.target);
    if (k) setStatus(k, ['빈사', '허기짐'], []);
    S.flags.knightStage = 3;
    toast('🩹 빈사 해결');
    knightSay('졸려', knightCheck);                          // "졸려" 뒤에 잠이 보약
    return;
  }
  if (rq.quest === 'takeshield'){
    S.flags.shieldDone = true;
    if (S.flags.swordDone || (S.flags.knightStage || 0) >= 5) knightReady();
    toast(`${si('def')} 방패를 들었다`);
    return;
  }
  if (rq.quest === 'takesword'){
    S.flags.swordDone = true;
    if (S.flags.shieldDone) knightReady();
    toast(`${si('atk')} 무기를 들었다`);
    return;
  }
  if (rq.quest === 'sleepmedicine'){
    const omitted = [];
    if (canSpawn('hilt')) addCard('hilt', x, y); else omitted.push('hilt');   // 보상이 먼저 보이고
    const p2 = findSpot(x + CW * 1.1, y);
    if (canSpawn('plank')) addCard('plank', p2.x, p2.y); else omitted.push('plank');
    omitToast(omitted);
    S.flags.knightStage = 4;
    toast('💤 잠이 보약 완료');
    knightSay('고맙다', knightCheck);                        // "고맙다" 뒤에 무기를 들어라
    return;
  }
  const pi = PEACE_STEPS.findIndex(f => f.quest === rq.quest);
  if (pi >= 0){
    if (pi < PEACE_STEPS.length - 1) givePeaceQuest(pi + 1);  // 다음 마음의 평화 quest
    else finishPeace();
    return;
  }
  if (rq.quest === 'godsbed'){
    toast(`${ic('bedding')} 신의 품에서 완료`);
    return;
  }
  const fi = FIRE_STEPS.findIndex(f => f.quest === rq.quest);
  if (fi >= 0){
    if (fi < FIRE_STEPS.length - 1) giveFireQuest(fi + 1);   // 다음 불 quest
    else toast(`${ic('campfire')} 불멍이 하고 싶어 완료`);
    return;
  }
  if (rq.quest === 'firstcombo'){
    S.flags.comboDone = true;                               // 이제 기사가 첫 quest를 냄
    say(LINES.comboDone);
    return;
  }
  S.flags.godSettles = (S.flags.godSettles || 0) + 1;       // 갓의 "아무거나 3개" 정산 횟수
  const gg = rq.giver != null ? byId(rq.giver) : null;
  if (!canSpawn('package')) omitToast(['package']);
  else if (gg){
    // 정산 보상 package도 갓 아래 방향으로 튀어나옴
    const p = findSpot(gg.x, gg.y + CH + 12);
    const pk = addCard('package', p.x, p.y, { contents: 'tutorial' });
    spawned.delete(pk.id);
    popFrom.set(pk.id, { x: gg.x, y: gg.y });
  } else {
    addCard('package', x, y, { contents: 'tutorial' });
  }
  say(pick(LINES.settle));
}

// ── 갓의 quest 공급 ─────────────────────────────────
// 이미 발견한 조합 중에 지금 테이블에서 할 수 있는 게 있나
function anyKnownRecipe(){
  const cs = S.cards;
  for (let i = 0; i < cs.length; i++){
    for (let j = i + 1; j < cs.length; j++){
      if (usableRecipes(cs[i].type, cs[j].type).some(m => S.found.includes(m.r.id))) return true;
    }
  }
  return false;
}
function submittableCount(){
  return S.cards.filter(c => submittable(DEFS[c.type])).length;
}
function scheduleGod(){
  clearTimeout(godTimer);
  godTimer = setTimeout(godCheck, 1400);
}
// 갓이 지금 무엇을 줘야 하나: null | 'quest' | 'package'
// 마음의 평화 완료: 갓의 "아무거나 3개"는 끝 (떠 있던 것도 사라지고, 올려둔 카드는 테이블로) → "갓 파워!" → 산
function finishPeace(){
  toast(`${ic('sack')} 마음의 평화 완료`);
  S.flags.peaceDone = true;
  gift = null;
  for (const rq of S.cards.filter(c => c.type === 'quest' && isGodRequest(c))){
    for (const t of rq.stack){
      const p = findSpot(rq.x, rq.y + CH * 0.5);
      const nc = addCard(t, p.x, p.y, null, true);
      spawned.delete(nc.id);
      popFrom.set(nc.id, { x: rq.x, y: rq.y });
    }
    settling.delete(rq.id);
    removeCard(rq.id);
  }
  say(LINES.godPower);
  afterSpeech(giveMountain);
}
function giveMountain(){
  if (S.flags.mountainGiven) return;
  if (paused || drag || tear || busy){ setTimeout(giveMountain, 200); return; }
  S.flags.mountainGiven = true;
  const g = S.cards.find(c => c.type === 'god');
  const { w, h } = tableSize();
  const p = g ? findSpot(g.x, g.y + CH + 12) : findSpot(w / 2, h / 2);
  const m = addCard('mountain', p.x, p.y);
  if (g){
    spawned.delete(m.id);
    popFrom.set(m.id, { x: g.x, y: g.y });                   // 갓에게서 튀어나옴
    bumpIds.add(g.id);
  }
  save();
  renderAll();
}
function decideGift(){
  const has = type => S.cards.some(c => c.type === type);
  if (!has('god')) return null;
  if (S.flags.peaceDone) return null;                         // 마음의 평화 뒤로는 아무거나 3개 없음
  const avail = submittableCount();
  const requests = S.cards.filter(c => c.type === 'quest' && isGodRequest(c));
  if (requests.length){
    // quest 3개를 달성할 수 없으면 package로 보태줌 (이미 package가 있으면 그걸 열면 됨). quest는 그대로 둠
    if (requests.some(rq => rq.stack.length + avail >= rq.need)) return null;
    return has('package') ? null : 'package';
  }
  // 갓의 "아무거나 3개" quest는 클리어하면 다시 리필 — 늘 하나 떠 있음
  return 'quest';
}
// 갓이 quest로 첫 조합(돌 + 뼈 → 골수)을 소개
//   조건: 갓의 "아무거나 3개"를 처음 한 번 정산한 뒤. 한 번만. 기사의 첫 quest는 이게 끝난 뒤에 나옴
function comboQuestCheck(){
  if (S.flags.comboGiven) return false;
  const god = S.cards.find(c => c.type === 'god');
  if (!god || isTalking('god')) return false;
  if ((S.flags.godSettles || 0) < 1) return false;
  S.flags.comboGiven = true;
  save();
  say(LINES.comboIntro);
  const deliver = () => {
    if (paused || drag || tear || busy){ setTimeout(deliver, 200); return; }
    const g = S.cards.find(c => c.type === 'god');
    if (!g || questExists('firstcombo')) return;
    const rq = addCard('quest', g.x, g.y, {
      quest: 'firstcombo', title: '골수 만들기', goal: 'make', make: 'marrow', need: 0, stack: [],
      recipe: ['stone', 'bone', 'marrow'], rewardText: '보상 없음', target: g.id, giver: g.id,   // 제출 없이 골수가 생기면 완료
    });
    slideOutFrom(rq, g);
    save();
    renderAll();
  };
  afterSpeech(deliver);                                     // 대사가 끝난 뒤 갓 옆으로 미끄러져 나옴
  return true;
}
// 신의 구원: 기사가 빈사인데 살릴 방법이 없으면 갓이 구호 package를 줌
//   살릴 방법 = 골수가 있음, 또는 골수를 만들 뼈 + 손질 lv1 이상 도구가 있음 (테이블 또는 container 안)
//   튜토리얼 첫 빈사(기사 stage 0~1)는 골수 quest가 풀어주므로 제외. 이미 신의 구원이 있으면 안 줌
let salvationPending = false;
function reviveReachable(){
  const avail = type => S.cards.some(c => c.type === type || (c.fill === type && c.count > 0));
  if (avail('marrow')) return true;
  const tool = Object.keys(DEFS).some(t => tagLevel(DEFS[t], '손질') >= 1 && avail(t));
  return tool && avail('bone');
}
function salvationCheck(){
  if (salvationPending) return false;
  const k = S.cards.find(c => c.type === 'knight');
  const g = S.cards.find(c => c.type === 'god');
  if (!k || !g || isTalking('god')) return false;
  if ((S.flags.knightStage || 0) < 2) return false;
  if (!statusOf(k).includes('빈사') || k.duel != null) return false;
  if (S.cards.some(c => c.type === 'salvation') || reviveReachable()) return false;
  salvationPending = true;
  say(LINES.salvation);                                     // "신이 인간을 불쌍히 여겨.."
  afterSpeech(giveSalvation);
  return true;
}
function giveSalvation(){
  if (paused || drag || tear || busy){ setTimeout(giveSalvation, 200); return; }
  salvationPending = false;
  const g = S.cards.find(c => c.type === 'god');
  if (!g || S.cards.some(c => c.type === 'salvation')) return;
  const p = findSpot(g.x, g.y + CH + 12);
  const pk = addCard('salvation', p.x, p.y);
  spawned.delete(pk.id);
  popFrom.set(pk.id, { x: g.x, y: g.y });                   // 갓에게서 튀어나옴
  bumpIds.add(g.id);
  save();
  renderAll();
}
function godCheck(){
  knightCheck();
  if (gift) return;                                          // 이미 줄 게 정해져 멘트 중
  if (paused || drag || tear || busy || settling.size){ scheduleGod(); return; }
  if (comboQuestCheck()) return;
  if (S.flags.peaceDone && !S.flags.mountainGiven && !isTalking('god')){ giveMountain(); return; }   // 산을 받기 전에 새로고침한 경우
  if (salvationCheck()) return;                                // 빈사 기사를 살릴 방법이 없으면 신의 구원
  const kind = decideGift();
  if (!kind) return;
  gift = { kind };
  const hasRequest = S.cards.some(c => c.type === 'quest' && isGodRequest(c));
  if (kind === 'package') say(hasRequest ? pick(LINES.rescue) : LINES.free);
  else if (S.flags.requestsGiven) say(pick(LINES.refill));     // 리필: "언제든지 필요하면 말해"
  else say(LINES.firstRequest);
  afterSpeech(deliverGift);                                   // 멘트를 다 끝낸 다음 줌
}
function deliverGift(){
  if (!gift) return;
  if (paused || drag || tear || busy || settling.size){ setTimeout(deliverGift, 200); return; }
  const kind = gift.kind;
  gift = null;
  if (decideGift() !== kind){ scheduleGod(); return; }       // 멘트 동안 상황이 바뀜 → 취소 후 다시 판단
  const god = S.cards.find(c => c.type === 'god');
  // package는 갓 아래로, quest는 갓 오른쪽으로
  const p = kind === 'package' ? findSpot(god.x, god.y + CH + 12) : findSpot(god.x + CW * 1.1, god.y);
  const c = kind === 'package'
    ? addCard('package', p.x, p.y, { contents: 'tutorial' })
    : addCard('quest', p.x, p.y, { need: 3, stack: [], title: '아무거나 3개만 줘봐', giver: god.id });
  if (kind === 'quest') S.flags.requestsGiven = (S.flags.requestsGiven || 0) + 1;
  if (kind === 'quest') slideOutFrom(c, god);                // 갓 뒤에서 오른쪽으로 미끄러져 나옴
  else popFrom.set(c.id, { x: god.x, y: god.y });              // package는 갓에게서 튀어나옴
  bumpIds.add(god.id);
  save();
  renderAll();
  scheduleGod();
}

// ── package 오픈 ──────────────────────────────────────
const tearLen = () => CW * 0.9;
// 택 = 좌상단 삼각형. 뜯긴 선은 들쭉날쭉
const tabSize = () => ({ tw: CW * 0.36, th: CH * 0.27 });
// (x1,y1) → (x2,y2) 사이 들쭉날쭉한 점들 (양 끝점 제외). 모양은 고정이라 매 프레임 흔들리지 않음
function jagLine(x1, y1, x2, y2, n, amp, seed){
  const pts = [];
  const len = Math.hypot(x2 - x1, y2 - y1) || 1;
  const nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
  for (let i = 1; i < n; i++){
    const t = i / n;
    const a = ((((i * 7 + seed) % 5) / 4) - 0.5) * 2 * amp;
    pts.push([x1 + (x2 - x1) * t + nx * a, y1 + (y2 - y1) * t + ny * a]);
  }
  return pts;
}
const poly = pts => 'polygon(' + pts.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(', ') + ')';
const tearEdge = () => { const { tw, th } = tabSize(); return jagLine(tw, 0, 0, th, 9, 2.2, 3); };
// 모서리가 뜯겨 나간 카드 모양
function cardMinusTab(){
  const { tw, th } = tabSize();
  return [[tw, 0], [CW, 0], [CW, CH], [0, CH], [0, th], ...tearEdge().reverse()];
}
function startPeel(){
  const c = byId(tear.id);
  const { tw, th } = tabSize();
  const piece = document.createElement('div');
  piece.className = 'tab-piece';
  piece.style.left = c.x + 'px';
  piece.style.top = c.y + 'px';
  piece.style.width = tw + 'px';
  piece.style.height = th + 'px';
  piece.style.clipPath = poly([[0, 0], [tw, 0], ...tearEdge(), [0, th]]);
  piece.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M100 0 L0 100"/></svg>';
  table.appendChild(piece);
  tear.piece = piece;
  if (tear.tab) tear.tab.style.visibility = 'hidden';
  tear.el.style.clipPath = poly(cardMinusTab());     // 카드의 모서리가 뜯겨 나감
}
function updateTear(px, py){
  const dx = px - tear.sx, dy = py - tear.sy;
  const dist = Math.hypot(dx, dy);
  tear.dist = dist;
  if (tear.sweep){
    // container 택: 당기는 쪽으로 늘어나기만 하고 찢어지지 않음
    const k = Math.min(1, dist / tearLen());
    const ux = dist ? dx / dist : 0, uy = dist ? dy / dist : 0;
    const off = Math.min(dist, tearLen()) * 0.35;
    if (tear.tab) tear.tab.style.transform = `translate(${ux * off}px, ${uy * off}px)`;
    const tug = k * CW * 0.05;
    tear.el.style.transform = `translate(${ux * tug}px, ${uy * tug}px)`;
    tear.el.classList.toggle('ready', k >= 1);
    return;
  }
  if (!tear.piece && dist > 3) startPeel();
  if (!tear.piece) return;
  const k = Math.min(1, dist / tearLen());
  const ux = dist ? dx / dist : 0, uy = dist ? dy / dist : 0;
  // 가까울 땐 카드에 붙어 버티고, 멀어질수록 떨어짐 (고무줄처럼)
  const off = dist * Math.pow(k, 1.8);
  tear.ux = ux; tear.uy = uy; tear.off = off;
  tear.piece.style.transform = `translate(${ux * off}px, ${uy * off}px) rotate(${-k * 28}deg)`;
  // 카드는 당기는 쪽으로 살짝 끌려옴
  const tug = k * CW * 0.05;
  tear.el.style.transform = `translate(${ux * tug}px, ${uy * tug}px) rotate(${k * 3}deg)`;
  tear.el.classList.toggle('ready', k >= 1);
  tear.piece.classList.toggle('ready', k >= 1);
}
function endTear(){
  const t = tear;
  tear = null;
  t.el.classList.remove('peeling', 'ready');
  if (t.sweep){
    if (t.dist <= 3) setSelected(t.id);             // 택을 당기지 않고 뗌 = 탭 → 인스펙터
    busy = true;
    t.el.style.transition = 'transform .2s';
    t.el.style.transform = '';
    if (t.tab){ t.tab.style.transition = 'transform .2s'; t.tab.style.transform = ''; }
    setTimeout(() => {
      t.el.style.transition = '';
      if (t.tab) t.tab.style.transition = '';
      busy = false;
      if (t.dist >= tearLen()) sweepInto(t.id);     // 끝까지 당겼으면 쓸어담기
    }, 220);
    return;
  }
  if (t.piece && t.dist >= tearLen()){ openPackage(t.id, t); return; }
  // 기준 길이 미만 → 택이 제자리로 붙음
  if (!t.piece) setSelected(t.id);                 // 택을 당기지 않고 뗌 = 탭 → 인스펙터
  busy = true;
  t.el.style.transition = 'transform .2s';
  t.el.style.transform = '';
  if (t.piece){
    t.piece.style.transition = 'transform .2s';
    t.piece.style.transform = '';
  }
  setTimeout(() => {
    t.el.style.transition = '';
    t.el.style.clipPath = '';
    if (t.tab) t.tab.style.visibility = '';
    if (t.piece) t.piece.remove();
    busy = false;
  }, 220);
}
// ── container: 쓸어담기 ─────────────────────────────
//   담긴 카드가 있고, 자리가 남았고, 테이블에 같은 종류가 있으면 택이 깜빡임
const holdOf = c => DEFS[c.type].hold || 0;
const sweepable = c => !!c.fill && (c.count || 0) < holdOf(c) && S.cards.some(o => o.type === c.fill);
// 택을 끝까지 당겼다 놓으면: 테이블의 같은 종류 카드를 가까운 것부터 남은 자리만큼 빨아들임
function sweepInto(id){
  const c = byId(id);
  if (!c) return;
  const hold = holdOf(c);
  if (!c.fill){ toast('먼저 한 장 담아야 쓸어담을 수 있음'); return; }
  const room = hold - (c.count || 0);
  if (room <= 0){ toast(`가득 참 — ${DEFS[c.type].name} 최대 ${hold}장`); return; }
  const picks = S.cards.filter(o => o.type === c.fill)
    .sort((a, b) => Math.hypot(a.x - c.x, a.y - c.y) - Math.hypot(b.x - c.x, b.y - c.y))
    .slice(0, room);
  if (!picks.length){ toast(`쓸어담을 ${DEFS[c.fill].name} 없음`); return; }
  busy = true;
  for (const o of picks){
    const el = els.get(o.id);
    if (!el) continue;
    el.style.zIndex = 1999998000;
    el.style.transition = 'left .32s ease-in, top .32s ease-in, transform .32s ease-in, opacity .32s ease-in';
    requestAnimationFrame(() => {
      el.style.left = c.x + 'px';
      el.style.top = c.y + 'px';
      el.style.transform = 'scale(.35)';
      el.style.opacity = '0';
    });
  }
  setTimeout(() => {
    for (const o of picks) removeCard(o.id);
    c.count = (c.count || 0) + picks.length;
    S.flags.swept = true;                                   // 마음의 평화 4단계
    bumpIds.add(c.id);
    busy = false;
    toast(`${ic(c.fill)} ${DEFS[c.fill].name} ${picks.length}장 쓸어담음 (${c.count}/${hold})`);
    afterChange();
  }, 340);
}
// 담기: container에 한 장 넣음
function storeInto(box, type){
  box.fill = type;
  box.count = (box.count || 0) + 1;
  S.flags.stored = true;                                    // 마음의 평화 3단계
  bumpIds.add(box.id);
}
// 첫 package를 찢는 순간: 갇힌 갓의 "꺼내줘" 말풍선은 남은 시간과 상관없이 바로 끔
function cutTrappedTalk(){
  const lines = LINES.trapped.concat(LINES.trappedNag);
  talkQ.god = talkQ.god.filter(it => !lines.includes(it.text));
  if (talking === 'god' && lines.includes(speech)){
    clearTimeout(talkTimer);
    talkTimer = null;
    setLine('god', null);
    talking = null;
    showNextTalk(null);
  }
}
function openPackage(id, t){
  const c = byId(id);
  const el = els.get(id);
  if (!c || !el) return;
  if (c.contents === 'first') cutTrappedTalk();
  busy = true;
  // 뜯긴 택 조각은 당긴 방향으로 날아가며 사라짐
  if (t && t.piece){
    const piece = t.piece;
    const far = (t.off || 0) + CW * 1.2;
    piece.style.transition = 'transform .45s ease-out, opacity .45s ease-out';
    requestAnimationFrame(() => {
      piece.style.transform = `translate(${(t.ux || 0) * far}px, ${(t.uy || 0) * far}px) rotate(-75deg)`;
      piece.style.opacity = '0';
    });
    setTimeout(() => piece.remove(), 480);
  }
  // 카드는 뜯긴 모서리를 가진 채 가운데가 들쭉날쭉 찢어져 둘로 갈라짐
  const { tw, th } = tabSize();
  const mid = CW / 2;
  const split = jagLine(mid + 2, 0, mid - 2, CH, 12, 3, 1);            // 위 → 아래
  const edgeBack = tearEdge().reverse();                               // (0,th) 쪽 → (tw,0) 쪽
  const left  = [[tw, 0], [mid + 2, 0], ...split, [mid - 2, CH], [0, CH], [0, th], ...edgeBack];
  const right = [[mid + 2, 0], [CW, 0], [CW, CH], [mid - 2, CH], ...split.slice().reverse()];
  for (const [side, pts] of [['l', left], ['r', right]]){
    const half = el.cloneNode(true);
    half.className = 'cw k-package half half-' + side;
    half.removeAttribute('data-id');
    half.style.transform = '';
    half.style.clipPath = poly(pts);
    half.style.zIndex = 2000000001;
    const tab = half.querySelector('.tab');
    if (tab) tab.remove();
    table.appendChild(half);
    setTimeout(() => half.remove(), 520);
  }
  el.style.visibility = 'hidden';
  setTimeout(() => {
    const cx = c.x, cy = c.y, contents = c.contents;
    removeCard(id);
    const list = [];
    if (contents === 'first') list.push('knight', 'god');
    const omitted = [];
    const pending = {};
    for (const ty of (DEFS[c.type].fixed || drawPool(PACK_DRAW))){   // 신의 구원: 정해진 구호물품
      pending[ty] = pending[ty] || 0;
      if (looseCount(ty) + pending[ty] >= SPAWN_CAP){ omitted.push(ty); continue; }   // 월드에 5장이면 생성 안 됨
      pending[ty]++;
      list.push(ty);
    }
    omitToast(omitted);
    const n = list.length, base = Math.random() * Math.PI * 2;
    list.forEach((type, i) => {
      if (phys){
        // 중앙에 놓고 바깥쪽으로 튕겨냄 → 날아가며 서로 밀어냄
        const nc = addCard(type, cx + (Math.random() - 0.5) * 6, cy + (Math.random() - 0.5) * 6);
        const ang = base + (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
        const speed = CW * 1.9 * (1 - DAMP) * (0.8 + Math.random() * 0.4);   // 이동 거리 ≈ 예전의 2배
        vel.set(nc.id, { x: Math.cos(ang) * speed, y: Math.sin(ang) * speed * 0.9 });
      } else {
        // 물리 꺼짐: 2배 넓게 자리 잡고 중앙에서 튀어나오는 연출만
        const p = findSpot(cx, cy, 2);
        const nc = addCard(type, p.x, p.y);
        spawned.delete(nc.id);
        popFrom.set(nc.id, { x: cx, y: cy });
      }
    });
    busy = false;
    if (contents === 'first'){ talkQ.god = []; say(LINES.intro); }
    save();
    renderAll();
    scheduleGod();
  }, 260);
}

// ── 포인터 ────────────────────────────────────────────
function localPoint(e){
  const r = table.getBoundingClientRect();
  return { px: e.clientX - r.left, py: e.clientY - r.top };
}
function onDown(e){
  if (!e.target.closest('.cw')){ if (!drag && !tear) setSelected(null); return; }   // 빈 테이블 탭 → 인스펙터 비움
  if (paused || drag || tear || busy || returning) return;
  const cardEl = e.target.closest('.cw');
  if (!cardEl || cardEl.classList.contains('half')) return;
  const c = byId(+cardEl.dataset.id);
  if (!c) return;
  e.preventDefault();
  if (c.duel != null || bodyOf(c).duel != null){ setSelected(c.id); return; }   // 대결 중엔 못 움직임
  const { px, py } = localPoint(e);

  // quest 위에 쌓인 카드 꺼내기
  const mini = e.target.closest('.mini');
  if (mini && c.type === 'quest'){
    if (settling.has(c.id)) return;
    const idx = +mini.dataset.idx;
    const type = c.stack.splice(idx, 1)[0];
    if (!type) return;
    const nc = addCard(type, px - CW / 2, py - CH / 2, null, true);
    spawned.delete(nc.id);
    renderAll();
    startDrag(nc, px, py, e.pointerId, { ox: c.x, oy: c.y, fromRequest: c.id });
    return;
  }

  // 장비 칸에서 장비 끌어내기
  const eqEl = e.target.closest('.equip span[data-slot]');
  if (eqEl && c.equip){
    const slot = eqEl.dataset.slot;
    const type = c.equip[slot];
    if (!type) return;
    delete c.equip[slot];
    const nc = addCard(type, px - CW / 2, py - CH / 2, null, true);
    spawned.delete(nc.id);
    renderAll();
    startDrag(nc, px, py, e.pointerId, { ox: c.x, oy: c.y, fromEquip: { id: c.id, slot } });
    return;
  }

  // container에서 한 장 꺼내기
  const heldEl = e.target.closest('.held[data-held]');
  if (heldEl && c.fill && c.count > 0){
    const type = c.fill;
    c.count--;
    if (!c.count) delete c.fill;
    const nc = addCard(type, px - CW / 2, py - CH / 2, null, true);
    spawned.delete(nc.id);
    renderAll();
    startDrag(nc, px, py, e.pointerId, { ox: c.x, oy: c.y, fromContainer: c.id });
    return;
  }

  // container 택 당기기 = 쓸어담기 (찢어지지 않음)
  if (DEFS[c.type].kind === 'container' && e.target.closest('.tab')){
    tear = { id: c.id, sx: px, sy: py, el: cardEl, tab: cardEl.querySelector('.tab'), pid: e.pointerId, dist: 0, sweep: true };
    return;
  }

  // package 택 당기기
  if (DEFS[c.type].kind === 'package' && e.target.closest('.tab')){
    tear = { id: c.id, sx: px, sy: py, el: cardEl, tab: cardEl.querySelector('.tab'), pid: e.pointerId, dist: 0 };
    cardEl.classList.add('peeling');
    return;
  }

  startDrag(c, px, py, e.pointerId, { ox: c.x, oy: c.y });
}
// 붙음·방문으로 이어진 카드 전부 (사슬 포함)
function linkedGroup(c){
  const ids = new Set([c.id]);
  const queue = [c];
  while (queue.length){
    const x = queue.shift();
    for (const m of S.cards){
      if (ids.has(m.id)) continue;
      if (bodyOf(m) === bodyOf(x) || m.visit === x.id || x.visit === m.id){
        ids.add(m.id);
        queue.push(m);
      }
    }
  }
  return ids;
}
function startDrag(c, px, py, pid, o){
  // 붙음·방문으로 이어진 카드는 끌고 있는 카드와 함께 맨 위로 (서로의 앞뒤 순서는 유지)
  const group = linkedGroup(c);
  const members = S.cards.filter(m => m.id !== c.id && group.has(m.id)).sort((a, b) => a.z - b.z);
  members.forEach((m, i) => {
    m.z = ++S.z;
    const me = els.get(m.id);
    if (me) me.style.zIndex = 1999999000 + i;
  });
  c.z = ++S.z;
  const el = els.get(c.id);
  if (!el) return;
  drag = {
    id: c.id, pid, el,
    offX: px - c.x, offY: py - c.y,
    sx: px, sy: py,
    moved: !!(o.fromRequest || o.fromEquip || o.fromContainer),
    ox: o.ox, oy: o.oy,
    fromRequest: o.fromRequest || null,
    fromEquip: o.fromEquip || null,
    fromContainer: o.fromContainer || null,
    target: null,
  };
  el.style.zIndex = 2000000000;
  el.classList.add('dragging');
}
// 대상 고르기: 끌고 있는 카드와 겹친 넓이로 판단 (포인터 아래만 보던 v0.7.0보다 넓음)
//   카드 넓이의 15% 이상 겹친 카드 중에서, 되는 조합이면 2배 가산해 가장 점수 높은 카드
//   겹친 카드가 없으면 포인터 아래 카드
function pickTarget(clientX, clientY, c){
  let best = null, bestScore = 0;
  const minArea = CW * CH * 0.15;
  for (const o of S.cards){
    if (o.id === c.id || bodyOf(o) === bodyOf(c)) continue;
    const ox = Math.min(c.x, o.x) + CW - Math.max(c.x, o.x);
    const oy = Math.min(c.y, o.y) + CH - Math.max(c.y, o.y);
    if (ox <= 0 || oy <= 0) continue;
    const area = ox * oy;
    if (area < minArea) continue;
    const ev = evaluate(c, o);
    const score = area * (ev && !ev.full ? 2 : 1);
    if (score > bestScore){ bestScore = score; best = o; }
  }
  if (best) return best;
  for (const h of document.elementsFromPoint(clientX, clientY)){
    const ce = h.closest ? h.closest('.cw') : null;
    if (ce && !ce.classList.contains('half') && +ce.dataset.id !== c.id){
      const t = byId(+ce.dataset.id);
      if (t) return t;
    }
  }
  return null;
}
function clearTarget(){
  if (drag && drag.target){
    const el = els.get(drag.target.id);
    if (el) el.classList.remove('is-target', 'no');
    drag.target = null;
  }
}
function setTarget(t, c){
  if (drag.target && t && drag.target.id === t.id) return;
  clearTarget();
  if (!t) return;
  drag.target = t;
  const el = els.get(t.id);
  if (!el) return;
  el.classList.add('is-target');
  const ev = evaluate(c, t);
  if (!ev || ev.full) el.classList.add('no');
}
function onMove(e){
  if (tear && e.pointerId === tear.pid){
    const { px, py } = localPoint(e);
    updateTear(px, py);
    return;
  }
  if (!drag || e.pointerId !== drag.pid) return;
  const { px, py } = localPoint(e);
  if (!drag.moved && Math.hypot(px - drag.sx, py - drag.sy) < 4) return;
  drag.moved = true;
  const c = byId(drag.id);
  if (!c) return;
  const p = clampPos(px - drag.offX, py - drag.offY);
  const lim = attachLimits(c);                                  // 붙음 묶음은 통째로 화면 안에
  p.x = Math.max(lim.minX, Math.min(p.x, Math.max(lim.minX, lim.maxX)));
  if (lim.maxY != null && lim.maxY >= lim.minY) p.y = Math.min(Math.max(p.y, lim.minY), lim.maxY);
  c.x = p.x; c.y = p.y;
  drag.el.style.left = p.x + 'px';
  drag.el.style.top = p.y + 'px';
  setTarget(pickTarget(e.clientX, e.clientY, c), c);
}
function animateTo(el, x, y, done){
  busy = true;
  el.style.transition = 'left .22s ease-out, top .22s ease-out';
  requestAnimationFrame(() => {
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });
  setTimeout(() => {
    el.style.transition = '';
    busy = false;
    done();
  }, 240);
}
// 되돌아가기 — 매 프레임 실제 위치를 옮김
//   CSS 전환으로 겉모습만 옮기면 붙은 request가 따라오지 않고, 밀어내기도 멈춰 어색하게 겹쳤음
let returning = null;         // { id, fx, fy, tx, ty, t0, dur, done }
const heldId = () => drag ? drag.id : (returning ? returning.id : null);   // 끌거나 되돌아가는 중인 카드
function tweenTo(c, x, y, done){
  returning = { id: c.id, fx: c.x, fy: c.y, tx: x, ty: y, t0: performance.now(), dur: 240, done };
}
function stepReturn(){
  if (!returning) return false;
  const r = returning;
  const c = byId(r.id);
  if (!c){ returning = null; return false; }
  const t = Math.min(1, (performance.now() - r.t0) / r.dur);
  const e = 1 - Math.pow(1 - t, 3);                           // 끝에서 부드럽게 멈춤
  c.x = r.fx + (r.tx - r.fx) * e;
  c.y = r.fy + (r.ty - r.fy) * e;
  moveEl(c);
  if (t >= 1){
    returning = null;
    vel.delete(c.id);
    r.done();
  }
  return true;
}
// 원래 자리가 그사이 다른 카드로 막혔으면 가장 가까운 빈자리 (자기 묶음은 빈자리 판단에서 뺌)
function freeSpotFor(c, x, y){
  const group = linkedGroup(c);
  const all = S.cards;
  S.cards = all.filter(o => !group.has(o.id));
  const p = findSpot(x, y);
  S.cards = all;
  return p;
}
function bounce(c, d0){
  sayMaybe(LINES.bounce);
  if (d0.fromEquip){
    const owner = byId(d0.fromEquip.id);
    const slot = d0.fromEquip.slot;
    if (owner && !(owner.equip && owner.equip[slot])){
      tweenTo(c, owner.x, owner.y, () => {
        removeCard(c.id);
        owner.equip = owner.equip || {};
        owner.equip[slot] = c.type;
        afterChange();
      });
      return;
    }
  }
  if (d0.fromContainer){
    // 꺼낸 카드를 못 놓으면 자루로 돌아감 (자리가 있고 같은 종류일 때)
    const box = byId(d0.fromContainer);
    if (box && (!box.count || box.fill === c.type) && (box.count || 0) < holdOf(box)){
      tweenTo(c, box.x, box.y, () => {
        removeCard(c.id);
        storeInto(box, c.type);
        afterChange();
      });
      return;
    }
  }
  if (d0.fromRequest){
    const rq = byId(d0.fromRequest);
    if (rq){
      tweenTo(c, rq.x, rq.y, () => {
        removeCard(c.id);
        rq.stack.push(c.type);
        afterChange();
      });
      return;
    }
  }
  const spot = freeSpotFor(c, d0.ox, d0.oy);
  tweenTo(c, spot.x, spot.y, () => afterChange());
}
function onUp(e){
  if (tear && e.pointerId === tear.pid){ endTear(); return; }
  if (!drag || e.pointerId !== drag.pid) return;
  const c = byId(drag.id);
  const t = drag.target;
  clearTarget();
  drag.el.classList.remove('dragging');
  const d0 = drag;
  drag = null;
  if (!c || !d0.moved){ if (c) setSelected(c.id); renderAll(); return; }   // 탭 → 인스펙터
  if (t && byId(t.id)){
    const ev = evaluate(c, t);
    if (ev && apply(ev, c, t)){ afterChange(); return; }
    bounce(c, d0);                                // 쌓기 실패 → 되돌아감
    return;
  }
  afterChange();                                  // 빈 자리 → 이동
}

// 카드 위에 +N 같은 수치를 띄움 (떠오르며 사라짐)
function floatText(c, text, cls){
  const f = document.createElement('div');
  f.className = 'float' + (cls ? ' ' + cls : '');
  f.innerHTML = rich(text);                      // 공격·방어·체력 자리표(si) → 그림
  f.style.left = (c.x + CW / 2) + 'px';
  f.style.top = (c.y - CH * 0.05) + 'px';
  table.appendChild(f);
  setTimeout(() => f.remove(), 1250);
}

// ── 동물 홉핑 ─────────────────────────────────────────
//   1초마다 일정 거리를 뜀. 뛰는 동안 카드가 세로로 길어졌다 눌림
const HOP_MS = 320;
const hops = new Map();          // id → { fx, fy, tx, ty, t0 }
function animalTick(){
  if (!S || paused || busy) return;
  const hid = heldId();
  const { w, h } = tableSize();
  for (const c of S.cards){
    if (!DEFS[c.type].hops || hops.has(c.id)) continue;
    if (hid != null && bodyOf(byId(hid)) === bodyOf(c)) continue;   // 잡혀 있으면 안 뜀
    if (tear && tear.id === c.id) continue;
    if (c.duel != null) continue;                             // 대결 중엔 안 뜀
    const dd = DEFS[c.type];
    const dist = CW * 0.55 * (dd.hopScale || 1);             // 곰은 2배
    let ang = Math.random() * Math.PI * 2;
    // 가장자리 근처면 절반 확률로 안쪽을 향해 뜀
    const nearEdge = c.x < CW || c.y < TOP_PAD + CH * 0.5 || c.x > w - CW * 2 || c.y > h - CH * 1.5;
    if (nearEdge && Math.random() < 0.5) ang = Math.atan2(h / 2 - (c.y + CH / 2), w / 2 - (c.x + CW / 2)) + (Math.random() - 0.5);
    const p = clampPos(c.x + Math.cos(ang) * dist, c.y + Math.sin(ang) * dist);
    const anim = dd.hopAnim || 'hop';
    hops.set(c.id, { fx: c.x, fy: c.y, tx: p.x, ty: p.y, t0: performance.now(), ms: dd.hopMs || HOP_MS, anim });
    const el = els.get(c.id);
    if (el){
      el.classList.remove('hop', 'run', 'spawn', 'pop', 'bump');   // 끝난 등장·튕김 클래스를 치우고
      void el.offsetWidth;                                  // 애니메이션 다시 시작
      el.classList.add(anim);
    }
  }
}
function stepHops(){
  if (!hops.size) return false;
  const hid = heldId();
  let moved = false;
  for (const [id, hp] of hops){
    const c = byId(id);
    if (!c || (hid != null && bodyOf(byId(hid)) === bodyOf(c))){ hops.delete(id); continue; }
    const t = Math.min(1, (performance.now() - hp.t0) / hp.ms);
    const e = 1 - Math.pow(1 - t, 2);
    c.x = hp.fx + (hp.tx - hp.fx) * e;
    c.y = hp.fy + (hp.ty - hp.fy) * e;
    moveEl(c);
    moved = true;
    if (t >= 1){
      hops.delete(id);
      const el = els.get(id);
      if (el) setTimeout(() => el.classList.remove(hp.anim), 80);
    }
  }
  return moved;
}

// ── 크리처: 무기로 한 방 / 캐릭터와 대결 ─────────────────
//   무기를 쌓음: 무기 공격력 ≥ 크리처 남은 체력이면 바로 쓰러뜨리고 전리품. 아니면 "무기의 공격력 낮음"
//   캐릭터를 쌓음: 대결 — 캐릭터 선공, 크리처 후공을 한쪽이 쓰러질 때까지 반복 (DUEL_MS마다 한 번)
//     피해 = 공격력 − 상대 방어 (최소 0). 크리처도 공방체 (v0.52.0, 지금 방어 0)
//     승리: 전리품. 패배: 캐릭터 빈사, 크리처는 남은 체력 그대로
//     둘 다 피해를 못 주면 바로 끝 (무승부)
const DUEL_MS = 800;
function defOf(c){
  const d = DEFS[c.type];
  return (d.baseDef || 0) + Object.values(c.equip || {}).reduce((sum, ty) => sum + ((DEFS[ty] && DEFS[ty].defense) || 0), 0);
}
function killCreature(cr){
  const x = cr.x, y = cr.y;
  hops.delete(cr.id);
  removeCard(cr.id);
  toast(`${ic(cr.type)} ${DEFS[cr.type].name} 쓰러뜨림`);
  const omitted = [];
  for (const t of (DEFS[cr.type].loot || [])){
    if (!canSpawn(t)){ omitted.push(t); continue; }            // 월드에 5장이면 그 전리품만 누락
    const p = findSpot(x, y);
    const nc = addCard(t, p.x, p.y);
    spawned.delete(nc.id);
    popFrom.set(nc.id, { x, y });
  }
  omitToast(omitted);
}
function startDuel(ch, cr){
  delete ch.visit;
  delete ch.visitSeq;
  hops.delete(cr.id);
  ch.duel = cr.id;
  cr.duel = ch.id;
  cr.turn = 'char';                                           // 캐릭터 선공
  setStatus(ch, [], ['대결']);
  setStatus(cr, [], ['대결']);
  // 크리처 왼쪽, 캐릭터 오른쪽으로 나란히 (캐릭터에 붙은 quest는 그 오른쪽)
  const gap = 12;
  const lim = attachLimits(ch);
  ch.x = Math.max(8 + CW + gap, Math.min(cr.x + CW + gap, lim.maxX));
  ch.y = clampPos(ch.x, cr.y).y;
  cr.x = ch.x - CW - gap;
  cr.y = ch.y;
  bumpIds.add(ch.id);
  bumpIds.add(cr.id);
  toast(`${si('atk')} ${DEFS[ch.type].name} vs ${DEFS[cr.type].name} — 대결`);
}
function endDuel(ch, cr){
  if (ch){ delete ch.duel; setStatus(ch, ['대결'], []); }
  if (cr){ delete cr.duel; delete cr.turn; setStatus(cr, ['대결'], []); }
}
function duelTick(){
  if (!S || paused || busy) return;
  let changed = false;
  for (const cr of S.cards.slice()){
    if (DEFS[cr.type].kind !== 'creature' || cr.duel == null) continue;
    const ch = byId(cr.duel);
    if (!ch || ch.duel !== cr.id){ endDuel(null, cr); changed = true; continue; }
    const charDmg = Math.max(0, atkOf(ch) - defOf(cr));
    const foeDmg = Math.max(0, atkOf(cr) - defOf(ch));
    if (charDmg <= 0 && foeDmg <= 0){
      endDuel(ch, cr);
      toast(`서로 피해를 못 줌 — 대결 끝`);
      changed = true;
      continue;
    }
    if ((cr.turn || 'char') === 'char'){
      cr.hp = Math.max(0, cr.hp - charDmg);
      floatText(cr, `-${charDmg}`);
      bumpIds.add(cr.id);
      if (cr.hp <= 0){
        endDuel(ch, cr);
        toast(`🏆 ${DEFS[ch.type].name} 승리`);
        killCreature(cr);
      } else cr.turn = 'foe';
    } else {
      ch.hp = Math.max(0, ch.hp - foeDmg);
      floatText(ch, `-${foeDmg}`);
      bumpIds.add(ch.id);
      if (ch.hp <= 0){
        endDuel(ch, cr);
        setStatus(ch, ['허기짐'], ['빈사']);                    // 패배: 캐릭터 빈사, 크리처는 체력 회복 안 함
        toast(`💀 ${DEFS[ch.type].name} 패배 — 빈사`);
      } else cr.turn = 'char';
    }
    changed = true;
  }
  if (changed) afterChange();
}

// ── 체력 회복 장소 ─────────────────────────────────────
//   "체력 회복 lvN" 장소를 방문한 캐릭터는 15초 / N 마다 체력 +1
//   장소마다 게이지 하나. 다 차면 방문자 전원 한꺼번에 +1. 빈사는 회복 안 됨 (빈사 치유가 필요)
const REST_MS = 15000;                         // lv1 = 15초에 +1
function pieValue(pl){
  if (DEFS[pl.type].yields) return Math.min(1, (pl.yieldPts || 0) / DEFS[pl.type].yieldNeed);   // 산: 나무 게이지
  const lv = tagLevel(DEFS[pl.type], '체력 회복');
  if (!lv || !visitorsOf(pl).length) return 0;
  return Math.min(1, (pl.restMs || 0) / (REST_MS / lv));
}
// 게이지는 장소 하나에 하나: 첫 방문자가 들어오면 차오르기 시작, 다 차는 순간 방문자 전원이 한꺼번에 +1
function restTick(){
  if (!S || paused) return;
  let hpChanged = false;
  for (const pl of S.cards){
    const lv = tagLevel(DEFS[pl.type], '체력 회복');
    if (!lv) continue;
    const vs = visitorsOf(pl);
    if (!vs.length){ pl.restMs = 0; continue; }            // 모두 떠나면 게이지 초기화
    const healable = vs.filter(v => v.hp != null && v.hp < DEFS[v.type].hp && !statusOf(v).includes('빈사'));
    if (!healable.length) continue;                         // 회복할 사람이 없으면 게이지 멈춤
    const period = REST_MS / lv;
    pl.restMs = (pl.restMs || 0) + 1000;
    if (pl.restMs < period) continue;
    pl.restMs -= period;
    for (const v of healable){
      v.hp = Math.min(DEFS[v.type].hp, v.hp + 1);
      floatText(v, `${si('hp')} +1`);                       // 쉬어서 오른 체력
      bumpIds.add(v.id);
      if (v.hp >= DEFS[v.type].hp && statusOf(v).includes('허기짐')){
        setStatus(v, ['허기짐'], []);
        toast(`🍽️ ${DEFS[v.type].name}: 허기짐 해결`);
      }
    }
    bumpIds.add(pl.id);
    hpChanged = true;
  }
  if (hpChanged){ afterChange(); return; }
  for (const pl of S.cards){                    // 게이지만 갱신
    const el = els.get(pl.id);
    const pie = el && el.querySelector('.pie');
    if (pie) pie.style.setProperty('--p', pieValue(pl));
  }
}

// ── 산: 방문한 캐릭터의 공격력만큼 게이지가 참 → 다 차면 나무 ──
//   1초마다 방문자 공격력 합계만큼 +. 공격력 0이면 +0 (아무리 기다려도 안 나옴)
//   방문자가 떠나도 게이지는 남음
function atkOf(c){
  const d = DEFS[c.type];
  return (d.baseAtk || 0) + Object.values(c.equip || {}).reduce((sum, ty) => sum + ((DEFS[ty] && DEFS[ty].atk) || 0), 0);
}
const pickWeighted = table => {
  let r = Math.random() * table.reduce((sum, [, w]) => sum + w, 0);
  for (const [t, w] of table){ r -= w; if (r < 0) return t; }
  return table[table.length - 1][0];
};
function yieldTick(){
  if (!S || paused || busy) return;
  let made = false;
  for (const pl of S.cards){
    const d = DEFS[pl.type];
    if (!d.yields) continue;
    const vs = visitorsOf(pl);
    if (!vs.length) continue;
    const add = vs.reduce((sum, v) => sum + atkOf(v), 0);
    pl.yieldPts = (pl.yieldPts || 0) + add;
    floatText(pl, `+${add}`, 'work');                         // 게이지에 들어간 만큼
    while (pl.yieldPts >= d.yieldNeed){
      pl.yieldPts -= d.yieldNeed;
      const miss = [];
      for (const ty of [].concat(pickWeighted(d.yields))){   // 나무 + 돌 · 토끼 · 곰
        if (!canSpawn(ty)){ miss.push(DEFS[ty].name); continue; }   // 월드 수량 초과
        const p = findSpot(pl.x, pl.y + CH + 12);
        const nc = addCard(ty, p.x, p.y);
        spawned.delete(nc.id);
        popFrom.set(nc.id, { x: pl.x, y: pl.y });              // 산에서 튀어나옴
        bumpIds.add(pl.id);
        made = true;
      }
      if (miss.length) floatText(pl, `누락: ${miss.join(', ')}`, 'work');
    }
    const el = els.get(pl.id);
    const pie = el && el.querySelector('.pie');
    if (pie) pie.style.setProperty('--p', pieValue(pl));
  }
  if (made) afterChange();
  else save();
}

// ── 첫 package: 안에 갇힌 갓이 모서리를 당기라고 함 ───
let lastNag = 0;
function trappedHint(first){
  if (!S) return;
  const pk = S.cards.find(c => c.type === 'package' && c.contents === 'first');
  if (!pk || tear || isTalking('god')) return;
  const now = Date.now();
  if (!first && now - lastNag < 9000) return;
  lastNag = now;
  say(first ? LINES.trapped : pick(LINES.trappedNag));
}

// ── 필드 상태 복사 (시스템 메뉴) ──────────────────────
function fieldSnapshot(){
  const { w, h } = tableSize();
  const nameOf = id => { const o = byId(id); return o ? `${DEFS[o.type].name}#${o.id}` : null; };
  return {
    version: VERSION,
    time: new Date().toISOString(),
    table: { w, h, cardW: CW, cardH: CH },
    physics: phys,
    cards: S.cards.map(c => {
      const d = DEFS[c.type];
      const o = { id: c.id, type: c.type, name: d.name, x: Math.round(c.x), y: Math.round(c.y) };
      const tags = tagsOf(c);
      if (COMBOABLE.has(c.type)) tags.unshift('조합 가능');
      if (tags.length) o.tags = tags;
      if (c.hp != null) o.hp = `${c.hp}/${d.hp}`;
      if (d.slots){
        o.equip = {};
        for (const sl of d.slots) o.equip[sl] = c.equip && c.equip[sl] ? DEFS[c.equip[sl]].name : null;
      }
      if (c.visit != null) o.visit = nameOf(c.visit);
      if (c.contents) o.contents = c.contents;
      if (DEFS[c.type].kind === 'container') o.held = c.fill ? `${DEFS[c.fill].name} ${c.count}/${DEFS[c.type].hold}` : '비어 있음';
      if (c.type === 'quest'){
        o.title = c.title;
        if (c.quest) o.quest = c.quest;

        o.reward = plain(reqReward(c));
        if (c.stack && c.stack.length) o.stack = c.stack.map(t => DEFS[t].name);
      }
      return o;
    }),
    seen: S.seen.map(t => DEFS[t].name),
    found: S.found,
    flags: S.flags,

}
async function copyField(){

// ── 콜렉터북 (카드 아님) ──────────────────────────────
let bookOpen = false;          // 시트가 올라와 있나
let bookManual = false;        // 버튼으로 연 상태 (자동으로 닫지 않음)
let bookPending = new Set();   // 아직 등록 연출 전이라 ??? 로 보일 카드
let discoQ = [], discoRunning = false, discoTimer = null;
function renderBook(){
  const seen = new Set(S.seen);
  const shown = id => seen.has(id) && !bookPending.has(id);

      : `<div class="slot unseen" data-slot="${id}"><div class="e">❔</div><div class="n">???</div></div>`;
  }

function setBookOpen(open){
  bookOpen = open;
  book.classList.toggle('open', open);
}
// 상단 버튼: 하단에서 올라오고, 다시 누르면 하단으로 사라짐
function toggleBook(){

    closeBook();
  } else {
    bookManual = true;
    renderBook();
    setBookOpen(true);
  }
}
// 새 카드 발견: 시트가 올라오고 칸마다 아이콘이 차례로 등록됨 → 잠시 뒤 내려감
function showDiscoveries(types){
  const add = types.filter(t => PAGE.ids.includes(t) && !discoQ.includes(t));
  if (!add.length) return;
  discoQ.push(...add);
  for (const t of add) bookPending.add(t);
  if (!discoRunning) runDiscoveries();
}
function runDiscoveries(){
  clearTimeout(discoTimer);
  if (!discoQ.length){
    discoRunning = false;
    if (bookManual){ setPaused(false); return; }   // 버튼으로 연 상태면 시트는 두고 게임만 재개
    // 등록이 끝나고 잠깐 보여준 뒤 내려감 → 다 내려가면 게임 재개
    discoTimer = setTimeout(() => {
      if (bookManual || discoRunning) return;
      setBookOpen(false);
      discoTimer = setTimeout(() => { if (!discoRunning) setPaused(false); }, 400);
    }, 1200);
    return;
  }
  discoRunning = true;
  setPaused(true);                                // 등록 연출 동안 게임 필드 일시 정지
  const batch = discoQ.splice(0);
  renderBook();
  const delay = bookOpen ? 150 : 430;             // 막 올라오는 중이면 다 올라온 뒤에 등록
  setBookOpen(true);
  batch.forEach((t, i) => setTimeout(() => registerSlot(t), delay + i * 320));
  discoTimer = setTimeout(runDiscoveries, delay + batch.length * 320 + 250);
}
// 닫기: 남은 등록 연출은 건너뛰고 바로 게임 재개
function closeBook(){
  clearTimeout(discoTimer);
  discoQ = [];
  discoRunning = false;
  bookPending.clear();
  bookManual = false;
  setBookOpen(false);
  setPaused(false);
}
function registerSlot(t){
  bookPending.delete(t);

  if (!slot) return;

// ── 밀어내기 (물리) ───────────────────────────────────
function velOf(id){
  let v = vel.get(id);
  if (!v){ v = { x: 0, y: 0 }; vel.set(id, v); }
  return v;
}
function physStep(){
  requestAnimationFrame(physStep);
  let moved = false;
  if (S && !busy && !paused){
    if (stepReturn()) moved = true;            // 되돌아가는 카드를 먼저 옮기고
    if (stepHops()) moved = true;              // 동물 홉핑
    if (solveAttach()) moved = true;           // 잡은 quest → 발주자
    if (solveVisit()) moved = true;            // 장소 → 방문자 줄 / 멀리 당기면 떠남
    if (solveAttach()) moved = true;           // 방문자 → 붙은 quest
    if (phys && physMove()) moved = true;
    if (solveVisit()) moved = true;
    if (solveAttach()) moved = true;
  }
  if (moved) physDirty = true;
  else if (physDirty && !drag){ physDirty = false; save(); }   // 멈추면 한 번 저장
  drawLinks();
  fitBubbles();                                // 카드가 움직여도 말풍선은 화면 안에
}
// ── quest 붙이기 ─────────────────────────────────────
// 붙음: request는 선 없이 발주자(캐릭터) 오른쪽에 붙어서 같이 움직임. 왼쪽으로는 가지 않음
const ATTACH_GAP = 4;
// quest 등장: 발주자 뒤에서 오른쪽으로 미끄러져 나옴
const SLIDE_MS = 350;
const slideIn = new Map();     // quest id → 등장 시작 시각
function slideProgress(id){
  const t0 = slideIn.get(id);
  if (t0 == null) return 1;
  const t = (performance.now() - t0) / SLIDE_MS;
  if (t >= 1){ slideIn.delete(id); return 1; }
  return 1 - Math.pow(1 - t, 3);
}
function slideOutFrom(rq, g){
  rq.x = g.x; rq.y = g.y;       // 발주자와 같은 자리에서 시작
  spawned.delete(rq.id);
  slideIn.set(rq.id, performance.now());
  g.z = ++S.z;                   // 발주자가 위 → request가 뒤에서 나오는 것처럼
  setTimeout(checkSettle, 0);     // 나오자마자 이미 조건을 채웠는지 확인 (다음 조작을 기다리지 않음)
}
// 붙어 있는 request의 몸통 = 발주자. 나머지 카드는 자기 자신
function bodyOf(c){
  let cur = c;
  for (let i = 0; cur && i < 6; i++){
    if (cur.type === 'quest' && cur.giver != null){ const g = byId(cur.giver); if (g){ cur = g; continue; } }
    if (cur.visit != null){ const pl = byId(cur.visit); if (pl){ cur = pl; continue; } }
    break;
  }
  return cur;
}
function moveEl(c){
  const el = els.get(c.id);
  if (el){ el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; }
}
// 발주자에 붙은 quest 목록 (붙는 순서 = id 순)
function attachedList(g){
  return S.cards.filter(r => r.type === 'quest' && r.giver === g.id).sort((a, b) => a.id - b.id);
}
// 붙음 묶음이 화면 밖으로 나가지 않도록 카드별 x 범위
//   request는 항상 발주자 오른쪽 → 경계에 닿으면 순서를 바꾸지 않고 더 안 움직임
function attachLimits(c){
  const { w } = tableSize();
  const step = CW + ATTACH_GAP;
  const maxBase = w - CW - 8;
  if (c.type === 'quest' && c.giver != null){
    const g = byId(c.giver);
    if (g){
      const list = attachedList(g);
      const i = list.findIndex(r => r.id === c.id);
      return { minX: 8 + step * (i + 1), maxX: maxBase - step * (list.length - 1 - i) };
    }
  }
  const units = rowUnits(c);
  if (units) return visitBounds(c);           // 장소: 방문자 열까지 화면 안에
  return { minX: 8, maxX: maxBase - step * attachedList(c).length };
}
function solveAttach(){
  let moved = false;
  const step = CW + ATTACH_GAP;
  const groups = new Map();
  for (const c of S.cards){
    if (c.type !== 'quest' || c.giver == null) continue;
    const g = byId(c.giver);
    if (!g) continue;
    if (!groups.has(g.id)) groups.set(g.id, { g, list: [] });
    groups.get(g.id).list.push(c);
  }
  for (const { g, list } of groups.values()){
    list.sort((a, b) => a.id - b.id);
    const hid = heldId();
    const di = hid != null ? list.findIndex(r => r.id === hid) : -1;
    if (di >= 0){
      // request를 끌면 발주자가 따라옴 (quest 위치는 onMove에서 이미 범위 안으로 제한됨)
      const r = list[di];
      const p = clampPos(r.x - step * (di + 1), r.y);
      if (Math.abs(p.x - g.x) > 0.05 || Math.abs(p.y - g.y) > 0.05){ g.x = p.x; g.y = p.y; moveEl(g); moved = true; }
    } else if (hid !== g.id){
      // 밀어내기·방문 연결 등으로 발주자가 오른쪽 끝에 몰리면 quest 자리만큼 안쪽으로
      const lim = attachLimits(g);
      if (lim.maxX >= lim.minX && g.x > lim.maxX + 0.05){ g.x = lim.maxX; moveEl(g); moved = true; }
    }
    list.forEach((r, i) => {
      if (r.id === hid) return;
      const p = clampPos(g.x + step * (i + 1) * slideProgress(r.id), g.y);
      if (Math.abs(p.x - r.x) > 0.05 || Math.abs(p.y - r.y) > 0.05){ r.x = p.x; r.y = p.y; moveEl(r); moved = true; }
    });
  }
  return moved;
}

// 연결: 장소 ─ 방문한 캐릭터
//   일정 거리를 유지하며 밀리거나 끌려감 (막대처럼)
//   끌고 있는 카드에서 연결을 따라 퍼져나가며 차례로 끌려감 (사슬)
//   아무도 안 끌 때는 b쪽(quest·방문자)이 제 거리로 천천히 돌아감
const tetherLen = () => CW * 1.6;              // 카드 중심 사이 거리. 밀어내기 간격보다 길게
// ── 방문 줄 ───────────────────────────────────────────
// 방문한 캐릭터는 장소 오른쪽에 위에서 아래로 섬 (먼저 방문한 캐릭터가 위). 장소와 선으로 이어짐
// 장소를 끌면 줄이 딸려 움직임. 캐릭터를 잡아당겨 자리에서 멀어지면 떠남
const detachDist = () => CW * 1.1;           // 자리에서 이만큼(카드 위치 거리) 벗어나면 떠남
const visitGap = () => CW * 0.45;            // 장소와 방문자 열 사이 가로 간격
const VISIT_VGAP = 6;                        // 방문자끼리 위아래 간격
// 방문자 열의 맨 위 y — 장소의 세로 가운데에 맞춤
function visitColumnTop(pl, n){
  const H = n * CH + (n - 1) * VISIT_VGAP;
  return pl.y + CH / 2 - H / 2;
}
// 방문자 열이 화면 밖으로 안 나가도록 장소가 있을 수 있는 범위
function visitBounds(pl){
  const { w, h } = tableSize();
  const n = visitorsOf(pl).length;
  const units = rowUnits(pl);
  const H = n * CH + (n - 1) * VISIT_VGAP;
  const half = Math.max(0, (H - CH) / 2);
  return {
    minX: 8,
    maxX: w - 8 - CW - (CW + visitGap()) - (CW + ATTACH_GAP) * Math.max(0, units - 1),
    minY: TOP_PAD + half,
    maxY: h - 8 - CH - half,
  };
}
function visitorsOf(pl){
  return S.cards.filter(c => c.visit === pl.id).sort((a, b) => ((a.visitSeq || 0) - (b.visitSeq || 0)) || (a.id - b.id));
}
function rowUnits(pl){
  // 가장 긴 줄의 칸 수 (방문자 1칸 + 그 방문자에 붙은 quest 수)
  return visitorsOf(pl).reduce((n, v) => Math.max(n, 1 + attachedList(v).length), 0);
}
function heldVisitor(){
  const hid = heldId();
  const h = hid != null ? byId(hid) : null;
  if (!h) return null;
  if (h.visit != null) return h;
  if (h.type === 'quest' && h.giver != null){ const g = byId(h.giver); if (g && g.visit != null) return g; }
  return null;
}
function solveVisit(){
  let moved = false;
  const step = CW + ATTACH_GAP;
  const hid = heldId();
  const hv = heldVisitor();
  const places = new Map();
  for (const c of S.cards){
    if (c.visit == null) continue;
    const pl = byId(c.visit);
    if (!pl){ delete c.visit; delete c.visitSeq; continue; }
    places.set(pl.id, pl);
  }
  const vstep = CH + VISIT_VGAP;
  for (const pl of places.values()){
    const list = visitorsOf(pl);
    if (hid !== pl.id){
      // 장소가 끝에 몰려 방문자 열이 화면 밖이면 안쪽으로
      const b = visitBounds(pl);
      if (b.maxX >= b.minX && pl.x > b.maxX + 0.05){ pl.x = b.maxX; moveEl(pl); moved = true; }
      if (b.maxY >= b.minY){
        const ny = Math.min(Math.max(pl.y, b.minY), b.maxY);
        if (Math.abs(ny - pl.y) > 0.05){ pl.y = ny; moveEl(pl); moved = true; }
      }
    }
    const top = visitColumnTop(pl, list.length);
    for (let i = 0; i < list.length; i++){
      const v = list[i];
      const tx = pl.x + CW + visitGap(), ty = top + vstep * i;  // 오른쪽으로 떨어진 열, 장소 기준 세로 가운데 정렬
      if (hv && hv.id === v.id){
        // 잡아당기는 중: 자리로 끌어오지 않음. 멀어지면 떠남
        if (drag && Math.hypot(v.x - tx, v.y - ty) > detachDist()){
          delete v.visit;
          delete v.visitSeq;
          toast(`👋 ${DEFS[v.type].name} — ${DEFS[pl.type].name}에서 떠남`);
          moved = true;
        }
        continue;
      }
      if (Math.abs(v.x - tx) > 0.05 || Math.abs(v.y - ty) > 0.05){
        const k = hid === pl.id ? 1 : 0.35;            // 장소를 끌 땐 바로, 아니면 부드럽게 제자리로
        const p = clampPos(v.x + (tx - v.x) * k, v.y + (ty - v.y) * k);
        v.x = p.x; v.y = p.y;
        moveEl(v);
        moved = true;
      }
    }
  }
  return moved;
}
// 선: 장소와 방문자를 항상 이음
function tetherLinks(){
  const out = [];
  for (const c of S.cards){
    if (c.visit == null) continue;
    const pl = byId(c.visit);
    if (pl) out.push({ a: pl, b: c, kind: 'visit' });
  }
  return out;
}
function pullTo(anchor, mover, L, k){
  if (tear && (tear.id === anchor.id || tear.id === mover.id)) return false;
  let dx = mover.x - anchor.x, dy = mover.y - anchor.y;
  let d = Math.hypot(dx, dy);
  if (d < 0.001){ dx = 1; dy = 0; d = 1; }
  if (Math.abs(d - L) < 0.5) return false;
  const tx = anchor.x + dx / d * L, ty = anchor.y + dy / d * L;
  const p = clampPos(mover.x + (tx - mover.x) * k, mover.y + (ty - mover.y) * k);
  if (Math.abs(p.x - mover.x) < 0.05 && Math.abs(p.y - mover.y) < 0.05) return false;
  mover.x = p.x; mover.y = p.y;
  const el = els.get(mover.id);
  if (el){ el.style.left = mover.x + 'px'; el.style.top = mover.y + 'px'; }
  return true;
}
function solveTethers(){
  const L = tetherLen();
  const links = tetherLinks();
  const done = new Set();
  let moved = false;
  const dragIds = new Set();
  const hid = heldId();
  if (hid != null){
    dragIds.add(hid);
    const body = bodyOf(byId(hid));
    if (body) dragIds.add(body.id);
  }
  if (hid != null){
    const reached = new Set(dragIds);
    const queue = [...dragIds];
    while (queue.length){
      const id = queue.shift();
      for (const lk of links){
        if (done.has(lk)) continue;
        let from = null, to = null;
        if (lk.a.id === id && !reached.has(lk.b.id)){ from = lk.a; to = lk.b; }
        else if (lk.b.id === id && !reached.has(lk.a.id)){ from = lk.b; to = lk.a; }
        else continue;
        done.add(lk);
        reached.add(to.id);
        queue.push(to.id);
        if (pullTo(from, to, L, 1)) moved = true;
      }
    }
  }
  for (const lk of links){
    if (done.has(lk)) continue;
    if (dragIds.has(lk.a.id) || dragIds.has(lk.b.id)) continue;
    if (pullTo(lk.a, lk.b, L, 0.2)) moved = true;
  }
  return moved;
}
// 선 그리기. 카드 중심끼리 잇고, 바뀐 게 있을 때만 다시 그림
let linksKey = '';
function drawLinks(){
  if (!S) return;
  let out = '';
  for (const lk of tetherLinks()){
    const x1 = Math.round(lk.a.x + CW / 2), y1 = Math.round(lk.a.y + CH / 2);
    const x2 = Math.round(lk.b.x + CW / 2), y2 = Math.round(lk.b.y + CH / 2);
    out += `<line class="${lk.kind}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  }
  if (out !== linksKey){ linksKey = out; links.innerHTML = out; }
}
function physMove(){
  // 드래그 중인 카드와 찢는 중인 package는 밀지도 밀리지도 않음 (대상 위에 놓을 수 있게)
  // 붙어 있는 request는 발주자와 한 몸으로 밀림. 끌고 있는 묶음은 밀지도 밀리지도 않음
  const hid = heldId();
  const dragBody = hid != null ? bodyOf(byId(hid)) : null;
  const cs = S.cards.filter(c => !(dragBody && bodyOf(c) === dragBody) && !(tear && c.id === tear.id) && bodyOf(c).duel == null);   // 대결 중인 묶음은 제자리
  const gapX = CW * 1.06, gapY = CH * 1.04;
  for (let i = 0; i < cs.length; i++){
    const a = cs[i];
    for (let j = i + 1; j < cs.length; j++){
      const b = cs[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const ox = gapX - Math.abs(dx), oy = gapY - Math.abs(dy);
      if (ox <= 0 || oy <= 0) continue;
      const A = bodyOf(a), B = bodyOf(b);
      if (A === B) continue;
      const va = velOf(A.id), vb = velOf(B.id);
      if (ox < oy){
        const f = ox * PUSH * (dx < 0 ? -1 : 1);
        va.x -= f; vb.x += f;
      } else {
        const f = oy * PUSH * (dy < 0 ? -1 : 1);
        va.y -= f; vb.y += f;
      }
    }
  }
  let moving = false;
  for (const c of cs){
    if (bodyOf(c) !== c) continue;             // 붙은 request는 붙이기가 위치를 정함
    const v = vel.get(c.id);
    if (!v) continue;
    if (Math.abs(v.x) < 0.02 && Math.abs(v.y) < 0.02){ vel.delete(c.id); continue; }
    const nx = c.x + v.x, ny = c.y + v.y;
    const p = clampPos(nx, ny);
    if (p.x !== nx) v.x = 0;                       // 벽에 닿으면 그 방향 속도 0
    if (p.y !== ny) v.y = 0;
    c.x = p.x; c.y = p.y;
    v.x *= DAMP; v.y *= DAMP;
    const el = els.get(c.id);
    if (el){ el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; }
    moving = true;
  }
  return moving;
}
