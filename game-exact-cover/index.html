<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>정확한 커버 — Game Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}

  /* 뷰포트 전체가 게임 화면 */
  .board{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--canvas);
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* 격자형 타일맵 — 10 x 10, 항상 1:1. 칸 크기는 화면에 맞춰 결정된다 */
  .grid{
    display:grid;
    grid-template-columns:repeat(var(--cols), var(--cell));
    grid-template-rows:repeat(var(--rows), var(--cell));
    border:1px solid var(--hairline);
    border-radius:var(--r-sm);
    overflow:hidden;
    box-shadow:var(--sh-lg);
  }
  .tile{
    width:var(--cell);
    height:var(--cell);
    box-shadow:inset 0 0 0 1px var(--hairline);
    background:transparent;
    transition:background-color .08s linear;
  }
  .tile.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);}

  .hud{
    position:fixed;
    z-index:10;
    left:calc(env(safe-area-inset-left,0px) + var(--s4));
    bottom:calc(env(safe-area-inset-bottom,0px) + var(--s3));
    display:flex;
    align-items:center;
    gap:var(--s2);
  }
  .hud .swatch{
    width:28px; height:28px;
    border-radius:var(--r-sm);
    border:1px solid var(--hairline);
    box-shadow:var(--sh-sm);
  }
  .hud .home{text-decoration:none;}
</style>
</head>
<body>
  <div class="board" id="board">
    <div class="grid" id="grid"></div>
  </div>

  <div class="hud">
    <a class="btn btn-secondary btn-sm home" href="../index.html">← 목록</a>
    <button class="btn btn-secondary btn-sm" id="clear">지우기</button>
    <span class="swatch" id="swatch"></span>
  </div>

<script>
(() => {
  'use strict';

  const COLS = 10, ROWS = 10;      // 격자는 가로 10칸, 세로 10칸
  const MARGIN = 16;               // 판 바깥 여백
  const HUD_H  = 56;               // 하단 HUD가 차지하는 높이

  const PALETTE = [
    '#FFD400', '#FF7A59', '#4FC3F7', '#7ED957',
    '#C792EA', '#FF9BD2', '#5BE3C0', '#F2994A'
  ];

  const grid   = document.getElementById('grid');
  const board  = document.getElementById('board');
  const swatch = document.getElementById('swatch');

  /** 칠해진 상태: "col,row" -> color */
  const painted = new Map();

  let cell = 0;
  let colorIdx = -1;
  let dragColor = null;

  /* ---------- 타일맵 구성 ---------- */

  function buildGrid() {
    grid.style.setProperty('--cols', COLS);
    grid.style.setProperty('--rows', ROWS);

    const frag = document.createDocumentFragment();
    for (let i = 0; i < COLS * ROWS; i++) {
      const t = document.createElement('div');
      t.className = 'tile';
      frag.appendChild(t);
    }
    grid.replaceChildren(frag);
  }

  /** 1:1 비율을 유지한 채 디바이스 화면에 맞춰 칸 크기를 다시 계산한다 */
  function resize() {
    const availW = window.innerWidth  - MARGIN * 2;
    const availH = window.innerHeight - MARGIN * 2 - HUD_H;
    const side = Math.max(Math.min(availW, availH), COLS); // 최소 1px/칸
    cell = Math.floor(side / COLS);
    grid.style.setProperty('--cell', cell + 'px');
    board.style.paddingBottom = HUD_H + 'px';
  }

  function tileAt(c, r) {
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return null;
    return grid.children[r * COLS + c] || null;
  }

  /* ---------- 칠하기 ---------- */

  /** 화면 좌표 -> 격자 좌표. 판 밖이면 null */
  function cellFromPoint(x, y) {
    const rect = grid.getBoundingClientRect();
    const c = Math.floor((x - rect.left) / cell);
    const r = Math.floor((y - rect.top)  / cell);
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return null;
    return { c, r };
  }

  function paint(c, r, color) {
    const t = tileAt(c, r);
    if (!t) return;
    painted.set(c + ',' + r, color);
    t.style.backgroundColor = color;
    t.classList.add('on');
  }

  function erase(c, r) {
    const t = tileAt(c, r);
    painted.delete(c + ',' + r);
    if (!t) return;
    t.style.backgroundColor = '';
    t.classList.remove('on');
  }

  /** 포인터가 빨리 움직여 격자를 건너뛰어도 빈칸이 남지 않도록 직선 보간 */
  function paintLine(from, to, color) {
    const dc = to.c - from.c, dr = to.r - from.r;
    const steps = Math.max(Math.abs(dc), Math.abs(dr));
    if (steps === 0) { paint(to.c, to.r, color); return; }
    for (let i = 1; i <= steps; i++) {
      paint(
        from.c + Math.round(dc * i / steps),
        from.r + Math.round(dr * i / steps),
        color
      );
    }
  }

  /* ---------- 드래그 ---------- */

  let dragging = false;
  let last = null;
  let start = null;        // 드래그가 시작된 칸
  let startWasPainted = false;
  let moved = false;       // 다른 칸으로 넘어간 적이 있는가

  board.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    if (e.target.closest('.hud')) return;

    const at = cellFromPoint(e.clientX, e.clientY);
    if (!at) return;                       // 판 밖에서 시작한 드래그는 무시

    // 색이 있는 칸에서 시작하면 그 색이 이어지고, 빈 칸이면 새 색을 배정한다
    const existing = painted.get(at.c + ',' + at.r);
    if (existing) {
      dragColor = existing;
    } else {
      colorIdx = (colorIdx + 1) % PALETTE.length;
      dragColor = PALETTE[colorIdx];
    }
    swatch.style.backgroundColor = dragColor;

    last = start = at;
    startWasPainted = !!existing;
    moved = false;
    dragging = true;
    paint(at.c, at.r, dragColor);

    board.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  board.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const cur = cellFromPoint(e.clientX, e.clientY);
    if (!cur) return;                      // 판 밖으로 나간 동안은 칠하지 않는다
    if (cur.c === last.c && cur.r === last.r) return;
    moved = true;
    paintLine(last, cur, dragColor);
    last = cur;
  });

  function endDrag(isRelease) {
    // 이동 없이 놓았고 이미 색이 있던 칸이었다면 클릭으로 보고 색을 지운다
    if (isRelease && dragging && !moved && startWasPainted && start) {
      erase(start.c, start.r);
    }
    dragging = false;
    last = null;
    start = null;
    startWasPainted = false;
  }
  board.addEventListener('pointerup',     () => endDrag(true));
  board.addEventListener('pointercancel', () => endDrag(false));
  window.addEventListener('blur',         () => endDrag(false));

  /* ---------- HUD ---------- */

  document.getElementById('clear').addEventListener('click', () => {
    painted.clear();
    for (const t of grid.children) {
      t.style.backgroundColor = '';
      t.classList.remove('on');
    }
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  buildGrid();
  resize();
  swatch.style.backgroundColor = PALETTE[0];
})();
</script>
</body>
</html>
