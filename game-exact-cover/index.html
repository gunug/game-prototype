<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>정확한 커버 — Game Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}

  .app{
    position:fixed;
    inset:0;
    display:flex;
    background:var(--canvas);
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---- 좌측 스테이지 패널 ---- */
  .side{
    flex:0 0 220px;
    display:flex;
    flex-direction:column;
    gap:var(--s4);
    padding:var(--s4);
    padding-left:calc(env(safe-area-inset-left,0px) + var(--s4));
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--s4));
    background:var(--surface);
    border-right:1px solid var(--hairline);
    overflow-y:auto;
  }
  .side h2{
    margin:0;
    font-size:12px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .side .home{text-decoration:none;align-self:flex-start;}

  .stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s2);}
  .stages button{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:var(--s2);
    font-family:var(--font);
    font-size:14px;
    font-weight:600;
    text-align:left;
    color:var(--body);
    background:var(--surface-soft);
    border:1px solid var(--hairline);
    border-radius:var(--r-md);
    padding:10px 12px;
    cursor:pointer;
    transition:.15s;
  }
  .stages button:hover{border-color:var(--brand-yellow-deep);}
  .stages button[aria-current="true"]{
    border-color:var(--brand-yellow);
    color:var(--ink);
  }
  .stages .label{flex:1;}
  /* 난이도 — 낮으면 흐리게, 높을수록 브랜드색으로 */
  .stages .diff{
    flex:0 0 auto;
    min-width:26px;
    text-align:center;
    font-size:11px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    padding:2px 6px;
    border-radius:var(--r-pill);
    color:color-mix(in srgb, var(--brand-yellow) calc(var(--t) * 100%), var(--muted));
    background:color-mix(in srgb, var(--brand-yellow) calc(var(--t) * 14%), transparent);
    border:1px solid color-mix(in srgb, var(--brand-yellow) calc(var(--t) * 45%), var(--hairline));
  }
  .stages .check{color:var(--brand-yellow);font-weight:800;visibility:hidden;}
  .stages button.done .check{visibility:visible;}

  /* 칠해야 할 모양 미리보기 */
  .target{display:flex;flex-direction:column;gap:var(--s2);}
  .preview{
    display:grid;
    gap:2px;
    justify-content:start;
    grid-template-columns:repeat(var(--pc,1), 18px);
    grid-template-rows:repeat(var(--pr,1), 18px);
  }
  .preview i{border-radius:3px;background:transparent;}
  .preview i.on{background:var(--brand-yellow);}

  .side .spacer{flex:1;}

  /* ---- 판 ---- */
  .board{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(var(--cols), var(--cell));
    grid-template-rows:repeat(var(--rows), var(--cell));
  }
  .tile{
    width:var(--cell);
    height:var(--cell);
    background:transparent;
    transition:background-color .08s linear;
  }
  /* 칠할 필요 없는 필드는 비활성 */
  .tile.off{box-shadow:inset 0 0 0 1px rgba(51,51,43,.35);}
  .tile.field{box-shadow:inset 0 0 0 1px var(--hairline);background:var(--surface);}
  .tile.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);}

  .banner{
    position:absolute;
    top:var(--s5);
    left:50%;
    transform:translate(-50%,-12px);
    background:var(--brand-yellow);
    color:var(--on-brand);
    font-weight:700;
    font-size:14px;
    padding:10px 20px;
    border-radius:var(--r-pill);
    box-shadow:var(--sh-md);
    opacity:0;
    pointer-events:none;
    transition:.2s;
  }
  .banner.show{opacity:1;transform:translate(-50%,0);}

  @media(max-width:640px){
    .app{flex-direction:column;}
    .side{
      flex:0 0 auto;
      flex-direction:row;
      align-items:center;
      overflow-x:auto;
      border-right:none;
      border-bottom:1px solid var(--hairline);
    }
    .side h2,.side .spacer{display:none;}
    .stages{flex-direction:row;}
    .stages button{width:auto;}
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="btn btn-secondary btn-sm home" href="../index.html">← 목록</a>

      <h2>스테이지</h2>
      <ul class="stages" id="stages"></ul>

      <div class="target">
        <h2>칠해야 할 모양</h2>
        <div class="preview" id="preview"></div>
      </div>

      <div class="spacer"></div>
      <button class="btn btn-secondary btn-sm" id="reset">지우기</button>
    </aside>

    <main class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="banner" id="banner">클리어!</div>
    </main>
  </div>

<script>
(() => {
  'use strict';

  const COLS = 10, ROWS = 10;   // 격자는 가로 10칸, 세로 10칸
  const MARGIN = 16;

  /**
   * 칠 하나마다 서로 다른 색을 쓰므로 칸 수만큼 색이 필요하다.
   * 황금각으로 색상환을 돌아 이웃한 번호끼리도 확실히 구분되게 만든다.
   */
  const PALETTE = Array.from({ length: COLS * ROWS }, (_, i) => {
    const hue = (i * 137.508) % 360;
    return `hsl(${hue.toFixed(1)} 72% ${i % 2 ? 58 : 68}%)`;
  });

  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];

  /* ==================== 모양 ==================== */

  const k  = (c, r) => c + ',' + r;
  const un = (key) => key.split(',').map(Number);

  /** 좌상단을 0,0으로 옮기고 정렬한 표준형 */
  function normalize(cells) {
    let mc = Infinity, mr = Infinity;
    for (const [c, r] of cells) { if (c < mc) mc = c; if (r < mr) mr = r; }
    return cells
      .map(([c, r]) => [c - mc, r - mr])
      .sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  }
  const shapeKey = (cells) => normalize(cells).map((p) => p.join(',')).join(' ');
  const rotate90 = (cells) => cells.map(([c, r]) => [-r, c]);

  /** 0/90/180/270 회전형. 반사는 다른 모양으로 본다 */
  function rotations(cells) {
    const out = [];
    let cur = normalize(cells);
    for (let i = 0; i < 4; i++) { out.push(normalize(cur)); cur = rotate90(cur); }
    return out;
  }

  /* ==================== 스테이지 ==================== */

  const SHAPES = {
    O4: [[0, 0], [1, 0], [0, 1], [1, 1]],   // 테트로미노 O
    I3: [[0, 0], [0, 1], [0, 2]],   // 트로미노 I
    T4: [[0, 0], [1, 0], [2, 0], [1, 1]],   // 테트로미노 T
    L3: [[0, 0], [0, 1], [1, 1]],   // 트로미노 L
    L5: [[0, 0], [0, 1], [0, 2], [0, 3], [1, 3]],   // 펜토미노 L
    L4: [[0, 0], [0, 1], [0, 2], [1, 2]],   // 테트로미노 L
  };

  /**
   * 필드는 tools/generate.py 가 CP-SAT 로 미리 풀어 구운 값이다. 각 칸이
   * 정확히 한 조각에 덮이도록 제약을 걸어 만들었으므로 항상 해가 있다.
   * 문자열은 좌상단부터 행 우선으로 읽는 10x10 비트맵.
   *
   * difficulty 는 tools/measure.py 가 잰 1~100 점수. 쉬운 순으로 정렬돼 있다.
   */
  const STAGES = [
    {
      name: '스테이지 1',
      shape: SHAPES.O4,
      difficulty: 8,
      // 테트로미노 O x12 = 48칸 | 해 1 | 강제 100% | 이어칠 성공률 100% | 헛칠 0%
      field: '1100000000110011001111111100111111111111001111111111110000001111000000111100000011000000000000000000',
    },
    {
      name: '스테이지 2',
      shape: SHAPES.I3,
      difficulty: 36,
      // 트로미노 I x12 = 36칸 | 해 4 | 강제 50% | 이어칠 성공률 37% | 헛칠 0%
      field: '0001100000000110000000011111000011111100001110000000111000000010111000001111100000111110000001000000',
    },
    {
      name: '스테이지 3',
      shape: SHAPES.T4,
      difficulty: 49,
      // 테트로미노 T x13 = 52칸 | 해 4 | 강제 69% | 이어칠 성공률 7% | 헛칠 2%
      field: '0100001110110111110011111100001111111111111111111011110000001111100000111000000011110000000000000000',
    },
    {
      name: '스테이지 4',
      shape: SHAPES.L3,
      difficulty: 52,
      // 트로미노 L x10 = 30칸 | 해 2 | 강제 80% | 이어칠 성공률 0% | 헛칠 10%
      field: '0000110000000011000000111100000111110000000110000000011000000001110000001111110000000011000000001100',
    },
    {
      name: '스테이지 5',
      shape: SHAPES.L5,
      difficulty: 62,
      // 펜토미노 L x14 = 70칸 | 해 1 | 강제 100% | 이어칠 성공률 0% | 헛칠 18%
      field: '0001000111111111111111111111111111111111111111111111100111101110010000111001000011111110000111100000',
    },
    {
      name: '스테이지 6',
      shape: SHAPES.L4,
      difficulty: 68,
      // 테트로미노 L x14 = 56칸 | 해 8 | 강제 50% | 이어칠 성공률 3% | 헛칠 21%
      field: '0000000000000000011101111111110111111111000111111111110011111111001111001111111100111100000000000000',
    },
  ];
  /* ==================== 상태 ==================== */

  const grid      = document.getElementById('grid');
  const board     = document.getElementById('board');
  const preview   = document.getElementById('preview');
  const banner    = document.getElementById('banner');
  const stageList = document.getElementById('stages');

  const STORE = 'exact-cover.cleared';
  const cleared = new Set(JSON.parse(localStorage.getItem(STORE) || '[]'));

  let stageIdx = 0;
  let field = new Set();        // 칠할 수 있는 칸
  let targetKeys = new Set();   // 목표 모양의 회전형 표준키
  const painted = new Map();    // "c,r" -> color
  let cell = 0;
  let colorIdx = -1;
  let dragColor = null;

  /* ==================== 화면 ==================== */

  function tileAt(c, r) {
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return null;
    return grid.children[r * COLS + c] || null;
  }

  function buildGrid() {
    grid.style.setProperty('--cols', COLS);
    grid.style.setProperty('--rows', ROWS);
    const frag = document.createDocumentFragment();
    for (let i = 0; i < COLS * ROWS; i++) {
      const t = document.createElement('div');
      t.className = 'tile';
      frag.appendChild(t);
    }
    grid.replaceChildren(frag);
  }

  /** 1:1 비율을 유지한 채 남은 영역에 맞춰 칸 크기를 정한다 */
  function resize() {
    const rect = board.getBoundingClientRect();
    const side = Math.max(Math.min(rect.width, rect.height) - MARGIN * 2, COLS);
    cell = Math.floor(side / COLS);
    grid.style.setProperty('--cell', cell + 'px');
  }

  function renderPreview(shape) {
    const cells = normalize(shape);
    const w = Math.max(...cells.map((p) => p[0])) + 1;
    const h = Math.max(...cells.map((p) => p[1])) + 1;
    preview.style.setProperty('--pc', w);
    preview.style.setProperty('--pr', h);
    const on = new Set(cells.map(([c, r]) => k(c, r)));
    const frag = document.createDocumentFragment();
    for (let r = 0; r < h; r++) {
      for (let c = 0; c < w; c++) {
        const i = document.createElement('i');
        if (on.has(k(c, r))) i.className = 'on';
        frag.appendChild(i);
      }
    }
    preview.replaceChildren(frag);
  }

  function renderStages() {
    const frag = document.createDocumentFragment();
    STAGES.forEach((s, i) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      if (i === stageIdx) b.setAttribute('aria-current', 'true');
      if (cleared.has(s.name)) b.classList.add('done');

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = s.name;

      // tools/measure.py 가 잰 1~100 난이도
      const diff = document.createElement('span');
      diff.className = 'diff';
      diff.textContent = s.difficulty;
      diff.title = `난이도 ${s.difficulty}`;
      diff.style.setProperty('--t', Math.min(s.difficulty, 100) / 100);

      const chk = document.createElement('span');
      chk.className = 'check';
      chk.textContent = '✓';

      b.append(label, diff, chk);
      b.addEventListener('click', () => loadStage(i));
      li.appendChild(b);
      frag.appendChild(li);
    });
    stageList.replaceChildren(frag);
  }

  function loadStage(i) {
    stageIdx = i;
    const s = STAGES[i];

    field = readField(s.field);
    targetKeys = new Set(rotations(s.shape).map(shapeKey));

    painted.clear();
    colorIdx = -1;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = tileAt(c, r);
        t.style.backgroundColor = '';
        t.className = 'tile ' + (field.has(k(c, r)) ? 'field' : 'off');
      }
    }
    renderPreview(s.shape);
    renderStages();
    showBanner(false);
    resize();
  }

  function showBanner(on) { banner.classList.toggle('show', on); }

  /* ==================== 칠하기 ==================== */

  /**
   * 다음 색. 이미 필드에 쓰이고 있는 색은 배정하지 않는다 — 같은 색이 맞닿으면
   * 두 칠이 한 덩어리로 읽혀서 모양 판정이 어긋나기 때문이다.
   */
  function nextColor() {
    const inUse = new Set(painted.values());
    for (let i = 1; i <= PALETTE.length; i++) {
      const idx = (colorIdx + i) % PALETTE.length;
      if (!inUse.has(PALETTE[idx])) return (colorIdx = idx);
    }
    return (colorIdx = (colorIdx + 1) % PALETTE.length);  // 칸 수만큼 썼을 때만
  }

  /** 화면 좌표 -> 칠할 수 있는 칸. 판 밖이거나 비활성이면 null */
  function cellFromPoint(x, y) {
    const rect = grid.getBoundingClientRect();
    const c = Math.floor((x - rect.left) / cell);
    const r = Math.floor((y - rect.top) / cell);
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return null;
    if (!field.has(k(c, r))) return null;
    return { c, r };
  }

  function paint(c, r, color) {
    if (!field.has(k(c, r))) return;
    const t = tileAt(c, r);
    if (!t) return;
    painted.set(k(c, r), color);
    t.style.backgroundColor = color;
    t.classList.add('on');
  }

  function erase(c, r) {
    const t = tileAt(c, r);
    painted.delete(k(c, r));
    if (!t) return;
    t.style.backgroundColor = '';
    t.classList.remove('on');
  }

  /** 포인터가 빨리 움직여 칸을 건너뛰어도 빈칸이 남지 않도록 직선 보간 */
  function paintLine(from, to, color) {
    const dc = to.c - from.c, dr = to.r - from.r;
    const steps = Math.max(Math.abs(dc), Math.abs(dr));
    if (steps === 0) { paint(to.c, to.r, color); return; }
    for (let i = 1; i <= steps; i++) {
      paint(from.c + Math.round(dc * i / steps),
            from.r + Math.round(dr * i / steps), color);
    }
  }

  /* ==================== 클리어 판정 ==================== */

  /** 같은 색으로 이어진 덩어리 하나 = 칠 하나 */
  function blobAt(startKey, seen) {
    const color = painted.get(startKey);
    const stack = [startKey], out = [];
    seen.add(startKey);
    while (stack.length) {
      const cur = stack.pop();
      const [c, r] = un(cur);
      out.push([c, r]);
      for (const [dc, dr] of DIRS) {
        const nk = k(c + dc, r + dr);
        if (seen.has(nk) || painted.get(nk) !== color) continue;
        seen.add(nk);
        stack.push(nk);
      }
    }
    return out;
  }

  function checkClear() {
    // 모든 필드를 칠해야한다
    for (const key of field) if (!painted.has(key)) return false;
    // 모든 칠은 같은 모양을 가지고 있어야한다
    const seen = new Set();
    for (const key of painted.keys()) {
      if (seen.has(key)) continue;
      if (!targetKeys.has(shapeKey(blobAt(key, seen)))) return false;
    }
    return true;
  }

  function evaluate() {
    const ok = checkClear();
    showBanner(ok);
    if (ok && !cleared.has(STAGES[stageIdx].name)) {
      cleared.add(STAGES[stageIdx].name);
      localStorage.setItem(STORE, JSON.stringify([...cleared]));
      renderStages();
    }
  }

  /* ==================== 드래그 ==================== */

  let dragging = false, last = null, start = null;
  let startWasPainted = false, moved = false;

  board.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    const at = cellFromPoint(e.clientX, e.clientY);
    if (!at) return;

    // 색이 있는 칸에서 시작하면 그 색이 이어지고, 빈 칸이면 새 색을 배정한다
    const existing = painted.get(k(at.c, at.r));
    if (existing) {
      dragColor = existing;
    } else {
      dragColor = PALETTE[nextColor()];
    }

    last = start = at;
    startWasPainted = !!existing;
    moved = false;
    dragging = true;
    paint(at.c, at.r, dragColor);

    board.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  board.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const cur = cellFromPoint(e.clientX, e.clientY);
    if (!cur) return;
    if (cur.c === last.c && cur.r === last.r) return;
    moved = true;
    paintLine(last, cur, dragColor);
    last = cur;
  });

  function endDrag(isRelease) {
    if (!dragging) return;
    // 이동 없이 놓았고 이미 색이 있던 칸이었다면 클릭으로 보고 색을 지운다
    if (isRelease && !moved && startWasPainted && start) erase(start.c, start.r);
    dragging = false;
    last = start = null;
    startWasPainted = false;
    evaluate();
  }
  board.addEventListener('pointerup',     () => endDrag(true));
  board.addEventListener('pointercancel', () => endDrag(false));
  window.addEventListener('blur',         () => endDrag(false));

  /* ==================== 시작 ==================== */

  document.getElementById('reset').addEventListener('click', () => loadStage(stageIdx));
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  buildGrid();
  loadStage(0);
})();
</script>
</body>
</html>
