<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>정확한 커버 — Game Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets-ds.css">
<style>
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}

  .app{
    position:fixed;
    inset:0;
    display:flex;
    background:var(--canvas);
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---- 좌측 스테이지 패널 ---- */
  .side{
    flex:0 0 220px;
    display:flex;
    flex-direction:column;
    gap:var(--s4);
    padding:var(--s4);
    padding-left:calc(env(safe-area-inset-left,0px) + var(--s4));
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--s4));
    background:var(--surface);
    border-right:1px solid var(--hairline);
    overflow:hidden;
  }
  .side h2{
    margin:0;
    font-size:12px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .side .home{text-decoration:none;align-self:flex-start;}

  /* 스테이지가 많아도 모양 미리보기와 지우기 버튼이 밀려나지 않도록
     목록만 스크롤한다 */
  .stages{
    list-style:none;
    margin:0;
    padding:0 var(--s2) 0 0;
    display:flex;
    flex-direction:column;
    gap:var(--s2);
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    scrollbar-width:thin;
  }
  .stages button{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:var(--s2);
    font-family:var(--font);
    font-size:14px;
    font-weight:600;
    text-align:left;
    color:var(--body);
    background:var(--surface-soft);
    border:1px solid var(--hairline);
    border-radius:var(--r-md);
    padding:10px 12px;
    cursor:pointer;
    transition:.15s;
  }
  .stages button:hover{border-color:var(--brand-yellow-deep);}
  .stages button[aria-current="true"]{
    border-color:var(--brand-yellow);
    color:var(--ink);
  }
  .stages .sect{
    font-size:11px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    padding:var(--s3) 2px 2px;
  }
  .stages .sect:first-child{padding-top:0;}
  .stages .label{flex:1;}
  /* 난이도 — 낮으면 흐리게, 높을수록 브랜드색으로 */
  .stages .diff{
    flex:0 0 auto;
    min-width:26px;
    text-align:center;
    font-size:11px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    padding:2px 6px;
    border-radius:var(--r-pill);
    color:color-mix(in srgb, var(--brand-yellow) calc(var(--t) * 100%), var(--muted));
    background:color-mix(in srgb, var(--brand-yellow) calc(var(--t) * 14%), transparent);
    border:1px solid color-mix(in srgb, var(--brand-yellow) calc(var(--t) * 45%), var(--hairline));
  }
  .stages .check{color:var(--brand-yellow);font-weight:800;visibility:hidden;}
  .stages button.done .check{visibility:visible;}

  /* 칠해야 할 모양 미리보기 */
  .target{display:flex;flex-direction:column;gap:var(--s2);}
  .preview{display:flex;align-items:flex-start;gap:var(--s4);flex-wrap:wrap;}
  .preview .chip{
    display:grid;
    gap:2px;
    grid-template-columns:repeat(var(--pc,1), 18px);
    grid-template-rows:repeat(var(--pr,1), 18px);
  }
  .preview i{border-radius:3px;background:transparent;}
  .preview i.on{background:var(--brand-yellow);}


  /* ---- 판 ---- */
  .board{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
  }
  .grid{
    position:relative;
    display:grid;
    grid-template-columns:repeat(var(--cols), var(--cell));
    grid-template-rows:repeat(var(--rows), var(--cell));
  }

  /* 필드 바깥 경계선. 칸마다 그리면 모서리가 겹쳐서 한 겹으로 얹는다 */
  .outline{
    position:absolute;
    inset:0;
    overflow:visible;
    pointer-events:none;
  }
  .outline path{
    fill:none;
    stroke:rgba(255,255,255,.92);
    stroke-width:.045;
    stroke-linecap:square;
    filter:drop-shadow(0 0 2px rgba(255,255,255,.9))
           drop-shadow(0 0 7px rgba(255,255,255,.45));
  }
  .tile{
    width:var(--cell);
    height:var(--cell);
    background:transparent;
    transition:background-color .08s linear;
  }
  /* 칠할 필요 없는 필드는 비활성 */
  .tile.off{box-shadow:inset 0 0 0 1px rgba(51,51,43,.35);}
  .tile.field{box-shadow:inset 0 0 0 1px var(--hairline);background:var(--surface);}
  .tile.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);}

  /* 홀드하는 3초 동안 지워질 칠 전체가 서서히 밝아진다 */
  @keyframes hold-fade{
    from{filter:none;}
    to{filter:brightness(2.2) saturate(.25);}
  }
  .tile.holding{animation:hold-fade var(--hold) linear forwards;}

  /* 칠해야 할 모양과 일치하는 칠에만 얹는 유리 질감 */
  .tile.match{
    background-image:
      repeating-linear-gradient(135deg,
        rgba(255,255,255,.30) 0 2px,
        rgba(255,255,255,.10) 2px 5px,
        rgba(255,255,255,0)   5px 10px),
      linear-gradient(150deg,
        rgba(255,255,255,.42) 0%,
        rgba(255,255,255,.10) 45%,
        rgba(255,255,255,0)   70%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);
  }

  .banner{
    position:absolute;
    top:var(--s5);
    left:50%;
    transform:translate(-50%,-12px);
    background:var(--brand-yellow);
    color:var(--on-brand);
    font-weight:700;
    font-size:14px;
    padding:10px 20px;
    border-radius:var(--r-pill);
    box-shadow:var(--sh-md);
    opacity:0;
    pointer-events:none;
    transition:.2s;
  }
  .banner.show{opacity:1;transform:translate(-50%,0);}

  @media(max-width:640px){
    .app{flex-direction:column;}
    .side{
      flex:0 0 auto;
      flex-direction:row;
      align-items:center;
      overflow-x:auto;
      border-right:none;
      border-bottom:1px solid var(--hairline);
    }
    .side h2{display:none;}
    .stages{flex:0 1 auto;overflow-x:auto;overflow-y:hidden;padding:0;}
    .stages{flex-direction:row;}
    .stages button{width:auto;}
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="btn btn-secondary btn-sm home" href="../index.html">← 목록</a>

      <h2>스테이지</h2>
      <ul class="stages" id="stages"></ul>

      <div class="target">
        <h2>칠해야 할 모양</h2>
        <div class="preview" id="preview"></div>
      </div>

      <button class="btn btn-secondary btn-sm" id="reset">지우기</button>
    </aside>

    <main class="board" id="board">
      <div class="grid" id="grid">
        <svg class="outline" id="outline" preserveAspectRatio="none" aria-hidden="true">
          <path id="outline-path"></path>
        </svg>
      </div>
      <div class="banner" id="banner">클리어!</div>
    </main>
  </div>

   */
  const PALETTE = Array.from({ length: COLS * ROWS }, (_, i) => {
    const hue = (i * 137.508) % 360;
    return `hsl(${hue.toFixed(1)} 72% ${i % 2 ? 58 : 68}%)`;
  });

  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];

  /* ==================== 모양 ==================== */

  /** 좌상단을 0,0으로 옮기고 정렬한 표준형 */
  function normalize(cells) {
    let mc = Infinity, mr = Infinity;
    for (const [c, r] of cells) { if (c < mc) mc = c; if (r < mr) mr = r; }
    return cells
      .map(([c, r]) => [c - mc, r - mr])
      .sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  }
  const shapeKey = (cells) => normalize(cells).map((p) => p.join(',')).join(' ');
  const rotate90 = (cells) => cells.map(([c, r]) => [-r, c]);

  /** 0/90/180/270 회전형. 반사는 다른 모양으로 본다 */
  function rotations(cells) {
    const out = [];
    let cur = normalize(cells);
    for (let i = 0; i < 4; i++) { out.push(normalize(cur)); cur = rotate90(cur); }
    return out;
  }

      difficulty: 59,
      // 트로미노 I + 트로미노 L | 48칸 | 해 4004 | 강제 12% | 이어칠 성공률 0% | 헛칠 6%
      field: '0010000000011000000001100000000110000000111111100111111100010111111111111111111111000111110000000000',
    },
    {

      shapes: [SHAPES.L3, SHAPES.T4],
      difficulty: 68,
      // 트로미노 L + 테트로미노 T | 60칸 | 해 5000+ | 강제 0% | 이어칠 성공률 0% | 헛칠 2%
      field: '0110000000011001100001111111101111111111111011111111100110101111111100111111100011111000000100000000',
    },
    {
      name: '두 종 4',
      mode: 'dual',
      shapes: [SHAPES.L3, SHAPES.L4],
      difficulty: 70,
      // 트로미노 L + 테트로미노 L | 66칸 | 해 5000+ | 강제 0% | 이어칠 성공률 0% | 헛칠 11%
      field: '0011110000011111110011111111001111110000111111111111111111101111100110111110001111000000111100000011',
    },
    {
      name: '두 종 5',
      mode: 'dual',
      shapes: [SHAPES.T4, SHAPES.S4],
      difficulty: 72,
      // 테트로미노 T + 테트로미노 S | 72칸 | 해 26 | 강제 28% | 이어칠 성공률 0% | 헛칠 23%
      field: '0000001111100010111111111111111111111111000111111111111111111111111111011111111101111100000000100000',
    },
  ];

  /** 비트맵 문자열 -> 칠할 수 있는 칸 집합 */
  function readField(bits) {
    const out = new Set();
    for (let i = 0; i < bits.length; i++) {
      if (bits[i] === '1') out.add(k(i % COLS, Math.floor(i / COLS)));
    }
    return out;
  }
  /* ==================== 상태 ==================== */

  const grid      = document.getElementById('grid');
  const outline   = document.getElementById('outline');
  const outlinePath = document.getElementById('outline-path');
  const board     = document.getElementById('board');
  const preview   = document.getElementById('preview');
  const banner    = document.getElementById('banner');
  const stageList = document.getElementById('stages');

  const STORE = 'exact-cover.cleared';
  const cleared = new Set(JSON.parse(localStorage.getItem(STORE) || '[]'));

  let stageIdx = 0;
  let field = new Set();        // 칠할 수 있는 칸
  let targetKeys = new Set();   // 목표 모양의 회전형 표준키
  const painted = new Map();    // "c,r" -> color
  let cell = 0;
  let colorIdx = -1;
  let dragColor = null;

  /* ==================== 화면 ==================== */

  /** 칸 엘리먼트. 격자 안에 경계선 svg 도 들어 있어 children 으로 세지 않는다 */
  const tiles = [];

  function tileAt(c, r) {
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return null;
    return tiles[r * COLS + c] || null;
  }

  function buildGrid() {
    grid.style.setProperty('--cols', COLS);
    grid.style.setProperty('--rows', ROWS);
    outline.setAttribute('viewBox', `0 0 ${COLS} ${ROWS}`);
    grid.style.setProperty('--hold', HOLD_MS + 'ms');

    tiles.length = 0;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < COLS * ROWS; i++) {
      const t = document.createElement('div');
      t.className = 'tile';
      tiles.push(t);
      frag.appendChild(t);
    }
    grid.replaceChildren(frag);
    grid.appendChild(outline);   // 칸 위에 한 겹으로 얹는다
  }

  /** 필드와 바깥이 맞닿는 변만 모아 한 줄기 path 로 그린다 */
  function drawOutline() {
    const seg = [];
    for (const key of field) {
      const [c, r] = un(key);
      if (!field.has(k(c, r - 1))) seg.push(`M${c} ${r}H${c + 1}`);
      if (!field.has(k(c, r + 1))) seg.push(`M${c} ${r + 1}H${c + 1}`);
      if (!field.has(k(c - 1, r))) seg.push(`M${c} ${r}V${r + 1}`);
      if (!field.has(k(c + 1, r))) seg.push(`M${c + 1} ${r}V${r + 1}`);
    }
    outlinePath.setAttribute('d', seg.join(''));
  }

  /** 1:1 비율을 유지한 채 남은 영역에 맞춰 칸 크기를 정한다 */
  function resize() {
    const rect = board.getBoundingClientRect();
    const side = Math.max(Math.min(rect.width, rect.height) - MARGIN * 2, COLS);
    cell = Math.floor(side / COLS);
    grid.style.setProperty('--cell', cell + 'px');
  }

  /** 모양 하나를 미니 격자로 */
  function shapeChip(shape) {
    const cells = normalize(shape);
    const w = Math.max(...cells.map((p) => p[0])) + 1;
    const h = Math.max(...cells.map((p) => p[1])) + 1;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.style.setProperty('--pc', w);
    chip.style.setProperty('--pr', h);
    const on = new Set(cells.map(([c, r]) => k(c, r)));
    for (let r = 0; r < h; r++) {
      for (let c = 0; c < w; c++) {
        const i = document.createElement('i');
        if (on.has(k(c, r))) i.className = 'on';
        chip.appendChild(i);
      }
    }
    return chip;
  }

  /** 두 종 스테이지는 모양을 나란히 보여 준다 */
  function renderPreview(shapes) {
    const frag = document.createDocumentFragment();
    shapes.forEach((sh) => frag.appendChild(shapeChip(sh)));
    preview.replaceChildren(frag);
  }

  const MODE_LABEL = { single: '조각 한 종', dual: '조각 두 종' };

  function renderStages() {
    const frag = document.createDocumentFragment();
    let mode = null;
    STAGES.forEach((s, i) => {
      // 모드가 바뀌는 자리에 구분 머리말을 넣는다
      if (s.mode !== mode) {
        mode = s.mode;
        const sect = document.createElement('li');
        sect.className = 'sect';
        sect.textContent = MODE_LABEL[mode] || mode;
        frag.appendChild(sect);
      }
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      if (i === stageIdx) b.setAttribute('aria-current', 'true');
      if (cleared.has(s.name)) b.classList.add('done');

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = s.name;

      // tools/measure.py 가 잰 1~100 난이도
      const diff = document.createElement('span');
      diff.className = 'diff';
      diff.textContent = s.difficulty;
      diff.title = `난이도 ${s.difficulty}`;
      diff.style.setProperty('--t', Math.min(s.difficulty, 100) / 100);

      const chk = document.createElement('span');
      chk.className = 'check';
      chk.textContent = '✓';

      b.append(label, diff, chk);
      b.addEventListener('click', () => loadStage(i));
      li.appendChild(b);
      frag.appendChild(li);
    });
    stageList.replaceChildren(frag);
  }

  function loadStage(i) {
    stageIdx = i;
    const s = STAGES[i];

    field = readField(s.field);
    // 두 종이면 어느 쪽 모양이어도 맞는 것으로 본다
    targetKeys = new Set(s.shapes.flatMap((sh) => rotations(sh).map(shapeKey)));

    cancelHold();
    painted.clear();
    colorIdx = -1;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = tileAt(c, r);
        t.style.backgroundColor = '';
        t.className = 'tile ' + (field.has(k(c, r)) ? 'field' : 'off');
      }
    }
    drawOutline();
    renderPreview(s.shapes);
    renderStages();
    showBanner(false);
    resize();
  }

  function showBanner(on) { banner.classList.toggle('show', on); }

  /* ==================== 칠하기 ==================== */

  /**
   * 다음 색. 이미 필드에 쓰이고 있는 색은 배정하지 않는다 — 같은 색이 맞닿으면
   * 두 칠이 한 덩어리로 읽혀서 모양 판정이 어긋나기 때문이다.
   */
  function nextColor() {
    const inUse = new Set(painted.values());
    for (let i = 1; i <= PALETTE.length; i++) {
      const idx = (colorIdx + i) % PALETTE.length;
      if (!inUse.has(PALETTE[idx])) return (colorIdx = idx);
    }
    return (colorIdx = (colorIdx + 1) % PALETTE.length);  // 칸 수만큼 썼을 때만
  }

  /** 화면 좌표 -> 칠할 수 있는 칸. 판 밖이거나 비활성이면 null */
  function cellFromPoint(x, y) {
    const rect = grid.getBoundingClientRect();
    const c = Math.floor((x - rect.left) / cell);
    const r = Math.floor((y - rect.top) / cell);
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return null;
    if (!field.has(k(c, r))) return null;
    return { c, r };
  }

  function paint(c, r, color) {
    if (!field.has(k(c, r))) return;
    const t = tileAt(c, r);
    if (!t) return;
    painted.set(k(c, r), color);
    t.style.backgroundColor = color;
    t.classList.add('on');
  }

  function erase(c, r) {
    const t = tileAt(c, r);
    painted.delete(k(c, r));
    if (!t) return;
    t.style.backgroundColor = '';
    t.classList.remove('on');
  }

  /** 포인터가 빨리 움직여 칸을 건너뛰어도 빈칸이 남지 않도록 직선 보간 */
  function paintLine(from, to, color) {
    const dc = to.c - from.c, dr = to.r - from.r;
    const steps = Math.max(Math.abs(dc), Math.abs(dr));
    if (steps === 0) { paint(to.c, to.r, color); return; }
    for (let i = 1; i <= steps; i++) {
      paint(from.c + Math.round(dc * i / steps),
            from.r + Math.round(dr * i / steps), color);
    }
  }

  /* ==================== 홀드해서 색 전체 지우기 ==================== */

  let holdTimer = null;
  let holdColor = null;
  let holdFired = false;   // 홀드로 지웠으면 뗄 때 한 칸 지우기를 건너뛴다

  function eachOfColor(color, fn) {
    for (const [key, c] of [...painted]) {
      if (c !== color) continue;
      const [cc, rr] = un(key);
      fn(cc, rr);
    }
  }

  function startHold(color) {
    holdColor = color;
    holdFired = false;
    // 무엇이 지워질지 보이도록 같은 색 전체를 밝힌다
    eachOfColor(color, (c, r) => tileAt(c, r).classList.add('holding'));
    holdTimer = setTimeout(() => {
      holdTimer = null;
      holdFired = true;
      dragging = false;                 // 지운 뒤에 이어 칠하지 않는다
      eachOfColor(color, erase);
      clearHoldMark();
      evaluate();
    }, HOLD_MS);
  }

  function clearHoldMark() {
    for (const t of tiles) t.classList.remove('holding');
    holdColor = null;
  }

  function cancelHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (holdColor) clearHoldMark();
  }

  /* ==================== 클리어 판정 ==================== */

  /** 같은 색으로 이어진 덩어리 하나 = 칠 하나 */
  function blobAt(startKey, seen) {
    const color = painted.get(startKey);
    const stack = [startKey], out = [];
    seen.add(startKey);
    while (stack.length) {
      const cur = stack.pop();
      const [c, r] = un(cur);
      out.push([c, r]);
      for (const [dc, dr] of DIRS) {
        const nk = k(c + dc, r + dr);
        if (seen.has(nk) || painted.get(nk) !== color) continue;
        seen.add(nk);
        stack.push(nk);
      }
    }
    return out;
  }

  function checkClear() {
    // 모든 필드를 칠해야한다
    for (const key of field) if (!painted.has(key)) return false;
    // 모든 칠은 같은 모양을 가지고 있어야한다
    const seen = new Set();
    for (const key of painted.keys()) {
      if (seen.has(key)) continue;
      if (!targetKeys.has(shapeKey(blobAt(key, seen)))) return false;
    }
    return true;
  }

  /** 칠해야 할 모양과 일치하는 칠에만 유리 질감을 얹는다 */
  function markMatches() {
    for (const t of tiles) t.classList.remove('match');
    const seen = new Set();
    for (const key of painted.keys()) {
      if (seen.has(key)) continue;
      const blob = blobAt(key, seen);
      if (!targetKeys.has(shapeKey(blob))) continue;
      for (const [c, r] of blob) tileAt(c, r).classList.add('match');
    }
  }

  function evaluate() {
    markMatches();
    const ok = checkClear();
    showBanner(ok);
    if (ok && !cleared.has(STAGES[stageIdx].name)) {
      cleared.add(STAGES[stageIdx].name);
      localStorage.setItem(STORE, JSON.stringify([...cleared]));
      renderStages();
    }
  }

  /* ==================== 드래그 ==================== */

  let dragging = false, last = null, start = null;
  let startWasPainted = false, moved = false;

  board.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    const at = cellFromPoint(e.clientX, e.clientY);
    if (!at) return;

    // 색이 있는 칸에서 시작하면 그 색이 이어지고, 빈 칸이면 새 색을 배정한다
    const existing = painted.get(k(at.c, at.r));
    if (existing) {
      dragColor = existing;
    } else {
      dragColor = PALETTE[nextColor()];
    }

    last = start = at;
    startWasPainted = !!existing;
    moved = false;
    dragging = true;
    paint(at.c, at.r, dragColor);
    if (existing) startHold(existing);

    board.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  board.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const cur = cellFromPoint(e.clientX, e.clientY);
    if (!cur) return;
    if (cur.c === last.c && cur.r === last.r) return;
    cancelHold();          // 칸을 옮겼으면 홀드가 아니라 드래그다
    moved = true;
    paintLine(last, cur, dragColor);
    last = cur;
  });

  function endDrag(isRelease) {
    cancelHold();
    if (!dragging) { holdFired = false; return; }
    // 이동 없이 놓았고 이미 색이 있던 칸이었다면 클릭으로 보고 색을 지운다
    if (isRelease && !moved && !holdFired && startWasPainted && start) {
      erase(start.c, start.r);
    }
    holdFired = false;
    dragging = false;
    last = start = null;
    startWasPainted = false;
    evaluate();
  }
  board.addEventListener('pointerup',     () => endDrag(true));
  board.addEventListener('pointercancel', () => endDrag(false));
  window.addEventListener('blur',         () => endDrag(false));

  /* ==================== 시작 ==================== */

  document.getElementById('reset').addEventListener('click', () => loadStage(stageIdx));
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  buildGrid();
  loadStage(0);
})();
</script>
